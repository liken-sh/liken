# The fast checks that run before every commit, through pre-commit or
# prek. CI runs the tests and the coverage gate through the `make`
# targets that package.toml names.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests are multi-document streams.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py bundles a prebuilt shellcheck binary, so the hook
  # works on a machine without shellcheck installed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x makes shellcheck follow a `source` line, such as the one
        # in bluetoothd/latest.sh that reads toolchains/pin.sh.
        args: [-x]
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        # -diff prints what `go mod tidy` would change and writes
        # nothing, so a stale go.mod fails the commit.
        entry: bash -c 'go mod tidy -diff'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
