# The kustomize base for the Bluetooth operator.
#
# liken does not apply this base and does not name it. Take it through
# your own GitOps with patches of your own, or read it and write your
# own manifests.
#
# The base ships no DeviceClass. A DeviceClass is cluster-scoped
# policy, the cluster owner's to name and curate, the same convention
# a StorageClass follows. The install guide gives copyable YAML for
# the two classes this operator needs: bluetooth-adapter, which the
# claim template in operator.yaml names, and bluetooth-controller,
# which consumers claim. Create them before this base, because the
# operator's own pod cannot start without the adapter class.
#
# Everything here except the CustomResourceDefinitions is namespaced.
# The CRDs are cluster-scoped, and kustomize reads that from the
# OpenAPI schema it was compiled with, so the namespace below leaves
# them alone.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liken-system

resources:
  - crds.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: bluetooth-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/bluetooth-operator
    newTag: latest
  - name: ghcr.io/liken-sh/bluetoothd
    newTag: latest
  - name: ghcr.io/liken-sh/bluetooth-bondfetch
    newTag: latest
