# The kustomize base for the Bluetooth operator.
#
# liken itself never applies this base. Apply it from your own GitOps
# repository with your own patches, or read it and write your own
# manifests.
#
# The base includes the DeviceClass bluetooth-adapter, because the
# operator's pod claims its adapter through that class and cannot
# start without it. To rename the class, patch both the class and the
# ResourceClaimTemplate in operator.yaml. The classes that workloads
# claim through, such as bluetooth-input, are cluster policy, so the
# cluster owner creates them. The install guide has the YAML for
# bluetooth-input.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace comes from a transformer with unsetOnly, which sets
# liken-system only on objects that have no namespace. The top-level
# namespace field would overwrite every namespace, and Flux adds a
# Kustomization's components to this file, so the field would
# move the monitoring component's dashboard out of the monitoring
# namespace. kustomize knows from its compiled-in OpenAPI schema that
# CRDs are cluster-scoped, so the transformer skips them.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

# kustomize also sets a namespace on the DeviceClass, because
# resource.k8s.io/v1 is not in its compiled-in schema and it treats an
# unknown kind as namespaced. This does no harm. The API server
# ignores a namespace on a cluster-scoped object, and kubectl chooses
# the request path from API discovery, not from the object.
resources:
  - deviceclasses.yaml
  - crds.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: bluetooth-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/bluetooth-operator
    newTag: latest
  - name: ghcr.io/liken-sh/bluetoothd
    newTag: latest
  - name: ghcr.io/liken-sh/bluetooth-bondfetch
    newTag: latest
