# The kustomize base for the Bluetooth operator.
#
# liken does not apply this base and does not name it. Take it through
# your own GitOps with patches of your own, or read it and write your
# own manifests.
#
# Everything here except the DeviceClasses is namespaced.
# DeviceClasses are cluster-scoped, like the ResourceSlices they
# select over. kustomize reads which kinds are cluster-scoped from
# the OpenAPI schema it was compiled with, and resource.k8s.io/v1 is
# newer than the schema in kustomize 5.8.1, so the namespace below
# lands on the two DeviceClasses as well. The API server discards a
# namespace on a cluster-scoped object, so the classes apply
# correctly, and the field in the rendered output means nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liken-system

resources:
  - deviceclasses.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: bluetooth-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/bluetooth-operator
    newTag: latest
  - name: ghcr.io/liken-sh/bluetoothd
    newTag: latest
  - name: ghcr.io/liken-sh/bluetooth-bondfetch
    newTag: latest
