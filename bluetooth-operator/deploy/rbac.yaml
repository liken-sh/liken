# The pod has wide privileges on its machine, because a Bluetooth
# stack needs them, so its permissions in the cluster are kept narrow.
#
# The ServiceAccount is set for the whole pod, so bondfetch, an init
# container, reads the Secrets and its Adapter with the same identity
# as the operator container. bondfetch needs only reads, but a
# separate identity would need a second pod, and both containers work
# on the same adapter.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bluetooth-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bluetooth-operator
rules:
  # This node's ResourceSlice (slices.go). resourceNames cannot differ
  # per pod, so the grant covers every slice, and the program writes
  # only the slice whose name it builds from NODE_NAME. It reads that
  # slice by name, so it needs no list or watch.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, create, update, delete]
  # The DRA plugin (dra.go). The kubelet's prepare request has only the
  # claim's name, so the driver gets the claim to read its allocation.
  # Claims belong to workloads in any namespace, so the grant is
  # cluster-wide.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get]
  # This node, read for the UID of the slice's owner reference. The
  # Node owns the slice, so the garbage collector deletes the slice
  # when the Node is deleted.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # The pairing API (crd.go). The operator creates an Adapter for its
  # radio and a Peripheral for each bond, watches PairingRequests, and
  # deletes a finished request when its TTL has passed. bondfetch gets
  # the Adapter for its spec.privacy. patch is only for finalizers,
  # which the operator edits with a merge patch so that a person's
  # concurrent edits to the object are kept.
  #
  # Adapters and Peripherals are cluster-scoped, and a PairingRequest
  # can be in any namespace. So a person who can create requests in
  # their own namespace can pair a device without exec access to
  # liken-system.
  - apiGroups: [bluetooth.liken.sh]
    resources: [adapters, peripherals, pairingrequests]
    verbs: [get, list, watch, create, update, patch, delete]
  # A write to the status subresource cannot overwrite a spec that a
  # person edited at the same time.
  - apiGroups: [bluetooth.liken.sh]
    resources: [adapters/status, peripherals/status, pairingrequests/status]
    verbs: [get, update]
  # Events (events.go). An Event about a cluster-scoped object goes in
  # the default namespace, and an Event about a PairingRequest goes in
  # the request's namespace. kubernetes/events patches an Event to
  # count a repeat.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bluetooth-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bluetooth-operator
subjects:
  - kind: ServiceAccount
    name: bluetooth-operator
    namespace: liken-system
---
# The Secrets of the bonds and of the adapter's identity key, all in
# the operator's namespace (bondstore.go, identity.go). bondfetch lists
# the bond Secrets by their adapter label and gets the identity Secret
# by name. The operator creates and updates them, and watches the bond
# Secrets so that a pass compares the bonds on disk with its cached
# copies. A Role keeps the grant away from other workloads' Secrets.
#
# There is no delete. Each bond's Peripheral owns its Secret, and the
# Adapter owns the identity Secret, so the garbage collector deletes
# them. resourceNames cannot narrow the grant, because a bond Secret's
# name comes from a device address that is unknown until the device
# pairs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bluetooth-operator
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update]
  # bluetoothd reads its privacy setting only at start, so the operator
  # deletes its own pod, named in POD_NAME, when the Adapter's
  # spec.privacy differs from the value bluetoothd started with
  # (privacy.go). The DaemonSet gives each pod a new name, so
  # resourceNames cannot narrow the grant.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bluetooth-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bluetooth-operator
subjects:
  - kind: ServiceAccount
    name: bluetooth-operator
    namespace: liken-system
