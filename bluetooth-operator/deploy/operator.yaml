# The bluetooth-operator pod runs the operator, bluetoothd, and the
# `btmon` and `rescan` sidecars. It starts only on a node with a
# Bluetooth adapter, and an init container restores the bonds before
# bluetoothd starts.
---
# Each pod of the DaemonSet gets its own claim from this template, so
# each pod allocates the adapter of its own node. One `ResourceClaim`
# shared by every pod would allocate one adapter on one node. On a node
# with no adapter, the claim cannot be allocated and the pod stays
# Pending, so the DaemonSet needs no list of the nodes that have one.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: bluetooth-adapter
spec:
  spec:
    devices:
      requests:
        - name: adapter
          exactly:
            deviceClassName: bluetooth-adapter
---
# Each pod uses one adapter, even on a node that has more, because the
# claim requests one device and the bond `Secret`s and discovery cover
# only that adapter.
#
# The pod keeps no state of its own, so this is not a StatefulSet. Each
# bond is in a `Secret` labelled with the adapter, because a link key
# belongs to the adapter's address and not to a pod.
#
# An adapter can be allocated to only one claim at a time. A new pod
# that started before the old one stopped would stay Pending until the
# old pod released the adapter, and the update would never finish. So
# `maxSurge: 0` stops the old pod on a node before the new one starts,
# and `maxUnavailable: 1` updates one node at a time.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bluetooth-operator
  labels:
    # The `liken` command finds this DaemonSet by this label, reads the
    # version of its image, and pulls the `-cli` image of the same
    # version.
    cli.liken.sh/plugin: bluetooth
spec:
  selector:
    matchLabels:
      app: bluetooth-operator
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: bluetooth-operator
    spec:
      serviceAccountName: bluetooth-operator
      # A pod that claims a controller cannot start until this operator
      # publishes the controller. So the operator can preempt an ordinary
      # pod on a full node, and it is evicted last. The toleration lets
      # it run on a node with any taint, because `liken` taints a node
      # while the node starts, and the devices must be published before
      # a pod can claim them.
      priorityClassName: system-node-critical
      # A node labeled `bluetooth.liken.sh/bluetooth: none` gets no pod.
      # Put the label on a node with no adapter, where the pod would
      # otherwise stay Pending forever. `NotIn` also matches a node with
      # no such label, so by default every node gets a pod. A patch that
      # sets its own node affinity replaces this list of terms, because
      # the list is atomic.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: bluetooth.liken.sh/bluetooth
                    operator: NotIn
                    values: ["none"]
      tolerations:
        - operator: Exists
      # The kernel supports `AF_BLUETOOTH` sockets only in the host's
      # network namespace. In a pod's own network namespace, `socket()`
      # fails with `EAFNOSUPPORT`, and no device node or mount works
      # around that.
      hostNetwork: true
      # The kernel sends uevents only to the initial user namespace. A
      # pod in its own user namespace receives no uevents and no error,
      # so no controller ever appears. `true` is the default, and it is
      # set here because the failure is silent.
      hostUsers: true
      # `bondfetch` is listed first, so it runs to completion before any
      # sidecar starts. BlueZ reads the bond directory only when it
      # registers the adapter, so the bonds must be in place before
      # bluetoothd starts.
      initContainers:
        # `bondfetch` reads the address of the adapter that this pod
        # claimed, writes BlueZ's directory tree from the `Secret`s
        # labelled with that address, and exits. It also writes the
        # radio's identity key from its own `Secret`, and writes the
        # `Adapter`'s `spec.privacy` and `spec.btmon` into the settings
        # volume. bluetoothd reads the identity key and the privacy
        # setting only when it starts, and a trace must start before
        # bluetoothd does.
        - name: bondfetch
          image: ghcr.io/liken-sh/bluetooth-bondfetch:latest
          env:
            # The operator writes the bond `Secret`s in its own namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            # Reading the adapter's address needs no capability, only
            # the pod's `hostNetwork`. The container runs as root
            # because BlueZ's tree is owned by root with mode 0700, and
            # bluetoothd runs as root without `CAP_DAC_OVERRIDE`, so it
            # cannot read a file that another user owns.
            capabilities:
              drop: ["ALL"]
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
            # The same claim as the bluetoothd container. The kubelet
            # prepares a pod's claims before any of its containers
            # start, init containers included.
            claims:
              - name: adapter
          volumeMounts:
            - name: bonds
              mountPath: /var/lib/bluetooth
            - name: settings
              mountPath: /var/run/bluetooth.liken.sh/settings
        # `btmon` traces the HCI link, below D-Bus and bluetoothd, and
        # writes each packet to the container log while the `Adapter`'s
        # `spec.btmon` is true. A bonded controller can stop responding
        # for hours before a person notices and restarts this pod, and
        # the restart ends every process that saw the fault. The trace
        # in the log records what the link did before the restart.
        #
        # The trace is off by default, because btmon prints the link
        # keys, the long term keys, and the radio's identity key in
        # plain text to anyone who can read this pod's logs.
        # `start-btmon` watches the `btmon` file in the settings volume
        # and starts or stops btmon when the file changes, with no pod
        # restart.
        #
        # btmon reports only what happens after it binds the monitor
        # channel, so this container starts before bluetoothd. When
        # bluetoothd registers the adapter, it tells the kernel which
        # bonded devices may reconnect, and the trace records those
        # commands. The trace is nearly empty while no controller is
        # connected.
        #
        # The container needs no claim, because the monitor channel
        # reports every adapter on the machine.
        - name: btmon
          image: ghcr.io/liken-sh/bluetoothd:latest
          restartPolicy: Always
          # `bluetoothd/btmon/child.go` explains the arguments that
          # `start-btmon` gives btmon.
          command:
            - /start-btmon
          # The C library writes each line as soon as btmon finishes it
          # when the output is a terminal. To a pipe, it writes only when
          # its buffer is full, so a line can wait for hours.
          tty: true
          securityContext:
            # The kernel's `hci_sock_bind` checks `CAP_NET_RAW` before
            # it binds `HCI_CHANNEL_MONITOR`. Without it, btmon prints
            # "Failed to bind channel: Operation not permitted". The
            # kubelet sets no ambient capabilities, so only a process
            # that runs as root gets an added capability. That is why
            # the container runs as root. It writes nothing.
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: settings
              mountPath: /var/run/bluetooth.liken.sh/settings
              readOnly: true
        # `rescan` works around kernel bugs that turn off the radio's
        # passive scan with no log line, so a bonded Low Energy remote
        # never reconnects. The kernel can do this after a failed
        # connection to the remote, or after the host ended a link that
        # the controller closed late. `start-rescan` reads the HCI
        # monitor channel. When the scan stays off after either event
        # for a device that bluetoothd added for auto connect, it adds
        # the device again, which turns the scan on.
        # `bluetoothd/rescan/main.go` explains the bugs, the fix, and
        # when to delete this container.
        #
        # This container starts before bluetoothd, like `btmon`, because
        # it reads the devices to watch from the Add Device commands
        # that bluetoothd sends when it registers the adapter.
        - name: rescan
          image: ghcr.io/liken-sh/bluetoothd:latest
          restartPolicy: Always
          command:
            - /start-rescan
          securityContext:
            # `NET_RAW` binds the monitor channel, as in `btmon`.
            # `NET_ADMIN` sends Add Device on the management channel. The
            # container runs as root because the kubelet sets no ambient
            # capabilities. It writes nothing.
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW", "NET_ADMIN"]
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: true
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
        # `bluetoothd` runs dbus-daemon and bluetoothd. As a sidecar, it
        # starts before the operator container and stops after it. The
        # operator connects to this container's bus, and when the pod is
        # deleted, the operator exits first, so it does not report that
        # bluetoothd left the bus.
        - name: bluetoothd
          image: ghcr.io/liken-sh/bluetoothd:latest
          restartPolicy: Always
          env:
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: unix:path=/var/run/bluetooth.liken.sh/dbus/system_bus_socket
          securityContext:
            # `NET_ADMIN`: the privileged commands of the Bluetooth
            # management channel check `CAP_NET_ADMIN`. bluetoothd needs
            # no `NET_RAW`, because it uses the management channel and
            # seqpacket L2CAP sockets, never a raw HCI socket.
            # `NET_BIND_SERVICE`: the SDP and GATT servers bind L2CAP
            # PSMs 1 and 31, which are below the kernel's privileged
            # limit of 0x1001. `SETUID` and `SETGID`: dbus-daemon changes
            # to its `dbus` user when it starts.
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "NET_BIND_SERVICE", "SETUID", "SETGID"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
            # The adapter that `liken` publishes. The scheduler places
            # the pod on the node of the allocated adapter.
            claims:
              - name: adapter
          volumeMounts:
            - name: bus
              mountPath: /var/run/bluetooth.liken.sh/dbus
            - name: bonds
              mountPath: /var/lib/bluetooth
            # `start-bluetoothd` writes `main.conf` from the `privacy`
            # file that `bondfetch` wrote here.
            - name: settings
              mountPath: /var/run/bluetooth.liken.sh/settings
              readOnly: true
      containers:
        - name: operator
          image: ghcr.io/liken-sh/bluetooth-operator:latest
          env:
            # The operator's `ResourceSlice` names this node.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The namespace of the bond `Secret`s.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # When the `Adapter`'s `spec.privacy` differs from the value
            # that bluetoothd started with, the operator deletes this
            # pod by name, after a pass that stored every bond, because
            # bluetoothd reads the setting only at start.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DBUS_SYSTEM_BUS_ADDRESS
              value: unix:path=/var/run/bluetooth.liken.sh/dbus/system_bus_socket
            # The pod is on the host network, where the machine operator
            # listens on its default metrics port 9200, so this operator
            # listens on 9250. The host network exposes the port on the
            # node, so the container needs no `hostPort`.
            - name: BLUETOOTH_METRICS_ADDRESS
              value: ":9250"
          ports:
            - name: metrics
              containerPort: 9250
          securityContext:
            # The operator needs no capability. It reads bluetoothd over
            # D-Bus, reads sysfs, writes CDI files, relays input events
            # through `/dev/uinput`, and serves a socket to the kubelet.
            # The kernel creates the uevent netlink socket with
            # `NL_CFG_F_NONROOT_RECV`, so binding group 1 needs only the
            # initial user namespace that `hostUsers` gives.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
            # The same claim as the bluetoothd container. It also gives
            # this container `/dev/uinput`, where the input relay creates
            # one virtual device for each evdev node of a controller, and
            # `/dev/input/event0` through `event31`, so a virtual device
            # has a node in this container as soon as the kernel
            # registers it.
            claims:
              - name: adapter
          volumeMounts:
            # The kubelet finds DRA plugins through the registry
            # directory and calls prepare over a socket in the plugin
            # directory. The driver creates both sockets, so both mounts
            # are writable.
            - name: kubelet-plugin
              mountPath: /var/lib/kubelet/plugins/bluetooth.liken.sh
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            # The container runtime reads the CDI spec files here and
            # applies them to each container with a prepared claim.
            # `liken` writes its `liken.sh-<claimUID>.json` files in the
            # same directory, and this driver reads and deletes only its
            # own `bluetooth.liken.sh-<claimUID>.json` files.
            - name: cdi
              mountPath: /var/run/cdi
            - name: bus
              mountPath: /var/run/bluetooth.liken.sh/dbus
            # The operator reads the bonds that bluetoothd writes here
            # and copies each new pairing to its `Secret`, the reverse
            # of what `bondfetch` does at start.
            - name: bonds
              mountPath: /var/lib/bluetooth
            # The operator compares the `privacy` file with the
            # `Adapter`'s `spec.privacy` and reports the result in
            # status. The mount is writable because the operator writes
            # the `btmon` file when `spec.btmon` changes.
            - name: settings
              mountPath: /var/run/bluetooth.liken.sh/settings
      resourceClaims:
        - name: adapter
          resourceClaimTemplateName: bluetooth-adapter
      volumes:
        # Each `hostPath` is `DirectoryOrCreate`, because a node that has
        # never run a DRA driver has none of these directories.
        - name: kubelet-plugin
          hostPath:
            path: /var/lib/kubelet/plugins/bluetooth.liken.sh
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        # The D-Bus socket of bluetoothd. A claim on the media bus
        # mounts the same directory into the consumer's container
        # through CDI. dbus-daemon deletes and creates the socket each
        # time it starts, so containers mount the directory. A mount of
        # the socket file would keep the deleted inode.
        #
        # This is a `hostPath` because the CDI spec of a prepared claim
        # names the host path, and a prepared claim must stay correct
        # until the node reboots. The host path of an `emptyDir` is
        # under `/var/lib/kubelet/pods/<uid>`, which changes with each
        # new pod.
        - name: bus
          hostPath:
            path: /var/run/bluetooth.liken.sh/dbus
            type: DirectoryOrCreate
        # The link keys and the device cache. `bondfetch` writes them
        # from the adapter's bond `Secret`s before bluetoothd starts,
        # and the operator writes changes back to the `Secret`s. The
        # `Secret`s are labelled with the adapter's address, which is
        # the identity BlueZ stores a link key under, so the bonds
        # follow the radio to any machine it moves to. Without them, a
        # person would pair every controller again after each pod
        # restart.
        - name: bonds
          emptyDir: {}
        # `bondfetch` writes the `privacy` and `btmon` files here from
        # the `Adapter`. `start-bluetoothd` and the operator read
        # `privacy`. `start-btmon` reads `btmon`, and the operator
        # writes it again when `spec.btmon` changes. An `emptyDir` makes
        # each new pod start from the `Adapter`'s spec, not from the
        # last pod's files.
        - name: settings
          emptyDir: {}
