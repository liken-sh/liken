# The base applies on a cluster without monitoring. A cluster that
# runs the prometheus-operator adds this component to the base to
# scrape the operator's metrics. It is a Component, not a second base,
# because it adds resources to the namespace and labels that the base
# sets.
#
# The component sets no top-level namespace, because that would apply
# to every resource it lists. The dashboard ConfigMap must be in the
# monitoring namespace that the kube-prometheus-stack sidecar watches,
# and the PodMonitor must be in liken-system with the operator's pod.
# So each resource sets its own namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The dashboard is a ConfigMap with the label `grafana_dashboard: "1"`.
# The kube-prometheus-stack runs a sidecar next to Grafana that loads
# every ConfigMap with that label, so installing the dashboard needs no
# Grafana API call and no provisioning file.
#
# The generated name has no content hash. With a hash, each dashboard
# edit creates a new ConfigMap, an apply that does not prune keeps the
# old one, and Grafana loads both dashboards.
configMapGenerator:
  - name: bluetooth-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/bluetooth-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
