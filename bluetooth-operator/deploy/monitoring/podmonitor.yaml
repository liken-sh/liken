# Scrapes the operator's pod on its container port named metrics, so
# a change to the port number in operator.yaml needs no change here.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: bluetooth-operator
  # The namespace of the operator's pod. kustomization.yaml explains why
  # the component does not set it.
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: bluetooth-operator
  podMetricsEndpoints:
    - port: metrics
      # A DaemonSet pod on the host network reports on its machine, so
      # the dashboard selects by node. The node label stays the same
      # when the pod is replaced, and the pod name does not.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
