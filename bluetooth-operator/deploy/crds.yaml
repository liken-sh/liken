# The pairing API: the resources that let a person pair, inspect, and
# unpair Bluetooth devices with kubectl.
#
# An Adapter lasts as long as its radio, and a Peripheral as long as its
# bond. A PairingRequest is one pairing attempt. In each kind, a person
# sets the spec, and the operator writes the status.
#
# The operator creates Adapters and Peripherals, and acts on all three
# kinds. A person creates a PairingRequest, edits a Peripheral's spec to
# rename a device or change whether it is trusted, and deletes a
# Peripheral to unpair it.
---
# One Bluetooth radio. The operator creates the object for the adapter
# that its pod claimed. The object's name is the adapter's address in
# lowercase, with dashes in place of the colons, because a Kubernetes
# name cannot hold colons or uppercase letters.
#
# It is cluster-scoped because a radio belongs to a machine and not to a
# namespace. The ResourceSlice that publishes the controllers is
# cluster-scoped for the same reason.
#
# An Adapter owns its Peripherals, and each Peripheral owns the Secret
# that stores its bond. So when a radio is gone for good, deleting its
# Adapter deletes every bond that belongs to it. The Adapter is named
# for the radio and not for a machine, and status.node records the
# machine the radio is on now. So an adapter that you move to another
# machine keeps its Adapter, its Peripherals, and their Secrets.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: adapters.bluetooth.liken.sh
spec:
  group: bluetooth.liken.sh
  scope: Cluster
  names:
    kind: Adapter
    listKind: AdapterList
    plural: adapters
    singular: adapter
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Alias
          type: string
          description: The name the radio broadcasts.
          jsonPath: .spec.alias
        - name: Address
          type: string
          description: The adapter's Bluetooth address, in uppercase with colons.
          jsonPath: .status.address
        - name: Node
          type: string
          description: The node whose operator runs this radio now.
          jsonPath: .status.node
        - name: Powered
          type: boolean
          description: Whether the radio is powered on.
          jsonPath: .status.powered
        - name: Privacy
          type: string
          description: The Low Energy privacy value that bluetoothd started with.
          jsonPath: .status.privacy
        - name: Btmon
          type: boolean
          description: Whether the btmon container traces this radio.
          jsonPath: .status.btmon
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One Bluetooth radio. The object is named for the adapter's
            address, so an adapter that you move to another machine
            keeps its `Peripherals` and their stored bonds.
          properties:
            spec:
              type: object
              description: The settings that the operator applies to the radio.
              properties:
                alias:
                  type: string
                  maxLength: 248
                  description: >-
                    The name that the radio broadcasts, which the operator
                    writes to BlueZ's `Adapter1.Alias`. A device that
                    scans for adapters while a pairing window is open
                    sees this name. When the field is empty, the radio
                    keeps the name that bluetoothd chose.
                privacy:
                  type: string
                  # Quoted, because YAML 1.1 reads a bare off as false.
                  enum: ["off", "network", "device", "limited-network", "limited-device"]
                  description: >-
                    Low Energy privacy for this radio, which the operator
                    writes to the `Privacy` key of bluetoothd's
                    configuration. With privacy on, the radio advertises
                    and connects from a private address that changes
                    periodically, and only a device that is paired
                    with the radio can resolve that address. A classic
                    Bluetooth link always uses the radio's public
                    address. The value `off` uses the fixed address, and
                    an empty field means `off`. The value `network`
                    accepts advertising only from a peer that uses a
                    private address, and some older devices do not.
                    The value `device` also accepts advertising from a
                    peer's identity address. The values
                    `limited-network` and `limited-device` advertise in
                    Limited Discoverable Mode, which shows the identity
                    address while the radio is discoverable, and they
                    scan as `network` and `device` do. bluetoothd reads
                    the value only when it starts, so the operator
                    deletes its own pod to apply a change.
                btmon:
                  type: boolean
                  description: >-
                    Whether the btmon container writes a trace of this
                    radio's HCI link and management channel to its log.
                    The trace prints key material in plain text, such as
                    link keys, long term keys, and the radio's identity
                    key, so anyone who can read the operator pod's logs
                    can read those keys. Turn it on while you diagnose
                    a fault, and turn it off afterward. An empty field
                    means `false`. A change starts or stops the trace
                    within seconds, and the pod does not restart.
            status:
              type: object
              description: What the operator observes about the radio.
              properties:
                address:
                  type: string
                  description: >-
                    The adapter's Bluetooth address, in uppercase with
                    colons.
                node:
                  type: string
                  description: >-
                    The node whose operator runs this radio. The value
                    changes when you move the adapter to another node.
                powered:
                  type: boolean
                  description: Whether the radio is powered on.
                privacy:
                  type: string
                  description: >-
                    The privacy value that the running bluetoothd
                    started with. This is the value that bluetoothd was
                    configured with, which can differ from the setting
                    that the kernel accepted. To read the kernel's
                    setting, run `btmgmt info` in the bluetoothd
                    container.
                btmon:
                  type: boolean
                  description: >-
                    The trace setting that the btmon container reads. The
                    operator writes it from `spec.btmon`, and the
                    container runs the trace while it is `true`.
                deletionRefused:
                  type: string
                  description: >-
                    Why the operator keeps its finalizer on this deleting
                    Adapter. Deleting an Adapter also deletes every
                    `Peripheral` under it, which unpairs each device, so
                    the operator does not let the deletion finish while
                    the radio is plugged in. Kubernetes cannot cancel a
                    deletion, so the Adapter stays until you unplug the
                    radio. Then the operator removes the finalizer. The
                    field is empty until the operator refuses a
                    deletion.
---
# One bonded device: a device that shares a link key with an adapter.
# The status reports what the radio observes about the device. The
# operator creates the object when a pairing succeeds, and when it
# finds a bond that bluetoothd already has.
#
# Deleting a Peripheral unpairs the device. A finalizer makes the
# operator run these steps in order: it disconnects the device, waits
# until no `ResourceClaim` holds the controller, removes the device from
# the ResourceSlice, and removes the bond from bluetoothd. Kubernetes
# deletes the bond's Secret with the Peripheral, because the Peripheral
# owns it.
#
# Only a person deletes a Peripheral. When a bond disappears from
# bluetoothd, the operator keeps the Peripheral and sets
# status.bond.held to false, because deleting a Peripheral unpairs the
# device and that decision belongs to a person.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: peripherals.bluetooth.liken.sh
spec:
  group: bluetooth.liken.sh
  scope: Cluster
  names:
    kind: Peripheral
    listKind: PeripheralList
    plural: peripherals
    singular: peripheral
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Alias
          type: string
          description: The name that you set in `spec.alias`.
          jsonPath: .spec.alias
        - name: Device
          type: string
          description: The name that the device reports.
          jsonPath: .status.name
        - name: Address
          type: string
          description: The device's Bluetooth address, in uppercase with colons.
          jsonPath: .status.address
        - name: Battery
          type: integer
          description: The battery charge that the device reports, when it reports one.
          jsonPath: .status.battery.percentage
        - name: Paired
          type: boolean
          description: Whether BlueZ reports the device as paired.
          jsonPath: .status.bond.paired
        - name: Connected
          type: string
          description: Whether BlueZ reports the device as connected.
          jsonPath: '.status.conditions[?(@.type=="Connected")].status'
        - name: Reason
          type: string
          description: The reason of the Connected condition, which explains why the link is up or down.
          jsonPath: '.status.conditions[?(@.type=="Connected")].reason'
        - name: Since
          type: date
          description: When the Connected condition last changed status, which is when the link came up or ended.
          jsonPath: '.status.conditions[?(@.type=="Connected")].lastTransitionTime'
        - name: Node
          type: string
          description: The node whose operator has this bond.
          jsonPath: .status.node
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One bonded Bluetooth device. The object is named for the
            device's address in the same form that the ResourceSlice
            uses, and it owns the `Secret` that stores the bond's keys.
          properties:
            spec:
              type: object
              description: The settings that the operator applies to the device.
              properties:
                alias:
                  type: string
                  maxLength: 248
                  description: >-
                    The name for this device, which the operator writes
                    to BlueZ's `Device1.Alias`. bluetoothd stores the
                    alias in the bond's own file, so the name is stored
                    with the keys. When the field is empty, the device
                    keeps the name that it reports.
                trusted:
                  type: boolean
                  default: true
                  description: >-
                    Whether the device may connect without an agent's
                    approval. The operator writes it to BlueZ's
                    `Device1.Trusted`. When it is `false`, BlueZ asks an
                    agent to authorize each service on every connection.
                    No agent is registered outside a pairing window, so
                    the device does not connect. A trusted controller
                    connects when you press one of its buttons. For a
                    trusted audio device, such as a speaker, the
                    operator calls `Device1.Connect` while the device is
                    not connected, and waits longer after each failed
                    attempt, from 10 seconds up to 2 minutes. So the
                    device connects soon after it is switched on and in
                    range.
            status:
              type: object
              description: What the operator observes about the device.
              properties:
                address:
                  type: string
                  description: >-
                    The device's Bluetooth address, in uppercase with
                    colons.
                name:
                  type: string
                  description: >-
                    The name that the device reports. It is separate from
                    `spec.alias`, so the name that the hardware reports
                    stays visible after you rename the device.
                icon:
                  type: string
                  description: >-
                    The freedesktop icon name that BlueZ gives this
                    device, such as `input-gaming` or `audio-headset`.
                    It is empty when BlueZ reports no icon.
                adapter:
                  type: string
                  description: The address of the adapter that is paired with this device.
                node:
                  type: string
                  description: >-
                    The node whose operator has this bond. The value
                    changes when you move the adapter to another node.
                bond:
                  type: object
                  description: What the operator observes about the bond.
                  properties:
                    held:
                      type: boolean
                      description: >-
                        Whether bluetoothd still has this bond. It is
                        `false` when bluetoothd no longer has the keys.
                        When it changes to `false`, the operator posts a
                        `BondLost` warning `Event` and keeps the
                        Peripheral, because only a person deletes one.
                    paired:
                      type: boolean
                      description: >-
                        Whether BlueZ reports this device as paired,
                        from `Device1.Paired`. The operator reads `held`
                        from the same property. `paired` is listed with
                        `bonded`, `trusted`, and `connected`, the BlueZ
                        properties that you compare when a device does
                        not pair or reconnect.
                    bonded:
                      type: boolean
                      description: >-
                        Whether BlueZ reports a stored link key for this
                        device, from `Device1.Bonded`. A device can be
                        paired without a stored key.
                    trusted:
                      type: boolean
                      description: >-
                        Whether BlueZ reports this device as trusted,
                        from `Device1.Trusted`. The operator writes
                        `spec.trusted` to this property.
                    connected:
                      type: boolean
                      description: >-
                        Whether BlueZ reports this device as connected,
                        from `Device1.Connected`.
                    secret:
                      type: string
                      description: >-
                        The namespace and name of the `Secret` that stores
                        this bond's keys. This object owns the `Secret`,
                        so deleting the Peripheral deletes it.
                    pairedAt:
                      type: string
                      format: date-time
                      description: >-
                        When the operator first recorded this bond. For a
                        bond that the operator created, this is the time
                        of the pairing. For a bond that bluetoothd
                        already had, it is the time that the operator
                        found it.
                    request:
                      type: string
                      description: >-
                        The namespace and name of the `PairingRequest`
                        that created this bond. It is empty for a bond
                        that bluetoothd already had. The operator deletes
                        a finished request after its
                        `ttlSecondsAfterFinished`, and this field stays
                        after that.
                battery:
                  type: object
                  description: >-
                    The battery charge that the device reports. The
                    operator reads the kernel's power supply class
                    first, and reads BlueZ's `org.bluez.Battery1`
                    interface for a device that has no kernel power
                    supply. The block is absent when neither reports a
                    level, which is the case for a device with no
                    battery and for a device that is not connected.
                  properties:
                    percentage:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: The charge left, from 0 to 100 percent.
                    source:
                      type: string
                      description: >-
                        Where the level was read. For a reading from the
                        kernel, this is the name of the power supply,
                        such as `ps-controller-battery-7c:66:ef:22:e7:80`.
                        For a reading from BlueZ, it is the source that
                        BlueZ reports, such as `HID` or a GATT service.
                    charging:
                      type: boolean
                      description: >-
                        Whether the device is charging. It is absent when
                        BlueZ is the source, because BlueZ reports a
                        level and not a charging state. It is also absent
                        when the kernel reports the status `Unknown`.
                conditions:
                  type: array
                  maxItems: 8
                  description: >-
                    The `Connected` condition is `True` while the device
                    has a link with the radio, with the reason `LinkUp`.
                    When it is `False`, the reason comes from the reason
                    that BlueZ gave when the link ended. `Asleep`: the
                    link timed out on a device that disconnects when
                    idle, such as a T6 remote. When the device connects
                    again, the operator writes one `KEY_UNKNOWN` press
                    into its virtual input device, so the press that
                    woke it is not lost. `LinkLost`: the link timed out
                    on a device that stays connected while it is on, so
                    it went out of range or its battery ran out.
                    `ClosedByDevice`: the device ended the link, for
                    example because it was switched off.
                    `ClosedByRadio`: the operator ended the link, to
                    unpair the device or to reconnect a controller
                    whose input device did not appear.
                    `AuthenticationFailed`: the keys did not match, so
                    you must delete the `Peripheral` and pair the
                    device again. `NotConnected`: the operator has no
                    reason, because the link ended while the operator
                    was not running or BlueZ gave none. `NotBonded`:
                    bluetoothd has no object for the device, because
                    another tool removed the bond.
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        description: The condition type, which is `Connected`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: Whether the reported state is true, false, or unknown.
                      reason:
                        type: string
                        maxLength: 1024
                        description: >-
                          The reason for the condition's status, in
                          CamelCase, such as `LinkUp`.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          One sentence that explains the reason and, when
                          you can act on it, tells you what to do. The `Event`
                          that the operator posts for each transition has
                          the same sentence.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When the status last changed. It does not change
                          when the operator rewrites the object, or when
                          the reason changes and the status stays the
                          same.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
---
# One pairing attempt, with the scan for devices that goes with it. You
# create a PairingRequest, read the devices that the radio found in
# status.seen, and approve one by writing its address to spec.device.
#
# A PairingRequest is namespaced so that RBAC can allow a person to
# create PairingRequests in one namespace without allowing exec into the
# operator's pod. A custom resource has only the status and scale
# subresources, so approval is not a separate permission: anyone who can
# update a PairingRequest can approve a device.
#
# An empty spec.device never pairs a device. If the operator paired the
# first device that responded, it could bond a stranger's device.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pairingrequests.bluetooth.liken.sh
spec:
  group: bluetooth.liken.sh
  scope: Namespaced
  names:
    kind: PairingRequest
    listKind: PairingRequestList
    plural: pairingrequests
    singular: pairingrequest
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          description: Open while the pairing window runs, then Paired or Expired.
          jsonPath: .status.phase
        - name: Device
          type: string
          description: The address that you approved in `spec.device`.
          jsonPath: .spec.device
        - name: Peripheral
          type: string
          description: The Peripheral that the pairing created.
          jsonPath: .status.peripheral
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One pairing window on one adapter. The operator starts a
            scan for devices when the window opens and stops it when the
            window closes, and `status.seen` lists the unpaired devices
            that BlueZ reports while the window is open.
          required: [spec]
          properties:
            spec:
              type: object
              description: The pairing that you ask the operator to do.
              required: [adapter]
              properties:
                adapter:
                  type: string
                  maxLength: 17
                  pattern: '^([0-9a-f]{2}-){5}[0-9a-f]{2}$'
                  description: >-
                    The name of the `Adapter` to open the window on. The
                    name is the radio's address in lowercase with
                    dashes. Only the operator that runs that radio acts
                    on the request.
                windowSeconds:
                  type: integer
                  default: 180
                  minimum: 15
                  maximum: 900
                  description: >-
                    How long the radio stays discoverable, pairable, and
                    scanning, in seconds. The operator gives bluetoothd
                    the same deadline, so the window closes by itself if
                    the operator stops.
                device:
                  type: string
                  maxLength: 17
                  pattern: '^$|^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$'
                  description: >-
                    The address of the device to pair with. Writing an
                    address here approves that device. While the field
                    is empty, the operator only scans and lists the
                    devices it finds in `status.seen`. Write an address
                    from `status.seen` here to pair that device. An
                    empty field never pairs a device.
                ttlSecondsAfterFinished:
                  type: integer
                  default: 86400
                  minimum: 0
                  description: >-
                    How long the request stays after its phase becomes
                    `Paired` or `Expired`, in seconds. After that time
                    the operator deletes it.
            status:
              type: object
              description: What the operator observes during the pairing window.
              properties:
                phase:
                  type: string
                  enum: [Open, Paired, Expired]
                  description: >-
                    `Open` while the pairing window runs. `Paired` when
                    the approved device bonded. `Expired` when the
                    window closed without an approved device. The
                    operator does not retry from either end state.
                windowClosesAt:
                  type: string
                  format: date-time
                  description: When the pairing window closes if no device is approved.
                seen:
                  type: array
                  maxItems: 16
                  description: >-
                    The devices that the radio found during this window
                    and that have no bond in the cluster. The list has
                    at most 16 entries, so that a place with many
                    Bluetooth devices does not make the object grow
                    without limit.
                  items:
                    type: object
                    required: [address]
                    properties:
                      address:
                        type: string
                        maxLength: 17
                        description: >-
                          The device's address. Write it to `spec.device`
                          to approve the pairing.
                      name:
                        type: string
                        maxLength: 64
                        description: >-
                          The name that the device broadcasts, cut to 64
                          bytes, which is the longest value that a
                          `ResourceSlice` attribute accepts.
                      firstSeen:
                        type: string
                        format: date-time
                        description: When the radio first found this device.
                seenTruncated:
                  type: boolean
                  description: >-
                    Whether `status.seen` left out a device because of
                    its limit of 16 entries.
                peripheral:
                  type: string
                  description: The name of the `Peripheral` that this request created.
                finishedAt:
                  type: string
                  format: date-time
                  description: >-
                    When the phase became `Paired` or `Expired`. The
                    time in `spec.ttlSecondsAfterFinished` counts from
                    this moment.
                message:
                  type: string
                  description: >-
                    Why the request has not paired the approved device,
                    such as a pairing that bluetoothd refused. It is
                    empty when there is nothing to report.
