# The class that the operator's own pod claims its adapter through.
# kustomization.yaml explains why the base includes it.
---
# Selects the devices that liken publishes for the btusb kernel
# driver, which covers USB dongles and the radios built into a board.
# Only a machine with a radio publishes such a device, so the claim
# schedules the operator's pod onto those machines with no node
# selector. A device is allocated to one claim at a time, so the pod
# that holds the claim runs the only Bluetooth stack on that radio.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: bluetooth-adapter
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].driver) &&
          device.attributes["liken.sh"].driver == "btusb"
