# The operator that claims a machine's Bluetooth adapters and pairs devices.
[package]
name = "bluetooth-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "toolchains", "trust", "userland"]

[docs]
prefix = "bluetooth"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# Every image that builds from this module's go.mod takes the shared
# kubernetes module as a build context, because go.mod replaces it with
# ../kubernetes.
[[outputs.images]]
name = "bluetooth-operator"
description = "bluetooth-operator, which pairs Bluetooth controllers and remotes and gives each one to one pod."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "bluetooth-bondfetch"
description = "The init container that restores a Bluetooth adapter's bonds from its Secret before bluetoothd starts."
file = "bondfetch/Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "bluetoothd"
description = "BlueZ's bluetoothd, dbus-daemon, and btmon as static programs, with the entrypoints that bluetooth-operator's pod runs."
file = "bluetoothd/Dockerfile"
# userland is the BR2_EXTERNAL tree whose buildroot build makes the
# image's static daemons, and manifest is toolchains/manifest, for
# image-sbom, which writes the image's SBOM record of the packages
# that buildroot built.
contexts = { kubernetes = "kubernetes", notices = "notices", userland = "liken/userland", manifest = "toolchains/manifest" }
# A build whose layer cache misses compiles buildroot's cross-compiler,
# glib, dbus, and BlueZ from source, which takes longer than the
# default limit of the images and publish jobs.
timeout = 120
# The same build reads its compiler cache from a cache mount, and CI
# saves the mount between runners, so a build after a buildroot bump
# compiles only what the bump changed.
cache-mount = true

# The CLI image carries the same version as the operator, so the base
# binary pulls a CLI that never drifts from the operator it faces. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "bluetooth-operator-cli"
description = "kubectl-liken-bluetooth, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
