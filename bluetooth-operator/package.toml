# The operator that claims a machine's Bluetooth adapters and pairs devices.
[package]
name = "bluetooth-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "toolchains", "trust", "userland"]

[docs]
prefix = "bluetooth"

# Runs gofmt, go vet, and a tidy check of go.mod, then the tests with
# the race detector and the coverage profile, then the coverage gate
# that .testcoverage.yml sets.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# Runs the hooks in .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job already runs these three checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# Every image built from this module's go.mod needs the kubernetes
# module as a build context, because go.mod replaces it with
# ../kubernetes.
[[outputs.images]]
name = "bluetooth-operator"
description = "bluetooth-operator, which pairs Bluetooth controllers and remotes and gives each one to one pod."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "bluetooth-bondfetch"
description = "The init container that restores a Bluetooth adapter's bonds from its Secret before bluetoothd starts."
file = "bondfetch/Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "bluetoothd"
description = "BlueZ's bluetoothd, dbus-daemon, and btmon as static programs, with the entrypoints that bluetooth-operator's pod runs."
file = "bluetoothd/Dockerfile"
# userland is the BR2_EXTERNAL tree that buildroot builds the image's
# static daemons from. manifest is toolchains/manifest, which provides
# image-sbom, the tool that records the packages buildroot built in
# the image's SBOM.
contexts = { kubernetes = "kubernetes", notices = "notices", userland = "liken/userland", manifest = "toolchains/manifest" }
# When the layer cache misses, the build compiles buildroot's
# cross-compiler, glib, dbus, and BlueZ from source. That takes longer
# than the default timeout of the images and publish jobs.
timeout = 120
# The build keeps its compiler cache in a cache mount, and CI saves
# the mount between runs, so a build after a buildroot bump recompiles
# only what the bump changed.
cache-mount = true

# The CLI image has the same version as the operator, so the plugin
# that the liken toolkit pulls always matches the operator. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "bluetooth-operator-cli"
description = "kubectl-liken-bluetooth, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
