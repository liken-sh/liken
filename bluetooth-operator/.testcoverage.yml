# This is the coverage gate, enforced in CI (see
# .github/workflows/ci.yaml).
#
# The thresholds only rise over time. Each one is set just under what
# the tests measure today. So a change that loses coverage fails the
# check, and a change that gains coverage should raise the number
# here to keep the gain.
#
# The numbers are measured with Go 1.27.1. Its profiles count a basic
# block once for each row that comments split the block into
# (golang/go#80974), so the floors move when Go 1.27.2 fixes that.
#
# The number is what CI measures, not what a developer's machine
# measures. Four tests create a virtual input device through
# /dev/uinput, and CI's runner does not permit that, so a machine
# that does measures about two points higher. To measure what CI
# measures, skip those four tests:
#
#   go test -race -covermode=atomic -skip 'TestCreateAVirtualDeviceOnTheRealKernel|TestReadBackTheCapabilitiesOfADeviceThisTestCreated|TestNarrowARealNodeOnTheRealKernel|TestTuneARealAxisOnTheRealKernel' -coverprofile=coverage.out ./...

profile: coverage.out

threshold:
  total: 75

override:
  # The bluetoothd supervisor: what is testable is the argument
  # building. Starting the daemon needs a real bus.
  - path: ^bluetoothd$
    threshold: 49
  # start-btmon: the supervisor, the watch, and the child are tested.
  # main and run name the real settings directory and the real btmon.
  - path: ^bluetoothd/btmon$
    threshold: 79
  # bondfetch: the fetch loop needs a real adapter; the parsing does
  # not.
  - path: ^bondfetch$
    threshold: 55
  # bonds: the on-disk bond format, which is pure byte layout.
  - path: ^bonds$
    threshold: 92
