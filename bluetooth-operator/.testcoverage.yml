# The coverage gate that `make test-go` runs, on a workstation and in
# CI. Each threshold is just under the coverage the tests measure.
# Thresholds only go up: when a change raises coverage, raise the
# threshold to keep the gain.
#
# The thresholds assume Go 1.27.2 or later. Go 1.27.1 and earlier
# count a basic block once for each line that comments split it into
# (golang/go#80974), so they report higher coverage.
#
# The thresholds match what CI measures. Some tests create a virtual
# input device through /dev/uinput, which CI's runner does not allow,
# so a machine that allows it measures higher coverage. To measure what
# CI measures, skip those tests:
#
#   go test -race -covermode=atomic -skip 'TestCreateAVirtualDeviceOnTheRealKernel|TestReadBackTheCapabilitiesOfADeviceThisTestCreated|TestNarrowARealNodeOnTheRealKernel|TestTuneARealAxisOnTheRealKernel' -coverprofile=coverage.out ./...

profile: coverage.out

threshold:
  total: 76

override:
  # The bluetoothd supervisor. The tests build the daemon's arguments
  # and power off the adapter over a fake management channel. Starting
  # the daemon needs a real D-Bus, and opening the channel needs a real
  # adapter.
  - path: ^bluetoothd$
    threshold: 65
  # The management channel. The tests send commands and read replies
  # over a fake channel. Opening the socket needs a real kernel.
  - path: ^bluetoothd/mgmt$
    threshold: 58
  # start-rescan. The tests run against fake monitor and management
  # channels. Opening the sockets and running main need a real kernel.
  - path: ^bluetoothd/rescan$
    threshold: 86
  # start-btmon. main and run use the real settings directory and the
  # real btmon, so the tests do not reach them.
  - path: ^bluetoothd/btmon$
    threshold: 79
  # bondfetch. main and run open an HCI socket, which needs a real
  # adapter.
  - path: ^bondfetch$
    threshold: 55
  # bonds. The package uses no hardware.
  - path: ^bonds$
    threshold: 92
