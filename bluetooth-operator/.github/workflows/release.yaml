# Every image this repository publishes goes through this workflow.
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.03-007, and the images ship under that
# tag and :latest. A push to main cuts a development build: the
# version is the most recent release tag plus a suffix,
# 2026.09.03-007-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# ci.yaml holds the tests, the coverage floors, and the other checks.
# This workflow builds the images beside that run and pushes nothing
# until the run passes, so a development build that failed its tests
# never sits one pin away from a cluster.
#
# The three images share one version, because they are three
# parts of one pod and a deployment that mixes versions is a
# combination nobody tested. The tag also names the commit a consumer
# pins to when it references the kustomize base in `deploy/`, so one
# tag versions the images and the manifests together.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

# The registry pushes need packages: write. Nothing here writes to
# the repository.
permissions:
  contents: read
  packages: write
  # actions: read lets the gate step in the release job read the state
  # of the ci run for this commit through the workflow's own token.
  actions: read

# Two tags pushed in quick succession would otherwise race their
# pushes to :latest in an order nobody chose.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no machine can order against
      # the others. A push to main derives it: git describe finds the
      # most recent release tag and counts the commits since it, and
      # the first eight characters of the commit sha make the build
      # traceable. The checkout fetches the whole history, because
      # describe needs the tags.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]')
            release=${described%-*-g*}
            count=${described#"$release"-}
            count=${count%-g*}
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins
      # its manifests needs the full commit sha: a git fetch by sha
      # wants all forty characters, and the eight in the version are
      # not enough. The run's summary prints the two lines to paste,
      # so a roll is a copy.
      - name: Write the roll lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: ghcr.io/liken-sh/bluetooth-operator"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/liken-sh/bluetoothd"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/liken-sh/bluetooth-bondfetch"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three images build here and push nothing yet. A build
      # that fails then leaves no half-released version behind, where
      # a push per image could leave two of three on :latest.
      #
      # The builds read and write the :buildcache tags beside each
      # image. A tag's release of a commit whose development build
      # already ran here rebuilds nothing, and a pull request's builds
      # in ci.yaml read the same tags.
      - name: Build the operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/bluetooth-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/bluetooth-operator:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/bluetooth-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-operator:latest

      - name: Build bluetooth-bondfetch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bondfetch/Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/bluetooth-bondfetch:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/bluetooth-bondfetch:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/bluetooth-bondfetch:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-bondfetch:latest

      # This one builds BlueZ and dbus from source, so it takes
      # minutes rather than seconds.
      - name: Build bluetoothd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bluetoothd/Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/bluetoothd:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/bluetoothd:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/bluetoothd:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetoothd:latest

      # ci.yaml runs beside this workflow on a push to main and holds
      # the coverage floors and the other checks. This step waits for
      # that run and lets nothing push from a red gate. The images built
      # while the checks ran, so the wait is normally over before this
      # step starts. A tag's ci run finished when its commit landed on
      # main, so a tag never waits; a tag on a commit older than the run
      # retention finds no run and fails, and the answer is to re-run ci
      # on that commit and push the tag again. GITHUB_SHA names the tag
      # object for an annotated tag, and the ci run is keyed by the
      # commit, so the lookup resolves the commit first.
      - name: require the gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          for _ in $(seq 1 40); do
            state=$(gh run list --workflow ci.yaml --commit "$commit" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success")
                exit 0 ;;
              "completed "*)
                echo "the ci run for $commit ended with ${state#completed }; no image ships from a red gate" >&2
                exit 1 ;;
              "")
                if [ "$GITHUB_REF_TYPE" = tag ]; then
                  echo "no ci run exists for $commit; re-run ci on that commit, then push the tag again" >&2
                  exit 1
                fi
                echo "no ci run for $commit yet" ;;
              *)
                echo "the ci run for $commit is $state" ;;
            esac
            sleep 15
          done
          echo "the ci run for $commit did not finish within ten minutes" >&2
          exit 1

      # :latest marks the newest release and nothing else. A
      # development build pushes its own tag only.
      - name: Push the images
        run: |
          docker push "ghcr.io/liken-sh/bluetooth-operator:$VERSION"
          docker push "ghcr.io/liken-sh/bluetooth-bondfetch:$VERSION"
          docker push "ghcr.io/liken-sh/bluetoothd:$VERSION"
          if [ "$RELEASE" = true ]; then
            docker push "ghcr.io/liken-sh/bluetooth-operator:latest"
            docker push "ghcr.io/liken-sh/bluetooth-bondfetch:latest"
            docker push "ghcr.io/liken-sh/bluetoothd:latest"
          fi
