# Every push to main tests the code, builds all three images, and
# releases them.
#
# The three images carry the same version, because they are three
# parts of one pod and a deployment that mixes versions is a
# combination nobody tested.
#
# The version is the date and the run number, which is liken's own
# scheme: 2026.08.03-002. The two release cadences do not couple, and
# reading one version beside the other still tells you when each one
# was cut.
name: release

# The filter is a deny-list, not an allow-list, because the Go sources
# sit at the top level beside the packages and a new package is an
# ordinary new directory. An allow-list would have to name every one of
# them, and the day somebody adds a directory it does not name, the push
# that adds it ships no image and says nothing. A deny-list fails the
# other way: a file nobody thought about cuts a release that changes no
# bytes, which costs a version number.
#
# Everything not listed here is a build input, including `deploy/`. That
# directory builds no image, and the release tags the commit, so the tag
# is what a consumer pins to when it references the kustomize base.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'plans/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write
  packages: write

# Two pushes in quick succession would otherwise race for the same
# tag and push two images to :latest in an order nobody chose.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout clones one commit deep and fetches no
          # tags. Without this the tag guard below asks about a tag
          # that is not in the local repository, so it never finds
          # one, and the guard passes everything through.
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tests gate the release. An image that reaches ghcr.io is
      # one that passed them, so a rollback target is always a build
      # that worked.
      - run: go vet ./...
      - run: go test -race ./...

      - name: Compute the version
        run: echo "VERSION=$(date -u +%Y.%m.%d)-$(printf '%03d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liken-sh/bluetooth-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-operator:latest

      - name: Build and push bluetooth-bondfetch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bondfetch/Dockerfile
          push: true
          tags: |
            ghcr.io/liken-sh/bluetooth-bondfetch:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-bondfetch:latest

      # This one builds BlueZ and dbus from source, so it takes
      # minutes rather than seconds.
      - name: Build and push bluetoothd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bluetoothd/Dockerfile
          push: true
          tags: |
            ghcr.io/liken-sh/bluetoothd:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetoothd:latest

      # The tag lands after the push, so a tag in the repository always
      # names a version that exists in the registry.
      #
      # A re-run of a finished run computes the same version from the
      # same run number, so the tag is already there. The guard reads
      # the tag the checkout above fetched and skips the tagging, which
      # keeps the tag pointing at the commit that first carried this
      # version rather than moving it.
      - name: Tag the commit
        run: |
          git rev-parse -q --verify "refs/tags/$VERSION" \
            || { git tag "$VERSION" && git push origin "$VERSION"; }
