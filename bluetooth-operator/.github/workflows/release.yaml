# A pushed tag cuts a release. The tag is the release act, as in the
# main liken repository: a push to main only runs the tests
# (ci.yaml), so docs and intermediate work land freely, and a person
# chooses the commit a version names by tagging it. The version is
# the tag's name, in liken's own scheme: 2026.08.03-001, the date and
# a counter.
#
# The three images share one version, because they are three
# parts of one pod and a deployment that mixes versions is a
# combination nobody tested. The tag also names the commit a consumer
# pins to when it references the kustomize base in `deploy/`, so one
# tag versions the images and the manifests together.
name: release

on:
  push:
    tags: ['*']

# The registry pushes need packages: write. Nothing here writes to
# the repository: the tag exists before the run, so the workflow
# only reads the commit it names.
permissions:
  contents: read
  packages: write

# Two tags pushed in quick succession would otherwise race their
# pushes to :latest in an order nobody chose.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Every tag reaches this workflow, so the first step tests
      # whether the tag is a version. A tag of any other shape fails
      # here, before anything builds, and the log says why.
      - name: check the tag shape
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
            echo "tag '$GITHUB_REF_NAME' is not a version: a release tag looks like 2026.08.03-001"
            exit 1
          }
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The tests gate the release. An image that reaches ghcr.io is
      # one that passed them, so a rollback target is always a build
      # that worked.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liken-sh/bluetooth-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-operator:latest

      - name: Build and push bluetooth-bondfetch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bondfetch/Dockerfile
          push: true
          tags: |
            ghcr.io/liken-sh/bluetooth-bondfetch:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetooth-bondfetch:latest

      # This one builds BlueZ and dbus from source, so it takes
      # minutes rather than seconds.
      - name: Build and push bluetoothd
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bluetoothd/Dockerfile
          push: true
          tags: |
            ghcr.io/liken-sh/bluetoothd:${{ env.VERSION }}
            ghcr.io/liken-sh/bluetoothd:latest
