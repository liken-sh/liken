# Every push to main and every pull request runs the tests. Nothing
# here releases: a push to main is ordinary work landing, and the
# release act is a pushed tag (release.yaml). That separation lets
# docs and intermediate commits land on main without cutting a
# version, and it means main's history records a test verdict for
# every commit a release could later tag.
#
# There is no path filter. The tests are cheap next to the image
# builds, and a filter that guessed wrong would leave a commit with
# no verdict.
#
# The three jobs are independent, so they run at once, and the run
# takes as long as its slowest job.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # The image builds write their layer cache to ghcr, which needs
  # this permission even though no run of this workflow pushes an
  # image.
  packages: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floors.
      - run: make test-go

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

  # Every image builds on every change, and none is pushed, so a
  # Dockerfile that stopped building fails here and not at the tag.
  #
  # The layer cache lives in ghcr, as a :buildcache tag beside each
  # image, not in the GitHub Actions cache. A registry cache has no
  # 10 GB ceiling, it outlives a branch, and CI and release share it,
  # so a release of a commit CI already built rebuilds nothing. A pull
  # request from a fork holds a read-only token, so it reads the cache
  # and writes none.
  images:
    runs-on: ubuntu-latest
    # One job per image, so the three build at once and the run is as
    # long as the slowest of them, not the sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bluetooth-operator
            file: Dockerfile
          - image: bluetooth-bondfetch
            file: bondfetch/Dockerfile
          - image: bluetoothd
            file: bluetoothd/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/liken-sh/{0}:buildcache,mode=max', matrix.image) || '' }}
