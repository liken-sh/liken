# Every pull request and every push to main runs the full gate: the
# tests, the coverage floors, the docs checks, and a build of every
# image. This workflow pushes nothing. On main, release.yaml runs
# beside it and publishes a development build. release.yaml runs a
# plain go test of its own as a guard before it pushes images, but
# the coverage floors and the other checks live only here, so a
# commit on main gets the same verdict a pull request would.
#
# There is no path filter. The tests are cheap next to the image
# builds, and a filter that guessed wrong would leave a commit with
# no verdict.
#
# The three jobs are independent, so they run at once, and the run
# takes as long as its slowest job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The image builds read their layer cache from ghcr. No run of this
  # workflow writes an image or the cache, so read is enough.
  packages: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floors.
      - run: make test-go

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

  # Every image builds on every pull request, and none is pushed, so
  # a Dockerfile that stopped building fails here and not on main.
  #
  # The layer cache lives in ghcr, as a :buildcache tag beside each
  # image, not in the GitHub Actions cache. A registry cache has no
  # 10 GB ceiling, and it outlives a branch. release.yaml writes it
  # on every push to main and every tag, and this workflow only reads
  # it, so a pull request's builds start from the layers the last
  # build on main left.
  images:
    runs-on: ubuntu-latest
    # One job per image, so the three build at once and the run is as
    # long as the slowest of them, not the sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bluetooth-operator
            file: Dockerfile
          - image: bluetooth-bondfetch
            file: bondfetch/Dockerfile
          - image: bluetoothd
            file: bluetoothd/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache
