# The page layout, navigation, and stylesheet come from the brand
# theme in brand/ at the top of the repository, which every liken site
# shares.
baseURL: https://liken.sh/bluetooth/

# The crdref generator puts an HTML span with an id in each field's
# table row, so a link can point at one field. Goldmark drops raw HTML
# unless `unsafe` is set. That is safe here because the repository
# authors everything the site renders.
markup:
  goldmark:
    renderer:
      unsafe: true
title: bluetooth-operator
# themesDir is the repository root, so the site builds with the
# brand/ theme of the same commit.
themesDir: ../..
theme: brand

# The manual has no tags or feeds. Hugo still writes the sitemap.
disableKinds: [taxonomy, term, rss]

params:
  # The theme links to this directory, and the sidebar title uses its
  # last path segment as the project name.
  repository: https://github.com/liken-sh/liken/tree/main/bluetooth-operator

  # The site serves the test coverage report at /coverage.html. The
  # theme's footer links to that page only when this is set.
  coverage: true

# Every page renders as HTML for people and as its authored Markdown
# for agents and scripts. The Markdown copy of / is /index.md. The
# theme has the templates, but a theme cannot declare an output
# format, so each site declares it here (see brand/README.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests in deploy/ as raw YAML under /deploy/,
# so a reader can open the CRDs and a Kustomization can reference the
# files by URL without cloning the repository. The mount reads deploy/
# directly, so the served files are the repository's. Declaring any
# mount removes Hugo's default mounts, so content/ is mounted again.
# This site has none of the other default directories.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
