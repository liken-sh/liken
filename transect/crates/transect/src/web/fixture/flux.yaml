  conditions:
  - {type: Ready, status: 'False', message: 'kustomize build failed: missing resource', lastTransitionTime: '2026-01-01T07:05:00Z'}
---
# Applied by shop-apps, as Flux labels a `HelmRelease` its
# `Kustomization` applies.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: acme-shop
  name: storefront-release
  labels:
    kustomize.toolkit.fluxcd.io/name: shop-apps
    kustomize.toolkit.fluxcd.io/namespace: acme-ops
spec:
  chart:
    spec:
      chart: storefront-chart
      sourceRef: {kind: HelmRepository, name: charts-helm, namespace: acme-ops}
status:
  history: [{chartVersion: 1.4.2}]
  conditions: [{type: Ready, status: 'True', lastTransitionTime: '2026-01-01T11:10:00Z'}]
