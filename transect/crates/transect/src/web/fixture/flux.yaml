# Flux in the fixture: every kind `transect` reads, in `acme-ops`, and
# the labels it writes on what it applies, which are on the objects in
# `cluster.yaml`.
#
# - shop-apps applies the storefront from shop-git, a branch;
# - storefront-release applies the storefront too, from charts-helm,
#   so the storefront has both appliers' labels and the release
#   wins;
# - ledger-apps applies the ledger from ledger-git, pinned to a commit,
#   as `ServiceAccount` ledger-deployer, which may change the ledger's
#   workloads and nothing else;
# - ops-apps applies the log shipper from ops-oci;
# - backup-apps applies the ledger's backup from backup-bucket.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: kustomizations.kustomize.toolkit.fluxcd.io}
spec:
  group: kustomize.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: Kustomization, plural: kustomizations}
  versions: [{name: v1, served: true, storage: true}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: helmreleases.helm.toolkit.fluxcd.io}
spec:
  group: helm.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: HelmRelease, plural: helmreleases}
  versions: [{name: v2, served: true, storage: true}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: gitrepositories.source.toolkit.fluxcd.io}
spec:
  group: source.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: GitRepository, plural: gitrepositories}
  versions: [{name: v1, served: true, storage: true}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: ocirepositories.source.toolkit.fluxcd.io}
spec:
  group: source.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: OCIRepository, plural: ocirepositories}
  versions: [{name: v1, served: true, storage: true}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: helmrepositories.source.toolkit.fluxcd.io}
spec:
  group: source.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: HelmRepository, plural: helmrepositories}
  versions: [{name: v1, served: true, storage: true}]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: buckets.source.toolkit.fluxcd.io}
spec:
  group: source.toolkit.fluxcd.io
  scope: Namespaced
  names: {kind: Bucket, plural: buckets}
  versions: [{name: v1, served: true, storage: true}]
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {namespace: acme-ops, name: shop-git}
spec:
  url: https://github.com/acme/shop
  ref: {branch: main}
status:
  artifact:
    revision: main@sha1:1111111111111111111111111111111111111111
    lastUpdateTime: '2026-01-01T11:00:00Z'
  conditions: [{type: Ready, status: 'True', lastTransitionTime: '2026-01-01T11:00:00Z'}]
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata: {namespace: acme-ops, name: ledger-git}
spec:
  url: https://codeberg.org/acme/ledger
  ref: {commit: '2222222222222222222222222222222222222222'}
status:
  artifact:
    revision: sha1:2222222222222222222222222222222222222222
    lastUpdateTime: '2026-01-01T10:00:00Z'
  conditions: [{type: Ready, status: 'True', lastTransitionTime: '2026-01-01T10:00:00Z'}]
