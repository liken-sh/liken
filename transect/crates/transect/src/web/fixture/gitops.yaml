# Kind knowledge for the Flux objects in `flux.yaml`, written as Flux
# would ship it. No `transect` code refers to these kinds, so the map
# learns about them only from this file.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
spec:
  # Flux gives all its controllers access to every kind in its API
  # groups, so the RBAC rules do not show which controller writes a
  # `Kustomization`'s status. The controller's image does.
  controller: {image: fluxcd/kustomize-controller}
  applies:
    name: {label: kustomize.toolkit.fluxcd.io/name}
    namespace: {label: kustomize.toolkit.fluxcd.io/namespace}
    # When `spec.serviceAccountName` is empty, the `Kustomization`
    # applies as the controller's own `ServiceAccount`.
    account: {field: spec.serviceAccountName}
  source: [spec.sourceRef]
  directory: spec.path
  revision:
    paths: [status.lastAppliedRevision]
    formats: ['{ref}@sha1:{commit}', 'sha1:{commit}', '{ref}@*']
  # When two `Kustomization`s apply the same `Namespace`, each reconcile
  # rewrites these labels to the one that applied it last. transect
  # ignores a change to them when it decides whether the `Namespace`
  # changed.
  ignoreChanges:
    - {label: kustomize.toolkit.fluxcd.io/name, kinds: [{kind: Namespace}]}
    - {label: kustomize.toolkit.fluxcd.io/namespace, kinds: [{kind: Namespace}]}
---
# The objects of a Helm release have the release's labels and also the
# labels of the `Kustomization` that applied the release. The higher
# `precedence` makes the `HelmRelease` their applier.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  controller: {image: fluxcd/helm-controller}
  applies:
    name: {label: helm.toolkit.fluxcd.io/name}
    namespace: {label: helm.toolkit.fluxcd.io/namespace}
    precedence: 1
  source: [spec.chart.spec.sourceRef, spec.chartRef]
  chart: spec.chart.spec.chart
  revision:
    paths: [status.lastAppliedRevision, 'status.history[].chartVersion']
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: gitrepositories.source.toolkit.fluxcd.io
spec:
  repository: ['{spec.url}']
  ref: {branch: spec.ref.branch, tag: spec.ref.tag, commit: spec.ref.commit}
  revision:
    paths: [status.artifact.revision]
    at: status.artifact.lastUpdateTime
    formats: ['{ref}@sha1:{commit}', 'sha1:{commit}', '{ref}@*']
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: ocirepositories.source.toolkit.fluxcd.io
spec:
  repository: ['{spec.url}']
  ref: {tag: spec.ref.tag}
  revision:
    paths: [status.artifact.revision]
    at: status.artifact.lastUpdateTime
    formats: ['{ref}@*']
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: helmrepositories.source.toolkit.fluxcd.io
spec:
  repository: ['{spec.url}']
  revision:
    paths: [status.artifact.revision]
    at: status.artifact.lastUpdateTime
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: buckets.source.toolkit.fluxcd.io
spec:
  repository: ['{spec.endpoint}/{spec.bucketName}']
  revision:
    paths: [status.artifact.revision]
    at: status.artifact.lastUpdateTime
