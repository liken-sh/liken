---
# `Gizmo` is a custom kind that no kind knowledge describes and that
# runs nothing, so its store is trimmed to metadata, conditions, and
# printer columns.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: gizmos.gizmos.example.test}
spec:
  group: gizmos.example.test
  scope: Namespaced
  names: {kind: Gizmo, plural: gizmos}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
    - {name: First, type: string, jsonPath: '.spec.parts[0:1]'}
    - {name: Size, type: string, jsonPath: '.spec.size'}
    - {name: Detail, type: string, jsonPath: '.status.detail', priority: 1}
---
apiVersion: gizmos.example.test/v1
kind: Gizmo
metadata: {namespace: acme-shop, name: gizmo-red, uid: gizmo-red}
spec: {size: large, parts: [a, b]}
status: {conditions: [{type: Ready, status: 'True'}]}
---
apiVersion: gizmos.example.test/v1
kind: Gizmo
metadata: {namespace: acme-shop, name: gizmo-blue, uid: gizmo-blue}
spec: {size: small, parts: [a, b]}
status: {conditions: [{type: Ready, status: 'False'}]}
---
# `Cache` is a custom kind that no kind knowledge describes and that
# owns a `StatefulSet`, so a `Cache` is a workload of its own, and its
# store keeps each object whole.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: caches.caches.example.test}
spec:
  group: caches.example.test
  scope: Namespaced
  names: {kind: Cache, plural: caches}
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: A cache of shoppers' sessions, kept in memory on one pod.
        type: object
---
apiVersion: caches.example.test/v1
kind: Cache
metadata: {namespace: acme-shop, name: session-cache, uid: session-cache}
spec: {memory: 1Gi}
status: {conditions: [{type: Ready, status: 'True'}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: acme-shop
  name: session-cache-set
  uid: session-cache-set
  ownerReferences: [{apiVersion: caches.example.test/v1, kind: Cache, name: session-cache, uid: session-cache, controller: true}]
spec:
  replicas: 1
  serviceName: session-cache-set
  selector: {matchLabels: {app: session-cache}}
  template:
    metadata: {labels: {app: session-cache}}
    spec:
      containers: [{name: main, image: example.test/session-cache-image:1, ports: [{containerPort: 6379}]}]
status: {replicas: 1, readyReplicas: 1, availableReplicas: 1, updatedReplicas: 1, currentReplicas: 1}
---
apiVersion: v1
kind: Pod
metadata:
  namespace: acme-shop
  name: session-cache-set-0
  uid: session-cache-set-0
  labels: {app: session-cache}
  ownerReferences: [{apiVersion: apps/v1, kind: StatefulSet, name: session-cache-set, uid: session-cache-set, controller: true}]
spec: {nodeName: node-beta, containers: [{name: main, image: example.test/session-cache-image:1, ports: [{containerPort: 6379}]}]}
status:
  phase: Running
  podIPs: [{ip: 10.0.0.7}]
  conditions: [{type: Ready, status: 'True'}]
  containerStatuses: [{name: main, ready: true, restartCount: 0, image: example.test/session-cache-image:1, imageID: '', state: {running: {}}}]
---
# `Promotion` is a custom kind that kind knowledge describes and that
# an operator in its own namespace reconciles, so the operator's page
# has a Controls table.  The knowledge is in `resources.yaml`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: promotions.promotions.example.test}
spec:
  group: promotions.example.test
  scope: Namespaced
  names: {kind: Promotion, plural: promotions}
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - {name: Discount, type: string, jsonPath: '.spec.discount'}
    - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
---
apiVersion: promotions.example.test/v1
kind: Promotion
metadata: {namespace: acme-shop, name: spring-sale, uid: spring-sale}
spec: {discount: 20%, storefront: {name: storefront-svc}}
status: {conditions: [{type: Ready, status: 'True', reason: Running}]}
---
apiVersion: promotions.example.test/v1
kind: Promotion
metadata: {namespace: acme-shop, name: clearance, uid: clearance}
spec: {discount: 50%, storefront: {name: storefront-svc}}
status: {conditions: [{type: Ready, status: 'False', reason: Scheduled, message: starts at the end of the month}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {namespace: acme-promoter, name: promoter, uid: promoter}
spec:
  replicas: 1
  selector: {matchLabels: {app: promoter}}
  template:
    metadata: {labels: {app: promoter}}
    spec:
      serviceAccountName: promoter
      containers: [{name: main, image: example.test/promoter-image:1}]
status: {replicas: 1, readyReplicas: 1, availableReplicas: 1, updatedReplicas: 1}
---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  namespace: acme-promoter
  name: promoter-rs
  uid: promoter-rs
  ownerReferences: [{apiVersion: apps/v1, kind: Deployment, name: promoter, uid: promoter, controller: true}]
---
apiVersion: v1
kind: Pod
metadata:
  namespace: acme-promoter
  name: promoter-rs-one
  uid: promoter-rs-one
  labels: {app: promoter}
  ownerReferences: [{apiVersion: apps/v1, kind: ReplicaSet, name: promoter-rs, uid: promoter-rs, controller: true}]
spec: {nodeName: node-alpha, serviceAccountName: promoter, containers: [{name: main, image: example.test/promoter-image:1}]}
status:
  phase: Running
  podIPs: [{ip: 10.0.0.8}]
  conditions: [{type: Ready, status: 'True'}]
  containerStatuses: [{name: main, ready: true, restartCount: 0, image: example.test/promoter-image:1, imageID: '', state: {running: {}}}]
---
# The operator's identity and what it may do, which the `ServiceAccount`
# and `ClusterRole` pages draw.
apiVersion: v1
kind: ServiceAccount
metadata: {namespace: acme-promoter, name: promoter}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: promotion-editor}
rules:
- apiGroups: [promotions.example.test]
  resources: [promotions, promotions/status]
  verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: promoter-edits-promotions}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promotion-editor}
subjects: [{kind: ServiceAccount, namespace: acme-promoter, name: promoter}]
