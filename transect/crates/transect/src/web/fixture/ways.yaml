# Other ways to reach workloads, besides the storefront's `Ingress` in
# `cluster.yaml`:
#
# - a second `Ingress` for the shop's host, with a sign-in gate;
# - a `LoadBalancer` `Service` for the ledger.  Listener pods on both
#   machines refer to it in their labels, as the `node-balancer`
#   document in `resources.yaml` declares;
# - a `LoadBalancer` `Service` for the promoter, on its own address.
#   The `DaemonSet` of its listener has an owner reference to the
#   `Service`;
# - a `NodePort` `Service` for the storefront;
# - a relay that uses six host ports;
# - a help desk behind its own `Ingress` with TLS.  The help desk does
#   its own sign-in, as its `signs-in` annotation says;
# - a catalog behind its own `Ingress` with TLS and no sign-in.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: acme-shop
  name: storefront-admin
  annotations: {example.test/gates: acme-ops-partner-gate}
spec:
  ingressClassName: proxy
  tls: [{hosts: [shop.example.test], secretName: storefront-tls}]
  rules: [{host: shop.example.test, http: {paths: [{path: /admin, pathType: Prefix, backend: {service: {name: storefront-svc, port: {number: 80}}}}]}}]
---
apiVersion: v1
kind: Service
metadata: {namespace: acme-ledger, name: ledger-sql}
spec: {type: LoadBalancer, selector: {app: ledger-db}, ports: [{port: 5432}], clusterIP: 10.96.0.50}
status: {loadBalancer: {ingress: [{ip: 192.168.0.1}, {ip: 192.168.0.2}]}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {namespace: acme-ops, name: sql-listener, uid: sql-listener}
spec:
  selector: {matchLabels: {app: sql-listener}}
  template:
    metadata: {labels: {app: sql-listener}}
    spec:
      containers: [{name: lb, image: example.test/listener-image:1, ports: [{containerPort: 5432, hostPort: 5432}]}]
status: {desiredNumberScheduled: 2, numberReady: 2, updatedNumberScheduled: 2, numberAvailable: 2}
---
apiVersion: v1
kind: Pod
metadata:
  namespace: acme-ops
  name: sql-listener-a
  uid: sql-listener-a
  labels: {app: sql-listener, lb.example.test/service-name: ledger-sql, lb.example.test/service-namespace: acme-ledger}
  ownerReferences: [{apiVersion: apps/v1, kind: DaemonSet, name: sql-listener, uid: sql-listener, controller: true}]
spec: {nodeName: node-alpha, containers: [{name: lb, image: example.test/listener-image:1, ports: [{containerPort: 5432, hostPort: 5432}]}]}
status:
  phase: Running
  podIPs: [{ip: 10.0.0.30}]
  conditions: [{type: Ready, status: 'True'}]
  containerStatuses: [{name: lb, ready: true, restartCount: 0, image: example.test/listener-image:1, imageID: '', state: {running: {}}}]
---
apiVersion: v1
kind: Pod
metadata:
  namespace: acme-ops
  name: sql-listener-b
  uid: sql-listener-b
  labels: {app: sql-listener, lb.example.test/service-name: ledger-sql, lb.example.test/service-namespace: acme-ledger}
  ownerReferences: [{apiVersion: apps/v1, kind: DaemonSet, name: sql-listener, uid: sql-listener, controller: true}]
spec: {nodeName: node-beta, containers: [{name: lb, image: example.test/listener-image:1, ports: [{containerPort: 5432, hostPort: 5432}]}]}
status:
  phase: Running
  podIPs: [{ip: 10.0.0.31}]
  conditions: [{type: Ready, status: 'True'}]
  containerStatuses: [{name: lb, ready: true, restartCount: 0, image: example.test/listener-image:1, imageID: '', state: {running: {}}}]
---
apiVersion: v1
