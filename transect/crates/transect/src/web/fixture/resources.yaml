# The fixture cluster's objects of transect's own kinds, in the API
# group transect.liken.sh.
apiVersion: transect.liken.sh/v1alpha1
kind: Layers
metadata:
  name: layers
spec:
  layers:
    - name: apps
      namespaceSelectors:
        - matchExpressions:
            - {key: kubernetes.io/metadata.name, operator: In, values: [acme-shop, acme-garden, acme-greenhouse]}
    - name: data
      namespaceSelectors:
        - matchExpressions:
            - {key: kubernetes.io/metadata.name, operator: In, values: [acme-ledger]}
    - name: operators
      namespaceSelectors:
        - matchExpressions:
            - {key: kubernetes.io/metadata.name, operator: In, values: [acme-promoter, acme-gardener]}
    - name: platform
      namespaceSelectors:
        - matchExpressions:
            - {key: kubernetes.io/metadata.name, operator: In, values: [acme-ops, acme-agents]}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: promotions.promotions.example.test
spec:
  summary: A sale on the shop, with a start and an end.
  layer: apps
  healthy: {condition: Ready, calm: [Scheduled]}
  references:
    - {path: spec.storefront.name, kind: Service, label: discounts}
  controller: {image: example.test/promoter-image}
---
# Before it forwards a request through a gate, the proxy sends a check
# to the address in `spec.checkWith`, and the response allows or refuses
# the request.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: gates.proxy.example.test
spec:
  summary: A check the proxy runs before each request.
  referencedBy:
    - {kind: Ingress, group: networking.k8s.io, annotation: example.test/gates, name: '{namespace}-{name}'}
  references:
    - {path: spec.checkWith, address: true, edge: authenticates through, label: asks before each request}
---
# The proxy in front of the shop: the controller that its
# `IngressClass` names, the image that its `DaemonSet` in `entry.yaml`
# runs, and the metrics queries for the traffic of each `Ingress` it
# serves.
apiVersion: transect.liken.sh/v1alpha1
kind: IngressController
metadata:
  name: edge-proxy
spec:
  controller: example.test/proxy
  image: proxy/router
  entryPoints:
    annotation: example.test/entrypoints
    default: [web, websecure]
    ports:
      - {name: web, port: 80, redirectsTo: websecure}
      - {name: websecure, port: 443, tls: true}
  entry:
    backend: {label: backend, name: '{namespace}-{service}-{port}'}
    requests: 'sum by (backend) (rate(proxy_requests_total[5m]))'
    latency: 'histogram_quantile(0.95, sum by (backend, le) (rate(proxy_request_seconds_bucket[5m])))'
    errors: 'sum by (backend) (rate(proxy_requests_total{code=~"5.."}[5m]))'
    window: 5m
---
# A handset refers to its radio by the radio's address. Only the radio's
# status has the address, so the reference matches on that field's value
# instead of the radio's name.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: handsets.radios.example.test
spec:
  summary: A handset the shop's radio has paired.
  references:
    - {path: status.radio, kind: Radio, group: radios.example.test, match: status.address, label: pairs through}
---
# A till holds a handset device and refers to its radio by the radio's
# address. The handset device's attributes refer to the same radio, so
# the till's section view draws a line from the device to the radio.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: tills.tills.example.test
spec:
  summary: A till at the shop's counter.
  references:
    - {path: status.radio, kind: Radio, group: radios.example.test, match: status.address, label: pairs through}
---
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: radio.example.test
spec:
  title: product
  facts:
    - {attribute: battery, label: battery}
  references:
    - {attribute: radio, kind: Radio, group: radios.example.test, match: status.address, label: pairs through}
---
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: sound.example.test
spec:
  title: label
  facts:
    - {attribute: connector, label: connector}
    - {attribute: channels, label: channels}
  references:
    - {attribute: card, driver: gpu.example.test, match: resource.kubernetes.io/pciBusID, label: speakers of}
---
# The stock room's shelves and bins. Each is part of the one above it.
# Every sketch draws a room as the `crate` of its own group, the stock
# that it keeps, unless a role of the sketch states another shape.
#
# A room's page draws the shelves that name it, each as the shelf's own
# elevation, with the bins that name the shelf.  A shelf's room is the
# page's room, so the shelf's elevation leaves it out.  A room needs a
# keeper only while it is open, so the keeper is expected while the
# room's `Open` condition is `True`.  The back room is open and has no
# keeper, so its keeper's place says that one is missing.  The front
# room is closed, so its keeper's place is drawn at rest, and it has no
# shelf.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: rooms.stock.example.test
spec:
  summary: A room the shop keeps stock in.
  shape: crate
  references:
    - {path: spec.thermostat, kind: Thermostat, group: stock.example.test, label: kept warm by}
  roles:
    shelves:    {namedBy: {kind: Shelf, path: spec.room}, elevation: the shelf, expected: true}
    thermostat: {reference: spec.thermostat, reads: [Temperature]}
    keeper:     {namedBy: {kind: Keeper, path: spec.room}, expected: {while: Open}}
  elevations:
    - name: the stock room
      question: Which shelves are in this room, and who keeps it?
      sketch: |
        shelves  shelves  shelves  thermostat
        keeper   .        .        .
---
# A keeper looks after one room.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: keepers.stock.example.test
spec:
  summary: A person who keeps a stock room.
  references:
    - {path: spec.room, kind: Room, group: stock.example.test, edge: part of}
---
# A thermostat sleeps between readings, so Sleeping is calm.  It is a
# round dial on a wall, so a sketch draws it as the library's `disc`.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: thermostats.stock.example.test
spec:
  summary: A thermostat that keeps a room warm.
  shape: disc
  healthy: {condition: Online, calm: [Sleeping]}
---
# A vent has no condition of its own, so it is as healthy as the
# thermostat that it names.  A vent is part of a room, and the room's
# sketch does not draw vents, so the board under the room's sketch keeps
# the vent as a part of the room.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: vents.stock.example.test
spec:
  summary: A vent that a thermostat opens.
  healthy: {through: spec.thermostat}
  references:
    - {path: spec.thermostat, kind: Thermostat, group: stock.example.test, label: opened by}
    - {path: spec.room, kind: Room, group: stock.example.test, edge: part of}
---
# A shelf's page draws a sketch in place of the ring, with a tab for
# each elevation.  The top shelf names its room, an electronic label,
# and a spill room that the cluster has no object for.  It names no
# lamp and no ladder, so the lamp, which the roles expect, is drawn as
# nothing, and the ladder, which they do not expect, leaves its area
# blank.  The low shelf names both, and the cluster serves neither
# kind, so the page draws them plainly.  The room shows the shelf's own
# aisle, and its sale when it has one or its stock when it has none,
# and the temperature of the thermostat that the room names.  In the
# restock, stock comes from the spill room by the ladder when the shelf
# names one, and straight to the room when it names none.  The spill
# room is drawn in the shape that the knowledge of a room states.  The
# `room` role states `box`, so the room that the shelf stands in is
# drawn as a plain box in place of the room's `crate`.  The bins that
# name the shelf stand beside its label, and the low shelf has none.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: shelves.stock.example.test
spec:
  summary: A shelf in a stock room.
  references:
    - {path: spec.room, kind: Room, group: stock.example.test, edge: part of}
    - {path: spec.label, label: labeled by}
    - {path: spec.spill, kind: Room, group: stock.example.test, label: spills into}
    - {path: spec.lamp, kind: Lamp, group: stock.example.test, label: lit by}
    - {path: spec.ladder, kind: Ladder, group: stock.example.test, label: reached by}
  roles:
    room: {reference: spec.room, shape: box, expected: true, reads: [Floor, {column: Temperature, through: spec.thermostat}], shows: [Aisle, [Sale, Stock]]}
    label: {reference: spec.label, shape: screen, expected: true}
    spill: {reference: spec.spill}
    lamp: {reference: spec.lamp, expected: true}
    ladder: {reference: spec.ladder}
    bins: {namedBy: {kind: Bin, path: spec.shelf}, expected: true, reads: [Holds]}
  elevations:
    - name: the shelf
      question: Where is this shelf, and what does it need?
      sketch: |
        room   room   label   bins
        spill  lamp   ladder  bins
    - name: the restock
      question: How does stock reach this shelf, and what lights its label?
      sketch: |
        spill  ladder  room
        lamp   .       label
      wires:
        - {from: spill, to: room, via: ladder, carries: stock}
        - {from: lamp, to: label, carries: light}
---
# The shape of a room: the knowledge of a kind in `stock.example.test`
# that names `crate` finds this shape in the kind's own group.  Its
# handle stands above its top edge, so a part keeps the room above it.
apiVersion: transect.liken.sh/v1alpha1
kind: Shape
metadata:
  name: crate.stock.example.test
spec:
  summary: A crate with a slat across its side and a handle on its lid, such as a crate of stock in a store room.
  size: {design: [240, 120], width: [140, 260]}
  outline: {round: 2}
  pieces:
    - {name: handle, behind: true, at: {left: 50% - 20, width: 40, top: -10, height: 14}, round: [6, 6, 0, 0]}
    - {name: slat, draw: line, at: {left: 0, right: 0, bottom: 30, height: 1}, view: [240, 1], path: "M0 0.5H240"}
  ports: {left: [30%, 70%], right: [30%, 70%]}
---
# A shape with a field that the form does not have, which transect
# leaves out with the condition Invalid.
apiVersion: transect.liken.sh/v1alpha1
kind: Shape
metadata:
  name: glowing-crate.stock.example.test
spec:
  summary: A crate in a color of its own.
  size: {design: [240, 120], width: [140, 260]}
  color: "#ff0000"
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: bins.stock.example.test
spec:
  summary: A bin on a shelf.
  healthy: {condition: Ready}
  references:
    - {path: spec.shelf, kind: Shelf, group: stock.example.test, edge: part of}
    - {path: spec.overflow, kind: Shelf, group: stock.example.test, edge: part of}
---
# The machine behind a `Node`, which has the same name as the `Node`.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: machines.liken.sh
spec:
  summary: The computer under a Node.
  healthy: {condition: Ready}
  node: metadata.name
  references:
    - {path: status.phase, label: phase}
---
# The kinds of the certificate tool. A `Certificate` writes the `Secret`
# that an `Ingress` serves TLS from, and refers to its issuer. An
# annotation on an `Ingress` can refer to the issuer too: by name for a
# `ClusterIssuer`, and by name in the `Ingress`'s own namespace for an
# `Issuer`.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: certificates.cert-manager.io
spec:
  summary: A TLS certificate, kept renewed in the Secret it writes.
  writesSecret: spec.secretName
  references:
    - {path: spec.issuerRef.name, kind: ClusterIssuer, group: cert-manager.io, label: issued by, role: issues-tls}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: clusterissuers.cert-manager.io
spec:
  summary: Issues certificates for every namespace.
  referencedBy:
    - {kind: Ingress, group: networking.k8s.io, annotation: cert-manager.io/cluster-issuer, name: '{name}', role: issues-tls}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: issuers.cert-manager.io
spec:
  summary: Issues certificates in its namespace.
  referencedBy:
    - {kind: Ingress, group: networking.k8s.io, annotation: cert-manager.io/issuer, name: '{name}', role: issues-tls}
---
apiVersion: transect.liken.sh/v1alpha1
kind: Outside
metadata:
  name: archive-nas
spec:
  title: The archive NAS
  addresses: [nas.example.test]
  why: Keeps the ledger's archive on NFS.
  url: https://nas.example.test:5001
---
# The fixture's log store. Its log lines for the storefront's first pod
# are in `signals.yaml`. Each list in `levels` holds prefixes of the
# OpenTelemetry `severity_text` values for that level, matched without
# regard to case. For a value that no prefix matches, such as
# `Unspecified`, transect guesses the level from the line's text.
apiVersion: transect.liken.sh/v1alpha1
kind: LogSource
metadata:
  name: logs
spec:
  url: http://logs.example.test:9428
  language: logsql
  query: /select/logsql/query
  fields:
    namespace: k8s.namespace.name
    pod: k8s.pod.name
    container: k8s.container.name
    time: _time
    level: severity_text
    message: _msg
  levels:
    error: [err, fatal]
    warning: [warn]
    plain: [info, debug]
  queries:
    tail: '{fields.namespace}:"{namespace}" {fields.pod}:"{pod}" | sort by ({fields.time}) desc | limit {limit}'
    search: '_time:{window} {pattern} | stats by ({fields.namespace}, {fields.pod}) count() matches, max({fields.time}) last | limit {limit}'
---
# The fixture's Prometheus and Alertmanager. Their responses are in
# `signals.yaml`. The metric names exist only in this fixture.
apiVersion: transect.liken.sh/v1alpha1
kind: MetricsSource
metadata:
  name: metrics
spec:
  url: http://prometheus.example.test:9090
  nodeLabels: [node, instance]
  queries:
    machineCpu: {query: machine_cores_used}
    machineMemory: {query: machine_bytes_used}
    containerCpu:
      query: container_cores_used
      labels: {namespace: namespace, pod: pod, container: container}
    containerMemory:
      query: container_bytes_used
      labels: {namespace: namespace, pod: pod, container: container}
    volumeUsed:
      query: claim_bytes_used
      labels: {namespace: namespace, claim: claim}
  alerts:
    url: http://alertmanager.example.test:9093
    severity: {label: severity, failing: [critical], notice: [info], hidden: [none]}
    namespace: namespace
    objects:
      - {label: pod, kind: Pod}
      - {label: deployment, group: apps, kind: Deployment}
    container: container
    nodeLabels: [node]
    instanceLabels: [instance]
    scrapeLabels: [pod, container]
    exportedPrefix: exported_
    annotations: {summary: summary, description: description}
---
# The git forges that host the fixture's GitOps sources, with the URL
# patterns for linking to a tree and a commit.
apiVersion: transect.liken.sh/v1alpha1
kind: Forge
metadata:
  name: github
spec:
  hosts: [github.com]
  tree: '{repository}/tree/{ref}/{path}'
  commit: '{repository}/commit/{sha}'
---
apiVersion: transect.liken.sh/v1alpha1
kind: Forge
metadata:
  name: gitea
spec:
  hosts: [codeberg.org]
  hostPrefixes: [gitea, forgejo]
  images: [gitea, forgejo]
  tree: '{repository}/src/{refKind}/{ref}/{path}'
  commit: '{repository}/commit/{sha}'
---
# The listener on each machine that serves a `LoadBalancer` `Service`
# records the `Service`'s name and namespace in two labels.
apiVersion: transect.liken.sh/v1alpha1
kind: LoadBalancerController
metadata:
  name: node-balancer
spec:
  listener:
    name: {label: lb.example.test/service-name}
    namespace: {label: lb.example.test/service-namespace}
---
# The scanner's reports. Each report names its container in a label, and
# holds the image digest it scanned and its findings.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: imagereports.scan.example.test
spec:
  controller: {image: example/image-scanner}
  findings:
    subject:
      owner: true
      container: {label: scan.example.test/container}
    digest: report.artifact.digest
    scannedAt: report.updateTimestamp
    summary:
    - {severity: CRITICAL, path: report.summary.criticalCount}
    - {severity: HIGH, path: report.summary.highCount}
    - {severity: UNKNOWN, path: report.summary.unknownCount}
    items: "report.found[]"
    item: {id: id, severity: severity, score: score, package: package, installed: installed, fixed: fixed, link: link, title: title}
---
# A ledger is a store of the pattern `primary-with-replicas`: the
# primary takes the writes, and the replicas stream from it.  Its
# operator names the `Service`s for the ledger and records the names in
# no field, so the knowledge names them by a template.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: ledgers.ledgers.example.test
spec:
  summary: A ledger's primary, which takes the writes, and the replicas that stream from it.
  healthy: {condition: Ready}
  references:
    - {path: status.primary, kind: Pod, label: primary is}
    - {path: 'status.instances[]', kind: Pod, label: instance}
    - {path: status.target, kind: Pod, label: the operator's target is}
    - {name: '{name}-rw', kind: Service, label: writes through}
    - {name: '{name}-ro', kind: Service, label: reads from the replicas through}
  controller: {image: example.test/promoter-image}
  pattern:
    name: primary-with-replicas
    roles:
      instances:     {reference: 'status.instances[]'}
      primary:       {reference: status.primary}
      target:        {reference: status.target}
      write-service: {reference: '{name}-rw'}
      read-service:  {reference: '{name}-ro'}
---
# The knowledge of the agent system in `agents.yaml`.  A `Mandate`'s
# loop is a sequence: an event of a `Signal` reaches the operator, which
# wakes or starts a `Session` and runs its turns as `Job`s, and a turn
# calls its tools.  The `Signal`s of a purview are the keys of a map.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: mandates.agents.example.test
spec:
  summary: The work that an agent owes in one namespace.
  healthy: {condition: Ready}
  controller: {image: example.test/gardener}
  references:
    - {path: "spec.purview[keys]", kind: Signal, group: agents.example.test, label: hears}
    - {path: spec.allowance, kind: Allowance, group: agents.example.test, label: paid by}
    - {path: "spec.tools.mcp[]", kind: McpServer, group: agents.example.test, label: uses tools of}
  templates:
    - {path: spec.template, use: turn, injects: [gardener], runsAs: status.serviceAccount}
  roles:
    signals:   {reference: "spec.purview[keys]", label: Signals, stack: true}
    operator:  {controller: true, label: the operator}
    duties:    {namedBy: {kind: Duty, path: spec.mandate}, stack: true}
    sessions:  {namedBy: {kind: Session, path: spec.mandate}, stack: true}
    turns:     {namedBy: {kind: Session, path: spec.mandate}, owns: Job, label: turn and hook Jobs, stack: true}
    allowance: {reference: spec.allowance}
    tools:     {reference: "spec.tools.mcp[]", label: MCP servers, stack: true}
  elevations:
    - name: the loop
      question: How does an event become a turn, and what does a turn call?
      sequence:
        lanes: [signals, operator, sessions, turns, tools]
        presents: turns
        steps:
          - {from: signals, to: operator, verb: delivers an event, state: {role: signals, condition: Connected}}
          - {from: operator, to: sessions, verb: wakes the Session that holds the event's key, state: {role: sessions, columns: [Phase, Waiting]}}
          - {from: operator, to: sessions, verb: or starts a Session for a Duty whose purview matches, state: {role: duties, condition: Ready}}
          - {from: operator, to: operator, verb: holds the turn while the budget is spent, state: {role: allowance, condition: Holding, good: "False", said: has room}}
          - {from: operator, to: turns, verb: "runs the before hook, the turn, and the after hook as Jobs"}
          - {from: turns, to: tools, verb: calls tools, state: {role: tools, condition: Ready}}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: duties.agents.example.test
spec:
  summary: One skill that a Mandate runs when an event matches.
  healthy: {condition: Ready}
  controller: {image: example.test/gardener}
  references:
    - {path: spec.mandate, kind: Mandate, group: agents.example.test, label: duty of}
  templates:
    - {path: spec.template, use: turn, merge: spec.mandate, injects: [gardener]}
---
# A `Session` records each turn in `status.turns`, and the `Job`s of its
# turns are deleted when their time to live ends, so its turns are rows
# of its status.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: sessions.agents.example.test
spec:
  summary: One run of an agent for a Mandate, over one or more turns.
  healthy: {condition: Ready}
  controller: {image: example.test/gardener}
  references:
    - {path: spec.mandate, kind: Mandate, group: agents.example.test, label: works for}
    - {path: spec.duty, kind: Duty, group: agents.example.test, label: runs}
  elevations:
    - name: its turns
      question: What did each turn do, and how did it end?
      rows:
        from: "status.turns[]"
        header:
          - {label: phase, path: status.phase}
          - {label: waiting on, path: status.waitingOn}
          - {label: pending events, path: status.pendingEvents}
        columns:
          - {label: before hook, path: before.outcome, failed: [Failed]}
          - {label: turn, path: outcome, failed: [Failed]}
          - {label: Job, path: job, logs: true}
          - {label: started, path: startedAt, format: time}
          - {label: finished, path: finishedAt, format: time}
          - {label: after hook, path: after.outcome, failed: [Failed]}
          - {label: why the Session ended, path: after.reason}
          - {label: cost, path: usage.costUSD, format: dollars}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: signals.agents.example.test
spec:
  summary: A source of events.
  healthy: {condition: Connected}
  controller: {image: example.test/gardener}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: allowances.agents.example.test
spec:
  summary: A budget in dollars per hour.
  healthy: {condition: Ready}
  controller: {image: example.test/gardener}
---
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: mcpservers.agents.example.test
spec:
  summary: An MCP server that a Mandate names for its tools.
  healthy: {condition: Ready}
  references:
    - {path: spec.url, address: true, label: serves at}
---
# The programs that the turns of the `garden` and `orchard` `Mandate`s
# call: the operator's own, which serves the events of each turn, one
# that gives out credentials, and one that keeps transcripts.  Each
# names its image with the registry host `example.test` and no tag.
apiVersion: transect.liken.sh/v1alpha1
kind: ProgramKnowledge
