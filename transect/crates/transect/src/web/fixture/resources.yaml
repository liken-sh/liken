  image: example.test/gardener
  accepts:
    - {audience: gardener, verb: "reads its events, its keys, and its transcript"}
---
apiVersion: transect.liken.sh/v1alpha1
kind: ProgramKnowledge
metadata:
  name: keyring
spec:
  image: example.test/keyring
  accepts:
    - {audience: keyring, verb: asks for a credential}
---
apiVersion: transect.liken.sh/v1alpha1
kind: ProgramKnowledge
metadata:
  name: notebook
spec:
  image: example.test/notebook
  accepts:
    - {audience: notebook, verb: ships its transcript}
