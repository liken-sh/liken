# A box is the shape that a role gets when it names none: a plain
# chassis with a line across its front and a power light.  A chassis
# has no display, so its readings are a muted line of text and never
# look lit.  Its design is its widest width, so a design unit is a
# pixel when the box stands at that width.
apiVersion: transect.liken.sh/v1alpha1
kind: Shape
metadata:
  name: box
spec:
  summary: A piece of equipment on a shelf, such as a computer, a network switch, or a hub.
  size: {design: [460, 153], width: [160, 460]}
  outline: {round: 4}
  text: {inset: [12, 14, 22, 14]}
  pieces:
    - {name: front line, draw: line, at: {left: 0, right: 0, bottom: 8, height: 1}, view: [460, 1], path: "M0 0.5H460"}
    - {name: left foot, at: {left: 12, top: 100%, width: 18, height: 4}, round: [0, 0, 2, 2]}
    - {name: right foot, at: {right: 12, top: 100%, width: 18, height: 4}, round: [0, 0, 2, 2]}
    - {name: power light, draw: mark, at: {right: 16, bottom: 16, width: 6, height: 6}, round: 50%}
  ports: {left: [25%, 75%], right: [25%, 75%]}
