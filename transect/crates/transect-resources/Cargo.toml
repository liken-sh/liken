[package]
name = "transect-resources"
version.workspace = true
edition.workspace = true

[dependencies]
transect-graph.workspace = true
# Used only by the test builders in the `fixtures` feature.
anyhow = { workspace = true, optional = true }
askama.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Test builders for the tests of other crates.
fixtures = ["dep:anyhow"]

[dev-dependencies]
anyhow.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lib]
# The doc comments show YAML and paths that are not runnable examples.
doctest = false
