[package]
name = "transect-map"
version.workspace = true
edition.workspace = true

[dependencies]
transect-frame.workspace = true
transect-graph.workspace = true
transect-resources.workspace = true
transect-cluster.workspace = true
transect-observe.workspace = true
transect-ground.workspace = true
transect-supply.workspace = true
transect-network.workspace = true
askama.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# The test builders other crates' tests read.
fixtures = []

[dev-dependencies]
transect-graph = { workspace = true, features = ["fixtures"] }
transect-cluster = { workspace = true, features = ["fixtures"] }
transect-observe = { workspace = true, features = ["fixtures"] }
transect-ground = { workspace = true, features = ["fixtures"] }
transect-supply = { workspace = true, features = ["fixtures"] }
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, features = ["server"] }
rstest.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lib]
# The doc comments show YAML and paths, not examples to run.
doctest = false
