# transect's account can get, list, and watch, and nothing else.  No
# rule names Secrets, and no rule has a wildcard, because a wildcard on
# the core group would include Secrets.
#
# The account is bound to transect-reader, which aggregates every
# ClusterRole that has the label below.  Those are transect-reader-builtin,
# for the built-in kinds that transect watches, and any role that an
# operator or the cluster's own repository adds for a custom group.
# transect watches every CRD, so a cluster adds one such role that
# lists the groups its CRDs serve.  transect does not watch a kind in a
# group that no role lists, and logs "not watching" for it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-reader
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        transect.liken.sh/aggregate-to-reader: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-reader-builtin
  labels:
    transect.liken.sh/aggregate-to-reader: "true"
rules:
  # ConfigMaps are here because their names and owners show which
  # workload uses which configuration on the map.  A list returns their
  # data, which can hold credentials, and Kubernetes cannot grant
  # access to a ConfigMap's metadata alone.
  - apiGroups: [""]
    resources:
      - configmaps
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [deviceclasses, resourceclaims, resourceslices]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transect-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transect-reader
subjects:
  - kind: ServiceAccount
    name: transect
    namespace: default
---
# A pod's log lines can hold credentials, so the permission to read them
# is a separate role, which a cluster can remove with a patch.  Without
# it, transect shows a pod's recent log lines from a LogSource, or not
# at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-pod-logs
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transect-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transect-pod-logs
subjects:
  - kind: ServiceAccount
    name: transect
    namespace: default
