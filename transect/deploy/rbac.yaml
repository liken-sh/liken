# What transect's account may do: get, list, and watch, and nothing
# else.  No rule names Secrets, and no rule has a wildcard, since a
# wildcard on the core group would include Secrets.
#
# transect-reader is the role the account holds.  It aggregates every
# ClusterRole that carries the label below: transect-reader-builtin, for
# the built-in kinds the stores watch, and any role an operator or the
# cluster's repository adds for a custom group.  transect watches every
# CRD, so a cluster adds one such role listing the groups its CRDs
# serve, or leaves a group out, and /resources shows each kind it may
# not list.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-reader
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        transect.liken.sh/aggregate-to-reader: "true"
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-reader-builtin
  labels:
    transect.liken.sh/aggregate-to-reader: "true"
rules:
  # ConfigMaps are here because their names and their owners place a
  # workload's configuration on the map.  A list returns their data,
  # which can hold credentials, and Kubernetes has no grant for their
  # metadata alone.
  - apiGroups: [""]
    resources:
      - configmaps
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [controllerrevisions, daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [csidrivers, storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [resource.k8s.io]
    resources: [deviceclasses, resourceclaims, resourceslices]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings, clusterroles, rolebindings, roles]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transect-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transect-reader
subjects:
  - kind: ServiceAccount
    name: transect
    namespace: default
---
# A pod's log lines can hold credentials, so reading them is a role of
# its own, which a cluster can delete with a patch.  Without it, a pod's
# tail comes from a LogSource or is not shown.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transect-pod-logs
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transect-pod-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transect-pod-logs
subjects:
  - kind: ServiceAccount
    name: transect
    namespace: default
