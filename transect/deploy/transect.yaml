# transect lists the whole cluster at startup, keeps it current with
# watches, and serves the map from memory. It writes nothing, so it
# needs no leader election, and one replica is enough.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transect
  annotations:
    # transect reads nearly every kind the cluster serves, so a person
    # who reviews the cluster's accounts finds this one powerful. The
    # annotation records why it needs that access.
    transect.liken.sh/expected-access: Reads every kind but Secrets, and writes nothing, to draw the map.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transect
  template:
    metadata:
      labels:
        app: transect
    spec:
      serviceAccountName: transect
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transect
          image: ghcr.io/liken-sh/transect:latest
          env:
            - name: TRANSECT_LISTEN
              value: 0.0.0.0:8080
            # An overlay sets the other variables, such as
            # TRANSECT_PROMETHEUS, TRANSECT_ALERTMANAGER,
            # TRANSECT_LOG_SOURCE_URL, and TRANSECT_RESOURCES.
            # `transect --help` lists them all.
          ports:
            - name: http
              containerPort: 8080
          # transect opens its port only after its first list of the
          # cluster finishes, and exits when that list takes more than 30
          # seconds. The startup probe allows 60 seconds, so that a slow
          # first list does not restart the pod.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # /readyz does not check the API server, so during an API
          # server outage the Service keeps routing to the pod and people
          # can still read the map.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          # The Service and the ingress controller remove a deleted pod's
          # address a moment after the pod starts to exit. The sleep keeps
          # the pod serving until then, so no request reaches a closed port.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: transect
spec:
  selector:
    app: transect
  ports:
    - name: http
      port: 80
      targetPort: http
