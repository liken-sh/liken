# Refuses every caller.  The base cannot name the callers that should
# reach transect, because each one is the cluster's own: an overlay adds
# a rule that admits its ingress controller by that controller's labels,
# and, on a CNI that drops the kubelet's probes under a policy like this
# one, a rule that admits the probe port from the machines' addresses.
#
# Egress is left open.  What transect calls, the API server, Prometheus,
# Alertmanager, a log store, and registries on 443, has addresses only
# the cluster knows, and on a distribution that runs the API server on
# the host network, such as k3s, the API server is an ipBlock and not a
# pod.  An overlay that refuses egress by default admits those.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transect
spec:
  podSelector:
    matchLabels:
      app: transect
  policyTypes: [Ingress]
  ingress: []
