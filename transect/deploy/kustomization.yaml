# The kustomize base for transect: its account, the read-only roles
# that account holds, the Deployment, its Service, and its
# NetworkPolicy. The base creates no Namespace and names none, so an
# overlay sets `namespace:`, and kustomize moves the account's bindings
# with it.
#
# This base is for the cluster owner to take. `liken` does not apply
# it and does not name it. Take it through your own GitOps with
# patches of your own:
#
#   resources:
#     - <this directory, or the transect-deploy OCI artifact>
#
# CI publishes this directory as the OCI artifact
# ghcr.io/liken-sh/transect-deploy, under the same version as the
# image, and sets the tag of the image below to that version. So a
# cluster that follows the artifact moves the manifests and the image
# in one step. A kustomization that takes this directory from git
# names the version itself:
#
#   images:
#     - name: ghcr.io/liken-sh/transect
#       newTag: <a version of ghcr.io/liken-sh/transect>
#
# The base ships no Ingress, because how a cluster exposes transect
# and through which sign-in belongs to that cluster. An overlay adds
# the Ingress, the NetworkPolicy rule that admits its ingress
# controller, the TRANSECT_* env for its Prometheus, Alertmanager, and
# log store, a ClusterRole for the custom groups it serves, and the
# volume of transect's own resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - transect.yaml
  - network.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: transect
      app.kubernetes.io/part-of: transect

images:
  - name: ghcr.io/liken-sh/transect
    newTag: latest
