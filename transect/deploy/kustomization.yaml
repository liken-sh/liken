# The kustomize base for transect: a ServiceAccount, the read-only
# roles bound to it, the Deployment, its Service, and its
# NetworkPolicy. The base creates no Namespace and sets none, so an
# overlay sets `namespace:`, and kustomize updates the subjects of the
# account's bindings to match.
#
# The cluster owner applies this base. `liken` does not apply it and
# does not refer to it. Include it from your own GitOps repository and
# add your own patches:
#
#   resources:
#     - <this directory, or the transect-deploy OCI artifact>
#
# CI publishes this directory as the OCI artifact
# ghcr.io/liken-sh/transect-deploy, under the same version as the
# image, and sets the tag of the image below to that version. So a
# cluster that follows the artifact moves the manifests and the image
# in one step. A kustomization that takes this directory from git
# names the version itself:
#
#   images:
#     - name: ghcr.io/liken-sh/transect
#       newTag: <a version of ghcr.io/liken-sh/transect>
#
# The base has no Ingress, because each cluster decides how to expose
# transect and which sign-in to put in front of it. An overlay adds the
# Ingress, the NetworkPolicy rule that admits its ingress controller,
# the TRANSECT_* environment variables for its Prometheus,
# Alertmanager, and log store, a ClusterRole for the custom groups it
# serves, and the volume for transect's own resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - transect.yaml
  - network.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: transect
      app.kubernetes.io/part-of: transect

images:
  - name: ghcr.io/liken-sh/transect
    newTag: latest
