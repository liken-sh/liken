# transect, a live, read-only map of a Kubernetes cluster: its layers,
# the relationships between its parts, and their health.
[package]
name = "transect"
license = "MIT"

# The binary embeds the fonts in brand/fonts, and a test compares the
# crate's copy of the color tokens with brand/liken.css. The image build
# reads notices for the license notices, trust for the CA bundle,
# toolchains for cargo-auditable and the Rust, Debian, and Go images,
# and vulkan for snapshot.sh and closure.sh. The image installs its
# packages from the Debian snapshot whose date is vulkan's version.
[depends]
components = ["brand", "notices", "toolchains", "trust", "vulkan"]

# `make test` runs the format check, clippy on the shipped code, clippy
# on the tests, and the tests under the coverage gate. The Makefile
# says why clippy runs twice.
[[jobs]]
name = "rust"
toolchain = "rust"
run = "make test"
timeout = 30
env = { CARGO_INCREMENTAL = "0" }
coverage = ["coverage-transect.xml"]

# Runs the hooks in .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The rust job already runs the format check.
skip = ["cargo-fmt"]

[outputs]
deploy = "deploy"

[[outputs.images]]
name = "transect"
description = "transect, which serves a live, read-only map of a Kubernetes cluster: its layers, the relationships between its parts, and their health."
file = "Dockerfile"
contexts = { brand = "brand", builder = "vulkan", manifest = "toolchains/manifest", notices = "notices", toolchains = "toolchains" }
versions = { SNAPSHOT = "vulkan" }
smoke = "transect/smoke/transect.sh"
