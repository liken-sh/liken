# Kind knowledge for trivy-operator's reports, as trivy-operator would
# ship it.  A report runs no pods, so the controller's image identifies
# the operator that writes a report.  Each kind stays watched
# trimmed.  A vulnerability report's findings knowledge keeps
# each finding's id, severity, score, package, versions, link, and
# title, and none of its description; every other report keeps none of
# its contents.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: clustercompliancereports.aquasecurity.github.io
spec:
  controller: {image: aquasec/trivy-operator}
  docs: https://aquasecurity.github.io/trivy-operator/
---
