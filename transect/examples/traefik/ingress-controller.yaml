# The IngressController that Traefik would ship: the controller value
# of its IngressClass, the image of its workload, and how to read the
# traffic of the Ingresses it serves.  A distribution that packages
# Traefik under another image, as k3s does with
# rancher/mirrored-library-traefik, sets that image here instead.
#
# Traefik's metrics name each backend Service in the `service` label as
# <namespace>-<service>-<port>@kubernetes, with the port as the Ingress
# writes it, a number or a name.  The 5xx query returns only backends
# that have sent at least one 5xx.
apiVersion: transect.liken.sh/v1alpha1
kind: IngressController
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller
  image: traefik
  entry:
    backend: {label: service, name: "{namespace}-{service}-{port}@kubernetes"}
    requests: 'sum by (service) (rate(traefik_service_requests_total[5m]))'
    latency: 'histogram_quantile(0.95, sum by (service, le) (rate(traefik_service_request_duration_seconds_bucket[5m])))'
    errors: 'sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))'
    window: 5m
  # Traefik serves an Ingress on the entry points in its
  # router.entrypoints annotation, or on every entry point when the
  # annotation is absent.  Traefik's Helm chart creates web and
  # websecure.  Its redirect from web to websecure is a catch-all router
  # with the lowest priority, so an Ingress served on web matches first
  # and responds in plain HTTP.  That is why web has no redirectsTo.  On
  # a cluster where the redirect matches first, set
  # `redirectsTo: websecure` on web.
  entryPoints:
    annotation: traefik.ingress.kubernetes.io/router.entrypoints
    default: [web, websecure]
    ports:
      - {name: web, port: 80}
      - {name: websecure, port: 443, tls: true}
