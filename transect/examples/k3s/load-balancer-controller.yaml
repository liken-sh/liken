# For each LoadBalancer Service, k3s's service load balancer creates a
# DaemonSet in kube-system. Its pods open the Service's ports as host
# ports and have the Service's name and namespace in two labels. With
# this resource, "Ways in" shows those pods on their Service's row
# instead of listing each one as a host port of its own.
apiVersion: transect.liken.sh/v1alpha1
kind: LoadBalancerController
metadata:
  name: k3s-servicelb
spec:
  listener:
    name: {label: svccontroller.k3s.cattle.io/svcname}
    namespace: {label: svccontroller.k3s.cattle.io/svcnamespace}
