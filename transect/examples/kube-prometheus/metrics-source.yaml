# A MetricsSource for a cluster that runs kube-prometheus or the
# kube-prometheus-stack chart with their default names.  It expects
# Prometheus and Alertmanager in the monitoring namespace, the kubelet's
# cAdvisor and volume metrics with a `node` label, kube-state-metrics,
# and alert rules that set a severity label on each alert.  Change the
# Service names to match your release.  To reach Prometheus through a
# port-forward from a workstation, set `url`, which is used in place of
# the Service.
apiVersion: transect.liken.sh/v1alpha1
kind: MetricsSource
metadata:
  name: metrics
spec:
  service: {namespace: monitoring, name: prometheus-k8s, port: 9090}
  # The kubelet's ServiceMonitor puts the Node's name in `node`.
  nodeLabels: [node]
  queries:
    # The root cgroup, id="/", covers everything on the machine,
    # including system daemons and the kubelet. It is the figure that
    # metrics-server reports and `kubectl top node` prints.  `max`
    # keeps a kubelet that two scrape jobs report from being counted
    # twice.
    machineCpu:
      query: 'max by (node) (rate(container_cpu_usage_seconds_total{id="/"}[2m]))'
    # The working set is the figure the kubelet compares against its
    # eviction thresholds.
    machineMemory:
      query: 'max by (node) (container_memory_working_set_bytes{id="/"})'
    # container!="" drops the pod's own cgroup, which already includes
    # its containers, and container!="POD" drops the pause container.
    containerCpu:
      query: 'max by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!="", container!="POD"}[2m]))'
      labels: {namespace: namespace, pod: pod, container: container}
    containerMemory:
      query: 'max by (namespace, pod, container) (container_memory_working_set_bytes{container!="", container!="POD"})'
      labels: {namespace: namespace, pod: pod, container: container}
    # The kubelet reports the bytes used on each PersistentVolumeClaim's
    # volume.
    volumeUsed:
      query: 'max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes)'
      labels: {namespace: namespace, claim: persistentvolumeclaim}
  alerts:
    # The Alertmanager pods behind this Service deliver the cluster's
    # alerts, so the page can show them when machines are lost.
    service: {namespace: monitoring, name: alertmanager-main, port: 9093}
    # In kube-prometheus's rules, the severity `none` marks the
    # Watchdog alert and the alerts that exist only to inhibit others.
    severity: {label: severity, failing: [critical], notice: [info], hidden: [none]}
    namespace: namespace
    # Most specific first.  kube-state-metrics labels a Job's alerts
    # with job_name, because the `job` label holds the scrape job.
    objects:
      - {label: pod, kind: Pod}
      - {label: deployment, group: apps, kind: Deployment}
      - {label: statefulset, group: apps, kind: StatefulSet}
      - {label: daemonset, group: apps, kind: DaemonSet}
      - {label: cronjob, group: batch, kind: CronJob}
      - {label: job_name, group: batch, kind: Job}
      - {label: persistentvolumeclaim, kind: PersistentVolumeClaim}
      - {label: service, kind: Service}
    container: container
    nodeLabels: [node]
    instanceLabels: [instance]
    annotations: {summary: summary, description: description}
