# A LogSource for VictoriaLogs, with its LogsQL, for lines an
# OpenTelemetry collector ships with its Kubernetes attributes:
# k8s.namespace.name, k8s.pod.name, k8s.container.name, and
# k8s.node.name, and OpenTelemetry's level names in severity_text.
# Change the Service to match the release, and set `url` for a
# port-forward from a workstation, which takes precedence over the
# Service.
apiVersion: transect.liken.sh/v1alpha1
kind: LogSource
metadata:
  name: victoria-logs
spec:
  service: {namespace: victoria-logs, name: victoria-logs, port: 9428}
  language: logsql
  query: /select/logsql/query
  fields:
    namespace: k8s.namespace.name
    pod: k8s.pod.name
    container: k8s.container.name
    node: k8s.node.name
    time: _time
    level: severity_text
    message: _msg
  # severity_text contains ERROR, WARN, INFO, and the like, or
  # Unspecified when the shipper read none, which leaves the line to the
  # guess from its text.  Each entry is the start of a value, in any case.
  levels:
    error: [err, fatal, panic, crit]
    warning: [warn]
    plain: [info, debug, trace, notice]
  queries:
    # {since} is the pod's start, which keeps the scan to its lifetime.
    # transect narrows this to one container and asks only for the
    # fields a line shows.
    tail: '_time:>={since} {fields.namespace}:"{namespace}" {fields.pod}:"{pod}" | sort by ({fields.time}) desc | limit {limit}'
    # Grouped by namespace and pod, so error lines tie to workloads,
    # and by container and machine, so a finding names where they were.
    search: '_time:{window} {pattern} | stats by ({fields.namespace}, {fields.pod}, {fields.container}, {fields.node}) count() matches, max({fields.time}) last | sort by (matches) desc | limit {limit}'
    # The newest matching lines across the cluster, which a finding
    # shows a few of.
    lines: '_time:{window} {pattern} | sort by ({fields.time}) desc | limit {limit}'
