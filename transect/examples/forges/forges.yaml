# The URL layouts of the public forges, which transect uses to link to
# code.  A forge that the cluster runs itself, behind an Ingress to a
# gitea or forgejo image, is recognized by that image at any host.
apiVersion: transect.liken.sh/v1alpha1
kind: Forge
metadata:
  name: github
spec:
  hosts: [github.com]
  tree: '{repository}/tree/{ref}/{path}'
  commit: '{repository}/commit/{sha}'
---
apiVersion: transect.liken.sh/v1alpha1
kind: Forge
metadata:
  name: gitlab
spec:
  hosts: [gitlab.com]
  hostPrefixes: [gitlab]
  images: [gitlab-ce, gitlab-ee]
  tree: '{repository}/-/tree/{ref}/{path}'
  commit: '{repository}/-/commit/{sha}'
---
# Gitea and Forgejo, and Codeberg, which runs Forgejo.  Their tree
# URLs include whether the ref is a branch, a tag, or a commit.
apiVersion: transect.liken.sh/v1alpha1
kind: Forge
metadata:
  name: gitea
spec:
  hosts: [codeberg.org, gitea.com]
  hostPrefixes: [gitea, forgejo]
  images: [gitea, forgejo]
  tree: '{repository}/src/{refKind}/{ref}/{path}'
  commit: '{repository}/commit/{sha}'
