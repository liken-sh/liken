# Kind knowledge for observatory-operator's kinds that report a Ready
# condition, as observatory-operator would ship it.  Between
# reservations every one of them reports Ready False with the reason
# Idle ("Not reserved"), and a device on the shelf reports Inventory:
# both mean at rest, not broken.  The reasons are the phases in
# observatory-operator's status.go, observatory/site.go, and
# observatory/device.go.
#
# Each piece of equipment names what it is part of: a camera, filter
# wheel, focuser, or guider its optical train, a train, tube, mount, or
# guider its telescope, and a telescope its observatory, so each board
# nests in the one above it.  A guider names both its train and its
# telescope, and nests under its train.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: cameras.observatory.liken.sh
spec:
  healthy: {condition: Ready, calm: [Idle, Inventory]}
  references:
    - {path: spec.opticalTrain, kind: OpticalTrain, group: observatory.liken.sh, edge: part of}
  controller: {image: liken-sh/observatory-operator}
