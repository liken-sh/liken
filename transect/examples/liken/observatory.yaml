# Kind knowledge for the kinds of observatory-operator that report a
# Ready condition. Between reservations each of these objects has Ready
# False with the reason Idle, and a device that names no parent has the
# reason Inventory. Both mean the object is not in use, not that it is
# broken, so `calm` lists them. They are the phases `PhaseIdle` in
# observatory-operator's `observatory/site.go` and `DeviceInventory` in
# `observatory/device.go`.
#
# Each kind of equipment has references to the object that it is part
# of: a camera, filter wheel, focuser, or guider refers to its optical
# train. A train, tube, mount, or guider refers to its telescope, and a
# telescope refers to its observatory. So each object's board nests
# under the board of the object above it.  A guider refers to both its
# train and its telescope, and nests under its train.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: cameras.observatory.liken.sh
spec:
  healthy: {condition: Ready, calm: [Idle, Inventory]}
  references:
    - {path: spec.opticalTrain, kind: OpticalTrain, group: observatory.liken.sh, edge: part of}
  controller: {image: liken-sh/observatory-operator}
