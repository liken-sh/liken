# Kind knowledge for liken's Machine, as liken would ship it.  Every
# reference is a plain value, because a Machine refers to no other
# object.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: machines.liken.sh
spec:
  summary: The computer under a Node, with the operating system liken declares for it and the hardware it reads.
  healthy: {condition: Ready}
  # The Machine's Node has the Machine's name, so the machine page
  # shows the Node under it, and search finds the machine by that name.
  node: metadata.name
  references:
    - {path: status.phase, label: phase}
    - {path: status.role, label: etcd role}
    - {path: status.version.liken, label: runs liken}
    - {path: status.version.kernel, label: kernel}
    - {path: status.hardware.cpus, label: cpus}
    - {path: status.firmware.bootCurrent, label: booted from}
