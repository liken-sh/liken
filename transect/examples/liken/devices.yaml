# Device knowledge for the DRA drivers that liken ships. Each resource
# is named for the driver name in that driver's ResourceSlices:
# liken.sh for the devices the kernel found, and one for each of the
# audio, display, bluetooth, and media operators.
#
# A liken.sh device's name attribute comes from the USB or PCI ID
# database.
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: liken.sh
spec:
  title: name
  facts:
    - {attribute: bus, label: on}
    - {attribute: class, label: class}
    - {attribute: driver, label: driver}
---
# An HDMI or DisplayPort sound output has the same monitor.liken.sh/id
# as the display.liken.sh device of its monitor, so the map shows the
# output as that monitor's speakers.
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: audio.liken.sh
spec:
  title: monitorName
  facts:
    - {attribute: connectionType, label: through}
    - {attribute: speakers, label: speakers}
    - {attribute: lpcmChannels, label: channels}
  references:
    - {attribute: monitor.liken.sh/id, driver: display.liken.sh, match: monitor.liken.sh/id, label: speakers of}
---
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: display.liken.sh
spec:
  title: model
  facts:
    - {attribute: connector, label: connector}
    - {attribute: currentMode, label: mode}
---
# A paired device's address matches the status.address of its
# Peripheral, and a radio's address matches the status.address of its
# Adapter. The Adapter owns the Peripheral, so the map draws the
# Peripheral as part of the Adapter, and the line from a paired device
# ends at the radio it pairs through.
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: bluetooth.liken.sh
spec:
  title: name
  facts:
    - {attribute: kind, label: kind}
    - {attribute: connected, label: connected, whenFalse: not connected}
    - {attribute: battery, label: reports its battery}
  references:
    - {attribute: address, kind: Peripheral, group: bluetooth.liken.sh, match: status.address, label: pairs through}
    - {attribute: address, kind: Adapter, group: bluetooth.liken.sh, match: status.address, label: media bus of}
---
# A media capability device's address is the PCI bus ID of its GPU. It
# has no resource.kubernetes.io/pciBusID of its own, so the map draws it
# apart from the GPU, with a line labeled "capability of".
apiVersion: transect.liken.sh/v1alpha1
kind: DeviceKnowledge
metadata:
  name: media.liken.sh
spec:
  title: name
  facts:
    - {attribute: driver, label: driver}
  references:
    - {attribute: address, driver: liken.sh, match: resource.kubernetes.io/pciBusID, label: capability of}
