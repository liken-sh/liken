# The console annotation that Synology's CSI driver would ship on its
# CSIDriver. Its StorageClasses and PersistentVolumes give the NAS
# address as `dsm`, and DSM serves its console on port 5001 by
# default. This file is an overlay that transect merges onto the
# cluster's CSIDriver.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.san.synology.com
  annotations:
    transect.liken.sh/console: 'https://{dsm}:5001'
