# The fast local checks, which pre-commit or prek runs before every
# commit.  The tests and the coverage gate run in CI, through the `make`
# targets that package.toml names.
#
# htmx and its SSE extension are minified upstream files that end
# without a newline.  htmx.sha256 and pin.toml beside them pin their
# digests, so no hook may rewrite them.
exclude: ^crates/transect/src/web/static/(htmx|hx-sse)\.min\.js$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # A Kubernetes manifest can have several YAML documents.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py packages a prebuilt shellcheck binary, so the hook
  # works on a machine that has no shellcheck installed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x makes shellcheck follow `source` into toolchains/pin.sh from
        # the htmx latest.sh, and into vulkan/closure.sh from
        # transect-closure.sh.
        args: [-x]
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cargo fmt --check'
        language: system
        files: \.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$
        pass_filenames: false
