[env]
# The build of jemalloc compiles these options into it, so the binary
# runs with them and its container needs no environment for them. A
# background thread returns freed pages to the system about a second
# after they go unused, where jemalloc's default of ten seconds for
# each stage kept the garbage of each render resident for twenty.
JEMALLOC_SYS_WITH_MALLOC_CONF = "background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000"
