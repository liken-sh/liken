[env]
# The jemalloc build compiles these options in, so the binary uses them
# without any environment variable in its container. jemalloc's default
# decay is ten seconds for each of its two stages, so memory that a
# render frees stays resident for up to twenty seconds. With one second
# per stage, a background thread returns it to the operating system
# within about two.
JEMALLOC_SYS_WITH_MALLOC_CONF = "background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000"
