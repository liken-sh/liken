# The coverage gate that CI enforces (see .github/workflows/ci.yaml).
#
# The threshold is set just under the coverage the tests measure, so a
# change that loses coverage fails the check. A change that gains
# coverage should raise the threshold to keep the gain.
#
# The threshold assumes Go 1.27.2 or later, which counts each basic
# block once. Go 1.27.1 and earlier count a block once for each line
# that comments split it into (golang/go#80974), so they measure higher.

profile: coverage.out

# Each excluded path does work that no test may do. main.go creates the
# in-cluster clients and runs only when the program starts.
# indi/capture/record/ starts INDI drivers in Docker containers, and
# schema/crosscheck/ fetches a page from GitHub. The code that parses
# what record records is in indi/capture, which the gate measures.
exclude:
  paths:
    - ^main\.go$
    - ^indi/capture/record/
    - ^schema/crosscheck/

threshold:
  # Most uncovered statements in the operator's package return an error
  # after an INDI change or an API request fails. failures_test.go fails
  # one call in each step, and a test for every other call would repeat
  # it. Most of what cli/ leaves uncovered is the plugin's main() and
  # the error returns from building its clients from a kubeconfig.
  #
  # The threshold is about a percentage point under the measured total
  # because a few early returns run only when a goroutine reads the
  # stores between two events. The number of covered statements changes
  # by a few from one run to the next.
  total: 94
