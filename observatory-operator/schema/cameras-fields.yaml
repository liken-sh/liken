# The typed fields of a `Camera`, from the standard properties of INDI's
# CCD interface. curated.go gives the format and the roles.
kind: Camera
interfaces: [ccd]
detect: [CCD_EXPOSURE]
properties:
  ACTIVE_DEVICES:
    field: activeDevices
    role: tree
    description: "The INDI devices whose state the camera writes into the FITS header of each frame."
    members:
      ACTIVE_TELESCOPE: {field: telescope, description: "The mount, for the coordinates and the pier side."}
      ACTIVE_ROTATOR: {field: rotator, description: "The rotator, for the angle of the camera."}
      ACTIVE_FOCUSER: {field: focuser, description: "The focuser, for its position and temperature."}
      ACTIVE_FILTER: {field: filter, description: "The filter wheel, for the name of the filter."}
      ACTIVE_SKYQUALITY: {field: skyQuality, description: "The sky quality meter, for the brightness of the sky."}
  CCD_EXPOSURE:
    field: exposure
    role: command
    unit: s
    description: "The length of an exposure of the sensor, in seconds. While the exposure runs, the driver counts it down."
  CCD_ABORT_EXPOSURE:
    field: abortExposure
    role: command
    description: "Stops the exposure of the sensor that runs."
  CCD_FRAME:
    field: frame
    role: command
    description: "The area of the sensor that the next frame reads, in pixels."
    members:
      X: {field: x, unit: px, description: "The left edge of the area, in pixels."}
      "Y": {field: "y", unit: px, description: "The top edge of the area, in pixels."}
      WIDTH: {field: width, unit: px, description: "The width of the area, in pixels."}
      HEIGHT: {field: height, unit: px, description: "The height of the area, in pixels."}
  CCD_FRAME_RESET:
    field: frameReset
    role: command
    description: "Sets `frame` back to the whole sensor and the binning back to 1 by 1."
  CCD_BINNING:
    field: binning
    role: command
    description: "How many pixels of the sensor each pixel of the next frame sums, across and down."
    members:
      HOR_BIN: {field: horizontal, unit: factor, description: "The binning across, such as 2."}
      VER_BIN: {field: vertical, unit: factor, description: "The binning down, such as 2."}
  FITS_HEADER:
    field: fitsHeader
    role: command
    description: "One keyword that the driver adds to the FITS header of each frame after it."
    members:
      KEYWORD_NAME: {field: name, description: "The keyword, such as `OBSERVER`."}
      KEYWORD_VALUE: {field: value, description: "The value of the keyword."}
      KEYWORD_COMMENT: {field: comment, description: "The comment of the keyword."}
  GUIDER_EXPOSURE:
    field: guiderExposure
    role: command
    unit: s
    description: "The length of an exposure of the guide head, in seconds. While the exposure runs, the driver counts it down."
  GUIDER_ABORT_EXPOSURE:
    field: guiderAbortExposure
    role: command
    description: "Stops the exposure of the guide head that runs."
  GUIDER_FRAME:
    field: guiderFrame
    role: command
    description: "The area of the guide head that its next frame reads, in pixels."
    members:
      X: {field: x, unit: px, description: "The left edge of the area, in pixels."}
      "Y": {field: "y", unit: px, description: "The top edge of the area, in pixels."}
      WIDTH: {field: width, unit: px, description: "The width of the area, in pixels."}
      HEIGHT: {field: height, unit: px, description: "The height of the area, in pixels."}
  CCD_TEMPERATURE:
    field: temperature
    role: command
    unit: degC
    description: "The temperature of the sensor, in degrees Celsius. A client that writes it sets the cooler's setpoint."
  CCD_TEMP_RAMP:
    field: temperatureRamp
    role: setting
    description: "How fast the driver changes the cooler's setpoint toward a new one."
    members:
      RAMP_SLOPE: {field: slope, unit: degC/min, description: "The greatest change of the setpoint, in degrees Celsius per minute. Zero turns the ramp off."}
      RAMP_THRESHOLD: {field: threshold, unit: degC, description: "How close to the setpoint the sensor must come before the change is done, in degrees Celsius."}
  CCD_CAPTURE_FORMAT:
    field: captureFormat
    role: setting
    elements: driver
    description: "The format that the sensor captures in, such as mono or a raw Bayer pattern."
  CCD_TRANSFER_FORMAT:
    field: transferFormat
    role: setting
    description: "The format that the driver sends each frame in: FITS, XISF, or the camera's native format."
  CCD_INFO:
    field: info
    role: reading
    description: "The size of the sensor and of its pixels, and the depth of each pixel."
    members:
      CCD_MAX_X: {field: maxX, unit: px, description: "The width of the sensor, in pixels."}
      CCD_MAX_Y: {field: maxY, unit: px, description: "The height of the sensor, in pixels."}
      CCD_PIXEL_SIZE: {field: pixelSize, unit: um, description: "The size of one pixel, in micrometers."}
      CCD_PIXEL_SIZE_X: {field: pixelSizeX, unit: um, description: "The width of one pixel, in micrometers."}
      CCD_PIXEL_SIZE_Y: {field: pixelSizeY, unit: um, description: "The height of one pixel, in micrometers."}
      CCD_BITSPERPIXEL: {field: bitsPerPixel, unit: bits, description: "The depth of one pixel, in bits."}
  GUIDER_INFO:
    field: guiderInfo
    role: reading
    description: "The size of the guide head and of its pixels, and the depth of each pixel."
    members:
      CCD_MAX_X: {field: maxX, unit: px, description: "The width of the guide head, in pixels."}
      CCD_MAX_Y: {field: maxY, unit: px, description: "The height of the guide head, in pixels."}
      CCD_PIXEL_SIZE: {field: pixelSize, unit: um, description: "The size of one pixel, in micrometers."}
      CCD_PIXEL_SIZE_X: {field: pixelSizeX, unit: um, description: "The width of one pixel, in micrometers."}
      CCD_PIXEL_SIZE_Y: {field: pixelSizeY, unit: um, description: "The height of one pixel, in micrometers."}
      CCD_BITSPERPIXEL: {field: bitsPerPixel, unit: bits, description: "The depth of one pixel, in bits."}
  GUIDER_BINNING:
    field: guiderBinning
    role: command
    description: "How many pixels of the guide head each pixel of its next frame sums, across and down."
    members:
      HOR_BIN: {field: horizontal, unit: factor, description: "The binning across, such as 2."}
      VER_BIN: {field: vertical, unit: factor, description: "The binning down, such as 2."}
  CCD_COMPRESSION:
    field: compression
    role: setting
    description: "Whether the driver compresses each frame of the sensor before it sends it."
  CCD1:
    field: imageData
    role: reading
    description: "The last frame of the sensor. The operator never asks for its data, so the status holds its state alone."
  GUIDER_COMPRESSION:
    field: guiderCompression
    role: setting
    description: "Whether the driver compresses each frame of the guide head before it sends it."
  CCD2:
    field: guiderImageData
    role: reading
    description: "The last frame of the guide head. The operator never asks for its data, so the status holds its state alone."
  TELESCOPE_TIMED_GUIDE_NS:
    field: guideNorthSouth
    role: command
    description: "A guide pulse to the north or to the south through the camera's ST-4 port, in milliseconds."
    members:
      TIMED_GUIDE_N: {field: north, unit: ms, description: "The length of a pulse to the north, in milliseconds."}
      TIMED_GUIDE_S: {field: south, unit: ms, description: "The length of a pulse to the south, in milliseconds."}
  TELESCOPE_TIMED_GUIDE_WE:
    field: guideWestEast
    role: command
    description: "A guide pulse to the west or to the east through the camera's ST-4 port, in milliseconds."
    members:
      TIMED_GUIDE_W: {field: west, unit: ms, description: "The length of a pulse to the west, in milliseconds."}
      TIMED_GUIDE_E: {field: east, unit: ms, description: "The length of a pulse to the east, in milliseconds."}
  CCD_FRAME_TYPE:
    field: frameType
    role: command
    description: "The type of the sensor's next frame: light, bias, dark, or flat."
  GUIDER_FRAME_TYPE:
    field: guiderFrameType
    role: command
    description: "The type of the guide head's next frame: light, bias, dark, or flat."
  CCD_CFA:
    field: cfa
    role: reading
    description: "The color filter array of a color sensor, which a client needs to debayer each frame."
    members:
      CFA_OFFSET_X: {field: offsetX, description: "The column where the pattern starts."}
      CFA_OFFSET_Y: {field: offsetY, description: "The row where the pattern starts."}
      CFA_TYPE: {field: type, description: "The pattern, such as `RGGB`."}
  SCOPE_INFO:
    field: scopeInfo
    role: tree
    description: "The optics in front of the camera, which the driver writes into the FITS header of each frame. The operator writes it from the train's `OpticalTube`."
    members:
      FOCAL_LENGTH: {field: focalLength, unit: mm, description: "The focal length, in millimeters."}
      APERTURE: {field: aperture, unit: mm, description: "The aperture, in millimeters."}
  WCS_CONTROL:
    field: wcs
    role: setting
    description: "Whether the driver writes the world coordinate system keywords into the FITS header of each frame."
  UPLOAD_MODE:
    field: uploadMode
    role: command
    description: "Where the driver sends each frame: to the client, to a local file, or to both."
  UPLOAD_SETTINGS:
    field: uploadSettings
    role: command
    description: "Where the driver saves a frame that it saves to a local file."
    members:
      UPLOAD_DIR: {field: directory, description: "The directory, in the driver's container."}
      UPLOAD_PREFIX: {field: prefix, description: "The start of each file's name."}
  CCD_FAST_TOGGLE:
    field: fastExposure
    role: command
    description: "Whether the camera starts the next exposure as soon as it reads the last one, for the count in `fastCount`."
  CCD_FAST_COUNT:
    field: fastCount
    role: command
    unit: frames
    description: "How many frames a fast exposure takes, in frames. The driver counts it down."
  CCD_VIDEO_STREAM:
    field: videoStream
    role: command
    description: "Turns the video stream of the sensor on or off."
  STREAM_FULL_DEPTH:
    field: streamDepth
    role: command
    description: "The depth of each pixel of the video stream, 8 or 16 bits."
  STREAM_DELAY:
    field: streamDelay
    role: reading
    unit: s
    description: "The delay between the frames of the video stream, in seconds."
  STREAMING_EXPOSURE:
    field: streamingExposure
    role: command
    description: "The exposure of each frame of the video stream."
    members:
      STREAMING_EXPOSURE_VALUE: {field: duration, unit: s, description: "The length of each exposure, in seconds. Some cameras do not control it."}
      STREAMING_DIVISOR_VALUE: {field: divisor, unit: count, description: "The stream sends one frame in this many. 1 sends every frame."}
  FPS:
    field: fps
    role: reading
    description: "The frame rate of the video stream, in frames per second."
    members:
      EST_FPS: {field: instant, unit: fps, description: "The rate of the last frames, in frames per second."}
      AVG_FPS: {field: average, unit: fps, description: "The average rate over one second, in frames per second."}
  RECORD_STREAM:
    field: recordStream
    role: command
    description: "Starts or stops a recording of the video stream, with no end, for the time, or for the frames in `recordOptions`."
  RECORD_FILE:
    field: recordFile
    role: command
    description: "The file that a recording of the video stream writes."
    members:
      RECORD_FILE_DIR: {field: directory, description: "The directory, in the driver's container."}
      RECORD_FILE_NAME: {field: name, description: "The file's name."}
  RECORD_OPTIONS:
    field: recordOptions
    role: command
    description: "When a recording of the video stream ends."
    members:
      RECORD_DURATION: {field: duration, unit: s, description: "The length of a recording, in seconds."}
      RECORD_FRAME_TOTAL: {field: frames, unit: frames, description: "The length of a recording, in frames."}
  CCD_STREAM_FRAME:
    field: streamFrame
    role: command
    description: "The area of the sensor that the video stream reads, in pixels."
    members:
      X: {field: x, unit: px, description: "The left edge of the area, in pixels."}
      "Y": {field: "y", unit: px, description: "The top edge of the area, in pixels."}
      WIDTH: {field: width, unit: px, description: "The width of the area, in pixels."}
      HEIGHT: {field: height, unit: px, description: "The height of the area, in pixels."}
  CCD_STREAM_ENCODER:
    field: streamEncoder
    role: command
    description: "The encoder of the video stream, raw or MJPEG."
  CCD_STREAM_RECORDER:
    field: streamRecorder
    role: command
    description: "The format of a recording of the video stream."
  LIMITS:
    field: streamLimits
    role: command
    description: "The limits of the video stream."
    members:
      LIMITS_BUFFER_MAX: {field: bufferMax, unit: MB, description: "The largest buffer of frames, in megabytes."}
      LIMITS_PREVIEW_FPS: {field: previewFps, unit: fps, description: "The greatest rate that the stream sends to a client, in frames per second."}
  DSP_ACTIVATE_CONVOLUTION:
    field: dspConvolution
    role: command
    description: "Turns the convolution of each frame on or off."
  DSP_ACTIVATE_DFT:
    field: dspDft
    role: command
    description: "Turns the discrete Fourier transform of each frame on or off."
  DSP_ACTIVATE_IDFT:
    field: dspIdft
    role: command
    description: "Turns the inverse discrete Fourier transform of each frame on or off."
  DSP_ACTIVATE_SPECTRUM:
    field: dspSpectrum
    role: command
    description: "Turns the spectrum of each frame on or off."
  DSP_ACTIVATE_HISTOGRAM:
    field: dspHistogram
    role: command
    description: "Turns the histogram of each frame on or off."
  DSP_ACTIVATE_WAVELETS:
    field: dspWavelets
    role: command
    description: "Turns the wavelet transform of each frame on or off."
  CCD_GAIN:
    field: gain
    role: setting
    unit: driver
    description: "The sensor's gain, in the driver's own units."
  CCD_OFFSET:
    field: offset
    role: setting
    unit: driver
    description: "The level that the sensor adds to each pixel, in the driver's own units."
  CCD_COOLER:
    field: cooler
    role: command
    description: "Turns the sensor's cooler on or off. The `cool` and `warm` actions change it."
  CCD_COOLER_POWER:
    field: coolerPower
    role: reading
    unit: percent
    description: "The power that the cooler draws, in percent of its greatest power."
