# The topology of observatory-operator plan 03, by hand: the telescope,
# CCD, and focuser simulators, each in its own pod, and one INDI server
# that reaches them through indi-shim.
#
#   kubectl apply -k observatory-operator/topology
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observatory
resources:
  - namespace.yaml
  - devices.yaml
  - server.yaml
