# The INDI server. Each device is a link to indi-shim, named for the
# device's Service, and indiserver starts the link as if it were the
# driver. The image has no shell, so the shim writes its own links in
# an init container.
#
# indiserver restarts a driver that exits at most -r times, and the
# count never resets. Each restart of a device pod spends one, so the
# server takes the largest count its parser holds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indiserver
  labels: {app.kubernetes.io/part-of: observatory, observatory.liken.sh/role: server}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: indiserver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: indiserver, app.kubernetes.io/part-of: observatory, observatory.liken.sh/role: server}
    spec:
      initContainers:
        - name: links
          image: ghcr.io/liken-sh/indi:20261005-1
          command: [/usr/bin/indi-shim, link, /run/indi/drivers, "mount:7625", "ccd:7625", "focuser:7625"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts: [{name: drivers, mountPath: /run/indi/drivers}]
      containers:
        - name: indiserver
          image: ghcr.io/liken-sh/indi:20261005-1
          args: [-v, -r, "2147483647", /run/indi/drivers/mount:7625, /run/indi/drivers/ccd:7625, /run/indi/drivers/focuser:7625]
          ports: [{name: indi, containerPort: 7624}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: drivers, mountPath: /run/indi/drivers}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: drivers, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: indiserver
  labels: {app.kubernetes.io/part-of: observatory}
spec:
  selector: {app.kubernetes.io/name: indiserver}
  ports: [{name: indi, port: 7624, targetPort: indi}]
