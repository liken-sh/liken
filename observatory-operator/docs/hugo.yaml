# The manual for observatory-operator. The theme is brand/, at the top
# of this repository, which every liken site uses.
baseURL: https://liken.sh/observatory/

# The crdref generator puts an id on each field's table row, in a raw
# HTML span, so that a link can point at one field. Goldmark drops raw
# HTML unless this is set. It is safe here because every page of the
# site is written in this repository.
markup:
  goldmark:
    renderer:
      unsafe: true
title: observatory-operator
# Hugo looks for the theme under themesDir. Pointing it at the
# repository root builds the site with brand/ from the same commit.
themesDir: ../..
theme: brand

# The theme's navigation shows a link to this repository, and the
# sidebar title of the manual is the last segment of this URL.
params:
  repository: https://github.com/liken-sh/liken/tree/main/observatory-operator
  # Adds a footer link on every page to the test coverage report at
  # /coverage.html.
  coverage: true

# The site is a manual, so it has no taxonomies and no RSS feeds. Hugo
# still writes the sitemap, which crawlers read.
disableKinds: [taxonomy, term, rss]

# Every page renders as HTML for people and as its Markdown source for
# agents and scripts, so the Markdown of / is /index.md. The theme
# writes the Markdown only when the site declares this format
# (brand/theme.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site publishes deploy/ unchanged at /deploy/<file>.yaml, so you
# can pass a URL to `kubectl apply -f` or list it in a Kustomization
# without a clone. Declaring any mount replaces the site's default
# mounts, so the content mount is listed again. The theme's own mounts
# are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
    # The example observatory of simulators, which the install guide
    # applies by URL.
    - source: ../examples
      target: static/examples
