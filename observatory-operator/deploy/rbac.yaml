# The operator's identity. It reads the resources of the group in every
# namespace and runs each observatory's pods, Services, ConfigMaps,
# claims, and Jobs in the namespace of its resources, so a ClusterRole
# grants what it needs. The cluster owner chooses the namespaces, and
# the operator writes nothing outside the ones that hold the group's
# resources.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observatory-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observatory-operator
rules:
  # A watch of each kind reads the inventory and the reservations, and
  # get reads one reservation again after a write that met a conflict.
  - apiGroups: [observatory.liken.sh]
    resources:
      - observatories
      - telescopes
      - opticaltubes
      - opticaltrains
      - mounts
      - cameras
      - filterwheels
      - focusers
      - rotators
      - dustcaps
      - flatpanels
      - polaraligners
      - gpses
      - domes
      - weatherstations
      - skyqualitymeters
      - switches
      - receivers
      - guiders
      - reservations
    verbs: [get, list, watch]
  # The operator writes every status with a PUT to the status
  # subresource, which is the update verb, and never writes a spec.
  - apiGroups: [observatory.liken.sh]
    resources:
      - observatories/status
      - telescopes/status
      - opticaltubes/status
      - opticaltrains/status
      - mounts/status
      - cameras/status
      - filterwheels/status
      - focusers/status
      - rotators/status
      - dustcaps/status
      - flatpanels/status
      - polaraligners/status
      - gpses/status
      - domes/status
      - weatherstations/status
      - skyqualitymeters/status
      - switches/status
      - receivers/status
      - guiders/status
      - reservations/status
    verbs: [update]
  # A merge patch of the metadata of a reservation, a device, a
  # telescope, or an observatory adds and removes its finalizer, and a
  # merge patch of any resource with procedures removes its retry
  # annotation.
  - apiGroups: [observatory.liken.sh]
    resources:
      - reservations
      - observatories
      - telescopes
      - mounts
      - cameras
      - filterwheels
      - focusers
      - rotators
      - dustcaps
      - flatpanels
      - polaraligners
      - gpses
      - domes
      - weatherstations
      - skyqualitymeters
      - switches
      - receivers
    verbs: [patch]
  # The topology: a pod and a Service for each device and each INDI
  # server. The watches select them by the operator's label.
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch, create, delete]
  # A merge patch of a server pod's annotation changes the devices that
  # its running server starts.
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
  # Each guider's ConfigMap holds PHD2's profile and weston's config.
  # The operator replaces it with an update when the profile changes.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  # The claim of a device on real hardware, made from its spec.claim.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [create, delete]
  # The Job of each job action. The watch selects the Jobs by the
  # operator's label, and a run that runs again deletes the Job of the
  # earlier run before it creates its own.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, watch, create, delete]
  # The Events of each resource's transitions and each reservation's
  # steps. A repeat of an Event within 10 minutes patches its count.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observatory-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observatory-operator
subjects:
  - kind: ServiceAccount
    name: observatory-operator
    namespace: liken-system
