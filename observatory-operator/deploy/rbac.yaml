# The operator watches the observatory.liken.sh resources in every
# namespace and creates their pods, Services, ConfigMaps, resource claim
# templates, and Jobs in the namespace of each resource, so it needs a
# ClusterRole. It writes only in namespaces that hold those resources,
# except for its Lease, which is in its own namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observatory-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observatory-operator
rules:
  # The operator watches every kind. It also reads one resource with get
  # before it patches that resource's finalizers.
  - apiGroups: [observatory.liken.sh]
    resources:
      - observatories
      - telescopes
      - opticaltubes
      - opticaltrains
      - mounts
      - cameras
      - filterwheels
      - focusers
      - rotators
      - dustcaps
      - flatpanels
      - polaraligners
      - gpses
      - domes
      - weatherstations
      - switches
      - receivers
      - guiders
      - reservations
      - horizons
    verbs: [get, list, watch]
  # The operator writes status with a PUT to the status subresource,
  # which needs update. A Horizon has no status.
  - apiGroups: [observatory.liken.sh]
    resources:
      - observatories/status
      - telescopes/status
      - opticaltubes/status
      - opticaltrains/status
      - mounts/status
      - cameras/status
      - filterwheels/status
      - focusers/status
      - rotators/status
      - dustcaps/status
      - flatpanels/status
      - polaraligners/status
      - gpses/status
      - domes/status
      - weatherstations/status
      - switches/status
      - receivers/status
      - guiders/status
      - reservations/status
    verbs: [update]
  # Merge patches add and remove the operator's finalizer, and remove
  # the observatory.liken.sh/retry annotation after the operator reruns
  # the failed runs.
  - apiGroups: [observatory.liken.sh]
    resources:
      - reservations
      - observatories
      - telescopes
      - mounts
      - cameras
      - filterwheels
      - focusers
      - rotators
      - dustcaps
      - flatpanels
      - polaraligners
      - gpses
      - domes
      - weatherstations
      - switches
      - receivers
    verbs: [patch]
  # A pod and a Service for each device and each INDI server. The
  # operator watches them with the label selector for its own objects.
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch, create, delete]
  # The operator patches an annotation on an INDI server's pod to change
  # which drivers the running server starts.
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
  # Each guider's ConfigMap holds the PHD2 profile and the weston
  # configuration. The operator updates it when the profile changes.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, delete]
  # PowerOn reads the PersistentVolumeClaim that a reservation's
  # spec.outbox names, and fails before it creates a pod when the claim
  # does not exist. The operator does not watch claims.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  # A device on real hardware gets a ResourceClaimTemplate built from
  # its spec.claim. Kubernetes creates a ResourceClaim from the template
  # for each pod and deletes it with the pod, so the operator never
  # writes a ResourceClaim.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaimtemplates]
    verbs: [create, delete]
  # One Job for each job action. The operator watches Jobs with the
  # label selector for its own objects. A run that starts again deletes
  # the Job of the earlier run before it creates a new one.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, watch, create, delete]
  # Events for the condition transitions of each resource and the steps
  # of each reservation. A repeated Event patches the count of the
  # existing one.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observatory-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observatory-operator
subjects:
  - kind: ServiceAccount
    name: observatory-operator
    namespace: liken-system
---
# The Lease that elects the operator copy that acts (leader.go).
# client-go's election reads the Lease with get, and takes, renews, and
# releases it with update. This is a namespaced Role because the Lease
# is in the operator's own namespace. A ClusterRole would also reach the
# Leases in kube-node-lease, which are the kubelets' heartbeats.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observatory-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [observatory-operator]
    verbs: [get, update]
  # RBAC cannot match resourceNames on create, so the create rule has
  # none. The first copy to start creates the Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observatory-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observatory-operator-lease
subjects:
  - kind: ServiceAccount
    name: observatory-operator
    namespace: liken-system
