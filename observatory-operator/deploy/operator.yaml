# The operator: one unprivileged Deployment in liken-system. It reads
# the resources in every namespace, runs each reserved telescope's pods
# in the telescope's namespace, and drives the devices through each
# INDI server's Service. It keeps no state outside the API server: a
# reservation's status records every step, and a copy that takes the
# Lease continues from it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatory-operator
  labels:
    # The base binary selects on this label to find the operator's
    # Deployment, read its image version, and pull the matching -cli
    # image.
    cli.liken.sh/plugin: observatory
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. Two copies that acted at once would each run the same
  # reservation's steps on the same devices, so only the copy that
  # holds the Lease observatory-operator acts (leader.go). Every other
  # copy waits for it.
  replicas: 1
  selector:
    matchLabels:
      app: observatory-operator
  # A rollout starts the new pod beside the old one, and stops the old
  # one only when the new one runs. The new pod waits for the Lease while
  # the old one leads. On SIGTERM the old pod stops its runners, its
  # status writer, and its INDI connections, waits for their last
  # writes, and releases the Lease. The new pod takes it on its next
  # read, within about 11 seconds, and reads the holder of each
  # telescope from the reservations' status. So the image pull happens
  # while the old pod still leads.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: observatory-operator
    spec:
      serviceAccountName: observatory-operator
      # A shutdown waits until every writer has returned, and the client
      # ends each request in 15 s at most. Then the release waits up to
      # 11 s for client-go's election to end, and up to 5 s more for the
      # release that follows a late renewal. One write in flight and the
      # release take up to 31 s, past the default grace of 30 s, so the
      # grace is 60 s. A kill before the release leaves the Lease to
      # expire, and a waiting copy then takes it 30 to 41 s after the
      # last renewal instead of within about 11 s.
      terminationGracePeriodSeconds: 60
      containers:
        - name: operator
          image: ghcr.io/liken-sh/observatory-operator:latest
          # The pod's name and namespace name the Lease and the identity
          # that holds it, so the operator exits when either is unset.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The pod runs on the cluster network, so it takes port 9200,
            # the port of root plan 65. The copy that holds the Lease
            # serves /metrics there. The deploy/monitoring component is
            # what a cluster owner adds to scrape it, and the base runs
            # the same either way. An empty value turns the listener off.
            - name: OBSERVATORY_METRICS_ADDRESS
              value: :9200
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # The watches hold every resource of the group, and each
            # INDI connection holds every property of its server's
            # devices: about 70 for a camera.
            limits:
              memory: 256Mi
