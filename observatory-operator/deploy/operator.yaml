# The operator runs as one unprivileged Deployment in liken-system. It
# watches the observatory resources in every namespace, creates the pods
# of each reserved telescope in the telescope's namespace, and controls
# the devices through each INDI server's Service. It keeps no state
# outside the API server. A reservation's status records every step it
# has finished, so a copy that takes over the Lease continues from
# there.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observatory-operator
  labels:
    # The liken toolkit's base binary finds this Deployment by this
    # label, reads its image version, and pulls the -cli image with the
    # same version.
    cli.liken.sh/plugin: observatory
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. Two copies that acted at once would each run the same
  # reservation's steps on the same devices. So only the copy that holds
  # the Lease named observatory-operator acts (leader.go), and any other
  # copy waits until that Lease is free.
  replicas: 1
  selector:
    matchLabels:
      app: observatory-operator
  # A rollout starts the new pod before it stops the old one, and stops
  # the old one only when the new one is running. So the new pod pulls
  # its image while the old pod still holds the Lease. On SIGTERM the
  # old pod stops its runners, its status writer, and its INDI
  # connections, waits for their last writes, and releases the Lease.
  # The new pod takes the Lease on its next read, within about 11
  # seconds, and then reads from the reservations' status which
  # reservation holds each telescope.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: observatory-operator
    spec:
      serviceAccountName: observatory-operator
      # Shutdown waits for every writer to return, and the client ends
      # each request after 15 s at most. Then the release waits up to
      # 11 s for client-go's election to end, and up to 5 s more for the
      # release that follows a late renewal. A write in flight plus the
      # release can take 31 s, which is longer than the default grace
      # period of 30 s, so the grace period is 60 s. If the pod is
      # killed before it releases the Lease, the Lease expires, and a
      # waiting copy takes it 30 to 41 s after the last renewal, not
      # within about 11 s.
      terminationGracePeriodSeconds: 60
      containers:
        - name: operator
          image: ghcr.io/liken-sh/observatory-operator:latest
          # The operator creates its Lease in the pod's namespace and
          # uses the pod's name as the Lease holder's identity. It exits
          # at startup when either variable is unset.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Only the copy that holds the Lease serves /metrics. The
            # Kustomize component in deploy/monitoring adds a PodMonitor
            # that scrapes it. An empty value turns the listener off.
            - name: OBSERVATORY_METRICS_ADDRESS
              value: :9200
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # The operator caches every resource of the group from its
            # watches, and each INDI connection caches every property of
            # its server's devices.
            limits:
              memory: 256Mi
