# A `Reservation` gives one holder the use of one `Telescope`. The
# other resources only describe equipment. The operator starts a
# telescope's pods only while a `Reservation` of that telescope is
# active.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reservations.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Reservation
    listKind: ReservationList
    plural: reservations
    singular: reservation
    shortNames: [rsv]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      # A holder that is a program, such as astrophotography-operator,
      # lists and watches only its own reservations, with the field
      # selector spec.holder=<its name>.
      selectableFields:
        - jsonPath: .spec.telescope
        - jsonPath: .spec.holder
      additionalPrinterColumns:
        - name: Telescope
          type: string
          jsonPath: .spec.telescope
        - name: Holder
          type: string
          jsonPath: .spec.holder
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Step
          type: string
          jsonPath: .status.step
        - name: Message
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].message'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Start
          type: string
          jsonPath: .spec.start
          priority: 1
        - name: End
          type: string
          jsonPath: .spec.end
          priority: 1
        - name: Host
          type: string
          jsonPath: .status.endpoint.host
          priority: 1
        - name: Port
          type: integer
          jsonPath: .status.endpoint.port
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 32
              message: >-
                a Reservation name is at most 32 characters, the limit
                of every observatory.liken.sh kind. observatory-operator
                builds the names of pods and Services, and the values of
                Job labels, from the names of observatory.liken.sh
                resources, and Kubernetes limits each of those to 63
                characters. The limit of 32 leaves room for a suffix
                longer than any that the operator adds.
          description: >-
            A `Reservation` gives one holder, the person or program that
            `spec.holder` names, the use of one `Telescope`.
            At `spec.start`, or at once when there is no start, the
            operator starts the telescope's equipment. At `spec.end`, or
            when you delete the `Reservation`, it runs the deactivation
            procedures, such as parking the mount, warming the cameras,
            and closing the dust caps, and then stops the pods. The
            reservation holds the telescope from the end of its `Wait`
            step until its phase is `Released`. `status.steps` lists each
            step and its state.
          required: [spec]
          properties:
            spec:
              type: object
              required: [telescope, holder]
              description: "Which telescope to use, who uses it, when, where the frames are written, and the FITS keywords to add."
              x-kubernetes-validations:
                - rule: "!has(self.start) || !has(self.end) || self.end > self.start"
                  message: "spec.end must be after spec.start"
              properties:
                telescope:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `Telescope` to reserve. It cannot
                    change after the reservation is created.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "spec.telescope cannot change; create another Reservation"
                holder:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: >-
                    Who uses the telescope, such as `desktop` for a
                    person at KStars. The operator shows it in messages
                    such as `In use by desktop`. `astrophotography-operator`
                    acts only on the reservations whose holder is
                    `astrophotography-operator`.
                start:
                  type: string
                  format: date-time
                  description: >-
                    When activation begins, as an RFC 3339 time.
                    Optional. With no start, activation begins when the
                    reservation is created.
                end:
                  type: string
                  format: date-time
                  description: >-
                    When deactivation begins, as an RFC 3339 time.
                    Optional. With no end, the reservation lasts until
                    it is deleted.
                outbox:
                  type: object
                  required: [claimName]
                  description: >-
                    The volume that the telescope's imaging cameras write
                    their frames to. Optional. Each `Camera` of the
                    telescope mounts the claim at `/outbox`, except a
                    camera that a `Guider` guides with. The `Configure`
                    step sets the driver's `UPLOAD_DIR` to the directory
                    that has the camera's name, such as
                    `/outbox/east-main`, and its `UPLOAD_MODE` to
                    `UPLOAD_BOTH`, so the driver saves each frame in the
                    outbox and also sends it to a desktop client. Without
                    an outbox, the operator leaves the upload settings
                    alone, and a driver that a client tells to save
                    frames writes them to the pod's `/tmp`, which
                    Kubernetes deletes when the pod stops. An edit takes
                    effect at the next session.
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                      description: >-
                        The name of a `PersistentVolumeClaim` in the
                        reservation's namespace. The `PowerOn` step fails
                        when it does not exist. A claim that exists and
                        cannot be mounted on the camera's node, such as a
                        `ReadWriteOnce` volume bound on another node,
                        leaves the camera's pod `Pending`, and the
                        `StartDevices` step reports the scheduler's
                        message. A `ReadWriteOncePod` claim can be
                        mounted by one pod only, so a second imaging
                        camera, or the worker of
                        `astrophotography-operator` as the holder,
                        cannot start beside the first camera.
                fitsKeywords:
                  type: array
                  maxItems: 64
                  description: >-
                    The FITS keywords that the telescope's imaging
                    cameras write into the header of every frame, such
                    as `OBSERVER` or `TELESCOP`. Optional. The
                    `Observatory`, the `Telescope`, the `Camera`, and
                    the `Reservation` can each declare keywords, and the
                    operator merges them in that order: a keyword at a
                    later level replaces the value and the comment of
                    the same name at an earlier one. The `PowerOn` step
                    records the merged list of each `Camera` that no
                    `Guider` guides with, and the `Configure` step
                    writes it to the camera's `FITS_HEADER`, so the
                    driver writes the keywords into each frame when it
                    creates the file. An edit takes effect at the next
                    session. The API server refuses a keyword that the
                    driver writes from what it measures, such as
                    `EXPTIME` or `DATE-OBS`, because a declared value
                    would replace the measured one. It refuses `FRAMEID`
                    too, because `astrophotography-operator` writes a
                    new identity into each frame that it takes.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, value]
                    description: "One keyword: its name, its value, and a comment."
                    properties:
                      name:
                        type: string
                        maxLength: 8
                        description: >-
                          The keyword, such as `OBSERVER`: 1 to 8 of the
                          capital letters `A` to `Z`, the digits, `-`,
                          and `_`. `INSTRUME` and `TELESCOP` are
                          allowed, because the driver fills them with
                          the names of INDI devices, such as `CCD
                          Simulator`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[A-Z0-9_-]{1,8}$')"
                            message: "a FITS keyword name is 1 to 8 of the capital letters A to Z, the digits, '-', and '_'"
                          - rule: "!(self in ['SIMPLE', 'BITPIX', 'NAXIS', 'NAXIS1', 'NAXIS2', 'EXTEND', 'BZERO', 'BSCALE', 'ROWORDER', 'EXPTIME', 'CCD-TEMP', 'PIXSIZE1', 'PIXSIZE2', 'XBINNING', 'YBINNING', 'XPIXSZ', 'YPIXSZ', 'FRAME', 'IMAGETYP', 'FILTER', 'FOCALLEN', 'APTDIA', 'ROTATANG', 'FOCUSPOS', 'FOCUSTEM', 'SCALE', 'SITELAT', 'SITELONG', 'AIRMASS', 'OBJCTAZ', 'OBJCTALT', 'OBJCTRA', 'OBJCTDEC', 'RA', 'DEC', 'PIERSIDE', 'EQUINOX', 'DATE-OBS', 'GAIN', 'OFFSET', 'DARKTIME', 'MPSAS', 'BAYERPAT', 'XBAYROFF', 'YBAYROFF', 'DATAMIN', 'DATAMAX', 'CTYPE1', 'CTYPE2', 'CRVAL1', 'CRVAL2', 'CRPIX1', 'CRPIX2', 'CDELT1', 'CDELT2', 'CROTA1', 'CROTA2', 'SECPIX1', 'SECPIX2', 'RADECSYS', 'FRAMEID', 'COMMENT', 'HISTORY', 'END'])"
                            messageExpression: >-
                              self + (self in ['COMMENT', 'HISTORY',
                              'END'] ? ' is a keyword that FITS reserves
                              for a card with no value' : self in
                              ['FRAMEID'] ? ' is a keyword that
                              astrophotography-operator writes, with a
                              new value for each frame' : ' is a keyword
                              that the camera\'s driver writes from what
                              it measures, and a declared value would
                              replace the measured one')
                      value:
                        type: string
                        minLength: 1
                        maxLength: 68
                        description: >-
                          The value, at most 68 characters, the longest
                          text that one 80-column card holds. The driver
                          writes a value that reads as a number, such as
                          `2026` or `-4.5`, as a number, and any other
                          value as quoted text. A value cannot hold `/`,
                          because the driver writes each `/` in a value
                          as `\`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
                          - rule: "!self.contains('/')"
                            message: "the camera's driver writes each '/' in a value as '\\', so the header would not hold the value declared"
                      comment:
                        type: string
                        maxLength: 47
                        description: >-
                          The comment that follows the value on the
                          card. Optional. At most 47 characters, which
                          fit beside a number.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
            status:
              type: object
              description: >-
                What the operator observes.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: >-
                    The `metadata.generation` of the spec that the
                    operator last acted on.
                phase:
                  type: string
                  enum: [Scheduled, Activating, Ready, Deactivating, Released, Failed]
                  description: >-
                    The phase of the reservation. `Scheduled`: waiting
                    for `spec.start`. `Activating`: the activation
                    steps are running. `Ready`: the telescope is ready,
                    and `status.endpoint` has the address of its
                    server. `Deactivating`: the deactivation steps are
                    running. `Released`: the deactivation steps are
                    done, and the devices are safe to power off.
                    `Failed`: a step failed, and the message of the
                    `Ready` condition names it.
                step:
                  type: string
                  enum: [Wait, StartSite, Requires, PowerOn, StartDevices, Connect, Configure, Activation, StartGuider, StopWork, Deactivation, StopGuider, Disconnect, StopDevices, PowerOff, StopSite, Abort]
                  description: >-
                    The step that is running, or the step that failed.
                    It is empty while the phase is `Ready` or
                    `Released`.
                steps:
                  type: array
                  description: >-
                    Every step, in the order it runs. The list starts
                    with the activation steps: `Wait`, `StartSite`,
                    `Requires`, `PowerOn`, `StartDevices`, `Connect`,
                    `Configure`, `Activation`, and `StartGuider`. The
                    operator adds the deactivation steps when
                    deactivation begins: `StopWork`, `Deactivation`,
                    `StopGuider`, `Disconnect`, `StopDevices`,
                    `PowerOff`, and `StopSite`. A step starts only when
                    the step before it is `Done` or `Skipped`. `Wait`
                    and `Requires` wait until the conditions in the
                    `spec.requires` of the equipment are true. When
                    either step is still waiting at the next
                    astronomical dawn, it becomes `Skipped` with the
                    conditions it waited for in its summary, and the
                    reservation ends without powering on the
                    telescope's equipment.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, state]
                    description: "One step."
                    properties:
                      # Abort stays in the enum because a stored
                      # reservation can still hold it, and every update
                      # of that reservation validates its steps again.
                      name:
                        type: string
                        enum: [Wait, StartSite, Requires, PowerOn, StartDevices, Connect, Configure, Activation, StartGuider, StopWork, Deactivation, StopGuider, Disconnect, StopDevices, PowerOff, StopSite, Abort]
                        description: >-
                          The step's name. A stored reservation can
                          still have the name `Abort`. The operator
                          reads it as `StopWork` and writes `StopWork`
                          in its place.
                      state:
                        type: string
                        enum: [Pending, Running, Done, Failed, Skipped]
                        description: >-
                          The step's progress: `Pending`, `Running`,
                          `Done`, `Failed`, or `Skipped` when it has
                          nothing to do.
                      startTime:
                        type: string
                        format: date-time
                        description: "When the step began to run."
                      stopTime:
                        type: string
                        format: date-time
                        description: "When the step ended."
                      summary:
                        type: string
                        description: >-
                          What the step is waiting for, or what it did.
                          When one device is delaying the step, the
                          summary names it.
                      actions:
                        type: array
                        description: >-
                          The actions of the procedures that the
                          `Activation` or `Deactivation` step waited for,
                          each with the resource it belongs to. The
                          resource's `status.procedures` has the same
                          record.
                        items:
                          type: object
                          required: [kind, name, action, state]
                          description: >-
                            One action of one resource.
                          properties:
                            kind:
                              type: string
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              description: >-
                                The name of the resource.
                            action:
                              type: string
                              description: >-
                                The action as the resource's YAML writes it, such as
                                `state: Parked` or `cool: -10 °C within
                                0.5 °C`.
                            state:
                              type: string
                              enum: [Pending, Running, Done, Failed, Skipped]
                              description: >-
                                The action's progress: `Pending`,
                                `Running`, `Done`, `Failed`, or
                                `Skipped` when it had nothing to do.
                            startTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action began to run.
                            stopTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action ended.
                            summary:
                              type: string
                              description: >-
                                What the action waits for or did.
                endpoint:
                  type: object
                  required: [service, host, port]
                  description: >-
                    The telescope's INDI server, while the phase is
                    `Ready`. KStars connects to its `host` and `port`.
                  properties:
                    service:
                      type: string
                      description: "The name of the server's `Service`."
                    host:
                      type: string
                      description: "The `Service`'s DNS name in the cluster."
                    port:
                      type: integer
                      format: int32
                      description: "The INDI port of the `Service`, 7624."
                session:
                  type: object
                  description: >-
                    A copy of the specs that the session started with.
                    While the reservation holds its telescope, the
                    operator reads this copy in place of the resources'
                    current specs, so an edit to the equipment during
                    the session takes effect at the next session. That
                    covers a device's `spec.telescope`,
                    `spec.opticalTrain`, `spec.observatory`, driver,
                    power, and claim, the `Telescope`'s
                    `spec.observatory`, each `OpticalTrain`,
                    `OpticalTube`, and `Guider`, the reservation's
                    `spec.outbox`, and every `spec.fitsKeywords`. The
                    `StartSite` step writes `observatory` and `site`, and
                    `PowerOn` writes the rest, before the operator creates
                    any pod. When you set the `observatory.liken.sh/retry`
                    annotation on a failed activation step, the operator
                    writes the copy again from the current specs before
                    it runs the step again. Nothing else changes it.
                  properties:
                    observatory:
                      type: string
                      description: "The observatory of the reservation's telescope."
                    site:
                      type: object
                      description: >-
                        The devices of the observatory's server, by kind and
                        name, such as `Dome/lab`, as the server ran them when
                        this reservation's `StartSite` began. The telescopes
                        of one observatory share its server, and the server
                        runs the devices in the `site` of every reservation
                        that holds one of them. Absent when the observatory
                        had no devices. A device that you create on the
                        observatory during the session does not run until
                        the next session.
                      additionalProperties:
                        type: object
                        description: >-
                          One device as the session started it.
                        properties:
                          uid:
                            type: string
                            description: >-
                              The device's `metadata.uid`. A device deleted and created again with the
                              same name has another UID, so the record does not
                              apply to it.
                          telescope:
                            type: string
                            description: "The device's `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The device's `spec.opticalTrain`."
                          observatory:
                            type: string
                            description: "The device's `spec.observatory`."
                          driver:
                            type: object
                            required: [name]
                            description: "The device's `spec.driver`."
                            properties:
                              name:
                                type: string
                                description: "The driver's executable."
                              image:
                                type: string
                                description: "The container image that holds the driver."
                          device:
                            type: object
                            required: [kind, name]
                            description: "The device's `spec.device`: the resource whose driver serves it."
                            properties:
                              kind:
                                type: string
                                description: "The kind of the resource that runs the driver."
                              name:
                                type: string
                                description: "The name of the resource that runs the driver."
                          power:
                            type: object
                            required: [switch, output]
                            description: "The device's `spec.power`: the output that activation switched on, and that `PowerOff` switches off."
                            properties:
                              switch:
                                type: string
                                description: "The name of the `Switch`."
                              output:
                                type: integer
                                format: int32
                                description: "The output's number."
                          claim:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: "The device's `spec.claim`, the `ResourceClaimSpec` of its pod's claim."
                          guides:
                            type: boolean
                            description: >-
                              `true` for a camera that a `Guider` of the
                              telescope guides with, whose pod runs on the
                              node of the telescope's server.
                    devices:
                      type: object
                      description: >-
                        The devices of the telescope's server, by kind and
                        name, such as `Camera/east-main`, as `PowerOn` started
                        them.
                      additionalProperties:
                        type: object
                        description: >-
                          One device as the session started it.
                        properties:
                          uid:
                            type: string
                            description: >-
                              The device's `metadata.uid`. A device deleted and created again with the
                              same name has another UID, so the record does not
                              apply to it.
                          telescope:
                            type: string
                            description: "The device's `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The device's `spec.opticalTrain`."
                          observatory:
                            type: string
                            description: "The device's `spec.observatory`."
                          driver:
                            type: object
                            required: [name]
                            description: "The device's `spec.driver`."
                            properties:
                              name:
                                type: string
                                description: "The driver's executable."
                              image:
                                type: string
                                description: "The container image that holds the driver."
                          device:
                            type: object
                            required: [kind, name]
                            description: "The device's `spec.device`: the resource whose driver serves it."
                            properties:
                              kind:
                                type: string
                                description: "The kind of the resource that runs the driver."
                              name:
                                type: string
                                description: "The name of the resource that runs the driver."
                          power:
                            type: object
                            required: [switch, output]
                            description: "The device's `spec.power`: the output that activation switched on, and that `PowerOff` switches off."
                            properties:
                              switch:
                                type: string
                                description: "The name of the `Switch`."
                              output:
                                type: integer
                                format: int32
                                description: "The output's number."
                          claim:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: "The device's `spec.claim`, the `ResourceClaimSpec` of its pod's claim."
                          guides:
                            type: boolean
                            description: >-
                              `true` for a camera that a `Guider` of the
                              telescope guides with, whose pod runs on the
                              node of the telescope's server.
                    trains:
                      type: object
                      description: "The spec of each `OpticalTrain` of the telescope, by name."
                      additionalProperties:
                        type: object
                        required: [telescope, opticalTube]
                        description: "One train's spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The train's `metadata.uid`. A train deleted and created again with the
                              same name has another UID, so the record does not
                              apply to it.
                          telescope:
                            type: string
                            description: "The train's `spec.telescope`."
                          opticalTube:
                            type: string
                            description: "The train's `spec.opticalTube`."
                    tubes:
                      type: object
                      description: >-
                        The spec of each `OpticalTube` of those trains, by
                        name. When a camera's driver restarts during the
                        session, the operator writes its `SCOPE_INFO` again
                        from these lengths.
                      additionalProperties:
                        type: object
                        required: [telescope, aperture, focalLength]
                        description: "One tube's spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The tube's `metadata.uid`. A tube deleted and created again with the
                              same name has another UID, so the record does not
                              apply to it.
                          telescope:
                            type: string
                            description: "The tube's `spec.telescope`."
                          aperture:
                            type: number
                            description: "The tube's `spec.aperture`, in millimeters."
                          focalLength:
                            type: number
                            description: "The tube's `spec.focalLength`, in millimeters."
                    guiders:
                      type: object
                      description: "The spec of each `Guider` of the telescope, by name."
                      additionalProperties:
                        type: object
                        required: [telescope, opticalTrain, pulses]
                        description: "One `Guider`'s spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The `Guider`'s `metadata.uid`. A `Guider` deleted and created again with the
                              same name has another UID, so the record does not
                              apply to it.
                          telescope:
                            type: string
                            description: "The `Guider`'s `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The `Guider`'s `spec.opticalTrain`."
                          pulses:
                            type: string
                            enum: [Mount, Camera]
                            description: "The `Guider`'s `spec.pulses`."
                    outbox:
                      type: object
                      required: [claimName]
                      description: >-
                        The reservation's `spec.outbox`, which the camera
                        pods of the session mount.
                      properties:
                        claimName:
                          type: string
                          description: "The name of the `PersistentVolumeClaim`."
                    fitsKeywords:
                      type: object
                      description: >-
                        The merged `spec.fitsKeywords` of each `Camera` of
                        the session that no `Guider` guides with, from the
                        `Observatory`, the `Telescope`, the `Camera`, and
                        the reservation. Each entry is keyed by the
                        camera's kind and name, such as `Camera/east-main`.
                        A camera whose merged list is empty has no entry.
                        The `Configure` step writes each list to its
                        camera's `FITS_HEADER`.
                      additionalProperties:
                        type: array
                        description: "The keywords of one camera, in the order of the header."
                        items:
                          type: object
                          required: [name, value]
                          description: "One keyword."
                          properties:
                            name:
                              type: string
                              description: "The keyword."
                            value:
                              type: string
                              description: "The value."
                            comment:
                              type: string
                              description: "The comment."
                conditions:
                  type: array
                  description: >-
                    `Ready` is `True` while the phase is `Ready`, so
                    `kubectl wait --for=condition=Ready` waits for the
                    telescope. When a step fails, `Ready` is `False` and
                    its message names the step and the device.
                    `SafeToPowerOff` is `True` when the deactivation
                    steps are done. `EditsPending` is present from the
                    `PowerOn` step until the phase is `Released`. It is
                    `True` with the reason `EditPending` while an edit
                    of `spec.outbox` or of a `spec.fitsKeywords` waits
                    for the next session, and its message names each
                    change.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    description: >-
                      One condition, in the shape of `metav1.Condition`.
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: "The condition's name, such as `Ready`."
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                        description: >-
                          Whether the condition holds: `True`, `False`,
                          or `Unknown`.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` of the spec that the
                          condition reflects.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        description: "One word in CamelCase for the cause."
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The cause, for a person to read. It can be
                          empty.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When `status` last changed. A write with the
                          same status keeps this time.
