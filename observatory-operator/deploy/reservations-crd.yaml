# A `Reservation` gives one holder the use of one `Telescope`. Device
# resources are inventory, and the operator starts a telescope's pods
# only while a `Reservation` of it is active.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: reservations.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Reservation
    listKind: ReservationList
    plural: reservations
    singular: reservation
    shortNames: [rsv]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      selectableFields:
        - jsonPath: .spec.telescope
      additionalPrinterColumns:
        - name: Telescope
          type: string
          jsonPath: .spec.telescope
        - name: Holder
          type: string
          jsonPath: .spec.holder
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Step
          type: string
          jsonPath: .status.step
        - name: Message
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].message'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Start
          type: string
          jsonPath: .spec.start
          priority: 1
        - name: End
          type: string
          jsonPath: .spec.end
          priority: 1
        - name: Host
          type: string
          jsonPath: .status.endpoint.host
          priority: 1
        - name: Port
          type: integer
          jsonPath: .status.endpoint.port
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 32
              message: >-
                a Reservation name is at most 32 characters, because
                observatory-operator builds the names of its pods,
                Services, and Job labels from the names of observatory
                resources, and Kubernetes limits those to 63 characters
          description: >-
            A `Reservation` gives one holder the use of one `Telescope`.
            Activation runs when `spec.start` arrives, or at once with no
            start. Deactivation runs when `spec.end` arrives, or when the
            `Reservation` is deleted, and it runs the deactivation procedures,
            such as parking the mount, warming the cameras, and closing the
            dust caps, before it stops the pods. `status.steps` lists every
            step and its state.
          required: [spec]
          properties:
            spec:
              type: object
              required: [telescope, holder]
              description: "The telescope, the holder, the times, the outbox, and the FITS keywords."
              x-kubernetes-validations:
                - rule: "!has(self.start) || !has(self.end) || self.end > self.start"
                  message: "spec.end must be after spec.start"
              properties:
                telescope:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `Telescope` to reserve. It cannot
                    change after the reservation is created.
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: "spec.telescope cannot change; create another Reservation"
                holder:
                  type: string
                  minLength: 1
                  maxLength: 253
                  description: >-
                    Who uses the telescope: a person's desktop client,
                    or `astrophotography-operator`.
                start:
                  type: string
                  format: date-time
                  description: >-
                    When activation begins, as an RFC 3339 time.
                    Optional. With no start, activation begins when the
                    reservation is created.
                end:
                  type: string
                  format: date-time
                  description: >-
                    When deactivation begins, as an RFC 3339 time.
                    Optional. With no end, the reservation lasts until
                    it is deleted.
                outbox:
                  type: object
                  required: [claimName]
                  description: >-
                    The volume that the telescope's imaging cameras write
                    their frames to. Optional. Each `Camera` of the
                    telescope mounts the claim at `/outbox`, except a
                    camera that a `Guider` guides with, and the
                    `Configure` step sets the driver's `UPLOAD_DIR` to
                    `/outbox` and its `UPLOAD_MODE` to `UPLOAD_BOTH`, so
                    each frame lands in the outbox and a desktop client
                    still receives it. With no outbox, the operator leaves
                    the upload settings alone, and a driver that a client
                    sets to keep frames writes them to the pod's `/tmp`,
                    which the pod loses when it stops. An edit takes
                    effect at the next session.
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                      description: >-
                        The name of a `PersistentVolumeClaim` in the
                        reservation's namespace. The `PowerOn` step fails
                        when it does not exist. A claim that exists and
                        cannot be mounted on the camera's node, such as a
                        `ReadWriteOnce` volume bound on another node,
                        leaves the camera's pod `Pending`, and
                        `StartDevices` gives the scheduler's message.
                fitsKeywords:
                  type: array
                  maxItems: 64
                  description: >-
                    The FITS keywords that the telescope's imaging
                    cameras write into the header of every frame, such
                    as `OBSERVER` or `TELESCOP`. Optional. The
                    `Observatory`, the `Telescope`, the `Camera`, and
                    the `Reservation` can each declare keywords, and the
                    operator merges them in that order: a keyword at a
                    later level replaces the value and the comment of
                    the same name at an earlier one. The `PowerOn` step
                    records the merged list of each `Camera` that no
                    `Guider` guides with, and the `Configure` step
                    writes it to the camera's `FITS_HEADER`, so the
                    driver writes the keywords into each frame when it
                    creates the file. An edit takes effect at the next
                    session. The API server refuses a keyword that the
                    driver writes from what it measures, such as
                    `EXPTIME` or `DATE-OBS`, because a declared value
                    would replace the measured one.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, value]
                    description: "One keyword: its name, its value, and a comment."
                    properties:
                      name:
                        type: string
                        maxLength: 8
                        description: >-
                          The keyword, such as `OBSERVER`: 1 to 8 of the
                          capital letters `A` to `Z`, the digits, `-`,
                          and `_`. `INSTRUME` and `TELESCOP` are
                          allowed, because the driver fills them with
                          the names of INDI devices, such as `CCD
                          Simulator`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[A-Z0-9_-]{1,8}$')"
                            message: "a FITS keyword name is 1 to 8 of the capital letters A to Z, the digits, '-', and '_'"
                          - rule: "!(self in ['SIMPLE', 'BITPIX', 'NAXIS', 'NAXIS1', 'NAXIS2', 'EXTEND', 'BZERO', 'BSCALE', 'ROWORDER', 'EXPTIME', 'CCD-TEMP', 'PIXSIZE1', 'PIXSIZE2', 'XBINNING', 'YBINNING', 'XPIXSZ', 'YPIXSZ', 'FRAME', 'IMAGETYP', 'FILTER', 'FOCALLEN', 'APTDIA', 'ROTATANG', 'FOCUSPOS', 'FOCUSTEM', 'SCALE', 'SITELAT', 'SITELONG', 'AIRMASS', 'OBJCTAZ', 'OBJCTALT', 'OBJCTRA', 'OBJCTDEC', 'RA', 'DEC', 'PIERSIDE', 'EQUINOX', 'DATE-OBS', 'GAIN', 'OFFSET', 'DARKTIME', 'MPSAS', 'BAYERPAT', 'XBAYROFF', 'YBAYROFF', 'DATAMIN', 'DATAMAX', 'CTYPE1', 'CTYPE2', 'CRVAL1', 'CRVAL2', 'CRPIX1', 'CRPIX2', 'CDELT1', 'CDELT2', 'CROTA1', 'CROTA2', 'SECPIX1', 'SECPIX2', 'RADECSYS', 'COMMENT', 'HISTORY', 'END'])"
                            messageExpression: >-
                              self + (self in ['COMMENT', 'HISTORY',
                              'END'] ? ' is a keyword that FITS reserves
                              for a card with no value' : ' is a keyword
                              that the camera\'s driver writes from what
                              it measures, and a declared value would
                              replace the measured one')
                      value:
                        type: string
                        minLength: 1
                        maxLength: 68
                        description: >-
                          The value, at most 68 characters, the longest
                          text that one 80-column card holds. The driver
                          writes a value that reads as a number, such as
                          `2026` or `-4.5`, as a number, and any other
                          value as quoted text. A value cannot hold `/`,
                          because the driver writes each `/` in a value
                          as `\`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
                          - rule: "!self.contains('/')"
                            message: "the camera's driver writes each '/' in a value as '\\', so the header would not hold the value declared"
                      comment:
                        type: string
                        maxLength: 47
                        description: >-
                          The comment that follows the value on the
                          card. Optional. At most 47 characters, which
                          fit beside a number.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
            status:
              type: object
              description: >-
                What the operator observes. The operator writes it, and
                a person reads it.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: >-
                    The `metadata.generation` of the spec that the
                    operator last acted on.
                phase:
                  type: string
                  enum: [Scheduled, Activating, Ready, Deactivating, Released, Failed]
                  description: >-
                    The reservation's state in one word. `Scheduled`:
                    waiting for `spec.start`. `Activating`: the
                    activation steps run. `Ready`: the telescope is
                    ready, and `endpoint` names its server.
                    `Deactivating`: the deactivation steps run.
                    `Released`: the deactivation steps are done, and the
                    devices are safe to power off. `Failed`: a step
                    failed, and the `Ready` condition names it.
                step:
                  type: string
                  enum: [Wait, StartSite, PowerOn, StartDevices, Connect, Configure, Activation, StartGuider, Abort, Deactivation, StopGuider, Disconnect, StopDevices, PowerOff, StopSite]
                  description: >-
                    The step that runs now, or the step that failed.
                    It is empty while the phase is `Ready` or
                    `Released`.
                steps:
                  type: array
                  description: >-
                    Every step, in the order it runs. The activation
                    steps are `Wait`, `StartSite`, `PowerOn`,
                    `StartDevices`, `Connect`, `Configure`,
                    `Activation`, and `StartGuider`, and the list holds
                    them from the start. The deactivation steps are
                    `Abort`, `Deactivation`, `StopGuider`, `Disconnect`,
                    `StopDevices`, `PowerOff`, and `StopSite`, and the
                    list holds them from when
                    deactivation begins. A step starts only when the
                    step before it is `Done` or `Skipped`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, state]
                    description: "One step."
                    properties:
                      name:
                        type: string
                        enum: [Wait, StartSite, PowerOn, StartDevices, Connect, Configure, Activation, StartGuider, Abort, Deactivation, StopGuider, Disconnect, StopDevices, PowerOff, StopSite]
                        description: "The step's name."
                      state:
                        type: string
                        enum: [Pending, Running, Done, Failed, Skipped]
                        description: >-
                          The step's progress: `Pending`, `Running`,
                          `Done`, `Failed`, or `Skipped` when it has
                          nothing to do.
                      startTime:
                        type: string
                        format: date-time
                        description: "When the step began to run."
                      stopTime:
                        type: string
                        format: date-time
                        description: "When the step ended."
                      summary:
                        type: string
                        description: >-
                          What the step waits for or did. It names the
                          device when one device holds the step up.
                      actions:
                        type: array
                        description: >-
                          The actions of the procedures that the
                          `Activation` or `Deactivation` step waited on,
                          each with the resource it belongs to. The
                          resource's `status.procedures` holds the same
                          record.
                        items:
                          type: object
                          required: [kind, name, action, state]
                          description: >-
                            One action of one resource.
                          properties:
                            kind:
                              type: string
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              description: >-
                                The name of the resource.
                            action:
                              type: string
                              description: >-
                                The action as its YAML reads, such as
                                `state: Parked` or `cool: -10 °C within
                                0.5 °C`.
                            state:
                              type: string
                              enum: [Pending, Running, Done, Failed, Skipped]
                              description: >-
                                The action's progress: `Pending`,
                                `Running`, `Done`, `Failed`, or
                                `Skipped` when it had nothing to do.
                            startTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action began to run.
                            stopTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action ended.
                            summary:
                              type: string
                              description: >-
                                What the action waits for or did.
                endpoint:
                  type: object
                  required: [service, host, port]
                  description: >-
                    The telescope's INDI server, while the phase is
                    `Ready`. KStars connects to its `host` and `port`.
                  properties:
                    service:
                      type: string
                      description: "The name of the server's `Service`."
                    host:
                      type: string
                      description: "The `Service`'s DNS name in the cluster."
                    port:
                      type: integer
                      format: int32
                      description: "The INDI port of the `Service`, 7624."
                session:
                  type: object
                  description: >-
                    What the reservation's session started with. `StartSite`
                    writes `observatory` and `site`, and `PowerOn` writes the
                    rest, each once and before it creates a pod. The
                    `observatory.liken.sh/retry` annotation on a failed
                    activation step writes the parts again from the specs as
                    they are then, before the step runs again, and nothing
                    else changes them. While the reservation holds its
                    telescope, the operator reads this record in place of the
                    specs of the resources it names, so an edit of a device's
                    parents, driver, power, or claim, of the `Telescope`'s
                    `spec.observatory`, of an `OpticalTrain`, of an
                    `OpticalTube`, of a `Guider`, of the reservation's
                    `spec.outbox`, or of any `spec.fitsKeywords` takes
                    effect at the next session. The record is in the reservation, so an eviction
                    of every pod of a server leaves it, and the operator
                    creates the pods again from it.
                  properties:
                    observatory:
                      type: string
                      description: "The observatory of the reservation's telescope."
                    site:
                      type: object
                      description: >-
                        The devices of the observatory's server, by kind and
                        name, such as `Dome/lab`, as the server ran them when
                        this reservation's `StartSite` began. The reservations
                        of several telescopes in one observatory share its
                        server, and while any of them holds its telescope, the
                        operator reads the union of their records. Absent when
                        the observatory has no devices. Then `observatory`
                        alone records that the session started the
                        observatory with none, and a device created there
                        during the session waits for the next one.
                      additionalProperties:
                        type: object
                        description: >-
                          One device as the session started it.
                        properties:
                          uid:
                            type: string
                            description: >-
                              The device's `metadata.uid`. A device that a
                              person deletes and creates again with the same
                              name during the session has another UID, and the
                              record does not apply to it.
                          telescope:
                            type: string
                            description: "The device's `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The device's `spec.opticalTrain`."
                          observatory:
                            type: string
                            description: "The device's `spec.observatory`."
                          driver:
                            type: object
                            required: [name]
                            description: "The device's `spec.driver`."
                            properties:
                              name:
                                type: string
                                description: "The driver's executable."
                              image:
                                type: string
                                description: "The container image that holds the driver."
                          device:
                            type: object
                            required: [kind, name]
                            description: "The device's `spec.device`: the resource whose driver serves it."
                            properties:
                              kind:
                                type: string
                                description: "The kind of the resource that runs the driver."
                              name:
                                type: string
                                description: "The name of the resource that runs the driver."
                          power:
                            type: object
                            required: [switch, output]
                            description: "The device's `spec.power`: the output that activation switched on, and that `PowerOff` switches off."
                            properties:
                              switch:
                                type: string
                                description: "The name of the `Switch`."
                              output:
                                type: integer
                                format: int32
                                description: "The output's number."
                          claim:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: "The device's `spec.claim`, the `ResourceClaimSpec` of its pod's claim."
                          guides:
                            type: boolean
                            description: >-
                              `true` for a camera that a `Guider` of the
                              telescope guides with, whose pod runs on the
                              node of the telescope's server.
                    devices:
                      type: object
                      description: >-
                        The devices of the telescope's server, by kind and
                        name, such as `Camera/east-main`, as `PowerOn` started
                        them.
                      additionalProperties:
                        type: object
                        description: >-
                          One device as the session started it.
                        properties:
                          uid:
                            type: string
                            description: >-
                              The device's `metadata.uid`. A device that a
                              person deletes and creates again with the same
                              name during the session has another UID, and the
                              record does not apply to it.
                          telescope:
                            type: string
                            description: "The device's `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The device's `spec.opticalTrain`."
                          observatory:
                            type: string
                            description: "The device's `spec.observatory`."
                          driver:
                            type: object
                            required: [name]
                            description: "The device's `spec.driver`."
                            properties:
                              name:
                                type: string
                                description: "The driver's executable."
                              image:
                                type: string
                                description: "The container image that holds the driver."
                          device:
                            type: object
                            required: [kind, name]
                            description: "The device's `spec.device`: the resource whose driver serves it."
                            properties:
                              kind:
                                type: string
                                description: "The kind of the resource that runs the driver."
                              name:
                                type: string
                                description: "The name of the resource that runs the driver."
                          power:
                            type: object
                            required: [switch, output]
                            description: "The device's `spec.power`: the output that activation switched on, and that `PowerOff` switches off."
                            properties:
                              switch:
                                type: string
                                description: "The name of the `Switch`."
                              output:
                                type: integer
                                format: int32
                                description: "The output's number."
                          claim:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: "The device's `spec.claim`, the `ResourceClaimSpec` of its pod's claim."
                          guides:
                            type: boolean
                            description: >-
                              `true` for a camera that a `Guider` of the
                              telescope guides with, whose pod runs on the
                              node of the telescope's server.
                    trains:
                      type: object
                      description: "The spec of each `OpticalTrain` of the telescope, by name."
                      additionalProperties:
                        type: object
                        required: [telescope, opticalTube]
                        description: "One train's spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The train's `metadata.uid`. A train that a
                              person deletes and creates again with the same
                              name during the session has another UID, and the
                              record does not apply to it.
                          telescope:
                            type: string
                            description: "The train's `spec.telescope`."
                          opticalTube:
                            type: string
                            description: "The train's `spec.opticalTube`."
                    tubes:
                      type: object
                      description: >-
                        The spec of each `OpticalTube` of those trains, by
                        name. A camera whose driver comes back gets the
                        `SCOPE_INFO` of these lengths.
                      additionalProperties:
                        type: object
                        required: [telescope, aperture, focalLength]
                        description: "One tube's spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The tube's `metadata.uid`. A tube that a
                              person deletes and creates again with the same
                              name during the session has another UID, and the
                              record does not apply to it.
                          telescope:
                            type: string
                            description: "The tube's `spec.telescope`."
                          aperture:
                            type: number
                            description: "The tube's `spec.aperture`, in millimeters."
                          focalLength:
                            type: number
                            description: "The tube's `spec.focalLength`, in millimeters."
                    guiders:
                      type: object
                      description: "The spec of each `Guider` of the telescope, by name."
                      additionalProperties:
                        type: object
                        required: [telescope, opticalTrain, pulses]
                        description: "One `Guider`'s spec."
                        properties:
                          uid:
                            type: string
                            description: >-
                              The `Guider`'s `metadata.uid`. A `Guider` that a
                              person deletes and creates again with the same
                              name during the session has another UID, and the
                              record does not apply to it.
                          telescope:
                            type: string
                            description: "The `Guider`'s `spec.telescope`."
                          opticalTrain:
                            type: string
                            description: "The `Guider`'s `spec.opticalTrain`."
                          pulses:
                            type: string
                            enum: [Mount, Camera]
                            description: "The `Guider`'s `spec.pulses`."
                    outbox:
                      type: object
                      required: [claimName]
                      description: >-
                        The reservation's `spec.outbox`, which the camera
                        pods of the session mount.
                      properties:
                        claimName:
                          type: string
                          description: "The name of the `PersistentVolumeClaim`."
                    fitsKeywords:
                      type: object
                      description: >-
                        The merged `spec.fitsKeywords` of each `Camera` of
                        the session that no `Guider` guides with, by the
                        camera's key, such as `Camera/east-main`, from the
                        `Observatory`, the `Telescope`, the `Camera`, and
                        the reservation. A camera whose merged list is
                        empty has no entry. The `Configure` step writes
                        each list to its camera's `FITS_HEADER`.
                      additionalProperties:
                        type: array
                        description: "The keywords of one camera, in the order of the header."
                        items:
                          type: object
                          required: [name, value]
                          description: "One keyword."
                          properties:
                            name:
                              type: string
                              description: "The keyword."
                            value:
                              type: string
                              description: "The value."
                            comment:
                              type: string
                              description: "The comment."
                conditions:
                  type: array
                  description: >-
                    `Ready` is `True` while the phase is `Ready`, so
                    `kubectl wait --for=condition=Ready` waits for the
                    telescope. When a step fails, it is `False` and its
                    message names the step and the device.
                    `SafeToPowerOff` is `True` when the deactivation
                    steps are done.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    description: >-
                      One condition, in the shape of `metav1.Condition`.
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: "The condition's name, such as `Ready`."
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                        description: >-
                          Whether the condition holds: `True`, `False`,
                          or `Unknown`.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` of the spec that the
                          condition reflects.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        description: "One word in CamelCase for the cause."
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The cause, for a person to read. It can be
                          empty.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When `status` last changed. A write with the
                          same status keeps this time.
