                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `UPDATE_NEVER`. Absent when no member is on.
