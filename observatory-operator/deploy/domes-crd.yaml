                  description: >-
                    Turns the dome clockwise or counterclockwise, as
                    seen from above, or moves the roof. The status holds
                    what the driver reports in `DOME_MOTION`. Clients
                    such as KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DOME_CW`. Absent when no member is on.
                speed:
                  type: object
                  description: >-
                    The speed of the dome's rotation, in revolutions per
                    minute. The status holds what the driver reports in
                    `DOME_SPEED`. `spec.speed` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        revolutions per minute.
                relativePosition:
                  type: object
                  description: >-
                    Turns the dome by this many degrees in the direction
                    of `motion`. The status holds what the driver
                    reports in `REL_DOME_POSITION`. Clients such as
                    KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        degrees.
                azimuth:
                  type: object
                  description: >-
                    The azimuth of the shutter, in degrees east of
                    north. The status holds what the driver reports in
                    `ABS_DOME_POSITION`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        degrees.
                abortMotion:
                  type: object
                  description: >-
                    Stops every motion of the dome and of its shutter.
                    The status holds what the driver reports in
                    `DOME_ABORT_MOTION`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `ABORT`. Absent when no member is on.
                presets:
                  type: object
                  description: >-
                    Three azimuths, in degrees, that `gotoPreset` turns
                    the dome to. The status holds what the driver
                    reports in `Presets`. `spec.presets` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    preset1:
                      type: number
                      description: >-
                        The first azimuth, in degrees. The member is
                        `Preset 1`.
                    preset2:
                      type: number
                      description: >-
                        The second azimuth, in degrees. The member is
                        `Preset 2`.
                    preset3:
                      type: number
                      description: >-
                        The third azimuth, in degrees. The member is
                        `Preset 3`.
                gotoPreset:
                  type: object
                  description: >-
                    Turns the dome to one of its `presets`. The status
                    holds what the driver reports in `Goto`. Clients
                    such as KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `Preset 1`. Absent when no member is on.
                autoSync:
                  type: object
                  description: >-
                    Whether the dome follows the mount, so the shutter
                    stays in front of the telescope. The status holds
                    what the driver reports in `DOME_AUTOSYNC`.
                    `spec.autoSync` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DOME_AUTOSYNC_ENABLE`. Absent when no member is
                        on.
                otaSide:
                  type: object
                  description: >-
                    Which side of the pier the driver takes the
                    telescope to be on: east, west, from the mount, from
                    the hour angle, or none. The status holds what the
                    driver reports in `DM_OTA_SIDE`. `spec.otaSide` sets
                    it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DM_OTA_SIDE_EAST`. Absent when no member is on.
                autoSyncThreshold:
                  type: object
                  description: >-
                    How far, in degrees, the shutter can be from where
                    the telescope points before the dome turns to follow
                    it. The status holds what the driver reports in
                    `DOME_PARAMS`. `spec.autoSyncThreshold` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        degrees.
                measurements:
                  type: object
                  description: >-
                    The dome's geometry, in meters, which the driver
                    needs to turn the shutter to where the telescope
                    points. The status holds what the driver reports in
                    `DOME_MEASUREMENTS`. `spec.measurements` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    radius:
                      type: number
                      description: >-
                        The radius of the dome, in meters. The member is
                        `DM_DOME_RADIUS`.
                    shutterWidth:
                      type: number
                      description: >-
                        The width of the shutter's opening, in meters.
                        The member is `DM_SHUTTER_WIDTH`.
                    northDisplacement:
                      type: number
                      description: >-
                        How far the mount's axes are north of the dome's
                        center, in meters. The member is
                        `DM_NORTH_DISPLACEMENT`.
                    eastDisplacement:
                      type: number
                      description: >-
                        How far the mount's axes are east of the dome's
                        center, in meters. The member is
                        `DM_EAST_DISPLACEMENT`.
                    upDisplacement:
                      type: number
                      description: >-
                        How far the mount's axes are above the dome's
                        center, in meters. The member is
                        `DM_UP_DISPLACEMENT`.
                    otaOffset:
                      type: number
                      description: >-
                        How far the optical tube's axis is from the
                        mount's axes, in meters. The member is
                        `DM_OTA_OFFSET`.
                sync:
                  type: object
                  description: >-
                    An azimuth, in degrees, that the driver takes as the
                    dome's current azimuth, with no motion. The status
                    holds what the driver reports in `DOME_SYNC`.
                    Clients such as KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        degrees.
                park:
                  type: object
                  description: >-
                    Parks or unparks the dome. The `state` action
                    changes it. The status holds what the driver reports
                    in `DOME_PARK`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `PARK`. Absent when no member is on.
                parkPosition:
                  type: object
                  description: >-
                    The azimuth that the dome parks at, in degrees. The
                    status holds what the driver reports in
                    `DOME_PARK_POSITION`. `spec.parkPosition` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        degrees.
                parkOption:
                  type: object
                  description: >-
                    Sets the park position to the current azimuth or to
                    the driver's default, or writes the driver's park
                    data. The status holds what the driver reports in
                    `DOME_PARK_OPTION`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `PARK_CURRENT`. Absent when no member is on.
                backlash:
                  type: object
                  description: >-
                    Whether the driver corrects the backlash of the
                    dome's motor. The status holds what the driver
                    reports in `DOME_BACKLASH_TOGGLE`. `spec.backlash`
                    sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `INDI_ENABLED`. Absent when no member is on.
                backlashSteps:
                  type: object
                  description: >-
                    The backlash of the dome's motor, in steps. The
                    status holds what the driver reports in
                    `DOME_BACKLASH_STEPS`. `spec.backlashSteps` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        the motor's steps.
                joystick:
                  type: object
                  description: >-
                    Whether the driver moves the dome from a joystick.
                    The status holds what the driver reports in
                    `USEJOYSTICK`. `spec.joystick` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `ENABLE`. Absent when no member is on.
                joystickDevice:
                  type: object
                  description: >-
                    The INDI device of the joystick. The status holds
                    what the driver reports in `SNOOP_JOYSTICK`. The
                    operator decides it from the resources around the
                    device, so it is not in spec.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The value that the driver reports.
                display:
                  type: object
                  description: >-
                    The values of the typed fields as a person reads
                    them, with their units, for the printer columns.
                  properties:
                    azimuth:
                      type: string
                      description: "The azimuth in degrees, such as `123.4°`."
