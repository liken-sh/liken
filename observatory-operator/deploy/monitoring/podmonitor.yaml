# Only the replica that holds the Lease serves /metrics, so during a
# rollout the scrape of the waiting replica fails until it takes the
# Lease. Root plan 65 requires every PodMonitor to copy the pod's node
# name into a `node` label, so a dashboard can select by node.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: observatory-operator
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: observatory-operator
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
