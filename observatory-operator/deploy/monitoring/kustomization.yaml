# Optional monitoring for observatory-operator: a PodMonitor for the
# operator's pod and a Grafana dashboard ConfigMap, under the metrics
# contract in plans/completed/65-prometheus-metrics.md at the top of
# the repository. The base does not include it, because the PodMonitor
# CRD exists only on a cluster that runs the prometheus-operator. Such
# a cluster adds it beside the base:
#
#   resources:
#     - https://github.com/liken-sh/liken//observatory-operator/deploy?ref=<version>
#   components:
#     - https://github.com/liken-sh/liken//observatory-operator/deploy/monitoring?ref=<version>
#
# This Component sets no top-level namespace, because that would also
# move the dashboard ConfigMap into liken-system, where the
# kube-prometheus-stack dashboard sidecar does not look. The PodMonitor
# sets its own namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The kube-prometheus-stack's Grafana sidecar loads every ConfigMap
# labeled grafana_dashboard: "1". disableNameSuffixHash keeps the name
# fixed, so an edit replaces the ConfigMap. With a hash suffix, the old
# and new ConfigMaps would both exist and Grafana would load both
# dashboards.
configMapGenerator:
  - name: observatory-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/observatory-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
