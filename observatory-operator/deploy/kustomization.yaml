# The kustomize base for observatory-operator: the resource definitions
# of the observatory.liken.sh group, and the operator with its RBAC, in
# liken-system. The base creates no namespace for the observatory's
# resources. Create one and apply the resources there.
#
# `liken` does not apply this base. Apply it through your own GitOps
# with your own patches, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# A NamespaceTransformer with unsetOnly sets the namespace here, not
# the top-level namespace field, because the field would also override
# an object that already sets its own namespace.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  # The site, the telescope, and the optics, from the top of the tree
  # down.
  - observatories-crd.yaml
  - telescopes-crd.yaml
  - opticaltubes-crd.yaml
  - opticaltrains-crd.yaml
  # The device kinds.
  - mounts-crd.yaml
  - cameras-crd.yaml
  - filterwheels-crd.yaml
  - focusers-crd.yaml
  - rotators-crd.yaml
  - dustcaps-crd.yaml
  - flatpanels-crd.yaml
  - polaraligners-crd.yaml
  - gpses-crd.yaml
  - domes-crd.yaml
  - weatherstations-crd.yaml
  - switches-crd.yaml
  - receivers-crd.yaml
  # The guider, the reservation that activates a telescope, and the
  # saved horizons that a telescope names.
  - guiders-crd.yaml
  - reservations-crd.yaml
  - horizons-crd.yaml
  # The operator.
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: observatory-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/observatory-operator
    newTag: latest
