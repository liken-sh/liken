# An `OpticalTrain` is one light path: a tube, and the camera, filter
# wheel, focuser, and rotator behind it. KStars' Ekos uses the same term
# for the same group of devices.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opticaltrains.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: OpticalTrain
    listKind: OpticalTrainList
    plural: opticaltrains
    singular: opticaltrain
    shortNames: [train]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      selectableFields:
        - jsonPath: .spec.telescope
      additionalPrinterColumns:
        - name: Telescope
          type: string
          jsonPath: .spec.telescope
        - name: Tube
          type: string
          jsonPath: .spec.opticalTube
        - name: Camera
          type: string
          jsonPath: '.status.devices[?(@.kind=="Camera")].name'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 32
              message: >-
                an OpticalTrain name is at most 32 characters, the limit
                of every observatory.liken.sh kind. observatory-operator
                builds the names of pods and Services, and the values of
                Job labels, from the names of observatory.liken.sh
                resources, and Kubernetes limits each of those to 63
                characters. The limit of 32 leaves room for a suffix
                longer than any that the operator adds.
          description: >-
            An `OpticalTrain` is one light path: an `OpticalTube`, and
            the camera, filter wheel, focuser, and rotator behind it. A
            device joins the train when its `spec.opticalTrain` is the
            train's name. The operator writes each camera's INDI
            `ACTIVE_DEVICES` property so that the camera reads the
            focuser, filter wheel, and rotator of its own train and the
            mount of its telescope. It also writes the tube's aperture
            and focal length into the camera's `SCOPE_INFO`.
          required: [spec]
          properties:
            spec:
              type: object
              required: [telescope, opticalTube]
              description: "The telescope the train is on, and its tube."
              properties:
                telescope:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `Telescope` that the train is on.
                opticalTube:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `OpticalTube` that collects the
                    train's light. Two trains can use the same tube.
            status:
              type: object
              description: >-
                What the operator observes. Only the operator writes
                it.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: >-
                    The `metadata.generation` of the spec that the
                    operator last acted on.
                conditions:
                  type: array
                  description: >-
                    The `ParentFound` condition is `False` when the
                    `Telescope`, its `Observatory`, or the `OpticalTube`
                    does not exist.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    description: >-
                      One condition, in the shape of `metav1.Condition`.
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: "The condition's name, such as `Ready`."
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                        description: >-
                          Whether the condition is met: `True`, `False`,
                          or `Unknown`.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` of the spec that the
                          condition reflects.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        description: "One word in CamelCase for the cause."
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          A sentence for a person that explains the
                          reason. It can be empty.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When `status` last changed. A write that
                          leaves `status` unchanged keeps this time.
                devices:
                  type: array
                  description: >-
                    Each device whose `spec.opticalTrain` is this
                    train's name. While a reservation's session holds a
                    device, the list uses the train that the session
                    recorded when it started, because a change to
                    `spec.opticalTrain` takes effect when the session
                    ends.
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [kind, name]
                    description: "One device and its phase."
                    properties:
                      kind:
                        type: string
                        enum: [Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, Switch, Receiver]
                        description: "The device's kind."
                      name:
                        type: string
                        description: "The device's name."
                      phase:
                        type: string
                        enum: [Inventory, Idle, Starting, Connecting, Connected, Disconnecting, Error]
                        description: "The device's `status.phase`."
