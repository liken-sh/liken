# observatory-operator does not read a `Horizon` and writes no status
# to it. astrophotography-operator reads it, as the description says.
#
# Each rule on `spec.profile` matches the whole profile with one
# regular expression. A rule that splits the profile into lines with
# `split` has a CEL cost estimate that grows with the square of
# `maxLength`, and the API server refuses the CRD when the estimate is
# over its budget. A regular expression's estimate grows only with the
# length.
#
# In each expression, a line is a comment or a blank line,
# `[ \t\r]*(#.*)?`, or a point: a number, a comma or spaces and tabs,
# and a number. A number is `[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)`. The
# second rule replaces the first number with one from 0 to 360, and the
# third replaces the second number with one from -90 to 90. The last
# three rules pass any profile that the first rule refuses, so a bad
# line gets one message, not several. `ParseProfile` in
# `observatory/horizon.go` must accept the same profiles, and
# `TestTheParserAcceptsWhatTheAPIServerAccepts` checks that it does.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: horizons.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Horizon
    listKind: HorizonList
    plural: horizons
    singular: horizon
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 32
              message: >-
                a Horizon name is at most 32 characters, the limit of
                every observatory.liken.sh kind. observatory-operator
                builds the names of pods and Services, and the values of
                Job labels, from the names of observatory.liken.sh
                resources, and Kubernetes limits each of those to 63
                characters. The limit of 32 leaves room for a suffix
                longer than any that the operator adds.
          description: >-
            A `Horizon` is the part of the sky that trees, buildings,
            and roofs block from one place, such as `yard` or `roof`. A
            `Telescope` names its current horizon in `spec.horizon`, so
            a portable telescope that moves to another place takes
            another saved `Horizon` with one edit.
            `astrophotography-operator` does not claim or slew to a
            target below the horizon, and releases a target that sets
            below it before the next frame. `observatory-operator`
            checks nothing against it, so a slew that KStars asks for
            can still point the mount behind the trees.
          required: [spec]
          properties:
            spec:
              type: object
              required: [profile]
              description: "The horizon's altitude in each direction."
              properties:
                profile:
                  type: string
                  maxLength: 16384
                  description: >-
                    The horizon as a text file, in the format of
                    N.I.N.A.'s custom horizon and of Cartes du Ciel's:
                    one point to a line, the azimuth from 0 to 360 and
                    then the altitude from -90 to 90, in degrees,
                    separated by spaces, a tab, or a comma. A line that
                    starts with `#` is a comment, and a blank line is
                    skipped. A profile needs at least two points.
                    Between two points, the altitude changes in a
                    straight line with the azimuth, and the last point
                    joins the first through 360 degrees.
                  x-kubernetes-validations:
                    - rule: >-
                        self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)$')
                      message: >-
                        each line of spec.profile is a comment that
                        starts with #, a blank line, or an azimuth and
                        an altitude in degrees, separated by spaces, a
                        tab, or a comma
                    - rule: >-
                        !self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)$') ||
                        self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*(\+?0*([0-9]{1,2}|[12][0-9]{2}|3[0-5][0-9])(\.[0-9]*)?|\+?0*360(\.0*)?|\+?\.[0-9]+|-0+(\.0*)?|-\.0+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*(\+?0*([0-9]{1,2}|[12][0-9]{2}|3[0-5][0-9])(\.[0-9]*)?|\+?0*360(\.0*)?|\+?\.[0-9]+|-0+(\.0*)?|-\.0+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)$')
                      message: "each azimuth in spec.profile is from 0 to 360 degrees"
                    - rule: >-
                        !self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)$') ||
                        self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?(0*([0-9]|[1-8][0-9])(\.[0-9]*)?|0*90(\.0*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?(0*([0-9]|[1-8][0-9])(\.[0-9]*)?|0*90(\.0*)?|\.[0-9]+)[ \t\r]*)$')
                      message: "each altitude in spec.profile is from -90 to 90 degrees"
                    - rule: >-
                        !self.matches(r'^(([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)\n)*([ \t\r]*(#.*)?|[ \t]*[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([ \t]*,[ \t]*|[ \t]+)[-+]?([0-9]+(\.[0-9]*)?|\.[0-9]+)[ \t\r]*)$') ||
                        self.findAll(r'(?m)^[ \t]*[-+.0-9]').size() >= 2
                      message: "spec.profile holds at least two points"
