# A `Camera` is an imaging or guiding camera: an INDI driver with
# `CCD_INTERFACE`.
#
# A device resource is inventory: `observatory-operator` starts its pod
# only while a `Reservation` needs it. The fields that every device
# shares, `spec.driver`, `spec.power`, `spec.claim`, and every status
# field except `status.readings`, are the same in all 14 device CRDs. A
# test in the `observatory` package holds them equal, and holds each CRD
# equal to its Go type.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cameras.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Camera
    listKind: CameraList
    plural: cameras
    singular: camera
    shortNames: [cam]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      selectableFields:
        - jsonPath: .spec.opticalTrain
      additionalPrinterColumns:
        - name: Train
          type: string
          jsonPath: .spec.opticalTrain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Temp
          type: string
          jsonPath: .status.display.temperature
        - name: Setpoint
          type: string
          jsonPath: .status.display.setpoint
        - name: Cooler
          type: string
          jsonPath: .status.display.cooler
        - name: Exposure
          type: string
          jsonPath: .status.display.exposure
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Cooler Power
          type: string
          jsonPath: .status.display.coolerPower
          priority: 1
        - name: Driver
          type: string
          jsonPath: .spec.driver.name
          priority: 1
        - name: Device
          type: string
          jsonPath: .status.indiDevice
          priority: 1
        - name: Node
          type: string
          jsonPath: .status.node
          priority: 1
        - name: Message
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].message'
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A `Camera` is an imaging or guiding camera: an INDI driver
            with `CCD_INTERFACE`. It belongs to one `OpticalTrain`, and
            the operator writes the camera's `ACTIVE_DEVICES` from that
            train, so the camera snoops the mount, focuser, filter
            wheel, and rotator of its own light path.
          required: [spec]
          properties:
            spec:
              type: object
              required: [driver]
              description: >-
                One camera, with INDI's `CCD_INTERFACE`. The operator
                writes each setting that the spec states when a
                reservation configures the camera, and leaves the others
                as the driver sets them.
              properties:
                opticalTrain:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `OpticalTrain` that the device is
                    on. The train's members set what each camera on it
                    snoops.
                    Optional. With no `opticalTrain`, the device is on
                    the shelf, and the operator creates nothing for it.
                driver:
                  type: object
                  required: [name]
                  description: >-
                    The INDI driver that runs the device. With no
                    `image`, the operator runs the image that the `indi`
                    build lists for the driver, so `name` must then be
                    an INDI driver that the image holds, such as
                    `indi_simulator_ccd`.
                  x-kubernetes-validations:
                    - rule: "has(self.image) || self.name.matches('^indi_[a-z0-9_]+$')"
                      message: "driver.name must match ^indi_[a-z0-9_]+$ when driver.image is not set"
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: "^[A-Za-z0-9_][A-Za-z0-9_.+-]*$"
                      description: >-
                        The driver's executable, such as
                        `indi_simulator_ccd`. The device's pod runs it
                        under `socat`, so the name holds no path, no
                        space, no comma, and no colon.
                    image:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: >-
                        The container image that holds the driver, used
                        as written. The image must hold `/usr/bin/socat`
                        and the driver on `PATH`, and must run as user
                        1000 with a read-only root filesystem and a
                        writable `/tmp`. An image built `FROM
                        ghcr.io/liken-sh/indi` meets all three.
                        Optional.
                power:
                  type: object
                  required: [switch, output]
                  description: >-
                    The `Switch` output that powers the device.
                    Activation switches the output on before the
                    device's pod starts, and deactivation switches it
                    off after the pod stops. Optional. With no power, a
                    person powers the device on and off by hand.
                  properties:
                    switch:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                      description: "The name of a `Switch` in this namespace."
                    output:
                      type: integer
                      format: int32
                      minimum: 1
                      description: >-
                        The number of the output, from 1, as the driver
                        numbers `DIGITAL_OUTPUT_1`.
                claim:
                  type: object
                  description: >-
                    A `ResourceClaimSpec` of the `resource.k8s.io` API,
                    for real hardware. The operator creates a
                    `ResourceClaim` from it for the device's pod. The
                    API server validates it when the operator creates
                    the claim. Optional. A simulator needs no claim.
                  x-kubernetes-preserve-unknown-fields: true
                gain:
                  type: number
                  minimum: 0
                  description: >-
                    The sensor's gain, written to `CCD_GAIN`, in the
                    driver's own units. Optional.
                offset:
                  type: number
                  minimum: 0
                  description: >-
                    The sensor's offset, written to `CCD_OFFSET`, in the
                    driver's own units. Optional.
                activation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as this resource's
                    `Telescope` or `Observatory` turns `Active`, while
                    every device is still connected. For a `Telescope`
                    or an `Observatory`, that is the resource itself.
                    The `Reservation`'s `Activation` step waits for
                    them. Each action is a target state, so a run that
                    an operator restart interrupted runs again each
                    action that is not `Done`. Optional.
                  items:
                    type: object
                    description: >-
                      One action, which names exactly one of `cool`,
                      `warm`, and `job`.
                    x-kubernetes-validations:
                      - rule: "[has(self.cool), has(self.warm), has(self.job)].filter(x, x).size() == 1"
                        message: "an action names exactly one of cool, warm, and job"
                    properties:
                      cool:
                        type: object
                        required: [celsius]
                        description: >-
                          Cools the sensor: the operator writes
                          `celsius` to `CCD_TEMPERATURE` and waits until
                          the sensor is within `within` of it. The
                          default timeout is 20 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      warm:
                        type: object
                        required: [celsius]
                        description: >-
                          Warms the sensor before its cooler goes off:
                          the operator writes `celsius` to
                          `CCD_TEMPERATURE`, waits until the sensor is
                          within `within` of it or until the timeout,
                          and switches `CCD_COOLER` off. A cooler cannot
                          warm a sensor above the air around it, so the
                          timeout ends the wait and does not fail the
                          action. The default timeout is 10 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      job:
                        type: object
                        required: [image]
                        description: >-
                          A container that the operator runs once as a
                          Kubernetes `Job` in the operator's namespace,
                          for what no other action does, such as
                          switching a dew heater's relay or posting to a
                          webhook. The resource owns the `Job`. The
                          action is `Done` when the `Job` succeeds, and
                          `Failed` with the `Job`'s reason and message
                          when it fails. The `Job` has no retry, and its
                          `activeDeadlineSeconds` is the action's
                          timeout. Kubernetes deletes it an hour after
                          it ends. The environment adds
                          `LIKEN_OBSERVATORY`, `LIKEN_TELESCOPE` for a
                          resource of a telescope, `LIKEN_RESOURCE` such
                          as `Dome/lab`, `LIKEN_TRIGGER` such as
                          `activation` or `triggers[0]`, and `INDI_HOST`
                          and `INDI_PORT` of the resource's INDI server.
                          The container runs as user 1000 with no
                          capabilities, on a read-only root filesystem
                          with a writable `/tmp`. The default timeout is
                          10 minutes.
                        properties:
                          image:
                            type: string
                            minLength: 1
                            maxLength: 512
                            description: >-
                              The container image, used as written, such
                              as `busybox:1.37`.
                          command:
                            type: array
                            maxItems: 32
                            description: >-
                              The command that replaces the image's
                              entrypoint, as a container's `command`
                              does. Optional.
                            items:
                              type: string
                              maxLength: 4096
                          args:
                            type: array
                            maxItems: 64
                            description: >-
                              The arguments of the command, as a
                              container's `args` are. Optional.
                            items:
                              type: string
                              maxLength: 4096
                          env:
                            type: array
                            maxItems: 32
                            description: >-
                              Variables that the operator adds to the
                              container's environment before its own, as
                              `{name, value}`. A variable that has the
                              name of one of the operator's own is
                              replaced by the operator's. Optional.
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys: [name]
                            items:
                              type: object
                              required: [name, value]
                              description: >-
                                One variable.
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                  pattern: "^[-._a-zA-Z][-._a-zA-Z0-9]*$"
                                  description: >-
                                    The variable's name, such as
                                    `RELAY_URL`.
                                value:
                                  type: string
                                  maxLength: 32768
                                  description: >-
                                    The variable's value. It can be
                                    empty.
                      timeout:
                        type: string
                        maxLength: 32
                        description: >-
                          How long the action may take, its waits for
                          `requires` and `after` included, as a duration
                          such as `20m`. An action that passes it fails.
                          Optional. Each action has a default.
                        x-kubernetes-validations:
                          - rule: "self.matches('^([0-9]+(\\\\.[0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                            message: "timeout must be a positive duration, such as 20m or 1h30m"
                      requires:
                        type: array
                        maxItems: 8
                        description: >-
                          The conditions that must hold before the
                          action runs. The operator waits for each one
                          until the action's timeout. They bind only the
                          actions that the operator runs: a move that a
                          person makes in KStars is stopped only by the
                          drivers' park locks.
                        items:
                          type: object
                          required: [type]
                          description: >-
                            One condition, and the status it must have.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource whose condition
                                it reads. With no `kind`, the condition
                                is the resource's own. A `kind` of
                                `Observatory` or `Telescope` with no
                                `name` means the resource's own
                                observatory or telescope.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource, in this
                                namespace. A device kind needs a name.
                            type:
                              type: string
                              minLength: 1
                              maxLength: 316
                              description: >-
                                The condition's type, such as `Safe` or
                                `Parked`.
                            status:
                              type: string
                              enum: ["True", "False", Unknown]
                              default: "True"
                              description: >-
                                The status that the condition must have:
                                `True`, `False`, or `Unknown`. The
                                default is `True`.
                      after:
                        type: array
                        maxItems: 8
                        description: >-
                          The resources whose runs for the same event
                          must end before the action runs: the same
                          lifecycle step, or the same transition of the
                          same condition. A resource with no such run is
                          not waited for. A resource in a later tier of
                          the tree is waited for until the action's
                          timeout, and the action then fails.
                        items:
                          type: object
                          required: [kind]
                          description: >-
                            One resource, by its kind and name.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource. With no
                                `name`, the reference names every
                                resource of the kind in the observatory,
                                or the resource's own `Observatory` or
                                `Telescope`.
                deactivation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as this resource's
                    `Telescope` or `Observatory` stops being `Active`,
                    while every device is still connected. For a
                    `Telescope` or an `Observatory`, that is the
                    resource itself. The `Reservation`'s `Deactivation`
