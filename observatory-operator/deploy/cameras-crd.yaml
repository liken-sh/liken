                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `STREAM_ON`. Absent when no member is on.
                streamDepth:
                  type: object
                  description: >-
                    The depth of each pixel of the video stream, 8 or 16
                    bits. The status holds what the driver reports in
                    `STREAM_FULL_DEPTH`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `FULL_DEPTH_8BIT`. Absent when no member is on.
                streamDelay:
                  type: object
                  description: >-
                    The delay between the frames of the video stream, in
                    seconds. The status holds what the driver reports in
                    `STREAM_DELAY`.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        seconds.
                streamingExposure:
                  type: object
                  description: >-
                    The exposure of each frame of the video stream. The
                    status holds what the driver reports in
                    `STREAMING_EXPOSURE`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    duration:
                      type: number
                      description: >-
                        The length of each exposure, in seconds. Some
                        cameras do not control it. The member is
                        `STREAMING_EXPOSURE_VALUE`.
                    divisor:
                      type: number
                      description: >-
                        The stream sends one frame in this many. 1 sends
                        every frame. The member is
                        `STREAMING_DIVISOR_VALUE`.
                fps:
                  type: object
                  description: >-
                    The frame rate of the video stream, in frames per
                    second. The status holds what the driver reports in
                    `FPS`.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    instant:
                      type: number
                      description: >-
                        The rate of the last frames, in frames per
                        second. The member is `EST_FPS`.
                    average:
                      type: number
                      description: >-
                        The average rate over one second, in frames per
                        second. The member is `AVG_FPS`.
                recordStream:
                  type: object
                  description: >-
                    Starts or stops a recording of the video stream,
                    with no end, for the time, or for the frames in
                    `recordOptions`. The status holds what the driver
                    reports in `RECORD_STREAM`. Clients such as KStars
                    and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `RECORD_ON`. Absent when no member is on.
                recordFile:
                  type: object
                  description: >-
                    The file that a recording of the video stream
                    writes. The status holds what the driver reports in
                    `RECORD_FILE`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    directory:
                      type: string
                      description: >-
                        The directory, in the driver's container. The
                        member is `RECORD_FILE_DIR`.
                    name:
                      type: string
                      description: >-
                        The file's name. The member is
                        `RECORD_FILE_NAME`.
                recordOptions:
                  type: object
                  description: >-
                    When a recording of the video stream ends. The
                    status holds what the driver reports in
                    `RECORD_OPTIONS`. Clients such as KStars and Ekos
                    change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    duration:
                      type: number
                      description: >-
                        The length of a recording, in seconds. The
                        member is `RECORD_DURATION`.
                    frames:
                      type: number
                      description: >-
                        The length of a recording, in frames. The member
                        is `RECORD_FRAME_TOTAL`.
                streamFrame:
                  type: object
                  description: >-
                    The area of the sensor that the video stream reads,
                    in pixels. The status holds what the driver reports
                    in `CCD_STREAM_FRAME`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    x:
                      type: number
                      description: >-
                        The left edge of the area, in pixels. The member
                        is `X`.
                    "y":
                      type: number
                      description: >-
                        The top edge of the area, in pixels. The member
                        is `Y`.
                    width:
                      type: number
                      description: >-
                        The width of the area, in pixels. The member is
                        `WIDTH`.
                    height:
                      type: number
                      description: >-
                        The height of the area, in pixels. The member is
                        `HEIGHT`.
                streamEncoder:
                  type: object
                  description: >-
                    The encoder of the video stream, raw or MJPEG. The
                    status holds what the driver reports in
                    `CCD_STREAM_ENCODER`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `RAW`. Absent when no member is on.
                streamRecorder:
                  type: object
                  description: >-
                    The format of a recording of the video stream. The
                    status holds what the driver reports in
                    `CCD_STREAM_RECORDER`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `SER`. Absent when no member is on.
                streamLimits:
                  type: object
                  description: >-
                    The limits of the video stream. The status holds
                    what the driver reports in `LIMITS`. Clients such as
                    KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    bufferMax:
                      type: number
                      description: >-
                        The largest buffer of frames, in megabytes. The
                        member is `LIMITS_BUFFER_MAX`.
                    previewFps:
                      type: number
                      description: >-
                        The greatest rate that the stream sends to a
                        client, in frames per second. The member is
                        `LIMITS_PREVIEW_FPS`.
                dspConvolution:
                  type: object
                  description: >-
                    Turns the convolution of each frame on or off. The
                    status holds what the driver reports in
                    `DSP_ACTIVATE_CONVOLUTION`. Clients such as KStars
                    and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                dspDft:
                  type: object
                  description: >-
                    Turns the discrete Fourier transform of each frame
                    on or off. The status holds what the driver reports
                    in `DSP_ACTIVATE_DFT`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                dspIdft:
                  type: object
                  description: >-
                    Turns the inverse discrete Fourier transform of each
                    frame on or off. The status holds what the driver
                    reports in `DSP_ACTIVATE_IDFT`. Clients such as
                    KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                dspSpectrum:
                  type: object
                  description: >-
                    Turns the spectrum of each frame on or off. The
                    status holds what the driver reports in
                    `DSP_ACTIVATE_SPECTRUM`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                dspHistogram:
                  type: object
                  description: >-
                    Turns the histogram of each frame on or off. The
                    status holds what the driver reports in
                    `DSP_ACTIVATE_HISTOGRAM`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                dspWavelets:
                  type: object
                  description: >-
                    Turns the wavelet transform of each frame on or off.
                    The status holds what the driver reports in
                    `DSP_ACTIVATE_WAVELETS`. Clients such as KStars and
                    Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `DSP_ACTIVATE_ON`. Absent when no member is on.
                gain:
                  type: object
                  description: >-
                    The sensor's gain, in the driver's own units. The
                    status holds what the driver reports in `CCD_GAIN`.
                    `spec.gain` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        the driver's own.
                offset:
                  type: object
                  description: >-
                    The level that the sensor adds to each pixel, in the
                    driver's own units. The status holds what the driver
                    reports in `CCD_OFFSET`. `spec.offset` sets it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        the driver's own.
                cooler:
                  type: object
                  description: >-
                    Turns the sensor's cooler on or off. The `cool` and
                    `warm` actions change it. The status holds what the
                    driver reports in `CCD_COOLER`. Clients such as
                    KStars and Ekos change it.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: string
                      description: >-
                        The name of the member that is on, such as
                        `COOLER_ON`. Absent when no member is on.
                coolerPower:
                  type: object
                  description: >-
                    The power that the cooler draws, in percent of its
                    greatest power. The status holds what the driver
                    reports in `CCD_COOLER_POWER`.
                  properties:
                    state:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The property's state: `Busy` while the driver
                        carries out a change, `Ok` when the last change
                        ended well, `Alert` when it failed, and `Idle`
                        before the first change.
                    value:
                      type: number
                      description: >-
                        The value that the driver reports. The unit is
                        percent.
                display:
                  type: object
                  description: >-
                    The values of the typed fields as a person reads
                    them, with their units, for the printer columns.
                  properties:
                    temperature:
                      type: string
                      description: "The sensor's temperature, such as `-9.8 °C`."
                    setpoint:
                      type: string
                      description: "The setpoint of the `cool` action in `spec.activation`, such as `-10 °C`."
                    cooler:
                      type: string
                      description: "`On` or `Off`, from `CCD_COOLER`."
                    coolerPower:
                      type: string
                      description: "The cooler's power, such as `42 %`."
                    exposure:
                      type: string
                      description: "The time left, such as `12 s`, while an exposure runs. Otherwise the state of `CCD_EXPOSURE` in one word: `Idle` before the first exposure, `Done` when it ended (`Ok`), and `Failed` when it failed (`Alert`)."
