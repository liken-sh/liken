# A `Camera` is an imaging or guiding camera: an INDI driver with
# `CCD_INTERFACE`.
#
# A device resource is inventory: `observatory-operator` starts its pod
# only while a `Reservation` needs it. The fields that every device
# shares, `spec.driver`, `spec.power`, `spec.claim`, and every status
# field except `status.readings`, are the same in all 14 device CRDs. A
# test in the `observatory` package holds them equal, and holds each CRD
# equal to its Go type.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cameras.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Camera
    listKind: CameraList
    plural: cameras
    singular: camera
    shortNames: [cam]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      selectableFields:
        - jsonPath: .spec.opticalTrain
      additionalPrinterColumns:
        - name: Train
          type: string
          jsonPath: .spec.opticalTrain
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Temp
          type: string
          jsonPath: .status.display.temperature
        - name: Setpoint
          type: string
          jsonPath: .status.display.setpoint
        - name: Cooler
          type: string
          jsonPath: .status.display.cooler
        - name: Exposure
          type: string
          jsonPath: .status.display.exposure
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Cooler Power
          type: string
          jsonPath: .status.display.coolerPower
          priority: 1
        - name: Driver
          type: string
          jsonPath: .spec.driver.name
          priority: 1
        - name: Device
          type: string
          jsonPath: .status.indiDevice
          priority: 1
        - name: Node
          type: string
          jsonPath: .status.node
          priority: 1
        - name: Message
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].message'
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A `Camera` is an imaging or guiding camera: an INDI driver
            with `CCD_INTERFACE`. It belongs to one `OpticalTrain`, and
            the operator writes the camera's `ACTIVE_DEVICES` from that
            train, so the camera snoops the mount, focuser, filter
            wheel, and rotator of its own light path.
          required: [spec]
          properties:
            spec:
              type: object
              required: [driver]
              description: >-
                One camera, with INDI's `CCD_INTERFACE`. The operator
                writes each setting that the spec states when a
                reservation configures the camera, and leaves the others
                as the driver sets them.
              properties:
                opticalTrain:
                  type: string
                  minLength: 1
                  maxLength: 253
                  pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                  description: >-
                    The name of the `OpticalTrain` that the device is
                    on. The train's members set what each camera on it
                    snoops.
                    Optional. With no `opticalTrain`, the device is on
                    the shelf, and the operator creates nothing for it.
                driver:
                  type: object
                  required: [name]
                  description: >-
                    The INDI driver that runs the device. With no
                    `image`, the operator runs the image that the `indi`
                    build lists for the driver, so `name` must then be
                    an INDI driver that the image holds, such as
                    `indi_simulator_ccd`.
                  x-kubernetes-validations:
                    - rule: "has(self.image) || self.name.matches('^indi_[a-z0-9_]+$')"
                      message: "driver.name must match ^indi_[a-z0-9_]+$ when driver.image is not set"
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: "^[A-Za-z0-9_][A-Za-z0-9_.+-]*$"
                      description: >-
                        The driver's executable, such as
                        `indi_simulator_ccd`. The device's pod runs it
                        under `socat`, so the name holds no path, no
                        space, no comma, and no colon.
                    image:
                      type: string
                      minLength: 1
                      maxLength: 512
                      description: >-
                        The container image that holds the driver, used
                        as written. The image must hold `/usr/bin/socat`
                        and the driver on `PATH`, and must run as user
                        1000 with a read-only root filesystem and a
                        writable `/tmp`. An image built `FROM
                        ghcr.io/liken-sh/indi` meets all three.
                        Optional.
                power:
                  type: object
                  required: [switch, output]
                  description: >-
                    The `Switch` output that powers the device.
                    Activation switches the output on before the
                    device's pod starts, and deactivation switches it
                    off after the pod stops. Optional. With no power, a
                    person powers the device on and off by hand.
                  properties:
                    switch:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                      description: "The name of a `Switch` in this namespace."
                    output:
                      type: integer
                      format: int32
                      minimum: 1
                      description: >-
                        The number of the output, from 1, as the driver
                        numbers `DIGITAL_OUTPUT_1`.
                claim:
                  type: object
                  description: >-
                    A `ResourceClaimSpec` of the `resource.k8s.io` API,
                    for real hardware. The operator creates a
                    `ResourceClaim` from it for the device's pod. The
                    API server validates it when the operator creates
                    the claim. Optional. A simulator needs no claim.
                  x-kubernetes-preserve-unknown-fields: true
                gain:
                  type: number
                  minimum: 0
                  description: >-
                    The sensor's gain, written to `CCD_GAIN`, in the
                    driver's own units. Optional.
                offset:
                  type: number
                  minimum: 0
                  description: >-
                    The sensor's offset, written to `CCD_OFFSET`, in the
                    driver's own units. Optional.
                activation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as the device's
                    `Telescope` or `Observatory` turns `Active`, while
                    every device is still connected. The `Reservation`'s
                    `Activation` step waits for them. Each action is a
                    target state, so a run that an operator restart
                    interrupted runs again each action that is not
                    `Done`. Optional.
                  items:
                    type: object
                    description: >-
                      One action, which names exactly one of `cool` and
                      `warm`.
                    x-kubernetes-validations:
                      - rule: "[has(self.cool), has(self.warm)].filter(x, x).size() == 1"
                        message: "an action names exactly one of cool and warm"
                    properties:
                      cool:
                        type: object
                        required: [celsius]
                        description: >-
                          Cools the sensor: the operator writes
                          `celsius` to `CCD_TEMPERATURE` and waits until
                          the sensor is within `within` of it. The
                          default timeout is 20 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      warm:
                        type: object
                        required: [celsius]
                        description: >-
                          Warms the sensor before its cooler goes off:
                          the operator writes `celsius` to
                          `CCD_TEMPERATURE`, waits until the sensor is
                          within `within` of it or until the timeout,
                          and switches `CCD_COOLER` off. A cooler cannot
                          warm a sensor above the air around it, so the
                          timeout ends the wait and does not fail the
                          action. The default timeout is 10 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      timeout:
                        type: string
                        maxLength: 32
                        description: >-
                          How long the action may take, its waits for
                          `requires` and `after` included, as a duration
                          such as `20m`. An action that passes it fails.
                          Optional. Each action has a default.
                        x-kubernetes-validations:
                          - rule: "self.matches('^([0-9]+(\\\\.[0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                            message: "timeout must be a positive duration, such as 20m or 1h30m"
                      requires:
                        type: array
                        maxItems: 8
                        description: >-
                          The conditions that must hold before the
                          action runs. The operator waits for each one
                          until the action's timeout. They bind only the
                          actions that the operator runs: a move that a
                          person makes in KStars is stopped only by the
                          drivers' park locks.
                        items:
                          type: object
                          required: [type]
                          description: >-
                            One condition, and the status it must have.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource whose condition
                                it reads. With no `kind`, the condition
                                is the resource's own. A `kind` of
                                `Observatory` or `Telescope` with no
                                `name` means the resource's own
                                observatory or telescope.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource, in this
                                namespace. A device kind needs a name.
                            type:
                              type: string
                              minLength: 1
                              maxLength: 316
                              description: >-
                                The condition's type, such as `Safe` or
                                `Parked`.
                            status:
                              type: string
                              enum: ["True", "False", Unknown]
                              default: "True"
                              description: >-
                                The status that the condition must have:
                                `True`, `False`, or `Unknown`. The
                                default is `True`.
                      after:
                        type: array
                        maxItems: 8
                        description: >-
                          The resources whose runs for the same event
                          must end before the action runs: the same
                          lifecycle step, or the same transition of the
                          same condition. A resource with no such run is
                          not waited for. A resource in a later tier of
                          the tree is waited for until the action's
                          timeout, and the action then fails.
                        items:
                          type: object
                          required: [kind]
                          description: >-
                            One resource, by its kind and name.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource. With no
                                `name`, the reference names every
                                resource of the kind in the observatory,
                                or the resource's own `Observatory` or
                                `Telescope`.
                deactivation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as the device's
                    `Telescope` or `Observatory` stops being `Active`,
                    while every device is still connected. The
                    `Reservation`'s `Deactivation` step waits for them.
                    Each action is a target state, so a run that an
                    operator restart interrupted runs again each action
                    that is not `Done`. Optional.
                  items:
                    type: object
                    description: >-
                      One action, which names exactly one of `cool` and
                      `warm`.
                    x-kubernetes-validations:
                      - rule: "[has(self.cool), has(self.warm)].filter(x, x).size() == 1"
                        message: "an action names exactly one of cool and warm"
                    properties:
                      cool:
                        type: object
                        required: [celsius]
                        description: >-
                          Cools the sensor: the operator writes
                          `celsius` to `CCD_TEMPERATURE` and waits until
                          the sensor is within `within` of it. The
                          default timeout is 20 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      warm:
                        type: object
                        required: [celsius]
                        description: >-
                          Warms the sensor before its cooler goes off:
                          the operator writes `celsius` to
                          `CCD_TEMPERATURE`, waits until the sensor is
                          within `within` of it or until the timeout,
                          and switches `CCD_COOLER` off. A cooler cannot
                          warm a sensor above the air around it, so the
                          timeout ends the wait and does not fail the
                          action. The default timeout is 10 minutes.
                        properties:
                          celsius:
                            type: number
                            minimum: -100
                            maximum: 50
                            description: >-
                              The setpoint, in degrees Celsius.
                          within:
                            type: number
                            minimum: 0
                            exclusiveMinimum: true
                            maximum: 10
                            default: 0.5
                            description: >-
                              How close to the setpoint the sensor must
                              come, in degrees Celsius. The default is
                              0.5.
                      timeout:
                        type: string
                        maxLength: 32
                        description: >-
                          How long the action may take, its waits for
                          `requires` and `after` included, as a duration
                          such as `20m`. An action that passes it fails.
                          Optional. Each action has a default.
                        x-kubernetes-validations:
                          - rule: "self.matches('^([0-9]+(\\\\.[0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                            message: "timeout must be a positive duration, such as 20m or 1h30m"
                      requires:
                        type: array
                        maxItems: 8
                        description: >-
                          The conditions that must hold before the
                          action runs. The operator waits for each one
                          until the action's timeout. They bind only the
                          actions that the operator runs: a move that a
                          person makes in KStars is stopped only by the
                          drivers' park locks.
                        items:
                          type: object
                          required: [type]
                          description: >-
                            One condition, and the status it must have.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource whose condition
                                it reads. With no `kind`, the condition
                                is the resource's own. A `kind` of
                                `Observatory` or `Telescope` with no
                                `name` means the resource's own
                                observatory or telescope.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource, in this
                                namespace. A device kind needs a name.
                            type:
                              type: string
                              minLength: 1
                              maxLength: 316
                              description: >-
                                The condition's type, such as `Safe` or
                                `Parked`.
                            status:
                              type: string
                              enum: ["True", "False", Unknown]
                              default: "True"
                              description: >-
                                The status that the condition must have:
                                `True`, `False`, or `Unknown`. The
                                default is `True`.
                      after:
                        type: array
                        maxItems: 8
                        description: >-
                          The resources whose runs for the same event
                          must end before the action runs: the same
                          lifecycle step, or the same transition of the
                          same condition. A resource with no such run is
                          not waited for. A resource in a later tier of
                          the tree is waited for until the action's
                          timeout, and the action then fails.
                        items:
                          type: object
                          required: [kind]
                          description: >-
                            One resource, by its kind and name.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource. With no
                                `name`, the reference names every
                                resource of the kind in the observatory,
                                or the resource's own `Observatory` or
                                `Telescope`.
            status:
              type: object
              description: >-
                What the operator observes. The operator writes it, and
                a person reads it.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: >-
                    The `metadata.generation` of the spec that the
                    operator last acted on.
                phase:
                  type: string
                  enum: [Inventory, Idle, Starting, Connecting, Connected, Disconnecting, Error]
                  description: >-
                    The device's state in one word. `Inventory`: the
                    device is on the shelf, with no parent, and the
                    operator creates nothing for it. `Idle`: the device
                    is installed, but no reservation of its telescope or
                    its observatory is active, so it has no pod.
                    `Starting`: a reservation's activation began, or the
                    device's pod starts. `Connecting`:
                    the operator asked the driver to connect.
                    `Connected`: the driver reports the device
                    connected. `Disconnecting`: the operator asked the
                    driver to disconnect, or stops the pod. `Error`: a
                    step failed, and the `Ready` condition gives the
                    reason.
                conditions:
                  type: array
                  description: >-
                    `Ready` is `True` while the device is connected.
                    `ParentFound` is `False` when a resource that the
                    spec names, up to the `Observatory`, does not exist,
                    and its message names the missing resource. A
                    device on the shelf names no parent, and its
                    `ParentFound` is `True` with the reason `NoParent`.
                    While a device is connected, it also reports the
                    state that the triggers of procedures read, by
                    kind: a `Dome` `Parked` and `Open` (the shutter), a
                    `Mount` `Parked` and `Tracking`, a `DustCap` `Open`,
                    a `FlatPanel` `Lit` (the light), a `Camera`
                    `Cooling` (the cooler), and a `WeatherStation`
                    `Safe`. A park, a shutter, or a cover that moves is
                    `Unknown` with the reason `Moving`. `Safe` is
                    `False` with the reason `Warning` or `Danger`. A
                    device that is not connected has none of them.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    description: >-
                      One condition, in the shape of `metav1.Condition`.
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: "The condition's name, such as `Ready`."
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                        description: >-
                          Whether the condition holds: `True`, `False`,
                          or `Unknown`.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` of the spec that the
                          condition judged.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        description: "One word in CamelCase for the cause."
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The cause, for a person to read. It can be
                          empty.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When `status` last changed. A write with the
                          same status keeps this time.
                procedures:
                  type: array
                  description: >-
                    The last run of each trigger of the resource's
                    procedures: `activation`, `deactivation`, and
                    `on[0]` and so on for each item of `spec.on`. An
                    operator that restarts resumes a run from this
                    record.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [trigger]
                  items:
                    type: object
                    required: [trigger, state]
                    description: >-
                      The last run of one trigger.
                    properties:
                      trigger:
                        type: string
                        description: >-
                          The trigger: `activation`, `deactivation`, or
                          `on[0]` for the first item of `spec.on`.
                      since:
                        type: string
                        format: date-time
                        description: >-
                          The transition time of the condition that the
                          run answers: the `lastTransitionTime` of
                          `Active` for activation and deactivation.
                      state:
                        type: string
                        enum: [Pending, Running, Done, Failed, Skipped]
                        description: >-
                          The run's progress: `Pending`, `Running`,
                          `Done`, `Failed`, or `Skipped` when it had
                          nothing to do.
                      startTime:
                        type: string
                        format: date-time
                        description: >-
                          When the run began to run.
                      stopTime:
                        type: string
                        format: date-time
                        description: >-
                          When the run ended.
                      summary:
                        type: string
                        description: >-
                          What the run waits for or did.
                      actions:
                        type: array
                        description: >-
                          Each action of the run, in order.
                        items:
                          type: object
                          required: [action, state]
                          description: >-
                            One action.
                          properties:
                            action:
                              type: string
                              description: >-
                                The action as its YAML reads, such as
                                `state: Parked` or `cool: -10 °C within
                                0.5 °C`.
                            state:
                              type: string
                              enum: [Pending, Running, Done, Failed, Skipped]
                              description: >-
                                The action's progress: `Pending`,
                                `Running`, `Done`, `Failed`, or
                                `Skipped` when it had nothing to do.
                            startTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action began to run.
                            stopTime:
                              type: string
                              format: date-time
                              description: >-
                                When the action ended.
                            summary:
                              type: string
                              description: >-
                                What the action waits for or did.
                indiDevice:
                  type: string
                  description: >-
                    The name that the driver gives its device on the
                    INDI server, such as `CCD Simulator`. KStars shows
                    this name.
                driver:
                  type: string
                  description: "The driver that the device's pod runs."
                image:
                  type: string
                  description: >-
                    The image that the device's pod runs, after the
                    operator resolved it.
                pod:
                  type: string
                  description: "The name of the device's pod, while it exists."
                node:
                  type: string
                  description: "The node that runs the device's pod."
                properties:
                  type: array
                  description: >-
                    Every property that the device defines, as the
                    driver defines it, with the values of its last
                    update. A vendor's own properties are here, and no
                    typed reading depends on one. The list holds no BLOB
                    data.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, permission, state]
                    description: "One INDI property."
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: >-
                          The property's name, such as
                          `CCD_TEMPERATURE`.
                      label:
                        type: string
                        description: >-
                          The label that the driver gives the property.
                      group:
                        type: string
                        description: >-
                          The group, or tab, that the driver puts the
                          property in.
                      type:
                        type: string
                        enum: [Number, Switch, Text, Light, BLOB]
                        description: "The type of the members' values."
                      permission:
                        type: string
                        enum: [ro, wo, rw]
                        description: >-
                          Whether a client can write the property: `ro`
                          read-only, `wo` write-only, or `rw` read and
                          write.
                      state:
                        type: string
                        enum: [Idle, Ok, Busy, Alert]
                        description: >-
                          The property's state: `Busy` while the driver
                          carries out a change, `Ok` or `Alert` when the
                          change ends.
                      rule:
                        type: string
                        enum: [OneOfMany, AtMostOne, AnyOfMany]
                        description: >-
                          For a switch property, how many members can be
                          on at once.
                      members:
                        type: array
                        description: >-
                          The property's members, in the driver's order.
                        x-kubernetes-list-type: map
                        x-kubernetes-list-map-keys: [name]
                        items:
                          type: object
                          required: [name]
                          description: "One member of the property."
                          properties:
                            name:
                              type: string
                              minLength: 1
                              description: >-
                                The member's name, such as
                                `CCD_TEMPERATURE_VALUE`.
                            label:
                              type: string
                              description: >-
                                The label that the driver gives the
                                member.
                            value:
                              type: string
                              description: >-
                                The value as text: a number in the
                                member's format, `On` or `Off` for a
                                switch, a state for a light, or the
                                text. A BLOB member has no value here.
                            min:
                              type: number
                              description: >-
                                For a number, the least value that the
                                driver accepts.
                            max:
                              type: number
                              description: >-
                                For a number, the greatest value that
                                the driver accepts.
                            step:
                              type: number
                              description: >-
                                For a number, the step between values.
                                Zero means any step.
                display:
                  type: object
                  description: >-
                    The readings as a person reads them, with their units,
                    for the printer columns. The numbers are in `readings`.
                  properties:
                    temperature:
                      type: string
                      description: "The sensor's temperature, such as `-9.8 °C`."
                    setpoint:
                      type: string
                      description: "The setpoint of the `cool` action in `spec.activation`, such as `-10 °C`."
                    cooler:
                      type: string
                      description: "`On` or `Off`, from `CCD_COOLER`."
                    coolerPower:
                      type: string
                      description: "The cooler's power, such as `42 %`."
                    exposure:
                      type: string
                      description: "The time left, such as `12 s`, while an exposure runs, and the state of `CCD_EXPOSURE` otherwise."
                readings:
                  type: object
                  description: >-
                    What the camera reports, from `CCD_TEMPERATURE`,
                    `CCD_COOLER`, `CCD_COOLER_POWER`, and
                    `CCD_EXPOSURE`. A field is absent until the driver
                    sends it.
                  properties:
                    temperature:
                      type: number
                      description: >-
                        The sensor's temperature, in degrees Celsius.
                    cooler:
                      type: boolean
                      description: >-
                        Whether the cooler is on: `true` while the
                        `COOLER_ON` member of `CCD_COOLER` is on.
                    coolerPower:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: "The cooler's power, in percent."
                    exposureState:
                      type: string
                      enum: [Idle, Ok, Busy, Alert]
                      description: >-
                        The state of `CCD_EXPOSURE`: `Busy` while an
                        exposure runs, `Ok` when it ended, and `Alert`
                        when it failed.
                    exposureRemaining:
                      type: number
                      minimum: 0
                      description: "The time left in the exposure, in seconds."
