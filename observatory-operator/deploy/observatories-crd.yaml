# An `Observatory` is the building and the site: the roof, the weather,
# and the location. It is the top of the tree, and every other kind
# names it, directly or through a `Telescope`.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: observatories.observatory.liken.sh
spec:
  group: observatory.liken.sh
  names:
    kind: Observatory
    listKind: ObservatoryList
    plural: observatories
    singular: observatory
    shortNames: [obs]
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Latitude
          type: string
          jsonPath: .status.display.latitude
        - name: Longitude
          type: string
          jsonPath: .status.display.longitude
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Weather
          type: string
          jsonPath: .status.weather
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Telescopes
          type: string
          jsonPath: .status.telescopes
          priority: 1
        - name: Reservations
          type: string
          jsonPath: .status.reservations
          priority: 1
        - name: Server
          type: string
          jsonPath: .status.server.host
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            An `Observatory` is the building and the site: the roof, the
            weather, and the location. `observatory-operator` runs one
            INDI server for the devices that no telescope owns, such as
            the `Dome` and the `WeatherStation`, while at least one
            `Reservation` of a telescope here is active.
          required: [spec]
          properties:
            spec:
              type: object
              required: [location]
              description: "The site."
              properties:
                location:
                  type: object
                  required: [latitude, longitude, elevation]
                  description: >-
                    Where the site is. The operator writes it to each
                    mount and GPS as `GEOGRAPHIC_COORD`, which takes the
                    longitude from 0 to 360 degrees east, and converts a
                    negative longitude to that range.
                  properties:
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                      description: >-
                        The latitude, in degrees north, from -90 to 90.
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                      description: >-
                        The longitude, in degrees east, from -180 to
                        180. A site west of Greenwich has a negative
                        longitude.
                    elevation:
                      type: number
                      minimum: -500
                      maximum: 9000
                      description: >-
                        The elevation, in meters above mean sea level.
                activation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as this resource's
                    `Telescope` or `Observatory` turns `Active`, while
                    every device is still connected. For a `Telescope`
                    or an `Observatory`, that is the resource itself.
                    The `Reservation`'s `Activation` step waits for
                    them. Each action is a target state, so a run that
                    an operator restart interrupted runs again each
                    action that is not `Done`. Optional.
                  items:
                    type: object
                    description: >-
                      One action, which names `job`.
                    x-kubernetes-validations:
                      - rule: "has(self.job)"
                        message: "an action of an Observatory names job"
                    properties:
                      job:
                        type: object
                        required: [image]
                        description: >-
                          A container that the operator runs once as a
                          Kubernetes `Job` in the operator's namespace,
                          for what no other action does, such as
                          switching a dew heater's relay or posting to a
                          webhook. The resource owns the `Job`. The
                          action is `Done` when the `Job` succeeds, and
                          `Failed` with the `Job`'s reason and message
                          when it fails. The `Job` has no retry, and its
                          `activeDeadlineSeconds` is the action's
                          timeout. Kubernetes deletes it an hour after
                          it ends. The environment adds
                          `LIKEN_OBSERVATORY`, `LIKEN_TELESCOPE` for a
                          resource of a telescope, `LIKEN_RESOURCE` such
                          as `Dome/lab`, `LIKEN_TRIGGER` such as
                          `activation` or `triggers[0]`, and `INDI_HOST`
                          and `INDI_PORT` of the resource's INDI server.
                          The container runs as user 1000 with no
                          capabilities, on a read-only root filesystem
                          with a writable `/tmp`. The default timeout is
                          10 minutes.
                        properties:
                          image:
                            type: string
                            minLength: 1
                            maxLength: 512
                            description: >-
                              The container image, used as written, such
                              as `busybox:1.37`.
                          command:
                            type: array
                            maxItems: 32
                            description: >-
                              The command that replaces the image's
                              entrypoint, as a container's `command`
                              does. Optional.
                            items:
                              type: string
                              maxLength: 4096
                          args:
                            type: array
                            maxItems: 64
                            description: >-
                              The arguments of the command, as a
                              container's `args` are. Optional.
                            items:
                              type: string
                              maxLength: 4096
                          env:
                            type: array
                            maxItems: 32
                            description: >-
                              Variables that the operator adds to the
                              container's environment before its own, as
                              `{name, value}`. A variable that has the
                              name of one of the operator's own is
                              replaced by the operator's. Optional.
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys: [name]
                            items:
                              type: object
                              required: [name, value]
                              description: >-
                                One variable.
                              properties:
                                name:
                                  type: string
                                  minLength: 1
                                  maxLength: 256
                                  pattern: "^[-._a-zA-Z][-._a-zA-Z0-9]*$"
                                  description: >-
                                    The variable's name, such as
                                    `RELAY_URL`.
                                value:
                                  type: string
                                  maxLength: 32768
                                  description: >-
                                    The variable's value. It can be
                                    empty.
                      timeout:
                        type: string
                        maxLength: 32
                        description: >-
                          How long the action may take, its waits for
                          `requires` and `after` included, as a duration
                          such as `20m`. An action that passes it fails.
                          Optional. Each action has a default.
                        x-kubernetes-validations:
                          - rule: "self.matches('^([0-9]+(\\\\.[0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                            message: "timeout must be a positive duration, such as 20m or 1h30m"
                      requires:
                        type: array
                        maxItems: 8
                        description: >-
                          The conditions that must hold before the
                          action runs. The operator waits for each one
                          until the action's timeout. They bind only the
                          actions that the operator runs: a move that a
                          person makes in KStars is stopped only by the
                          drivers' park locks.
                        items:
                          type: object
                          required: [type]
                          description: >-
                            One condition, and the status it must have.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource whose condition
                                it reads. With no `kind`, the condition
                                is the resource's own. A `kind` of
                                `Observatory` or `Telescope` with no
                                `name` means the resource's own
                                observatory or telescope.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource, in this
                                namespace. A device kind needs a name.
                            type:
                              type: string
                              minLength: 1
                              maxLength: 316
                              description: >-
                                The condition's type, such as `Safe` or
                                `Parked`.
                            status:
                              type: string
                              enum: ["True", "False", Unknown]
                              default: "True"
                              description: >-
                                The status that the condition must have:
                                `True`, `False`, or `Unknown`. The
                                default is `True`.
                      after:
                        type: array
                        maxItems: 8
                        description: >-
                          The resources whose runs for the same event
                          must end before the action runs: the same
                          lifecycle step, or the same transition of the
                          same condition. A resource with no such run is
                          not waited for. A resource in a later tier of
                          the tree is waited for until the action's
                          timeout, and the action then fails.
                        items:
                          type: object
                          required: [kind]
                          description: >-
                            One resource, by its kind and name.
                          properties:
                            kind:
                              type: string
                              enum: [Observatory, Telescope, OpticalTube, OpticalTrain, Mount, Camera, FilterWheel, Focuser, Rotator, DustCap, FlatPanel, PolarAligner, GPS, Dome, WeatherStation, SkyQualityMeter, Switch, Receiver, Guider]
                              description: >-
                                The kind of the resource.
                            name:
                              type: string
                              minLength: 1
                              maxLength: 253
                              pattern: "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$"
                              description: >-
                                The name of the resource. With no
                                `name`, the reference names every
                                resource of the kind in the observatory,
                                or the resource's own `Observatory` or
                                `Telescope`.
                deactivation:
                  type: array
                  maxItems: 16
                  description: >-
                    The actions that run, in order, as this resource's
                    `Telescope` or `Observatory` stops being `Active`,
                    while every device is still connected. For a
                    `Telescope` or an `Observatory`, that is the
                    resource itself. The `Reservation`'s `Deactivation`
                    step waits for them. Each action is a target state,
                    so a run that an operator restart interrupted runs
                    again each action that is not `Done`. Optional.
                  items:
                    type: object
                    description: >-
                      One action, which names `job`.
                    x-kubernetes-validations:
                      - rule: "has(self.job)"
                        message: "an action of an Observatory names job"
                    properties:
                      job:
                        type: object
                        required: [image]
                        description: >-
