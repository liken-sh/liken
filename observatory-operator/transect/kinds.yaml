# The train is the path of light from one tube to a camera, in the order
# that the light passes the parts: a flat panel and a dust cap in front
# of the tube, the tube, then a focuser, a rotator, a filter wheel, and a
# camera, and the guider that reads the camera last.  Each part names
# the train in `spec.opticalTrain`, except the tube, which the train
# names.  The parts join end to end, so they touch on the light's axis.
# A train with no part in a role, such as a guide train with no focuser,
# draws the next part against the one before it.  Each column of the
# sketch is a share of the train's width, so the tube has four columns
# and each device one.
#
# The page of a `Telescope` draws this elevation for each of its trains,
# and the page of an `OpticalTrain` draws it as its only elevation.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: opticaltrains.observatory.liken.sh
spec:
  summary: The path of light from one tube to a camera, and the devices on it.
  healthy: {condition: ParentFound}
  references:
    - {path: spec.telescope, kind: Telescope, group: observatory.liken.sh, edge: part of}
    - {path: spec.opticalTube, kind: OpticalTube, group: observatory.liken.sh, label: optical tube}
  roles:
    panel:   {namedBy: {kind: FlatPanel, path: spec.opticalTrain}, reads: [Light, Brightness]}
    cap:     {namedBy: {kind: DustCap, path: spec.opticalTrain}, reads: [Cover]}
    tube:    {reference: spec.opticalTube, expected: true, reads: [Aperture, Focal Length]}
    focuser: {namedBy: {kind: Focuser, path: spec.opticalTrain}, reads: [Position]}
    rotator: {namedBy: {kind: Rotator, path: spec.opticalTrain}, reads: [Angle]}
    wheel:   {namedBy: {kind: FilterWheel, path: spec.opticalTrain}, reads: [Filter, Slot]}
    camera:  {namedBy: {kind: Camera, path: spec.opticalTrain}, expected: true, reads: [Temp, Setpoint, Cooler, Exposure]}
    guider:  {namedBy: {kind: Guider, path: spec.opticalTrain}, reads: [State, RMS]}
  elevations:
    - name: the train
      question: What does the light pass through, in order?
      sketch: |
        panel  cap  tube  tube  tube  tube  focuser  rotator  wheel  camera  guider
  controller: {image: liken-sh/observatory-operator}
---
