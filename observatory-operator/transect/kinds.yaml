# The page of a `Telescope` draws the rig: the telescope from the side,
# with the light entering at the left.  Its parts are the objects that
# name the telescope, so most roles are `namedBy` a kind and its
# `spec.telescope`.
#
# A telescope has any number of optical trains, and each is drawn as the
# train's own elevation, "the train", which the knowledge of an
# `OpticalTrain` below states.  The guide train is the train that the
# `Guider` names: `guide` reads each `Guider` that names the telescope,
# and follows its `spec.opticalTrain` to the train.  A sketch draws an
# object in one role only, the first in the order of the sketch's
# cells, so `guide` stands above `main`, draws the guide train, and
# `main`, the imaging train, draws every other train.  With no
# `Guider`, `main` draws every train.
#
# The guide train stands on the main train, and the main train on the
# mount's saddle, because a tube joins on its top and its bottom and the
# mount on its top.  The cells beside the mount under the main train are
# `.`, because a `box` there does not join and would keep a gap between
# the train and the mount.  The boxes stand beside the mount in the rows
# under that.
#
# The INDI server runs only while a reservation uses the telescope, so
# `server` is expected while the telescope's `Active` condition is
# `True`.  Between reservations its place is drawn empty and at rest.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: telescopes.observatory.liken.sh
spec:
  summary: A mount and the optical trains on it, with the INDI server that a reservation connects to.
  healthy: {condition: Ready, calm: [Idle, Inventory]}
  references:
    - {path: spec.observatory, kind: Observatory, group: observatory.liken.sh, edge: part of}
    - {path: status.server.service, kind: Service, label: INDI server}
    - {path: status.server.node, kind: Node, edge: runs on}
    - {path: status.reservation.name, kind: Reservation, group: observatory.liken.sh, label: reserved by}
  roles:
    guide:       {namedBy: {kind: Guider, path: spec.telescope}, through: spec.opticalTrain, elevation: the train, label: guide train}
    main:        {namedBy: {kind: OpticalTrain, path: spec.telescope}, elevation: the train, label: imaging train, expected: true}
    mount:       {namedBy: {kind: Mount, path: spec.telescope}, expected: true, reads: [State, RA, Dec, Driver]}
    power:       {namedBy: {kind: Switch, path: spec.telescope}, reads: [On]}
    gps:         {namedBy: {kind: GPS, path: spec.telescope}, reads: [Fix]}
    aligner:     {namedBy: {kind: PolarAligner, path: spec.telescope}, reads: [Adjustment]}
    server:      {reference: status.server.service, label: INDI server, expected: {while: Active}, shows: [Host, Port]}
    reservation: {reference: status.reservation.name, shape: tag, reads: [Holder, Phase]}
  elevations:
    - name: the rig
      question: What is this telescope made of?
      sketch: |
        guide  guide  guide  guide    .            .
        main   main   main   main     main         main
        mount  mount  mount  .        .            .
        mount  mount  mount  power    server       server
        mount  mount  mount  gps      reservation  reservation
        mount  mount  mount  aligner  .            .
  controller: {image: liken-sh/observatory-operator}
---
