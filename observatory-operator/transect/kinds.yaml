# Kind knowledge that `transect` reads for the kinds of
# `observatory-operator`.
#
# Between reservations each device, train, and telescope has `Ready`
# `False` with the reason `Idle`, and a device that names no parent has
# the reason `Inventory`.  Both mean that the object is not in use, not
# that it is broken, so `calm` lists them, and `transect` draws the
# object at rest.  They are the phases `PhaseIdle` in
# `observatory/site.go` and `DeviceInventory` in `observatory/device.go`.
#
# Each piece of equipment names what it is part of.  A camera, a filter
# wheel, a focuser, a rotator, a dust cap, a flat panel, and a guider
# name their optical train in `spec.opticalTrain`.  A train, a tube, a
# mount, a guider, a switch, a GPS, and a polar aligner name their
# telescope in `spec.telescope`, and a telescope names its observatory.
# So the board of each object nests under the board of the object
# above it, and the page of a telescope draws the objects that name it.
#
# The operator that owns a kind states the shape that every sketch
# draws its objects in.  `shapes.yaml` beside this file has the shapes
# of a telescope's own parts: a `tube`, a `drawtube`, a `cover`, a
# `camera`, and an `equatorial-mount`.  A filter wheel is the library's
# `disc`.  A `Guider` is software that reads a camera, so it is the
# library's `tag`, a label beside the picture and not a piece of
# equipment.  A kind that states no shape, such as a `Switch`, is drawn
# as the library's `box`.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: cameras.observatory.liken.sh
spec:
  shape: camera
  healthy: {condition: Ready, calm: [Idle, Inventory]}
  references:
    - {path: spec.opticalTrain, kind: OpticalTrain, group: observatory.liken.sh, edge: part of}
  controller: {image: liken-sh/observatory-operator}
---
