# The operator that runs an observatory's hardware through INDI: the
# resources' CRDs and Go types, the INDI client, and the operator that
# runs each reserved telescope's pods and devices.
[package]
name = "observatory-operator"
license = "MIT"

# The operator's map of driver images is generated from indi/images/
# at the tag that indi/package.toml pins, and the guider's compositor
# is the weston image at the tag that weston/package.toml pins, so a
# bump of either runs these tests again. The image builds against the
# shared kubernetes module, and ships the license notices that notices/
# collects.
[depends]
components = ["indi", "kubernetes", "notices", "weston"]

[docs]
prefix = "observatory"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The go job runs the tests and the coverage
# gate.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# The image builds from this module's go.mod, which replaces the shared
# kubernetes module with ../kubernetes, so it takes that directory as a
# build context. The notices context holds the script that copies the
# license files of the modules the binary links.
[[outputs.images]]
name = "observatory-operator"
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }
