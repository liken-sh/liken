# The operator that controls an observatory's hardware through INDI. The
# component holds the CRDs and Go types of the resources, the INDI
# client, and the operator that runs the pods and devices of each
# reserved telescope.
[package]
name = "observatory-operator"
license = "MIT"

# The operator's map of driver images is generated from indi/images/
# and the tag in indi/package.toml, and the guider runs the weston image
# at the tag in weston/package.toml, so a bump of either reruns this
# component's tests. The images build against the kubernetes module and
# copy the license script from notices. The CLI image copies the CA
# bundle of trust, and the Go and distroless images are pinned in
# toolchains.
[depends]
components = ["indi", "kubernetes", "notices", "toolchains", "trust", "weston"]

[docs]
prefix = "observatory"

# The tests run with the race detector and a coverage profile, split
# across four runners because the operator's package alone is slow.
# Then this job sums the profiles of the shards and runs the coverage
# gate on the sum. .testcoverage.yml sets the threshold. On a
# workstation, `make test-go` runs the lint, the tests, and the gate in
# one process.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go-gate"
shards = 4
shard-run = "make test-go-shard"
timeout = 15
coverage = ["coverage.out"]

# gofmt, go vet, a tidy check of go.mod, and a check that every package
# has a test file. It runs in parallel with the shards, so a vet that
# compiles without a build cache does not delay the coverage gate.
[[jobs]]
name = "lint"
toolchain = "go"
run = "make test-go-lint"

# The link check, the check that the generated reference pages and
# skills are current, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the file hygiene checks. The lint job already runs gofmt, go vet,
# and the go.mod tidy check, so this job skips those hooks.
[[jobs]]
name = "prek"
toolchain = "prek"
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# This module's go.mod replaces the shared kubernetes module with
# ../kubernetes, so the build needs that directory as a build context.
# The notices context holds the script that copies the license files of
# the modules the binary links.
[[outputs.images]]
name = "observatory-operator"
description = "observatory-operator, which runs an observatory's mount, cameras, and other INDI equipment on the cluster."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

# The CLI image has the same version as the operator, so the base binary
# always pulls a CLI that matches the operator in the cluster. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "observatory-operator-cli"
description = "kubectl-liken-observatory, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
