# The operator that runs an observatory's hardware through INDI: the
# resources' CRDs and Go types, the INDI client, and the operator that
# runs each reserved telescope's pods and devices.
[package]
name = "observatory-operator"
license = "MIT"

# The operator's map of driver images is generated from indi/images/
# at the tag that indi/package.toml pins, and the guider's compositor
# is the weston image at the tag that weston/package.toml pins, so a
# bump of either runs these tests again. The images build against the
# shared kubernetes module, and ship the license notices that notices/
# collects. The CLI's image carries the CA bundle that trust pins. The
# Go and distroless images come from toolchains.
[depends]
components = ["indi", "kubernetes", "notices", "toolchains", "trust", "weston"]

[docs]
prefix = "observatory"

# The tests, with the race check and the coverage profile, in four
# shards on four runners, because one runner takes about nine minutes
# for the operator's package alone. Then this job sums the shards'
# profiles and runs the coverage gate on the sum. .testcoverage.yml
# holds the floor. `make test-go` runs the lint, the tests, and the
# gate in one process on a workstation.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go-gate"
shards = 4
shard-run = "make test-go-shard"
timeout = 15
coverage = ["coverage.out"]

# gofmt, vet, a tidy check of go.mod, and the check that every package
# has a test file. It runs beside the shards, so a vet that compiles
# with no build cache does not delay the coverage gate.
[[jobs]]
name = "lint"
toolchain = "go"
run = "make test-go-lint"

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The go job runs the tests and the coverage
# gate, and the lint job runs gofmt, vet, and the tidy check.
[[jobs]]
name = "prek"
toolchain = "prek"
# The lint job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# The image builds from this module's go.mod, which replaces the shared
# kubernetes module with ../kubernetes, so it takes that directory as a
# build context. The notices context holds the script that copies the
# license files of the modules the binary links.
[[outputs.images]]
name = "observatory-operator"
description = "observatory-operator, which runs an observatory's mount, cameras, and other INDI equipment on the cluster."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

# The CLI image carries the same version as the operator, so the base
# binary pulls a CLI that never drifts from the operator it faces. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "observatory-operator-cli"
description = "kubectl-liken-observatory, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
