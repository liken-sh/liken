# WirePlumber's access policy, the second half of the access story.
# The first half is PipeWire's own access module, which this image
# puts in socket mode (see 50-pipewire-access.conf beside the
# PipeWire configuration) so that every client connects unrestricted.
#
# WirePlumber applies its own policy on top, and its default script
# reads pipewire.sec.flatpak before it trusts the access the server
# granted. The kernel cannot translate a peer's pid across PID
# namespaces, so every client of this pod's socket looks sandboxed,
# and the default policy lowers every client to read-only. A session
# manager that is read-only cannot configure an adapter and cannot
# create a link, so without this rule WirePlumber silences the whole
# graph by restricting itself.
#
# The rule keeps the server's answer. Every client on this socket
# already holds an allocated claim, because the CDI mount is the
# access control, so full permissions are the correct grant for all
# of them.
access.rules = [
  {
    matches = [
      {
        access = "flatpak"
      }
    ]
    actions = {
      update-props = {
        access = "unrestricted"
        default_permissions = "all"
      }
    }
  }
]
