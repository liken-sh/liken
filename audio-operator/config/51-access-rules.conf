# WirePlumber's default policy script reads pipewire.sec.flatpak and
# gives a client that looks sandboxed read-only access. The kernel
# cannot translate a peer's pid across PID namespaces, so every client
# of this pod's socket looks sandboxed, WirePlumber included (see
# 50-pipewire-access.conf in the PipeWire configuration). A read-only
# session manager cannot configure an adapter or create a link, so
# without this rule the graph would play nothing.
#
# The rule grants those clients full permissions. That is correct for
# every client of the socket, because the CDI mount lets only a
# container with an allocated claim open it.
access.rules = [
  {
    matches = [
      {
        access = "flatpak"
      }
    ]
    actions = {
      update-props = {
        access = "unrestricted"
        default_permissions = "all"
      }
    }
  }
]
