# PipeWire logs warnings and errors only, except for the pw.node topic,
# which it logs at the info level. That topic records each change of a
# node's state, such as a sink that starts, pauses, or suspends, and
# each underrun of a card:
#
#   pw.node | node_xrun() (liken.audio.card0-pcm3-29) XRun! rate:4096/192000 count:3 ...
#
# An underrun of a sink that plays a bitstream is a dropout that the
# receiver mutes for a moment, and this line is the only record of it.
# count is the number of underruns since PipeWire created the node.
#
# The other topics at the info level log every link's format
# negotiation, dozens of lines for each pause and resume, so they stay
# at the warning level. pw-metadata -n settings 0 log.level 3 raises
# every topic on a running PipeWire until it restarts.
context.properties = {
  log.level = "2,pw.node:3"
}
