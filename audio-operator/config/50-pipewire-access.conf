# PipeWire's access module decides how much of the graph each client
# can read. Its default, legacy mode, identifies a client by reading
# /proc/<pid> of the process on the other end of the socket. The kernel
# translates the peer's pid into the reader's PID namespace, and every
# client of this socket is in another one: the operator's container,
# the probe, and each consumer pod. The translation returns 0, the
# /proc read fails, and the module treats the client as a sandboxed
# application with a restricted view of the graph. A restricted client
# can play audio, but it cannot list the graph, so pw-dump waits
# forever for objects it never sees. The pod's startup probe runs
# pw-dump before any session manager can widen the view, so in legacy
# mode the pod would never finish starting.
#
# Socket mode grants each socket a fixed level, and both sockets can be
# unrestricted because the CDI mount controls access. A container can
# open the socket only when a claim it holds mounted the socket's
# directory, so every client was already allocated an output.
#
# The failed pid translation also makes clients look sandboxed to
# WirePlumber's own policy. 51-access-rules.conf, in the WirePlumber
# configuration, corrects that.
module.access.args = {
  access.socket = {
    pipewire-0 = "unrestricted"
    pipewire-0-manager = "unrestricted"
  }
}
