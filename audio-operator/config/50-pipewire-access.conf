# PipeWire's access module decides what a connecting client may see.
# This file puts it in its socket mode instead of its legacy mode,
# because the legacy mode cannot classify a client in a pod.
#
# The legacy mode identifies a client by reading /proc/<pid> of the
# process on the other end of the socket. The kernel translates the
# peer's pid into the reader's own PID namespace, and every client of
# this socket lives in a different one: the operator's container, the
# probe, and every consumer pod. The translation answers 0, the /proc
# read fails, and the module falls back to treating the client as a
# sandboxed application with a restricted view of the graph. A
# restricted client can play, which is why a consumer works, but it
# cannot enumerate the graph, so pw-dump waits forever for objects it
# is never shown. The startup probe is a pw-dump that runs before any
# session manager exists to widen the view, so the legacy mode would
# deadlock the pod's own ordered startup.
#
# The sockets are unrestricted because the CDI mount is the access
# control: a container reaches this socket only when the claim it
# holds put the directory in its filesystem, so a client that can
# open the socket has already been allocated an output.
module.access.args = {
  access.socket = {
    pipewire-0 = "unrestricted"
    pipewire-0-manager = "unrestricted"
  }
}
