# WirePlumber's profile in this pod, pinned to the one hardware this
# operator claims.
#
# The operator's domain is the sound card its raw claim allocated, and
# nothing else. WirePlumber's default profile enables every hardware
# monitor it was built with, so a Bluetooth audio device on a
# reachable system bus, or a camera, would arrive in this graph with
# no claim behind it. The pod runs a system bus of its own for RTKit
# and device reservation, and a sibling operator may run its own
# PipeWire for Bluetooth audio on the same machine. Neither one should
# be able to pull hardware into this graph by accident, so the
# boundary is written here instead of resting on what happens to be
# reachable.
#
# main-embedded is the systemwide, stateless profile, which is the
# shape a pod needs: no per-user session, and no state file to keep
# across restarts. It inherits main, which marks every monitor
# required, and a required feature that cannot load stops WirePlumber
# from starting. The two lines below turn the two this operator does
# not own off.
wireplumber.profiles = {
  main-embedded = {
    hardware.audio = required
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
