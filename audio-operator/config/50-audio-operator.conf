# WirePlumber's profile in this pod, pinned to the hardware this
# operator claims, with every hardware monitor turned off.
#
# The ALSA monitor is off because it cannot work here. It enumerates
# cards through libudev, and a liken machine runs no udevd, so udev
# answers with nothing, the monitor builds no device, and PipeWire ends
# up with no sink for a card that plays perfectly well. The operator
# enumerates the card itself, through the ALSA control interface, and
# writes one sink node for each playback PCM device into
# /etc/pipewire/pipewire.conf.d/ before it starts PipeWire. See
# nodes.go. The monitor is off on every host and not only on liken, so
# the graph has one source and the operator's behavior does not change
# with the host's init system.
#
# The other two monitors are off because this operator has no claim on
# what they would find. Its domain is the sound cards its raw claim
# allocated, and nothing else. A sibling operator may run its own
# PipeWire for Bluetooth audio on the same machine. Neither one should
# be able to pull hardware into this graph by accident, so the boundary
# is written here instead of resting on what happens to be reachable.
#
# main-embedded is the systemwide, stateless profile, which is the
# shape a pod needs: no per-user session, and no state file to keep
# across restarts. It inherits main, which marks every monitor
# required. hardware.audio stays required, because this pod is an audio
# pod and a profile that could not load its audio support must not
# start. It treats monitor.alsa and monitor.alsa-midi as optional,
# not required, so turning those two off still loads the profile.
#
# What stays on is the policy. WirePlumber links each client's stream
# to the sink the client names in PIPEWIRE_NODE, and that is the whole
# of what it does here.
wireplumber.profiles = {
  main-embedded = {
    hardware.audio = required
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
