# WirePlumber reads this file from the image before the fragment that
# the declare container writes. When the claim delivered a Bluetooth
# media bus, that fragment overrides only the hardware.bluetooth line
# below, so one PipeWire and one socket serve both the sound card and
# the radio.
#
# monitor.alsa finds cards through libudev, and a liken machine runs no
# udevd, so the monitor finds no cards. In its place, declare reads the
# cards through the ALSA control interface and writes one sink node for
# each playback PCM device into /etc/pipewire/pipewire.conf.d/
# (nodes.go) before PipeWire starts. The monitor is disabled on every
# host, so the graph has that one source whatever init system the host
# runs. The other monitors are disabled because they would add devices
# that the pod can reach but its claim did not allocate.
#
# main-embedded is WirePlumber's system-wide profile that keeps no
# state file, for a pod with no user session. It inherits main, which
# marks every monitor as required. hardware.audio stays required, so
# WirePlumber fails to start when it cannot load audio support. The
# profile marks monitor.alsa and monitor.alsa-midi optional, so
# disabling them still loads the profile.
#
# The policy components stay on. In this pod they link each client's
# stream to the sink that the client names in PIPEWIRE_NODE.
#
# liken/restore-device-ports.lua restores a sink's channel layout after
# a bitstream played through it, because WirePlumber then configures
# the sink with two channels for every later stream. The script's
# comments give the detail. The hook is required, so a WirePlumber that
# cannot load it fails at startup and not at the first film.
wireplumber.components = [
  {
    name = liken/restore-device-ports.lua, type = script/lua
    provides = hooks.linking.liken.restore-device-ports
    requires = [ hooks.linking.target.link ]
  }
]
wireplumber.profiles = {
  main-embedded = {
    hardware.audio = required
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
    hooks.linking.liken.restore-device-ports = required
  }
}
