# WirePlumber's profile in this pod, pinned to the hardware this
# operator claims. It is the image's baked default, read before the
# fragment the declare init container writes, so a pod whose claim
# delivered a Bluetooth media bus overrides the bluetooth line below
# and nothing else.
#
# The ALSA monitor is off because it cannot work here. It enumerates
# cards through libudev, and a liken machine runs no udevd, so udev
# answers with nothing. The monitor builds no device, and PipeWire ends
# up with no sink for a card that plays perfectly well. The operator
# enumerates the card itself, through the ALSA control interface, and
# writes one sink node for each playback PCM device into
# /etc/pipewire/pipewire.conf.d/. See nodes.go. The monitor is off on
# every host and not only on liken, so the graph has one source and the
# operator's behavior does not change with the host's init system.
#
# An init container does that write and exits, and the PipeWire
# container starts after it.
#
# The other monitors are off because this operator has no claim on
# what they would find. Its domain is the devices its own claim
# allocated, and nothing else, so the boundary is written here
# instead of depending on what happens to be reachable.
#
# hardware.bluetooth is the baked default, not the final answer. A
# pod whose claim allocated a Bluetooth media bus gets a fragment
# from its declare init container that turns the monitor back on,
# and a pod whose claim allocated none keeps this line. No sibling
# operator runs a second PipeWire: one graph and one socket serve
# the card and the radio together.
#
# main-embedded is the systemwide, stateless profile, which is what a
# pod needs: no per-user session, and no state file to keep across
# restarts. It inherits main, which marks every monitor
# required. hardware.audio stays required, because this pod is an audio
# pod and a profile that could not load its audio support must not
# start. It treats monitor.alsa and monitor.alsa-midi as optional,
# not required, so turning those two off still loads the profile.
#
# What stays on is the policy. WirePlumber links each client's stream
# to the sink the client names in PIPEWIRE_NODE, and that is the whole
# of what it does here.
wireplumber.profiles = {
  main-embedded = {
    hardware.audio = required
    monitor.alsa = disabled
    monitor.alsa-midi = disabled
    hardware.bluetooth = disabled
    hardware.video-capture = disabled
  }
}
