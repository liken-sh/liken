# Every push to main tests the operator, builds the image, and
# releases it.
#
# The version is the date and the run number, which is liken's own
# scheme: 2026.08.03-002. The two release cadences do not couple, and
# reading one version beside the other still tells you when each one
# was cut.
name: release

# The filter is a deny-list, not an allow-list, because the Go sources
# sit at the top level beside the packages and a new package is an
# ordinary new directory. An allow-list would have to name every one of
# them, and the day somebody adds a directory it does not name, the push
# that adds it ships no image and says nothing. A deny-list fails the
# other way: a file nobody thought about cuts a release that changes no
# bytes, which costs a version number.
#
# Everything not listed here is a build input, including `deploy/`. That
# directory builds no image, and the release tags the commit, so the tag
# is what a consumer pins to when it references the kustomize base.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'plans/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write
  packages: write

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag step below asks whether this version is already
          # tagged, and a checkout with no tags answers no every time.
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tests gate the build. An image that reaches the registry
      # has passed them, so a rollback is a matter of naming an older
      # tag and never of finding out which tag was good.
      - run: go vet ./...
      - run: go test -race ./...

      - name: Compute the version
        run: echo "VERSION=$(date -u +%Y.%m.%d)-$(printf '%03d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liken-sh/audio-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/audio-operator:latest

      # The tag lands after the push, so a tag in the repository always
      # names a version that exists in the registry. A tag that already
      # exists means a rerun of the same run number, and the push it
      # names is already there, so the step leaves it alone.
      - name: Tag the commit
        run: |
          git rev-parse -q --verify "refs/tags/$VERSION" \
            || { git tag "$VERSION" && git push origin "$VERSION"; }
