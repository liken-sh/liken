# This is the coverage gate, enforced in CI (see
# .github/workflows/ci.yaml).
#
# The thresholds only rise over time. Each one is set just under what
# the tests measure today. So a change that loses coverage fails the
# check, and a change that gains coverage should raise the number
# here to keep the gain.
#
# The numbers are measured with Go 1.27.1. Its profiles count a basic
# block once for each row that comments split the block into
# (golang/go#80974), so the floors move when Go 1.27.2 fixes that.
#
# The number is what CI measures, not what a developer's machine
# measures. The mixer and control-event tests read a real card where
# one answers, and CI has none, so a machine with a sound card
# measures about four points higher. To measure what CI measures,
# skip the three tests that read card 0:
#
#   go test -race -covermode=atomic -skip 'TestWatchControlsOnTheLocalCard|TestMixerReadsTheLocalCard|TestTheCardStaysOpenForTheLengthOfAPass' -coverprofile=coverage.out ./...

profile: coverage.out

threshold:
  # The total spans every package, so it is the whole gate.
  total: 80
