# liken does not apply this base itself. Apply it from your own GitOps
# repository with your own patches, or copy the manifests.
#
# The base includes the DeviceClass sound-card, because the operator's
# claim template in operator.yaml names it and the operator cannot
# start without it. The DeviceClass that workloads claim through is
# cluster policy, so you create it, and the install guide gives the
# YAML for audio-output as a starting point. If you rename sound-card,
# patch both the DeviceClass and the claim template.
#
# The namespace comes from a NamespaceTransformer with unsetOnly, not
# from the top-level namespace field. The top-level field would move
# the RoleBinding in api-authentication.yaml from kube-system to
# liken-system, where the Role it refers to does not exist. With
# unsetOnly, the transformer sets liken-system only on objects that
# have no namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

# The transformer also sets a namespace on the DeviceClass, which is
# cluster-scoped, because kustomize's compiled OpenAPI schema does not
# include resource.k8s.io/v1 and treats the kind as namespaced. The API
# server ignores a namespace on a cluster-scoped object, and kubectl
# takes the scope from API discovery, so the extra field has no effect.
resources:
  - crds.yaml
  - deviceclasses.yaml
  - rbac.yaml
  - operator.yaml
  - api.yaml
  - api-authentication.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: audio-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/audio-operator
    newTag: latest
