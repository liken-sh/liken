# audio-api serves the capture API for the whole cluster. For each
# request it finds the node of the Sink or Source and forwards the
# request to the capture container of the audio-operator pod on that
# node, which reads from PipeWire and runs the encoders. audio-api
# keeps no state on disk.
---
# The capture containers accept tokens issued for this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audio-api
---
# audio-api creates a TokenReview to authenticate a caller's Bearer
# token and a SubjectAccessReview to authorize the tap.
# system:auth-delegator is the built-in ClusterRole for these calls.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audio-api-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: audio-api
    namespace: liken-system
---
# audio-api reads the Sink or Source named in the request path to find
# its node. These kinds are cluster-scoped, so the rule is in a
# ClusterRole. get is enough, because the name is always in the path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: audio-api
rules:
  - apiGroups: [audio.liken.sh]
    resources: [sinks, sources]
    verbs: [get]
  # A tap that produces audio records a Captured Event on the Sink or
  # Source, so kubectl describe shows who listened and when. Events
  # about cluster-scoped objects go in the default namespace. The
  # recorder patches the count of an existing Event when the same
  # caller taps the same endpoint in the same format again within 10
  # minutes.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audio-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: audio-api
subjects:
  - kind: ServiceAccount
    name: audio-api
    namespace: liken-system
---
# audio-api lists and watches the pods of its namespace to find the
# operator pod on a node from its cache. RBAC cannot limit a list to a
# label selector, so the rule covers all pods.
#
# audio-api creates and keeps current the Secret audio-api-tls, with
# the CA and audio-api's own leaf certificate, the Secret
# audio-capture-server, with the capture containers' leaf certificate,
# and the ConfigMap audio-api-ca, with only the CA certificate, so a
# client can read the CA without access to any Secret. A resourceNames
# rule cannot match a create request, so create is a separate rule
# without names. audio-api watches audio-capture-server to issue a new
# leaf when the Secret changes or is deleted. RBAC accepts
# resourceNames on list and watch only when the request selects the
# object with a metadata.name field selector, which audio-api does.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audio-api
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, update]
    resourceNames: [audio-api-tls, audio-capture-server]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [list, watch]
    resourceNames: [audio-capture-server]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, update]
    resourceNames: [audio-api-ca]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audio-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: audio-api
subjects:
  - kind: ServiceAccount
    name: audio-api
    namespace: liken-system
---
# The permission to listen, which a cluster owner binds to people or
# workloads. A tap is a read of the sound, so the verb is get, on the
# sinks/audio and sources/audio subresources. A rule with
# resourceNames grants only the named endpoints. A role that allows
# everything in audio.liken.sh, and cluster-admin, can capture too.
#
# The role also grants get on sinks and sources, because the
# /v1/audio/sinks/{name} route authorizes against the plain resource,
# and a listener reads the rate and channel count it returns to know
# what a tap delivers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: audio-capture-viewer
rules:
  - apiGroups: [audio.liken.sh]
    resources: [sinks, sources, sinks/audio, sources/audio]
    verbs: [get]
---
# audio-api runs the operator's image with the api argument, so the
# whole operator is one binary at one version. Two audio-api pods that
# run at once must use one CA, or no single CA certificate verifies
# the leaves of both. The Recreate strategy keeps a rollout from
# running two pods at once. When two pods still create the CA's Secret
# at once, the one whose create fails reads the other's Secret. See
# apitls.go.
#
# The API listener uses HTTPS because anything on the network path
# could replay a Bearer token sent over plain HTTP, and because Go
# serves HTTP/2 only over TLS. The metrics listener is plain HTTP on
# the port that liken components share for metrics, as in the
# operator DaemonSet, because a scrape reads an in-memory registry and
# returns no captured audio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-api
  labels:
    app: audio-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audio-api
  template:
    metadata:
      labels:
        app: audio-api
    spec:
      serviceAccountName: audio-api
      containers:
        - name: api
          image: ghcr.io/liken-sh/audio-operator:latest
          args: ["api"]
          env:
            - name: API_ADDRESS
              value: ":8443"
            - name: METRICS_ADDRESS
              value: ":9200"
            # The namespace of audio-api's certificates.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The token that audio-api presents to a capture container,
            # from the projected volume below.
            - name: CAPTURE_TOKEN_FILE
              value: /var/run/secrets/audio.liken.sh/capture/token
          ports:
            - name: api
              containerPort: 8443
            - name: metrics
              containerPort: 9200
          # Both probes use the metrics listener, which is plain HTTP.
          # The API listener would return 401 to a probe, because a
          # probe sends no token.
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTP
          securityContext:
            # Opening the listeners and calling the API server need no
            # capability.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: capture-token
              mountPath: /var/run/secrets/audio.liken.sh/capture
              readOnly: true
      volumes:
        # A capture container checks that a request comes from
        # audio-api by sending this token in a TokenReview. The audience
        # is audio-capture, so the default API-server token of any other
        # pod fails the review. The kubelet refreshes a projected token
        # before it expires, so the 10-minute lifetime needs no rotation
        # code and no Secret.
        - name: capture-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: audio-capture
                  expirationSeconds: 600
                  path: token
---
# Clients use https://audio-api.liken-system.svc. Port 443 is the HTTPS
# default, so the URL needs no port.
apiVersion: v1
kind: Service
metadata:
  name: audio-api
spec:
  type: ClusterIP
  selector:
    app: audio-api
  ports:
    - name: https
      port: 443
      targetPort: api
