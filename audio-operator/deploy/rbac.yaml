---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audio-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: audio-operator
rules:
  # This node's ResourceSlice (slices.go). resourceNames cannot vary
  # by pod, so the rule covers every ResourceSlice, and the operator
  # writes only the slice whose name it builds from NODE_NAME. It needs
  # no list or watch, because it builds the name.
  #
  # There is no delete, because the Node owns the slice and the
  # garbage collector deletes it with the Node. A slice deleted when
  # the pod stops would break every consumer already prepared.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, create, update]
  # The DRA plugin (dra.go). A prepare request from the kubelet gives
  # only the claim's name and namespace, so the driver gets the
  # ResourceClaim to read its allocation. The rule is cluster-wide
  # because a consumer's claim can be in any namespace.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get]
  # Sinks and Sources (sinks.go, sinkcontrol.go). The operator creates
  # one for each endpoint it publishes and writes its status. It writes
  # a Sink's status with a merge patch, which leaves alone the
  # status.session field that media-operator writes (statuspatch.go),
  # and a Source's status with an update.
  #
  # It lists and watches them with a status.node field selector, so
  # each pod reads only its node's objects, to apply spec changes and
  # to find endpoints that have left the node.
  #
  # There is no delete. While a USB card or speaker is unplugged, its
  # Sink keeps its spec and reports the endpoint as absent.
  - apiGroups: [audio.liken.sh]
    resources: [sinks, sources]
    verbs: [get, list, watch, create, update]
  - apiGroups: [audio.liken.sh]
    resources: [sinks/status]
    verbs: [get, patch]
  - apiGroups: [audio.liken.sh]
    resources: [sources/status]
    verbs: [get, update]
  # The operator reads its Node once at startup, for the UID in the
  # ResourceSlice's owner reference.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # Events on Sinks and Sources (eventreasons.go). Events about a
  # cluster-scoped object go in the default namespace. The recorder
  # patches an Event's count when the same Event repeats within 10
  # minutes, and never reads Events.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The capture container accepts requests only from audio-api, and
  # verifies the caller's token with a TokenReview. It checks no
  # authorization, so it needs no SubjectAccessReview. audio-api
  # authorizes each tap (api.yaml).
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: audio-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: audio-operator
subjects:
  - kind: ServiceAccount
    name: audio-operator
    namespace: liken-system
