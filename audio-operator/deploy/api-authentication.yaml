# This RoleBinding is in kube-system, so it is in a file of its own:
# kubectl apply -n liken-system refuses an object in another
# namespace, and the install guide applies this file without -n.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audio-api-authentication-reader
  # The API server publishes the cluster's client certificate
  # authority in the ConfigMap extension-apiserver-authentication in
  # kube-system. audio-api reads it to verify callers' client
  # certificates, and watches it to use a rotated authority without a
  # restart. extension-apiserver-authentication-reader is the built-in
  # Role that grants get, list, and watch on that ConfigMap.
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: audio-api
    namespace: liken-system
