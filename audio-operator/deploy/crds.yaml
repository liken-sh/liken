# The endpoint API: a Sink for every playback endpoint and a Source
# for every capture endpoint the operator publishes. The operator
# creates both, names them by the device name the ResourceSlice
# carries, and writes the status, apart from a Sink's status.session,
# which the media operator writes. The spec fields are the cluster
# owner's to write. The operator writes a declared control or codec
# back to the hardware when the endpoint diverges from it, and writes
# a declared level when the spec changes and when the endpoint
# appears.
#
# The claim and the resource answer two different needs. A pod that
# plays or records still holds the endpoint through a claim, and it
# still has its own stream volume. The resource holds everything else
# about the endpoint: its resting level, its mute, and the card's own
# controls. Any writer with the right RBAC can set those, whether or
# not a claim holds the endpoint.
#
# The two kinds have the same shape. They are two kinds and not one
# kind with a direction field because `kubectl get sinks` and
# `kubectl get sources` answer two different questions, and because a
# Role can grant one without the other.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sinks.audio.liken.sh
spec:
  group: audio.liken.sh
  # An endpoint is hardware on a machine and belongs to no
  # namespace, so the resource is cluster-scoped, like a Node.
  scope: Cluster
  names:
    kind: Sink
    listKind: SinkList
    plural: sinks
    singular: sink
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # status is a subresource so that the operator's writes of
        # status and a person's writes of spec never overwrite each
        # other.
        status: {}
      # Each machine's operator lists and watches the Sinks whose
      # status.node is that machine. Without the selectable field, a
      # watch takes every Sink in the cluster, and a status write on
      # one machine wakes the operator on every machine.
      selectableFields:
        - jsonPath: .status.node
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connection
          type: string
          jsonPath: .status.connectionType
        - name: Volume
          type: integer
          jsonPath: .status.observed.volume
        - name: Mute
          type: boolean
          jsonPath: .status.observed.mute
        - name: Claim
          type: string
          jsonPath: .status.claim.name
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Layout
          type: string
          jsonPath: .status.layout
        - name: Layout Source
          type: string
          jsonPath: .status.layoutSource
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One playback endpoint: an analog jack, an HDMI or DisplayPort output, a USB card's playback side, or a Bluetooth speaker. Its status reports hardware facts and the values the operator last read. Its spec declares desired endpoint settings. The name is the machine's name and the card's identity, as the Sink reference gives them. When a USB card's name would pass 63 characters, it holds the first eight hex digits of the SHA-256 of the serial in place of the serial."
          properties:
            spec:
              type: object
              description: "The desired settings for the endpoint. Every field is optional. The operator writes volume.level and mute when they change and when the endpoint appears, such as a speaker that reconnects or a node that PipeWire builds again, and otherwise reports the level the endpoint holds. It writes a declared control or codec back when the endpoint diverges from it. It never writes a field that the spec leaves out."
              # A writer clears the spec by applying one with nothing
              # in it. Server-side apply prunes the empty object away,
              # and validation would then read spec as null and refuse
              # the write. The default puts the empty object back.
              default: {}
              properties:
                volume:
                  type: object
                  description: "The endpoint's volume, in percent of unity. level is the default level that the operator applies. max and step bound the volume asks the media operator writes into status.session, and the operator does not read them."
                  properties:
                    level:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: "The endpoint's default level, as a percent of unity, applied to every channel alike. On an ALSA endpoint it is the gain PipeWire applies in software. On a Bluetooth speaker it is the speaker's own volume, sent over AVRCP when the speaker supports absolute volume, and a software gain when it does not. The operator applies it when it changes and when the endpoint appears, under a claim or not, and a claim holder's own stream fader is a separate level above it. A level that changes after that, at the device or by a volume ask, stays, and status.observed.volume reports it. When it is absent, a node that PipeWire builds while the operator runs starts at unity."
                    max:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 100
                      description: "The highest level a volume ask can set. The media operator holds its asks at or below it. A person at the device can still set a higher level."
                    step:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 5
                      description: "How far one press of a remote's volume key moves the level the media operator asks for."
                mute:
                  type: boolean
                  description: "Whether the endpoint is silent. The operator applies this setting at the same layer as volume.level, and on the same terms."
                controls:
                  type: object
                  additionalProperties:
                    type: string
                  description: "The card's own controls, keyed by the kernel's control name as status.capabilities lists them, such as Master Playback Volume. An integer control takes a number within its range. A boolean control takes on or off. An enumerated control takes one of its values. The operator writes a control only when spec states it. When two endpoints share one control, the last write wins because the hardware has one register."
                layout:
                  type: array
                  minItems: 1
                  maxItems: 64
                  # A set: the API server refuses a list that names one
                  # position twice, because two slots with one position
                  # leave PipeWire no single port to link a stream's
                  # channel to.
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    # The short channel names PipeWire's SPA defines,
                    # the ones audio.position takes. UNK is left out,
                    # because a stated layout states each position.
                    enum: [
                        MONO, FL, FR, FC, LFE, SL, SR, FLC, FRC, RC, RL,
                        RR, TC, TFL, TFC, TFR, TRL, TRC, TRR, RLC, RRC,
                        FLW, FRW, LFE2, FLH, FCH, FRH, TFLC, TFRC, TSL,
                        TSR, LLFE, RLFE, BC, BLC, BRC, NA, AUX0, AUX1,
                        AUX2, AUX3, AUX4, AUX5, AUX6, AUX7, AUX8, AUX9,
                        AUX10, AUX11, AUX12, AUX13, AUX14, AUX15, AUX16,
                        AUX17, AUX18, AUX19, AUX20, AUX21, AUX22, AUX23,
                        AUX24, AUX25, AUX26, AUX27, AUX28, AUX29, AUX30,
                        AUX31, AUX32, AUX33, AUX34, AUX35, AUX36, AUX37,
                        AUX38, AUX39, AUX40, AUX41, AUX42, AUX43, AUX44,
                        AUX45, AUX46, AUX47, AUX48, AUX49, AUX50, AUX51,
                        AUX52, AUX53, AUX54, AUX55, AUX56, AUX57, AUX58,
                        AUX59, AUX60, AUX61, AUX62, AUX63
                      ]
                  description: "The channel positions of an ALSA sink, in PCM slot order, in PipeWire's channel names, such as FL, FR, FC, LFE, RL, RR, SL, SR, RLC, RRC, TFL, TFR, NA for a slot that plays nothing, and AUX0 to AUX63. A 7.1 receiver on HDMI takes [FL, FR, RL, RR, FC, LFE, SL, SR], and a 5.1 one takes [FL, FR, RL, RR, FC, LFE]. When this field is absent, the operator selects the layout from the monitor's ELD on HDMI and DisplayPort, from the device's own channel map on USB, and declares no positions on the analog jack, whose streams then play in stereo. The operator declares the layout to PipeWire, and a change restarts PipeWire inside its container once no stream plays on the machine. The number of positions must be a channel count the device accepts, or PipeWire ignores the layout. The operator does not write the kernel's channel map, so on HDMI each slot reaches the speaker the kernel's standard allocation gives it, and a height position names a slot that the kernel routes elsewhere. A Bluetooth speaker ignores this field."
                codec:
                  type: string
                  description: "The A2DP codec to apply when no claim allocates the Bluetooth speaker. The value must be one of status.bluetooth.codecs. A claim's codec parameter takes precedence while the claim allocates the speaker. A change here waits until the claim ends because switching codecs replaces the speaker's node and interrupts playback. The operator ignores this field on an ALSA endpoint."
            status:
              type: object
              description: "What the hardware declares and what the operator last read. The operator owns every field here apart from session, which the media operator owns."
              properties:
                session:
                  type: object
                  description: "The unit that uses the Sink, and the last volume ask a press made. The media operator writes this block by server-side apply under its own field manager. The operator writes its own status fields as a merge patch that never names this block, so its writes leave the block in place. It is status and not spec because no person declares it, and a status write changes no metadata.generation."
                  properties:
                    player:
                      type: string
                      description: "The Player whose unit uses the Sink, as namespace/name."
                    volumeAsk:
                      type: object
                      required: [level, at]
                      description: "The last level a press asked for. The operator applies each new ask once, to the node or to a Bluetooth speaker's Route, the same write that spec.volume.level takes, without waiting for the settle window that gathers hardware events into one ResourceSlice write. When several asks arrive before the operator applies one, it applies only the newest. It applies no ask that it finds the first time it reads the Sink, as in its first pass after a start, and no ask for an endpoint that has no node. It never writes an ask's level again, so a later press of a speaker's own button stays, and status.observed reports the level the endpoint holds."
                      properties:
                        level:
                          type: integer
                          minimum: 0
                          maximum: 100
                          description: "The level, as a percent of unity."
                        mute:
                          type: boolean
                          description: "Whether the endpoint is silent. Absent means not muted."
                        at:
                          type: string
                          format: date-time
                          description: "When the press made the ask, with milliseconds. Each new time is one ask."
                node:
                  type: string
                  description: "The machine that holds the endpoint now. For a Bluetooth speaker, the value changes when the speaker moves. The name of every other Sink starts with this machine's name, so a card that moves to another machine gets a new Sink. The operator on each machine lists and watches the Sinks by this field."
                location:
                  type: string
                  description: "Where the card is on the machine, in the kernel's spelling: a PCI address such as 0000:00:1f.3, or a USB port path such as 1-6. Absent on a Bluetooth speaker."
                connectionType:
                  type: string
                  enum: [analog, hdmi, displayport, usb, bluetooth]
                  description: "How sound leaves the machine."
                card:
                  type: object
                  description: "The ALSA card the endpoint is on. The number and the id are this boot's, and a second card can change both, so nothing durable is keyed to them."
                  properties:
                    number:
                      type: integer
                      description: "The card number the kernel assigned this boot."
                    id:
                      type: string
                      description: "The card's short id, such as PCH, with the suffix the kernel appends on a clash, such as PCH_1."
                    driver:
                      type: string
                      description: "The kernel driver that binds the card, such as HDA-Intel."
                    name:
                      type: string
                      description: "The card's name, as the driver states it, such as HDA Intel PCH."
                pcm:
                  type: object
                  description: "The PCM device the endpoint plays through."
                  properties:
                    device:
                      type: integer
                      description: "The PCM device number on the card, this boot."
                    id:
                      type: string
                      description: "The driver's name for the PCM, such as HDMI 0 or USB Audio. It is the part of the endpoint's name that outlives the number."
                monitor:
                  type: object
                  description: "The monitor an HDMI or DisplayPort slot feeds, from the ELD the graphics driver wrote into the card. Absent while no monitor answers, and absent on every other connection type. An Intel HDMI codec binds a pin to the first free slot when a monitor appears, so a card with two monitors can swap which slot feeds which between plug events, and this object is where that shows."
                  properties:
                    display:
                      type: string
                      description: "The name of the Display the display operator publishes for the same monitor, which is the pairing identity monitor.liken.sh/id."
                    manufacturer:
                      type: string
                      description: "The monitor's three-letter PNP id, such as GSM."
                    product:
                      type: string
                      description: "The monitor's product code, four lowercase hexadecimal digits."
                    name:
                      type: string
                      description: "The monitor's name, from the same EDID descriptor the Display reports as model."
                bluetooth:
                  type: object
                  description: "The speaker behind a Bluetooth endpoint. Absent on every other connection type."
                  properties:
                    address:
                      type: string
                      description: "The speaker's address, uppercase with colons."
                    name:
                      type: string
                      description: "The name the speaker reports for itself."
                    peripheral:
                      type: string
                      description: "The name of the Peripheral the bluetooth operator publishes for this speaker, which is the address in lowercase with dashes."
                    codec:
                      type: string
                      description: "The A2DP codec the transport negotiated, present while the speaker is connected."
                    codecs:
                      type: array
                      items:
                        type: string
                      description: "Every codec the speaker and this image both support, the one playing first."
                nodeName:
                  type: string
                  description: "The PipeWire node a consumer's streams target, the same value a prepared claim delivers as PIPEWIRE_NODE. Absent while PipeWire holds no node for the endpoint."
                format:
                  type: object
                  description: "The format the node runs at, from PipeWire's own Format parameter. Absent while the node is not running."
                  properties:
                    rate:
                      type: integer
                      description: "The sample rate in hertz."
                    channels:
                      type: integer
                      description: "The channel count."
                    positions:
                      type: array
                      items:
                        type: string
                      description: "The channel positions in order, in PipeWire's names: FL, FR, FC, LFE, RL, RR."
                capabilities:
                  type: object
                  description: "The card's own controls for this endpoint, keyed by the kernel's control name. A Playback control applies to the card's analog and USB sinks. A control with no direction, such as Auto-Mute Mode, also applies to those sinks. An IEC958 Playback Switch applies to the HDMI slot with the same ordinal. It is the only control an HDMI slot lists because an HDMI PCM has no volume element. The operator omits read-only jack controls because they feed the Connected condition. A Bluetooth speaker lists no card controls."
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [integer, boolean, enumerated]
                        description: "What the control takes."
                      min:
                        type: integer
                        description: "The smallest number an integer control accepts."
                      max:
                        type: integer
                        description: "The largest number an integer control accepts."
                      step:
                        type: integer
                        description: "The step between numbers an integer control accepts, absent when every number in the range is accepted."
                      minDecibels:
                        type: string
                        description: "The level at min, in decibels, when the control declares one, as a decimal string such as -65.25. The string form keeps the value exact where a float would not."
                      maxDecibels:
                        type: string
                        description: "The level at max, in decibels, when the control declares one."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value an enumerated control accepts."
                      channels:
                        type: integer
                        description: "How many channels the control carries. A write from spec sets every channel to the same value."
                layout:
                  type: array
                  items:
                    type: string
                  description: "The channel positions the operator declares the sink's node with, in PCM slot order. Absent when layoutSource is ChannelMap, because PipeWire reads the positions from the device, and absent when it is None. While LayoutApplied is False with the reason Restarting, this is the layout PipeWire loads when its container starts again."
                layoutSource:
                  type: string
                  enum: [Spec, ELD, ChannelMap, None]
                  description: "Where the layout came from. Spec is spec.layout. ELD is the monitor's speaker allocation, capped by the largest LPCM channel count it accepts. ChannelMap is the channel map a USB device describes. None is no positions, and a multichannel stream then plays in stereo. An HDMI sink keeps a layout from the ELD while its monitor is off. Absent on a Bluetooth speaker."
                observed:
                  type: object
                  description: "The last value the operator read for each setting. The operator reads the card's control device for every event it receives. It reads PipeWire's graph for every change PipeWire reports. A change from a physical knob or a client therefore appears here without polling."
                  properties:
                    volume:
                      type: integer
                      description: "The level the endpoint plays at, as a percent of unity, from the node's gain or the Bluetooth device's own volume. A suspended node reports no current level of its own: PipeWire applies a write to it without announcing it, and the node prints no level or the level it last ran at. So a suspended endpoint reports the level the operator last wrote to it, from the spec or a volume ask, which is the level it will run at. With no such write since the node last ran, it reports what the node prints."
                    mute:
                      type: boolean
                      description: "Whether the endpoint is silent, on the same terms as volume."
                    codec:
                      type: string
                      description: "The codec a Bluetooth speaker plays with now."
                    controls:
                      type: object
                      additionalProperties:
                        type: string
                      description: "The value of every control in capabilities, in the same spelling spec.controls takes. A control with several channels reports the first channel's value."
                claim:
                  type: object
                  description: "The claim that currently allocates the endpoint. This field is absent when no claim allocates it. It identifies the workload that has the speakers."
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                conditions:
                  type: array
                  description: "Connected reports whether the endpoint can play now. It is true for a monitor on an HDMI slot, a plug in an analog jack, a connected speaker, and every USB endpoint. Ready reports whether PipeWire has a node for the endpoint. These two conditions expose the same facts as the device's no-monitor and no-sink taints, in a form a person can read. LayoutApplied, on a sink of a sound card, reports whether PipeWire runs the sink with the layout the operator selected. It is False with the reason AwaitingIdle while a new layout waits for every stream on the machine to end, and with the reason Restarting while PipeWire restarts in its container to load it."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sources.audio.liken.sh
spec:
  group: audio.liken.sh
  scope: Cluster
  names:
    kind: Source
    listKind: SourceList
    plural: sources
    singular: source
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      # The operator selects its own Sources by status.node, for the
      # reason the Sink kind gives.
      selectableFields:
        - jsonPath: .status.node
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connection
          type: string
          jsonPath: .status.connectionType
        - name: Volume
          type: integer
          jsonPath: .status.observed.volume
        - name: Mute
          type: boolean
          jsonPath: .status.observed.mute
        - name: Claim
          type: string
          jsonPath: .status.claim.name
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One capture endpoint: an analog input, or a USB card's capture side. A Bluetooth headset's microphone is not published yet. An HDA card serves several input jacks through one capture PCM and picks the live jack with its Input Source control, so the Source is the PCM and the jack is a control. The name is the machine's name and the card's identity, as the Sink reference gives them. When a USB card's name would pass 63 characters, it holds the first eight hex digits of the SHA-256 of the serial in place of the serial."
          properties:
            spec:
              type: object
              description: "The settings you want for the endpoint. Every field is optional. The operator writes volume and mute when they change and when the endpoint appears, and otherwise reports the level the endpoint holds. It writes a declared control back when the endpoint diverges from it. It never writes a field the spec leaves out."
              default: {}
              properties:
                volume:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: "The gain PipeWire applies to what the endpoint captures, as a percent of unity, applied to every channel alike. It applies at once, under a claim or not."
                mute:
                  type: boolean
                  description: "Whether the endpoint captures silence. It applies at once. A closed microphone is this field, on every Source, and kubectl get sources shows which ones are open."
                controls:
                  type: object
                  additionalProperties:
                    type: string
                  description: "The card's own controls, keyed by the kernel's control name as status.capabilities lists them, such as Capture Volume or Input Source. An integer control takes a number within its range, a boolean control takes on or off, and an enumerated control takes one of its values. The operator writes a control only when it is stated here."
            status:
              type: object
              description: "What the hardware declares and what the operator last read. The operator owns every field here."
              properties:
                node:
                  type: string
                  description: "The machine that holds the endpoint. The name of every Source starts with this machine's name, so a card that moves to another machine gets a new Source. The operator on each machine lists and watches the Sources by this field."
                location:
                  type: string
                  description: "Where the card is on the machine, in the kernel's spelling: a PCI address such as 0000:00:1f.3, or a USB port path such as 1-6."
                connectionType:
                  type: string
                  enum: [analog, usb]
                  description: "How sound enters the machine."
                card:
                  type: object
                  description: "The ALSA card the endpoint is on. The number and the id are this boot's, and a second card can change both, so nothing durable is keyed to them."
                  properties:
                    number:
                      type: integer
                      description: "The card number the kernel assigned this boot."
                    id:
                      type: string
                      description: "The card's short id, such as PCH, with the suffix the kernel appends on a clash, such as PCH_1."
                    driver:
                      type: string
                      description: "The kernel driver that binds the card, such as USB-Audio."
                    name:
                      type: string
                      description: "The card's name, as the driver states it, such as HDA Intel PCH."
                pcm:
                  type: object
                  description: "The PCM device the endpoint captures through."
                  properties:
                    device:
                      type: integer
                      description: "The PCM device number on the card, this boot."
                    id:
                      type: string
                      description: "The driver's name for the PCM, such as USB Audio. It is the part of the endpoint's name that outlives the number."
                nodeName:
                  type: string
                  description: "The PipeWire node a consumer's capture streams target, the same value a prepared claim delivers as PIPEWIRE_NODE. Absent while PipeWire holds no node for the endpoint."
                format:
                  type: object
                  description: "The format the node runs at, from PipeWire's own Format parameter. Absent while the node is not running."
                  properties:
                    rate:
                      type: integer
                      description: "The sample rate in hertz."
                    channels:
                      type: integer
                      description: "The channel count."
                    positions:
                      type: array
                      items:
                        type: string
                      description: "The channel positions in order, in PipeWire's names: FL, FR, MONO."
                capabilities:
                  type: object
                  description: "The card's own controls that belong to this endpoint, keyed by the kernel's control name. A Capture control goes to the card's sources, and a jack control is not listed because it is read-only and feeds the Connected condition."
                  additionalProperties:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [integer, boolean, enumerated]
                        description: "What the control takes."
                      min:
                        type: integer
                        description: "The smallest number an integer control accepts."
                      max:
                        type: integer
                        description: "The largest number an integer control accepts."
                      step:
                        type: integer
                        description: "The step between numbers an integer control accepts, absent when every number in the range is accepted."
                      minDecibels:
                        type: string
                        description: "The level at min, in decibels, when the control declares one, as a decimal string such as -65.25."
                      maxDecibels:
                        type: string
                        description: "The level at max, in decibels, when the control declares one."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value an enumerated control accepts."
                      channels:
                        type: integer
                        description: "How many channels the control carries. A write from spec sets every channel to the same value."
                observed:
                  type: object
                  description: "The last value the operator read for each setting. The operator reads the card's control device on every event it delivers, and PipeWire's graph on every change it prints, so a change a person made with a knob or a client shows here without a poll."
                  properties:
                    volume:
                      type: integer
                      description: "The gain PipeWire applies, as a percent of unity. An idle node reports no level of its own, so an idle endpoint reports the level the operator last wrote to it, and nothing until a level is declared."
                    mute:
                      type: boolean
                      description: "Whether the endpoint captures silence, on the same terms as volume."
                    controls:
                      type: object
                      additionalProperties:
                        type: string
                      description: "The value of every control in capabilities, in the same spelling spec.controls takes. A control with several channels reports the first channel's value."
                claim:
                  type: object
                  description: "The claim that holds the endpoint now, and absent between holders."
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                conditions:
                  type: array
                  description: "Connected reports that the endpoint can capture now: a plug in an analog jack, and always on USB. Ready reports that PipeWire holds a node for it."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
