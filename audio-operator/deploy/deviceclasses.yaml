# The DeviceClass that the operator's own pod claims its devices
# through. It ships with the operator because the claim template in
# operator.yaml names it, and the operator cannot start without it. You
# create the classes that your workloads claim through, one for
# speakers and one for microphones, and the manual gives the YAML for
# them. Each of those classes selects the devices that have the sink
# attribute or the source attribute.
---
# This class selects every device that a sound server can use: the
# sound card that liken publishes, and the media bus that
# bluetooth-operator publishes for each Bluetooth adapter. The
# operator's pod claims every such device on its node with
# allocationMode: All. The claim places the pod, because only a machine
# that has such a device publishes one, so no node selector has to name
# the machine that has the speakers. The claim also gives the pod sole
# use of the devices, because a device is allocated to one claim at a
# time, so the pod that holds the claim is the only sound server on
# them. That matters because ALSA gives each PCM subdevice to one
# process and refuses a second open with EBUSY. If two claims shared a
# card, nothing would decide which claim gets which output, and the pod
# that opened an output second would get the refusal when it started to
# play.
#
# The selector names no driver. supportsSound is an attribute in the
# sound.liken.sh domain, which no single driver owns: liken sets it on
# the sound card, and bluetooth-operator sets it on the media bus. So
# the pod's claim gets the card and the bus together, and another
# driver can join by setting the same attribute. The has() check comes
# first because reading a missing attribute is a CEL error, and that
# error would stop the allocation on a device that does not have the
# attribute.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: sound-card
spec:
  selectors:
    - cel:
        expression: |
          has(device.attributes["sound.liken.sh"].supportsSound) &&
          device.attributes["sound.liken.sh"].supportsSound
