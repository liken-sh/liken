# The pod keeps no state on disk. PipeWire and WirePlumber build their
# graph in memory from the cards each time they start.
---
# Each pod gets its own claim for the sound controllers on its node.
# The DaemonSet creates a pod on every node, and where the claim
# matches no device the pod stays Pending, so the pod runs only on
# nodes with a sound card and nobody has to list them.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: every-sound-card
spec:
  spec:
    devices:
      requests:
        - name: controller
          exactly:
            deviceClassName: sound-card
            # Every controller on the node, because one PipeWire serves
            # every ALSA card on the machine. A consumer's own claim
            # picks a card and an output by device attribute.
            allocationMode: All
            # machine-operator taints a card liken.sh/unplugged with
            # NoExecute when the card is unplugged while allocated.
            # PipeWire drops a removed card on its own, so without this
            # toleration, unplugging one USB card would evict the pod
            # and silence the node's other cards.
            tolerations:
              - key: liken.sh/unplugged
                operator: Exists
                effect: NoExecute
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: audio-operator
  labels:
    # The liken plugins commands and the CLI find this component by
    # this label, read the image of the first container, and pull the
    # -cli image at the same tag. The label is on this DaemonSet and
    # not on the audio-api Deployment, which runs the same image, so
    # the lookup works without audio-api.
    cli.liken.sh/plugin: audio
spec:
  selector:
    matchLabels:
      app: audio-operator
  # The old pod's claim holds the node's controllers, so a new pod
  # started beside it would stay Pending until the old claim is
  # released. maxSurge: 0 stops the old pod before the new one starts.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: audio-operator
    spec:
      serviceAccountName: audio-operator
      # Every pod that claims one of this operator's devices depends on
      # this pod, so it can preempt ordinary pods on a full node, and
      # the kubelet evicts it last.
      priorityClassName: system-node-critical
      # On a node with no sound card, the claim keeps the pod Pending
      # forever. Label such a node audio.liken.sh/sound-card=none to
      # keep the pod off it. NotIn also matches a node without the
      # label, so an unlabeled node gets a pod and the claim decides
      # whether it starts. A patch that sets its own nodeAffinity
      # replaces this whole list of terms, because the list is atomic.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: audio.liken.sh/sound-card
                    operator: NotIn
                    values: ["none"]
      # liken taints a node while the node starts, and this operator
      # must publish its devices before any pod can claim them.
      tolerations:
        - operator: Exists
      # Every container runs the same image. The kubelet runs declare
      # to completion, then starts pipewire and wireplumber in that
      # order as sidecars that keep running. The operator and capture
      # containers start after both sidecars pass their startup probes,
      # and stop before them.
      initContainers:
        # Writes the PipeWire node declarations into pipewire-config,
        # which PipeWire reads as a drop-in directory. It must finish
        # first, because PipeWire reads context.objects only while it
        # loads its configuration. It names the claim because it
        # generates the declarations from the cards the claim
        # allocated.
        - name: declare
          image: ghcr.io/liken-sh/audio-operator:latest
          args: ["declare"]
          # Each Sink's name starts with the node name. declare reads
          # each Sink's spec.layout from the API server before PipeWire
          # starts. When the API server does not respond, the layout
          # comes from the ELD and the channel map, so the pod starts
          # either way.
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
            claims:
              - name: controller
          volumeMounts:
            - name: pipewire-config
              mountPath: /etc/pipewire/pipewire.conf.d
            # declare writes the fragment that enables WirePlumber's
            # Bluetooth monitor here, only when the claim delivered a
            # media bus, which declare detects from
            # DBUS_SYSTEM_BUS_ADDRESS in its environment.
            - name: wireplumber-config
              mountPath: /etc/wireplumber/wireplumber.conf.d
        # The kubelet starts this sidecar before the operator and stops
        # it after, so the operator finds PipeWire's socket at startup,
        # and on pod deletion the operator exits before PipeWire instead
        # of reporting that PipeWire is gone.
        - name: pipewire
          image: ghcr.io/liken-sh/audio-operator:latest
          restartPolicy: Always
          # The operator's binary runs PipeWire as a child and restarts
          # it in place when the drop-in directory is newer than
          # PipeWire's socket, which happens when the operator writes a
          # new channel layout. A container restart would wait out the
          # kubelet's crash backoff with every sink on the node silent.
          # Any other PipeWire exit ends the container, so the restart
          # count counts only crashes. See restarts.go.
          command: ["/audio-operator", "pipewire"]
          env:
            # PipeWire creates its socket in PIPEWIRE_RUNTIME_DIR, or in
            # XDG_RUNTIME_DIR when that is unset. Both name the runtime
            # volume, where the operator and the consumers' CDI mounts
            # expect the socket.
            - name: PIPEWIRE_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            - name: XDG_RUNTIME_DIR
              value: /var/run/audio.liken.sh
          # The probe passes when a client can connect and read the
          # graph, not only when the socket file exists. It runs
          # pw-dump, as the operator does, through the operator's
          # binary, because pw-dump's output can exceed the 10 KiB of
          # probe output that the kubelet keeps and the image has no
          # shell to discard it. See graphprobe.go.
          startupProbe:
            exec:
              command: ["/audio-operator", "graph-answers"]
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 10
          securityContext:
            # PipeWire and WirePlumber reach hardware only through the
            # device nodes the claim delivers: the card's control node,
            # its PCM nodes, and the input nodes of its jacks. The image
            # leaves out PipeWire's rt module, which pipewire.conf loads
            # only when the file exists, so PipeWire runs at normal
            # priority and needs no SYS_NICE. No process changes user,
            # so no capability is added back.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
            claims:
              - name: controller
          volumeMounts:
            - name: pipewire-config
              mountPath: /etc/pipewire/pipewire.conf.d
            - name: runtime
              mountPath: /var/run/audio.liken.sh
        # WirePlumber exits when there is no PipeWire to connect to, so
        # it is listed after pipewire, and the kubelet starts init
        # containers in the order listed.
        - name: wireplumber
          image: ghcr.io/liken-sh/audio-operator:latest
          restartPolicy: Always
          # The operator's binary runs WirePlumber as a child and starts
          # it again when it exits because a new PipeWire replaced the
          # one it was connected to. Any other exit ends the container.
          # See restarts.go.
          command: ["/audio-operator", "wireplumber", "--profile=main-embedded"]
          env:
            - name: PIPEWIRE_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            - name: XDG_RUNTIME_DIR
              value: /var/run/audio.liken.sh
          # Both probes pass when BlueZ shows a live media endpoint
          # registration from this WirePlumber. A WirePlumber whose
          # D-Bus connection was replaced, for example after the
          # Bluetooth pod restarted, keeps running with no registration.
          # See endpoints.go for the check and the states that pass.
          #
          # WirePlumber needs a few seconds after it opens the bus to
          # register, so the startup probe allows 60 seconds before the
          # liveness probe begins. It does not check PipeWire, because
          # the kubelet starts this container only after PipeWire's
          # startup probe passes.
          startupProbe:
            exec:
              command: ["/audio-operator", "endpoints-registered"]
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 10
          # A failed probe restarts only this container. The new
          # WirePlumber connects to the current bus and registers its
          # endpoints again, and PipeWire keeps running, so the card's
          # own sinks keep playing. The fault does not clear on its own,
          # so a check every 20 seconds, one D-Bus call each, finds it,
          # and three failures in a row, about a minute, restart the
          # container.
          livenessProbe:
            exec:
              command: ["/audio-operator", "endpoints-registered"]
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 10
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
            claims:
              - name: controller
          volumeMounts:
            - name: runtime
              mountPath: /var/run/audio.liken.sh
            # WirePlumber reads its configuration only at startup, after
            # declare has written this directory.
            - name: wireplumber-config
              mountPath: /etc/wireplumber/wireplumber.conf.d
      containers:
        - name: operator
          image: ghcr.io/liken-sh/audio-operator:latest
          env:
            # The node name for the ResourceSlice that describes this
            # node's hardware.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # pw-dump, which the operator runs to read the graph, finds
            # PipeWire's socket through these variables.
            - name: PIPEWIRE_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            - name: XDG_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            # The Prometheus listener, on the metrics port that liken
            # components share. An empty value turns metrics off. A
            # scrape reads an in-memory registry and touches no card,
            # PipeWire, or the bus, so the listener is on by default.
            - name: METRICS_ADDRESS
              value: ":9200"
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            # The operator reads cards through the ALSA control
            # interface, runs pw-dump, writes CDI files, and serves a
            # socket to the kubelet. None of that needs a capability.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              memory: 128Mi
            claims:
              - name: controller
          volumeMounts:
            # The kubelet finds DRA plugins through the registry
            # directory, and the driver serves prepare calls on a socket
            # in its own plugin directory. The driver creates a socket in
            # each, so both are writable.
            - name: kubelet-plugin
              mountPath: /var/lib/kubelet/plugins/audio.liken.sh
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            # The driver writes a CDI spec for each prepared claim here,
            # and the container runtime applies it to the consumer's
            # container. Other liken drivers write to the same directory,
            # and their file name prefixes keep the specs apart.
            - name: cdi
              mountPath: /var/run/cdi
            # PipeWire's socket directory. A consumer's CDI spec mounts
            # this host directory into the consumer's container at the
            # same path.
            - name: runtime
              mountPath: /var/run/audio.liken.sh
            # The operator reads the declarations to detect a card whose
            # PCM devices changed after PipeWire loaded them, and
            # rewrites them when a sink's channel layout changes, so the
            # mount is writable.
            - name: pipewire-config
              mountPath: /etc/pipewire/pipewire.conf.d
        # Serves captures to audio-api. Restarting it ends only the
        # captures running on this node.
        #
        # It has no readiness probe, because a container's readiness
        # sets the pod's Ready condition, and a capture certificate that
        # arrives late must not stall the DaemonSet's rollout. While
        # capture is not ready, audio-api returns 503 and the
        # audio_capture_ready gauge reads 0. Until audio-api issues the
        # leaf certificate in capture-tls, the container serves a
        # self-signed certificate, so the liveness probe still reaches
        # /healthz over TLS.
        - name: capture
          image: ghcr.io/liken-sh/audio-operator:latest
          args: ["capture"]
          env:
            - name: PIPEWIRE_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            - name: XDG_RUNTIME_DIR
              value: /var/run/audio.liken.sh
            - name: CAPTURE_ADDRESS
              value: ":9201"
            - name: CAPTURE_TAPS
              value: "4"
            - name: CAPTURE_TLS_DIR
              value: /var/run/audio-capture-tls
          ports:
            - name: capture
              containerPort: 9201
          livenessProbe:
            httpGet:
              path: /healthz
              port: capture
              scheme: HTTPS
            periodSeconds: 60
            failureThreshold: 3
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: runtime
              mountPath: /var/run/audio.liken.sh
            - name: capture-tls
              mountPath: /var/run/audio-capture-tls
              readOnly: true
      resourceClaims:
        - name: controller
          resourceClaimTemplateName: every-sound-card
      volumes:
        # DirectoryOrCreate, because a node that has never run this
        # operator or a DRA driver does not have these directories.
        - name: kubelet-plugin
          hostPath:
            path: /var/lib/kubelet/plugins/audio.liken.sh
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: runtime
          hostPath:
            path: /var/run/audio.liken.sh
            type: DirectoryOrCreate
        # declare writes this directory at pod start, the operator
        # rewrites it when a layout changes, and PipeWire reads it. It
        # is an emptyDir so that no declaration outlives the pod and
        # reaches the next PipeWire.
        - name: pipewire-config
          emptyDir: {}
        # declare writes this directory and WirePlumber reads it. The
        # image's own fragments are under /usr/share/wireplumber, which
        # this mount does not hide, and WirePlumber reads /usr/share
        # before /etc, so the generated fragment overrides them.
        - name: wireplumber-config
          emptyDir: {}
        # audio-api signs the capture container's leaf certificate with
        # its CA and writes it to this Secret. The Secret does not exist
        # until audio-api creates it, so the volume is optional, or the
        # pod would stay in ContainerCreating. The container reloads the
        # certificate when the file changes, so the pod's ServiceAccount
        # needs no permission on the Secret.
        - name: capture-tls
          secret:
            secretName: audio-capture-server
            optional: true
