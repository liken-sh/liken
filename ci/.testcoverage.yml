# This is the coverage gate, enforced by `make test`, which is what CI
# runs. The threshold only rises over time. It is set just under what
# the tests measure today, so a change that loses coverage fails the
# check, and a change that gains coverage should raise the number here
# to keep the gain.
#
# The numbers are measured with Go 1.27.1. Its profiles count a basic
# block once for each row that comments split the block into
# (golang/go#80974), so the floors move when Go 1.27.2 fixes that.
#
# What stays untested is main itself, the functions that run go list,
# cargo metadata, and each publish command for real, and a scattering
# of I/O error returns. The tests give every command fixtures in their
# place: a git repository, a registry, and a channel.

profile: coverage.out

threshold:
  total: 84
