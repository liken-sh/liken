# `make test`, which CI runs, fails when total coverage falls below the
# threshold. The threshold is set just under the measured coverage, so
# a change that loses coverage fails. Raise it when coverage rises.
#
# The threshold assumes Go 1.27.2 or later. Go 1.27.1 and earlier count
# a basic block once for each piece that a comment splits it into
# (golang/go#80974), so they report higher coverage.
#
# main, some I/O error returns, and the functions that really run
# `go list`, `cargo metadata`, and the publish commands stay untested.
# The tests run those commands against fixtures instead: a git
# repository, a registry, and a channel.

profile: coverage.out

threshold:
  total: 90
