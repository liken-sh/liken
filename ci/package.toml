# The program that reads every package.toml, writes the workflows, and
# plans and publishes each run. It publishes nothing of its own.
[package]
name = "ci"
license = "MIT"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
