# The program that reads every package.toml, writes the workflows, and
# plans and publishes each run. It publishes nothing of its own.
[package]
name = "ci"
license = "MIT"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test"

# Runs the hooks of .pre-commit-config.yaml. It skips the Go hooks,
# because `make test` in the go job runs the same checks.
[[jobs]]
name = "prek"
toolchain = "prek"
skip = ["gofmt", "go-vet", "go-mod-tidy"]
