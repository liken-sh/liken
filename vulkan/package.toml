# The Vulkan loader, the Intel and AMD drivers, and the client libraries
# a Wayland program opens, on nothing else. It is the lowest base image,
# and its directory holds the scripts that every base on Debian uses.
[package]
name = "vulkan"
# The date of the snapshot.debian.org archive that the build installs
# from, as YYYYMMDD. Every base on Debian uses the same date.
version = "20261024"
revision = 1
license = "MIT"

# The upstream releases that the snapshot holds, as Debian names them.
# Each one is a label of the image, sh.liken.upstream.<name>. A new
# snapshot date updates them.
[package.upstream]
mesa = "26.2.5-1"
vulkan-loader = "1.4.363.0-1"

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"

[[outputs.images]]
name = "vulkan"
