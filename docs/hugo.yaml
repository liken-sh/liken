# The site's configuration. The interesting part is the output
# formats: every page renders twice, once as HTML for people and once
# as the authored Markdown for agents and scripts. The two files land
# side by side, so the Markdown twin of /docs/guides/install/ is
# /docs/guides/install/index.md. The home page also renders llms.txt
# and llms-full.txt, the convention (https://llmstxt.org) agents check
# at a site's root: an index of the Markdown twins, and the whole
# manual in one file.
baseURL: https://liken.sh/
title: liken
# The presentation is the brand theme, the git submodule at
# themes/brand (github.com/liken-sh/brand). It supplies the page
# shell, the shared stylesheet, the nav, and the public brand files,
# so every liken site has the same presentation. The only layouts
# kept in this site are the two llms.txt templates, because their
# prose is about this manual; Hugo gives a site's layouts/ precedence
# over the theme's.
theme: brand
# The repository this site documents. The theme's nav links its
# "repository" entry to this URL, and the sidebar heading on every
# page takes the project name from the URL's last path segment. A
# site without this parameter gets no "repository" entry.
params:
  repository: https://github.com/liken-sh/liken
  # This site publishes the test coverage report at /coverage.html,
  # built by CI from the same commit the site is built from. The
  # theme's footer links it only when this parameter is set.
  coverage: true
# No taxonomies and no feeds: the site is a manual, not a blog. The
# sitemap stays, because it is free and crawlers use it.
disableKinds: [taxonomy, term, rss]

# The generated reference pages put an id on each field's table row,
# as a raw-HTML span, so a link can land on exactly one field
# (docs/crdref emits them). Goldmark drops raw HTML unless this is
# set, and everything this site renders is authored in this
# repository.
markup:
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  markdown:
    # text/markdown is a media type Hugo already has, with the md
    # suffix. baseName index makes the output index.md, beside
    # index.html in the same pretty-URL directory.
    mediaType: text/markdown
    baseName: index
    isPlainText: true
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
  llms-full:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true

outputs:
  home: [html, markdown, llms, llms-full]
  section: [html, markdown]
  page: [html, markdown]
