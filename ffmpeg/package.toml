# The vaapi image plus ffmpeg and ffprobe and every library they load.
[package]
name = "ffmpeg"
# The date of the snapshot.debian.org archive that the build installs
# from, as YYYYMMDD. Every base on Debian uses the same date.
version = "20260928"
revision = 1
license = "MIT"

# The image builds on vaapi. The build takes the vulkan directory as
# the context builder, for the scripts that every base on Debian uses.
[depends]
components = ["vaapi", "vulkan"]

[[outputs.images]]
name = "ffmpeg"
contexts = { builder = "vulkan" }
smoke = "ffmpeg/smoke/ffmpeg.sh"
