# These quality checks run before every commit, through pre-commit (or
# prek, its drop-in replacement). The Go stack here (gofmt, go vet,
# staticcheck, and a tidy go.mod) is the standard minimum for a Go
# project. The rest checks repo hygiene, and lints the shell that
# implements our Make rules.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Golden test fixtures are byte-exact by definition (a GRUB
      # environment block is exactly 1024 bytes, padded with '#', with
      # no final newline). So the whitespace fixers must leave them
      # alone.
      - id: trailing-whitespace
        exclude: /testdata/
      - id: end-of-file-fixer
        exclude: /testdata/
      - id: check-yaml
        # Kubernetes manifests are conventionally multi-document
        # streams (machine-operator/manifests/machine-operator.yaml
        # carries a namespace, RBAC, and a DaemonSet in one file).
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py wraps a prebuilt shellcheck binary. So the hook
  # works even on machines without shellcheck installed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        # -w rewrites files in place. pre-commit fails the commit when
        # a hook modifies files. So an unformatted commit becomes a
        # formatted retry.
        #
        # The gofmt that runs is the one belonging to the toolchain
        # go.mod names, not whichever gofmt sits earliest on PATH.
        # gofmt is a plain binary, so it never re-execs into the
        # declared toolchain the way `go` does, and its formatting
        # changes between releases: 1.27 indents a composite literal
        # inside a return differently from 1.26. A workstation with an
        # older Go installed would otherwise reformat files one way
        # and CI would reformat them back.
        entry: bash -c 'exec "$(go env GOROOT)/bin/gofmt" -l -w "$@"' --
        language: system
        types: [go]
      # The repo's programs are one Go module (see go.mod at the
      # root). So every check is a single invocation of ./.... This
      # covers Go files in any domain directory, present or future,
      # without listing them. The one exception is docs/, a nested
      # module that exists to keep Hugo's dependency graph out of the
      # root go.sum; ./... does not descend into it, and `make -C
      # docs test` runs the same checks against that module.
      - id: go-vet
        name: go vet
        entry: bash -c 'go vet ./...'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      # The tests run on the toolchain that builds what ships, which
      # is the `toolchain` directive in go.mod.
      - id: go-test
        name: go test
        entry: bash -c 'go test ./...'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      # The gate measures coverage on its own run, on its own pinned
      # toolchain, and the pin is the point.
      #
      # Go 1.27 splits a basic block into one profile row per run of
      # code, so a comment inside a function ends that row and starts
      # another. Each row repeats the whole block's statement count,
      # and every reader sums the rows, `go tool cover` included. A
      # block written as three runs of code therefore counts three
      # times. The error is not a constant: it grows with the
      # comments inside a function, so it moves a package's number up
      # or down when someone only reflows a comment. On this repo it
      # moves machine-operator down 11.6 points and disks up 5.9.
      #
      # Go 1.26 counts each block once, so the pin below measures
      # what .testcoverage.yml's thresholds were set against. Move it
      # to the newest toolchain that counts each block once.
      #
      # go-test-coverage is a pinned tool dependency (the `tool`
      # directive in go.mod), so the gate needs nothing installed
      # beyond the Go toolchain. Its thresholds live in
      # .testcoverage.yml, which explains how they are chosen. The
      # profile itself is gitignored.
      - id: go-test-coverage
        name: go test coverage
        entry: bash -c 'GOTOOLCHAIN=go1.26.7 go test -coverprofile=coverage.out ./... && GOTOOLCHAIN=go1.26.7 go tool go-test-coverage --config=.testcoverage.yml'
        language: system
        files: \.go$|^go\.(mod|sum)$|^\.testcoverage\.yml$
        pass_filenames: false
      # Like go-test-coverage above, staticcheck is a pinned tool
      # dependency in go.mod. So every machine (and CI) runs the same
      # version without installing anything beyond the Go toolchain.
      - id: staticcheck
        name: staticcheck
        entry: bash -c 'go tool staticcheck ./...'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        # -diff reports what tidying would change, without changing
        # it. So a stale go.mod/go.sum makes the check fail with an
        # error, instead of silently changing during a commit.
        entry: bash -c 'go mod tidy -diff'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
