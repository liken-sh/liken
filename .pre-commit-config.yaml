# The hooks for the files at the top of the repository: the plans, the
# agent files, the CI workflows, and the liken.sh domain, the check
# that the generated workflows match every package.toml, and the check
# of every pin. Each component directory has its own
# .pre-commit-config.yaml, which prek finds from this one and runs on
# that directory's files. prek also passes every file in the repository
# to this config, so the filter below keeps these hooks to the files
# that no component owns, to the inputs of the generated workflows, and
# to the inputs of `ci pins`: a component's own exclusions, such as its
# test data, stay in force.
files: ^(\.agents/|\.github/|liken\.sh/|plans/|[^/]+$|ci/templates/|[^/]+/package\.toml$|.*/Dockerfile[^/]*$|toolchains/images\.toml$|toolchains/pin\.sh$|trust/keys/|.*/VERSION$|.*/pin\.toml$|.*\.sh$|.*/go\.mod$|.*/Cargo\.toml$|.*/rust-toolchain\.toml$|.*/\.pre-commit-config\.yaml$|.*/liken-[a-z-]+-v[0-9]+\.xml$|ci/(actions|trivy|workflow)\.go$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py wraps a prebuilt shellcheck binary, so the hook
  # works on a machine with no shellcheck installed. At this level it
  # checks versions.sh and the scripts of liken.sh, and -x follows the
  # source line of liken.sh/latest.sh into toolchains/pin.sh.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]
        # The scripts of the components reach this config for the pins
        # hook below, and each component's own shellcheck checks them.
        files: ^(\.agents/|liken\.sh/|[^/]+$)
  - repo: local
    hooks:
      - id: workflows
        name: generated workflows are current
        # The workflows in .github/workflows/ and docker-bake.hcl come
        # from each component's package.toml, the FROM lines of its
        # Dockerfiles, the images in toolchains/images.toml, the flux
        # version in liken/flux/VERSION, and the templates in
        # ci/templates/. A change to any of them without
        # `make workflows` fails here.
        entry: bash -c 'cd ci && go run . generate -root .. -check'
        language: system
        files: ^ci/templates/|/package\.toml$|^\.github/workflows/|^docker-bake\.hcl$|/Dockerfile[^/]*$|^toolchains/images\.toml$|^liken/flux/VERSION$
        pass_filenames: false
      - id: pins
        name: pins and downloads follow the rules
        # `ci pins` checks that each shared pin names one version, and
        # that each pin follows the rules of "Pins and downloads" in
        # AGENTS.md: each fetch.sh and latest.sh sources
        # toolchains/pin.sh and downloads through it, no build reads a
        # digest from the network, each pin has a latest.sh that make
        # versions runs, and each pin that a release ships has a
        # pin.toml that agrees with its fetch. A change to a script, a
        # Dockerfile, a VERSION, a pin.toml, images.toml, versions.sh,
        # the library, or a key in trust/keys/ that breaks a rule
        # fails here, and so does a
        # change that makes the two copies of closure.sh differ, a
        # digest in the source mirror liken/licensing/sources.sh, a
        # shell script that pins an image by a digest of its own, and a
        # uses: under .github/ that names an action by anything but
        # the commit and the release of actionPins in ci/actions.go.
        # The check also compares the Go and Rust versions, the module
        # and crate versions, the hook revisions, and the copies of a
        # liken Wayland protocol across the tree, so a go.mod, a
        # Cargo.toml, a rust-toolchain.toml, a .pre-commit-config.yaml,
        # a protocol file, or a ci source that holds a pin starts it
        # too.
        entry: bash -c 'cd ci && go run . pins -root ..'
        language: system
        files: \.sh$|/Dockerfile[^/]*$|(^|/)(VERSION|pin\.toml)$|^toolchains/(images\.toml|pin\.sh)$|^versions\.sh$|^trust/keys/|^\.github/|(^|/)(go\.mod|Cargo\.toml|rust-toolchain\.toml|\.pre-commit-config\.yaml)$|(^|/)liken-[a-z-]+-v[0-9]+\.xml$|^ci/(actions|trivy|workflow)\.go$
        pass_filenames: false
