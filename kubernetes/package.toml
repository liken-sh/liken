# The client, the watch, and the cache that the operators import.
[package]
name = "kubernetes"
license = "MIT"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test"
timeout = 15
coverage = ["coverage.out"]

[[jobs]]
name = "prek"
toolchain = "prek"
# `make test` in the `go` job already runs these three checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]
