[package]
name = "liken-iced"
version = "0.1.0"
edition = "2024"

# The crate includes liken.svg and liken.css from the directory above,
# so a consumer depends on it by path, and an image build copies all
# of brand/ to /brand.
#
# The canvas feature builds no renderer, because the consumer picks
# the renderer and this crate draws through it.
#
# library-operator's media browser and media-operator's screens pin
# the same exact iced_widget. Cargo resolves one 0.14 release of a
# crate per build, so two different exact pins fail to resolve, and a
# bump changes every manifest in one commit.
[dependencies]
iced_widget = { version = "=0.14.2", default-features = false, features = [
    "canvas",
] }
