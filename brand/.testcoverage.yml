# The coverage gate of `make test-go`. Each threshold is just under the
# measured coverage, so a change that loses coverage fails. Raise a
# threshold when coverage rises, and never lower one.
#
# The numbers assume Go 1.27.2 or later. Go 1.27.1 and earlier count a
# basic block once for each source line that a comment splits it into
# (golang/go#80974), and report higher coverage.

profile: coverage.out

threshold:
  total: 93

override:
  # Only main is untested.
  - path: ^apiref$
    threshold: 95
  # main and some I/O error returns are untested.
  - path: ^coverage$
    threshold: 93
  # Some I/O error returns are untested.
  - path: ^crdref$
    threshold: 88
  - path: ^linkcheck$
    threshold: 95
  # main calls os.Exit, so a test cannot run it.
  - path: ^preview$
    threshold: 88
  # main and some I/O error returns are untested.
  - path: ^skills$
    threshold: 91
