# This is the coverage gate, enforced by `make test`, which is what
# CI runs (see .github/workflows/ci.yaml).
#
# The thresholds only rise over time. Each one is set just under what
# the tests measure today. So a change that loses coverage fails the
# check, and a change that gains coverage should raise the number
# here to keep the gain.
#
# The gate measures on a pinned toolchain. The Makefile says why.

profile: coverage.out

threshold:
  total: 93

override:
  # apiref reads an API's OpenAPI document and writes the route
  # reference page. The tests run it against the document one of the
  # manuals publishes, and against small documents for the shapes
  # that one does not hold. What stays untested is main itself.
  - path: ^apiref$
    threshold: 95
  # coverage reads a repository's coverage data and writes the HTML
  # report. The tests run it against a fixture tree with a profile
  # and a Cobertura report. What stays untested is main itself and a
  # scattering of I/O error returns.
  - path: ^coverage$
    threshold: 93
  # crdref reads a CRD's schema and writes the reference page. The
  # tests run it against real CRDs. What stays untested is a
  # scattering of I/O error returns.
  - path: ^crdref$
    threshold: 88
  # linkcheck resolves every link in a built site against the pages
  # and anchors it finds. The tests cover it against fixture trees.
  - path: ^linkcheck$
    threshold: 95
  # skills turns each guide into a SKILL.md. The tests run it against
  # a fixture guides directory. What stays untested is main itself
  # and a scattering of I/O error returns.
  - path: ^skills$
    threshold: 91
