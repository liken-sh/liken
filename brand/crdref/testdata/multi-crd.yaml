# One YAML stream that holds three
# CustomResourceDefinitions and one document that is not a CRD, the
# shape an operator repository ships in deploy/crds.yaml. The schemas
# are as small as the selection tests allow: each page only has to be
# telling apart from the other two.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.liken.sh
spec:
  group: liken.sh
  names:
    kind: Widget
    plural: widgets
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: A Widget describes one widget.
          properties:
            spec:
              type: object
              description: What the widget should be.
              properties:
                width:
                  type: integer
                  description: How wide the widget is.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-a-crd
data:
  note: A stream may carry other objects beside the CRDs.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.liken.sh
spec:
  group: liken.sh
  names:
    kind: Gadget
    plural: gadgets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: A Gadget describes one gadget.
          properties:
            spec:
              type: object
              description: What the gadget should be.
              properties:
                purpose:
                  type: string
                  description: What the gadget is for.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sprockets.liken.sh
spec:
  group: liken.sh
  names:
    kind: Sprocket
    plural: sprockets
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: A Sprocket describes one sprocket.
          properties:
            spec:
              type: object
              description: What the sprocket should be.
              properties:
                teeth:
                  type: integer
                  description: How many teeth the sprocket has.
