<!--
The page layout of every Hugo site that uses this theme. The shared
stylesheet sets the colors, the type, and the common elements. The
rules after it are for the site nav, the breadcrumbs, the table of
contents, and the manual's sidebar. No page runs JavaScript.

The sidebar comes from aside.html, which renders the whole /docs tree
when the site has one. Its heading is the last path segment of the
site's repository parameter, so an operator's site names that
operator. The sidebar shows only on a wide screen, and the breadcrumbs
replace it on a narrow one. The Markdown version of a page has no
sidebar, nav, or breadcrumbs.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
{{ with resources.Get "liken.css" }}{{ .Content | safeCSS }}{{ end }}
  nav.site { margin-bottom: 2rem; }
  nav.site a { margin-right: 1rem; }
  /* A site that publishes a coverage report has a second footer
     link. */
  footer a + a { margin-left: 1rem; }
  nav.crumbs { font-size: 0.9em; margin-bottom: 1.5rem; }
  nav.crumbs span[aria-current] { color: var(--ink-muted); }
  /* A figure floats right and the text wraps beside it. 8rem leaves
     the text column readable on a phone. */
  figure { float: right; width: 8rem; margin: 0 0 1rem 1.5rem; }
  figure img { width: 100%; height: auto; }
  figcaption { font-size: 0.75em; font-style: italic; line-height: 1.4;
               color: var(--ink-muted); text-align: center; }
  /* A route reference heads each section with a path. A path has no
     spaces, so allow a break anywhere, or a long one widens the page
     on a phone. */
  nav.toc { font-size: 0.9em; background: var(--panel);
            padding: 0.6rem 1rem; margin: 1.5rem 0;
            overflow-wrap: anywhere; }
  /* A pre block wider than the text column, such as command output,
     stays centered on the column and grows into the page margins
     before it scrolls. A page with the sidebar has no free left
     margin, so its pre blocks stay in the column. */
  body:not(.manual) main pre {
    width: fit-content;
    min-width: 100%;
    max-width: min(100vw - 3rem, 80rem);
    margin-left: 50%;
    transform: translateX(-50%);
  }
  body:not(.manual) main pre code { font-size: 0.875em; }
  nav.toc ul { list-style: none; margin: 0; padding-left: 0; }
  nav.toc ul ul { padding-left: 1rem; }
  /* apiref writes a route's heading as the method and the path in code
     spans, with a data-method attribute. The method shows as a badge:
     green for the methods that RFC 9110 calls safe (GET, HEAD,
     OPTIONS, TRACE), and the warm color for the methods that change
     state. The selector requires data-method because a CLI reference
     also starts its headings with a code span. */
  main h2[data-method] > code:first-child {
    display: inline-block;
    padding: 0 0.4em;
    border: 1px solid currentColor;
    border-radius: 0.2em;
    font-size: 0.65em;
    letter-spacing: 0.06em;
    vertical-align: 0.2em;
    color: var(--link);
  }
  main h2[data-method="POST"] > code:first-child,
  main h2[data-method="PUT"] > code:first-child,
  main h2[data-method="PATCH"] > code:first-child,
  main h2[data-method="DELETE"] > code:first-child { color: var(--warm); }
  main h2[data-method] > code:last-child { font-size: 0.85em; }
  /* apiref writes a bold line as the caption of each table in a
     route's section. Its margins put it next to the table below it. */
  main p:has(> strong:only-child):has(+ table) {
    margin: 1.5rem 0 0;
    font-size: 0.9em;
  }
  aside { display: none; }
  @media (min-width: 70rem) {
    /* The manual's column is wider than the text measure, because a
       CRD reference table has columns of sentences that do not fit
       the measure. Only tables and pre blocks use the extra width. */
    body.manual { max-width: 80rem; display: grid;
                  grid-template-columns: 15rem minmax(0, 60rem);
                  column-gap: 3rem; align-items: start; }
    body.manual main > :not(table):not(pre) { max-width: var(--measure); }
    body.manual > nav.site { grid-column: 1 / -1; }
    body.manual > footer { grid-column: 2; }
    body.manual > aside { display: block; position: sticky; top: 2rem;
                          font-size: 0.9em; }
    aside p { margin: 0 0 0.5rem; }
    aside ul { list-style: none; padding-left: 1rem; margin: 0 0 1rem; }
    aside li { margin: 0.2rem 0; }
    /* Sidebar links underline only on hover, because they are
       navigation and not prose. */
    aside a { text-decoration: none; }
    aside a:hover { text-decoration: underline; }
    aside a[aria-current] { font-weight: 600; }
  }
</style>
{{ partial "head.html" . }}
</head>
{{- /* A page with a sidebar gets the manual grid. */ -}}
{{- $aside := partial "aside.html" . | strings.TrimSpace -}}
<body{{ if $aside }} class="manual"{{ end }}>
{{ partial "nav.html" . }}
{{ $aside | safeHTML }}
<main>
{{ partial "crumbs.html" . }}
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
</body>
</html>
