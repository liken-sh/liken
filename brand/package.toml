# The theme, the voice rules, and the site tools. Every manual builds
# with it, and the screens of media-operator and library-operator draw
# with its liken-iced crate and its fonts. It publishes nothing of its
# own.
[package]
name = "brand"
license = "MIT"

# The voice rules, the motion rules, and the editing prompt are prose that
# people and agents read. No build reads them: the images take the iced
# crate, the mark, the stylesheet, and the fonts, and the OS takes the mark
# and the stylesheet. So an edit to them releases no component that depends
# on brand. The manuals still check against them, because every component
# with a manual runs its checks on any change in brand/.
[outputs]
exclude = ["voice.md", "motion.md", "editing-prompt.md"]

[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20

# liken-iced is the crate that the screens of media-operator and
# library-operator draw with.
[[jobs]]
name = "rust"
toolchain = "rust"
dir = "iced"
run = "make test"
timeout = 45
env = { CARGO_INCREMENTAL = "0" }

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go and rust jobs run the same checks as these hooks.
skip = ["gofmt", "go-vet", "staticcheck", "go-mod-tidy", "cargo-fmt-iced"]
