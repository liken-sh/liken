# The theme, the voice rules, and the site tools. Every manual builds
# with it, and the screens of media-operator and library-operator draw
# with its liken-iced crate and its fonts. It publishes nothing of its
# own.
[package]
name = "brand"
license = "MIT"

# No build reads voice.md, motion.md, editing-prompt.md, mark.md, or
# theme.md, so a change to them releases no component that depends on
# brand. A component with a manual still runs its checks on a change
# to them, because CI runs those checks on any change in brand/
# outside its plans.
[outputs]
exclude = ["voice.md", "motion.md", "editing-prompt.md", "mark.md", "theme.md"]

[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20

[[jobs]]
name = "rust"
toolchain = "rust"
dir = "iced"
run = "make test"
timeout = 45
env = { CARGO_INCREMENTAL = "0" }

[[jobs]]
name = "prek"
toolchain = "prek"
# The go and rust jobs already run these checks.
skip = ["gofmt", "go-vet", "staticcheck", "go-mod-tidy", "cargo-fmt-iced"]
