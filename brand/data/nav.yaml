# The top nav of every liken site, in order. There is no entry for a
# site's manual, because the sidebar shows it on every page.
#
# An entry with `param` in place of `url` reads its URL from that
# parameter in the site's hugo.yaml, so "repository" links the code
# that the site documents. A site that does not set the parameter gets
# no entry, because a guessed URL would link the wrong repository.
#
# `code: true` sets the label in the code face. A site can replace
# this file with its own data/nav.yaml.
- label: liken
  url: https://liken.sh/
  code: true
- label: operators
  url: https://liken.sh/docs/concepts/extension-operators/
- label: repository
  param: repository
- label: releases
  url: https://releases.liken.sh/
- label: devlog
  url: https://log.liken.sh/
