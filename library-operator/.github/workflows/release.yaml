# Every image this repository publishes goes through this workflow.
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.03-007, and the images ship under that
# tag and :latest. A push to main cuts a development build: the
# version is the most recent release tag plus a suffix,
# 2026.09.03-007-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# Both kinds run the tests first and build only when they pass. A
# development build that skipped the tests would put a broken image
# one pin away from a cluster.
#
# The release cadences of the operators do not couple, and reading one
# version beside another still tells you when each one was cut.
#
# The three images release together, always, under one version. The
# operator names the other two in the pods it creates, and a pair that
# could drift apart would put the catalog contract at two versions at
# once.
#
# The run is ci.yaml's three test jobs, then one job that builds,
# proves, and pushes, which it reaches only after all three pass.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read
  packages: write

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: release

jobs:
  # The tests gate the build. A tag can name any commit, so the
  # release proves the one it ships. An image that reaches the registry
  # has passed them. A rollback names an older tag, and never has to
  # find out which tag was good.
  #
  # The three jobs below are ci.yaml's go, rust, and docs jobs, step
  # for step and target for target, so the release gate is never weaker
  # than the one main passes.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floor.
      - run: make test-go

  rust:
    # The headless tests run under cage, and the cage in Ubuntu 24.04
    # (0.1.5) dies on an assertion when wlr-randr changes the output
    # mode. Ubuntu 26.04 carries 0.2.1, which takes the change, and it
    # is the release the workstations run.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: media-browser
    env:
      # Incremental artifacts are large, and a fresh runner never
      # reuses them. Without this they would fill the cache and gain
      # nothing.
      CARGO_INCREMENTAL: 0
      # cage renders with pixman, so the compositor needs no GPU on
      # the runner.
      WLR_RENDERER: pixman
    steps:
      # The media browser builds against liken-iced, the crate in the
      # brand repository that carries the mark and the palette. It is
      # a submodule at media-browser/brand, and a checkout without it
      # resolves no dependency.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The media browser's tests open a real window. cage is the
      # compositor, wlr-randr sets the headless mode, and
      # mesa-vulkan-drivers carries lavapipe, the software Vulkan
      # device a runner with no GPU draws through.
      - name: install the headless graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cage wlr-randr mesa-vulkan-drivers libvulkan1 \
            libwayland-client0 libxkbcommon0

      # media-browser/rust-toolchain.toml names the version and the
      # components. rustup installs what the file names, so this
      # workflow pins no version of its own.
      - name: install the toolchain
        run: rustup show

      # The cache holds the cargo registry and target/, keyed on
      # Cargo.lock. Almost all of the build is dependencies, and they
      # change only when the lock file changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: media-browser
          cache-on-failure: true

      # cargo-llvm-cov is a binary. The action fetches its release
      # build instead of compiling one, and it runs after rust-cache,
      # which prunes binaries it did not see before it saved.
      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      # The same target a workstation runs: the format, the lints,
      # and the tests under the coverage gate. media-browser/Makefile
      # holds the floor.
      - run: make test

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

  release:
    needs: [go, rust, docs]
    runs-on: ubuntu-latest
    steps:
      # The media browser image builds liken-iced from the submodule
      # at media-browser/brand, so the checkout brings every submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no machine can order against
      # the others. A push to main derives it: git describe finds the
      # most recent release tag and counts the commits since it, and
      # the first eight characters of the commit sha make the build
      # traceable. The checkout fetches the whole history, because
      # describe needs the tags.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]')
            release=${described%-*-g*}
            count=${described#"$release"-}
            count=${count%-g*}
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins
      # its manifests needs the full commit sha: a git fetch by sha
      # wants all forty characters, and the eight in the version are
      # not enough. The run's summary prints the two lines to paste,
      # so a roll is a copy.
      - name: Write the roll lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY-media-browser"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY-corrosion"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The three images build here and push nothing yet. The gates
      # below have to pass first, and a push that happened first would
      # leave a broken :latest behind when a gate failed.
      #
      # The builds read and write the :buildcache tags beside each
      # image. A tag's release of a commit whose development build
      # already ran here rebuilds nothing, and a pull request's builds
      # in ci.yaml read the same tags.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/library-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/library-operator:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/library-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/library-operator:latest

      - name: Build the media browser image
        uses: docker/build-push-action@v6
        with:
          context: media-browser
          file: media-browser/Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/library-operator-media-browser:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/library-operator-media-browser:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/library-operator-media-browser:${{ env.VERSION }}
            ghcr.io/liken-sh/library-operator-media-browser:latest

      - name: Build the Corrosion image
        uses: docker/build-push-action@v6
        with:
          context: corrosion
          file: corrosion/Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/library-operator-corrosion:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/library-operator-corrosion:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/library-operator-corrosion:${{ env.VERSION }}
            ghcr.io/liken-sh/library-operator-corrosion:latest

      # The gate on the images. The runner has no GPU, no Wayland, and
      # no peers, so nothing here draws or replicates. What can break
      # invisibly is the dynamic closure, so each binary proves that it
      # loads its libraries by answering one flag.
      - name: Prove the images
        run: |
          set -eu
          docker run --rm "ghcr.io/liken-sh/library-operator-media-browser:$VERSION" --help
          docker run --rm "ghcr.io/liken-sh/library-operator-corrosion:$VERSION" --version

      # :latest marks the newest release and nothing else. A
      # development build pushes its own tag only.
      - name: Push the images
        run: |
          set -eu
          docker push "ghcr.io/liken-sh/library-operator:$VERSION"
          docker push "ghcr.io/liken-sh/library-operator-media-browser:$VERSION"
          docker push "ghcr.io/liken-sh/library-operator-corrosion:$VERSION"
          if [ "$RELEASE" = true ]; then
            docker push "ghcr.io/liken-sh/library-operator:latest"
            docker push "ghcr.io/liken-sh/library-operator-media-browser:latest"
            docker push "ghcr.io/liken-sh/library-operator-corrosion:latest"
          fi
