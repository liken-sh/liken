# Every pull request and every push to main runs the gate here: the
# tests, the coverage floors, and the docs checks. A pull request also
# builds every image and stops there; on a push to main the images
# build in release.yaml, which starts at the same moment, waits for
# this run, and pushes no image from a red gate. So a commit on main
# gets the same verdict a pull request would, and the images build
# once. A push to main also publishes the website, so this
# workflow both judges a change and ships the site that describes it.
#
# There is no path filter. The tests are cheap, and a filter would
# have to decide which files can never break a build. That list is
# wrong the day someone adds a file it does not name, and the push
# that adds it would then land untested. Publishing takes no filter
# either: the site carries the test coverage report, so a change to
# any Go file moves a page.
#
# The three gate jobs are independent, so they run at once, and the
# gate takes as long as its slowest job. publish waits for all three,
# so a red gate never deploys.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch assembles the current main with no change, for the
  # times the serving side needs a fresh tree.
  workflow_dispatch:

permissions:
  contents: read
  # The image builds read their layer cache from ghcr. No run of this
  # workflow writes an image or the cache, so read is enough.
  packages: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floor.
      - run: make test-go

      # The site's coverage report measures the commit the site is
      # built from, and this job holds the only run of the tests on
      # the pinned toolchain. The profile travels to publish as an
      # artifact rather than being measured a second time there.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-go
          path: coverage.out
          # A missing profile means the gate wrote nothing, and the
          # report would then be drawn from stale or absent data.
          if-no-files-found: error
          # publish reads it within minutes of this step, and nothing
          # else ever reads it.
          retention-days: 7

  rust:
    # The headless tests run under cage, and the cage in Ubuntu 24.04
    # (0.1.5) dies on an assertion when wlr-randr changes the output
    # mode. Ubuntu 26.04 carries 0.2.1, which takes the change, and it
    # is the release the workstations run.
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: media-browser
    env:
      # Incremental artifacts are large, and a fresh runner never
      # reuses them. Without this they would fill the cache and gain
      # nothing.
      CARGO_INCREMENTAL: 0
      # cage renders with pixman, so the compositor needs no GPU on
      # the runner.
      WLR_RENDERER: pixman
    steps:
      # The media browser builds against liken-iced, the crate in the
      # brand repository that carries the mark and the palette. It is
      # a submodule at media-browser/brand, and a checkout without it
      # resolves no dependency.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The media browser's tests open a real window. cage is the
      # compositor, wlr-randr sets the headless mode, and
      # mesa-vulkan-drivers carries lavapipe, the software Vulkan
      # device a runner with no GPU draws through.
      - name: install the headless graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cage wlr-randr mesa-vulkan-drivers libvulkan1 \
            libwayland-client0 libxkbcommon0

      # media-browser/rust-toolchain.toml names the version and the
      # components. rustup installs what the file names, so this
      # workflow pins no version of its own.
      - name: install the toolchain
        run: rustup show

      # The cache holds the cargo registry and target/, keyed on
      # Cargo.lock. Almost all of the build is dependencies, and they
      # change only when the lock file changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: media-browser
          cache-on-failure: true

      # cargo-llvm-cov is a binary. The action fetches its release
      # build instead of compiling one, and it runs after rust-cache,
      # which prunes binaries it did not see before it saved.
      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      # The same target a workstation runs: the format, the lints,
      # and the tests under the coverage gate. media-browser/Makefile
      # holds the floor.
      - run: make test

      # The gate writes its run out as a Cobertura file at the
      # repository root, the Rust half of the coverage report.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-rust
          path: coverage-media-browser.xml
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # tracks docs/go.sum, so between two bumps of that file the Go
      # build cache inside the entry never refreshes, and Go trims the
      # compiled Hugo and crdref objects out of it. This entry saves on
      # every run, under a key that ends in the commit, and restores the
      # newest entry for the same docs/go.sum, so the tools compile once
      # per bump instead of once per run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-${{ github.sha }}
          restore-keys: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

      # The publish job deploys this tree as it is, so the site builds
      # once per commit and the bytes it serves are the bytes the link
      # check passed.
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: docs/dist/site
          if-no-files-found: error
          retention-days: 7

  # A pull request builds every image and pushes none, so a Dockerfile
  # that stopped building fails there and not on main. A push to main
  # gets that verdict from release.yaml, which builds every image for
  # the commit at the same moment, so this job would only build the
  # same layers twice and runs on a pull request alone.
  #
  # The layer cache lives in ghcr, as a :buildcache tag beside each
  # image, not in the GitHub Actions cache. A registry cache has no
  # 10 GB ceiling, and it outlives a branch. release.yaml writes it
  # on every push to main and every tag, and this workflow only reads
  # it, so a pull request's builds start from the layers the last
  # build on main left.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # One job per image, so the four build at once and the run is as
    # long as the slowest of them, not the sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: library-operator
            context: .
            file: Dockerfile
          - image: library-operator-ffmpeg
            context: .
            file: Dockerfile.ffmpeg
          - image: library-operator-media-browser
            context: media-browser
            file: media-browser/Dockerfile
          - image: library-operator-corrosion
            context: corrosion
            file: corrosion/Dockerfile
    steps:
      # The media browser image builds liken-iced from the submodule at
      # media-browser/brand, inside the build context. A checkout
      # without it leaves the directory empty and the build fails on a
      # dependency it cannot find.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache

  # This is the website deploy. The job takes the tree the docs job
  # built, adds the test coverage report at /coverage.html and the
  # commit in release.txt, and deploys it to GitHub Pages, which
  # serves it at library.liken.sh. A pull request never reaches here:
  # the docs job above already proved the site builds, and a pull
  # request publishes nothing.
  #
  # Pages fits this site because the site is a tree of files, built
  # ahead of time, and nothing of the operator's has to run to serve
  # it. The Pages configuration, workflow-sourced deploys under the
  # library.liken.sh custom domain, is in the repository's settings,
  # set once by hand, the same class of one-time act as creating the
  # DNS record that points the name at Pages.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, rust, docs]
    if: github.event_name != 'pull_request'
    # Publishing needs two permissions the rest of this workflow does
    # not have. pages: write creates the deployment, and id-token:
    # write lets deploy-pages prove to the Pages service that the
    # artifact came from this exact workflow run. Nothing else can
    # push content under this site's name.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys run one at a time: two pushes in quick succession would
    # otherwise race their deployments, and the served-site check
    # below needs nothing else to change while it runs.
    concurrency:
      group: docs
    steps:
      - uses: actions/checkout@v7

      # The docs domain is its own Go module, and the coverage tool is
      # a tool directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # tracks docs/go.sum, so between two bumps of that file the Go
      # build cache inside the entry never refreshes, and Go trims the
      # compiled Hugo and crdref objects out of it. This entry saves on
      # every run, under a key that ends in the commit, and restores the
      # newest entry for the same docs/go.sum, so the tools compile once
      # per bump instead of once per run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-${{ github.sha }}
          restore-keys: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-

      # The gate above measured this commit, so its data lands here
      # whole. Every coverage-* artifact merges into the repository
      # root, where the Makefile's report target reads them by the
      # names the test targets write.
      - name: collect the coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      # The same target a workstation runs. It writes coverage.html
      # at the repository root, and the Makefile holds the command.
      - name: draw the coverage report
        run: make coverage-report

      - name: take the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: docs/dist/site

      # The report is one self-contained file, so it joins the built
      # tree as a page of its own at /coverage.html. Every page's
      # footer links it, because docs/hugo.yaml sets params.coverage.
      - name: add the coverage report to the site
        run: cp coverage.html docs/dist/site/coverage.html

      # The commit lands in the built tree as release.txt, so the
      # served-site check below can ask the public name which commit
      # it serves. The file joins the tree after the build, because
      # it describes the deploy, not the site.
      - name: stamp the commit
        run: echo "${{ github.sha }}" > docs/dist/site/release.txt

      - name: package the site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/site

      - name: deploy to Pages
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt holds the commit, and the other checks
      # cover the two forms every page takes and the coverage report.
      - name: verify the served site
        run: |
          # A finished deployment does not mean the public name
          # follows yet. A CDN in front of Pages caches pages for up
          # to ten minutes, so the old tree can answer for a while
          # after the new one is live at the origin. curl's
          # --retry only covers transport errors, never stale
          # content, so the freshness check needs its own deadline
          # loop before the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://library.liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://library.liken.sh/ \
            | grep -q "library.liken.sh"
          echo "checking the markdown twin"
          fetch --head https://library.liken.sh/index.md \
            | grep -qi "content-type: text/markdown"
          # The report is close to a megabyte, and the title is in
          # its first lines. A grep -q on a pipe would stop reading
          # there and leave curl to die on a closed pipe, which curl
          # retries as an error and pipefail would turn into a failed
          # step, so this one check takes the whole file to disk first.
          echo "checking the coverage report"
          fetch https://library.liken.sh/coverage.html > served-coverage.html
          grep -q "<title>library-operator</title>" served-coverage.html
