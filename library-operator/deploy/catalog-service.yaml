# Every Corrosion sidecar finds its peers through one name,
# catalog.liken-system.svc:8787. That name is in the sidecar image's
# configuration file, because Corrosion reads no bootstrap list from
# the environment.
#
# The Service is headless, so the name resolves to every peer's own
# address and no proxy stands in the gossip path. It names no selector,
# because a selector sees only its own namespace, and a Library, with
# the scanner pod it becomes, can be in any namespace. The operator
# writes the EndpointSlice behind this Service instead, over every
# scanner pod in the cluster.
#
# publishNotReadyAddresses is set because an agent that is starting is
# still a peer to gossip with, and a peer list that drops every
# not-ready agent is empty at the moment a cluster forms.
#
# The port is UDP, because Corrosion gossips over QUIC. Its name
# matches the port name on the slice the operator writes.
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: gossip
      protocol: UDP
      port: 8787
