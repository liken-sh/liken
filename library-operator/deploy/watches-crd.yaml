# A Watch is a set of people on one item: three people on a series
# together, or one person alone. Progress belongs to the set, so two
# Watches on the same series with different people are two records, and
# both are right. A person writes one by hand, or the browser creates
# one when it asks who is watching. The status is a projection of the
# progress store, and the operator rewrites it as rows arrive.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: watches.library.liken.sh
spec:
  group: library.liken.sh
  names:
    kind: Watch
    listKind: WatchList
    plural: watches
    singular: watch
    # `kubectl get media` shows the media layer at once: the players
    # and plays of the media operator, the libraries they play from,
    # and the watches that hold where each set of people reached.
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec; only the operator writes
      # status. The API server enforces the split.
      subresources:
        status: {}
      # The columns `kubectl get` shows for a Watch: who is watching,
      # what they are watching, where the playhead is, and when the
      # store last wrote a row for them.
      additionalPrinterColumns:
        - name: People
          type: string
          jsonPath: .spec.people
        - name: Item
          type: string
          jsonPath: .spec.item.slug
        - name: Position
          type: string
          jsonPath: .status.position
        - name: Recorded
          type: date
          jsonPath: .status.lastRecorded
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A set of people on one item, and where that set reached.
            Create one for each set that watches together, in the
            namespace of the `Library` that holds the item.
          properties:
            spec:
              type: object
              required: [people, item]
              description: >-
                The people who share this record, and the item they
                watch.
              properties:
                people:
                  type: array
                  x-kubernetes-list-type: set
                  minItems: 1
                  description: >-
                    The people who share this Watch, as `Person` names.
                  items:
                    type: string
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                item:
                  type: object
                  required: [library, slug]
                  description: >-
                    The item this Watch is on, as the catalog names it.
                  properties:
                    library:
                      type: string
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      description: >-
                        The `Library` in this namespace that holds the
                        item.
                    slug:
                      type: string
                      minLength: 1
                      description: >-
                        The catalog's slug for the item: a movie's, or a
                        series'.
            status:
              type: object
              description: >-
                Where this set of people reached, written only by the
                library operator. It is a projection of the progress
                store: the store publishes each row it writes, and the
                operator writes the projection here.
              properties:
                play:
                  type: string
                  description: >-
                    The last `Play` recorded against this Watch.
                item:
                  type: integer
                  description: >-
                    Which of that Play's items was playing, counting
                    from 1.
                position:
                  type: string
                  description: >-
                    The playhead inside that item, as H:MM:SS.
                duration:
                  type: string
                  description: >-
                    The length of that item, as H:MM:SS.
                season:
                  type: integer
                  description: >-
                    The season and episode numbers of that item, or 0
                    for a work that has none.
                episode:
                  type: integer
                  description: >-
                    The season and episode numbers of that item, or 0
                    for a work that has none.
                ended:
                  type: boolean
                  description: >-
                    True once that Play ended.
                lastRecorded:
                  type: string
                  format: date-time
                  description: >-
                    When the store last wrote a row for this Watch.
