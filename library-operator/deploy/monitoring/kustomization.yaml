# The metrics wiring, for a cluster owner who runs the
# prometheus-operator. It rides beside deploy/, the base, as a
# Component rather than inside it, so a cluster with no Prometheus
# applies nothing here. liken milestone 65 is the contract this
# component follows: the ports, the names, and the PodMonitor shape.
#
# The dashboard ConfigMap belongs in the monitoring namespace, where
# the kube-prometheus-stack sidecar watches for the grafana_dashboard
# label, not beside the operator. A top-level namespace: here would
# move that ConfigMap too, so each PodMonitor states liken-system on
# itself instead.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor-operator.yaml
  - podmonitor-catalog.yaml
  - podmonitor-browser.yaml

configMapGenerator:
  - name: library-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/library-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
