# The operator itself: one unprivileged Deployment, in the shape of
# liken's cluster operator rather than the hardware operators'
# DaemonSets. Those run a pod per node because they hold that node's
# hardware; this one holds no hardware at all.
#
# The operator serves no HTTP. It subscribes to media-operator's bus
# for each scanner's report instead of hearing it over an endpoint of
# its own, because a scanner pod holds no API credentials and the
# operator alone writes a Library's status.
#
# There is no volume for state. The operator re-derives everything
# from the API server on every pass.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-operator
  # Recreate, so two copies never reconcile at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: library-operator
    spec:
      serviceAccountName: library-operator
      containers:
        - name: operator
          image: ghcr.io/liken-sh/library-operator:latest
          env:
            # The broker the operator and every scanner pod reach: the
            # bus Service that media-operator's deploy/ creates in this
            # namespace. The operator cannot derive the Service name, so
            # the manifest states it, and the operator passes the
            # address into every pod it creates.
            - name: LIBRARY_BUS_ADDRESS
              value: bus.liken-system.svc:1883
            # The two images the operator stamps into every scanner
            # pod. The scanner image is this same binary in its scan
            # role, and one image serves every kind. Both are
            # environment variables rather than constants so a cluster
            # pins the three images together with one patch.
            - name: SCANNER_IMAGE
              value: ghcr.io/liken-sh/library-operator:latest
            - name: CORROSION_IMAGE
              value: ghcr.io/liken-sh/library-operator-corrosion:latest
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
