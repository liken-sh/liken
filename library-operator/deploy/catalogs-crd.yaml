# The Catalog API, declared to Kubernetes. A namespace has
# exactly one Catalog. It stands the catalog pod that holds the
# namespace's durable catalog and reports it, it sizes the volume every
# catalog agent takes, and it owns that pod, its claim, and the
# namespace's catalog Service and EndpointSlice. More than one Catalog
# in a namespace marks every Catalog Blocked and stands no cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: catalogs.library.liken.sh
spec:
  group: library.liken.sh
  names:
    kind: Catalog
    listKind: CatalogList
    plural: catalogs
    singular: catalog
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .status.storageSize
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            The namespace's shared catalog. Declare one Catalog in a
            namespace, and every Library in it writes into that catalog.
          properties:
            spec:
              type: object
              required: [storage]
              description: >-
                Where the catalog is stored and how large each agent's
                copy is.
              properties:
                storage:
                  type: object
                  default: {}
                  description: >-
                    The catalog pod's claim, the catalog of record every
                    other agent copies. Its size is also the size of
                    every copy, and its class is the default class for
                    the progress and libraries claims.
                  properties:
                    size:
                      type: string
                      default: 1Gi
                      description: >-
                        The size of each agent's catalog volume. Small
                        by default.
                    storageClassName:
                      type: string
                      minLength: 1
                      description: >-
                        The StorageClass each agent's catalog volume
                        binds to. Omitted, the cluster's default binds
                        it.
                    claimName:
                      type: string
                      minLength: 1
                      description: "An existing PersistentVolumeClaim in this namespace for the catalog pod to mount, in place of the one the operator provisions; the operator creates none when it is set."
                progress:
                  type: object
                  default: {}
                  description: "The claim the progress store runs on: who watched what, and how far. Each field defaults to the field of the same name under storage, so a Catalog that names neither keeps the store on the catalog's class at the catalog's size."
                  properties:
                    size:
                      type: string
                      description: "The size of the progress claim, in a binary unit such as 256Mi. The progress rows are small next to the catalog, so a namespace that keeps both central stores on a durable class names a smaller size here. Omitted, the claim takes storage.size. A size change reaches a new claim and not a standing one, because a bound claim's spec is immutable; delete the standing claim and the next pass creates it at the new size."
                    storageClassName:
                      type: string
                      minLength: 1
                      description: "The StorageClass the progress claim binds to. Omitted, the claim takes storage.storageClassName, and when that is also omitted the cluster's default binds it."
                libraries:
                  type: object
                  default: {}
                  description: "The claims each Library's scan and enrichment Jobs run on. Each is a working copy of the whole catalog that a Job rebuilds from the catalog of record, so a namespace that keeps the catalog of record on a durable class keeps these on a node-local class such as local-path."
                  properties:
                    storageClassName:
                      type: string
                      minLength: 1
                      description: "The StorageClass a Library's scan and enrichment claims bind to. Omitted, they take storage.storageClassName, and when that is also omitted the cluster's default binds them. There is no size here: every agent holds the whole catalog, so both claims take storage.size."
                screens:
                  type: object
                  default: {}
                  description: "The settings every screen pod in the namespace takes."
                  properties:
                    storageClassName:
                      type: string
                      minLength: 1
                      description: "The StorageClass both of a screen's claims bind to. Omitted, the cluster's default binds them. A node-local class such as local-path is the right one, because a screen pod is already pinned to the machine that holds its display."
                    artCache:
                      type: object
                      default: {}
                      description: "The volume each screen's browser keeps its scaled art on: posters, backdrops, episode stills, logos, and headshots. A screen that restarts draws the wall from art it already scaled."
                      properties:
                        size:
                          type: string
                          default: 2Gi
                          description: "The size of each screen's art claim, in a binary unit such as 2Gi. The browser is told to keep 128 MiB under it. A size change reaches new screens and not standing ones, because a bound claim's spec is immutable; delete a standing screen's claim and the next pass creates it at the new size."
            status:
              type: object
              description: >-
                The cluster the Catalog stands, written only by the
                library operator.
              properties:
                members:
                  type: array
                  x-kubernetes-list-type: atomic
                  description: "The pods that are members of the namespace's catalog cluster: the catalog pod, the pods of the Jobs that are running, and the screen pods."
                  items:
                    type: string
                storageSize:
                  type: string
                  description: >-
                    The storage size the agents were given.
                screens:
                  type: array
                  x-kubernetes-list-type: atomic
                  description: "One entry per screen pod in the namespace, in Player order: the Player it draws for, the claim its catalog agent runs on, the claim its art cache is on, the node it runs on, and its phase. A screen whose namespace has no single Catalog runs on emptyDirs and names neither claim."
                  items:
                    type: object
                    properties:
                      player:
                        type: string
                        description: "The Player the screen draws for."
                      claim:
                        type: string
                        description: "The claim the screen's catalog agent runs on, or empty for a screen on an emptyDir."
                      artClaim:
                        type: string
                        description: "The claim the screen's art cache is on, or empty for a screen on an emptyDir."
                      node:
                        type: string
                        description: "The node the screen pod runs on, which is the node both of its claims are bound to."
                      phase:
                        type: string
                        description: "The screen pod's phase, as the kubelet reports it."
                conditions:
                  type: array
                  description: "The typed observations the operator keeps on this Catalog, in the standard Kubernetes form; Ready is True when the catalog pod runs with every container ready, and False with the reason PodPending, PodFailed, or ManyCatalogs."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: >-
                          The check this entry reports, in CamelCase. It
                          is the key of this list.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: >-
                          The verdict. True is the good verdict, and
                          Unknown means the operator cannot tell yet.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The metadata.generation this condition judged.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: >-
                          One CamelCase word for why the condition holds
                          this verdict, meant for a program to match on.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The same answer in a sentence a person reads.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When the verdict last changed. It moves only
                          when the status flips.
