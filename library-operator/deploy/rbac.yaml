# The operator's identity in the cluster, and deliberately nothing
# more. It reads libraries and catalogs, writes their statuses, reads
# the storage behind each library, provisions the catalog claim each
# scanner pod mounts, creates the scanner pod each library becomes, and
# stands the catalog Service and EndpointSlice of each namespace that
# holds a Catalog. It deletes a scanner pod only to replace a stale
# one, whose template hash no longer matches what the pass builds.
# Every other teardown is the garbage collector's, through the
# ownerReferences the pod, the catalog claim, and the two catalog
# objects carry. It deletes no object a person created. Every grant is
# cluster-wide, because a Library can be in any namespace.
#
# The operator also holds a finalizer on every Library, so a delete
# waits on a cleanup pod that takes the departed library's rows out
# of the namespace's catalog. The finalizer is why libraries carry
# patch below, and the departure is the one reason beyond a stale
# template that the operator deletes a pod.
#
# It also stands one Service per Library, over that Library's scanner
# pod, which is the address the scanner's webhook answers on.
#
# it also reads the Players media-operator publishes, and stands one
# screen pod for each Player that names it as the idle controller. It writes
# no Player. A screen pod is deleted for a third reason beyond a stale
# template and a departure: the Player it stands for named another idle
# controller, or none.
#
# The scanner pods and the screen pods hold no credential of their own.
# A scanner reports over the bus, and the operator writes what it
# reports. A screen asks over the bus, and the operator creates the
# Play it asked for. So nothing in this file grants a pod anything.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: library-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: library-operator
rules:
  # The libraries, across every namespace, because a cluster keeps its
  # media in whatever namespace it likes and the operator is one
  # Deployment for the cluster. The watch is the wake signal; every
  # pass re-reads with a list. A person declares a Library and the
  # operator never edits one: the patch is for the finalizer list
  # alone, sent as a merge patch so a person's own fields on the
  # Library survive the write. The finalizer holds a deleted Library
  # open until its rows are out of every surviving agent's catalog.
  # There is no update verb, because nothing here rewrites a spec.
  - apiGroups: [library.liken.sh]
    resources: [libraries]
    verbs: [get, list, watch, patch]
  # Only the status half. The API server's subresource split is what
  # keeps this operator from ever rewriting a spec a person declared.
  - apiGroups: [library.liken.sh]
    resources: [libraries/status]
    verbs: [update]
  # The Catalogs, across every namespace, on the same terms as the
  # libraries: the watch is the wake signal, and every pass re-reads
  # with a list. Read-only, and only the status half is written.
  - apiGroups: [library.liken.sh]
    resources: [catalogs]
    verbs: [get, list, watch]
  - apiGroups: [library.liken.sh]
    resources: [catalogs/status]
    verbs: [update]
  # The Players, across every namespace, read-only. media-operator owns
  # them and writes them; this operator reads status.idle and writes no Player
  # at all. It stands a screen pod for a Player whose status.idle.controller
  # names it, and takes that pod down when the name changes. The watch is the
  # wake signal, and every pass re-reads with a list.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get, list, watch]
  # The Plays this operator creates, one per request a screen publishes
  # on the bus. Create alone: the operator never reads, edits, or
  # deletes a Play, because media-operator owns its whole life once it
  # exists. The grant is cluster-wide because a Play is created in the
  # Player's namespace, and a Player can be in any namespace.
  - apiGroups: [media.liken.sh]
    resources: [plays]
    verbs: [create]
  # The media claim each Library names, read by name to learn whether it
  # is bound and which volume it is bound to. The catalog claim each
  # scanner pod mounts, created once per Library and owned by it, so the
  # garbage collector removes it with the Library. There is no update:
  # a claim's spec is immutable once it binds, so the operator
  # provisions the catalog claim and never rewrites it. There is no
  # delete: the ownerReference is the whole teardown.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  # The volume behind that claim, read by name for its source: an NFS
  # server and export, or the name of whatever other key serves it.
  # Playing a title from the library needs that, so the operator reads
  # it once per pass and reports it in the status. PersistentVolumes
  # are cluster-scoped, which is why this rule needs a ClusterRole.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
  # The pods rule below also covers the screen pods: one per delegated
  # Player, created, read back, and deleted on the same terms as a scanner
  # pod. The delete covers the rebuild of a stale template and the screen of a
  # Player that named another idle controller.
  # The scanner pods: created once per Library and read back on every
  # pass. The delete verb covers two deletes: the rebuild of a pod whose
  # template hash no longer matches, and the stop of a Library that no
  # longer stands a scanner. The list and watch are cluster-scoped, because a Library
  # lives in any namespace, and the watch wakes the loop when a scanner
  # pod becomes ready or Kubernetes removes one.
  #
  # A deleting Library stands a cleanup pod, which this rule also
  # covers: the operator creates, reads, and deletes it on the same
  # terms. The departure's two deletes are the stop of the scanner
  # before the sweep, and the retirement of the cleanup pod when the
  # deletes have reached every surviving peer.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  # Two Services, each read by name. The headless catalog Service of
  # each namespace that holds a Catalog, and the webhook Service over
  # each Library's scanner pod. The grant is cluster-wide because either
  # can be in any namespace, and the operator is one Deployment for the
  # cluster. There is no list and no watch: both are read by name, in
  # the namespaces the Catalog and Library lists already named. There is
  # no delete verb: each Service is owned by the object it belongs to,
  # and the garbage collector removes it with that object.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, update]
  # The EndpointSlice behind the catalog Service, on the same terms
  # and for the same reasons. There is one per namespace that holds a
  # Catalog, and the operator writes it because that Service names no
  # selector. The webhook Service names one, so the API server writes
  # its endpoints, and this rule is not for it.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: library-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: library-operator
subjects:
  - kind: ServiceAccount
    name: library-operator
    namespace: liken-system
