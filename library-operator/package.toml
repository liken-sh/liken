# The operator that catalogs a media library and serves the media
# browser.
[package]
name = "library-operator"
license = "MIT"

[depends]
components = ["brand", "ffmpeg", "kubernetes", "media-screen", "vulkan"]

[docs]
prefix = "library"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The media browser, under cage on Mesa's software Vulkan driver, the
# same as media-operator's screens.
[[jobs]]
name = "rust"
toolchain = "rust"
dir = "media-browser"
run = "make test"
timeout = 45
env = { CARGO_INCREMENTAL = "0", WLR_RENDERER = "pixman" }
apt = ["cage", "wlr-randr", "mesa-vulkan-drivers", "libvulkan1", "libwayland-client0", "libxkbcommon0"]
coverage = ["coverage-media-browser.xml"]

# `appearances`, the tool that finds the credited people on screen. Its
# unit tests load no model, so the job needs no OpenVINO and no GPU.
# The crate has no coverage floor yet.
[[jobs]]
name = "rust-appearances"
toolchain = "rust"
dir = "appearances"
run = "make test"
timeout = 30
env = { CARGO_INCREMENTAL = "0" }

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go and rust jobs run the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy", "cargo-fmt-media-browser"]

[outputs]
deploy = "deploy"

# Every image that builds from this module's go.mod takes the shared
# kubernetes module as a build context, because go.mod replaces it with
# ../kubernetes. The media browser and Corrosion images build from their
# own directories alone.
[[outputs.images]]
name = "library-operator"
file = "Dockerfile"
contexts = { kubernetes = "kubernetes" }

[[outputs.images]]
name = "library-operator-ffmpeg"
file = "Dockerfile.ffmpeg"
contexts = { kubernetes = "kubernetes" }
smoke = "library-operator/smoke/library-operator-ffmpeg.sh"

[[outputs.images]]
name = "library-operator-media-browser"
context = "media-browser"
file = "media-browser/Dockerfile"
contexts = { brand = "brand", media-screen = "media-screen" }
smoke = "library-operator/smoke/library-operator-media-browser.sh"

# The image of `appearances` builds on the ffmpeg base and pulls the face
# models as an OCI artifact by digest. It carries the pod program beside
# the tool, so it builds from this module's Go files like the ffmpeg
# image, and takes the crate's directory as a named context.
[[outputs.images]]
name = "library-operator-appearances"
file = "Dockerfile.appearances"
contexts = { kubernetes = "kubernetes", appearances = "library-operator/appearances" }
smoke = "library-operator/smoke/library-operator-appearances.sh"

[[outputs.images]]
name = "library-operator-corrosion"
context = "corrosion"
file = "corrosion/Dockerfile"
smoke = "library-operator/smoke/library-operator-corrosion.sh"

# The CLI image carries the same version as the operator, so the base
# binary pulls a CLI that never drifts from the operator it faces. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "library-operator-cli"
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes" }
