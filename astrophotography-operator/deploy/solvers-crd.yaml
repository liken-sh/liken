# A `Solver` points at a claim that holds astrometry.net's index files.
# `astrophotography-operator` runs one pod for it that plate-solves the
# frames of the targets in the same namespace that use it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: solvers.astrophotography.liken.sh
spec:
  group: astrophotography.liken.sh
  names:
    kind: Solver
    listKind: SolverList
    plural: solvers
    singular: solver
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Reason
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].reason'
        - name: Indexes
          type: string
          jsonPath: .status.series
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Host
          type: string
          jsonPath: .status.endpoint.host
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A `Solver` plate-solves the frames of the targets in its
            namespace whose `spec.centering.solver` is the name of this
            `Solver`. `astrophotography-operator` runs one astrometry.net
            pod that reads the index files from the claim in
            `spec.indexFiles`, and a `Service` for that pod. A worker
            beside each reservation's outbox finds the stars in each
            frame, so the solver receives a list of stars and never the
            frame itself.
          required: [spec]
          # The Deployment and the Service of a Solver are named
          # <name>-solver, and a Service name can have at most 63
          # characters.
          x-kubernetes-validations:
            - rule: "self.metadata.name.size() <= 56"
              message: "a Solver's name is at most 56 characters, because its Service is named <name>-solver"
          properties:
            spec:
              type: object
              required: [indexFiles]
              description: "The claim that holds the index files, and how the solver searches."
              properties:
                indexFiles:
                  type: object
                  required: [claimName]
                  description: >-
                    A claim, and a directory in it, that holds
                    astrometry.net's index files. The solver reads every
                    `index-*.fits` file in the directory and watches the
                    directory, so it loads a file that you copy in later
                    when the writer closes the file. The watch does not
                    report a write that another node makes to a network
                    file system, such as NFS. After such a write, restart
                    the solver's `Deployment`.
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: >-
                        The name of a `PersistentVolumeClaim` in the
                        solver's namespace. The solver's pod mounts it
                        read-only.
                    path:
                      type: string
                      maxLength: 1024
                      default: ""
                      description: >-
                        The directory in the claim that holds the index
                        files. The default is the root of the claim.
                      x-kubernetes-validations:
                        - rule: "!self.startsWith('/') && !self.matches('(^|/)[.][.](/|$)')"
                          message: "path is a directory inside the claim, so it cannot start with '/' or hold '..'"
                search:
                  type: object
                  default: {}
                  description: >-
                    How far from the expected center the solver searches.
                    The operator first asks for a search within the first
                    radius around the position where the frame should
                    point. When the frame does not solve, it tries each
                    next radius, and then the whole sky when `blind` is
                    `true`. A frame that cannot be solved uses up to 60
                    seconds of the solver's CPU time in each attempt,
                    which delays the solves of every other telescope.
                  properties:
                    radii:
                      type: array
                      minItems: 1
                      maxItems: 8
                      default: [5, 10]
                      description: >-
                        The search radius of each attempt, in degrees, in
                        the order that the operator tries them. The default
                        is `[5, 10]`.
                      items:
                        type: number
                        minimum: 0
                        exclusiveMinimum: true
                        maximum: 180
                        description: "A radius in degrees, greater than 0 and at most 180."
                    blind:
                      type: boolean
                      default: true
                      description: >-
                        Whether to search the whole sky after the attempt
                        with the last radius fails. The default is `true`.
            status:
              type: object
              description: "The state that `astrophotography-operator` reports. Only the operator writes it."
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The `metadata.generation` of the spec that the status reflects."
                endpoint:
                  type: object
                  required: [service, host, port]
                  description: "The solver's `Service`. It is set while the pod is ready."
                  properties:
                    service:
                      type: string
                      description: "The name of the `Service`."
                    host:
                      type: string
                      description: "The DNS name of the `Service` in the cluster."
                    port:
                      type: integer
                      format: int32
                      description: "The `Service`'s port."
                indexes:
                  type: array
                  description: >-
                    The series of index files in the claim. The solver
                    reads the series from the header of each file, and
                    updates this list when a file is added to or removed
                    from the directory.
                  items:
                    type: object
                    required: [id, files, scaleArcmin]
                    description: "One series of index files and its files in the claim."
                    properties:
                      id:
                        type: integer
                        format: int32
                        description: "The series number, such as `4207`, from the `INDEXID` header of each file."
                      files:
                        type: integer
                        format: int32
                        description: "The number of files of the series in the claim."
                      scaleArcmin:
                        type: object
                        required: [low, high]
                        description: "The range of sizes of the star quads in the series, in arcminutes."
                        properties:
                          low:
                            type: number
                            description: "The smallest size, in arcminutes."
                          high:
                            type: number
                            description: "The largest size, in arcminutes."
                series:
                  type: string
                  description: >-
                    The series in `status.indexes`, joined by commas,
                    such as `4207,4208`. The `INDEXES` column of
                    `kubectl get` shows this field.
                conditions:
                  type: array
                  description: >-
                    `Ready` is `True` with the reason `Loaded` when the
                    solver's pod is ready and has loaded at least one
                    index file. Otherwise it is `False` with the reason
                    `ClaimMissing`, `NoIndexFiles`, or `PodNotReady`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    description: >-
                      One condition, in the shape of `metav1.Condition`.
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                        description: "The type of the condition, such as `Ready`."
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                        description: >-
                          Whether the condition is met: `True`, `False`, or
                          `Unknown`.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` of the spec that the
                          condition reflects.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        description: "A one-word CamelCase reason for the status."
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          A message for a person that gives details of the
                          reason. It can be empty.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When `status` last changed. A write that sets the
                          same `status` keeps this time.
