# The operator's service account and permissions. The operator reads
# Targets and Solvers in every namespace, reads the observatory
# resources that a Reservation it holds refers to, and runs each worker,
# solver, and promotion Job in the namespace of the resource it serves.
# So it needs a ClusterRole. It never writes the spec or status of
# observatory-operator's resources.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astrophotography-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astrophotography-operator
rules:
  # The operator watches these kinds: the Reservations that name it as
  # holder, and the observatory, telescope, horizon, optics, devices,
  # and guider that such a Reservation refers to. get reads one object
  # again after a write fails with a conflict.
  - apiGroups: [observatory.liken.sh]
    resources:
      - reservations
      - observatories
      - telescopes
      - horizons
      - opticaltrains
      - opticaltubes
      - mounts
      - cameras
      - filterwheels
      - focusers
      - guiders
    verbs: [get, list, watch]
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets, solvers]
    verbs: [get, list, watch]
  # Merge patches add and remove the finalizer that blocks the deletion
  # of a Target while its frames are still in an outbox, and remove the
  # retry annotation after the operator has acted on it.
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets]
    verbs: [patch]
  # The operator writes status with a PUT to the status subresource,
  # which needs the update verb. It never writes a spec.
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets/status, solvers/status]
    verbs: [update]
  # The worker for each Reservation the operator holds and the pod for
  # each Solver. Each is a Deployment with a Service, in the namespace
  # of its resource.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, delete]
  # The promotion Jobs, and the pods. The operator reads a promotion's
  # report and the reason a worker is waiting from pod status. It reads
  # its own pod for its image, which the promotion Jobs run and whose
  # tag the worker image shares.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  # The outbox and archive claims. A merge patch adds and removes the
  # finalizer that keeps an outbox claim until its frames are promoted.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  # Events for each condition transition and for the operator's actions
  # on a Reservation. An Event that repeats within 10 minutes is patched
  # with a new count.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astrophotography-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: astrophotography-operator
subjects:
  - kind: ServiceAccount
    name: astrophotography-operator
    namespace: liken-system
---
# The Lease for leader election (leader.go), so that only one copy of
# the operator acts. client-go's election reads the Lease with get, and
# takes, renews, and releases it with update. The Lease is in the
# operator's own namespace, so a namespaced Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astrophotography-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [astrophotography-operator]
    verbs: [get, update]
  # create has no resourceNames, because RBAC cannot match the name of
  # an object that does not exist yet. The first copy to start creates
  # the Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astrophotography-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astrophotography-operator-lease
subjects:
  - kind: ServiceAccount
    name: astrophotography-operator
    namespace: liken-system
