# The operator's identity. It reads the Targets and Solvers in every
# namespace, and the observatory resources that a held Reservation
# names, and it runs each worker, solver, and promotion Job in the
# namespace of the resource it serves, so a ClusterRole grants what it
# needs. It writes no spec and no status of observatory-operator's
# resources.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astrophotography-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: astrophotography-operator
rules:
  # A watch of each kind that the runner reads: the Reservations that
  # name this operator as their holder, the site, the telescope and its
  # optics, the devices it drives, and the guider. get reads one again
  # after a write that met a conflict.
  - apiGroups: [observatory.liken.sh]
    resources:
      - reservations
      - observatories
      - telescopes
      - opticaltrains
      - opticaltubes
      - mounts
      - cameras
      - filterwheels
      - focusers
      - guiders
    verbs: [get, list, watch]
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets, solvers]
    verbs: [get, list, watch]
  # A merge patch adds and removes the finalizer that holds a delete of
  # a Target while frames of it wait in an outbox.
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets]
    verbs: [patch]
  # The operator writes each status with a PUT to the status
  # subresource, which is the update verb, and never writes a spec.
  - apiGroups: [astrophotography.liken.sh]
    resources: [targets/status, solvers/status]
    verbs: [update]
  # The worker of each held reservation and the pod of each Solver, each
  # a Deployment with a Service in the namespace of its resource.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, delete]
  # The promotion Jobs, the pods whose status holds a promotion's
  # report and the reason a worker waits, and the operator's own pod,
  # whose image the promotion Jobs run.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  # The outbox claims and the archive claims. A merge patch adds and
  # removes the finalizer that keeps an outbox until its frames are
  # promoted.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  # The Events of each resource's transitions and of the runner's
  # actions on a Reservation. A repeat of an Event within 10 minutes
  # patches its count.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: astrophotography-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: astrophotography-operator
subjects:
  - kind: ServiceAccount
    name: astrophotography-operator
    namespace: liken-system
---
# The Lease that elects the one copy of the operator that acts
# (leader.go). client-go's election reads the Lease with a get, takes
# and renews it with an update, and releases it with an update. A
# namespaced Role, because the Lease is in the operator's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astrophotography-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [astrophotography-operator]
    verbs: [get, update]
  # create carries no resourceNames, because RBAC cannot read a name off
  # a create. The first copy to start creates the Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astrophotography-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: astrophotography-operator-lease
subjects:
  - kind: ServiceAccount
    name: astrophotography-operator
    namespace: liken-system
