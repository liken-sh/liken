# The kustomize base for astrophotography-operator: the resource
# definitions of the astrophotography.liken.sh group, and the operator
# with its RBAC, in liken-system. The base creates no namespace for the
# resources. Apply your Targets and Solvers in the namespace of your
# observatory, beside observatory-operator's resources, whose base this
# operator needs.
#
# This base is for the cluster owner to take. `liken` does not apply it
# and does not name it. Take it through your own GitOps with patches of
# your own, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is set with a transformer, not with the top-level
# namespace field, because unsetOnly keeps an object that states its
# own namespace where it belongs. Every base sets it the same way.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - targets-crd.yaml
  - solvers-crd.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: astrophotography-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/astrophotography-operator
    newTag: latest
