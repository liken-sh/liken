# The kustomize base for astrophotography-operator. It holds the CRDs of
# the astrophotography.liken.sh group, and the operator with its RBAC in
# liken-system. It creates no namespace for the resources: apply your
# `Target`s and `Solver`s in the namespace of your observatory, next to
# observatory-operator's resources. The operator needs that operator's
# base too.
#
# `liken` does not apply this base. You apply it yourself, for example
# through your own GitOps with your own patches, or you read it and write
# your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The top-level namespace field would overwrite the namespace of an
# object that sets its own. This NamespaceTransformer with unsetOnly
# sets liken-system only on objects that have no namespace.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - targets-crd.yaml
  - solvers-crd.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: astrophotography-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/astrophotography-operator
    newTag: latest
