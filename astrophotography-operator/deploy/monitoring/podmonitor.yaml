# Only the operator pod that holds the Lease serves /metrics, so
# during a rollout the scrapes of the waiting pod fail until it
# acquires the Lease. The relabeling adds the pod's node name as the
# `node` label, so a dashboard can select metrics by node.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: astrophotography-operator
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: astrophotography-operator
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
