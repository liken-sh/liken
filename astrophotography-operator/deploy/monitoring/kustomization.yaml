# Optional monitoring for the operator: a PodMonitor and a dashboard
# ConfigMap, with no change to the base. It follows
# plans/completed/65-prometheus-metrics.md at the top of the
# repository. A cluster that runs prometheus-operator adds it beside the
# base:
#
#   resources:
#     - https://github.com/liken-sh/liken//astrophotography-operator/deploy?ref=<version>
#   components:
#     - https://github.com/liken-sh/liken//astrophotography-operator/deploy/monitoring?ref=<version>
#
# This Component sets no top-level namespace, because that would move
# the dashboard ConfigMap into liken-system, where the
# kube-prometheus-stack sidecar does not look for dashboards. The
# PodMonitor sets its own namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The kube-prometheus-stack sidecar beside Grafana loads every
# ConfigMap labeled grafana_dashboard: "1". disableNameSuffixHash keeps
# the name stable, so an edit replaces the ConfigMap and Grafana does
# not load the old and new versions together.
configMapGenerator:
  - name: astrophotography-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/astrophotography-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
