# The monitoring component: this operator's half of the contract in
# plans/completed/65-prometheus-metrics.md at the top of the
# repository. It adds one PodMonitor and a dashboard ConfigMap, and
# changes nothing in the base, so a cluster owner with no
# prometheus-operator never takes this directory.
#
# An owner who runs the prometheus-operator adds it beside the base:
#
#   resources:
#     - https://github.com/liken-sh/liken//astrophotography-operator/deploy?ref=<version>
#   components:
#     - https://github.com/liken-sh/liken//astrophotography-operator/deploy/monitoring?ref=<version>
#
# This Component sets no top-level namespace, because that would move
# the dashboard ConfigMap into liken-system too, where the
# kube-prometheus-stack sidecar that loads it does not look. The
# PodMonitor names its own namespace instead.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The dashboard is a ConfigMap with the grafana_dashboard: "1" label.
# The kube-prometheus-stack runs a sidecar beside Grafana that loads
# every ConfigMap with that label, so the dashboard needs no Grafana
# API call and no provisioning file. disableNameSuffixHash keeps the
# name stable, so an edit replaces the ConfigMap in place and Grafana
# does not load the old version beside the new one.
configMapGenerator:
  - name: astrophotography-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/astrophotography-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
