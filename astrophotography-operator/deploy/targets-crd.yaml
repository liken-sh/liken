# A `Target` is an object in the sky and the frames to take of it.
# Any `Reservation` in the same namespace whose `spec.holder` is
# `astrophotography-operator` can image it, so one target can take many
# nights.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: targets.astrophotography.liken.sh
spec:
  group: astrophotography.liken.sh
  names:
    kind: Target
    listKind: TargetList
    plural: targets
    singular: target
    categories: [astro]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Object
          type: string
          jsonPath: .spec.object
        - name: Progress
          type: string
          jsonPath: .status.progress
        - name: Reservation
          type: string
          jsonPath: .status.reservation
        - name: Complete
          type: string
          jsonPath: '.status.conditions[?(@.type=="Complete")].status'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Imaging
          type: string
          jsonPath: '.status.conditions[?(@.type=="Imaging")].reason'
          priority: 1
        - name: Priority
          type: integer
          jsonPath: .spec.priority
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A `Target` is an object in the sky and the frames to take of
            it, written as sequences of a filter, an exposure, and a
            count. `astrophotography-operator` images the target during
            each `Reservation` in the same namespace whose `spec.holder`
            is `astrophotography-operator`, and then moves each frame to
            the claim in `spec.archive`. The target stays until you
            delete it, and `status.sequences` keeps its progress from
            one night to the next. The operator adds the finalizer
            `astrophotography.liken.sh/frames` to each target. When you
            delete a target that still has frames in an outbox, the
            delete waits until promotion has moved those frames to the
            archive.
          required: [spec]
          properties:
            spec:
              type: object
              required: [object, coordinates, sequences, archive]
              description: "The object to image, its coordinates, the frames to take, and where to store them."
              properties:
                object:
                  type: string
                  minLength: 1
                  maxLength: 68
                  description: >-
                    The name of the object, such as `M42`. The operator
                    writes it to the `OBJECT` keyword in each frame's FITS
                    header, and `{object}` in `spec.archive.format` expands
                    to it in each file name. It can hold only printable
                    ASCII characters and no `/`.
                  x-kubernetes-validations:
                    - rule: "self.matches('^[ -~]*$')"
                      message: "FITS allows only the printable ASCII characters in a header"
                    - rule: "!self.contains('/')"
                      message: "the camera's driver writes each '/' in a value as '\\', so the header would not hold the object's name"
                coordinates:
                  type: object
                  required: [ra, dec]
                  description: >-
                    Where the object is, in J2000 (ICRS), the form that
                    catalogs such as SIMBAD and KStars print. Before each
                    slew, the operator converts the coordinates to the
                    equinox of the current date, because an INDI mount
                    takes `EQUATORIAL_EOD_COORD` in that equinox.
                  properties:
                    ra:
                      type: string
                      maxLength: 32
                      description: >-
                        The right ascension in hours, as `HH:MM:SS.s`,
                        such as `05:35:17.3`.
                      x-kubernetes-validations:
                        - rule: "self.matches('^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]([.][0-9]+)?$')"
                          message: "ra is hours, minutes, and seconds from 00:00:00 to 23:59:59.9, such as 05:35:17.3"
                    dec:
                      type: string
                      maxLength: 32
                      description: >-
                        The declination in degrees, as `±DD:MM:SS.s`, such
                        as `-05:23:28`. A declination north of the equator
                        can leave out the `+`.
                      x-kubernetes-validations:
                        - rule: "self.matches('^[+-]?([0-8][0-9]:[0-5][0-9]:[0-5][0-9]([.][0-9]+)?|90:00:00([.]0+)?)$')"
                          message: "dec is degrees, minutes, and seconds from -90:00:00 to +90:00:00, such as -05:23:28"
                priority:
                  type: integer
                  format: int32
                  default: 0
                  description: >-
                    When a reservation can image several targets, it picks
                    the one with the highest priority. Among targets of
                    equal priority, it picks the oldest, and then the
                    first by name. Optional. The default is `0`.
                suspend:
                  type: boolean
                  description: >-
                    When `true`, no reservation images the target, and the
                    target keeps its progress. This works like
                    `spec.suspend` of a `Job`. Optional. The default is
                    `false`.
                opticalTrain:
                  type: string
                  maxLength: 253
                  description: >-
                    The name of the `OpticalTrain` to image through.
                    Optional. A target with an optical train is imaged
                    only on that train's telescope. A target without one
                    is imaged on any telescope whose session has exactly
                    one imaging camera.
                sequences:
                  type: array
                  minItems: 1
                  maxItems: 64
                  description: >-
                    The frames to take. The operator finishes the first
                    sequence that still needs frames before it starts the
                    next one, because each filter change needs a refocus.
                    A frame
                    counts toward a sequence when its header has the same
                    filter, exposure, binning, gain, and offset. When you
                    edit this list, frames that still match a sequence
                    stay counted.
                  items:
                    type: object
                    required: [exposure, count]
                    description: "One kind of frame and how many frames of it to take."
                    properties:
                      filter:
                        type: string
                        minLength: 1
                        maxLength: 64
                        description: >-
                          A filter name from the filter wheel's
                          `FILTER_NAME` property, such as `Luminance`. The
                          driver writes it to the `FILTER` keyword.
                          Optional. Without it, the operator does not
                          change the filter.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
                      exposure:
                        type: string
                        maxLength: 32
                        description: >-
                          The length of each frame, as a duration such as
                          `300s` or `500ms`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^([0-9]+([.][0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                            message: "exposure must be a positive duration, such as 300s or 500ms"
                      count:
                        type: integer
                        format: int32
                        minimum: 1
                        description: "The number of frames to take."
                      binning:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 16
                        description: >-
                          The binning on both axes. The operator writes it
                          to the camera's `CCD_BINNING` property. Optional.
                          Without it, the camera keeps its current binning.
                      gain:
                        type: integer
                        format: int32
                        minimum: 0
                        description: >-
                          The gain, in the camera's own units. The operator
                          writes it to the camera's `CCD_GAIN` property.
                          Optional. Without it, the camera keeps its
                          current gain.
                      offset:
                        type: integer
                        format: int32
                        minimum: 0
                        description: >-
                          The offset, in the camera's own units. The
                          operator writes it to the camera's `CCD_OFFSET`
                          property. Optional. Without it, the camera keeps
                          its current offset.
                dither:
                  type: object
                  required: [every, pixels]
                  description: >-
                    How PHD2 shifts its lock position between frames, so
                    that fixed-pattern noise of the sensor does not add up
                    when the frames are stacked. Optional. Without
                    `dither`, the operator does not dither.
                  properties:
                    every:
                      type: integer
                      format: int32
                      minimum: 1
                      description: "The number of frames to take between dithers."
                    pixels:
                      type: number
                      minimum: 0
                      exclusiveMinimum: true
                      maximum: 100
                      description: >-
                        The largest distance PHD2 moves the lock position
                        in one dither, in pixels of the guide camera.
                    raOnly:
                      type: boolean
                      description: >-
                        When `true`, PHD2 dithers in right ascension only.
                        Use it for a mount that guides in right ascension
                        only. Optional. The default is `false`.
                centering:
                  type: object
                  required: [solver]
                  description: >-
                    How the operator centers the target after a slew. It
                    takes a frame, plate-solves it with the `Solver`,
                    syncs the mount to the solved position, and slews
                    again until the error is within `tolerance`. Optional.
                    Without `centering`, the operator slews and does not
                    solve.
                  properties:
                    solver:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "The name of a `Solver` in the target's namespace."
                    tolerance:
                      type: number
                      minimum: 0
                      exclusiveMinimum: true
                      default: 30
                      description: >-
                        The largest error that still counts as centered, in
                        arcseconds. The error is the angle between the
                        solved center of the frame and `spec.coordinates`.
                        The default is `30`.
                    exposure:
                      type: string
                      maxLength: 32
                      default: 5s
                      description: >-
                        The exposure of a centering frame, as a duration.
                        When a frame does not solve, the operator takes one
                        more frame with twice this exposure. The default is
                        `5s`.
                      x-kubernetes-validations:
                        - rule: "self.matches('^([0-9]+([.][0-9]+)?(ms|s|m|h))+$') && duration(self) > duration('0s')"
                          message: "exposure must be a positive duration, such as 5s"
                    filter:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: >-
                        The filter for centering frames. Optional. The
                        default is the filter of the first sequence in
                        `spec.sequences`.
                      x-kubernetes-validations:
                        - rule: "self.matches('^[ -~]*$')"
                          message: "FITS allows only the printable ASCII characters in a header"
                    attempts:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 20
                      default: 5
                      description: >-
                        The maximum number of rounds of solving and
                        slewing. When the target is still not centered
                        after the last round, the operator sets the
                        `Imaging` reason `CenteringFailed`. The default is
                        `5`.
                archive:
                  type: object
                  required: [claimName]
                  description: >-
                    Where to store the frames: a claim, a directory in the
                    claim, and a file name pattern. The camera first writes
                    each frame into the reservation's outbox under its
                    final name, and the operator then moves the frame
                    here. The operator also writes a catalog of the frames
                    to `<path>/catalog/<Target>.jsonl`, where `<Target>` is
                    the name of the target.
                  properties:
                    claimName:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: >-
                        The name of a `PersistentVolumeClaim` in the
                        target's namespace. It can be the reservation's
                        outbox claim, and then the operator moves each
                        frame with a rename. The frame counts in
                        `status.sequences` come from the catalog in this
                        claim, so you cannot change it after you create
                        the target. To store frames in another claim,
                        create another `Target`.
                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "spec.archive.claimName cannot change; create another Target"
                    path:
                      type: string
                      maxLength: 1024
                      default: ""
                      description: >-
                        A directory in the claim, such as `astro`. The
                        operator stores the frames and the catalog under
                        it. The default is the root of the claim.
                      x-kubernetes-validations:
                        - rule: "!self.startsWith('/') && !self.matches('(^|/)[.][.](/|$)')"
                          message: "path is a directory inside the claim, so it cannot start with '/' or hold '..'"
                    format:
                      type: string
                      minLength: 1
                      maxLength: 512
                      default: "{object}/{night}/{filter}/{object}_{filter}_{exposure}_{datetime}"
                      description: >-
                        The path of each frame's file, relative to `path`,
                        without an extension, because the camera driver adds
                        `.fits`. The pattern can use these tokens:
                        `{target}`, `{object}`, `{filter}`, `{exposure}`,
                        `{binning}`, `{gain}`, `{offset}`, `{camera}`,
                        `{telescope}`, `{train}`, `{reservation}`,
                        `{night}`, `{datetime}`, `{n}`, and `{frameid}`.
                        Any other text can use only letters, digits, `.`,
                        `_`, `+`, `-`, and `/`. When the pattern does not
                        contain `{frameid}`, the operator appends `_` and
                        the last 12 hexadecimal digits of the frame's
                        `FRAMEID`, so that each file name is unique. The default is
                        `{object}/{night}/{filter}/{object}_{filter}_{exposure}_{datetime}`.
                      x-kubernetes-validations:
                        - rule: "self.matches('^([A-Za-z0-9._+/-]|[{](target|object|filter|exposure|binning|gain|offset|camera|telescope|train|reservation|night|datetime|n|frameid)[}])+$')"
                          message: "format holds only known tokens, letters, digits, '.', '_', '+', '-', and '/'"
                        - rule: "!self.startsWith('/') && !self.startsWith('catalog/')"
                          message: "format is relative to path, and catalog/ holds the catalog"
                        - rule: "!self.contains('..')"
                          message: "format cannot hold '..', which would leave path"
                        - rule: "!self.contains('XXX') && !self.contains('ISO8601')"
                          message: "the camera's driver replaces XXX and ISO8601 in a file name, so format cannot hold them"
                    promotion:
                      type: string
                      enum: [Continuous, AfterReservation]
                      default: Continuous
                      description: >-
                        When the operator moves frames to the archive.
                        `Continuous` moves them during the night, so the
                        outbox stays small. `AfterReservation` moves them
                        when the reservation that took them ends, so the
                        copies do not load the network while the telescope
                        is imaging. The default is
                        `Continuous`.
                fitsKeywords:
                  type: array
                  maxItems: 64
                  description: >-
                    FITS header keywords to add to this target's frames,
                    such as `PROGRAM`. Optional. A keyword here replaces
                    the value and comment of a keyword with the same name
                    that the `Observatory`, `Telescope`, `Camera`, or
                    `Reservation` declares.
                    The API server rejects a keyword that the camera's
                    driver sets from its own measurements, such as
                    `EXPTIME`, and the keywords `OBJECT` and `FRAMEID`,
                    which this operator writes.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, value]
                    description: "One keyword: its name, its value, and a comment."
                    properties:
                      name:
                        type: string
                        maxLength: 8
                        description: >-
                          The keyword, such as `OBSERVER`: 1 to 8 of the
                          capital letters `A` to `Z`, the digits, `-`,
                          and `_`. `INSTRUME` and `TELESCOP` are
                          allowed, because the driver fills them with
                          the names of INDI devices, such as `CCD
                          Simulator`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[A-Z0-9_-]{1,8}$')"
                            message: "a FITS keyword name is 1 to 8 of the capital letters A to Z, the digits, '-', and '_'"
                          - rule: "!(self in ['SIMPLE', 'BITPIX', 'NAXIS', 'NAXIS1', 'NAXIS2', 'EXTEND', 'BZERO', 'BSCALE', 'ROWORDER', 'EXPTIME', 'CCD-TEMP', 'PIXSIZE1', 'PIXSIZE2', 'XBINNING', 'YBINNING', 'XPIXSZ', 'YPIXSZ', 'FRAME', 'IMAGETYP', 'FILTER', 'FOCALLEN', 'APTDIA', 'ROTATANG', 'FOCUSPOS', 'FOCUSTEM', 'SCALE', 'SITELAT', 'SITELONG', 'AIRMASS', 'OBJCTAZ', 'OBJCTALT', 'OBJCTRA', 'OBJCTDEC', 'RA', 'DEC', 'PIERSIDE', 'EQUINOX', 'DATE-OBS', 'GAIN', 'OFFSET', 'DARKTIME', 'MPSAS', 'BAYERPAT', 'XBAYROFF', 'YBAYROFF', 'DATAMIN', 'DATAMAX', 'CTYPE1', 'CTYPE2', 'CRVAL1', 'CRVAL2', 'CRPIX1', 'CRPIX2', 'CDELT1', 'CDELT2', 'CROTA1', 'CROTA2', 'SECPIX1', 'SECPIX2', 'RADECSYS', 'FRAMEID', 'COMMENT', 'HISTORY', 'END', 'OBJECT'])"
                            messageExpression: >-
                              self + (self in ['COMMENT', 'HISTORY',
                              'END'] ? ' is a keyword that FITS reserves
                              for a card with no value' : self in
                              ['OBJECT', 'FRAMEID'] ? ' is a keyword
                              that astrophotography-operator writes into
                              every frame' : ' is a keyword that the
                              camera\'s driver writes from what it
                              measures, and a declared value would
                              replace the measured one')
                      value:
                        type: string
                        minLength: 1
                        maxLength: 68
                        description: >-
                          The value, at most 68 characters, the longest
                          text that one 80-column card holds. The driver
                          writes a value that reads as a number, such as
                          `2026` or `-4.5`, as a number, and any other
                          value as quoted text. A value cannot hold `/`,
                          because the driver writes each `/` in a value
                          as `\`.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
                          - rule: "!self.contains('/')"
                            message: "the camera's driver writes each '/' in a value as '\\', so the header would not hold the value declared"
                      comment:
                        type: string
                        maxLength: 47
                        description: >-
                          The comment that follows the value on the
                          card. Optional. At most 47 characters, which
                          fit beside a number.
                        x-kubernetes-validations:
                          - rule: "self.matches('^[ -~]*$')"
                            message: "FITS allows only the printable ASCII characters in a header"
            status:
              type: object
              description: "The state that `astrophotography-operator` reports. Only the operator writes it."
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The `metadata.generation` of the spec that the status reflects."
                progress:
                  type: string
                  description: >-
                    The number of frames in the archive over the number of
                    frames to take, summed over every sequence, such as
                    `37/180`.
                reservation:
                  type: string
                  description: >-
                    The `Reservation` that is imaging the target now. It
                    is empty while no reservation images the target. The
                    operator writes this field when a reservation claims
                    the target, so two telescopes never image the same
                    target at once.
                failed:
                  type: object
                  required: [reservation, observedGeneration]
                  description: >-
                    The `Reservation` that released the target after a
                    failure such as `NoFilter` or `SlewFailed`. That
                    reservation does not claim the
                    target again until the spec changes, even after the
                    operator restarts. Other reservations can still claim
                    the target. The operator clears this field when the
                    reservation ends.
                  properties:
                    reservation:
                      type: string
                      description: "The `Reservation` the target failed on."
                    observedGeneration:
                      type: integer
                      format: int64
                      description: >-
                        The `metadata.generation` of the spec that the
                        failure happened with. When you edit the spec,
                        `metadata.generation` changes and the reservation
                        can claim the target again.
                sequences:
                  type: array
                  description: >-
                    The sequences of `spec.sequences`, in the same order,
                    with their frame counts. The frames left to take in a
                    sequence are `count - archived - pending`. When
                    promotion falls behind, a target can end with more
                    frames than `spec` asks for, but never with fewer.
                  items:
                    type: object
                    required: [exposure, count, archived, pending]
                    description: "One sequence and its counts."
                    properties:
                      filter:
                        type: string
                        description: "The sequence's filter."
                      exposure:
                        type: string
                        description: "The sequence's exposure."
                      count:
                        type: integer
                        format: int32
                        description: "The number of frames to take."
                      binning:
                        type: integer
                        format: int32
                        description: "The sequence's binning."
                      gain:
                        type: integer
                        format: int32
                        description: "The sequence's gain."
                      offset:
                        type: integer
                        format: int32
                        description: "The sequence's offset."
                      archived:
                        type: integer
                        format: int32
                        description: >-
                          The number of frames of this sequence in the
                          archive's catalog, as the last promotion `Job`
                          reported it.
                      pending:
                        type: integer
                        format: int32
                        description: >-
                          The number of frames of this sequence that are in
                          an outbox and not yet in the archive.
                outboxes:
                  type: array
                  description: >-
                    The outbox claims that hold frames of this target that
                    are not yet in the archive. The operator keeps this
                    list so that it still finds those frames after their
                    reservation ends, and adds a finalizer to each claim
                    in it. A delete of the target waits until no listed
                    claim that still exists has `pending` frames.
                  items:
                    type: object
                    required: [claimName, pending]
                    description: "One outbox claim and the number of this target's frames in it."
                    properties:
                      claimName:
                        type: string
                        description: "The name of the `PersistentVolumeClaim`."
                      pending:
                        type: integer
                        format: int32
                        description: "The number of this target's frames in the claim."
                      left:
                        type: integer
                        format: int32
                        description: >-
                          The number of frames that the last promotion `Job`
                          for this claim left in the outbox, because they
                          were incomplete or could not be moved. The
                          operator starts a new `Job` only when `pending` is
                          greater than `left`, so a failed frame is not
                          tried again until a new frame arrives. After you
                          fix the cause, add the annotation
                          `astrophotography.liken.sh/retry` to the target.
                          When no promotion `Job` of the target is running,
                          the operator sets `left` to 0 and removes the
                          annotation, and the next `Job` tries the frames
                          again.
                promotion:
                  type: object
                  required: [applied]
                  description: >-
                    The state of the target's promotion `Job`s. Only one
                    `Job` of a target runs at a time, and each `Job`'s
                    name ends in a number that increases with each new
                    `Job`.
                  properties:
                    applied:
                      type: integer
                      format: int32
                      description: >-
                        The number in the name of the last promotion `Job`
                        whose report the operator has applied to this
                        status. The next `Job` gets the next number, and the
                        operator never applies the report of a `Job` with
                        this number or a lower one again.
                exposure:
                  type: object
                  required: [frameID, sequence, reservation, file, startTime]
                  description: >-
                    The frame that the camera is exposing now. The
                    operator writes it before the exposure starts and
                    clears it after the exposure ends. If the operator
                    restarts during an exposure, it uses this field to
                    count the frame once.
                  properties:
                    frameID:
                      type: string
                      description: "The frame's `FRAMEID`, a UUIDv7."
                    sequence:
                      type: integer
                      format: int32
                      description: "The index of the frame's sequence in `spec.sequences`, from 0."
                    reservation:
                      type: string
                      description: "The `Reservation` that is taking the frame."
                    file:
                      type: string
                      description: >-
                        The path of the frame's file, relative to the root
                        of the outbox, such as `east-main/east-tonight/m42/M42/2026-10-12/Luminance/M42_Luminance_300s_20261012T231506Z_4f2a9c01d3e7.fits`.
                    startTime:
                      type: string
                      format: date-time
                      description: "When the operator started the exposure."
                centering:
                  type: object
                  required: [reservation, time, rounds]
                  description: "The result of the last centering."
                  properties:
                    reservation:
                      type: string
                      description: "The `Reservation` that centered the target."
                    time:
                      type: string
                      format: date-time
                      description: "When the last round of centering ended."
                    rounds:
                      type: integer
                      format: int32
                      description: "The number of rounds of solving and slewing that the centering took."
                    solution:
                      type: object
                      required: [center, rotation, scale]
                      description: "Where the last solved frame points. Not set when no frame solved."
                      properties:
                        center:
                          type: object
                          required: [ra, dec]
                          description: "The center of the solved frame, in J2000."
                          properties:
                            ra:
                              type: string
                              description: "The right ascension in hours, as `HH:MM:SS.s`."
                            dec:
                              type: string
                              description: "The declination in degrees, as `±DD:MM:SS.s`."
                        rotation:
                          type: number
                          description: "The angle of the frame on the sky, in degrees."
                        scale:
                          type: number
                          description: "The plate scale, in arcseconds per pixel."
                    error:
                      type: number
                      description: >-
                        The angle between the solved center and
                        `spec.coordinates`, in arcseconds. Not set when no
                        frame solved.
                    roundErrors:
                      type: array
                      maxItems: 20
                      items:
                        type: number
                      description: >-
                        The `error` of each round whose frame solved, in
                        order, in arcseconds. The first value is the
                        distance between the target and where the slew
                        ended, before the first sync corrected the mount.
                conditions:
                  type: array
                  description: >-
                    `Complete` is `True` when every sequence has at least
                    its `count` of frames in the archive. `Imaging` is
                    `True` while a reservation images the target. Its
                    reason is the current step, `Slewing`, `Centering`,
                    `Guiding`, or `Exposing`, and its message gives the
                    reservation and the sequence. When `Imaging` is
                    `False`, its reason is one of `Waiting`, `Suspended`,
                    `SequencesDone`, `NoTrain`, `NoFilter`, `SlewFailed`,
                    `CenteringFailed`, `GuidingFailed`, `OutboxFull`,
                    `ExposureFailed`, `Deleting` while a delete of the
                    target waits for promotion, or `BelowHorizon` while
                    the target is below the telescope's horizon.
                    `ArchiveAvailable` is `True` when the last promotion
                    succeeded. It is `False`, with a reason such as
                    `ClaimMissing` or `NameConflict`, when the last
                    promotion failed.
