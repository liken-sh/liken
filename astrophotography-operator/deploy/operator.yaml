# The operator: one unprivileged Deployment in liken-system. It stores
# nothing outside the API server and the archives. A Target's status
# records the frame in progress, so a copy that takes over the Lease
# continues from it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrophotography-operator
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. When more pods run, only the pod that holds the
  # `astrophotography-operator` Lease acts (leader.go).
  replicas: 1
  selector:
    matchLabels:
      app: astrophotography-operator
  # A rollout starts the new pod before it stops the old one, so the new
  # image is pulled and the new pod waits for the Lease while the old
  # pod still leads.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: astrophotography-operator
    spec:
      serviceAccountName: astrophotography-operator
      # On shutdown the operator waits up to 15 s for a write in
      # flight, up to 5 s for the Event recorder to write its queue,
      # and up to 16 s to release the Lease. That can take 36 s, more
      # than the default grace period of 30 s.
      terminationGracePeriodSeconds: 60
      containers:
        - name: operator
          image: ghcr.io/liken-sh/astrophotography-operator:latest
          # The operator uses the namespace for the Lease and the pod name
          # as the identity that holds it. It exits when either is unset.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The address of the /metrics listener, which only the copy
            # that holds the Lease opens. deploy/monitoring scrapes it.
            # An empty value turns the listener off.
            - name: ASTROPHOTOGRAPHY_METRICS_ADDRESS
              value: :9200
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # The watch caches hold every Target and Solver, the
            # observatory resources the operator reads, and the objects
            # it creates.
            limits:
              memory: 256Mi
