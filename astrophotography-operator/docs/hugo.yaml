# The manual for astrophotography-operator, served at
# https://liken.sh/astrophotography/, with the theme in brand/ at the
# top of this repository.
baseURL: https://liken.sh/astrophotography/

# crdref writes a raw HTML span with an id on each field's row, so a
# link can point at one field. Goldmark drops raw HTML unless unsafe is
# set. That is safe because this repository writes everything the site
# renders.
markup:
  goldmark:
    renderer:
      unsafe: true
title: astrophotography-operator
# The theme is read from the repository root, so the site builds with
# the theme of its own commit.
themesDir: ../..
theme: brand

# The theme's navigation links to this repository, and the sidebar
# takes the project's name from the last segment of the URL.
params:
  repository: https://github.com/liken-sh/liken/tree/main/astrophotography-operator
  # Adds a footer link to /coverage.html, the coverage report that the
  # site serves.
  coverage: true

# The site has no taxonomies and no feeds. It keeps the sitemap.
disableKinds: [taxonomy, term, rss]

# Every page renders as HTML and as its Markdown source, for agents
# and scripts: /index.html and /index.md in the same directory. The
# theme writes the Markdown file only when the site declares this
# format (brand/theme.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests in deploy/ as raw YAML at
# /deploy/<file>.yaml. `kubectl apply -f` and a Kustomization can take
# those URLs, so an install needs no clone, and the site has no copy
# that can differ from the repository.
#
# A module mount replaces all of Hugo's default mounts, so the content
# mount is listed too. The theme's own mounts, for the favicon and the
# brand images, are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
    # Lets the install guide apply the first-session example by URL.
    - source: ../examples
      target: static/examples
