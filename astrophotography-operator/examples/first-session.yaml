# A first imaging session on the INDI simulators of
# observatory-operator's example observatory. It creates three volume
# claims, a Solver, a Target of M42 with short exposures, and a
# Reservation that gives the telescope `east` to
# astrophotography-operator.
#
# Apply both operators' deploy bases, then observatory-operator's
# examples/simulators.yaml without its Reservation, then this file, all
# in the same namespace:
#
#   kubectl apply -n observatory -f examples/first-session.yaml
#   kubectl get astro -n observatory
#
# The Solver is not Ready until the astrometry-indexes claim contains
# index files. The 13 files of the 2MASS series 4207 and 4208 (236 MiB)
# solve the simulator's field of 47.7 by 38.1 arcminutes.
---
# The outbox, where the camera writes each frame. A local-path volume
# is bound to the node of the first pod that uses it, so the camera, the
# worker, and the promotion Job all run on that node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frames
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# The archive, which keeps the promoted frames and the catalog.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: astrometry-indexes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: astrophotography.liken.sh/v1alpha1
kind: Solver
metadata:
  name: lab
spec:
  indexFiles:
    claimName: astrometry-indexes
---
# Nine frames of 10 s, so the session takes minutes. The simulator's
# filter wheel has the filters Luminance, Red, Green, and Blue.
apiVersion: astrophotography.liken.sh/v1alpha1
kind: Target
metadata:
  name: m42
spec:
  object: M42
  coordinates: {ra: "05:35:17.3", dec: "-05:23:28"}
  opticalTrain: east-imaging
  sequences:
    - {filter: Luminance, exposure: 10s, count: 3}
    - {filter: Red, exposure: 10s, count: 2}
    - {filter: Green, exposure: 10s, count: 2}
    - {filter: Blue, exposure: 10s, count: 2}
  dither: {every: 2, pixels: 5}
  centering: {solver: lab, tolerance: 30}
  archive:
    claimName: archive
    path: astro
    promotion: Continuous
---
# This Reservation has no end time, because any fixed time in the file
# would be in the past on most days that someone applies it. It lasts
# until you delete it, and the operator does not delete it. After the
# last frame, the mount stays unparked and tracking. Delete it when the
# session's frames are in the archive:
#
#   kubectl delete reservation east-tonight -n observatory
#
# For a real night, set an end near dawn, as the image-a-target guide
# does.
apiVersion: observatory.liken.sh/v1alpha1
kind: Reservation
metadata:
  name: east-tonight
spec:
  telescope: east
  holder: astrophotography-operator
  outbox:
    claimName: frames
