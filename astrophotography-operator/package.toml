# The operator that images the `Target`s you declare, on the telescopes
# that observatory-operator controls.
[package]
name = "astrophotography-operator"
license = "MIT"

# The operator imports observatory-operator's INDI client, PHD2 client,
# and resource types, and a test compares `Target`'s spec.fitsKeywords
# with the same field of observatory-operator's `Observatory` CRD, so a
# change there runs these tests again. The worker image builds on the
# astrometry image, and the Go builder image comes from toolchains.
[depends]
components = ["astrometry", "kubernetes", "notices", "observatory-operator", "toolchains"]

[docs]
prefix = "astrophotography"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# Checks the manual's links and the generated skills, and builds the
# site.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# make test-go already runs gofmt, go vet, and go mod tidy, so the prek
# job skips those hooks.
[[jobs]]
name = "prek"
toolchain = "prek"
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the kubernetes and observatory-operator modules with
# ../kubernetes and ../observatory-operator, so the build needs those
# directories as contexts. notices holds the script that copies the
# license files of the linked modules into the image.
[[outputs.images]]
name = "astrophotography-operator"
description = "astrophotography-operator, which takes the pictures you ask for on a telescope that observatory-operator runs."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices", observatory = "observatory-operator" }

# The smoke script extracts the stars of the astrometry image's
# synthetic field through the worker mode's HTTP server, and solves them
# through the solver mode's HTTP server.
[[outputs.images]]
name = "astrophotography-operator-worker"
description = "astrophotography-operator's program on the astrometry image, for the solver pods and the workers that extract stars from each frame."
file = "Dockerfile.worker"
contexts = { kubernetes = "kubernetes", notices = "notices", observatory = "observatory-operator" }
smoke = "astrophotography-operator/smoke/astrophotography-operator-worker.sh"
