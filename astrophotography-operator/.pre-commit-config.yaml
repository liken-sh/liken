# The fast checks that run before each commit, through pre-commit or
# prek. CI runs the tests and the coverage gate through the `make`
# targets in package.toml.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Kubernetes manifests are multi-document streams.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py packages a prebuilt shellcheck binary, so the hook
  # runs on a machine that has no shellcheck installed.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        # -diff prints what a tidy would change and writes nothing, so
        # a stale go.mod fails the commit without the hook editing it.
        entry: bash -c 'go mod tidy -diff'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
