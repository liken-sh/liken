# node-5: the lab's second follower. It exists so drills can watch a
# workload machine run through control-plane changes. A leader's
# rolling reboot, or the outright loss of a leader, should be
# invisible to a follower.
apiVersion: liken.sh/v1alpha1
kind: Machine
metadata:
  name: node-5
spec:
  # node-1.yaml explains why the lab's machines choose Auto.
  rebootPolicy: Auto
  # The unclaimed-hardware drill (milestone 11). Every machine carries
  # these drivers, because the image carries the kernel's whole module
  # tree, but only a machine that declares one loads it. That split is
  # what the drill needs: this machine binds a USB stick, and every
  # other machine leaves one unclaimed.
  #
  # A stick plugged into one of those machines then shows the whole
  # story. Its interface stays unclaimed, and status names these two
  # modules as the candidates, because the report reads the same
  # module index the image ships. An operator declares one of them on
  # that machine's spec, and init loads it in place, with no reboot.
  # Two candidates rather than one is the normal condition for USB
  # mass storage, so the drill covers the case a person really meets.
  modules: [usb-storage, uas]
  network:
    interfaces:
      - name: eth0
      - name: eth1
        address: 10.10.0.5/24
  storage:
    # node-1.yaml explains the GRUB boot path these two roles declare.
    biosBoot:
      device: /dev/vdc
      size: 1Mi
    bootHome:
      device: /dev/vdc
      size: 64Mi
    systemA:
      device: /dev/vdc
      size: 1Gi
    systemB:
      device: /dev/vdc
      size: 1Gi
    machineState:
      device: /dev/vda
      size: 64Mi
    machineEphemeral:
      device: /dev/vdb
      size: 512Mi
    clusterState:
      device: /dev/vda
    podStorage:
      device: /dev/vdb
      size: 2Gi
    podEphemeral:
      device: /dev/vdb
  sysctls:
    vm.max_map_count: "262144"
