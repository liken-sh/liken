# The machine operator's account, RBAC, and DaemonSet. k3s applies
# this file from its auto-deploy manifests directory each time it
# starts.
#
# The operator's image is part of the OS. image/build.sh puts the image
# tarball in the initramfs, and k3s imports it into containerd when it
# starts, so each node runs the operator build of its own OS and never
# pulls it from a registry. image/build.sh also replaces LIKEN_VERSION
# with the release's version.
#
# During an upgrade the nodes run different releases, and the k3s of
# each leader applies this file again when it starts. So the DaemonSet
# must never require an image that some node does not have. The
# comments on the DaemonSet and cluster-operator/steward.go explain
# how.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liken-machine-operator
  namespace: liken-system
---
# The pod below is privileged on its machine, so its rights in the
# cluster are kept to what one machine needs: its own Machine and
# Node, its own ResourceSlice, and the creation of the Cluster. The
# cluster operator has the rights over the fleet, such as the Cluster's
# status and the OS pods on other nodes.
#
# `clusters` has no `update` verb and `clusters/status` has no rule.
# The operator creates the Cluster once and never changes the spec
# that a person or a git repository edits after that. The cluster
# operator writes the status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: liken-machine-operator
rules:
  # The operator creates its own Machine on first boot, and reads and
  # watches it. RBAC cannot limit a rule to the Machine named for the
  # pod's node, because `resourceNames` is the same for every pod of
  # the DaemonSet. So the rule covers every Machine, and the operator
  # watches only its own, with a field selector.
  - apiGroups: [liken.sh]
    resources: [machines]
    verbs: [get, list, watch, create]
  - apiGroups: [liken.sh]
    resources: [machines/status]
    verbs: [update]
  # The operator creates the Cluster on first boot from the manifest in
  # /etc/liken (seeding.go). It watches the Cluster, and stages each
  # edit for the next boot (cluster.go). The watch selects the Cluster
  # by the name in the boot manifest. This file cannot name it, because
  # every cluster applies the same file, so the rule covers all
  # Clusters. A cluster has one.
  - apiGroups: [liken.sh]
    resources: [clusters]
    verbs: [get, list, watch, create]
  # The machine's Disruptions (requests.go). The operator creates,
  # updates, and deletes its own request for what it staged. It reads a
  # person's request to reboot, writes the running boot into a request
  # that names no boot, and marks the request Complete when the machine
  # runs a different boot. It watches only its own machine's requests,
  # with the field selector `spec.machine` that the CRD declares.
  - apiGroups: [liken.sh]
    resources: [disruptions]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [liken.sh]
    resources: [disruptions/status]
    verbs: [update]
  # The operator watches its own Node for its role labels and whether
  # it is cordoned. It deletes the Node when it demotes the machine from
  # leader (demotion.go), because k3s removes the etcd member of a
  # deleted Node. It patches the Node to cordon and uncordon it for a
  # drain (drain.go) and to set the labels of the spec (labels.go). It
  # has `patch` and not `update` because it changes only its own fields:
  # the unschedulable flag, the spec's labels, and its own annotations.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, delete, patch]
  # The node's ResourceSlice lists the devices that workloads can claim
  # through DRA (dra.go). As with Machines, the rule covers every
  # ResourceSlice, and the operator writes and watches only the slice
  # named for its node.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch, create, update, delete]
  # The DRA driver (draplugin.go). The kubelet's prepare call gives
  # only the claim's name, so the driver reads the claim to find its
  # allocation in status. Claims belong to workloads in any namespace.
  # The driver needs no `list` or `watch` because each call names the
  # claim.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get]
  # A drain (drain.go) creates an eviction for each pod that must leave
  # the node, and does not delete the pod, because the API server
  # refuses an eviction that would violate the pod's
  # PodDisruptionBudget. The operator always watches its own node's
  # operator pod (staleness.go). It watches every pod of the node only
  # while a drain runs, or while it waits for the node's OS containers
  # to be Ready after an image import (waits.go).
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # A drain watches the PodDisruptionBudgets in every namespace, so it
  # retries as soon as a budget allows an eviction that it refused
  # (waits.go).
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  # When an edit removes servicelb or helm from the Cluster, the
  # operator keeps the feature running until no object is left that
  # only its controller can delete (retraction.go). For servicelb these
  # are LoadBalancer Services, which carry its controller's cleanup
  # finalizer. For helm these are HelmCharts, which carry the Helm
  # controller's finalizer. They can be in any namespace. The operator
  # lists and watches them only while it waits (waits.go), reports what
  # is left in a status message, and never deletes them.
  - apiGroups: [""]
    resources: [services]
    verbs: [list, watch]
  - apiGroups: [helm.cattle.io]
    resources: [helmcharts]
    verbs: [list, watch]
  # The Events about this machine's Machine (events.go). A Machine is
  # cluster-scoped, and the API server accepts an Event about a
  # cluster-scoped object only in the `default` and `kube-system`
  # namespaces, so the operator creates every Event in `default`. When
  # the same Event repeats within ten minutes, the operator patches its
  # count, so `kubectl describe` shows one line with a count.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liken-machine-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: liken-machine-operator
subjects:
  - kind: ServiceAccount
    name: liken-machine-operator
    namespace: liken-system
---
# The heartbeat Lease. Each machine's operator creates and renews one
# Lease named for its machine, as a kubelet renews its node's Lease.
# The rule has no `list` because the cluster operator, not this one,
# reads the fleet's heartbeats. This is a namespaced Role because other
# programs write Leases in other namespaces, such as each kubelet in
# `kube-node-lease`, and the operator must not change them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liken-machine-operator-leases
  namespace: liken-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liken-machine-operator-leases
  namespace: liken-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: liken-machine-operator-leases
subjects:
  - kind: ServiceAccount
    name: liken-machine-operator
    namespace: liken-system
---
# The operator may read only the Secret `registry-credentials`, which
# holds the fleet's registry credentials. RBAC allows `list` and
# `watch` with `resourceNames` only when the request selects that name
# with a field selector, so the operator cannot list the other Secrets
# of the namespace. The operator watches the Secret, and an edit to it
# starts a reconcile pass at once.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liken-machine-operator-registry-credentials
  namespace: liken-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [registry-credentials]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liken-machine-operator-registry-credentials
  namespace: liken-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: liken-machine-operator-registry-credentials
subjects:
  - kind: ServiceAccount
    name: liken-machine-operator
    namespace: liken-system
---
# The machine operator manages the machine that its pod runs on, so it
# runs as a DaemonSet with one pod on each node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: liken-machine-operator
  namespace: liken-system
  # The selector uses only the `app` label because a DaemonSet's
  # selector cannot change after creation.
  labels:
    app.kubernetes.io/name: liken-machine-operator
    app.kubernetes.io/part-of: liken
  # The release that shipped this file. The cluster operator
  # (cluster-operator/steward.go) compares it with the version that
  # each machine runs, to decide when to replace the machine's pod with
  # one from this template. Each pod copies the annotation from the
  # template, so a pod is out of date when its value differs from the
  # DaemonSet's.
  annotations:
    liken.sh/os-version: "LIKEN_VERSION"
spec:
  selector:
    matchLabels:
      app: liken-machine-operator
  # The image is part of each node's OS, so a template change must not
  # recreate the pod of a node that has not rebooted into the new
  # release. The new pod could not start, because `imagePullPolicy` is
  # `Never`, and the machine would lose the operator that runs its
  # upgrade. The cluster operator deletes each machine's pod after
  # that machine's upgrade finishes.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app: liken-machine-operator
        app.kubernetes.io/name: liken-machine-operator
        app.kubernetes.io/part-of: liken
      annotations:
        liken.sh/os-version: "LIKEN_VERSION"
    spec:
      serviceAccountName: liken-machine-operator
      # When a node runs low on memory, the kubelet evicts workloads
      # before the OS components.
      priorityClassName: system-node-critical
      # Only liken nodes have this image, and every liken machine
      # registers with this label (image/etc/rancher/k3s). During an
      # adoption the cluster also has nodes that are not liken machines,
      # where the pod would stay in ErrImageNeverPull.
      nodeSelector:
        liken.sh/machine: "true"
      # The operator must run when its node is cordoned or not ready,
      # because it drains, upgrades, and repairs the node.
      tolerations:
        - operator: Exists
      # `hostNetwork` puts the pod in the host's network namespace, so
      # the `net.*` sysctls that it writes change the host's network
      # stack and not the pod's. `privileged` makes `/proc/sys`
      # writable, which it is not in an unprivileged pod.
      hostNetwork: true
      containers:
        - name: operator
          # Every release tags its build `:installed` (image/oci.sh), so
          # each node runs the build that its own OS imported. A
          # versioned tag here would require the same build on every
          # node at once, which a fleet does not have during an upgrade.
          image: liken.sh/machine-operator:installed
          imagePullPolicy: Never
          securityContext:
            privileged: true
          # The operator serves `/metrics` here, the default of its
          # `--metrics-address` flag. The pod uses the host network, so
          # this is a port of the machine, and each liken process that
          # serves metrics has its own port. The PodMonitor in
          # liken/deploy/monitoring/podmonitors.yaml selects the port by
          # its name. To stop the listener and free the port, add
          # `args: ["--metrics-address="]` to this container.
          ports:
            - name: metrics
              containerPort: 9200
              protocol: TCP
          volumeMounts:
            # The facts tree that init wrote, and the manifest of this
            # boot, which names the Machine. The operator watches the tree
            # with inotify, which works through a read-only bind mount
            # because the events belong to the inode.
            - name: run-liken
              mountPath: /run/liken
              readOnly: true
            # The image's Cluster manifest, from which the operator
            # creates the Cluster on first boot.
            - name: etc-liken
              mountPath: /etc/liken
              readOnly: true
            # The `machineState` filesystem. The operator stages the
            # manifest for the next boot here, and init reads it at that
            # boot.
            - name: machine-state
              mountPath: /var/lib/liken/machine
            # The operator writes its requests to init here, such as a
            # reboot. This is a separate mount because `/run/liken` above
            # is read-only.
            - name: run-liken-operator
              mountPath: /run/liken/operator
            # init mounts both system slots here at boot. The operator
            # writes a downloaded release to the slot that did not boot.
            - name: system-slots
              mountPath: /var/lib/liken/system
            # The operator writes /etc/hosts on every pass (hosts.go) by
            # writing a temporary file in /etc and renaming it over
            # /etc/hosts. A bind mount of the file itself would keep the
            # old inode after the rename, so the mount is the directory.
            - name: host-etc
              mountPath: /host/etc
            # The container store. The operator opens it only to call
            # syncfs, so that every image that this boot imported is on
            # disk before it records the imports as proven (imports.go).
            - name: container-store
              mountPath: /var/lib/rancher/k3s/agent
              readOnly: true
            # The DRA driver (draplugin.go, cdi.go) creates its sockets in
            # the kubelet's plugin directories. It writes a CDI spec for
            # each prepared claim in /var/run/cdi, and containerd reads
            # the spec to give the container its device nodes.
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: cdi
              mountPath: /var/run/cdi
      # The operator stages a boot and requests a reboot by writing files
      # on these mounts, so those operations need no RBAC.
      volumes:
        - name: run-liken
          hostPath:
            path: /run/liken
        - name: etc-liken
          hostPath:
            path: /etc/liken
        # init creates these paths, and they can be missing. With the
        # default type the pod would not start, and the operator must
        # start to report the problem. The facts tree records whether
        # `machineState` is mounted from a disk.
        - name: machine-state
          hostPath:
            path: /var/lib/liken/machine
            type: DirectoryOrCreate
        - name: run-liken-operator
          hostPath:
            path: /run/liken/operator
            type: DirectoryOrCreate
        - name: system-slots
          hostPath:
            path: /var/lib/liken/system
            type: DirectoryOrCreate
        - name: host-etc
          hostPath:
            path: /etc
        - name: container-store
          hostPath:
            path: /var/lib/rancher/k3s/agent
            type: DirectoryOrCreate
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
