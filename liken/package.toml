# The OS. Its version is the repository's release tag, and it publishes
# to the release channel at releases.liken.sh, not to a registry.
[package]
name = "liken"
license = "MIT"

[depends]
components = ["brand", "kubernetes"]

[docs]
# liken's manual is the root of the site.
prefix = ""

# vet, staticcheck, a tidy check of go.mod, and one run of the tests
# that checks for races and writes the coverage profile, then the
# coverage gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
coverage = ["coverage.out"]

# The hooks in .pre-commit-config.yaml that no other job runs: gofmt
# and the hygiene checks. The jobs above run the tests and the
# coverage gate.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["go-vet", "staticcheck", "go-mod-tidy"]

# The link check, the generated skills, and the site build. The docs
# tests generate the reference pages first, because the link check
# reads them as sources and as targets.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The build proves that the tree still assembles an operating system,
# and that it boots to a Ready Kubernetes node under both firmware
# types. The UEFI drill installs node-1 onto a blank disk and boots it
# through OVMF's boot entries. The BIOS drill proves the other chain:
# MBR boot code, GRUB's core image, and the chosen slot's kernel. A
# warm-cache build takes 3 to 6 minutes and a cold one about 15.
#
# The serial console is the record of the boot, and it is worth keeping
# when the drill passes: a healthy boot is the baseline for the next
# unhealthy one. qemu.log holds the failure when QEMU never reaches a
# console.
[[jobs]]
name = "build"
toolchain = "os"
timeout = 20
run = """
make all
make smoke-uefi
make smoke-bios
"""
artifacts = ["dev-cluster/guests/node-1/*.log"]

[outputs]
channel = true
# deploy/monitoring is a kustomize Component that a fleet fetches by
# git at a release tag. Nothing on the channel is built from it, so a
# change to it does not release the OS. The change reaches fleets with
# the next release.
exclude = ["deploy/monitoring/"]
