# The cluster operator works on the whole fleet through the API server,
# so it runs as an ordinary pod with no hostPath mounts, host network,
# or privilege, and Kubernetes can move it to any liken node. The
# machine operator runs on each machine because it needs that
# machine's files.
#
# Only the copy that holds the liken-cluster-operator Lease in
# liken-system watches the fleet and writes (leader.go). The replica
# count alone cannot keep a second copy from acting, because a rolling
# update, a partitioned node, or a person who scales the Deployment can
# each start one.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: liken-cluster-operator
  namespace: liken-system
---
# The cluster operator reads the whole fleet and writes only the
# decisions that need a view of every machine. It can update any
# Machine's status, to mark the machine Lost or approve its reboot, but
# it cannot create a Machine, change a spec, or modify a Node. Each
# machine operator does those things for its own machine, and cannot
# write the Cluster's status.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: liken-cluster-operator
rules:
  # A change to any Machine starts a pass, and the pass reads the
  # Machines from the watch's cache. The operator writes a Machine's
  # status only to set the Lost phase or the RebootApproved condition.
  - apiGroups: [liken.sh]
    resources: [machines]
    verbs: [get, list, watch]
  - apiGroups: [liken.sh]
    resources: [machines/status]
    verbs: [update]
  # The operator has no configuration, so it finds the Cluster through
  # its watch. A pass reads the Cluster from the watch's cache and
  # sends get or list only when the cache cannot serve the read. Only
  # this program writes the Cluster's status. The machine operators
  # create the Cluster from the boot manifest, so this role has no
  # create.
  - apiGroups: [liken.sh]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [liken.sh]
    resources: [clusters/status]
    verbs: [update]
  # The operator reads every Disruption and MachineDisruptionBudget and
  # writes the status of each (requests.go, requeststatus.go). It
  # deletes a Disruption a day after it completes, and creates the
  # default MachineDisruptionBudget when none exists.
  - apiGroups: [liken.sh]
    resources: [disruptions]
    verbs: [get, list, watch, delete]
  - apiGroups: [liken.sh]
    resources: [disruptions/status]
    verbs: [update]
  - apiGroups: [liken.sh]
    resources: [machinedisruptionbudgets]
    verbs: [get, list, watch, create]
  - apiGroups: [liken.sh]
    resources: [machinedisruptionbudgets/status]
    verbs: [update]
  # After an upgrade, the operator (steward.go) evicts the OS
  # DaemonSets' pods that the old release created. It evicts, as a
  # drain does, instead of deleting, because the API server refuses an
  # eviction that would violate a PodDisruptionBudget.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # The operator compares each pod with its DaemonSet's
  # liken.sh/os-version annotation, which records the release whose
  # manifests are applied. It also deletes (janitor.go) a DaemonSet
  # whose liken.sh/feature annotation names a feature that the Cluster
  # no longer declares. Only a feature's manifests set that annotation,
  # so the operator deletes no other DaemonSet.
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get, list, watch, delete]
  # When the Cluster stops declaring the flux feature, the operator
  # (janitor.go) deletes the Flux installation. The rules for that are
  # in this role, not in the feature's manifests, because the teardown
  # deletes that RBAC before it finishes. Each rule names the exact
  # objects, and none grants create or list. The CRD and RBAC names must match
  # seed/gotk-components.yaml, and flux_test.go checks that they do.
  # The GitRepository and the Kustomization need patch, because the
  # operator removes their finalizers once no Flux controller is left to
  # do it. The flux-system Namespace needs get, because the operator
  # deletes nothing unless the Namespace has a liken.sh/feature
  # annotation, which shows that liken installed this Flux.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [source-controller, kustomize-controller]
    verbs: [get, delete]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [flux-system]
    verbs: [get, delete]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    resourceNames: [flux-system]
    verbs: [patch, delete]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    resourceNames: [flux-system]
    verbs: [patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - buckets.source.toolkit.fluxcd.io
      - externalartifacts.source.toolkit.fluxcd.io
      - gitrepositories.source.toolkit.fluxcd.io
      - helmcharts.source.toolkit.fluxcd.io
      - helmrepositories.source.toolkit.fluxcd.io
      - ocirepositories.source.toolkit.fluxcd.io
      - kustomizations.kustomize.toolkit.fluxcd.io
    verbs: [delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [crd-controller-flux-system, flux-edit-flux-system, flux-view-flux-system, liken-engine-planter]
    verbs: [delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [cluster-reconciler-flux-system, crd-controller-flux-system, liken-engine-planter]
    verbs: [delete]
  # Events about Machines and the Cluster (events.go). Both kinds are
  # cluster-scoped, and the API server accepts an Event about a
  # cluster-scoped object only in default or kube-system, so the
  # operator writes every Event in default. Because this ClusterRole
  # grants the access, no RoleBinding in default is needed. patch
  # raises the count of an Event that repeats within ten minutes.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: liken-cluster-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: liken-cluster-operator
subjects:
  - kind: ServiceAccount
    name: liken-cluster-operator
    namespace: liken-system
---
# The operator watches each machine's heartbeat Lease in liken-system
# to find machines that stopped reporting, and writes only its own
# leader election Lease. RBAC cannot limit create to a resource name,
# because the request is checked before the object has one, so the
# role grants create on every Lease and update only on
# liken-cluster-operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: liken-cluster-operator-leases
  namespace: liken-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [liken-cluster-operator]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: liken-cluster-operator-leases
  namespace: liken-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: liken-cluster-operator-leases
subjects:
  - kind: ServiceAccount
    name: liken-cluster-operator
    namespace: liken-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liken-cluster-operator
  namespace: liken-system
  labels:
    app.kubernetes.io/name: liken-cluster-operator
    app.kubernetes.io/part-of: liken
  # The release that these manifests shipped with, as on the OS
  # DaemonSets. Those DaemonSets use OnDelete, so cluster-operator must
  # evict their old pods. This Deployment replaces its own pod, because
  # the same annotation is in the pod template and a new release
  # changes it.
  annotations:
    liken.sh/os-version: "LIKEN_VERSION"
spec:
  # A rolling update starts the new pod before it stops the old one.
  # The old pod releases the leader election Lease on SIGTERM after its
  # last pass, and the new pod takes it within about 11 seconds.
  #
  # A second replica would take over 30 to 41 seconds after the
  # leader's node dies, without waiting for the scheduler. It is not
  # safe until every node runs a release with leader election, because
  # a pod on a node with an older build (see the image comment below)
  # acts without the Lease.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: liken-cluster-operator
  template:
    metadata:
      labels:
        app: liken-cluster-operator
        app.kubernetes.io/name: liken-cluster-operator
        app.kubernetes.io/part-of: liken
      annotations:
        liken.sh/os-version: "LIKEN_VERSION"
    spec:
      serviceAccountName: liken-cluster-operator
      # On SIGTERM the operator finishes its pass, whose requests each
      # time out after 15 seconds, and then releases the Lease, which
      # can take up to 16 seconds more. With the default of 30 seconds
      # the kubelet can kill it before the release, and the next copy
      # then waits out the whole Lease duration.
      terminationGracePeriodSeconds: 60
      # system-cluster-critical, not system-node-critical, because the
      # cluster needs this operator on some node, not on every node.
      priorityClassName: system-cluster-critical
      # Only liken nodes have the image, because imagePullPolicy is Never
      # (see the machine operator's manifest).
      nodeSelector:
        liken.sh/machine: "true"
      # The pod leaves a not-ready or unreachable node after 15 seconds
      # instead of the default five minutes. It is stateless, and the
      # Cluster status goes stale while it is down. When its node dies,
      # those 15 seconds plus the 40 seconds before a heartbeat counts
      # as stale leave the Cluster status stale for about a minute. The
      # Node objects stay current, because the Kubernetes node
      # controller updates them.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 15
      containers:
        - name: operator
          # The installed tag resolves on each node to the build that
          # the node's OS imported (see the machine operator's manifest).
          # During an upgrade the pod can start on a node with an older
          # build than these manifests, so the operator must work beside
          # machines on older releases.
          image: liken.sh/cluster-operator:installed
          imagePullPolicy: Never
          # --metrics-address defaults to :9200, the port where every
          # liken process serves /metrics. The PodMonitor in
          # deploy/monitoring/podmonitors.yaml selects the port by its
          # name. To turn the listener off, add
          # `args: ["--metrics-address="]` to this container.
          ports:
            - name: metrics
              containerPort: 9200
              protocol: TCP
