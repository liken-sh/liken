# The file that systemd-boot/fetch.sh downloads, and the source that
# licensing/sources.sh mirrors, for the fetch, for the mirror, and for
# the SBOM of a release. systemd-boot/latest.sh --bump writes the
# version, url, sha256, and purl of each, and toolchains/pin.sh
# describes each field.

# Ubuntu's systemd-boot-efi package, from the systemd source package.
# The release ships systemd-bootx64.efi from it. The sources under
# src/boot and src/fundamental that build it state their licenses by
# SPDX identifier: most are LGPL-2.1-or-later, the CHID code is
# BSD-3-Clause, and the SHA-1 code is public domain.
#
# The cpe is the name that a vulnerability scanner matches the entry
# by, and the type is one that a scanner keeps. NVD lists systemd as
# systemd_project:systemd, at the upstream version without Ubuntu's
# revision. systemd-boot/latest.sh --bump writes the cpe with the
# version.
[systemd-boot-efi]
version = "262.1-1ubuntu1"
url = "http://archive.ubuntu.com/ubuntu/pool/universe/s/systemd/systemd-boot-efi_262.1-1ubuntu1_amd64.deb"
sha256 = "f943f1738a31fb6c3b94e9acc31d268d0dc7cf0c07ecf04a8b4dc8ccedf003c6"
purl = "pkg:deb/ubuntu/systemd-boot-efi@262.1-1ubuntu1?arch=amd64"
license = "LGPL-2.1-or-later AND BSD-3-Clause AND LicenseRef-alg-sha1-public-domain"
type = "application"
cpe = "cpe:2.3:a:systemd_project:systemd:262.1:*:*:*:*:*:*:*"

# The next three are the corresponding source: the files of the systemd
# source package that built the package above. They are the upstream
# tarball, the packaging tarball with Ubuntu's patches, and the .dsc
# file that names both. No build reads them. licensing/sources.sh
# mirrors them onto the release channel from Launchpad, which keeps
# every version, so their scope is excluded. LICENSES/README.md in the
# upstream tarball gives the project the LGPL version 2.1 or later and
# the udev programs the GPL version 2 or later, and it names the other
# licenses of single files.
[systemd-source-orig]
version = "262.1-1ubuntu1"
url = "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/systemd/262.1-1ubuntu1/systemd_262.1.orig.tar.gz"
sha256 = "100fc873b848b9b0297d8a705e8e2ed326256c8483d9960ee1ffe264c8a5c3e3"
purl = "pkg:deb/ubuntu/systemd@262.1-1ubuntu1?arch=source"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
scope = "excluded"

[systemd-source-debian]
version = "262.1-1ubuntu1"
url = "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/systemd/262.1-1ubuntu1/systemd_262.1-1ubuntu1.debian.tar.xz"
sha256 = "644b0a0505f910580aefa87713286aea5c7910298d7e144ed790ae69ae1cdc0f"
purl = "pkg:deb/ubuntu/systemd@262.1-1ubuntu1?arch=source"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
scope = "excluded"

[systemd-source-dsc]
version = "262.1-1ubuntu1"
url = "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/systemd/262.1-1ubuntu1/systemd_262.1-1ubuntu1.dsc"
sha256 = "a368ef53742eb3a6a40d1206ea80461c3254330e5f72830fa5833816bfed72a3"
purl = "pkg:deb/ubuntu/systemd@262.1-1ubuntu1?arch=source"
license = "LGPL-2.1-or-later AND GPL-2.0-or-later"
scope = "excluded"
