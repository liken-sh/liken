# The files that linux-firmware/fetch.sh downloads, for the fetch and
# for the SBOM of a release. linux-firmware/latest.sh --bump writes the
# version, url, sha256, and purl of linux-firmware, and
# `--bump wireless-regdb` writes those of wireless-regdb.
# toolchains/pin.sh describes each field.

# The firmware release. Its LICENSE says that each blob is under the
# license that WHENCE names for it, and its LICENSES directory holds
# the text of each one. No one SPDX expression names those terms, so
# the SBOM names them with a LicenseRef.
[linux-firmware]
version = "20261019"
url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20261019.tar.xz"
sha256 = "a10d1ab5baf2c74ba92e8c7cf313e691696c26bddfa6df00db795e48d70cd4ca"
purl = "pkg:generic/linux-firmware@20261019?download_url=https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20261019.tar.xz&checksum=sha256:a10d1ab5baf2c74ba92e8c7cf313e691696c26bddfa6df00db795e48d70cd4ca"
license = "LicenseRef-linux-firmware"

# The regulatory database, a pin of its own inside this domain. No
# VERSION file names it, so this entry holds its version for the
# fetch, derive.sh, the image's components record, the release
# document, and the source mirror. Its LICENSE is the ISC license.
[wireless-regdb]
version = "2026.09.03"
url = "https://mirrors.edge.kernel.org/pub/software/network/wireless-regdb/wireless-regdb-2026.09.03.tar.xz"
sha256 = "b22e0901227b820cd1c280abe681a15b773a5103a5e10dc442e94ebb34cbf58d"
purl = "pkg:generic/wireless-regdb@2026.09.03?download_url=https://mirrors.edge.kernel.org/pub/software/network/wireless-regdb/wireless-regdb-2026.09.03.tar.xz&checksum=sha256:b22e0901227b820cd1c280abe681a15b773a5103a5e10dc442e94ebb34cbf58d"
license = "ISC"
