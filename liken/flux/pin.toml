# The file that flux/fetch.sh downloads, for the fetch and for the SBOM
# of a release. flux/latest.sh --bump writes the version, url, sha256,
# and purl, and toolchains/pin.sh describes each field.

# The flux CLI. No release ships the CLI, but the manifests that it
# renders are the seed in the cluster operator's image, so the SBOM
# names the release that they come from.
#
# The cpe is the name that a vulnerability scanner matches the entry
# by, and the type is one that a scanner keeps. NVD lists Flux under
# the vendor fluxcd as flux2, at the version without the leading v, and
# its records there cover the controllers that the manifests install.
# flux/latest.sh --bump writes the cpe with the version.
[flux]
version = "v2.10.1"
url = "https://github.com/fluxcd/flux2/releases/download/v2.10.1/flux_2.10.1_linux_amd64.tar.gz"
sha256 = "967365ff84aabc97871827ff33713ef0c09f62dd83c18759e3a5e39adcea9285"
purl = "pkg:github/fluxcd/flux2@v2.10.1"
license = "Apache-2.0"
type = "application"
cpe = "cpe:2.3:a:fluxcd:flux2:2.10.1:*:*:*:*:*:*:*"
