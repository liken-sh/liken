# The file that xtables/fetch.sh downloads, and the sources that
# licensing/sources.sh mirrors, for the fetch, for the mirror, and for
# the SBOM of a release. xtables/latest.sh --bump writes the version,
# url, sha256, and purl of each, and toolchains/pin.sh describes each
# field.

# k3s-root's static netfilter tools. The OS ships xtables-legacy-multi
# from it, which is iptables, under the GPL version 2 that iptables'
# COPYING gives, linked with musl, whose license is MIT.
[k3s-root-xtables]
version = "v0.15.3"
url = "https://github.com/k3s-io/k3s-root/releases/download/v0.15.3/k3s-root-xtables-amd64.tar"
sha256 = "b615039d1196a80b374dff031a3f89c3c1d91f67cb08acc54d8d0276a6e7b933"
purl = "pkg:github/k3s-io/k3s-root@v0.15.3"
license = "GPL-2.0-only AND MIT"
type = "application"

# The next three are the corresponding source of the netfilter tools,
# and of the GPL-licensed userland that k3s embeds from the same
# k3s-root release. No build reads them. licensing/sources.sh mirrors
# them onto the release channel, so their scope is excluded.

# k3s-root's recipe at the release's tag, under k3s-root's Apache-2.0
# LICENSE.
[k3s-root-source]
version = "v0.15.3"
url = "https://github.com/k3s-io/k3s-root/archive/refs/tags/v0.15.3.tar.gz"
sha256 = "e0f04c1b7747a2637babd95fc8683a95ca8bee940b4058dc7b474638b4e9a621"
purl = "pkg:github/k3s-io/k3s-root@v0.15.3"
license = "Apache-2.0"
scope = "excluded"

# The iptables release that the recipe builds: the version that
# package/iptables/iptables.mk names in the buildroot release below.
[iptables-source]
version = "1.8.11"
url = "https://www.netfilter.org/pub/iptables/iptables-1.8.11.tar.xz"
sha256 = "d87303d55ef8c92bcad4dd3f978b26d272013642b029425775f5bad1009fe7b2"
purl = "pkg:generic/iptables@1.8.11?download_url=https://www.netfilter.org/pub/iptables/iptables-1.8.11.tar.xz&checksum=sha256:d87303d55ef8c92bcad4dd3f978b26d272013642b029425775f5bad1009fe7b2"
license = "GPL-2.0-only"
scope = "excluded"

# The buildroot release that k3s-root's scripts/download names. It
# holds the build scripts and the hash of every other package that the
# recipe builds. buildroot's COPYING gives the GPL version 2 or later,
# except for the files that state their own license.
[buildroot-source]
version = "2025.02.18"
url = "https://github.com/buildroot/buildroot/archive/refs/tags/2025.02.18.tar.gz"
sha256 = "9a0f33022512709eb876db2c27943b0e2acfe2d67616cd3882e0d8ce251cd8d1"
purl = "pkg:github/buildroot/buildroot@2025.02.18"
license = "GPL-2.0-or-later"
scope = "excluded"
