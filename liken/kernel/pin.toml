# The files that kernel/fetch.sh downloads, and the source that
# licensing/sources.sh mirrors, for the fetch, for the mirror, and for
# the SBOM of a release. kernel/latest.sh --bump writes the version,
# url, sha256, and purl of each, and toolchains/pin.sh describes each
# field.
#
# The first two are packages of a mainline build of Canonical's kernel team,
# which kernel.ubuntu.com serves outside Ubuntu's archive, so their
# purl is generic and names the URL. Each package's file name holds a
# build timestamp that only the build's CHECKSUMS file gives, so the
# url is the one place that names the file. The license is the one
# that the kernel's COPYING states.

# The kernel image.
#
# The cpe is the name that a vulnerability scanner matches the entry
# by, and the type is one that a scanner keeps. NVD lists the kernel
# as the operating system linux:linux_kernel. kernel/latest.sh --bump
# writes the cpe with the version.
[linux-image-unsigned]
version = "7.3.6"
url = "https://kernel.ubuntu.com/mainline/v7.3.6/amd64/linux-image-unsigned-7.3.6-070306-generic_7.3.6-070306.202611231154_amd64.deb"
sha256 = "94a6a705a8afd88e8f0a97efb7eede89021229d92fdc4de24a60b7babcb2d02e"
purl = "pkg:generic/linux-image-unsigned@7.3.6?download_url=https://kernel.ubuntu.com/mainline/v7.3.6/amd64/linux-image-unsigned-7.3.6-070306-generic_7.3.6-070306.202611231154_amd64.deb&checksum=sha256:94a6a705a8afd88e8f0a97efb7eede89021229d92fdc4de24a60b7babcb2d02e"
license = "GPL-2.0-only WITH Linux-syscall-note"
type = "application"
cpe = "cpe:2.3:o:linux:linux_kernel:7.3.6:*:*:*:*:*:*:*"

# The modules, the build's configuration, and its System.map.
#
# The type is one that a scanner keeps, so a scanner that reads the
# SBOM lists the modules. The entry states no cpe, because the modules
# are part of the kernel release that linux-image-unsigned names, and a
# second entry with the kernel's CPE would report each kernel finding
# twice.
[linux-modules]
version = "7.3.6"
url = "https://kernel.ubuntu.com/mainline/v7.3.6/amd64/linux-modules-7.3.6-070306-generic_7.3.6-070306.202611231154_amd64.deb"
sha256 = "ad0064c0331c6ed82ab5ad65320ef1309bc9a2cac0fdeee7dc913579986d1d63"
purl = "pkg:generic/linux-modules@7.3.6?download_url=https://kernel.ubuntu.com/mainline/v7.3.6/amd64/linux-modules-7.3.6-070306-generic_7.3.6-070306.202611231154_amd64.deb&checksum=sha256:ad0064c0331c6ed82ab5ad65320ef1309bc9a2cac0fdeee7dc913579986d1d63"
license = "GPL-2.0-only WITH Linux-syscall-note"
type = "application"

# kernel.org's tarball of the same release, which Canonical's mainline
# build compiles without changes. No build reads it. licensing/sources.sh
# mirrors it onto the release channel as the kernel's corresponding
# source, so its scope is excluded. kernel/latest.sh --bump takes its
# digest from kernel.org's signed sha256sums.asc.
[linux-source]
version = "7.3.6"
url = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.6.tar.xz"
sha256 = "8183d475a76a0faffa92d6cd500af421f589dfd0300a0f1060bb875e11d45723"
purl = "pkg:generic/linux@7.3.6?download_url=https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.6.tar.xz&checksum=sha256:8183d475a76a0faffa92d6cd500af421f589dfd0300a0f1060bb875e11d45723"
license = "GPL-2.0-only WITH Linux-syscall-note"
scope = "excluded"
