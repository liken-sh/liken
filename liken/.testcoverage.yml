# This is the coverage gate. The `test-go` target in the Makefile runs
# go-test-coverage over the profile that the tests write, and CI runs
# that target.
#
# The thresholds only rise over time. Each one is set just under what
# the tests actually measure today. So a change that loses coverage
# makes the check fail with a clear error, and a change that gains
# coverage should raise the number here to keep the gain. The numbers
# only go up, and no package sits below 60.
#
# The numbers are measured with Go 1.27.1. Its profiles count a basic
# block once for each row that comments split the block into
# (golang/go#80974), so the floors move when Go 1.27.2 fixes that.
#
# The numbers deliberately differ by package. machine/ is pure types
# and parsing, testable to the last line. init/ is mostly boot
# machinery (mounting, supervising k3s, the reboot syscall) that only
# a real machine can exercise. What is unit-testable there is the
# decision-making. This is why the decisions live in separate
# functions from the syscalls that act on them, and why the fake
# sysfs, efivars, and command-line fixtures exist.

profile: coverage.out

threshold:
  # The whole module, everything counted.
  total: 79

override:
  # The API group's grammar: the shared shapes, the version format,
  # and the condition vocabulary, all pure and tested to the last
  # line. (Paths here are regular expressions over module-relative
  # package paths.)
  - path: ^api$
    threshold: 99
  # The Cluster API: pure functions over declared types, the same
  # shape as machine below.
  - path: ^cluster$
    threshold: 97
  # The hardware package: the sysfs walk, the modalias matching, and
  # the ID databases, and the tests run them against fixture trees.
  # What stays untested is a scattering of I/O error returns.
  - path: ^hardware$
    threshold: 90
  # The Machine API: pure functions over declared types.
  - path: ^machine$
    threshold: 88
  # The identity package: minting, adoption, and the kubeconfig are
  # pure crypto and file layout, and the tests cover them end to end.
  # What stays untested is a scattering of I/O error returns.
  - path: ^identity$
    threshold: 76
  # The CLI: a dispatch table over the domain packages, which carry
  # their own tests. What stays untested here is main itself.
  - path: ^cli$
    threshold: 83
  # The Kubernetes client: the tests exercise every verb against a
  # real HTTP test server. What stays untested is the in-cluster
  # bootstrapping that only a pod's mounted credentials can satisfy.
  - path: ^kubernetes$
    threshold: 92
  # The watches' handlers and reads: the wake rules, run through
  # client-go's real reflector against a scripted API server, and the
  # reads of a store and a memo held by hand. What stays untested is a
  # scattering of store errors that client-go's own store never
  # returns. The watch itself is the shared module's, with its own
  # tests.
  - path: ^kubernetes/watch$
    threshold: 97
  # The fake API server the operators' tests share. Its tests hold it
  # to the answers those tests rely on.
  - path: ^kubernetes/fakeapi$
    threshold: 92
  # The metrics package: the registry, the collectors for the
  # contract's first two layers, and the listener. The tests scrape
  # every series through a real handler. What stays untested is the
  # serving goroutine's own failure, which needs a listener that
  # fails after it binds.
  - path: ^metrics$
    threshold: 92
  # The machine operator: its decisions (drift, staging validation,
  # the convergence truth table, the drain) are pure and tested, and a
  # whole reconcile pass runs against a fake API server. What stays
  # untested is main, and the parts of a pass that need the real facts
  # files and a real kernel, which the QEMU harness exercises.
  - path: ^machine-operator$
    threshold: 86
  # The cluster operator: the sweep and rollout decisions are pure
  # and tested, and the acting halves, the sweep loop, and the leader
  # election run against miniature API servers. What stays untested is
  # main's setup, which needs a pod's in-cluster credentials.
  - path: ^cluster-operator$
    threshold: 86
  # Init: the boot machinery itself (mounting, DHCP, the reboot
  # syscall) is exercised by the QEMU harness, not unit tests. The
  # parsers, planners, derivations, and file-shaped actuators around
  # it are tested here against fakes.
  - path: ^init$
    threshold: 72
  # mount(8): the option parser, the command-line parser, and the
  # helper lookup are pure, and the tests cover them against the
  # command lines the kubelet really builds. What stays untested is
  # the mount syscall itself and the exec of a helper, both of which
  # need a real machine.
  - path: ^mount$
    threshold: 68
  # The disks package: GPT and FAT32 are pure byte layout, and the
  # tests check them by round-tripping against the package's own
  # readers. What stays untested is the ioctl that only a real block
  # device answers.
  - path: ^disks$
    threshold: 86
  # The image package: the cpio writer and the deployment layer, and
  # the tests exercise them end to end against fixture trees. What
  # stays untested is a scattering of I/O error returns.
  - path: ^image$
    threshold: 84
  # The log relays: parsing and tailing are pure, or run against real
  # temp files. What stays untested is the real /dev/kmsg device and
  # the clock syscalls.
  - path: ^logs$
    threshold: 85
  # The releases package: publishing, bundling, the corruption drill,
  # and the file server, and the tests exercise them against fixture
  # channels and httptest. What stays untested is Serve's real
  # listener.
  - path: ^releases$
    threshold: 84
  # The scaffold: the interview and the templates, and the tests
  # exercise them with scripted answers. What stays untested is a
  # scattering of I/O error returns.
  - path: ^scaffold$
    threshold: 80
