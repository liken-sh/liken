                  # parameter: the form of the kernel command line, and
                  # the form that
                  # /sys/module/<name>/parameters/<parameter> mirrors.
                  # The pattern checks only the shape. Only a load can show
                  # whether this kernel builds the module, whether the
                  # module has the parameter, and whether the value is
                  # in range. The length bound is there because a key
                  # becomes a file name in the machine's boot record: 64
                  # bytes for the module name, the dot, and 64 for the
                  # parameter name make the longest valid key.
