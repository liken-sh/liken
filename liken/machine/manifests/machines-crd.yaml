                          pattern: ^/dev/[a-zA-Z0-9/_.:=+#@-]+$
                          description: >-
                            The disk that this role is on: a device path
                            (`/dev/vda`), or a stable name under
                            `/dev/disk/by-id/` or `/dev/disk/by-path/`.
                            The system reads this field only on the boot
                            that claims a blank disk. A by-id name
                            belongs to the disk and survives a move to
                            another port. A by-path name belongs to the
                            port. After the claim, the system finds the
                            role's partition by the GPT partition name
                            written on it.
                        size:
                          type: string
                          maxLength: 32
                          pattern: ^[0-9]+(Ki|Mi|Gi|Ti)?$
                          description: >-
                            How much of the disk this role takes, as a
                            binary quantity (`2Gi`). The size is exact,
                            not a request. When it is empty, the role
                            takes the rest of its disk, and only one
                            role on a disk can omit it.
                disks:
                  type: array
                  description: >-
                    Settings of whole disks, one entry for each disk.
                    `maxRequestSize` is the largest single request that
                    the kernel sends to the disk, the
                    `/sys/block/<disk>/queue/max_sectors_kb` attribute.
                    Every machine sets it to `128Ki` on the disk that
                    holds `storage.clusterState`, unless an entry here
                    sets a `maxRequestSize` for that disk, and leaves
                    every other disk at the kernel's value. A machine whose `clusterState` is in
                    memory gets no default. The default keeps etcd's
                    small writes from waiting behind large writes of
                    pods on a shared disk: the Disk settings page of the
                    manual has the measurements. Init applies these
                    settings at boot, before k3s starts, and the
                    operator applies them again on every pass, so an
                    edit takes effect without a reboot. An entry that an
                    edit removes keeps its value until the next boot.
                    The `DiskSettingsApplied` condition reports each
                    entry that the machine could not apply, and
                    `status.hardware.blockDevices` reports the value in
                    effect on each disk and its hardware limit.
                  # The list is a map keyed by device, so the API server
                  # refuses two entries with the same name. Two different
                  # names of one disk pass admission, and the machine
                  # uses the first of them and reports the second
                  # (machine/disksettings.go).
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [device]
                  maxItems: 32
                  items:
                    type: object
                    required: [device]
                    properties:
                      device:
                        type: string
                        maxLength: 256
                        pattern: ^/dev/[a-zA-Z0-9/_.:=+#@-]+$
                        description: >-
                          The disk, by the names that
                          `spec.storage.<role>.device` accepts: a device
                          path (`/dev/sda`), or a stable name under
                          `/dev/disk/by-id/` or `/dev/disk/by-path/`.
                          `status.hardware.blockDevices[].stableNames`
                          lists the stable names of each disk. The
                          machine finds the disk by this name on every
                          boot and every pass, so prefer a by-id name,
                          which follows the disk to another port. A
                          device path can name a different disk after
                          the kernel probes the disks in another order.
                        # A by-uuid name names a filesystem, not a disk.
                        x-kubernetes-validations:
                          - rule: >-
                              !self.startsWith('/dev/disk/') ||
                              self.startsWith('/dev/disk/by-id/') ||
                              self.startsWith('/dev/disk/by-path/')
                            message: >-
                              a disk is named by a /dev name or a name
                              in /dev/disk/by-id or /dev/disk/by-path
                      maxRequestSize:
                        type: string
                        maxLength: 32
                        pattern: ^([0-9]+(Ki|Mi|Gi|Ti)?|Kernel)$
                        description: >-
                          The largest request that the kernel sends to
                          this disk, as a binary quantity (`128Ki`), or
                          `Kernel` to keep the kernel's own value, which
                          turns off the default on the `clusterState`
                          disk. When it is empty, the default applies.
                          The kernel sets the value in whole KiB, and
                          accepts no value below `4Ki` or above the
                          disk's `maxHardwareRequestSize` in
                          `status.hardware.blockDevices`. The machine
                          refuses a value above that limit and keeps
                          the default on the disk.
                        # The kernel refuses a value below one
                        # BLK_MIN_SEGMENT_SIZE and takes KiB, so admission
                        # refuses those values before a machine does. The
                        # hardware limit is known only on the machine.
                        x-kubernetes-validations:
                          - rule: >-
                              self == 'Kernel' ||
                              (quantity(self).compareTo(quantity('4Ki')) >= 0 &&
                              quantity(self).asInteger() % 1024 == 0)
                            message: >-
                              maxRequestSize is Kernel or a whole number
                              of KiB of at least 4Ki
            status:
              type: object
              description: >-
                What the machine observed about itself. Init writes
                these facts as files under `/run/liken/facts`, and the `liken`
                operator publishes them here. The operator derives every
                field again on each reconcile pass and keeps no earlier
                value, so status shows the current state only.
              properties:
                phase:
                  type: string
                  enum: [Unknown, Booting, Lost, Blocked, Updating, UpdatePending, Degraded, Downloading, Ready]
                  description: >-
                    The machine's state in one word. The operator
                    derives it from the conditions on each reconcile
                    pass, so the phase always agrees with them. `Ready`
                    means that every condition holds. `Downloading`
                    means that a release is downloading to the slot that
                    the machine does not run from. The machine keeps
                    serving its workloads during the download, so the
                    download does not count against the cluster's
                    disruption budget.
                    When a machine downloads while another change waits,
                    or while something fails, the phase shows that other
                    state instead. `UpdatePending` and `Updating` mean
                    that a staged change waits for a reboot (`Manual`),
                    waits for this machine's next boot, or is in
                    progress (`Auto`). `Blocked` means that the spec
                    differs from the machine in a way that `liken`
                    refuses to stage or cannot stage. Waiting does not
                    clear this state, and it needs a different edit.
                    `Degraded` covers all other faults. `Booting` means
                    that init has not yet written the facts of this
                    boot. `Unknown` means that the operator cannot read
                    the machine's facts at all. The machine does not
                    report `Lost` about itself. A leader
                    writes it when this machine's heartbeat lease (in
                    `liken-system`) stops, because a machine that is
                    down cannot report its own failure.
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    The `metadata.generation` of the spec that this
                    status reflects. The operator writes it on each
                    pass. Each condition has the same value, but a
                    client that only needs to know whether the operator
                    has seen its edit can read it here, at the top of
                    status, where Kubernetes controllers usually publish
                    it.
                role:
                  type: string
                  description: >-
                    This machine's role in its cluster: a leader, which
                    runs a control plane, or a follower, which runs
                    workloads. Init derives it at boot from the list of
                    leaders in the `Cluster` manifest, and no field
                    declares it.
                version:
                  type: object
                  description: >-
                    Everything that this machine runs: the version of
                    `liken` and each third-party component that the
                    operating system includes. The system reads the
                    kernel and xtables versions from the running
                    machine. The other values come from the components
                    record that the image build wrote beside the image,
                    which has the same pins as the release document. k3s
                    appears here and on the `Node` object, and the two
                    values can differ. The `Node` reports the running
                    kubelet, and this field reports the k3s in the
                    operating system image.
                  properties:
                    liken:
                      type: string
                      description: >-
                        The `liken` version that this machine runs. The
                        build stamps the version into the binary: a
                        release build stamps the release name, and a
                        development build stamps the commit as `git
                        describe` writes it. The operator compares this
                        value with the `spec.version` of the `Cluster`
                        to decide whether this machine needs an upgrade.
                    kernel:
                      type: string
                      description: >-
                        The kernel release, as uname reports it on
                        the running machine.
                    xtables:
                      type: string
                      description: >-
                        The netfilter userspace, as iptables -V
                        reports it: the version and the variant
                        (legacy or nft).
                    k3s:
                      type: string
                      description: >-
                        The k3s release in this operating system image.
                        `liken` vendors one pinned k3s binary for each
                        release.
                    trust:
                      type: string
                      description: >-
                        The date of the CA bundle: the day of the
                        Mozilla root certificates that this machine
                        trusts.
                    e2fsprogs:
                      type: string
                      description: >-
                        The e2fsprogs release that supplied mke2fs,
                        the program that makes the ext4 filesystem
                        on each storage role's partition.
                    openIscsi:
                      type: string
                      description: >-
                        The open-iscsi release that supplied
                        iscsiadm and iscsid, the iSCSI initiator
                        that the iscsi feature uses.
                    nfsUtils:
                      type: string
                      description: >-
                        The nfs-utils release that supplied
                        mount.nfs, the mount helper that the nfs
                        feature uses.
                    wpaSupplicant:
                      type: string
                      description: >-
                        The hostap release that supplied
                        wpa_supplicant, the supplicant that init
                        runs for an interface with a wireless entry.
                    systemdBoot:
                      type: string
                      description: >-
                        The systemd-boot release that supplied the
                        boot menu on liken's install media.
                    grub:
                      type: string
                      description: >-
                        The GRUB release that supplied the boot
                        program that liken writes into a BIOS
                        machine's biosBoot partition.
                    hwdata:
                      type: string
                      description: >-
                        The hwdata release, which supplies the PCI
                        database of vendor and device names.
                    tzdata:
                      type: string
                      description: >-
                        The IANA timezone database release, for example
                        2026c. This is the database that resolves a
                        CronJob's `spec.timeZone` on this machine. Read
                        it when a job runs at an unexpected hour. The
                        value changes only when the machine upgrades to
                        a new release.
                    linuxFirmware:
                      type: string
                      description: >-
                        The linux-firmware release that supplied the
                        driver blobs under /lib/firmware.
                    wirelessRegdb:
                      type: string
                      description: >-
                        The wireless-regdb release that supplied
                        regulatory.db, the database the kernel reads
                        to learn which channels and transmit powers
                        each country allows.
                    microcode:
                      type: string
                      description: >-
                        The CPU microcode release that supplied the
                        early cpio on this machine's boot slot.
                    microcodeRevision:
                      type: string
                      description: >-
                        The microcode revision that the CPUs report.
                        On physical hardware, this value shows
                        whether the early cpio applied. On a virtual
                        machine, this value comes from the
                        hypervisor.
                network:
                  type: object
                  description: >-
                    The network that this boot configured, from DHCP
                    leases and static addresses. The top-level fields
                    give the values of the primary interface: the
                    interface that the `nodeCIDR` of the `Cluster`
                    identifies, or the first interface that came up.
                    `interfaces` gives the detail for each interface.
                  properties:
                    interface:
                      type: string
                      description: >-
                        The primary interface, as the kernel names
                        it (for example, eth0).
                    mac:
                      type: string
                      description: >-
                        The hardware address of the primary
                        interface.
                    addresses:
                      type: array
                      description: >-
                        The addresses of the primary interface, each
                        in CIDR form (10.10.0.5/24).
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                    gateway:
                      type: string
                      description: >-
                        The default gateway of the primary
                        interface. This field is empty when the
                        interface has no default route.
                    nameservers:
                      type: array
                      description: >-
                        The nameservers of the primary interface, in
                        preference order: the nameservers from its
                        DHCP lease, and the nameservers that the
                        manifest declares for it.
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                    leaseExpires:
                      type: string
                      format: date-time
                      description: >-
                        The time when the DHCP lease of the primary
                        interface expires. This field is empty when
                        the interface has a static address.
                    interfaces:
                      type: array
                      description: >-
                        Every interface that this boot configured, with
                        the detail for each one. The top-level fields
                        repeat the values of the primary interface.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: >-
                              This interface, as the kernel names it
                              (for example, eth0). It is the key of
                              this list.
                          mac:
                            type: string
                            description: >-
                              The hardware address of this
                              interface.
                          address:
                            type: string
                            description: >-
                              The address of this interface, in CIDR
                              form (10.10.0.5/24).
                          method:
                            type: string
                            description: >-
                              How the interface got its address: DHCP
                              or Static.
                          gateway:
                            type: string
                            description: >-
                              The default gateway of this interface.
                              This field is empty when the interface
                              has no default route.
                          nameservers:
                            type: array
                            description: >-
                              The nameservers of this interface, in
                              preference order: the nameservers from
                              its DHCP lease, and the nameservers
                              that the manifest declares for it.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                          leaseExpires:
                            type: string
                            format: date-time
                            description: >-
                              The time when the DHCP lease of this
                              interface expires. This field is empty
                              when the interface has a static
                              address.
                          wireless:
                            type: object
                            description: >-
                              The radio's report for this interface. It
                              is present only when the spec gives the
                              interface a `wireless` entry. The
                              addressing fields above describe the same
                              interface after the join, because an
                              address arrives only after the radio
                              associates.
                            properties:
                              ssid:
                                type: string
                                description: >-
                                  The network that the spec names for
                                  this interface.
                              state:
                                type: string
                                enum: [Associating, Connected, WrongKey, NoCarrier, NotRaised]
                                description: >-
                                  What the join did. `Associating` means
                                  that the supplicant is still joining,
                                  or that the radio lost its access
                                  point after the join and the
                                  supplicant is rejoining. The message
                                  names the access point and the reason.
                                  `Connected` means that the radio
                                  associated and the interface then
                                  received its address. `WrongKey` means
                                  that the access point refused the
                                  passphrase, or that the machine has no
                                  passphrase file for this network.
                                  `NoCarrier` means that the radio is
                                  not associated, because no access
                                  point responded, or because another
                                  radio's bring-up did not return and
                                  the machine did not try this one. The
                                  message says which. An access point
                                  that is off and one that is out of
                                  range look the same, so the supplicant
                                  keeps trying, and time can correct
                                  `NoCarrier`. `NotRaised` means that
                                  the kernel call that powers on the
                                  radio did not return, so the driver is
                                  stuck in the kernel, no supplicant ran
                                  on this interface, and the boot went
                                  on without it. Waiting does not
                                  correct `WrongKey` or `NotRaised`. For
                                  `NotRaised`, remove the interface from
                                  the spec, or change the load-time
                                  settings of the driver, and reboot.
                              message:
                                type: string
                                description: >-
                                  The reason for the state, in the
                                  supplicant's words, or in init's words
                                  when the passphrase file itself is the
                                  problem.
                              bssid:
                                type: string
                                description: >-
                                  The BSSID of the access point that the
                                  radio is associated with. It is
                                  present only while the state is
                                  `Connected`. One network can have many
                                  access points, and this field shows
                                  which one carries the machine's
                                  traffic. When the radio moves to
                                  another access point, machine-operator
                                  posts a `Roamed` Event that names
                                  both.
                              frequency:
                                type: integer
                                description: >-
                                  The center frequency of the
                                  access point's channel, in MHz.
                              band:
                                type: string
                                description: >-
                                  The band of that frequency:
                                  2.4GHz, 5GHz, 6GHz, or 60GHz.
                              associatedAt:
                                type: string
                                format: date-time
                                description: >-
                                  When the radio associated with
                                  this access point.
                              lastDisconnectReason:
                                type: integer
                                description: >-
                                  The IEEE 802.11 reason code of the
                                  last time during this boot that the
                                  radio lost an access point, for
                                  example 4 for inactivity or 3 for a
                                  deauthentication. The field is absent
                                  when the radio has not lost one. The
                                  signal level is not in status, because
                                  it changes all the time. The metric
                                  `liken_wireless_signal_dbm` reports
                                  it.
                time:
                  type: object
                  description: >-
                    The state of this machine's clock. Unlike most of
                    status, this field changes during the whole life of
                    the machine, because the system corrects the clock
                    continuously and not only at boot.
                  properties:
                    state:
                      type: string
                      enum: [Synchronized, FreeRunning, Unsynchronized]
                      description: >-
                        Whether the machine corrects its clock against a
                        source that is itself synchronized. When it does
                        not, this field shows whether the cause is the
                        configuration or an outage. `FreeRunning` means
                        that the spec declares no sources, so the
                        machine runs on its hardware clock on purpose.
                        `Unsynchronized` means that the spec declares
                        sources and none of them responds. A fleet that
                        free-runs can agree with itself, but its state
                        stays `FreeRunning`, because agreement within
                        the fleet is not agreement with real time, and
                        certificate validation depends on real time.
                    source:
                      type: string
                      description: >-
                        The source that this machine synchronizes
                        with. On a leader, this is the name of an
                        upstream server. On a follower, this is one
                        of the cluster's leaders.
                    stratum:
                      type: integer
                      description: >-
                        The distance from a reference clock, in NTP's
                        terms: a source at stratum n makes this machine
                        stratum n+1. A server that free-runs on purpose
                        reports 10, the local-clock value. A value of 16
                        means unsynchronized.
                    offset:
                      type: string
                      description: >-
                        An upper bound on the clock's error: ±1ms, ±5ms,
                        ±25ms, ±128ms, ±1s, or >1s. Init measures the
                        clock every 64 seconds, uses the measurement
                        with the shortest round trip of the last eight,
                        and publishes the smallest bound that contains
                        the error. A worse bound is published at once. A
                        better bound is published after three polls in a
                        row inside it. Status has a bound and not the
                        exact error, because
                        the exact error changes at every poll, and each
                        change would cost a status write. The metric
                        `liken_time_offset_seconds`, which
                        machine-operator serves, reports the exact
                        error. The field is empty while `state` is not
                        `Synchronized`, and after a boot that stepped
                        the clock, until the first poll.
                hardware:
                  type: object
                  description: >-
                    What this machine is made of, as the machine
                    observed it. The processor count and the memory come
                    from the boot. The disks and the unclaimed devices
                    stay current while the machine runs, because init
                    watches the kernel's uevents and writes both lists
                    again on every change.
                  properties:
                    cpus:
                      type: integer
                      description: >-
                        The number of logical processors that the
                        kernel makes available. Hardware that has
                        threads counts each thread as one processor.
                    memoryBytes:
                      type: integer
                      description: >-
                        The machine's total usable memory, in bytes, as
                        the kernel reports it. It is less than the
                        installed memory, because the firmware and the
                        kernel reserve some of it.
                    blockDevices:
                      type: array
                      description: >-
                        The machine's storage inventory: every physical
                        disk that the kernel found, whether the spec
                        declares it or not. `name` is the kernel's name
                        for this boot. The kernel assigns names in probe
                        order, so a name identifies the disk for this
                        boot only. `stableNames` identify the disk
                        across boots. `model` and `serial` come from the
                        device itself. `maxRequestSize` and
                        `maxHardwareRequestSize` come from the disk's
                        request queue in sysfs.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: >-
                              This disk, as the kernel names it this
                              boot (vda, nvme0n1). It is the key of
                              this list.
                          sizeBytes:
                            type: integer
                            description: >-
                              The capacity of this disk, in bytes.
                          model:
                            type: string
                            description: >-
                              The model name that the device
                              reports. This field is empty when the
                              device reports none.
                          serial:
                            type: string
                            description: >-
                              The serial number that the device
                              reports. This field is empty when the
                              device reports none.
                          stableNames:
                            type: array
                            description: >-
                              Every name that identifies this disk
                              across boots. `spec.storage.<role>.device`
                              accepts any name in this list. Prefer the
                              first by-id entry. A by-id name follows
                              the disk itself, so it survives a move to
                              a different bay. A by-path name follows
                              the port, so it stops naming the disk
                              after such a move.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                          maxRequestSize:
                            type: string
                            description: >-
                              The largest request that the kernel sends
                              to this disk now, read back from
                              `/sys/block/<name>/queue/max_sectors_kb`,
                              in the syntax of
                              `spec.disks[].maxRequestSize`. It shows
                              the default on the `clusterState` disk,
                              each value of `spec.disks`, and the
                              kernel's value on every other disk.
                          maxHardwareRequestSize:
                            type: string
                            description: >-
                              The largest request that the disk's
                              driver accepts, read from
                              `/sys/block/<name>/queue/max_hw_sectors_kb`.
                              `spec.disks[].maxRequestSize` cannot go
                              above it.
                    unclaimed:
                      type: array
                      description: >-
                        Devices that the kernel found but that no driver
                        controls, because `spec.modules` does not
                        declare the module that the device needs. The
                        list is not a full inventory. A machine that has
                        a driver for all of its hardware reports nothing
                        here. Each entry has the identifier of the
                        device, the candidate modules whose alias
                        patterns match it, and the fix: declare a
                        candidate module that the image has, or upgrade
                        to a release that has one.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [modalias]
                      items:
                        type: object
                        required: [modalias, bus]
                        properties:
                          modalias:
                            type: string
                            description: >-
                              The kernel's identifier for this device:
                              the string that it announces in a uevent
                              and that driver alias patterns match
                              against. It is the key of this list, and
                              it identifies the device exactly when the
                              other fields do not.
                          bus:
                            type: string
                            description: >-
                              The bus that the device is on: pci or
                              usb.
                          name:
                            type: string
                            description: >-
                              The device in words: the manufacturer and
                              product strings of a USB device, or the
                              names from the pci.ids database for a PCI
                              device. When there is no better name, the
                              field has the numeric vendor and device
                              IDs.
                          class:
                            type: string
                            description: >-
                              The coarse kind of the device, decoded
                              from the bus's class code: for
                              example, mass-storage, display, or
                              network.
                          candidates:
                            type: array
                            description: >-
                              The loadable modules whose alias patterns
                              match this device, in the kernel build's
                              order of preference. More than one
                              candidate is usual: USB storage matches
                              both `uas` and `usb_storage`. The person
                              who edits `spec.modules` chooses.
                            items:
                              type: string
                          message:
                            type: string
                            description: >-
                              The fix, in words: declare one of the
                              candidate modules in `spec.modules` when
                              the image has it, or upgrade to a release
                              whose image has one.
                firmware:
                  type: object
                  description: >-
                    The firmware state of this machine: its boot mode
                    and its boot entries. In UEFI mode, this field
                    reports the firmware's boot variables as text. BIOS
                    mode covers every environment that has no firmware
                    variables to read, for example a legacy server or a
                    direct-kernel boot under a hypervisor. This field
                    describes the machine and not the boot. Its values
                    stay through a power cycle, while the system writes
                    `status.boot` again on every boot. Each entry shows
                    the name of the firmware variable and the entry's
                    own description, for example "Boot0001 (liken slot
                    A)".
                  properties:
                    mode:
                      type: string
                      enum: [UEFI, BIOS]
                      description: >-
                        The kind of firmware that started this machine.
                        `UEFI` means that the machine has boot variables
                        that `liken` reads and writes. `BIOS` covers
                        every environment that has no such variables,
                        for example a legacy server or a direct-kernel
                        boot under a hypervisor.
                    bootCurrent:
                      type: string
                      description: >-
                        The entry that this boot came from. In UEFI
                        mode, the value is the firmware's BootCurrent
                        variable. In BIOS mode, it is the liken.slot=
                        parameter on the kernel command line. This
                        field is empty when neither source names an
                        entry, as in a direct-kernel boot.
                    bootNext:
                      type: string
                      description: >-
                        The one-shot entry that is set for the next
                        boot: the firmware's `BootNext` variable in UEFI
                        mode, or `try_slot` in GRUB's environment block
                        in BIOS mode. The next boot uses this entry once
