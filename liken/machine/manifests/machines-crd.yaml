# The Machine API, declared to Kubernetes.
#
# The schema has the same shape as the Go types in the machine package. The descriptions
# are the text that `kubectl explain machine.spec` prints and that the
# Machine reference page of the manual shows.
#
# Init copies this file to /var/lib/rancher/k3s/server/manifests/liken.
# k3s applies every file under /var/lib/rancher/k3s/server/manifests
# when it starts, and again each time a file changes, so `liken` needs
# no `kubectl apply` step. The liken subdirectory keeps the manifests
# that `liken` writes apart from the ones that k3s writes for its own
# components. Init refreshes that subdirectory on every boot and writes
# nothing outside it (init/k3s.go).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # A CRD name has the form <plural>.<group>. The group is a DNS name
  # that the project owns, so Machine types from different organizations
  # cannot conflict.
  name: machines.liken.sh
  annotations:
    # The revision orders this file's schema across releases. When init
    # copies the manifests at boot, it keeps whichever copy of this file
    # has the higher revision. Without this, a machine that boots an
    # older release could replace a newer schema, and the API server
    # would prune the stored fields that only the newer schema declares
    # (init/schemarevision.go). Raise the revision in
    # the same change that changes the schema. A test checks that the
    # two change together.
    liken.sh/schema-revision: "15"
spec:
  group: liken.sh
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
    # `kubectl get liken` lists every kind of the OS layer, as `kubectl
    # get all` lists the workload kinds.
    categories: [liken]
  # Machine is cluster-scoped, like Node. A machine runs the operating
  # system that the cluster runs on, so it belongs to no namespace.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      # These columns are what `kubectl get machines` prints. Most
      # columns show a word from a fixed set and not True or False,
      # because a True/False value shows only that something is wrong,
      # and a word also names the kind of fault.
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .status.role
        # Status is the machine's phase (`status.phase`) in one word.
        # The Ready condition is for programs, and a person who reads a
        # fleet listing reads the phase.
        - name: Status
          type: string
          jsonPath: .status.phase
        # kubectl computes Uptime when it prints, as it does Age: a date
        # column shows the time since its timestamp. The timestamp is
        # the boot time, so Uptime is always current. A stored uptime
        # value would be out of date at once.
        - name: Uptime
          type: date
          jsonPath: .status.boot.time
        - name: Address
          type: string
          jsonPath: .status.network.addresses[0]
        - name: Liken
          type: string
          jsonPath: .status.version.liken
        - name: Kernel
          type: string
          jsonPath: .status.version.kernel
        # Cluster and Spec show the reason of the ClusterConverged and
        # SpecConverged conditions. ClusterConverged is about the
        # Cluster document, and SpecConverged is about this Machine
        # manifest. The columns show the reason and not True or False,
        # because the reasons say why: Converged when nothing is
        # pending, RebootPending when a change waits for a reboot
        # (rebootPolicy Manual), RejectedLastBoot when the machine
        # refused a staged edit on its last boot, and others.
        - name: Cluster
          type: string
          jsonPath: .status.conditions[?(@.type=="ClusterConverged")].reason
        - name: Spec
          type: string
          jsonPath: .status.conditions[?(@.type=="SpecConverged")].reason
        # Time is the clock's state: Synchronized, FreeRunning (the spec
        # declares no upstream sources), or Unsynchronized (the spec
        # declares sources and none of them responds, which is an
        # outage). Offset is an upper bound on the clock's error, such
        # as ±5ms. The exact offset is the metric
        # liken_time_offset_seconds.
        - name: Time
          type: string
          jsonPath: .status.time.state
        - name: Offset
          type: string
          jsonPath: .status.time.offset
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Machine is one computer that runs `liken`. Its spec
            declares the state of the operating system below the
            cluster, and its status records what the operating system
            observes about the machine and its hardware.
          # A partition can only grow, so the API server refuses a role
          # size smaller than the size that the machine last booted
          # with, which status.boot.storage records. The rules compare
          # the spec with the status and not with the previous spec
          # (oldSelf), so a size that the machine could not satisfy can
          # go back down to the size on the disk. The rules are at the
          # root of the schema because they read both spec and status.
          #
          # CEL cannot read the disks, so the operator also compares the
          # spec with the real disk inventory and can refuse a spec that
          # admission accepted. Init never makes a partition smaller at
          # boot.
          #
          # The comparison uses a method because CEL does not support
          # the >= operator on Kubernetes Quantity values, only methods
          # such as isLessThan.
          x-kubernetes-validations:
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.biosBoot) || !has(self.spec.storage.biosBoot.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.biosBoot) || !has(self.status.boot.storage.biosBoot.size) ||
                !quantity(self.spec.storage.biosBoot.size).isLessThan(quantity(self.status.boot.storage.biosBoot.size))
              message: biosBoot cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.bootHome) || !has(self.spec.storage.bootHome.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.bootHome) || !has(self.status.boot.storage.bootHome.size) ||
                !quantity(self.spec.storage.bootHome.size).isLessThan(quantity(self.status.boot.storage.bootHome.size))
              message: bootHome cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.systemA) || !has(self.spec.storage.systemA.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.systemA) || !has(self.status.boot.storage.systemA.size) ||
                !quantity(self.spec.storage.systemA.size).isLessThan(quantity(self.status.boot.storage.systemA.size))
              message: systemA cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.systemB) || !has(self.spec.storage.systemB.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.systemB) || !has(self.status.boot.storage.systemB.size) ||
                !quantity(self.spec.storage.systemB.size).isLessThan(quantity(self.status.boot.storage.systemB.size))
              message: systemB cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.machineState) || !has(self.spec.storage.machineState.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.machineState) || !has(self.status.boot.storage.machineState.size) ||
                !quantity(self.spec.storage.machineState.size).isLessThan(quantity(self.status.boot.storage.machineState.size))
              message: machineState cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.machineEphemeral) || !has(self.spec.storage.machineEphemeral.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.machineEphemeral) || !has(self.status.boot.storage.machineEphemeral.size) ||
                !quantity(self.spec.storage.machineEphemeral.size).isLessThan(quantity(self.status.boot.storage.machineEphemeral.size))
              message: machineEphemeral cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.clusterState) || !has(self.spec.storage.clusterState.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.clusterState) || !has(self.status.boot.storage.clusterState.size) ||
                !quantity(self.spec.storage.clusterState.size).isLessThan(quantity(self.status.boot.storage.clusterState.size))
              message: clusterState cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.podStorage) || !has(self.spec.storage.podStorage.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.podStorage) || !has(self.status.boot.storage.podStorage.size) ||
                !quantity(self.spec.storage.podStorage.size).isLessThan(quantity(self.status.boot.storage.podStorage.size))
              message: podStorage cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.podEphemeral) || !has(self.spec.storage.podEphemeral.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.podEphemeral) || !has(self.status.boot.storage.podEphemeral.size) ||
                !quantity(self.spec.storage.podEphemeral.size).isLessThan(quantity(self.status.boot.storage.podEphemeral.size))
              message: podEphemeral cannot be smaller than the size this machine booted with. A partition can only grow.
          properties:
            spec:
              type: object
              description: >-
                The declared state of this machine. Init applies the
                spec at boot. While the machine runs, the `liken`
                operator applies changes to `sysctls`, `disks`,
                `hostEntries`, `nodeLabels`, and `nodeTaints`, to
                modules that the spec adds, and to `serio` entries that
                the spec adds. A
                change to `network`, `storage`, or `rlimits`, a removed
                module or `serio` entry, a changed module order, and a
                changed module parameter take effect at the next boot.
              # This rule is at the spec level because it reads two
              # fields. A key of moduleParameters names a module, and
              # only the module list says which modules this machine
              # loads. The comparison is exact. A kernel treats "-" and
              # "_" in a module name as the same character, but
              # admission does not, so a key must spell the module as
              # the module list spells it.
              x-kubernetes-validations:
                - rule: >-
                    !has(self.moduleParameters) ||
                    (has(self.modules) &&
                    self.moduleParameters.all(k, self.modules.exists(m, k.startsWith(m + '.'))))
                  message: >-
                    every moduleParameters key must start with a module
                    that modules declares, spelled the same way, and
                    then a dot
              properties:
                network:
                  type: object
                  description: >-
                    The machine's network configuration. When the field
                    is empty, the machine uses DHCP on the first
                    physical interface. Init applies this configuration
                    at boot. The operator cannot apply an edit while the
                    machine runs, because the cluster reaches the
                    machine through the addresses that the edit changes.
                    So the operator stages an edit, as it does for
                    `storage`, and the next boot applies it.
                    `rebootPolicy` sets who starts that boot, and
                    `status.boot.network` reports the network that the
                    running boot started with. An address from DHCP must
                    stay stable. k3s reads the node's address when it
                    starts, and a different address from a later lease
                    does not take effect while the machine runs.
                    Configure the DHCP server to reserve a fixed address
                    for each machine that uses DHCP.
                  properties:
                    interfaces:
                      type: array
                      description: >-
                        The machine's interfaces, each named as the
                        kernel names it. A machine in a cluster usually
                        declares two: an uplink that uses DHCP, and an
                        interface for the cluster network, with the
                        static address that its peers use to reach it.
                      # The list is a map keyed by interface name, so
                      # the API server refuses a manifest that declares
                      # one interface twice.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            maxLength: 15
                            description: >-
                              The interface to configure, named as
                              the kernel names it (for example,
                              eth1).
                          address:
                            type: string
                            maxLength: 64
                            pattern: ^[0-9a-fA-F:.]+/[0-9]{1,3}$
                            description: >-
                              A static address in CIDR form, for
                              example 10.10.0.1/24. The prefix length
                              gives the kernel the subnet. An empty
                              field selects DHCP on this interface.
                          gateway:
                            type: string
                            maxLength: 64
                            pattern: ^[0-9a-fA-F:.]+$
                            description: >-
                              The gateway address. When it is set, the
                              default route goes through this
                              interface. The field is
                              optional, including on an interface with a
                              static address, because a DHCP lease on
                              another interface can supply the default
                              route.
                          nameservers:
                            type: array
                            description: >-
                              The nameservers for this interface, in
                              preference order. The machine uses them in
                              addition to the nameservers from a DHCP
                              lease. The machine writes at most three
                              nameservers to resolv.conf, in interface
                              order.
                            # This list is atomic. The order of
                            # nameservers is the order of preference, so
                            # the whole list is replaced.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                              maxLength: 253
                          wireless:
                            type: object
                            required: [ssid]
                            description: >-
                              The wireless network that this interface
                              joins. When this field is absent, the
                              interface is wired. The machine runs
                              wpa_supplicant for the interface and
                              applies the addressing fields above after
                              the radio associates, so the interface
                              gets its address the same way a wired one
                              does. A machine that already has a wired
                              path to its cluster does not wait for the
                              radio. It boots, joins the wireless
                              network in the background, and
                              `status.network.interfaces[].wireless`
                              shows whether the join succeeded.
                              The passphrase is never part of this
                              document. The installer writes it to a
                              file on the machine, named for the SSID,
                              under /etc/liken/psk/.
                            properties:
                              ssid:
                                type: string
                                maxLength: 32
                                # The SSID is the name of the passphrase
                                # file, so it must be usable as the last
                                # part of a path. The pattern accepts
                                # every such name. It refuses the empty
                                # name, the names "." and "..", and any
                                # name that contains a "/".
                                pattern: '^([^./][^/]*|\.[^./][^/]*|\.\.[^/]+)$'
                                description: >-
                                  The network's name, exactly as the
                                  access point advertises it, at most 32
                                  octets. The installer names the
                                  passphrase file after this name under
                                  /etc/liken/psk/, so a name that cannot
                                  be the last part of a file path is
                                  refused.
                              security:
                                type: string
                                enum: [wpa-psk, open]
                                default: wpa-psk
                                description: >-
                                  How the machine joins the network.
                                  `wpa-psk` joins a WPA2 or WPA3
                                  personal network with one passphrase,
                                  and the supplicant negotiates the
                                  strongest protocol that the access
                                  point offers. `open` joins a network
                                  with no encryption and needs no
                                  passphrase file.
                    hostEntries:
                      type: array
                      maxItems: 64
                      description: >-
                        Static entries for /etc/hosts. Each entry is one
                        address and the names that resolve to it. Init
                        writes each entry as a line after the fixed
                        lines for localhost and this machine's own name,
                        so an entry can add a name but cannot override
                        those two. On every boot, init also writes
                        /etc/nsswitch.conf with `hosts: files dns`, so
                        every resolver on the machine reads the hosts
                        file before it queries DNS. So a program on the
                        host, such as the NFS mount helper, resolves
                        these names without cluster DNS. Init writes the
                        entries at boot. The `liken` operator writes
                        them again when this field changes, so an edit
                        takes effect without a reboot. It also writes
                        them again when another process rewrites or
                        deletes the hosts file. `status.hostEntries`
                        reports the entries that the hosts file
                        contains, read back after each pass.
                      # The list is a map keyed by address, because each
                      # address is one line of the file. The API server
                      # refuses a manifest that declares one address
                      # twice.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [address]
                      x-kubernetes-validations:
                        - rule: >-
                            self.all(e, !e.names.exists(n, n == 'localhost'))
                          message: >-
                            init writes localhost in the fixed lines
                            at the top of /etc/hosts, so an entry
                            cannot list it
                      items:
                        type: object
                        required: [address, names]
                        properties:
                          address:
                            type: string
                            maxLength: 64
                            pattern: ^[0-9a-fA-F:.]+$
                            description: >-
                              The address that this entry resolves to:
                              an IPv4 or IPv6 literal, with no prefix
                              length. Init writes this text into
                              /etc/hosts as it is.
                          names:
                            type: array
                            minItems: 1
                            # The CEL rule above iterates this list. The
                            # API server estimates a rule's cost from the
                            # largest list that the schema allows, and it
                            # refuses the whole CRD when a rule iterates
                            # an unbounded list.
                            maxItems: 20
                            description: >-
                              The names that resolve to this address, at
                              most 20, for example `[nas,
                              nas.home.arpa]`. Each name is lowercase,
                              because DNS compares names without regard
                              to case, and one spelling keeps the file
                              readable.
                            # Order has no meaning, and a merge replaces
                            # the whole list.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                sysctls:
                  type: object
                  description: >-
                    Kernel parameters to set, from a parameter name to
                    its value, for example `vm.overcommit_memory: "1"`.
                    Init applies the values at boot, and the `liken`
                    operator applies them again on every pass, so an
                    edit takes effect without a reboot. `liken` sets its
                    own values for some parameters before it applies
                    this field, so a name here overrides the value of
                    `liken` for that parameter. The Kernel settings page
                    of the manual lists those parameters and the reason
                    for each. `status.sysctls` reports both sets
                    together, read back from the kernel. A name is the
                    kernel's dotted name, or a path under /proc/sys with
                    slashes when a segment contains a dot, as in
                    `net/ipv4/conf/eth0.100/forwarding`.
                  # The cap leaves room for every parameter that a
                  # machine could need. It also bounds the cost of the
                  # key rule below, because the API server refuses a
                  # rule that runs over every key of an unbounded map.
                  maxProperties: 128
                  additionalProperties:
                    type: string
                  # A name must be a path under /proc/sys. The operator
                  # refuses a name that is absolute, climbs out with
                  # "..", or has an empty segment (machine/sysctl.go),
                  # and it retries that failure after a delay that starts
                  # at ten seconds and doubles up to five minutes
                  # (machine-operator/retry.go).
                  # Admission refuses such a name first, so the person
                  # who wrote it sees the reason at once. A dotted name has segments of letters, digits,
                  # and _:@+-. The segments of a slashed name can also
                  # contain dots, as an interface name such as eth0.100
                  # does, but a segment cannot consist only of dots.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(key, key.size() <= 255 && key.matches('^([A-Za-z0-9_:@+-]+([.][A-Za-z0-9_:@+-]+)*|[.]*[A-Za-z0-9_:@+-][A-Za-z0-9_:@+.-]*(/[.]*[A-Za-z0-9_:@+-][A-Za-z0-9_:@+.-]*)+)$'))
                      message: >-
                        a sysctl name is the kernel's dotted name, such
                        as vm.max_map_count, or a path under /proc/sys
                        with slashes, such as
                        net/ipv4/conf/eth0.100/forwarding. It cannot be
                        absolute, climb out with "..", or have an empty
                        segment
                rlimits:
                  type: object
                  description: >-
                    Resource limits to set, from a resource name to its
                    limit, for example `nofile: "1048576"`. These are
                    the per-process limits that a systemd distribution
                    sets with the `Limit*` directives of a service.
                    `liken` has no systemd, so init applies them to
                    itself before it starts k3s, and every process on
                    the machine inherits them, including k3s,
                    containerd, and the containers. `liken` sets its own
                    limits before it applies this field, so a name here
                    overrides the limit of `liken` for that resource.
                    `status.rlimits` reports the limits in force, read
                    back from the kernel after both are applied. Unlike
                    `sysctls`, an edit here needs a reboot. A process
                    copies its limits from its parent when it starts, so
                    init applies the limits only before it starts k3s,
                    and k3s and its containers keep the limits that they
                    started with. `rebootPolicy` sets who starts that
                    reboot.
                  additionalProperties:
                    type: string
                    description: >-
                      A limit in the same form as a systemd unit file: a
                      bare number sets both the soft and the hard limit,
                      `infinity` means no limit, and `soft:hard` sets
                      them separately. The soft limit is the one in
                      force. A process can raise its own soft limit up
                      to its hard limit but not above it.
                    pattern: ^(infinity|[0-9]{1,20})(:(infinity|[0-9]{1,20}))?$
                    maxLength: 41
                  # The kernel has one limit for each of these names and
                  # no others, so admission refuses a misspelled name.
                  # Otherwise init would skip it at boot and print only
                  # a console line.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(r, r in ['nofile', 'nproc', 'core',
                        'memlock', 'stack', 'fsize', 'nice'])
                      message: >-
                        a resource must be one of nofile, nproc, core,
                        memlock, stack, fsize, or nice
                modules:
                  type: array
                  description: >-
                    Extra kernel modules that this machine loads at
                    boot, after the fixed list that the operating system
                    needs. Use it for the drivers of the hardware that
                    this machine's workloads use. The image has the
                    whole module tree of its kernel, so any module that
                    the kernel has can be listed here. `status.modules`
                    reports the result for each name, including a name
                    that the kernel has no module for. Adding a name
                    takes effect without a reboot, because the machine
                    can load a driver while it runs. Removing a name
                    needs a reboot. Admission checks only the shape of a
                    name, because only a load can show whether the
                    module exists. A module's load-time settings go in
                    `moduleParameters`, and they apply when the module
                    loads. The machine loads the modules in the order of
                    this list, and the order decides which driver claims
                    a device. For a sound device, list the codec's
                    driver before the controller's driver. Otherwise the
                    controller binds the codec to the generic driver,
                    and the codec's outputs do not appear. A change to
                    the order alone is staged for the next boot. The
                    machine does not request a reboot for it, and it
                    loads the new order at its next boot, whatever the
                    cause of that boot.
                  # The list is a set for admission, so the API server
                  # refuses duplicates. The order still matters when the
                  # machine loads the modules, because it loads them in
                  # list order. A module that is already loaded as
                  # another module's dependency cannot take parameters
                  # when its own turn comes, so list a module that has
                  # parameters before any module that depends on it.
                  x-kubernetes-list-type: set
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 64
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                moduleParameters:
                  type: object
                  description: >-
                    Parameters to load modules with, from
                    `<module>.<parameter>` to a value, for example
                    `snd_hda_intel.power_save: "0"`. A key has the
                    kernel's own spelling, the same form that the kernel
                    command line uses, and its module part must be a
                    module that `spec.modules` declares, spelled the
                    same way. A parameter applies when the module loads,
                    so changing one on a module that the machine already
                    loaded takes effect at the next reboot. A parameter
                    cannot reach a module that is built into the kernel,
                    or a module that was loaded before the declared
                    modules. The `ModuleParametersApplied` condition
                    reports both cases and the fix.
                    `status.boot.moduleParameters` records what was
                    declared, and `status.modules[].parameters` records
                    what the kernel reports.
                  # The cap matches maxItems of the module list.
                  maxProperties: 64
                  additionalProperties:
                    type: string
                    description: >-
                      The value, exactly as the kernel's parser reads
                      it. Spaces and double quotes are refused, because
                      the parameter string is separated by spaces and
                      the kernel treats a double quote as a grouping
                      character. An array parameter takes its values
                      separated by commas, as the kernel spells it. An
                      empty value is refused.
                    maxLength: 256
                    pattern: ^[^\s"]+$
