                  type: string
                  enum: [Auto, Manual]
                  default: Manual
                  description: >-
                    Who starts a reboot that the machine needs. The
                    machine needs a reboot when a change to `storage`,
                    `network`, `rlimits`, `modules`, `moduleParameters`,
                    or `serio` can take effect only at boot. The
                    operator finds these changes as drift between the
                    spec and `status.boot`. With `Manual`, the default,
