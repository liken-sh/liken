                    - rule: >-
                        self.all(k, k.matches('^[A-Za-z0-9][A-Za-z0-9_-]*[.][A-Za-z0-9][A-Za-z0-9_-]*$'))
                      message: >-
                        a key is a module name, a dot, and a parameter
                        name, for example snd_hda_intel.power_save
                    - rule: self.all(k, size(k) <= 129)
                      message: >-
                        a key is at most 129 characters: 64 for the
                        module name, one dot, and 64 for the parameter
                        name
                serio:
                  type: array
                  description: >-
                    Serial-line devices that need a program to attach
                    the serial line to the kernel's serio layer, and to
                    keep it attached, before the kernel driver binds. A
                    USB-CEC adapter is one. Each entry names a protocol
                    and the USB device whose serial line carries it. The
                    machine attaches every serial line whose USB device
                    matches the entry and keeps the attachment until
                    shutdown, so the protocol's driver binds and creates
                    its devices. An entry loads no module.
                    `spec.modules` must list the line driver
                    (`cdc_acm`), `serport`, and the protocol's driver
                    (for example `pulse8_cec`). `status.serio` reports
                    each attachment and the device nodes that it
                    created, and the `SerioAttached` condition names the
                    first entry that is not attached. The device
                    inventory does not publish a serial line that an
                    entry matches. It publishes what the attached driver
                    creates. Adding an entry takes effect without a
                    reboot, as adding a module does. Removing one takes
                    effect at the next boot.
                  # An exact duplicate would start two programs that
                  # attach the same line. The list cannot be a set,
                  # because the API server accepts list-type set for
                  # scalar items only. So a rule refuses a duplicate.
                  x-kubernetes-list-type: atomic
                  maxItems: 8
                  x-kubernetes-validations:
                    - rule: self.all(a, self.exists_one(b, b == a))
                      message: declare each serio entry once
                  items:
                    type: object
                    required: [protocol, usb]
                    properties:
                      protocol:
                        type: string
                        # The enum is the protocol table in
                        # machine/serio.go, and a test keeps the two
                        # equal. Add a protocol only after the device
                        # has been tested on a `liken` machine.
                        enum: [pulse8-cec, rainshadow-cec]
                        description: >-
                          The protocol the device speaks. pulse8-cec
                          is the Pulse-Eight USB-CEC adapter:
                          9600 baud, serio type 0x40, and the
                          pulse8_cec driver. rainshadow-cec is the
                          RainShadow Tech HDMI-CEC adapter: 9600
                          baud, serio type 0x41, and the
                          rainshadow_cec driver. The values are the
                          ones inputattach uses for the same device.
                      usb:
                        type: object
                        description: >-
                          The USB device whose serial line carries the
                          protocol. The match uses the identity of the
                          hardware and not the tty name, because the
                          kernel numbers ttyACM0 and ttyACM1 in the
                          order that the devices are plugged in.
                        required: [vendor, product]
                        properties:
                          vendor:
                            type: string
                            pattern: ^[0-9a-f]{4}$
                            description: >-
                              The USB vendor ID, four lowercase hex
                              digits with no prefix: the same
                              spelling as the vendor attribute that
                              the device inventory publishes, for
                              example "2548".
                          product:
                            type: string
                            pattern: ^[0-9a-f]{4}$
                            description: >-
                              The USB product ID, four lowercase hex
                              digits with no prefix, for example
                              "1002".
                          serial:
                            type: string
                            pattern: ^[!-~]{1,126}$
                            description: >-
                              The USB serial number of one unit.
                              With it, the entry attaches only the
                              device that reports this serial number.
                              Without it, the entry attaches every
                              device of this vendor and product that
                              no entry with a serial attaches. An
                              entry with a serial takes its device
                              first, whatever the order of the list.
                nodeLabels:
                  type: object
                  maxProperties: 64
                  description: >-
                    Labels to put on this machine's `Node`. Workloads
                    select on these labels, for example to find the
                    machine that has a GPU or the machine on
                    battery-backed power. Init writes the labels into
                    the k3s boot configuration, so the node has them
                    when it registers. The `liken` operator then
                    reconciles them while the machine runs. It sets the
                    declared value on a label that the node already has,
                    and it removes a label that this spec declared
                    earlier and no longer declares. The kubelet does not
                    remove a label when it leaves the boot
                    configuration, so without the operator a removed
                    label stays on the node until someone runs `kubectl
                    label`. The operator never changes a label that this
                    spec has not declared. A key cannot
                    start with `liken.sh/`, because the operating system
                    sets its own labels there. A key in a subdomain of
                    `liken.sh` is allowed. For example, when
                    equipment-operator is installed,
                    `equipment.liken.sh/cec: none` keeps its DaemonSet
                    from placing a pod on this machine.
                  # Init passes these labels to the kubelet at
                  # registration. k3s enables the NodeRestriction
                  # admission plugin, and a kubelet that registers with
                  # a kubernetes.io or k8s.io label outside its
                  # allowlist does not start. So the second rule accepts
                  # only the labels that the kubelet may set on itself:
                  # hostname, arch, os, the topology region and zone,
                  # and any key in the kubelet.kubernetes.io and
                  # node.kubernetes.io namespaces, which include
                  # node.kubernetes.io/instance-type. The rule refuses
                  # node-role.kubernetes.io, which the cleanup after a
                  # demotion reads.
                  #
                  # The third rule refuses the liken.sh/ prefix, because
                  # the image's k3s configuration sets liken.sh/machine
                  # there, and a label from the spec could conflict with
                  # it. A subdomain such as
                  # equipment.liken.sh is allowed, because an operator's
                  # DaemonSet stays off a node labeled
                  # <group>/<hardware>: none, and the Machine is where a
                  # person declares that label.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(key, key.size() <= 317 && key.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                      message: >-
                        a label key is an optional DNS-style prefix, a
                        slash, and a name that contains letters,
                        digits, dashes, underscores, and dots
                    - rule: >-
                        self.all(key, !key.matches('^([^/]*[.])?(kubernetes[.]io|k8s[.]io)/') ||
                        key in ['kubernetes.io/hostname', 'kubernetes.io/arch', 'kubernetes.io/os', 'topology.kubernetes.io/region', 'topology.kubernetes.io/zone'] ||
                        key.matches('^([^/]*[.])?(kubelet[.]kubernetes[.]io|node[.]kubernetes[.]io)/'))
                      message: >-
                        the kubernetes.io and k8s.io namespaces belong to
                        Kubernetes, and the kubelet does not start with a
                        label from them. Use only the labels that the
                        kubelet sets for itself: hostname, arch, os,
                        topology.kubernetes.io zone and region, and the
                        kubelet.kubernetes.io and node.kubernetes.io
                        namespaces
                    - rule: >-
                        self.all(key, !key.matches('^liken[.]sh/'))
                      message: >-
                        a label key cannot start with liken.sh/,
                        because the operating system sets its own
                        labels there. A key in a subdomain, such as
                        equipment.liken.sh/cec, is allowed
                  additionalProperties:
                    type: string
                    maxLength: 63
                    pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                nodeTaints:
                  type: array
                  maxItems: 64
                  description: >-
                    Taints to put on this machine's `Node`. A taint
                    repels every pod that does not tolerate it, so it
                    keeps other work off a machine that is dedicated to
                    one job. Init writes the taints into the k3s boot
                    configuration, so a node that registers for the
                    first time has them from registration. The kubelet
                    applies registration taints only when it creates the
                    `Node` object, on a first boot or after a reinstall.
                    On every later boot the `Node` already exists and
                    the boot configuration changes nothing, so from then
                    on the `liken` operator reconciles this list while
                    the machine runs, including the removal of a taint
                    that this spec no longer declares. The operator
                    never changes a taint that was applied outside this
                    spec.
                  # A taint's identity is its key and its effect
                  # together, because one key can have two effects at
                  # once. The list is a map keyed on that pair, so the
                  # API server refuses a duplicate pair.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [key, effect]
                  # The label rules protect the boot, because the kubelet
                  # does not start with a forbidden label. NodeRestriction
                  # does not check a registration taint, so a taint
                  # cannot stop a boot. The taint rule protects against a
                  # Kubernetes controller that adds and removes taints on
                  # the same key while the machine runs. So
                  # node.kubernetes.io is allowed for a label and
                  # refused for a taint.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(t, !t.key.matches('^([^/]*[.])?(kubernetes[.]io|k8s[.]io)/') ||
                        t.key.matches('^node-role[.]kubernetes[.]io/'))
                      message: >-
                        the kubernetes.io and k8s.io namespaces belong to
                        Kubernetes. The node lifecycle controller and the
                        scheduler manage the node.kubernetes.io taint keys
                        while the machine runs, adding and removing them as
                        the node's condition changes, and they would remove
                        or replace a declared taint on one of those keys.
                        Use node-role.kubernetes.io, which no controller
                        manages, or a namespace of your own
                  items:
                    type: object
                    required: [key, effect]
                    properties:
                      # A label key gets its shape from a CEL rule,
                      # because a map's keys are not properties and a
                      # pattern cannot reach them. A taint's key is a
                      # property of a list item, so the same shape is a
                      # pattern here.
                      key:
                        type: string
                        maxLength: 317
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$
                        description: >-
                          The taint's key: an optional DNS-style prefix,
                          a slash, and a name that contains letters,
                          digits, dashes, underscores, and dots. A
                          toleration names this key and the effect to
                          match the taint.
                      value:
                        type: string
                        maxLength: 63
                        pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                        description: >-
                          An optional value that goes with the key. A
                          taint often needs none, because the key and
                          the effect alone say to stay off this
                          machine. A toleration that names a value
                          must name the same value.
                      effect:
                        type: string
                        enum: [NoSchedule, PreferNoSchedule, NoExecute]
                        description: >-
                          What happens to a pod that does not tolerate
                          this taint. `NoSchedule` keeps new pods off
                          the node and leaves the running pods alone.
                          `PreferNoSchedule` tells the scheduler to
                          avoid the node, but the scheduler still places
                          a pod there when no other node fits.
                          `NoExecute` keeps new pods off and also evicts
                          every running pod that has no matching
                          toleration, when the taint is added. That
                          includes DaemonSet pods, because the DaemonSet
                          controller adds tolerations only for the node
                          lifecycle taint keys.
