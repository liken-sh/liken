                boot:
                  type: object
                  description: >-
                    The record of this boot. The system writes this
                    record again on every boot, and the operator
                    compares the spec against it to find drift. Compare
                    it with `firmware`, which stays the same through
                    reboots. The manifest sources say which documents
                    the boot used: the staged copy that waits for its
                    proving boot, the proven last-known-good copy, or,
                    on the first boot only, the copy in the image (the
                    seed). The system records the sources separately for
                    the Machine manifest and the Cluster document,
                    because they are staged and proven independently.
                    The hashes identify the exact bytes. The `storage`,
                    `network`, `modules`, `moduleParameters`, `rlimits`,
                    and `serio` fields record the spec as the boot
                    applied it, and the operator compares the current
                    spec with them to find drift. `rejection` and
                    `clusterRejection` record a staged document that the
                    machine refused. A rejection stays until a different
                    edit passes its proving boot.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The time when this machine booted. Init computes
                        it from the kernel's uptime counter. It is in
                        the boot record because it has the same lifetime
                        as the record: a reboot changes it, and an
                        in-place k3s restart does not. The `Uptime`
                        printer column shows this timestamp as elapsed
                        time.
                    manifestSource:
                      type: string
                      enum: [Staged, Proven, Seed]
                      description: >-
                        The copy of the Machine manifest that this boot
                        used. `Staged` is a copy that waits for its
                        proving boot. `Proven` is the last-known-good
                        copy. `Seed` is the manifest in the image, which
                        only a first boot uses.
                    manifestHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        Machine manifest that this boot used. The
                        operator compares this hash with the hash of
                        the manifest in the cluster to find drift.
                    clusterManifestSource:
                      type: string
                      enum: [Staged, Proven, Seed]
                      description: >-
                        The copy of the Cluster document that this boot
                        used, with the same values as `manifestSource`.
                        The system records the two documents separately,
                        because each is staged and proven on its own, so
                        a machine can be current on one document and
                        drifted on the other.
                    clusterManifestHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        Cluster document that this boot used.
                    credentialsSource:
                      type: string
                      # This field has no Seed value because the
                      # operator is the only writer of the credentials
                      # document, so no image has one and no first boot
                      # reads one.
                      enum: [Staged, Proven]
                      description: >-
                        The copy of the registry-credentials document
                        that this boot, or the most recent k3s restart,
                        wrote into registries.yaml. The field is absent
                        on a machine that never had credentials, which
                        is the usual case. That machine pulls images
                        anonymously.
                    credentialsHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        registry-credentials document that this
                        boot, or the most recent k3s restart, wrote
                        into registries.yaml. This field is absent
                        on a machine that never had credentials.
                    importsSource:
                      type: string
                      # This field has no Seed value because the record
                      # describes this disk's own container store, so
                      # nothing in an image can replace it.
                      enum: [Staged, Proven]
                      description: >-
                        The imported-images record that this boot used.
                        `Staged` means that the tarballs are on trial:
                        the operator has not yet proven that the
                        container store serves them. `Proven` is the
                        usual state, where every tarball matches the
                        record. The field is absent when the import
                        process does not run (a memory-backed
                        machineState or a memory-backed container
                        store).
                    importsHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        imported-images record that this boot used.
                        This field is absent when the import
                        process does not run.
                    importsDiscarded:
                      type: boolean
                      description: >-
                        `true` when this boot found an imports trial
                        from an earlier boot that stopped before it
                        proved the trial. This boot then discarded the
                        container store instead of trusting it. The
                        operating system images unpack again from this
                        boot's tarballs, and workload images are pulled
                        again.
                    restarts:
                      type: integer
                      description: >-
                        The number of in-place k3s restarts in this
                        boot. A restart applies a change that needs only
                        a k3s restart, for example a feature toggle or
                        the registry configuration. A restart increases
                        this field and does not change `time`. A reboot
                        changes `time` and sets this field to zero.
                    slot:
                      type: string
                      enum: [A, B]
                      description: >-
                        The system slot that this boot came from, read
                        from the `liken.slot=` parameter of the boot
                        entry that started it. The field is absent when
                        the boot did not come from a slot (a
                        direct-kernel boot or install media).
                    commandLine:
                      type: string
                      maxLength: 4096
                      description: >-
                        The kernel command line that this boot ran with,
                        whole and unparsed. `slot` is one parameter from
                        it. No field sets this line: `liken` writes each
                        machine's boot entries itself, with the console,
                        the machine, and the slot. The line is reported
                        because a machine reads it before it reads any
                        file, so it is the first thing to check when one
                        machine behaves differently from other machines
                        on the same release.
                    storage:
                      type: object
                      description: >-
                        The storage that the manifest of this boot
                        declared, recorded as applied whatever the
                        result for each role was. A boot with the same
                        manifest claims the same disks, so this field is
                        the reference for drift. `status.storage`
                        reports what backs each role now. An edit to
                        `spec.storage` has converged when the two agree.
                      properties:
