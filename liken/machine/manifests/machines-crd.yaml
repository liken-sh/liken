                                value, so the kubelet uses 85.
                            lowThresholdPercent:
                              type: integer
                              description: >-
                                The disk usage that stops collection,
                                as a percent of the same filesystem.
                                It is absent when the cluster names no
                                value, so the kubelet uses 80.
                            maximumAge:
                              type: string
                              maxLength: 32
                              description: >-
                                How long an unused image may stay in
                                the store before the kubelet removes
                                it, whatever the disk usage is. It is
                                absent when the cluster names no
                                value, so the kubelet does no age
                                check and only the thresholds prune
                                the store.
                            minimumAge:
                              type: string
                              maxLength: 32
                              description: >-
                                How long an unused image is kept
                                before the kubelet may remove it. It
                                is absent when the cluster names no
                                value, so the kubelet uses two
                                minutes.
                    containerd:
                      type: object
                      description: >-
                        The containerd configuration that init wrote on
                        this machine, from the Cluster's
                        `spec.runtime.containerd`. This field is absent
                        when the cluster names no setting, so init wrote
                        no drop-in and containerd runs on its own
                        defaults.
                      properties:
                        logLevel:
                          type: string
                          maxLength: 16
                          description: >-
                            The log level that this machine's
                            containerd runs at. It is absent when the
                            cluster names no level, so containerd uses
                            info.
                    etcd:
                      type: object
                      description: >-
                        The etcd configuration that init wrote on this
                        machine, from the Cluster's
                        `spec.runtime.etcd`. This field is absent on a
                        follower, and on a leader of a cluster that
                        sets `exposeMetrics` to `false`.
                      properties:
                        exposeMetrics:
                          type: boolean
                          description: >-
                            True when init told k3s to serve etcd's
                            metrics on port 2381 of this machine's node
                            IP. It is also true on the leader of a
                            cluster with one leader, which runs no etcd,
                            so nothing listens on the port there.
                lastCrash:
                  type: object
                  description: >-
                    The most recent kernel crash that this machine still
                    has records for. When the kernel panics, it writes
                    the end of its log to the firmware's storage, and
                    the next boot moves that record to the machine's own
                    disk. Each boot derives this summary again from the
                    records. The crash is not always from the previous
                    boot. The summary stays until the records pass the
                    machine's retention window, and `time` shows how old
                    the crash is. An empty field means that the machine
                    has no crash records.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The machine's own clock at the time of the
                        crash. A crash usually occurs before the
                        boot's first clock synchronization, so this
                        time comes from the hardware clock.
                    reason:
                      type: string
                      maxLength: 32
                      description: >-
                        The kernel's word for the crash. The kernel that
                        `liken` ships records `Panic` and `Oops`. The
                        kernel defines these words, so this field is a
                        free string and not a fixed list.
                    message:
                      type: string
                      maxLength: 1024
                      description: >-
                        The kernel's first description of the failure,
                        in the kernel's own words: the "Kernel panic -
                        not syncing:" line, or the "BUG:" line of an
                        oops.
                    records:
                      type: string
                      maxLength: 256
                      description: >-
                        The directory on the machine that holds the
                        full end of the kernel log: a directory in
                        the crash store under machineState, or
                        /sys/fs/pstore on a machine whose
                        machineState runs in memory.
                lastFailStop:
                  type: object
                  description: >-
                    The last boot that this machine refused to run. Init
                    stops a boot when it cannot tell which configuration
                    is its own, or when it cannot satisfy a declared
                    storage role. A machine that runs with the wrong
                    configuration can do damage that a reboot does not
                    undo, so init powers the machine off. The refusal
                    writes its reason to the machine's own disk, and the
                    next boot reports it here. The refusal is not always
                    from the previous boot, and `time` shows how old it
                    is. Nothing clears this field, and the next refusal
                    replaces it. An empty field means that this machine
                    has never refused a boot, or that the role that it
                    could not satisfy is the role that stores the record.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The machine's own clock at the refusal. A boot
                        stops before its first clock synchronization,
                        so this time comes from the hardware clock.
                    reason:
                      type: string
                      maxLength: 1024
                      description: >-
                        Init's own words for the refusal, the same
                        text that the console printed before the
                        machine powered off.
                conditions:
                  type: array
                  description: >-
                    The conditions that the operators keep on this
                    machine, in the standard Kubernetes form. Each pass
                    writes every condition again. `Ready` summarizes the
                    others. It is `True` only when every other
                    condition is `True`, except `SerioAttached`,
                    `ClockSynchronized`, and `RebootApproved`. The other
                    conditions each report one check. `FactsPublished`
                    reports the facts that init writes.
                    `SysctlsApplied`, `DiskSettingsApplied`,
                    `HostEntriesApplied`, `StorageReady`, `ModulesLoaded`,
                    `ModuleParametersApplied`, `FeaturesReady`,
                    `WirelessJoined`, `NodeLabelsApplied`, and
                    `NodeTaintsApplied` report the parts of the spec
                    that init or the operator applies. `NodeHealthy`
                    reports the `Ready` condition of the `Node`.
                    `NodeCurrent` reports the cleanup after a demotion.
                    `RebootRequestHonored` reports the reboot that a
                    person's `Disruption` requests. `SpecConverged`,
                    `ClusterConverged`, `VersionConverged`,
                    `CredentialsConverged`, and `ImportsConverged`
                    report the documents and the release that this boot
                    ran under. `SerioAttached` reports the serial-line
                    adapters that `spec.serio` declares. An adapter that
                    is unplugged or refused leaves the rest of the
                    machine working, so `Ready` does not count it.
                    `ClockSynchronized` reports `status.time`. It is
                    `False` when the time sources stop answering, or
                    when the clock is more than 128ms from its source.
                    An outage upstream affects every leader at once, so
                    `Ready` does not count it. `RebootApproved` is the
                    only condition that another program writes. The
                    cluster operator adds it when this machine holds a
                    reboot turn, and removes it when the turn ends. The
                    turn itself is the machine's entry in the
                    `status.rebootTurns` of the `Cluster`. The cluster
                    operator writes the condition because the machine
                    operator of an earlier release reads only this
                    condition. It is
                    absent when the machine holds no turn, so it has no
                    `False` state, and `Ready` does not count it.
                  # A conditions array is a map with one entry per type.
                  # Declaring it as list-type map, keyed by type, lets
                  # the API server refuse duplicate types. It also lets
                  # server-side apply merge a write for one condition
                  # instead of replacing the whole list. The field
                  # constraints below come from metav1.Condition, so
                  # these conditions validate the same way as the
                  # conditions on Pods and Nodes.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: >-
                          The check that this entry reports, in
                          CamelCase. It is the key of this list, so a
                          machine has one entry for each type. The
                          description of `conditions` lists the types
                          that `liken` publishes.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: >-
                          The condition's status. Every condition type
                          on a Machine states a healthy fact, so `True`
                          is the healthy status for all of them.
                          `Unknown` means that the operator cannot tell
                          yet, for example when the machine's facts have
                          no boot record.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The `metadata.generation` that this condition
                          reflects. The generation counts spec edits, so
                          a client can use this field to tell a
                          condition about the current spec from one
                          about an earlier spec. The difference matters
                          here, because an edit can wait for a reboot.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: >-
                          Why the condition has this status, in one
                          CamelCase word. Programs read this field, so
                          it changes less often than `message`. `Ready`
                          reports `Reconciled` when it is `True`. When
                          `Ready` is `False`, its reason is the phase
                          that the conditions produce, so the roll-up
                          and the phase agree: a machine that waits for
                          a reboot turn has the reason `UpdatePending`,
                          and `Degraded` appears exactly when the phase
                          is `Degraded`. `NothingDeclared` is the reason
                          of a check that has nothing to do. The
                          convergence conditions share one set of
                          reasons: `Converged`, `FactsIncomplete`,
                          `MachineStateEphemeral`, `StagingRejected`,
                          `RejectedLastBoot`, `AwaitingTurn`,
                          `RebootPending`, `RebootRequested`,
                          `RestartPending`, `RestartRequested`, and
                          `StagedForNextBoot`. `StagedForNextBoot` means
                          that the machine has staged the change and
                          applies it at its next boot. Only a boot reads the
                          fields that changed, so the operator schedules
                          no reboot and no restart.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The detail, for a person to read. A message
                          gives the fix where there is one, for example
                          the roles that memory still backs, or the
                          exact difference between the spec and this
                          boot.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          The time when the status of this condition
                          last changed. A pass that writes the same
                          status again does not change this time, so the
                          field shows how long the condition has had its
                          status.
                pending:
                  type: array
                  description: >-
                    What this machine waits to apply: one entry for each
                    staged document that needs a disruption. Each entry
                    has the convergence condition that reported it, the
                    kind of disruption that applies it, the hash of the
                    staged document, and a one-line summary.
                    machine-operator creates one `Disruption` for this
                    machine that covers every entry. On a machine with
                    `rebootPolicy: Manual`, setting the
                    `spec.approvedHash` of that `Disruption` to its
                    `spec.hash` approves the disruption (the
                    approve-reboot command of the `liken` CLI does
                    this). The approval works once. When the changes are
                    applied, machine-operator deletes the `Disruption`,
                    and the next change creates a new one with a new
                    hash, so an earlier approval approves nothing. A reboot that a person
                    requested with a `Disruption` is also an entry here.
                    It waits for the same policy, the same turn, and the
                    same drain. It has no document, so its hash is the
                    running boot's identity.
                  items:
                    type: object
                    required: [condition, kind, hash, summary]
                    properties:
                      condition:
                        type: string
                        description: >-
                          The condition that reported this entry, for
                          example `CredentialsConverged`, or
                          `RebootRequestHonored` for a reboot that a
                          person requested.
                      kind:
                        type: string
                        enum: [Reboot, Restart]
                        description: >-
                          What applies the staged document. A reboot
                          applies every staged document at once. A
                          restart applies only the documents that k3s
                          reads when its process starts, and the
                          machine does not reboot.
                      hash:
                        type: string
                        description: >-
                          The staged document's identity. The hash of
                          the `Disruption` of machine-operator covers
                          it, so an approval of that `Disruption`
                          approves these bytes and no others. A requested reboot
                          has no document, so this field has the running
                          boot's identity instead.
                      summary:
                        type: string
                        description: >-
                          One line saying what the document changes.
