# The MachineDisruptionBudget API, declared to Kubernetes.
#
# A MachineDisruptionBudget limits how many of the machines it selects
# can be out of service at the same time. It does for machines what a
# PodDisruptionBudget does for pods. cluster-operator grants a machine a
# reboot turn only when every budget that selects the machine has room.
# cluster-operator also keeps one budget named default, which selects
# every machine.
#
# k3s applies this file at every startup from liken's subdirectory of
# its auto-deploy manifests, as it does the Machine CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machinedisruptionbudgets.liken.sh
  annotations:
    # init applies the copy of this file that has the higher revision,
    # so booting an older boot slot does not replace the schema that the
    # cluster serves with an older one (init/schemarevision.go). Raise
    # the revision in the same change that changes the schema below. A
    # test checks that the two change together.
    liken.sh/schema-revision: "2"
spec:
  group: liken.sh
  names:
    kind: MachineDisruptionBudget
    listKind: MachineDisruptionBudgetList
    plural: machinedisruptionbudgets
    singular: machinedisruptionbudget
    shortNames: [mdb]
    categories: [liken]
  # Cluster-scoped, like the Machines it selects.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Max
          type: integer
          jsonPath: .spec.maxUnavailable
        - name: Selected
          type: integer
          jsonPath: .status.selected
        - name: Out
          type: integer
          jsonPath: .status.unavailable
        - name: Allowed
          type: integer
          jsonPath: .status.allowed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Limits how many of the machines it selects can be out of
            service at the same time, counting planned and unplanned
            outages together. cluster-operator grants a machine a
            reboot turn only when every budget that selects it has
            room. The budget named default selects every machine, and
            cluster-operator creates it with maxUnavailable 1 when it
            does not exist. Whatever the budgets allow, at most one
            leader is out of service at a time.
          properties:
            spec:
              type: object
              required: [maxUnavailable]
              description: Which machines the budget covers, and how many of them can be out of service.
              properties:
                selector:
                  type: object
                  description: >-
                    Selects machines by the labels on their Machine
                    objects, in the same format as a Kubernetes label
                    selector. An empty selector selects every machine.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: Labels that a selected machine must have, each with its required value.
                    matchExpressions:
                      type: array
                      description: Expressions that the labels of a selected machine must satisfy.
                      items:
                        type: object
                        required: [key, operator]
                        x-kubernetes-validations:
                          - rule: "self.operator in ['In', 'NotIn'] ? has(self.values) && size(self.values) > 0 : !has(self.values) || size(self.values) == 0"
                            message: The operators In and NotIn need at least one value, and the operators Exists and DoesNotExist accept no values
                        properties:
                          key:
                            type: string
                            minLength: 1
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                          values:
                            type: array
                            items:
                              type: string
                maxUnavailable:
                  type: integer
                  minimum: 1
                  description: >-
                    The most selected machines that can be out of
                    service at the same time. A machine counts as out of
                    service while it holds a reboot turn, and also while
                    its phase is Lost, Degraded, Unknown, Booting, or
                    Updating, with or without a turn.
            status:
              type: object
              description: The counts that cluster-operator made in its last pass over the budget.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                selected:
                  type: integer
                  description: The number of machines that the selector selects.
                unavailable:
                  type: integer
                  description: The number of selected machines that are out of service.
                allowed:
                  type: integer
                  description: The number of additional selected machines that can go out of service now.
                conditions:
                  type: array
                  description: >-
                    DisruptionAllowed is True while the budget has room
                    for one more machine out of service. Its message
                    lists the selected machines that are out of service.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
