# The Disruption API, declared to Kubernetes.
#
# A Disruption is a request to take one machine out of service, either
# to reboot it or to restart k3s on it. Every reboot and restart that
# liken makes waits for a turn, and the cluster grants turns within the
# limits of the MachineDisruptionBudgets. machine-operator creates a
# Disruption when it has staged documents for its machine, and a person
# creates one with `liken request-reboot`. cluster-operator grants a
# turn by writing an entry in the Cluster's status.rebootTurns
# (cluster-operator/rollout.go).
#
# k3s applies this file at every startup from liken's subdirectory of
# its auto-deploy manifests, as it does the Machine CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: disruptions.liken.sh
  annotations:
    # init applies the copy of this file that has the higher revision,
    # so booting an older boot slot does not replace the schema that the
    # cluster serves with an older one (init/schemarevision.go). Raise
    # the revision in the same change that changes the schema below. A
    # test checks that the two change together.
    liken.sh/schema-revision: "4"
spec:
  group: liken.sh
  names:
    kind: Disruption
    listKind: DisruptionList
    plural: disruptions
    singular: disruption
    categories: [liken]
  # Cluster-scoped, like the Machine it disrupts.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The requester writes the spec. cluster-operator writes the
      # Approved and Granted conditions, and machine-operator writes
      # the Held condition and the Complete condition of a person's
      # reboot.
      subresources:
        status: {}
      # machine-operator lists and watches with the field selector
      # spec.machine, so it receives only the requests for its own
      # machine.
      selectableFields:
        - jsonPath: .spec.machine
      additionalPrinterColumns:
        - name: Machine
          type: string
          jsonPath: .spec.machine
        - name: Requester
          type: string
          jsonPath: .spec.requester
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Approved
          type: string
          jsonPath: .status.conditions[?(@.type=="Approved")].status
        - name: Granted
          type: string
          jsonPath: .status.conditions[?(@.type=="Granted")].status
        - name: Held
          type: string
          jsonPath: .status.conditions[?(@.type=="Held")].status
        - name: Complete
          type: string
          jsonPath: .status.conditions[?(@.type=="Complete")].status
          priority: 1
        - name: Reason
          type: string
          jsonPath: .spec.reason
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A request to reboot one machine or to restart k3s on it.
            The request waits until it is approved and every
            MachineDisruptionBudget that selects the machine has room.
            Under rebootPolicy Auto, every request is approved at once.
            Under rebootPolicy Manual, a person approves it with
            spec.approvedHash. Then cluster-operator records a turn
            for the machine in the Cluster's status.rebootTurns, and
            machine-operator drains and reboots the machine, or
            restarts k3s for a Restart. Every request that is pending
            for the machine when its turn starts is served by the same
            drain and reboot.
          properties:
            spec:
              type: object
              description: >-
                Which machine to take out of service, who made the request, what
                kind of request it is, and, for a machine whose
                rebootPolicy is Manual, the approval.
              required: [machine, requester, kind]
              x-kubernetes-validations:
                # Only machine-operator requests a k3s restart, because
                # a restart applies a change that machine-operator
                # staged. A person's request is complete only when the
                # machine boots again, and a restart does not boot it.
                - rule: self.kind == 'Reboot' || self.requester == 'liken.sh/machine-operator'
                  message: kind Restart is only for requests from liken.sh/machine-operator. Set kind to Reboot
                # A restart does not drain the machine, so hold has no
                # drain to pause after.
                - rule: "!has(self.hold) || !self.hold || self.kind == 'Reboot'"
                  message: spec.hold needs kind Reboot, because a Restart does not drain the machine
                # A restart does not reboot the machine, so BootNext
                # has no effect on it.
                - rule: "!has(self.keepBootNext) || !self.keepBootNext || self.kind == 'Reboot'"
                  message: spec.keepBootNext needs kind Reboot, because a Restart does not reboot the machine
              properties:
                machine:
                  type: string
                  minLength: 1
                  description: >-
                    The name of the Machine to take out of service. The
                    value cannot change after the request is created.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.machine cannot change after the request is created. Create another Disruption for another machine
                requester:
                  type: string
                  minLength: 1
                  description: >-
                    Who made the request. For a program, a key with a
                    domain prefix, such as liken.sh/machine-operator.
                    For a person, the Kubernetes user name. The value
                    cannot change after the request is created.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.requester cannot change after the request is created. Create another Disruption
                kind:
                  type: string
                  enum: [Reboot, Restart]
                  description: >-
                    Reboot reboots the machine. Restart restarts k3s
                    and does not drain or reboot the machine, so its
                    pods keep running. A reboot also restarts k3s, so a
                    machine that has both kinds pending only reboots.
                reason:
                  type: string
                  description: Why the machine needs to go out of service, in words for a person who reads the request.
                hash:
                  type: string
                  description: >-
                    Identifies what the request applies. In a request
                    from machine-operator, it is the hash of the
                    documents that machine-operator staged. In a
                    person's reboot request, it is the ID of the boot
                    that was running when the request was made: the
                    hex SHA-256 of the Machine's status.boot.time,
                    written in UTC in RFC 3339 format with nanoseconds.
                    When a person's request has no hash, machine-operator
                    writes it. The request is complete when the machine
                    boots again, because the new boot has another ID.
                approvedHash:
                  type: string
                  description: >-
                    Approves the request on a machine whose
                    rebootPolicy is Manual. The request is approved
                    while this value equals spec.hash, or is a prefix
                    of it at least 12 characters long. When the request
                    changes to apply different documents, spec.hash
                    changes and the approval stops matching.
                    `liken approve-reboot` sets this field. A machine
                    whose rebootPolicy is Auto approves every request
                    and ignores this field.
                hold:
                  type: boolean
                  description: >-
                    Pauses the machine's turn after the drain and
                    before the reboot. When the drain ends,
                    machine-operator sets the Held condition to True.
                    The requester then does its work on the machine
                    from a pod that tolerates the cordon. When the
                    requester has checked its work, it removes hold and
                    the machine reboots. The pause has no time limit.
                    Until hold is removed, the machine stays drained
                    and counts against every budget that selects it.
                    When the requester never removes hold, a person can
                    remove it, and the machine then reboots.
                keepBootNext:
                  type: boolean
                  description: >-
                    Tells init that the requester set the firmware's
                    BootNext variable for this request's reboot, as the
                    fwupd updater does for a UEFI capsule. The requester
                    sets BootNext while the machine is drained and held,
                    and sets this field when it removes hold. On that
                    reboot, init leaves BootNext as it is and does not
                    start a trial of a new release, so the firmware
                    boots the requester's boot entry once. A staged
                    release is tried on a later reboot. init honors
                    this field only when the machine's
                    status.firmware.bootOrderKept is true, BootNext does
                    not point at the boot slot that is not proven, and
                    the proven slot has the fallback loader at the
                    firmware's default boot path. Otherwise init does
                    an ordinary reboot and prints the reason on the boot
                    console.
            status:
              type: object
              description: The state of the request.
              properties:
                conditions:
                  type: array
                  description: >-
                    cluster-operator writes Approved. It is True when
                    the machine's rebootPolicy is Auto, or when
                    spec.approvedHash matches spec.hash.

                    cluster-operator writes Granted. It is True while
                    the machine's turn in the Cluster's
                    status.rebootTurns is for this request. While the
                    request waits, its message says what it waits for.

                    machine-operator writes Held. It is True from the
                    end of the drain until the requester removes
                    spec.hold.

                    machine-operator writes Complete. It is True when
                    the machine has booted again after a person's
                    reboot request.

                    machine-operator deletes its own request when
                    nothing is staged. cluster-operator deletes a
                    complete request 24 hours after it completed.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
