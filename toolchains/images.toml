# The outside images that liken builds from and runs, each named once.
#
# Every copy of an image reference drifts on its own, so each image
# that more than one file names has one entry here, and the other
# files name it by its key. Root plan 83 gives the rule each entry
# follows: the newest release, from the newest channel its registry
# offers. toolchains/latest.sh reports each entry against that rule.

# The images that a Dockerfile starts from or copies from. A
# Dockerfile names one bare, as in `FROM golang AS build`, and ci/
# writes the reference into the bake target's contexts. Each one
# carries a digest, because a tag moves and the recipe of a pinned
# component must not.
[build]
golang = "golang:1.27.3-trixie@sha256:c65ecfe613b539ac74c62a4c3b2c27e8f8a6076384c8f27e8a3c0f3be17cc385"
rust = "rust:1.99.1-trixie@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137"
# The builder of the static binaries in liken/open-iscsi and in
# bluetoothd, the two builds that buildroot's recipes cannot make
# static. liken/open-iscsi/fetch.sh reads this line too, and
# licensing/sources.sh and licensing/latest.sh read its tag.
alpine = "alpine:edge@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000"
# The builder of the static programs in liken/userland. It is
# buildroot's own CI image, at the tag that .gitlab-ci.yml names at the
# buildroot commit in liken/userland/VERSION, so buildroot runs on the
# host tools that its CI tests. liken/userland/build.sh reads this line.
buildroot = "registry.gitlab.com/buildroot.org/buildroot/base:20250218.2110@sha256:340aa0de68e8e13e4eca70a00aaf94ec68d3a3891c28f3e7495d844829a8c958"
# The digest moves with the snapshot date in vulkan/package.toml,
# because the image and the snapshot must come from the same day.
debian = "debian:sid-slim@sha256:5ac67a4d7c0de96e83873e4dd8f7ea3b507ba292fb2cce60a0c3f73322df5cae"
ubuntu = "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
distroless = "gcr.io/distroless/static:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329"
oras = "ghcr.io/oras-project/oras:v1.3.6@sha256:9cfb578be975b762fd898b9d004243d8003aeb807a3e15b2ed212cdd1326c9eb"
corrosion = "ghcr.io/liken-sh/corrosion:2026.10.31-001@sha256:8050e5a5a6d5638ffb4249aa1e9fcf8202258c1d37d18eb6413f99246196d85b"
# The sigstore verifier and signer. No Dockerfile builds from it. A
# bump script runs it with docker to check a keyless signature before
# it copies a digest from a signed file, and the publish job of each
# component runs it to sign each image it pushes. Both read this line,
# so cosign is pinned by digest like the builders; grep for cosign
# under liken/ and ci/ to list the users.
cosign = "ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d"
# The SBOM generator that buildx runs on each image that a publish
# pushes. No Dockerfile builds from it. Without this line, buildx pulls
# its default generator by the moving tag stable-1, so the scanner
# that writes each SBOM would change with no change to the tree.
# ci/sign.go reads this line.
buildkit-syft-scanner = "docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315"

# The images that a manifest, a guide, a skill, or a test names by
# tag. A check in ci/ fails when one of those files names an image
# from this table at another tag.
[run]
eclipse-mosquitto = "eclipse-mosquitto:2.1.2-alpine"
csi-node-driver-registrar = "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0"
csi-provisioner = "registry.k8s.io/sig-storage/csi-provisioner:v6.4.0"
csi-resizer = "registry.k8s.io/sig-storage/csi-resizer:v2.3.0"
curl = "curlimages/curl:8.23.0"
busybox = "busybox:1.38.0"
