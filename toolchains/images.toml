# The outside images that liken builds from and runs, each named once.
#
# Every copy of an image reference drifts on its own, so each image
# that more than one file names has one entry here, and the other
# files name it by its key. Root plan 83 gives the rule each entry
# follows: the newest release, from the newest channel its registry
# offers. toolchains/latest.sh reports each entry against that rule.

# The images that a Dockerfile starts from or copies from. A
# Dockerfile names one bare, as in `FROM golang AS build`, and ci/
# writes the reference into the bake target's contexts. Each one
# carries a digest, because a tag moves and the recipe of a pinned
# component must not.
[build]
golang = "golang:1.27.4-trixie@sha256:430985542100b871e108ccc00e8dcc5eef08ca14ee5825e98ebf563d8ffec4ee"
rust = "rust:1.100.0-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8"
# The builder of the static programs in liken/userland and of the
# daemons of the bluetoothd image. It is buildroot's own CI image, at
# the tag that .gitlab-ci.yml names at the buildroot commit in
# liken/userland/VERSION, so buildroot runs on the host tools that its
# CI tests. liken/userland/build.sh reads this line, and
# bluetooth-operator/bluetoothd/Dockerfile builds from it.
buildroot = "registry.gitlab.com/buildroot.org/buildroot/base:20250218.2110@sha256:340aa0de68e8e13e4eca70a00aaf94ec68d3a3891c28f3e7495d844829a8c958"
# The digest moves with the snapshot date in vulkan/package.toml,
# because the image and the snapshot must come from the same day.
debian = "debian:sid-slim@sha256:221cb1673dc474811ff69c5d40750ad1c7043b45df553072709a58328b6a156e"
ubuntu = "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"
distroless = "gcr.io/distroless/static:nonroot@sha256:8ce6dd87e9823c5b48dcfb2c8604714ccb351ce59607327bcc4957448da279b5"
oras = "ghcr.io/oras-project/oras:v1.4.0@sha256:5fabb4e523de1781443c227fca62782a51aeacd044413c07f54dc64935d7f013"
corrosion = "ghcr.io/liken-sh/corrosion:2026.11.23-001@sha256:43cbed55c6fa72e65afe5cba3038cc6b097767ce75821636d205a38d3f0f5fb0"
# The sigstore verifier and signer. No Dockerfile builds from it. A
# bump script runs it with docker to check a keyless signature before
# it copies a digest from a signed file, and the publish job of each
# component runs it to sign each image it pushes. Both read this line,
# so cosign is pinned by digest like the builders; grep for cosign
# under liken/ and ci/ to list the users.
cosign = "ghcr.io/sigstore/cosign/cosign:v3.1.6@sha256:7d08ec40d6f6fd9ced81a498c367ee6d4dd90d73218f58a791f78661bdbef769"
# The SBOM generator that buildx runs on each image that a publish
# pushes. No Dockerfile builds from it. Without this line, buildx pulls
# its default generator by the moving tag stable-1, so the scanner
# that writes each SBOM would change with no change to the tree.
# ci/sign.go reads this line.
buildkit-syft-scanner = "docker/buildkit-syft-scanner:1.13.0@sha256:a190379321cf51fba8c284a1834555b55e7bf58d577d574db23370461defc430"
# The BuildKit daemon that builds every image in CI. No Dockerfile
# builds from it. Each CI job that builds images creates a builder
# with docker/setup-buildx-action, which runs BuildKit in a container.
# Without this line, the action and buildx pull
# moby/buildkit:buildx-stable-1, a tag that moves to each new BuildKit
# release, so the daemon that builds each published image would change
# with no change to the tree. ci/buildkit.go reads this line and writes
# it into the driver-opts of each generated setup-buildx-action step.
buildkit = "moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c"
# The SBOM generator that the OS release runs over its root
# filesystem, its image archives, its toolkit, and the programs inside
# k3s. No Dockerfile builds from it. liken/releases/Makefile runs it
# with docker or podman and reads this line, so the program that
# writes the release's SBOM changes only with a commit.
syft = "anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a"
# The scanner that matches the SBOM of an OS release against the
# vulnerability databases. No Dockerfile builds from it.
# liken/releases/sbom/vulnerabilities.sh runs it with docker or podman
# and reads this line. Trivy scans each image, and it matches no
# component by its CPE, which is the only name that NVD has for the
# kernel, the bootloaders, and the other files that the OS takes from
# an upstream release.
grype = "anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c"

# The images that a manifest, a guide, a skill, or a test names by
# tag. A check in ci/ fails when one of those files names an image
# from this table at another tag.
[run]
eclipse-mosquitto = "eclipse-mosquitto:2.1.4-alpine"
csi-node-driver-registrar = "registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1"
csi-provisioner = "registry.k8s.io/sig-storage/csi-provisioner:v6.4.1"
csi-resizer = "registry.k8s.io/sig-storage/csi-resizer:v2.3.1"
curl = "curlimages/curl:8.23.0"
busybox = "busybox:1.38.0"
