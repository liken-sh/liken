# The configuration of the manual for people-operator, served at
# https://liken.sh/people/.
#
# The theme is brand/, at the top of this repository. It provides the
# page layout, the top navigation, the logo, and the stylesheet that
# every liken site uses.
baseURL: https://liken.sh/people/

# crdref generates the reference page with a raw-HTML span that gives
# each field's table row an id, so a link can point at one field.
# Goldmark drops raw HTML unless `unsafe` is set. That is safe here
# because this repository authors all the content the site renders.
markup:
  goldmark:
    renderer:
      unsafe: true
title: people-operator
# Hugo looks for the theme by name under themesDir. The repository root
# holds brand/, so the site always builds with the theme from the same
# commit.
themesDir: ../..
theme: brand

# The theme heads the sidebar with the last segment of this URL.
params:
  repository: https://github.com/liken-sh/liken/tree/main/people-operator
  # Adds a footer link to the coverage report at /coverage.html.
  coverage: true

# The manual has no taxonomies and no feeds. The sitemap stays for
# crawlers.
disableKinds: [taxonomy, term, rss]

# Every page is published twice: as HTML for people, and as its
# authored Markdown for agents and scripts. The Markdown file is next
# to the HTML file, so the Markdown version of / is /index.md. The theme
# renders the Markdown version only when the site declares this output
# format (see brand/README.md).
outputFormats:
  markdown:
    # Hugo already defines the text/markdown media type with the md
    # suffix.
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests in deploy/ as raw YAML at
# /deploy/<file>.yaml, so `kubectl apply -f` and a Kustomization can
# install from those URLs without a clone. The mount reads the files
# from the repository, so the site keeps no copy that could go stale.
#
# Declaring any mount replaces all of Hugo's default mounts, so the
# content mount is declared again. The theme's own mounts, for the
# favicon and the brand images, are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
