# The coverage threshold that CI enforces (see
# .github/workflows/ci.yaml).
#
# The threshold is set just under the measured coverage, so a change
# that lowers coverage fails. A change that raises coverage raises the
# threshold too, and the threshold never goes down.
#
# The threshold assumes Go 1.27.2 or later, which counts each basic
# block once. Go 1.27.1 and earlier count a block once for each line
# that comments split it into (golang/go#80974), so they measure higher.

profile: coverage.out

# No test runs main.go, which only builds the in-cluster clients and
# starts the operator.
exclude:
  paths:
    - ^main\.go$

threshold:
  # The uncovered code is error paths of writers and parsers that
  # cannot fail on the values the operator gives them, and the watch
  # handler's report of an object that does not convert.
  total: 95
