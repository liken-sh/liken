# The Person resource, which declares the people who use a household's
# services, and the operator that writes a thumbnail of each person's
# picture into their status.
[package]
name = "people-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "toolchains", "trust"]

[docs]
prefix = "people"

# gofmt, go vet, go mod tidy, the tests with the race detector, and the
# coverage threshold in .testcoverage.yml.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The links, the generated reference page and skills, and the site
# build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job already runs these three checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the kubernetes module with ../kubernetes, so the
# image build needs that directory as a build context. The notices
# context holds the script that copies the license files.
[[outputs.images]]
name = "people-operator"
description = "people-operator, which keeps the Person objects of a cluster and decodes their pictures."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }
