# The kustomize base for people-operator: the Person resource
# definition and the operator that writes each Person's picture into
# its status.
#
# The cluster owner applies this base. `liken` does not apply or
# reference it. Use it from your own GitOps repository with your own
# patches, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The top-level namespace field would overwrite every namespace. The
# NamespaceTransformer with `unsetOnly` sets liken-system only on
# objects that have none.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - people-crd.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: people-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/people-operator
    newTag: latest
