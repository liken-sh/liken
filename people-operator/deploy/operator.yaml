# One unprivileged Deployment serves the whole cluster. The operator
# decodes https://, http://, and data: pictures itself, and starts a
# baker pod for each nfs:// and claim:// picture. All of its state is in
# the Person statuses and the baker pods, so a new operator pod reads
# both and continues where the old one stopped.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-operator
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. With more replicas, only the copy that holds the Lease
  # named people-operator acts, and the others wait to take it over.
  replicas: 1
  selector:
    matchLabels:
      app: people-operator
  # A rollout starts the new pod before it stops the old one, so the
  # new pod pulls its image while the old pod still acts. After the old
  # pod releases the Lease, the new pod takes it within about 11
  # seconds.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: people-operator
    spec:
      serviceAccountName: people-operator
      # On SIGTERM the operator finishes the Person it is working on,
      # waits up to 5 s for its last Events to send, and then releases
      # the Lease, which takes up to 16 s. Each API request times out
      # after 15 s, and a status write that hits a conflict sends three.
      # A 60 s grace period leaves 39 s for the Person's writes, where
      # the default 30 s would leave 9 s. When the kubelet kills the pod
      # before the release, a waiting copy takes the Lease only after it
      # expires, 30 to 41 s after the last renewal.
      terminationGracePeriodSeconds: 60
      containers:
        # The operator reads this image from its own pod and runs baker
        # pods with it, so this tag sets the image of both.
        - name: operator
          image: ghcr.io/liken-sh/people-operator:latest
          env:
            # The operator reads its own pod for the image, uses the
            # pod name as its identity in the Lease, and creates the
            # Lease and the nfs:// baker pods in its own namespace. It
            # exits when either variable is unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # The operator decodes https://, http://, and data: pictures
            # in its own memory. The largest picture it accepts is 8192
            # by 8192 pixels, which decodes to 256 MiB. The limit leaves
            # room for the thumbnail and the watches.
            limits:
              memory: 384Mi
