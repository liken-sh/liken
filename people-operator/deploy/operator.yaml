# The operator: one unprivileged Deployment for the cluster. It reads
# every Person, writes each one's status, fetches https:// and http://
# pictures itself, and starts a baker pod for each nfs:// and claim://
# picture. It keeps no state outside the status and the baker pods, so
# a new pod reads both and carries on.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: people-operator
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. Two are safe: the Lease named people-operator lets one
  # copy act, and the other waits and takes over when the first stops
  # (leader.go says what two acting copies would break).
  replicas: 1
  selector:
    matchLabels:
      app: people-operator
  # A rollout starts the new pod beside the old one, and stops the old
  # one only when the new one runs. The new pod waits for the Lease while
  # the old one leads. On SIGTERM the old pod finishes the Person it
  # answers and releases the Lease, and the new pod takes it on its next
  # read, within about 11 seconds. So the image pull happens while the
  # old pod still leads.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: people-operator
    spec:
      serviceAccountName: people-operator
      # A shutdown finishes the writes of the Person in flight, and then
      # releases the Lease. Those writes are a status write, which reads
      # the Person again and writes once more after a conflict, and the
      # delete of a finished baker pod, and the client bounds each
      # request at 15 s. The release waits up to 11 s for client-go's
      # election to end (its 10 s renew deadline and 1 s), and then up to
      # 5 s for the release that follows a late renewal, 16 s in all. The
      # default 30 s grace would leave the writes 14 s, and 60 s leaves
      # them 44 s. A kill before the release leaves the Lease to expire,
      # and a waiting copy then takes it 30 to 41 s after the last
      # renewal instead of within about 11 s.
      terminationGracePeriodSeconds: 60
      containers:
        # The operator reads this container's image from its own pod,
        # and a baker pod runs the same image, so the tag below pins
        # both.
        - name: operator
          image: ghcr.io/liken-sh/people-operator:latest
          env:
            # The operator reads its own pod for the image, and starts
            # an nfs:// baker pod in its own namespace. The two values
            # also name the Lease the operator holds and the identity it
            # holds it under, so the operator exits when either is
            # unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # The operator decodes an https://, http://, or data: picture
            # in its own memory. The largest one the limits allow is 8192
            # by 8192 pixels, which decodes to 256 MiB, and the limit
            # leaves room for the thumbnail and the watches.
            limits:
              memory: 384Mi
