# A Person names one person who uses the cluster. It is cluster-scoped
# because the same person can appear in every namespace. Other
# operators refer to it by name and attach their own facts to it. A
# `Play` names the people who watched it, and a `Watch` names the
# people who watch a series together. people-operator writes the
# status: a thumbnail of the picture that spec.avatar names, so every
# screen draws the same face with no work of its own.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: people.people.liken.sh
spec:
  group: people.liken.sh
  names:
    kind: Person
    listKind: PersonList
    plural: people
    singular: person
    categories: [people]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec, and people-operator writes the
      # status.
      subresources:
        status: {}
      additionalPrinterColumns:
        # kubectl already prints the resource's name as NAME, so the
        # display name takes a header of its own.
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Nickname
          type: string
          jsonPath: .spec.nickname
        - name: UID
          type: integer
          jsonPath: .spec.uid
        # The reason on AvatarReady says both where the thumbnail came
        # from (Inline, Fetched, Baked, or Initials) and why it failed
        # (FetchFailed, BakeFailed, DecodeFailed, or UnsupportedScheme),
        # so one word answers why a screen shows initials in place of a
        # picture. The spec's source is not a column, because a data:
        # URI would fill the terminal.
        - name: Picture
          type: string
          jsonPath: .status.conditions[?(@.type=="AvatarReady")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        # kubectl get -o wide adds the condition's message, which names
        # the failure in full.
        - name: Message
          type: string
          priority: 1
          jsonPath: .status.conditions[?(@.type=="AvatarReady")].message
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  description: "The name a screen displays for this person."
                nickname:
                  type: string
                  minLength: 1
                  description: >-
                    A short, one-word name for a screen with little
                    room: a first name, or what people call this
                    person. Optional. A screen displays the display
                    name when this is unset.
                avatar:
                  type: string
                  description: >-
                    The URI of this person's picture, in JPEG, PNG,
                    GIF, or WebP. `https://` and `http://` name a file
                    that `people-operator` fetches. `data:` holds the
                    picture in this field. `nfs://<server>/<path>` names
                    a file on an NFS export, and
                    `claim://<namespace>/<claim>/<path>` names a file on
                    a claim; a short-lived pod reads either one. The
                    file is at most 10 MiB and 8192 pixels on each side.
                    Optional. With no picture, the thumbnail shows this
                    person's initials.
                uid:
                  type: integer
                  format: int64
                  minimum: 1000
                  maximum: 4294967294
                  description: >-
                    The Linux uid that owns this person's files. Set
                    it when this person's files already exist under a
                    uid, on a NAS for example. Optional. Nothing
                    assigns one yet.
                identity:
                  type: object
                  required: [issuer, subject]
                  description: >-
                    This person's login at an outside identity
                    provider, as an OIDC issuer URL and subject.
                    Optional. Nothing reads it yet.
                  properties:
                    issuer:
                      type: string
                      format: uri
                      minLength: 1
                      description: "The issuer URL, exactly as the provider's discovery document states it."
                    subject:
                      type: string
                      minLength: 1
                      description: "The subject claim, `sub`, that the issuer assigns to this person."
            status:
              type: object
              properties:
                # Nothing writes uid yet. It is declared so a controller
                # that assigns uids has a place to report them.
                uid:
                  type: integer
                  format: int64
                  description: >-
                    The uid in effect for this person. Nothing writes
                    it yet.
                # A data: URI is a string, and it carries its media type,
                # so a later change of format does not change the field.
                # At 256 pixels a face takes about 20 to 35 KB, a small
                # part of the 1.5 MiB that etcd allows one object.
                thumbnail:
                  type: string
                  description: >-
                    This person's picture as a square JPEG, 256 by 256
                    pixels, in a `data:image/jpeg;base64,` URI. It is the
                    picture that `spec.avatar` names, cropped to its
                    centre, or this person's initials when there is no
                    picture. A screen crops it to its own shape.
                avatar:
                  type: object
                  description: >-
                    What the thumbnail was made from: the source, the version
                    of the picture that the operator read there, and the check
                    request.
                  properties:
                    source:
                      type: string
                      description: "The `spec.avatar` that the thumbnail was made from."
                    etag:
                      type: string
                      description: >-
                        The `ETag` of the picture an HTTP source answered.
                        The check every six hours sends it as
                        `If-None-Match`.
                    lastModified:
                      type: string
                      description: >-
                        The `Last-Modified` of the picture an HTTP source
                        answered, or the modification time of a file on
                        NFS or a claim.
                    size:
                      type: integer
                      format: int64
                      description: "The size in bytes of a file on NFS or a claim."
                    checked:
                      type: string
                      description: >-
                        The value of the `people.liken.sh/check-avatar`
                        annotation when the operator made the thumbnail. A new
                        value of the annotation reads the picture again.
                conditions:
                  type: array
                  description: >-
                    `AvatarReady` is `True` when the thumbnail was made from
                    the current `spec.avatar`, with the reason `Fetched`,
                    `Baked`, `Inline`, or `Initials`. It is `False` when the
                    picture did not read, with the reason `FetchFailed`,
                    `BakeFailed`, `DecodeFailed`, or `UnsupportedScheme`; the
                    last good picture then stays, or the initials show when
                    there was none.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        description: "The condition's name."
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: "Whether the condition holds."
                      reason:
                        type: string
                        description: "One word for the cause."
                      message:
                        type: string
                        description: "The cause, for a person to read."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "The generation of the spec that the condition answers."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "When the status last changed."
