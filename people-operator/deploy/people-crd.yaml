# A Person names one person who uses the cluster. It is cluster-scoped
# because the same person appears in every namespace. The resource
# holds little on its own; other operators refer to it by name and
# attach their own facts to it. A `Play` names the people who watched
# it, and a `Watch` names the people who watch a series together. No
# controller ships with this CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: people.people.liken.sh
spec:
  group: people.liken.sh
  names:
    kind: Person
    listKind: PersonList
    plural: people
    singular: person
    categories: [people]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec; only a controller writes
      # status.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Name
          type: string
          jsonPath: .spec.displayName
        - name: Nickname
          type: string
          jsonPath: .spec.nickname
        - name: UID
          type: integer
          jsonPath: .spec.uid
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  description: "The name a screen shows for this person."
                nickname:
                  type: string
                  minLength: 1
                  description: >-
                    A short name, one word, for a screen with little
                    room: a first name, or what people call this
                    person. Optional. A screen shows the display name
                    when this is unset.
                avatar:
                  type: string
                  description: >-
                    This person's picture, as a `claim://<claim>/<path>`
                    reference to a file on a claim. It is the same
                    form a `Play` uses to name media. Optional.
                uid:
                  type: integer
                  format: int64
                  minimum: 1000
                  maximum: 4294967294
                  description: >-
                    The Linux uid that owns this person's files. Set
                    it when this person's files already exist under a
                    uid, on a NAS for example. Optional. Nothing
                    assigns one yet.
                identity:
                  type: object
                  required: [issuer, subject]
                  description: >-
                    This person's login at an outside identity
                    provider, as an OIDC issuer URL and subject.
                    Optional. Nothing reads it yet.
                  properties:
                    issuer:
                      type: string
                      format: uri
                      minLength: 1
                      description: "The issuer URL, exactly as the provider's discovery document states it."
                    subject:
                      type: string
                      minLength: 1
                      description: "The subject claim, `sub`, that the issuer gives this person."
            status:
              type: object
              # Nothing writes this yet. It is declared so a controller
              # that assigns uids has a place to report them.
              properties:
                uid:
                  type: integer
                  format: int64
                  description: >-
                    The uid in effect for this person. Nothing writes
                    it yet.
