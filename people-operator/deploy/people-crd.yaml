# A Person is one person who uses the cluster. It is cluster-scoped
# because the same person can appear in every namespace. Other
# operators refer to a Person by name: the owner references of a
# `Play`, for example, are the people who watched it. people-operator
# writes status.thumbnail from the picture at spec.avatar, so every
# screen can draw the same face without fetching the picture itself.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: people.people.liken.sh
spec:
  group: people.liken.sh
  names:
    kind: Person
    listKind: PersonList
    plural: people
    singular: person
    categories: [people]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # With the status subresource, an edit to a Person cannot change
      # its status, and a write to the status cannot change its spec.
      # Users write the spec, and people-operator writes the status.
      subresources:
        status: {}
      additionalPrinterColumns:
        # kubectl prints metadata.name as NAME, so this column needs a
        # different header.
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
        - name: Nickname
          type: string
          jsonPath: .spec.nickname
        - name: UID
          type: integer
          jsonPath: .spec.uid
        # The reason of the AvatarReady condition is either where the
        # thumbnail came from (Inline, Fetched, Baked, or Initials) or
        # why reading the picture failed (FetchFailed, BakeFailed,
        # DecodeFailed, or UnsupportedScheme). One column shows both.
        # spec.avatar is not a column because a data: URI is long
        # enough to fill the terminal.
        - name: Picture
          type: string
          jsonPath: .status.conditions[?(@.type=="AvatarReady")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        # kubectl get -o wide adds the full message of the condition.
        - name: Message
          type: string
          priority: 1
          jsonPath: .status.conditions[?(@.type=="AvatarReady")].message
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  description: "The name that a screen shows for this person."
                nickname:
                  type: string
                  minLength: 1
                  description: >-
                    A short name for a screen with little room, such as
                    a first name or what people call this person. A
                    screen shows `displayName` when this is not set.
                avatar:
                  type: string
                  description: >-
                    The URI of this person's picture, as a JPEG, PNG,
                    GIF, or WebP file. `people-operator` downloads a
                    picture from an `https://` or `http://` URL. A
                    `data:` URI contains the picture itself.
                    `nfs://<server>/<path>` is a file on an NFS export,
                    and `claim://<namespace>/<claim>/<path>` is a file
                    on a claim. For these two, `people-operator` starts
                    a pod that mounts the export or the claim, reads the
                    file, and exits. The file can be up to 10 MiB, and
                    the image up to 8192 pixels on each side. When this
                    is not set, the thumbnail shows this person's
                    initials.
                uid:
                  type: integer
                  format: int64
                  minimum: 1000
                  maximum: 4294967294
                  description: >-
                    The Linux uid that owns this person's files. Set it
                    to match files that already exist under a uid, for
                    example on a NAS. No component reads this field.
                identity:
                  type: object
                  required: [issuer, subject]
                  description: >-
                    This person's account at an OIDC identity provider,
                    as the issuer URL and the subject. No component
                    reads this field.
                  properties:
                    issuer:
                      type: string
                      format: uri
                      minLength: 1
                      description: "The issuer URL, written as it is in the provider's discovery document."
                    subject:
                      type: string
                      minLength: 1
                      description: "The `sub` claim that the issuer assigns to this person."
            status:
              type: object
              properties:
                # This field is declared for a controller that assigns
                # uids, so that it can report them here.
                uid:
                  type: integer
                  format: int64
                  description: >-
                    The uid that is assigned to this person. No
                    component writes this field.
                # A thumbnail is small enough to store in the object, which
                # etcd limits to 1.5 MiB.
                thumbnail:
                  type: string
                  description: >-
                    A 256 by 256 pixel JPEG in a
                    `data:image/jpeg;base64,` URI. It is the center
                    square of the picture at `spec.avatar`, or this
                    person's initials when `spec.avatar` is not set or
                    cannot be read. A screen crops it to its own
                    shape.
                avatar:
                  type: object
                  description: >-
                    The picture that the thumbnail was made from: the value of
                    `spec.avatar`, the version of the picture that
                    `people-operator` read, and the value of the
                    `people.liken.sh/check-avatar` annotation at that
                    time.
                  properties:
                    source:
                      type: string
                      description: "The value of `spec.avatar` that the thumbnail was made from."
                    etag:
                      type: string
                      description: >-
                        The `ETag` header that the HTTP server returned with
                        the picture. `people-operator` sends it as
                        `If-None-Match` when it checks the URL again every
                        six hours.
                    lastModified:
                      type: string
                      description: >-
                        The `Last-Modified` header that the HTTP server
                        returned with the picture, or the modification time
                        of a file on NFS or a claim.
                    size:
                      type: integer
                      format: int64
                      description: "The size in bytes of the file on NFS or on a claim."
                    checked:
                      type: string
                      description: >-
                        The value of the `people.liken.sh/check-avatar`
                        annotation when `people-operator` made the
                        thumbnail. When the annotation gets a different
                        value, `people-operator` reads the picture again.
                conditions:
                  type: array
                  description: >-
                    `AvatarReady` is `True` when the thumbnail was made
                    from the current `spec.avatar`. Its reason is
                    `Fetched` for an `http://` or `https://` URL, `Baked`
                    for an `nfs://` or `claim://` file, `Inline` for a
                    `data:` URI, and `Initials` when `spec.avatar` is not
                    set. It is `False` when `people-operator` could not
                    read the picture, with the reason `FetchFailed`,
                    `BakeFailed`, `DecodeFailed`, or `UnsupportedScheme`.
                    The thumbnail then keeps the last picture that was
                    read, or shows the initials if there was none.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        description: "The condition's name."
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: "Whether the condition is true."
                      reason:
                        type: string
                        description: "A one-word reason for the status."
                      message:
                        type: string
                        description: "The reason for the status, in a sentence for a person to read."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "The `metadata.generation` of the Person that the condition was set for."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "When the status last changed."
