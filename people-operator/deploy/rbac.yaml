# The operator reads every Person, writes each Person's status, posts
# Events about each Person, and creates, reads, and deletes the baker
# pods that read a picture from NFS or from a claim.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: people-operator
---
# This is a ClusterRole because a Person is cluster-scoped, and a
# claim's baker pod runs in the claim's namespace, which can be any
# namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: people-operator
rules:
  # list and watch fill the operator's cache of Persons. get reads one
  # Person again after a status write fails with a conflict.
  - apiGroups: [people.liken.sh]
    resources: [people]
    verbs: [get, list, watch]
  # The operator writes only the status of a Person, never the spec,
  # with a PUT, which needs the update verb.
  - apiGroups: [people.liken.sh]
    resources: [people/status]
    verbs: [update]
  # The operator watches the baker pods by the label
  # people.liken.sh/baker, but RBAC cannot limit a rule by label, so
  # list and watch cover every pod. get reads the operator's own pod to
  # find its image. delete removes a baker pod that finished, timed out,
  # or reads a picture that no Person uses anymore. The operator deletes
  # only pods that have the baker label.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  # A baker pod writes its result as one line in its log, and the
  # operator reads that line.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The API server accepts an Event about a cluster-scoped object, such
  # as a Person, only in the default or kube-system namespace, so the
  # operator posts its Events in default. The rule is in the
  # ClusterRole so that it applies in default wherever the operator is
  # installed. patch raises the count of an Event that repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: people-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: people-operator
subjects:
  - kind: ServiceAccount
    name: people-operator
    namespace: liken-system
---
# Only the copy of the operator that holds this Lease acts. client-go's
# leader election reads the Lease with get, and acquires, renews, and
# releases it with update. The Lease is in the operator's own
# namespace, so a Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: people-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [people-operator]
    verbs: [get, update]
  # create has no resourceNames because RBAC cannot match a name on a
  # create request.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: people-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: people-operator-lease
subjects:
  - kind: ServiceAccount
    name: people-operator
    namespace: liken-system
