# The plate solver: astrometry.net's engine and solve-field, and
# SourceExtractor, with every library they load, on nothing else.
# astrophotography-operator's worker image builds on it.
[package]
name = "astrometry"
# The date of the snapshot.debian.org archive that the build installs
# from, as YYYYMMDD. Every image on Debian uses the same date, because
# vulkan/snapshot.sha256 holds the checksums of one date.
version = "20260928"
revision = 2
license = "MIT"

# The upstream releases that the snapshot holds, as Debian names them.
# Each one is a label of the image, sh.liken.upstream.<name>. A new
# snapshot date updates them.
[package.upstream]
astrometry-net = "0.97+dfsg-2"
source-extractor = "2.28.2+ds-1"

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"

# The build takes the vulkan directory as the context builder, for the
# scripts that every image on Debian uses. The image does not build on
# vulkan.
[depends]
components = ["vulkan"]

[[outputs.images]]
name = "astrometry"
contexts = { builder = "vulkan" }
smoke = "astrometry/smoke/astrometry.sh"
