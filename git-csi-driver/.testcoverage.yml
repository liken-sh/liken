# The coverage gate. `make test-go` runs it, locally and in CI.
#
# Go 1.27.1 and earlier count a basic block once for each line that
# comments split it into (golang/go#80974), so they report higher
# coverage than Go 1.27.2 and later, which count each block once.

profile: coverage.out

# main.go has one statement that no test can run, the os.Exit call, so
# the gate excludes the file and requires full coverage of the rest.
exclude:
  paths:
    - ^main\.go$

threshold:
  # The module has one package, so the total is the only threshold.
  total: 100
