# This is the coverage gate, enforced in CI (see
# .github/workflows/ci.yaml).
#
# The numbers are measured with Go 1.27.1. Its profiles count a basic
# block once for each row that comments split the block into
# (golang/go#80974), so the floors move when Go 1.27.2 fixes that.
#
# The floor started at 90, the project's target, because a skeleton has
# no mature measurement to set it under. It rises with each
# measurement above it.

profile: coverage.out

# Main.go holds one statement no test can run, the call that
# hands the process's exit code to the operating system, so the gate
# measures every other file and asks for all of it.
exclude:
  paths:
    - ^main\.go$

threshold:
  # One package, so the total is the whole gate.
  total: 100
