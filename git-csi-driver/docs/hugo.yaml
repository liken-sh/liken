# The manual of git-csi-driver, served at https://liken.sh/git/. The
# path is the first label of the driver name, `git.liken.sh`.
baseURL: https://liken.sh/git/
title: git-csi-driver
# The theme is brand/ at the top of the repository, the layout and
# stylesheet of every liken site. Hugo looks up a theme by name under
# themesDir, so the site builds with the theme from its own commit.
themesDir: ../..
theme: brand

# The theme's nav links to this URL, and the manual's sidebar title is
# its last path segment.
params:
  repository: https://github.com/liken-sh/liken/tree/main/git-csi-driver
  # Adds a footer link on every page to the coverage report, which the
  # site serves at /coverage.html.
  coverage: true

# A manual has no taxonomies or feeds. The sitemap stays for crawlers.
disableKinds: [taxonomy, term, rss]

# Every page is also written as its Markdown source, for agents and
# scripts, at index.md beside index.html. The theme writes the Markdown
# only for a site that declares this format (brand/theme.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the files of deploy/ as raw YAML at
# /deploy/<file>.yaml, so `kubectl apply -f` or a Kustomization's
# `resources` can install from a URL without a clone. The mount reads
# the files in the tree, so the served copy cannot go stale.
#
# Declaring any mount replaces Hugo's default mounts, so the content
# mount is declared again. The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
