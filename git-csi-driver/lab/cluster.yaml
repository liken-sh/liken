# The lab's Cluster: one leader, the public release channel, and no
# GitOps engine, so you apply manifests with kubectl from the host.

apiVersion: liken.sh/v1alpha1
kind: Cluster
metadata:
  name: lab
spec:
  # With one leader, k3s keeps its state in SQLite.
  leaders: [node-1]

  # node-1's address. This lab uses 10.30.0.0/24, liken's dev cluster
  # 10.10.0.0/24, and its GitOps lab 10.20.0.0/24, so the subnet of an
  # address in a log shows which lab it came from.
  endpoint: https://10.30.0.1:6443

  network:
    nodeCIDR: 10.30.0.0/24
    clusterCIDR: 10.42.0.0/16
    serviceCIDR: 10.43.0.0/16
    clusterDNS: 10.43.0.10
    clusterDomain: cluster.local

  time:
    upstreams: [time.cloudflare.com, time.nist.gov]

  # Keeps k3s within 1 GiB of memory, as in liken's dev cluster.
  runtime:
    k3s:
      goMemoryLimit: "25%"
      goGC: 50

  releases:
    # The public release channel that people install from.
    source: https://releases.liken.sh
