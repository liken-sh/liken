# node-1 is the lab's only machine.

apiVersion: liken.sh/v1alpha1
kind: Machine
metadata:
  name: node-1
spec:
  # Nobody attends this machine, so it reboots on its own when a change
  # needs a reboot.
  rebootPolicy: Auto

  network:
    interfaces:
      - name: eth0
      - name: eth1
        address: 10.30.0.1/24

  # The storage roles share three virtio disks. The guest boots with
  # UEFI, so it needs no BIOS boot roles. The driver's store is on
  # podStorage.
  storage:
    systemA:
      device: /dev/vdc
      size: 1Gi
    systemB:
      device: /dev/vdc
      size: 1Gi
    machineState:
      device: /dev/vda
      size: 64Mi
    machineEphemeral:
      device: /dev/vdb
      size: 512Mi
    clusterState:
      device: /dev/vda
    podStorage:
      device: /dev/vdb
      size: 2Gi
    podEphemeral:
      device: /dev/vdb
