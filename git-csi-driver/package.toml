# The CSI driver that mounts a git repository as a volume.
[package]
name = "git-csi-driver"
license = "MIT"

[docs]
prefix = "git"

# The Event writer of the shared kubernetes module, the scripts that
# put the license notices in the image, the CA bundle that the image
# copies, and the vulkan directory. The closure installs git from the
# Debian snapshot, with vulkan's snapshot.sh and vulkan's version as
# the snapshot date. The Go and Debian images come from toolchains.
[depends]
components = ["kubernetes", "notices", "toolchains", "trust", "vulkan"]

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# The image builds from this module's go.mod, which replaces the shared
# kubernetes module with ../kubernetes, so it takes that directory as a
# build context.
[[outputs.images]]
name = "git-csi-driver"
file = "Dockerfile"
contexts = { builder = "vulkan", kubernetes = "kubernetes", notices = "notices" }
versions = { SNAPSHOT = "vulkan" }
smoke = "git-csi-driver/smoke/git-csi-driver.sh"
