# The CSI driver that mounts a git repository as a volume.
[package]
name = "git-csi-driver"
license = "MIT"

[docs]
prefix = "git"

# gofmt, vet, the race tests, and the coverage gate on its pinned
# toolchain. The Makefile says why the gate pins a toolchain, and
# .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

[outputs]
deploy = "deploy"

[[outputs.images]]
name = "git-csi-driver"
file = "Dockerfile"
smoke = "git-csi-driver/smoke/git-csi-driver.sh"
