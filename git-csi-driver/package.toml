# The CSI driver that mounts a git repository as a volume.
[package]
name = "git-csi-driver"
license = "MIT"

[docs]
prefix = "git"

# kubernetes provides the Event writer. notices provides the scripts
# that copy license notices into the image. trust provides the CA bundle
# that the image copies. The closure installs git from the Debian
# snapshot, using vulkan's snapshot.sh and the snapshot date of
# vulkan's version. toolchains provides the Go and Debian images.
[depends]
components = ["kubernetes", "notices", "toolchains", "trust", "vulkan"]

# Runs gofmt, go vet, a check that go.mod is tidy, and the tests with
# the race detector, which write the coverage profile. Then the
# coverage gate reads that profile. .testcoverage.yml sets the minimum.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# Checks the links, checks that the generated skills are current, and
# builds the site.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# Runs the hooks in .pre-commit-config.yaml: the formatters, the
# linters, and the file checks.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job already runs these hooks' checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# This module's go.mod replaces the kubernetes module with
# ../kubernetes, so the image build needs that directory as a build
# context.
[[outputs.images]]
name = "git-csi-driver"
description = "git-csi-driver, which mounts a git repository as a Kubernetes volume, with the git and ssh that it runs."
file = "Dockerfile"
contexts = { builder = "vulkan", kubernetes = "kubernetes", notices = "notices" }
versions = { SNAPSHOT = "vulkan" }
smoke = "git-csi-driver/smoke/git-csi-driver.sh"
