# The driver's ServiceAccount and its permissions. The kubelet and the
# registrar talk to the driver over a socket, not through the API. The
# driver uses the API to post Events, so a person can see what a volume
# is doing, and to read the claim and the class that configure the
# volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-csi-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: git-csi-driver
rules:
  # The driver posts Events on the pods that mount a volume and on the
  # volume's claim. Those are in any namespace, so the rule is
  # cluster-wide.
  # When the same Event repeats within 10 minutes, the event recorder
  # patches the existing Event's count instead of creating a new one,
  # so the driver needs patch as well as create.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The driver watches every PersistentVolume for the pull annotation.
  # The kubelet sends the volumeHandle and not the PersistentVolume's
  # name, so the driver also lists PersistentVolumes to find a volume's
  # claim, then watches the claim and reads its VolumeAttributesClass.
  - apiGroups: [""]
    resources: [persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattributesclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: git-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: git-csi-driver
subjects:
  - kind: ServiceAccount
    name: git-csi-driver
    namespace: liken-system
