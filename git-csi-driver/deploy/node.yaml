# The node plugin. A volume's checkout is made on the node where the
# volume is published, so the plugin runs on every node. The driver
# container serves the CSI socket and owns the store directory. The
# registrar container tells the kubelet where that socket is.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: git-csi-driver-node
spec:
  selector:
    matchLabels:
      app: git-csi-driver-node
  # Update one node at a time. While a node's plugin restarts, that node
  # cannot stage or unpublish a volume, and unpublish pushes the last
  # commit.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: git-csi-driver-node
    spec:
      serviceAccountName: git-csi-driver
      # At shutdown the unpublish push has to run before the network goes
      # down and before liken remounts the disks read-only, so this
      # priority class makes the plugin stop late.
      priorityClassName: system-node-critical
      # A pod on any node can mount a volume, so the plugin tolerates
      # every taint, including the not-ready taint of a node that is
      # starting.
      tolerations:
        - operator: Exists
      containers:
        - name: driver
          image: ghcr.io/liken-sh/git-csi-driver:latest
          args:
            - node
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --store=/var/lib/liken/pod-storage/git-csi
            - --metrics=:9200
          # Prometheus scrapes this port on the pod's address over the
          # cluster network, so the port needs no hostPort.
          ports:
            - name: metrics
              containerPort: 9200
          env:
            # NodeGetInfo returns the node's name. The manifest is the same
            # for every node, so the name comes from the downward API.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Bind mounting onto a target path under the kubelet's pod
          # directory requires a privileged container, as does the mount
          # propagation below.
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
            # Bidirectional propagation makes a mount this container
            # creates under the pod directory visible on the host.
            # Without it, the workload's container would not see the
            # checkout.
            - name: pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: store
              mountPath: /var/lib/liken/pod-storage/git-csi
        # The upstream csi-node-driver-registrar reads the driver's name
        # from the CSI socket and registers the name and the socket's
        # host path with the kubelet.
        - name: registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/git.liken.sh/csi.sock
          # The registrar only connects to the CSI socket and serves the
          # registration socket, so it needs no privileges.
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: registration
              mountPath: /registration
      volumes:
        # Every hostPath uses DirectoryOrCreate, because a node that has
        # never run this driver does not have these directories.
        #
        # The driver's directory, where it serves the CSI socket that the
        # kubelet and the registrar connect to.
        - name: socket
          hostPath:
            path: /var/lib/kubelet/plugins/git.liken.sh
            type: DirectoryOrCreate
        # The directory where the kubelet looks for plugin registrations.
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        # The kubelet's pod directory, which contains every publish
        # target path. The container path matches the host path because
        # the kubelet sends target paths as host paths.
        - name: pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
        # The store: one bare repository for each URL and one work tree
        # for each writeable volume. On liken, /var/lib/liken/pod-storage
        # is the partition for pod volumes, so the store shares a disk
        # with the node's other volumes.
        - name: store
          hostPath:
            path: /var/lib/liken/pod-storage/git-csi
            type: DirectoryOrCreate
