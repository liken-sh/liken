# The CSIDriver tells the kubelet and the scheduler how to call the
# driver git.liken.sh.
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: git.liken.sh
spec:
  # The node plugin makes the checkout on the node that mounts it, so
  # there is no attach step.
  attachRequired: false

  # The kubelet passes the pod's name and namespace in each
  # NodePublishVolume call, so the node plugin can post an Event on the
  # pod when it refuses a mount.
  podInfoOnMount: true

  # The driver restores each file's mode and owner from its own metadata
  # record, so the kubelet must not change them for fsGroup.
  fsGroupPolicy: None

  # A writeable volume is a PersistentVolume. A read-only volume can
  # also be an inline volume in the pod spec.
  volumeLifecycleModes:
    - Persistent
    - Ephemeral

  # The node plugin receives a volume's nodePublishSecretRef Secret only
  # in a NodePublishVolume call, and keeps it in memory, never on disk.
  # With requiresRepublish, the kubelet repeats that call for every
  # mounted volume on each pod sync, with the Secret's current contents.
  # So a restarted node plugin gets its credentials back without
  # permission to read Secrets. A repeated call mounts and fetches
  # nothing.
  requiresRepublish: true

  # The driver does not provision storage, so it reports no capacity to
  # the scheduler.
  storageCapacity: false
