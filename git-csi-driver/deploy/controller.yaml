# The controller plugin checks a claim's change of VolumeAttributesClass,
# receives forge webhooks and patches each PersistentVolume that a push
# matches so that its nodes pull, and deletes a released PersistentVolume
# whose reclaim policy is Delete. It stores no volume data, so a restart
# loses nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-csi-driver-controller
---
# The rules from the upstream RBAC manifests of external-resizer and
# external-provisioner, plus two for the driver container: it patches a
# PersistentVolume to request a pull, and it reads the Secret that a
# webhook's path names. RBAC cannot limit the Secret rule to the Secrets
# that volumes name, so the driver can get any Secret in the cluster.
# The provisioner's rules for snapshots, VolumeAttachments, and
# CSIStorageCapacity are left out because the driver declares none of
# those capabilities, so the provisioner never reads them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: git-csi-driver-controller
rules:
  # The provisioner deletes a released PersistentVolume with the Delete
  # reclaim policy. It also patches a finalizer onto a bound one, so
  # that DeleteVolume still runs when someone deletes the
  # PersistentVolume before its claim.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, patch, update, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, patch, update]
  # The resizer records the claim's current class in its status.
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, list, watch, patch, update]
  # The driver container verifies a webhook's signature with the key in
  # the Secret that the path /webhook/<namespace>/<name> names.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattributesclasses]
    verbs: [get, list, watch]
  # Before it calls CreateVolume, the provisioner reads the claim's
  # StorageClass, and the nodes and CSINode objects for topology.
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: git-csi-driver-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: git-csi-driver-controller
subjects:
  - kind: ServiceAccount
    name: git-csi-driver-controller
    namespace: liken-system
---
# Each sidecar elects a leader through a Lease in this namespace, so
# that only one replica writes a claim's status or deletes a
# PersistentVolume. The Lease name comes from the driver name with every
# character that is not a letter, digit, or dash replaced by a dash. The
# resizer prefixes it with external-resizer-, and the provisioner uses
# it unchanged. RBAC cannot limit create to one name, because the name
# of an object that does not exist yet is not in the request path.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: git-csi-driver-controller
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [external-resizer-git-liken-sh, git-liken-sh]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-csi-driver-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: git-csi-driver-controller
subjects:
  - kind: ServiceAccount
    name: git-csi-driver-controller
    namespace: liken-system
---
# A forge posts webhooks to this Service through an Ingress that you
# write. The listener serves plain HTTP, and the Ingress terminates TLS,
# because the cluster already keeps its certificates there.
apiVersion: v1
kind: Service
metadata:
  name: git-csi-driver-webhook
spec:
  selector:
    app: git-csi-driver-controller
  ports:
    - name: webhook
      port: 80
      targetPort: webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-csi-driver-controller
spec:
  # One replica is enough, because a class change or a PersistentVolume
  # deletion that is a minute late does no harm. Two replicas also work:
  # each sidecar acts only while it holds its Lease, and either driver
  # container can handle a webhook.
  replicas: 1
  # The new pod starts before the old one stops, so the webhook is
  # unavailable only briefly during a rollout. A new sidecar becomes
  # leader when the old sidecar releases its Lease on exit, or when the
  # Lease expires, up to 30 seconds after the old pod stops. Class
  # changes and deletions wait until then.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: git-csi-driver-controller
  template:
    metadata:
      labels:
        app: git-csi-driver-controller
    spec:
      serviceAccountName: git-csi-driver-controller
      containers:
        # The node plugin's binary, run with the controller subcommand.
        - name: driver
          image: ghcr.io/liken-sh/git-csi-driver:latest
          args:
            - controller
            - --endpoint=unix:///csi/csi.sock
            - --metrics=:9200
            - --webhook=:8080
          # A forge outside the cluster reaches the webhook port through
          # the Service above and an Ingress that you write. 9200 is the
          # metrics port that liken's components share.
          ports:
            - name: metrics
              containerPort: 9200
            - name: webhook
              containerPort: 8080
          # The controller mounts nothing and has no store, so it needs
          # no privileges.
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
        # The external-resizer sidecar sends a claim's class change to
        # ControllerModifyVolume and records the result on the claim.
        - name: resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.3.1
          args:
            - --csi-address=/csi/csi.sock
            # VolumeAttributesClass enables class changes. The sidecar
            # turns it off by itself when the cluster serves no v1
            # VolumeAttributesClass. ReleaseLeaderElectionOnExit makes
            # the sidecar handle SIGTERM and SIGINT, finish the write in
            # progress, and release its Lease before it exits. Without
            # the gate the sidecar has no signal handler, and after a
            # rollout the new resizer waits for the old Lease to expire.
            - --feature-gates=VolumeAttributesClass=true,ReleaseLeaderElectionOnExit=true
            # Two resizers that act on one claim race on its status. A
            # leader retries its renew every 5 seconds until a 10-second
            # renew deadline, so it can keep writing for up to 15 seconds
            # after its last successful renew. With the sidecar's default
            # 15-second Lease, a new leader could start while the old one
            # still writes. A 30-second Lease gives the old leader 15
            # seconds to stop first.
            - --leader-election
            - --leader-election-lease-duration=30s
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
        # The external-provisioner sidecar deletes a released
        # PersistentVolume with the Delete reclaim policy: it calls
        # DeleteVolume, then deletes the object, and each node plugin
        # removes its own work tree when its watch reports the delete. A
        # person writes every PersistentVolume of this driver, so none
        # has the pv.kubernetes.io/provisioned-by annotation, and the
        # sidecar matches them by spec.csi.driver. A claim whose
        # StorageClass has the provisioner git.liken.sh gets an Event
        # with the Unimplemented error that CreateVolume returns.
        - name: provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.1
          args:
            - --csi-address=/csi/csi.sock
            # The same Lease timing as the resizer, for the same reason:
            # two provisioners that delete one PersistentVolume race.
            - --leader-election
            - --leader-election-lease-duration=30s
            - --feature-gates=ReleaseLeaderElectionOnExit=true
            # The driver has no snapshots.
            - --snapshot-orphan-sweep-interval=0
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
      volumes:
        # The kubelet never calls the controller plugin, so only the
        # containers of this pod use the socket.
        - name: socket
          emptyDir: {}
