# Scrapes /metrics on the port named metrics of the controller pods in
# deploy/controller.yaml, selected by their app label. The relabeling
# adds a node label, as in podmonitor-node.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: git-csi-driver-controller
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: git-csi-driver-controller
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
