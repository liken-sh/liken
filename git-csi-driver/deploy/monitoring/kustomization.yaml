# Adds a PodMonitor for the driver's node pods and one for its
# controller pods, and a Grafana dashboard. The base in deploy/ opens
# the metrics ports, but nothing scrapes them. In a cluster that runs
# prometheus-operator, add this component beside the base:
#
#   resources:
#     - https://github.com/liken-sh/liken//git-csi-driver/deploy?ref=<tag>
#   components:
#     - https://github.com/liken-sh/liken//git-csi-driver/deploy/monitoring?ref=<tag>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# This Component sets no namespace field, because the field would also
# move the dashboard ConfigMap into liken-system, and Grafana's
# dashboard sidecar watches the monitoring namespace. Each PodMonitor
# sets metadata.namespace to liken-system itself.

resources:
  - podmonitor-node.yaml
  - podmonitor-controller.yaml

configMapGenerator:
  - name: git-csi-driver-dashboard
    namespace: monitoring
    files:
      - dashboards/git-csi-driver.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
