# Scrapes /metrics on the port named metrics of the pods of the node
# DaemonSet in deploy/node.yaml, selected by their app label.
#
# The PodMonitor is in liken-system, the namespace of those pods, so it
# needs no namespaceSelector. kustomization.yaml explains why the
# Component does not set the namespace.
#
# The relabeling copies the pod's node name to a node label on every
# series, so the fleet dashboard can select by node.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: git-csi-driver-node
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: git-csi-driver-node
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
