# The kustomize base for the git CSI driver.
#
# This base is for the cluster owner to take. liken does not apply it
# and does not name it. Take it through your own GitOps with patches
# of your own, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is set with a transformer, not with the top-level
# namespace field, because unsetOnly keeps an object that states its
# own namespace where it belongs. The top-level field overwrites a
# stated namespace, and Flux merges a Kustomization's components into
# this file, so the field would move the monitoring component's
# dashboard out of the monitoring namespace.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - csidriver.yaml
  - rbac.yaml
  - node.yaml
  - controller.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: git-csi-driver
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/git-csi-driver
    newTag: latest
