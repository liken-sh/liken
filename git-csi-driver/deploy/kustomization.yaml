# The kustomize base of git-csi-driver. liken does not apply it. Apply
# it with your own GitOps tool and patches, or read it and write your
# own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The NamespaceTransformer with unsetOnly puts each object that has no
# namespace in liken-system and leaves the others. The top-level
# namespace field would overwrite every namespace, and Flux merges a
# Kustomization's components into this file, so the field would move
# the monitoring component's dashboard out of the monitoring
# namespace.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - csidriver.yaml
  - rbac.yaml
  - node.yaml
  - controller.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: git-csi-driver
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/git-csi-driver
    newTag: latest
