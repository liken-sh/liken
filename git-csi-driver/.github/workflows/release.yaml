# Every image this repository publishes goes through this workflow.
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.03-007, and the images ship under that
# tag and :latest. A push to main cuts a development build: the
# version is the most recent release tag plus a suffix,
# 2026.09.03-007-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# ci.yaml holds the tests, the coverage floors, and the other checks.
# This workflow builds the images beside that run and pushes nothing
# until the run passes, so a development build that failed its tests
# never sits one pin away from a cluster.
#
# The tag is also what a consumer pins to when it references the
# kustomize base in deploy/, so a release tag names both an image in
# the registry and the manifests that deploy it, at one commit.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read
  packages: write
  # actions: read lets the gate step in the release job read the state
  # of the ci run for this commit through the workflow's own token.
  actions: read

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no machine can order against
      # the others. A push to main derives it: git describe finds the
      # most recent release tag and counts the commits since it, and
      # the first eight characters of the commit sha make the build
      # traceable. The checkout fetches the whole history, because
      # describe needs the tags.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            # A repository with no release yet has nothing to describe.
            # Its development builds count from the first commit under
            # the version 0000.00.00-000, which sorts before any real
            # release.
            if described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]' 2>/dev/null); then
              release=${described%-*-g*}
              count=${described#"$release"-}
              count=${count%-g*}
            else
              release=0000.00.00-000
              count=$(git rev-list --count HEAD)
            fi
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins
      # its manifests needs the full commit sha: a git fetch by sha
      # wants all forty characters, and the eight in the version are
      # not enough. The run's summary prints the two lines to paste,
      # so a roll is a copy.
      - name: Write the roll lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image builds here and pushes nothing yet.
      # The image is proved before anything reaches ghcr.io. A push that
      # came first would leave a broken :latest behind when the proof
      # failed.
      #
      # The builds read and write the same :buildcache tags ci.yaml
      # uses.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=registry,ref=ghcr.io/liken-sh/git-csi-driver:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/git-csi-driver:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/git-csi-driver:${{ env.VERSION }}
            ghcr.io/liken-sh/git-csi-driver:latest

      # The image is a closure on scratch, so nothing in it came from a
      # package manager, and a file the closure script dropped shows
      # up only when a command opens it. This step runs each such
      # command by name before the image can ship. audio-operator's
      # release workflow proves its closure the same way.
      - name: Prove the closure
        run: |
          set -eu
          export LC_ALL=C
          image="ghcr.io/liken-sh/git-csi-driver:$VERSION"

          # Every path in the image, as a process in it sees them.
          container=$(docker create "$image")
          docker export "$container" | tar -t | sed 's|^|/|; s|/$||' | sort -u > image-files.txt
          docker rm "$container" > /dev/null

          # The programs git execs by name from its exec path.
          # git-remote-https serves an https URL, git-upload-pack and
          # git-receive-pack serve a URL that is a local path, the git
          # beside them is what git re-execs for gc, fetch, and push,
          # and /bin/sh is what git runs the credential helper and
          # GIT_SSH_COMMAND through. No command below reaches the two
          # pack programs, so the listing is the only check on them.
          # git execs the shell as /bin/sh, and the image reaches that
          # name through the /bin link into /usr, so the export holds
          # the link and /usr/bin/sh.
          for path in \
            /usr/bin/git \
            /usr/bin/ssh \
            /bin \
            /usr/bin/sh \
            /usr/lib/git-core/git \
            /usr/lib/git-core/git-remote-https \
            /usr/lib/git-core/git-upload-pack \
            /usr/lib/git-core/git-receive-pack \
            /etc/ssl/certs/ca-certificates.crt \
            /etc/passwd
          do
            grep -qx "$path" image-files.txt \
              || { echo "the image has no $path"; exit 1; }
          done

          reported=$(docker run --rm "$image" --version)
          echo "$reported" | grep -Fq "$VERSION" \
            || { echo "the image reports '$reported', which does not name $VERSION"; exit 1; }

          docker run --rm --entrypoint git "$image" --version \
            || { echo "the image has no working git"; exit 1; }

          docker run --rm --entrypoint ssh "$image" -V \
            || { echo "the image has no working ssh"; exit 1; }

          # One fetch from the public forge over https. It runs
          # git-remote-https, and its answer proves the CA bundle
          # verifies a real certificate from the path git reads by
          # default.
          docker run --rm --entrypoint git "$image" \
            ls-remote https://github.com/liken-sh/git-csi-driver.git HEAD \
            || { echo "the image did not reach the forge over https"; exit 1; }

          # The sweep's collect, in a repository this run makes.
          # gc.auto=1 makes the one commit enough work to run, and gc
          # farms every step out to the git on the exec path.
          docker run --rm --entrypoint /bin/sh "$image" -c '
            set -eu
            export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null LC_ALL=C
            export GIT_AUTHOR_NAME=gate GIT_AUTHOR_EMAIL=gate@liken.sh
            export GIT_COMMITTER_NAME=gate GIT_COMMITTER_EMAIL=gate@liken.sh
            git init --quiet /repo
            cd /repo
            echo collected > file
            git add file
            git commit --quiet -m "one commit"
            git -c gc.autoDetach=false -c gc.auto=1 gc --quiet --auto --prune=now
          ' || { echo "the image did not collect a repository"; exit 1; }

      # ci.yaml runs beside this workflow on a push to main and holds
      # the coverage floors and the other checks. This step waits for
      # that run and lets nothing push from a red gate. The images built
      # while the checks ran, so the wait is normally over before this
      # step starts. A tag's ci run finished when its commit landed on
      # main, so a tag never waits; a tag on a commit older than the run
      # retention finds no run and fails, and the answer is to re-run ci
      # on that commit and push the tag again. GITHUB_SHA names the tag
      # object for an annotated tag, and the ci run is keyed by the
      # commit, so the lookup resolves the commit first.
      - name: require the gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          for _ in $(seq 1 40); do
            state=$(gh run list --workflow ci.yaml --commit "$commit" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success")
                exit 0 ;;
              "completed "*)
                echo "the ci run for $commit ended with ${state#completed }; no image ships from a red gate" >&2
                exit 1 ;;
              "")
                if [ "$GITHUB_REF_TYPE" = tag ]; then
                  echo "no ci run exists for $commit; re-run ci on that commit, then push the tag again" >&2
                  exit 1
                fi
                echo "no ci run for $commit yet" ;;
              *)
                echo "the ci run for $commit is $state" ;;
            esac
            sleep 15
          done
          echo "the ci run for $commit did not finish within ten minutes" >&2
          exit 1

      # :latest marks the newest release and nothing else. A
      # development build pushes its own tag only.
      - name: Push the image
        run: |
          docker push "ghcr.io/liken-sh/git-csi-driver:$VERSION"
          if [ "$RELEASE" = true ]; then
            docker push "ghcr.io/liken-sh/git-csi-driver:latest"
          fi
