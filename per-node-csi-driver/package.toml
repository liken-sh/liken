# The CSI driver that gives each node its own directory of a volume.
[package]
name = "per-node-csi-driver"
license = "MIT"

# The scripts that put the license notices in the image.
[depends]
components = ["notices"]

[docs]
prefix = "per-node"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

[[outputs.images]]
name = "per-node-csi-driver"
file = "Dockerfile"
contexts = { notices = "notices" }
smoke = "per-node-csi-driver/smoke/per-node-csi-driver.sh"
