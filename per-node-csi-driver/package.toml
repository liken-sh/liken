# The CSI driver that gives each node its own directory of a volume.
[package]
name = "per-node-csi-driver"
license = "MIT"

# kubernetes supplies the Event writer, notices the scripts that copy
# the license notices into the image, and toolchains the Go image.
[depends]
components = ["kubernetes", "notices", "toolchains"]

[docs]
prefix = "per-node"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job already runs these checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the kubernetes module with ../kubernetes, so the
# image build needs that directory as a build context.
[[outputs.images]]
name = "per-node-csi-driver"
description = "per-node-csi-driver, which gives a pod a directory on the node it runs on."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }
smoke = "per-node-csi-driver/smoke/per-node-csi-driver.sh"
