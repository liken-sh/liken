# The manual of the per-node CSI driver. Its path is the first label of
# the driver name `per-node.liken.sh`, so a reader who sees the driver
# name in a volume can find the manual.
baseURL: https://liken.sh/per-node/
title: per-node-csi-driver
# The theme is brand/ at the top of the repository, so the site always
# builds with the theme of the same commit.
themesDir: ../..
theme: brand

# The theme links to the repository from the nav, and titles the
# sidebar with the last segment of this URL.
params:
  repository: https://github.com/liken-sh/liken/tree/main/per-node-csi-driver
  # Puts a footer link to the coverage report, /coverage.html, on every
  # page.
  coverage: true

# The manual has no taxonomies and no feed. It keeps the sitemap for
# crawlers.
disableKinds: [taxonomy, term, rss]

# Every page renders as HTML and also as its Markdown source, for agents
# and scripts. The Markdown file is next to the HTML file, so the
# Markdown of / is /index.md. The theme writes the Markdown only when
# the site declares this format (brand/theme.md).
outputFormats:
  markdown:
    # With baseName index and the md suffix of Hugo's text/markdown
    # type, the file is index.md, next to index.html.
    baseName: index
    isPlainText: true
    mediaType: text/markdown

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the files of deploy/ unchanged at /deploy/<file>.yaml,
# so `kubectl apply -f` and a Kustomization can use the URLs and an
# install needs no clone.
#
# A mount list replaces the site's default mounts, so the content mount
# is listed too. The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
