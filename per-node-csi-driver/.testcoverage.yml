# The coverage gate. make test-go runs it, locally and in CI.
#
# Go 1.27.2 and later count each basic block once. Go 1.27.1 and earlier
# count a block once for each row that comments split it into
# (golang/go#80974), and report higher coverage.

profile: coverage.out

# No test can run the os.Exit call in main.go, so the gate skips
# main.go and requires every statement in the other files.
exclude:
  paths:
    - ^main\.go$

threshold:
  total: 100
