apiVersion: liken.sh/v1alpha1
kind: Machine
metadata:
  name: node-1
spec:
  # Nobody is at this machine to reboot it, so it reboots itself when a
  # change needs a reboot.
  rebootPolicy: Auto

  network:
    interfaces:
      - name: eth0
      - name: eth1
        address: 10.40.0.1/24

  # The guest boots with UEFI firmware, so the spec has no biosBoot or
  # bootHome role. The driver's store, /var/lib/liken/pod-storage/per-node,
  # is on the podStorage role.
  storage:
    systemA:
      device: /dev/vdc
      size: 1Gi
    systemB:
      device: /dev/vdc
      size: 1Gi
    machineState:
      device: /dev/vda
      size: 64Mi
    machineEphemeral:
      device: /dev/vdb
      size: 512Mi
    clusterState:
      device: /dev/vda
    podStorage:
      device: /dev/vdb
      size: 2Gi
    podEphemeral:
      device: /dev/vdb
