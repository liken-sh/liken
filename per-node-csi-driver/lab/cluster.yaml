# The lab's Cluster has no GitOps engine, so the lab Makefile applies
# manifests with kubectl from the host.

apiVersion: liken.sh/v1alpha1
kind: Cluster
metadata:
  name: lab
spec:
  # With one leader, k3s keeps its state in SQLite.
  leaders: [node-1]

  # node-1's address on the cluster segment. Each liken lab has its own
  # subnet: 10.10.0.0/24 for the dev cluster, 10.20.0.0/24 for the
  # GitOps lab, 10.30.0.0/24 for the git CSI driver's lab, and
  # 10.40.0.0/24 for this lab. So an address in a log shows its lab.
  endpoint: https://10.40.0.1:6443

  network:
    nodeCIDR: 10.40.0.0/24
    clusterCIDR: 10.42.0.0/16
    serviceCIDR: 10.43.0.0/16
    clusterDNS: 10.43.0.10
    clusterDomain: cluster.local

  time:
    upstreams: [time.cloudflare.com, time.nist.gov]

  # The guest pulls lab.registry:5000 images from the registry on the
  # host, which QEMU's user-mode network makes reachable at 10.0.2.2.
  registries:
    mirrors:
      "lab.registry:5000":
        - http://10.0.2.2:5000

  # These Go runtime settings, from liken's dev cluster, keep k3s within
  # the guest's 1 GiB of memory.
  runtime:
    k3s:
      goMemoryLimit: "25%"
      goGC: 50

  releases:
    source: https://releases.liken.sh
