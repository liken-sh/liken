apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: per-node.liken.sh
spec:
  # A publish is a mkdir and a bind mount on the pod's node, so there is
  # nothing to attach.
  attachRequired: false

  # The kubelet sends the pod's name and namespace with each publish, so
  # the driver can post Events on the pod.
  podInfoOnMount: true

  # Every copy has mode 0777, so a pod that runs as any user can write
  # it. A recursive chown of a large copy on every pod start would be
  # slow and change nothing.
  fsGroupPolicy: None

  # Every volume of this driver is a PersistentVolume that a person or
  # an operator creates. The driver has no inline volumes.
  volumeLifecycleModes:
    - Persistent

  # A bind mount needs no refresh, so the kubelet calls
  # NodePublishVolume once for each mount.
  requiresRepublish: false

  # The driver provisions nothing, so it reports no capacity to the
  # scheduler.
  storageCapacity: false
