# The kustomize base for the per-node CSI driver. liken does not apply
# it. Apply it through your own GitOps with your own patches, or use it
# as a reference for your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The top-level namespace field overwrites every namespace, and Flux
# merges a Kustomization's components into this file, so the field would
# move the monitoring dashboard out of the monitoring namespace. A
# NamespaceTransformer with unsetOnly sets the namespace only on objects
# that have none.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - csidriver.yaml
  - storageclass.yaml
  - rbac.yaml
  - node.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: per-node-csi-driver
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/per-node-csi-driver
    newTag: latest
