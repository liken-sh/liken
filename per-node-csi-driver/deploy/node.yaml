# The node plugin runs on every node, because each node keeps its own
# copy of each volume.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: per-node-csi-driver-node
spec:
  selector:
    matchLabels:
      app: per-node-csi-driver-node
  # While the plugin restarts on a node, a pod with a volume of this
  # driver cannot start or stop there, so the rollout restarts one node
  # at a time.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: per-node-csi-driver-node
    spec:
      serviceAccountName: per-node-csi-driver
      # During a graceful node shutdown, the kubelet stops critical pods
      # after the other pods, so the plugin is still running to unpublish
      # their volumes.
      priorityClassName: system-node-critical
      # Every node needs the plugin to publish and unpublish volumes,
      # whatever taints the node has, including the not-ready taint.
      tolerations:
        - operator: Exists
      containers:
        - name: driver
          image: ghcr.io/liken-sh/per-node-csi-driver:latest
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-id=$(NODE_NAME)
            - --store=/var/lib/liken/pod-storage/per-node
            - --metrics=:9200
          # Prometheus scrapes the pod's address on the cluster network.
          # No hostPort, because a hostPort opens the port on every
          # address of the node. liken components serve metrics on port
          # 9200 by convention.
          ports:
            - name: metrics
              containerPort: 9200
          env:
            # NodeGetInfo returns this name as the node ID.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # The bind mount onto the target path and the Bidirectional
          # mount propagation below both need a privileged container.
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
            # Bidirectional, so a mount that the driver makes here
            # propagates to the host's mount namespace, where the
            # container runtime binds it into the workload's container.
            - name: pods
              mountPath: /var/lib/kubelet/pods
              mountPropagation: Bidirectional
            - name: store
              mountPath: /var/lib/liken/pod-storage/per-node
        # The upstream registrar reads the driver's name over the socket
        # and registers the socket's host path with the kubelet.
        - name: registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/per-node.liken.sh/csi.sock
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: socket
              mountPath: /csi
            - name: registration
              mountPath: /registration
      volumes:
        # Each path is DirectoryOrCreate, because a node that has never
        # run this driver does not have it.
        - name: socket
          hostPath:
            path: /var/lib/kubelet/plugins/per-node.liken.sh
            type: DirectoryOrCreate
        - name: registration
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        # The container path equals the host path, because the kubelet
        # sends each target path as a host path and the driver mounts at
        # that path.
        - name: pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: DirectoryOrCreate
        # The store has one copy per volume handle under copies/ and a
        # mount record for each published target under holds/. On liken,
        # /var/lib/liken/pod-storage is the partition for pod volumes, so
        # the copies share a disk with the node's other pod volumes.
        - name: store
          hostPath:
            path: /var/lib/liken/pod-storage/per-node
            type: DirectoryOrCreate
