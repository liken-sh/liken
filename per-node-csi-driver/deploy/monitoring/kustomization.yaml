# The monitoring component, liken's shared contract for connecting a
# Prometheus to a process, milestone 65. The base in deploy/ applies on
# a cluster with no monitoring at all. A cluster owner who runs the
# prometheus-operator adds this component beside the base:
#
# resources:
#   - https://github.com/liken-sh/per-node-csi-driver//deploy?ref=<tag>
# components:
#   - https://github.com/liken-sh/per-node-csi-driver//deploy/monitoring?ref=<tag>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The dashboard ConfigMap belongs in the monitoring namespace, where the
# kube-prometheus-stack sidecar watches for the grafana_dashboard label,
# not in liken-system beside the driver's own resources. A Component
# cannot set namespace: per resource, so podmonitor.yaml carries its own
# metadata.namespace instead of inheriting one from this file.
configMapGenerator:
  - name: per-node-csi-driver-dashboard
    namespace: monitoring
    files:
      - dashboards/per-node-csi-driver.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
