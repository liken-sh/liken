# The monitoring component adds a PodMonitor and a Grafana dashboard
# for a cluster that runs the prometheus-operator. Add it beside the
# base:
#
# resources:
#   - https://github.com/liken-sh/liken//per-node-csi-driver/deploy?ref=<tag>
# components:
#   - https://github.com/liken-sh/liken//per-node-csi-driver/deploy/monitoring?ref=<tag>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The dashboard ConfigMap is in the monitoring namespace, where the
# Grafana sidecar of kube-prometheus-stack watches for the
# grafana_dashboard label. A Component has no namespace field, so
# podmonitor.yaml sets its own namespace, liken-system.
configMapGenerator:
  - name: per-node-csi-driver-dashboard
    namespace: monitoring
    files:
      - dashboards/per-node-csi-driver.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
