# Scrapes the node plugin's pods. The relabeling adds a node label to
# each series, so a reading of a copy shows which node's store it is in.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: per-node-csi-driver-node
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: per-node-csi-driver-node
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
