# A PersistentVolume and its claim both set storageClassName to this
# class. The driver provisions nothing, so a person creates each
# PersistentVolume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: per-node
provisioner: per-node.liken.sh
# Retain, because the driver has no controller that deletes volumes.
# When the claim is deleted, the PersistentVolume becomes Released, and
# its copies stay on the nodes until the PersistentVolume is deleted.
reclaimPolicy: Retain
# Immediate, because the volume has no node affinity, so the claim can
# bind before the scheduler places a pod. Each node makes its own copy
# when a pod on it mounts the volume.
volumeBindingMode: Immediate
