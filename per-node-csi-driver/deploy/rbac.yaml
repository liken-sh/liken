# The node plugin's pods run as this account. Only the driver container
# calls the Kubernetes API. The registrar talks to the kubelet and the
# driver over Unix sockets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: per-node-csi-driver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: per-node-csi-driver
rules:
  # The sweep watches PersistentVolumes, because neither CSI nor the
  # kubelet calls a node plugin when a PersistentVolume is deleted. The
  # sweep deletes the copy of a volume whose PersistentVolume is gone.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  # The driver posts an Event on the pod whose mount it refused, so
  # kubectl describe shows the reason. The pod can be in any namespace,
  # so the rule is cluster-wide.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: per-node-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: per-node-csi-driver
subjects:
  - kind: ServiceAccount
    name: per-node-csi-driver
    namespace: liken-system
