# The bus half of a screen client, as a Rust library. media-operator's
# idle screen and library-operator's media browser link it by path, so
# each one lists it in [depends]. It publishes nothing of its own.
[package]
name = "media-screen"
license = "MIT"

[[jobs]]
name = "rust"
toolchain = "rust"
run = "make test"
timeout = 20
env = { CARGO_INCREMENTAL = "0" }
coverage = ["coverage-media-screen.xml"]

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
