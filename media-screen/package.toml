# A Rust library that publishes no output. media-operator's idle screen
# and library-operator's media browser link it by path, so each lists it
# in its own `components`, and a change here runs their jobs too.
[package]
name = "media-screen"
license = "MIT"

[[jobs]]
name = "rust"
toolchain = "rust"
run = "make test"
timeout = 20
env = { CARGO_INCREMENTAL = "0" }
coverage = ["coverage-media-screen.xml"]

# Runs the hooks of .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The rust job already runs `cargo fmt --check`.
skip = ["cargo-fmt"]
