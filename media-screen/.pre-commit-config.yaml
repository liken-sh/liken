# These checks run before every commit, through pre-commit or prek,
# its drop-in replacement. They are the fast, local ones: formatters,
# linters, and hygiene checks. The test suites and the coverage gates
# run in CI, through the `make` targets that package.toml names.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cargo fmt --check'
        language: system
        files: \.rs$|^Cargo\.(toml|lock)$|^rust-toolchain\.toml$
        pass_filenames: false
