# media-screen does everything a screen client for one `Player` does
# over MQTT, except drawing. It runs the idle timers, puts the screen to
# sleep, requests the panel off, reads the volume level that media-operator
# relays, acts on a remote's presses only while the remote's focus is on
# this `Player`, and requests that media-operator move that focus. Both
# media-operator's idle screen and library-operator's media browser link
# it, so the two programs follow the same rules. It also names the audio
# and subtitle tracks of a file, its language, role, and format, for the
# media browser and media-operator's display.
#
# The crate depends on no window or drawing library, because each client
# draws with its own toolkit.
[package]
name = "media-screen"
version = "0.1.0"
edition = "2024"

[lib]
name = "media_screen"
path = "src/lib.rs"

[dependencies]
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The crate sets its gauges through this facade and installs no
# recorder. In a client that installs none, the values are discarded.
metrics = { workspace = true }

# DebuggingRecorder keeps gauge values in memory, so a test reads them
# with no mock.
[dev-dependencies]
metrics-util = { version = "=0.20.4", default-features = false, features = ["debugging"] }

# The crate is its own workspace, so its tests and coverage gate run
# here. The versions are exact, so a client that links the crate
# resolves the same rumqttc and serde that the crate's tests ran with.
[workspace]
resolver = "3"

[workspace.dependencies]
rumqttc = { version = "=0.25.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
metrics = "=0.24.6"
