# The INDI images: indi, with indiserver, every core driver, and the
# shim that connects the server to a driver in another pod, and one
# image on it for each vendor SDK family, the third-party drivers with
# no SDK, the simulators, and PHD2, the guider. observatory-operator
# runs them.
[package]
name = "indi"
# The date of the snapshots of Ubuntu, the INDI PPA, and the PHD2 PPA
# that the build installs from, as YYYYMMDD. A new INDI is a new date:
# CI builds these images only when this tag is not published yet.
version = "20261111"
revision = 1
license = "MIT"

# The upstream releases that the snapshots hold, as the packages name
# them. Each one is a label of every image, sh.liken.upstream.<name>,
# and the smoke check compares them with the packages in the image.
[package.upstream]
indi = "2.2.5+202610040455~ubuntu26.04.1"
indi-3rdparty = "2.2.0+202610040550~ubuntu26.04.1"
gsc = "1.3+202609080545~ubuntu26.04.1"
phd2 = "2.6.14.rev20251216-0ppa1~ubuntu26.04"

# The CA bundle that the builder reads the snapshots over HTTPS with,
# and indi-open ships, and the Ubuntu and Go images from toolchains.
[depends]
components = ["toolchains", "trust"]

[[jobs]]
name = "go"
toolchain = "go"
dir = "shim"
run = "make test"

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[[outputs.images]]
name = "indi"
description = "indiserver, socat, and every program in indi-bin: the core INDI drivers, simulators, and tools."
target = "indi"
smoke = "indi/smoke/indi.sh"

[[outputs.images]]
name = "indi-simulators"
description = "The GSC star catalog and the gsc program, which the INDI CCD and guide simulators read to draw stars."
target = "indi-simulators"
smoke = "indi/smoke/simulators.sh"

[[outputs.images]]
name = "indi-phd2"
description = "PHD2, the guider, as a client of an INDI server."
target = "indi-phd2"
smoke = "indi/smoke/phd2.sh"

[[outputs.images]]
name = "indi-open"
description = "The third-party INDI drivers that link no vendor SDK."
target = "indi-open"
smoke = "indi/smoke/drivers.sh"

[[outputs.images]]
name = "indi-zwo"
description = "INDI drivers for ZWO cameras, EFW filter wheels, EAF focusers, the CAA rotator, and the USB-to-ST4 adapter."
target = "indi-zwo"
smoke = "indi/smoke/drivers.sh"

[[outputs.images]]
name = "indi-qhy"
description = "INDI drivers for QHY cameras."
target = "indi-qhy"
smoke = "indi/smoke/qhy.sh"

[[outputs.images]]
