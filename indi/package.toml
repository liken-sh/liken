# The INDI images: indi, with indiserver, every core driver, and the
# shim that connects the server to a driver in another pod, and one
# image on it for each vendor SDK family, the third-party drivers with
# no SDK, and the simulators. observatory-operator runs them.
[package]
name = "indi"
# The date of the snapshots of Ubuntu and the INDI PPA that the build
# installs from, as YYYYMMDD. A new INDI is a new date: CI builds these
# images only when this tag is not published yet.
version = "20261005"
revision = 2
license = "MIT"

# The upstream releases that the snapshots hold, as the packages name
# them. Each one is a label of every image, sh.liken.upstream.<name>,
# and the smoke check compares them with the packages in the image.
[package.upstream]
indi = "2.2.5+202610040455~ubuntu26.04.1"
indi-3rdparty = "2.2.0+202610040550~ubuntu26.04.1"
gsc = "1.3+202609080545~ubuntu26.04.1"

# The CA bundle that the builder reads the snapshots over HTTPS with,
# and indi-open ships.
[depends]
components = ["trust"]

[[jobs]]
name = "go"
toolchain = "go"
dir = "shim"
run = "make test"

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[[outputs.images]]
name = "indi"
target = "indi"
smoke = "indi/smoke/indi.sh"

[[outputs.images]]
name = "indi-simulators"
target = "indi-simulators"
smoke = "indi/smoke/simulators.sh"

[[outputs.images]]
name = "indi-open"
target = "indi-open"
smoke = "indi/smoke/drivers.sh"

