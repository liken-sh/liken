# The vulkan image plus the VA-API loader, the Intel media driver, and
# Mesa's VA driver for AMD.
[package]
name = "vaapi"
# The date of the snapshot.debian.org archive that the build installs
# from, as YYYYMMDD. Every base on Debian uses the same date.
version = "20261024"
revision = 2
license = "MIT"

# The upstream releases that the snapshot holds, as Debian names them.
# Each one is a label of the image, sh.liken.upstream.<name>. A new
# snapshot date updates them.
[package.upstream]
libva = "2.24.1-2"
intel-media-driver-non-free = "26.3.5+ds1-1"
mesa = "26.2.5-1"

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"

[depends]
components = ["toolchains", "vulkan"]

# The build takes the vulkan directory as the context builder, for the
# scripts that every base on Debian uses.
[[outputs.images]]
name = "vaapi"
contexts = { builder = "vulkan" }
