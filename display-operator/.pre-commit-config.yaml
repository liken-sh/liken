# Fast checks that pre-commit or prek runs before each commit. CI runs
# the tests and the coverage gate through `make test-go`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The files in testdata/ are recorded from real monitors byte for
      # byte, so the whitespace fixers must not change them.
      - id: trailing-whitespace
        exclude: ^testdata/
      - id: end-of-file-fixer
        exclude: ^testdata/
      - id: check-yaml
        # Kubernetes manifests are multi-document streams.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
  # shellcheck-py installs a prebuilt shellcheck, so the hook needs no
  # shellcheck on the machine.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
        language: system
        files: \.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        # -diff fails on an untidy go.mod without rewriting it during
        # the commit.
        entry: bash -c 'go mod tidy -diff'
        language: system
        files: \.go$|^go\.(mod|sum)$
        pass_filenames: false
