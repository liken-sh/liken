# The layouts, navigation, and stylesheet come from the brand theme in
# brand/, which every liken site shares, so this file sets only what is
# specific to this site.
baseURL: https://liken.sh/display/

# crdref marks each field's row on the reference page with a raw HTML
# span, so that a link can go to one field. Goldmark drops raw HTML
# unless `unsafe` is set. That is safe because the site renders only
# files of this repository.
markup:
  goldmark:
    renderer:
      unsafe: true
title: display-operator
# The theme is brand/ at the top of the repository, so the site builds
# with the theme of its own commit.
themesDir: ../..
theme: brand

params:
  repository: https://github.com/liken-sh/liken/tree/main/display-operator
  # Adds a link to the coverage report at /coverage.html in the footer
  # of every page.
  coverage: true
# The site is a manual, so it has no taxonomies or feeds. It keeps the
# sitemap for search crawlers.
disableKinds: [taxonomy, term, rss]

# The theme renders each page as HTML and as its authored Markdown, for
# agents and scripts, so the Markdown of / is /index.md. A theme cannot
# declare output formats, so each site declares them (brand/README.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests in deploy/ at /deploy/<file>.yaml, so
# `kubectl apply -f` and a `Kustomization` can use the URLs and an
# install needs no clone.
#
# Declaring any mount replaces the default mounts, so the content mount
# is declared again. The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
    # A client can read the generated OpenAPI document from the site as
    # well as from the API.
    - source: content/docs/reference/openapi.json
      target: static/docs/reference/openapi.json
