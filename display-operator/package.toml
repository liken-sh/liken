# The operator that claims a machine's displays and GPUs. Its images
# build on the weston and ffmpeg base images.
[package]
name = "display-operator"
license = "MIT"

[depends]
components = ["ffmpeg", "kubernetes", "weston"]

[docs]
prefix = "display"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# The three images of the Dockerfile run its build stage, which takes
# the shared kubernetes module as a build context, because go.mod
# replaces it with ../kubernetes.
[[outputs.images]]
name = "display-operator"
file = "Dockerfile"
target = "display-operator"
contexts = { kubernetes = "kubernetes" }

[[outputs.images]]
name = "display-capture"
file = "Dockerfile"
target = "display-capture"
smoke = "display-operator/smoke/display-capture.sh"
contexts = { kubernetes = "kubernetes" }

[[outputs.images]]
name = "display-api"
file = "Dockerfile"
target = "display-api"
contexts = { kubernetes = "kubernetes" }

# The CLI image carries the same version as the operator, so the base
# binary pulls a CLI that never drifts from the operator it faces. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "display-operator-cli"
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes" }
