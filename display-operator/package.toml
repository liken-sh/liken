[package]
name = "display-operator"
license = "MIT"

[depends]
components = ["ffmpeg", "kubernetes", "notices", "toolchains", "trust", "weston"]

[docs]
prefix = "display"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]

[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the kubernetes module with ../kubernetes, so each
# image needs it as a build context.
[[outputs.images]]
name = "display-operator"
description = "display-operator on the weston image, for the DaemonSet that runs the compositor on each machine with a monitor."
file = "Dockerfile"
target = "display-operator"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "display-capture"
description = "display-operator's program on the ffmpeg image, for the container that captures a Display's screenshots, clips, and streams."
file = "Dockerfile"
target = "display-capture"
smoke = "display-operator/smoke/display-capture.sh"
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "display-api"
description = "display-operator's program alone, for the display-api Deployment that serves the captures over HTTP."
file = "Dockerfile"
target = "display-api"
contexts = { kubernetes = "kubernetes", notices = "notices" }

# The CLI image has the same version as the operator, so the CLI that
# the liken toolkit pulls matches the operator.
[[outputs.images]]
name = "display-operator-cli"
description = "kubectl-liken-display, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
