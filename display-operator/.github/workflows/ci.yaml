# A pull request runs the whole gate here: the tests, the coverage
# floors, the docs checks, and a build of every image. A push to main
# runs the tests, the coverage floors, and the docs checks here, and
# its images build in release.yaml, which starts at the same moment,
# waits for this run, and pushes no image from a red gate. So a commit
# on main gets the same verdict a pull request would, and the images
# build once. On a push to main the gate is also the
# publish: the last job deploys the site to GitHub Pages.
#
# There is no path filter, on the workflow or on the publish. The Go
# sources are at the top level beside the packages, and a new package
# is an ordinary new directory, so a filter would either miss new code
# or name every file. The tests run in about a minute; running them on
# a docs commit costs less than the filter that would skip them. The
# site also serves the test coverage report, which a code change
# moves, so every push to main republishes.
#
# The gate jobs are independent, so they run at once, and the gate
# takes as long as its slowest job. publish waits for the go and docs
# jobs, so a red gate never publishes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch republishes the current main with no change, for the
  # times the serving side needs a fresh deployment.
  workflow_dispatch:

permissions:
  contents: read
  # The image builds read their layer cache from ghcr. No run of this
  # workflow writes an image or the cache, so read is enough.
  packages: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floor.
      - run: make test-go

      # The publish job renders the coverage report from this exact
      # profile, so the page the site serves measures the commit the
      # site was built from. Measuring it again in the publish job
      # would run the tests a second time for the same number.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          # The publish job takes it within minutes of the upload.
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # tracks docs/go.sum, so between two bumps of that file the Go
      # build cache inside the entry never refreshes, and Go trims the
      # compiled Hugo and crdref objects out of it. This entry saves on
      # every run, under a key that ends in the commit, and restores the
      # newest entry for the same docs/go.sum, so the tools compile once
      # per bump instead of once per run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-${{ github.sha }}
          restore-keys: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

      # The publish job deploys this tree as it is, so the site builds
      # once per commit and the bytes it serves are the bytes the link
      # check passed.
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: docs/dist/site
          if-no-files-found: error
          retention-days: 7

  # The layer cache lives in ghcr, as a :buildcache tag beside each
  # image, not in the GitHub Actions cache. A registry cache has no
  # 10 GB ceiling, and it outlives a branch. release.yaml writes it
  # on every push to main and every tag, and this workflow only reads
  # it, so a pull request's builds start from the layers the last
  # build on main left.
  images:
    runs-on: ubuntu-latest
    # A push to main gets its Dockerfile verdict from release.yaml,
    # which builds every image for that commit at the same moment, so
    # this job runs on a pull request only and no layer builds twice.
    if: github.event_name == 'pull_request'
    # One job per image, so the two build at once and the run is as
    # long as the slowest of them, not the sum.
    #
    # Both images come from the one Dockerfile. The operator's final
    # stage builds on the weston stage, so the compositor entry names
    # that stage and the operator entry takes the default, the last
    # stage in the file.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: weston
            target: weston
          - image: display-operator
            target: ""
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache

  # The website deploy. It deploys the tree the docs job built
  # to GitHub Pages, which serves it at display.liken.sh, the same
  # name a claim uses for the driver.
  #
  # Pages fits this site because the site is a tree of files, built
  # ahead of time, and nothing of the operator's has to run to serve
  # it. The Pages configuration, workflow-sourced deploys under the
  # display.liken.sh custom domain, is in the repository's settings,
  # set once by hand. The DNS CNAME that points the name at Pages is
  # in liken.sh's zone, outside this repository.
  #
  # Publishing needs two permissions the test jobs do not take.
  # pages: write creates the deployment, and id-token: write lets
  # deploy-pages prove to the Pages service that the artifact came
  # from this exact workflow run. Nothing else can push content under
  # this site's name.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A pull request never publishes. The docs job already proves the
    # site builds, so a pull request needs nothing from here.
    if: github.event_name != 'pull_request'
    # The go and docs jobs: a tree that fails either one must
    # not become the site.
    needs: [go, docs]
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys run one at a time: two pushes in quick succession would
    # otherwise race their deployments, and the served-site check
    # below needs nothing else to change while it runs. The group is
    # the job's, not the workflow's, so two gates still run at once.
    concurrency:
      group: docs
    steps:
      - uses: actions/checkout@v7

      # The coverage report tool is a tool directive in the docs module,
      # so the Go toolchain is the only install this job needs, and
      # docs/go.mod pins its version.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # tracks docs/go.sum, so between two bumps of that file the Go
      # build cache inside the entry never refreshes, and Go trims the
      # compiled Hugo and crdref objects out of it. This entry saves on
      # every run, under a key that ends in the commit, and restores the
      # newest entry for the same docs/go.sum, so the tools compile once
      # per bump instead of once per run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-${{ github.sha }}
          restore-keys: docs-build-${{ runner.os }}-${{ hashFiles('docs/go.sum') }}-

      # The profile the go job measured, back at the repository root
      # where the Makefile looks for it. Because the file is here,
      # make coverage-report renders the report and does not run the
      # tests again.
      - name: take the coverage profile
        uses: actions/download-artifact@v8
        with:
          name: coverage-go
          path: .

      - name: render the coverage report
        run: make coverage-report

      - name: take the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: docs/dist/site

      # The report is one self-contained file, so publishing it is a
      # copy into the built tree. The site's footer links it at this
      # exact path (docs/hugo.yaml sets the parameter that turns the
      # link on).
      - name: publish the coverage report
        run: cp coverage.html docs/dist/site/coverage.html

      # release.txt holds the commit that built the tree, so the
      # served-site check below can tell this deploy's content from
      # the CDN's cache of the last one. It is written into the built
      # tree, not authored, because its value is the one input Hugo
      # does not have.
      - name: stamp the build
        run: echo "${{ github.sha }}" > docs/dist/site/release.txt

      - name: package the site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/site

      - name: deploy to Pages
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt holds the commit, and the other checks
      # cover the two forms every page serves, the HTML and its
      # Markdown twin, and the coverage report beside them.
      - name: verify the served site
        run: |
          # A finished deployment does not mean the public name
          # follows yet. A CDN in front of Pages caches pages for up
          # to ten minutes, so the old tree can answer for a while
          # after the new one is live at the origin. curl's
          # --retry only covers transport errors, never stale
          # content, so the freshness check needs its own deadline
          # loop before the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://display.liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://display.liken.sh/ | grep -q "monitor output"
          echo "checking the markdown twin"
          fetch --head https://display.liken.sh/index.md \
            | grep -qi "content-type: text/markdown"
          echo "checking the sitemap"
          fetch https://display.liken.sh/sitemap.xml >/dev/null
          # The report is close to a megabyte, and the title is in
          # its first lines. A grep -q on a pipe would stop reading
          # there and leave curl to die on a closed pipe, which curl
          # retries as an error and pipefail would turn into a failed
          # step, so this one check takes the whole file to disk first.
          echo "checking the coverage report"
          fetch https://display.liken.sh/coverage.html > served-coverage.html
          grep -q "<title>display-operator</title>" served-coverage.html
