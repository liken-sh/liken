# This is the website deploy. A push that touches the docs domain is
# a publish: the job builds the site and deploys the tree to GitHub
# Pages, which serves it at display.liken.sh, the same name a claim
# uses for the driver. On a pull request, the job stops after the
# build: it proves the site still builds, and publishes nothing.
#
# Pages fits this site because the site is a tree of files, built
# ahead of time, and nothing of the operator's has to run to serve
# it. The Pages configuration, workflow-sourced deploys under the
# display.liken.sh custom domain, lives in the repository's settings,
# set once by hand. The DNS CNAME that points the name at Pages lives
# with liken.sh's zone, outside this repository.
#
# Publishing needs two permissions. pages: write creates the
# deployment, and id-token: write lets deploy-pages prove to the
# Pages service that the artifact came from this exact workflow run,
# so nothing else can push content under this site's name.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yaml
  pull_request:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/docs.yaml
  # A dispatch republishes the current main with no docs change, for
  # the times the serving side needs a fresh deployment.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys run one at a time: two pushes in quick succession would
# otherwise race their deployments, and the served-site check below
# needs nothing else to change while it runs.
concurrency:
  group: docs

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The theme is a git submodule, so a plain checkout would build
      # a site with no layouts and no stylesheet. submodules: true
      # brings the pinned brand commit along.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Hugo is a Go tool dependency of the docs module, so the Go
      # toolchain is the only install. go tool hugo builds Hugo at
      # the version docs/go.mod pins, the same command a workstation
      # runs, so local and CI builds produce the same tree.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      - name: build the site
        run: cd docs && go tool hugo --destination dist/site

      # release.txt carries the commit that built the tree, so the
      # served-site check below can tell this deploy's content from
      # the CDN's cache of the last one. It is written into the built
      # tree, not authored, because its value is the one thing Hugo
      # cannot know.
      - name: stamp the build
        run: echo "${{ github.sha }}" > docs/dist/site/release.txt

      # Everything below publishes, so pull requests stop here.
      - name: package the site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/site

      - name: deploy to Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt carries the commit, and the other checks
      # cover the two forms every page serves, the HTML and its
      # Markdown twin.
      - name: verify the served site
        if: github.event_name != 'pull_request'
        run: |
          # The deployment finishing does not mean the public name
          # follows yet: Pages sits behind a CDN that caches pages
          # for up to ten minutes, so the old tree can answer for a
          # while after the new one is live at the origin. curl's
          # --retry only covers transport errors, never stale
          # content, so the freshness check needs its own deadline
          # loop before the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://display.liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://display.liken.sh/ | grep -q "monitor output"
          echo "checking the markdown twin"
          fetch --head https://display.liken.sh/index.md \
            | grep -qi "content-type: text/markdown"
          echo "checking the sitemap"
          fetch https://display.liken.sh/sitemap.xml >/dev/null
