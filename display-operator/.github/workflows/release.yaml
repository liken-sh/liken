# Every image this repository publishes goes through this workflow.
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.03-007, and the images ship under that
# tag and :latest. A push to main cuts a development build: the
# version is the most recent release tag plus a suffix,
# 2026.09.03-007-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# Both kinds run the tests first and build only when they pass. A
# development build that skipped the tests would put a broken image
# one pin away from a cluster.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

# Pushing images needs packages: write. Nothing here writes to the
# repository, so contents stays read-only.
permissions:
  contents: read
  packages: write

# Two tags in quick succession would otherwise race their pushes to
# :latest in an order nobody chose.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no machine can order against
      # the others. A push to main derives it: git describe finds the
      # most recent release tag and counts the commits since it, and
      # the first eight characters of the commit sha make the build
      # traceable. The checkout fetches the whole history, because
      # describe needs the tags.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]')
            release=${described%-*-g*}
            count=${described#"$release"-}
            count=${count%-g*}
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins
      # its manifests needs the full commit sha: a git fetch by sha
      # wants all forty characters, and the eight in the version are
      # not enough. The run's summary prints the two lines to paste,
      # so a roll is a copy.
      - name: Write the roll lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/liken-sh/weston"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The tests gate the release. An image that reaches ghcr.io is
      # one that passed them, so a rollback target is always a build
      # that worked.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build here and neither one pushes yet. The
      # compositor has to start before anything reaches ghcr.io, and a
      # push that happened first would leave a broken :latest behind
      # when the start failed.
      #
      # The builds read and write the :buildcache tags beside each
      # image. A tag's release of a commit whose development build
      # already ran here rebuilds nothing, and a pull request's builds
      # in ci.yaml read the same tags.
      - name: Build the compositor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: weston
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/weston:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/weston:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/weston:${{ env.VERSION }}
            ghcr.io/liken-sh/weston:latest

      # The compositor opens its backend, its renderer and its shell by
      # file name, so a library the image does not contain shows up at
      # the first start and at no earlier point. go test covers none of
      # it. The headless backend needs no graphics card, so this runs on
      # an ordinary runner, and it covers everything but the card: the
      # module loads, the EGL vendor, the DRI driver, and the shell.
      #
      # weston runs until it is stopped, so timeout is what ends it, and
      # the log is what says whether it got that far.
      - name: Start the compositor
        run: |
          printf '[core]\nshell=kiosk\nrenderer=gl\nrequire-input=false\n' > weston.ini
          timeout 30 docker run --rm --tmpfs /run \
            -e XDG_RUNTIME_DIR=/run \
            -v "$PWD/weston.ini:/weston.ini:ro" \
            "ghcr.io/liken-sh/weston:$VERSION" \
            --backend=headless --config=/weston.ini --socket=release \
            > weston.log 2>&1 || true
          cat weston.log
          grep -q "Using GL renderer" weston.log
          grep -q "kiosk-shell.so" weston.log

      - name: Build the operator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/display-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/display-operator:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/display-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/display-operator:latest

      # The operator image is built from the compositor image, so the
      # two share every layer and the second push sends one binary.
      #
      # :latest marks the newest release and nothing else. A
      # development build pushes its own tag only.
      - name: Push both images
        run: |
          docker push "ghcr.io/liken-sh/weston:$VERSION"
          docker push "ghcr.io/liken-sh/display-operator:$VERSION"
          if [ "$RELEASE" = true ]; then
            docker push "ghcr.io/liken-sh/weston:latest"
            docker push "ghcr.io/liken-sh/display-operator:latest"
          fi
