# Every push to main tests the code, builds both images, starts the
# compositor, and releases them.
#
# The version is the date and the run number, which is liken's own
# scheme: 2026.08.16-002. The two release cadences do not couple, and
# reading one version beside the other still tells you when each one
# was cut.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

# Two pushes in quick succession would otherwise race for the same tag
# and push two images to :latest in an order nobody chose.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout clones one commit deep and fetches no
          # tags. Without this the tag guard below asks about a tag
          # that is not in the local repository, so it never finds one,
          # and the guard passes everything through.
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The tests gate the release. An image that reaches ghcr.io is
      # one that passed them, so a rollback target is always a build
      # that worked.
      - run: go vet ./...
      - run: go test -race ./...

      - name: Compute the version
        run: echo "VERSION=$(date -u +%Y.%m.%d)-$(printf '%03d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build here and neither one pushes yet. The
      # compositor has to start before anything reaches ghcr.io, and a
      # push that happened first would leave a broken :latest behind
      # when the start failed.
      - name: Build the compositor
        uses: docker/build-push-action@v6
        with:
          context: .
          target: weston
          load: true
          tags: |
            ghcr.io/liken-sh/weston:${{ env.VERSION }}
            ghcr.io/liken-sh/weston:latest

      # The compositor opens its backend, its renderer and its shell by
      # file name, so a library the image does not carry shows up at the
      # first start and at no earlier point. go test cannot see any of
      # it. The headless backend needs no graphics card, so this runs on
      # an ordinary runner, and it covers everything but the card: the
      # module loads, the EGL vendor, the DRI driver, and the shell.
      #
      # weston runs until it is stopped, so timeout is what ends it, and
      # the log is what says whether it got that far.
      - name: Start the compositor
        run: |
          printf '[core]\nshell=kiosk\nrenderer=gl\nrequire-input=false\n' > weston.ini
          timeout 30 docker run --rm --tmpfs /run \
            -e XDG_RUNTIME_DIR=/run \
            -v "$PWD/weston.ini:/weston.ini:ro" \
            "ghcr.io/liken-sh/weston:$VERSION" \
            --backend=headless --config=/weston.ini --socket=release \
            > weston.log 2>&1 || true
          cat weston.log
          grep -q "Using GL renderer" weston.log
          grep -q "kiosk-shell.so" weston.log

      - name: Build the operator
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/liken-sh/display-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/display-operator:latest

      # The operator image is built from the compositor image, so the
      # two share every layer and the second push sends one binary.
      - name: Push both images
        run: |
          docker push "ghcr.io/liken-sh/weston:$VERSION"
          docker push "ghcr.io/liken-sh/weston:latest"
          docker push "ghcr.io/liken-sh/display-operator:$VERSION"
          docker push "ghcr.io/liken-sh/display-operator:latest"

      # The tag lands after the push, so a tag in the repository always
      # names a version that exists in the registry.
      #
      # A re-run of a finished run computes the same version from the
      # same run number, so the tag is already there. The guard reads
      # the tag the checkout above fetched and skips the tagging, which
      # keeps the tag pointing at the commit that first carried this
      # version rather than moving it.
      - name: Tag the commit
        run: |
          git rev-parse -q --verify "refs/tags/$VERSION" \
            || { git tag "$VERSION" && git push origin "$VERSION"; }
