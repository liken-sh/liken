# Kind knowledge that `transect` reads for the `Display` of
# `display-operator`.  `Connected` reports health because it is `True`
# while a monitor answers on the connector, and a pod that draws on
# the screen needs one.  `NoPanel` is the reason when the connector
# serves no monitor, which happens when a person unplugs or turns off
# the panel, so `calm` shows it as at rest and not as a fault.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: displays.display.liken.sh
spec:
  summary: One monitor output of a machine, and the screen that programs draw on.
  healthy: {condition: Connected, calm: [NoPanel]}
  controller: {image: liken-sh/display-operator}
