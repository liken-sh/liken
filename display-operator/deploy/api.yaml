# The display-api Deployment, with its Service, ServiceAccount, and
# RBAC. A GET on a Display returns what its screen shows. The API
# authenticates the caller, finds the node of the Display, calls the
# capture container of the display-operator pod on that node, and
# streams the response back. It stores no captures.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: display-api
spec:
  # One replica with the Recreate strategy, because at its first start
  # the API creates a CA and serving certificates, and a second pod
  # running at the same time would create a second set. A pod whose
  # create of the CA Secret loses that race uses the winner's CA.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: display-api
  template:
    metadata:
      labels:
        app: display-api
    spec:
      serviceAccountName: display-api
      containers:
        - name: api
          # This image has only the display-operator binary, on
          # scratch. The argument selects the role that it runs.
          image: ghcr.io/liken-sh/display-api:latest
          args: ["api"]
          env:
            # The API serves only HTTPS, because the request carries a
            # ServiceAccount bearer token and the response is an image
            # of the screen, which may show private content.
            - name: API_ADDR
              value: ":8443"
            # Every liken process serves metrics on this port.
            - name: METRICS_ADDR
              value: ":9200"
            # The base URL in the servers field of the OpenAPI
            # document. Set it when callers reach the API under a name
            # of your own. Without it, the document lists the origin of
            # each request.
            # - name: PUBLIC_BASE
            #   value: "https://display.example"
            # The namespace where the API reads pods, Secrets, and its
            # ConfigMap.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: api
              containerPort: 8443
            - name: metrics
              containerPort: 9200
          securityContext:
            # No privilege and no capabilities. The API calls the
            # Kubernetes API and listens on unprivileged ports.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            # An image built on scratch has no user, so the container
            # sets a non-root user here.
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          # Both probes use the metrics port over plain HTTP, so they
          # need no certificate. The HTTPS port serves captures.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
              scheme: HTTP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
              scheme: HTTP
          volumeMounts:
            - name: capture-token
              mountPath: /var/run/secrets/display-capture
              readOnly: true
      volumes:
        # The token that the API sends to the capture container. Its
        # audience is the capture container, not the API, because the
        # capture container checks it with its own TokenReview. The
        # kubelet refreshes a projected token before it expires, so the
        # one-hour expiration does not limit how long the pod can run.
        - name: capture-token
          projected:
            # The mode lets user 65532, which the API runs as, read the
            # token.
            defaultMode: 0644
            sources:
              - serviceAccountToken:
                  path: token
                  audience: display-capture
                  expirationSeconds: 3600
---
# Callers reach the API through this Service. The API's serving
# certificate lists each form of the Service name, from display-api to
# display-api.liken-system.svc.cluster.local.
apiVersion: v1
kind: Service
metadata:
  name: display-api
spec:
  selector:
    app: display-api
  ports:
    - name: https
      port: 443
      targetPort: api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: display-api
---
# Binds the built-in role that allows creating a TokenReview and a
# SubjectAccessReview. The API makes both for every request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: display-api-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: display-api
    namespace: liken-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: display-api
rules:
  # Every request names one Display, and the API reads it by name for
  # its node and its mode, so it needs no list or watch.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get]
  # Each request that returns capture data records a Captured Event on
  # the Display, so kubectl describe display shows who looked at a
  # screen and when. When the same capture repeats within 10 minutes of
  # the last one, the API patches the Event's count.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: display-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: display-api
subjects:
  - kind: ServiceAccount
    name: display-api
    namespace: liken-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: display-api
rules:
  # The API watches the display-operator pods to find the capture
  # container on each node. When a Display's node has none, or it is
  # not Ready, the API returns 503 from that cache with no extra read.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  # At its first start the API creates the CA and the serving
  # certificates. RBAC cannot limit create to names, so this rule
  # allows create on the whole collection, and the rules below limit
  # every other verb to named objects.
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [create]
  # The serving certificates of the API and of the capture container.
  # The API reads them at start, and every 12 hours it renews each one
  # that it signed and that has less than a third of its life left. It
  # watches the capture container's Secret, so it creates the
  # certificate again as soon as someone deletes the Secret. It also
  # watches its own serving Secret, so a certificate that your
  # cert-manager renews reaches the listener with no restart. Each list
  # and watch has a field selector on the name, which RBAC matches
  # against resourceNames.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [display-api-tls, display-capture-server]
    verbs: [get, list, update, watch]
  # The CA certificate is in a ConfigMap, so a client can read it
  # without access to a Secret.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [display-api-ca]
    verbs: [get, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: display-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: display-api
subjects:
  - kind: ServiceAccount
    name: display-api
    namespace: liken-system
---
# The permissions a caller needs for every route of the API. The
# capture routes check get on displays/screen, and the info route
# checks get on displays. The base binds the role to no subject,
# because the cluster owner decides who may look at a screen.
# media-operator's media-api ClusterRole grants displays/screen
# itself, so that a Player can combine a screen with its sound.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: display-capture-viewer
rules:
  - apiGroups: [display.liken.sh]
    resources: [displays/screen]
    verbs: [get]
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get]
