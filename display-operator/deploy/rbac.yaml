# The service account of display-operator, with only the permissions
# that its code uses.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: display-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: display-operator
rules:
  # The operator writes only the `ResourceSlice` of its own node
  # (slices.go), but the rule covers every slice, because
  # `resourceNames` cannot hold a name that differs for each node. The
  # operator gets its slice by name, so it needs no list or watch.
  #
  # The rule has no delete. When a monitor leaves, the operator taints
  # its device and keeps it in the slice, because the kubelet's prepare
  # call for the next claim of a device that left the slice fails and
  # retries with no limit. The `Node` owns the slice, so the garbage
  # collector deletes it when the node leaves the cluster. To remove the
  # operator for good, delete the slice yourself.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, create, update]
  # The kubelet's prepare request names only the claim, so the DRA
  # driver gets the claim to read its allocation (dra.go). The placement
  # pass lists claims to find the claim behind a surface, and reads the
  # pods that hold it from status.reservedFor (claimholders.go). Before
  # the `Display` pass restarts the compositor, it lists claims to find
  # one that holds a screen before its prepare has finished
  # (screenholds.go). Workloads in any namespace claim screens, so the
  # rule covers every namespace.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, watch]
  # The operator gets the `Layout` that a `Display` names (layouts.go),
  # and lists and watches `Layout` objects so that an edit to one starts
  # a new pass.
  - apiGroups: [display.liken.sh]
    resources: [layouts]
    verbs: [get, list, watch]
  # The selector of a `Layout` region matches the labels of the pods
  # that hold a screen's claim, so the operator watches the pods of its
  # node and arranges the screen again when a pod's labels change. The
  # same store gives the restart count of the compositor container from
  # the operator's own pod. The get reads a pod that the store does not
  # have yet. Pods in any namespace can hold a claim.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # The operator creates a `Display` for each monitor it probes and
  # writes its status (displays.go, displaycontrol.go). It watches them
  # to apply an edited spec. It never deletes one, because a `Display`
  # keeps the saved state of a panel that can be plugged in again.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch, create, update]
  - apiGroups: [display.liken.sh]
    resources: [displays/status]
    verbs: [get, update]
  # The operator gets its own `Node` at startup for the UID that the
  # owner reference of its `ResourceSlice` needs.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
  # The capture container verifies the bearer token that display-api
  # sends with a `TokenReview` for the audience `display-capture`. The
  # rule grants only this verb, because the built-in
  # `system:auth-delegator` role also allows a `SubjectAccessReview`,
  # which this pod never creates.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  # The operator posts `Event`s about each `Display` (displayevents.go).
  # A `Display` is cluster-scoped, and the API server accepts an `Event`
  # about a cluster-scoped object only in `default` or `kube-system`, so
  # the operator posts them in `default`. The grant is in a
  # `ClusterRole` so that it does not depend on the namespace you
  # install the base in. The patch updates the count of an `Event` that
  # repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: display-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: display-operator
subjects:
  - kind: ServiceAccount
    name: display-operator
    namespace: liken-system
