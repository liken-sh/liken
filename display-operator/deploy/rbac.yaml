# The operator's identity in the cluster, and deliberately nothing
# more. It writes one ResourceSlice, reads the claims the kubelet asks
# it to prepare, and reads its own Node.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: display-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: display-operator
rules:
  # The device inventory (slices.go): this node's ResourceSlice under
  # display.liken.sh. The verbs cover the collection, because RBAC
  # cannot say "only the slice named for your node": resourceNames
  # cannot be templated per pod. The program only ever writes its own,
  # whose name it builds from NODE_NAME. No list and no watch: the name
  # is deterministic, and reading anyone else's inventory is the
  # scheduler's job.
  #
  # No delete either. This operator never removes its slice. A monitor
  # that leaves is a taint, and a device that left the inventory would
  # strand the kubelet's prepare call for the next consumer, with no
  # bound on the retry. The Node owns the slice, so a node that leaves
  # the cluster takes it away. A person who uninstalls the operator
  # for good deletes the slice by name with their own credentials.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, create, update]
  # The DRA plugin (dra.go): when the kubelet asks this driver to
  # prepare a claim, the request names the claim and nothing more. The
  # allocation is on the claim's status, so the driver reads it
  # back. This is read-only across every namespace, because claims
  # belong to workloads and the driver serves whichever namespace
  # claims a screen. Still no list and no watch: prepare calls arrive
  # with exact names.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get]
  # The panels' own resources (displays.go, displaycontrol.go).
  # The operator creates one Display for every monitor it probes and
  # writes the whole of its status. The list and the watch are here
  # because a spec a person or a machine writer edited is what the
  # operator reconciles, and because a panel that left the node is
  # found by listing the resources this node owns. No delete: a
  # Display holds the captured state of a panel that may come back.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch, create, update]
  - apiGroups: [display.liken.sh]
    resources: [displays/status]
    verbs: [get, update]
  # This node, read once at startup for the UID that the slice's owner
  # reference needs. The Node owns the slice, so a Node that leaves the
  # cluster takes the slice with it, and the garbage collector cleans
  # up after an operator that exits without running any code.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: display-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: display-operator
subjects:
  - kind: ServiceAccount
    name: display-operator
    namespace: liken-system
