# The Display API. The operator creates one cluster-scoped Display
# for every monitor it probes, named by the monitor id the slices
# publish as monitor.liken.sh/id. The operator writes the whole of
# status: what the panel declares, what it last saw, and what it
# saved before an override. The resting spec fields are the cluster
# owner's to write, and spec.override is a temporary layer a machine
# writer sets and later lifts. The operator restores what it
# captured when the block is deleted.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: displays.display.liken.sh
spec:
  group: display.liken.sh
  # A panel is physical and belongs to no namespace, so the
  # resource is cluster-scoped, like a Node.
  scope: Cluster
  names:
    kind: Display
    listKind: DisplayList
    plural: displays
    singular: display
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # status is a subresource so that the operator's writes
        # of status and a person's writes of spec never overwrite each
        # other.
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connector
          type: string
          jsonPath: .status.connector
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Responsive
          type: string
          jsonPath: .status.conditions[?(@.type=="Responsive")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One monitor, what it carries, and what it rests at."
          properties:
            spec:
              type: object
              description: "The settings the panel rests at, and the override above them. Every field is optional: the operator writes a declared field back when the panel diverges from it, and it never writes a field the spec leaves out."
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own brightness number, up to status.capabilities.brightness.max."
                contrast:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own contrast number."
                sharpness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own sharpness number."
                colorPreset:
                  type: string
                  description: "One of status.capabilities.colorPreset.values."
                input:
                  type: string
                  description: "One of status.capabilities.input.values."
                audioVolume:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own volume number."
                audioMute:
                  type: boolean
                  description: "Whether the panel's own speakers are muted."
                override:
                  type: object
                  description: "The temporary layer. A writer adds the block, the operator saves what stood and obeys it, and the writer deletes the block. The operator then restores the declared resting value, or the saved one where the spec declares none."
                  properties:
                    backlight:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel dark at brightness zero."
                    power:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel powered down. Some panels stop answering DDC/CI from power off; state this only for a panel a drill proved wakes."
                  x-kubernetes-validations:
                    - rule: "!(has(self.backlight) && has(self.power))"
                      message: "An override states backlight or power, and not both."
            status:
              type: object
              description: "What the operator read and what it last wrote. The operator owns every field here."
              properties:
                node:
                  type: string
                  description: "The machine whose graphics card drives this panel."
                connector:
                  type: string
                  description: "The connector on that card, in the kernel's own spelling."
                capabilities:
                  type: object
                  description: "The controls the panel declares, of the MCCS common core. A control with a value list takes those values, and a control with a maximum takes a number up to it."
                  additionalProperties:
                    type: object
                    properties:
                      max:
                        type: integer
                        description: "The largest number the panel accepts for a continuous control."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value the panel accepts for a non-continuous control."
                observed:
                  type: object
                  description: "The last value the operator read or wrote for each control. It is last-known, never live: the operator reads the panel when it probes, captures, or actuates, and at no other time."
                  properties: &values
                    brightness:
                      type: integer
                    contrast:
                      type: integer
                    sharpness:
                      type: integer
                    colorPreset:
                      type: string
                    input:
                      type: string
                    audioVolume:
                      type: integer
                    audioMute:
                      type: boolean
                    power:
                      type: string
                captured:
                  type: object
                  description: "The values the operator saved before it obeyed an override. The save commits before the panel goes dark, so the value that brings the panel back survives a restart of the operator."
                  properties: *values
                conditions:
                  type: array
                  description: "Connected reports the panel on its connector, and Responsive reports the panel answering DDC/CI, with the reason NoDDCReply when it does not."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
