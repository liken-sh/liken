# The Display API. The operator creates one cluster-scoped Display
# for each monitor it probes, named by the monitor id that the
# `ResourceSlice`s publish as the device attribute `monitor.liken.sh/id`.
# The operator writes all of status: what the panel reports about
# itself, the values it last read, and the values it saved before an
# override. A person writes spec. spec.override is a temporary setting
# that someone adds and later deletes, and when it is deleted the
# operator restores the values it saved.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: displays.display.liken.sh
spec:
  group: display.liken.sh
  # A panel is a physical device, so a Display is cluster-scoped, like
  # a Node.
  scope: Cluster
  names:
    kind: Display
    listKind: DisplayList
    plural: displays
    singular: display
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # The operator's writes of status and a person's writes of spec
        # go through separate endpoints, so neither overwrites the other.
        status: {}
      # A reader on one machine, such as the CEC workload of
      # equipment-operator, lists and watches only the Displays whose
      # status.node is that machine. Without this selectable field, the
      # watch would receive every Display in the cluster, and a status
      # write for a monitor on one machine would wake the readers on all
      # machines.
      selectableFields:
        - jsonPath: .status.node
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connector
          type: string
          jsonPath: .status.connector
        - name: Mode
          type: string
          jsonPath: .status.mode.kernel
        - name: Canvas
          type: string
          jsonPath: .status.mode.weston
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Responsive
          type: string
          jsonPath: .status.conditions[?(@.type=="Responsive")].status
        - name: Compositor
          type: string
          jsonPath: .status.conditions[?(@.type=="CompositorServing")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One monitor, the controls it reports, and the settings that the operator keeps applied."
          properties:
            spec:
              type: object
              description: "The settings that the panel should keep, and a temporary override that takes precedence over them. Every field is optional. When the panel's value differs from a field that `spec` sets, the operator writes the field's value to the panel. The operator does not write a control that `spec` leaves out, and it does not write a value that `status.capabilities` does not allow: a number above the control's `max`, or a value missing from its `values`."
              # A writer removes an override by applying a spec with
              # nothing in it. Server-side apply prunes the empty
              # object, and validation then reads spec as null and
              # refuses the write. The default restores the empty
              # object after the pruning.
              default: {}
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's brightness, in the panel's own units, up to `status.capabilities.brightness.max`."
                contrast:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's contrast, in the panel's own units."
                sharpness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's sharpness, in the panel's own units."
                colorPreset:
                  type: string
                  description: "The panel's color preset, one of `status.capabilities.colorPreset.values`."
                input:
                  type: string
                  description: "The input that the panel shows, one of `status.capabilities.input.values`. The operator polls the panel about every 10 seconds, and when it finds the panel on another input, it switches the panel back. It switches back at most three times in one `metadata.generation` and then records the input in `status.unconfirmed`. On a panel that several machines share, set this field only when the panel should always show this machine."
                audioVolume:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The volume of the panel's own speakers, in the panel's own units."
                audioMute:
                  type: boolean
                  description: "Whether the panel's own speakers are muted."
                mode:
                  type: string
                  description: "The mode to keep the screen in, such as `1920x1080@60`. It must be one of `status.modes`. The operator does not apply this field while a claim holds the screen, so a change takes effect when the last claim ends. Applying a mode restarts the compositor once, which ends every Wayland client on this card."
                layout:
                  type: string
                  description: "The name of the `Layout` that this screen shows. When the field is absent, the screen shows every window fullscreen with the newest on top. When no `Layout` has this name, the screen shows that default arrangement and the `LayoutResolved` condition is False."
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                override:
                  type: object
                  description: "A temporary setting that takes precedence over the other `spec` fields. When you add this block, the operator saves the panel's current values in `status.captured` and applies the override. When you delete the block, the operator restores the value that `spec` sets, or the saved value for a control that `spec` does not set."
                  properties:
                    backlight:
                      type: string
                      enum: ["Off", "off"]
                      description: "Sets the brightness to 0 and keeps it there. `off` in lowercase has the same meaning."
                    power:
                      type: string
                      enum: ["Off", "off"]
                      description: "Powers the panel down and keeps it down. `off` in lowercase has the same meaning. Some panels stop answering DDC/CI while powered off. Set this only for a panel that you know wakes again."
                  x-kubernetes-validations:
                    - rule: "!(has(self.backlight) && has(self.power))"
                      message: "override must set backlight or power, and not both"
            status:
              type: object
              description: "What the operator last read from the panel and last wrote to it. The operator writes every field of `status`."
              properties:
                node:
                  type: string
                  description: "The machine whose graphics card the panel is connected to."
                connector:
                  type: string
                  description: "The connector on that card, spelled as the kernel names it."
                manufacturer:
                  type: string
                  description: "The monitor's manufacturer, from its EDID. The device attribute of the same name has the same value."
                model:
                  type: string
                  description: "The monitor's model name, from its EDID."
                serial:
                  type: string
                  description: "The monitor's serial number, from its EDID. Absent when the EDID has none."
                widthMillimeters:
                  type: integer
                  description: "The panel's physical width in millimeters, from its EDID."
                heightMillimeters:
                  type: integer
                  description: "The panel's physical height in millimeters, from its EDID."
                physicalAddress:
                  type: string
                  description: "The HDMI-CEC physical address of the port that this machine's cable is plugged into, in the dotted form `1.2.0.0`. The operator reads it from the HDMI vendor block of the EDID that the connector serves, and a CEC adapter that sends CEC messages for this machine uses it as its own address. The field keeps the last valid address while the connector serves no EDID for this monitor, while the EDID has no valid address, and while two connectors on this node serve this monitor with different addresses. The `PhysicalAddressCurrent` condition reports which of these applies. The field is absent until the monitor first serves a valid address, so it stays absent for a monitor on a DisplayPort cable. The addresses `0.0.0.0` and `f.f.f.f`, and an address with a non-zero digit after a zero, are not valid."
                mode:
                  type: object
                  description: "The mode of this output, as the kernel and the compositor each report it. The two can differ: the connector can run at one mode while the compositor draws at another, and clients draw at the compositor's mode."
                  properties:
                    kernel:
                      type: string
                      description: "The mode that the card reports for the connector. Absent while the connector has no mode set and while the operator has no connection to the compositor."
                    weston:
                      type: string
                      description: "The mode that the compositor reports in its `wl_output` events, which is the mode that clients draw at. Absent while the operator has no connection to the compositor."
                modes:
                  type: array
                  items:
                    type: string
                  description: "Every mode that the card offers for this connector. The operator checks `spec.mode` against this list. The device attribute `modes` holds the same list, cut after the last mode that fits in the 64-character limit of a device attribute. Absent while the operator has no connection to the compositor."
                capabilities:
                  type: object
                  description: "The controls that the panel declares, from the MCCS common core. A control with a list of values accepts one of them, and a control with a maximum accepts a number up to it."
                  additionalProperties:
                    type: object
                    properties:
                      max:
                        type: integer
                        description: "The largest number the panel accepts for a continuous control."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value that the panel accepts for a non-continuous control. The power control lists its values by the names that `status.observed.power` uses."
                observed:
                  type: object
                  description: "The last value that the operator read from or wrote to each control. The operator reads the panel when it probes it, before it saves values for an override, and when it changes a control. It also reads about every 10 seconds while the panel is lit and has no override, to find changes made with the panel's own buttons. It never reads a panel in standby or off, because a DDC read wakes some panels."
                  properties: &values
                    brightness:
                      type: integer
                    contrast:
                      type: integer
                    sharpness:
                      type: integer
                    colorPreset:
                      type: string
                    input:
                      type: string
                    audioVolume:
                      type: integer
                    audioMute:
                      type: boolean
                    power:
                      type: string
                      description: "The panel's power state: `On`, `Standby`, `Suspend`, `Off`, or `HardOff`. A state that the MCCS table has no name for is a hexadecimal number, such as `0x06`. The operator reads a power name in any letter case, so values saved in lowercase still restore the panel."
                captured:
                  type: object
                  description: "The values that the operator saved before it applied an override. The operator writes this record before the panel goes dark, so the values to restore survive an operator restart."
                  properties: *values
                unconfirmed:
                  type: array
                  description: "Each write that the device did not confirm in the current `metadata.generation`. The operator lists a write here when the panel reads back a different value than the operator wrote, when a restore runs out of attempts, when the compositor restarts for `spec.mode` and still reports another mode, and when the panel changes a value by itself after the operator wrote it back three times. The operator does not repeat a listed write until `spec` changes, even after an operator restart. It removes the entry when the device reports the value. When a restore is listed here, `status.captured` keeps the saved values."
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [control, value, generation, time]
                    properties:
                      control:
                        type: string
                        description: "The control, spelled as in `status.capabilities`, or `mode` for `spec.mode`."
                      value:
                        type: string
                        description: "The value that the operator wrote."
                      readback:
                        type: string
                        description: "The value that the device reported after the write. Absent when the device did not respond."
                      generation:
                        type: integer
                        description: "The `metadata.generation` that the write was made for."
                      message:
                        type: string
                        description: "The failure, in the text of the device, tool, or compositor that reported it."
                      time:
                        type: string
                        format: date-time
                        description: "When the operator recorded the write."
                written:
                  type: array
                  description: "How many times the operator wrote each value that `spec` sets, in the current `metadata.generation`, counting only writes that the panel confirmed. The first write sets the value, and each later write puts it back after the panel changed it. The operator writes a value back at most three times in one generation, and then records it in `status.unconfirmed`."
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [control, value, generation, count]
                    properties:
                      control:
                        type: string
                        description: "The control, spelled as in `status.capabilities`."
                      value:
                        type: string
                        description: "The value that `spec` sets."
                      generation:
                        type: integer
                        description: "The `metadata.generation` that the writes were made for."
                      count:
                        type: integer
                        description: "The number of confirmed writes."
                surfaces:
                  type: array
                  description: "Every window that the compositor has on this screen, in the order the windows arrived, including windows that no region shows. Read this field first when a program draws nothing visible. A window's `id` is valid only for the compositor that assigned it. A compositor restart ends every window, and the programs reconnect with new ids."
                  # The operator writes the whole list in arrival order, so
                  # the list is one value, and apply does not merge it as
                  # a map.
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        description: "The window id that the compositor assigned. `status.layout` lists it beside the region that shows the window."
                      claim:
                        type: string
                        description: "The `ResourceClaim` whose socket the window connected through, as `namespace/name`. Empty for a window on the compositor's own socket, `wayland-0`, which belongs to no claim."
                      pods:
                        type: array
                        description: "The pods that hold the claim, each as `namespace/name`."
                        items:
                          type: string
                        x-kubernetes-list-type: atomic
                      labels:
                        type: object
                        description: "The labels that every pod holding the claim has, with the same value on each pod. A region's `selector` matches against these labels. When one pod holds the claim, they are that pod's labels."
                        additionalProperties:
                          type: string
                      size:
                        type: object
                        description: "The size in pixels that the program last drew. A window in a region draws at the region's size, so a different size means that the program ignored the compositor's request, and the compositor scales the window to fit."
                        properties:
                          width:
                            type: integer
                            description: "The width in pixels."
                          height:
                            type: integer
                            description: "The height in pixels."
                      region:
                        type: string
                        description: "The region that shows the window. Empty when no region shows the window, so the window is not on the screen."
                      appID:
                        type: string
                        description: "The xdg `app_id` that the program set on the window. Empty until the program sets one. An arranger refers to the windows of its claim by `app_id`."
                layout:
                  type: object
                  description: "The arrangement that the screen is drawn with, and the window that each region shows."
                  properties:
                    name:
                      type: string
                      description: "The `Layout` in use, or `default` when `spec.layout` is absent or names a `Layout` that does not exist."
                    regions:
                      type: array
                      description: "Each region in stacking order, with the window on top of it."
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: "The region's name, as the `Layout` gives it."
                          surface:
                            type: string
                            description: "The id of the window on top of the region, which is the newest window of the claim that the region shows, or `empty` when no window matched the region."
                arrangers:
                  type: array
                  description: "The arranger of each claim on this screen that has one. An arranger is a Wayland client of the claim that places the claim's windows inside the claim's region, through the `liken_arrangement_v1` protocol. The `Layout` still sets where the region is. A claim with no arranger is not listed, and its windows fill its region."
                  # The operator writes the whole list from what the
                  # compositor reports, ordered by claim.
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [claim]
                    properties:
                      claim:
                        type: string
                        description: "The `ResourceClaim` whose socket the arranger connected through, as `namespace/name`."
                      region:
                        type: string
                        description: "The region that shows the claim's windows. Empty while no region shows them."
                      pods:
                        type: array
                        description: "The pods that hold the claim, each as `namespace/name`. The arranger is a process in one of them. The compositor cannot tell which container, because it reads the client's pid from the socket, and the kernel reports pid 0 for a client in another pod's pid namespace."
                        items:
                          type: string
                        x-kubernetes-list-type: atomic
                      pid:
                        type: integer
                        description: "The arranger's pid in the compositor's pid namespace. Absent for a client in another pod, which includes every workload."
                      arrangement:
                        type: string
                        description: "The name of the last arrangement that the arranger committed. Absent before its first commit. The compositor replaces each non-printable character with an underscore, and reports an empty name as a hyphen."
                      duplicateAppIDs:
                        type: array
                        description: "Each `app_id` that two or more of the claim's windows have. An arrangement places every window with the `app_id` that it names, so these windows always move together."
                        items:
                          type: string
                        x-kubernetes-list-type: atomic
                conditions:
                  type: array
                  description: "`Connected` is True while a panel is connected to the connector. It turns False only after the connector has had no panel for 5 seconds, so a shorter loss of the hot plug signal, such as an A/V receiver causes when it goes to standby, changes no field of `status` and posts no `Event`. `Responsive` is True while the panel responds to DDC/CI, and False with the reason `NoDDCReply` when it does not. `LayoutResolved` is False with the reason `LayoutNotFound` while `spec.layout` names a `Layout` that does not exist, and the screen shows the default arrangement until the `Layout` exists. `CompositorServing` is False with the reason `Down` while the compositor's socket refuses connections, and with the reason `Hung` while the socket accepts connections and the compositor does not respond. Its message is the error that the connection returned. While `Connected` or `CompositorServing` is False, `status.surfaces`, `status.layout`, and `status.arrangers` are empty, because the compositor shows no window. `PhysicalAddressCurrent` is True with the reason `ReadFromEDID` while the EDID that the connector serves now gives `status.physicalAddress`. It is False with the reason `Retained` while the connector serves no EDID for this monitor or no valid address in it, and `status.physicalAddress` then holds the last valid address. The message gives the time that the connector stopped serving it. It is False with the reason `Ambiguous` while two connected connectors on this node serve this monitor with different addresses. The message names both connectors and both addresses, and `status.physicalAddress` keeps the value it had before they differed. The condition is absent until the monitor first serves a valid address."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
