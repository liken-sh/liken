# The Display API. The operator creates one cluster-scoped Display
# for every monitor it probes, named by the monitor id the slices
# publish as monitor.liken.sh/id. The operator writes the whole of
# status: what the panel declares, what it last saw, and what it
# saved before an override. The resting spec fields are the cluster
# owner's to write, and spec.override is a temporary layer a machine
# writer sets and later lifts. The operator restores what it
# captured when the block is deleted.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: displays.display.liken.sh
spec:
  group: display.liken.sh
  # A panel is physical and belongs to no namespace, so the
  # resource is cluster-scoped, like a Node.
  scope: Cluster
  names:
    kind: Display
    listKind: DisplayList
    plural: displays
    singular: display
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # status is a subresource so that the operator's writes
        # of status and a person's writes of spec never overwrite each
        # other.
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connector
          type: string
          jsonPath: .status.connector
        - name: Attached
          type: string
          jsonPath: .status.attachedInput
        - name: Mode
          type: string
          jsonPath: .status.mode.kernel
        - name: Canvas
          type: string
          jsonPath: .status.mode.weston
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Responsive
          type: string
          jsonPath: .status.conditions[?(@.type=="Responsive")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One monitor, what it carries, and what it rests at."
          properties:
            spec:
              type: object
              description: "The settings the panel rests at, and the override above them. Every field is optional: the operator writes a declared field back when the panel diverges from it, and it never writes a field the spec leaves out."
              # A writer lifts an override by applying a spec with
              # nothing in it. Server-side apply prunes the empty
              # object away, and validation would then read spec as
              # null and refuse the write. The default puts the empty
              # object back after the pruning.
              default: {}
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own brightness number, up to status.capabilities.brightness.max."
                contrast:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own contrast number."
                sharpness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own sharpness number."
                colorPreset:
                  type: string
                  description: "One of status.capabilities.colorPreset.values."
                input:
                  type: string
                  description: "One of status.capabilities.input.values: the resting declaration that forces the panel to show that input. On a shared panel it writes the panel back to this machine within a poll window of every switch away, so declare it only on a panel that should always show this machine."
                attachedInput:
                  type: string
                  description: "The panel input this machine's cable occupies, one of status.capabilities.input.values. A declared fact, never written to the panel: it defers a darkening override while the panel shows another input, because brightness and power are panel-global. Declare it only where the EDID says nothing; status.attachedInput carries what the operator derived, and this declaration wins over it. Beside spec.input on a shared panel, the resting write would fight every switch away."
                audioVolume:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own volume number."
                audioMute:
                  type: boolean
                  description: "Whether the panel's own speakers are muted."
                mode:
                  type: string
                  description: "The mode the screen rests at, one of status.modes, in the 1920x1080@60 form. A claim's own mode parameter wins while the claim holds the screen, and a change here waits for the claim to end. Applying it restarts the compositor once, which ends every Wayland client on this card."
                override:
                  type: object
                  description: "The temporary layer. A writer adds the block, the operator saves what stood and obeys it, and the writer deletes the block. The operator then restores the declared resting value, or the saved one where the spec declares none."
                  properties:
                    backlight:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel dark at brightness zero."
                    power:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel powered down. Some panels stop answering DDC/CI from power off; state this only for a panel a drill proved wakes."
                  x-kubernetes-validations:
                    - rule: "!(has(self.backlight) && has(self.power))"
                      message: "An override states backlight or power, and not both."
            status:
              type: object
              description: "What the operator read and what it last wrote. The operator owns every field here."
              properties:
                node:
                  type: string
                  description: "The machine whose graphics card drives this panel."
                connector:
                  type: string
                  description: "The connector on that card, in the kernel's own spelling."
                manufacturer:
                  type: string
                  description: "The monitor's manufacturer, from its EDID, the same value the device attribute carries."
                model:
                  type: string
                  description: "The monitor's model name, from its EDID."
                serial:
                  type: string
                  description: "The monitor's serial, from its EDID, and absent when the monitor states none."
                widthMillimeters:
                  type: integer
                  description: "The panel's physical width, as the monitor states it."
                heightMillimeters:
                  type: integer
                  description: "The panel's physical height, as the monitor states it."
                attachedInput:
                  type: string
                  description: "The input this machine's cable occupies, as the operator derived it from the EDID: an HDMI sink serves each of its ports an EDID naming that port. It is published so a person can check the derivation against the cabling, and a declared spec.attachedInput wins over it. A DisplayPort cable, and a panel that serves the same address on every port, derive nothing; those are the panels the owner declares for."
                mode:
                  type: object
                  description: "The mode this output runs, from the two parties that each report one. The kernel syncing a mode on the connector and the compositor serving canvases at that mode are two different facts, and a client draws at the second one, so a gap between the two values is the canvas defect and this object is where it shows."
                  properties:
                    kernel:
                      type: string
                      description: "The mode the card reports this connector is synced to, absent while it drives nothing."
                    weston:
                      type: string
                      description: "The mode the compositor reports it serves canvases at, from its own wl_output events, absent while the operator holds no connection to a compositor."
                modes:
                  type: array
                  items:
                    type: string
                  description: "Every mode the card offers for this connector, whole, where the device attribute of the same name is cut to fit the API's limit on an attribute value. This is the list spec.mode is judged against."
                capabilities:
                  type: object
                  description: "The controls the panel declares, of the MCCS common core. A control with a value list takes those values, and a control with a maximum takes a number up to it."
                  additionalProperties:
                    type: object
                    properties:
                      max:
                        type: integer
                        description: "The largest number the panel accepts for a continuous control."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value the panel accepts for a non-continuous control."
                observed:
                  type: object
                  description: "The last value the operator read or wrote for each control. The operator reads the panel when it probes, when it captures before an override, when it actuates, and about every ten seconds for a panel that is lit and under no override. The ten-second read is what finds a change a person made at the panel's own buttons. A panel in standby or off is never read, because a DDC read wakes some panels."
                  properties: &values
                    brightness:
                      type: integer
                    contrast:
                      type: integer
                    sharpness:
                      type: integer
                    colorPreset:
                      type: string
                    input:
                      type: string
                    audioVolume:
                      type: integer
                    audioMute:
                      type: boolean
                    power:
                      type: string
                captured:
                  type: object
                  description: "The values the operator saved before it obeyed an override. The save commits before the panel goes dark, so the value that brings the panel back survives a restart of the operator."
                  properties: *values
                conditions:
                  type: array
                  description: "Connected reports the panel on its connector, and Responsive reports the panel answering DDC/CI, with the reason NoDDCReply when it does not."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
