# The Display API. The operator creates one cluster-scoped Display
# for every monitor it probes, named by the monitor id the slices
# publish as monitor.liken.sh/id. The operator writes the whole of
# status: what the panel declares, what it last saw, and what it
# saved before an override. The resting spec fields are the cluster
# owner's to write, and spec.override is a temporary layer a machine
# writer sets and later lifts. The operator restores what it
# captured when the block is deleted.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: displays.display.liken.sh
spec:
  group: display.liken.sh
  # A panel is physical and belongs to no namespace, so the
  # resource is cluster-scoped, like a Node.
  scope: Cluster
  names:
    kind: Display
    listKind: DisplayList
    plural: displays
    singular: display
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        # status is a subresource so that the operator's writes
        # of status and a person's writes of spec never overwrite each
        # other.
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .status.node
        - name: Connector
          type: string
          jsonPath: .status.connector
        - name: Mode
          type: string
          jsonPath: .status.mode.kernel
        - name: Canvas
          type: string
          jsonPath: .status.mode.weston
        - name: Connected
          type: string
          jsonPath: .status.conditions[?(@.type=="Connected")].status
        - name: Responsive
          type: string
          jsonPath: .status.conditions[?(@.type=="Responsive")].status
        - name: Compositor
          type: string
          jsonPath: .status.conditions[?(@.type=="CompositorServing")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One monitor, the controls it reports, and the settings the operator maintains."
          properties:
            spec:
              type: object
              description: "The settings the panel should maintain and a temporary override above them. Every field is optional. The operator writes a declared field when the panel diverges from it and does not write a field that spec leaves out."
              # A writer lifts an override by applying a spec with
              # nothing in it. Server-side apply prunes the empty
              # object away, and validation would then read spec as
              # null and refuse the write. The default puts the empty
              # object back after the pruning.
              default: {}
              properties:
                brightness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's brightness value. It must not exceed status.capabilities.brightness.max."
                contrast:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own contrast number."
                sharpness:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own sharpness number."
                colorPreset:
                  type: string
                  description: "One value from status.capabilities.colorPreset.values."
                input:
                  type: string
                  description: "One value from status.capabilities.input.values. This resting declaration forces the panel to show that input. On a shared panel, the operator writes the panel back to this machine within one polling window after each switch away. Declare it only on a panel that should always show this machine."
                audioVolume:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: "The panel's own volume number."
                audioMute:
                  type: boolean
                  description: "Whether the panel's own speakers are muted."
                mode:
                  type: string
                  description: "The resting screen mode, in the 1920x1080@60 form, and one of status.modes. A claim's mode parameter takes precedence while the claim holds the screen. An edit here waits for the claim to end. Applying the mode restarts the compositor once and ends every Wayland client on this card."
                layout:
                  type: string
                  description: "The Layout this screen shows, by name. If this field is absent, the screen shows every window fullscreen with the newest on top. If the name matches no Layout, the screen shows that same arrangement and reports the name under the LayoutResolved condition."
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
                override:
                  type: object
                  description: "A temporary layer above the resting settings. When a writer adds this block, the operator saves the current values and applies the override. When the writer deletes it, the operator restores the declared value or the saved value when spec declares none."
                  properties:
                    backlight:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel dark at brightness zero."
                    power:
                      type: string
                      enum: ["off"]
                      description: "Hold the panel powered down. Some panels stop answering DDC/CI from power off; state this only for a panel a drill proved wakes."
                  x-kubernetes-validations:
                    - rule: "!(has(self.backlight) && has(self.power))"
                      message: "An override states backlight or power, and not both."
            status:
              type: object
              description: "What the operator read and what it last wrote. The operator owns every field here."
              properties:
                node:
                  type: string
                  description: "The machine whose graphics card drives this panel."
                connector:
                  type: string
                  description: "The connector on that card, in the kernel's own spelling."
                manufacturer:
                  type: string
                  description: "The monitor's manufacturer, from its EDID, the same value the device attribute carries."
                model:
                  type: string
                  description: "The monitor's model name, from its EDID."
                serial:
                  type: string
                  description: "The monitor's serial, from its EDID, and absent when the monitor states none."
                widthMillimeters:
                  type: integer
                  description: "The panel's physical width, as the monitor states it."
                heightMillimeters:
                  type: integer
                  description: "The panel's physical height, as the monitor states it."
                physicalAddress:
                  type: string
                  description: "The HDMI-CEC physical address of the port this machine's cable is in, in the dotted form 1.2.0.0, from the HDMI vendor block of the EDID the connector serves. A CEC adapter announces this address when it speaks for this machine. The field keeps the last valid address while the connector serves no EDID for this monitor or serves no valid address in it, and the PhysicalAddressCurrent condition says which. The field is absent while the monitor has never served a valid address, for example on a DisplayPort cable. 0.0.0.0, f.f.f.f, and an address with a non-zero digit after a zero are not valid."
                mode:
                  type: object
                  description: "The mode this output runs, from the two parties that each report one. The kernel syncing a mode on the connector and the compositor serving canvases at that mode are two different facts, and a client draws at the second one, so a gap between the two values is the canvas defect and this object is where it shows."
                  properties:
                    kernel:
                      type: string
                      description: "The mode the card reports this connector is synced to, absent while it drives nothing."
                    weston:
                      type: string
                      description: "The mode the compositor reports it serves canvases at, from its own wl_output events, absent while the operator holds no connection to a compositor."
                modes:
                  type: array
                  items:
                    type: string
                  description: "Every mode the card offers for this connector, whole, where the device attribute of the same name is cut to fit the API's limit on an attribute value. This is the list spec.mode is judged against."
                capabilities:
                  type: object
                  description: "The controls the panel declares, of the MCCS common core. A control with a value list takes those values, and a control with a maximum takes a number up to it."
                  additionalProperties:
                    type: object
                    properties:
                      max:
                        type: integer
                        description: "The largest number the panel accepts for a continuous control."
                      values:
                        type: array
                        items:
                          type: string
                        description: "Every value the panel accepts for a non-continuous control."
                observed:
                  type: object
                  description: "The last value the operator read or wrote for each control. It reads the panel during probing, before an override capture, while it actuates a control, and about every ten seconds when the panel is lit and has no override. The ten-second read finds changes made with the panel's own buttons. The operator never reads a panel in standby or off because a DDC read wakes some panels."
                  properties: &values
                    brightness:
                      type: integer
                    contrast:
                      type: integer
                    sharpness:
                      type: integer
                    colorPreset:
                      type: string
                    input:
                      type: string
                    audioVolume:
                      type: integer
                    audioMute:
                      type: boolean
                    power:
                      type: string
                captured:
                  type: object
                  description: "The values the operator saved before it applied an override. The save commits before the panel goes dark, so the restore value survives an operator restart."
                  properties: *values
                surfaces:
                  type: array
                  description: "Every window the compositor holds on this screen, in arrival order, whether or not a region shows it. A window with no region is running but is not displayed. Read this field first when a program draws nothing visible. An ID lasts only for the compositor that assigned it. A compositor restart ends every window, and programs reconnect under new IDs."
                  # The operator writes the whole of this list, and
                  # the order is the order the surfaces arrived in, so
                  # the list is one value and not a merged map.
                  x-kubernetes-list-type: atomic
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        description: "The window's id, which the compositor assigned. status.layout names it beside the region that shows it."
                      claim:
                        type: string
                        description: "The ResourceClaim whose socket the window arrived on, as namespace/name. Empty for a window on the shared socket, which belongs to no claim."
                      pods:
                        type: array
                        description: "The pods that hold the claim, each as namespace/name."
                        items:
                          type: string
                        x-kubernetes-list-type: atomic
                      labels:
                        type: object
                        description: "The labels every holder of the claim carries with the same value. These are the labels a region's selector reads. When one pod holds the claim they are that pod's labels."
                        additionalProperties:
                          type: string
                      size:
                        type: object
                        description: "The size the program last drew, in pixels. A window in a region draws at the region's size, so a size that does not match its region is a program that ignored the compositor's request and is scaled to fit."
                        properties:
                          width:
                            type: integer
                            description: "The width in pixels."
                          height:
                            type: integer
                            description: "The height in pixels."
                      region:
                        type: string
                        description: "The region that shows the window. Empty for a window no region took, which is not on the screen."
                layout:
                  type: object
                  description: "The arrangement the screen is drawn to, and what each region shows."
                  properties:
                    name:
                      type: string
                      description: "The Layout in force, or default for a screen that names none or names one that does not exist."
                    regions:
                      type: array
                      description: "Each region in stacking order, with the window on top of it."
                      x-kubernetes-list-type: atomic
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: "The region's name, as the Layout states it."
                          surface:
                            type: string
                            description: "The id of the window on top of the region, the newest of the claim it shows, or the word empty when no window matched it."
                conditions:
                  type: array
                  description: "Connected reports the panel on its connector, and Responsive reports the panel answering DDC/CI, with the reason NoDDCReply when it does not. LayoutResolved is False with the reason LayoutNotFound while spec.layout names a Layout the cluster does not hold, and the screen shows the default arrangement until it does. CompositorServing reports the compositor behind the screen. It is False with the reason Down while the compositor's socket refuses the connect, and with the reason Hung while the socket accepts and the compositor answers nothing; the message is the socket's own words. status.surfaces and status.layout are empty for as long as it is False. PhysicalAddressCurrent is True with the reason ReadFromEDID while the connector's current EDID serves status.physicalAddress. It is False with the reason Retained while the connector serves no EDID for this monitor or serves no valid address, and status.physicalAddress then holds the last valid address; the message names the time the connector stopped serving it. The condition is absent while the monitor has never served a valid address."
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
