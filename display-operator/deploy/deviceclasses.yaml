# The two ends of this operator: the raw devices it claims from liken,
# and the refined device it publishes for everybody else.
---
# The card node, as liken publishes it. The operator's own pod claims
# one of these, and that claim does two jobs. It places the pod,
# because only a machine with a graphics card publishes a display
# device, so no node selector has to name the machine with the
# monitors. And it arbitrates, because liken publishes the card node as
# a device that allocates once, so the claim holder is the only program
# setting a mode on that card. DRM master is one per card, and the
# kernel gives it to the first process to open the node.
#
# displayNode is the attribute liken puts on the companion device that
# carries a card node. Selecting on it, rather than on a vendor and a
# product ID, keeps this class correct across a fleet of different
# machines.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-gpu
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].displayNode)
---
# The render node of the same card, as liken publishes it. Weston's GL
# renderer builds its EGL device from this node, and the pixman
# renderer that replaces it advertises zwp_linux_dmabuf_v1 at version
# 3, which mpv refuses to bind.
#
# liken publishes the render node as shareable, because the driver
# arbitrates concurrent clients on it. So this claim takes nothing away
# from the transcoders and the players that use the same GPU.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-render
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].renderNode)
---
# A monitor output, as this operator publishes it. A claim against this
# class alone allocates any output that has a monitor on it. To name
# one, add a selector on the connector or on what the monitor is:
#
#     device.attributes["display.liken.sh"].connector == "HDMI-A-1"
#     device.attributes["display.liken.sh"].model == "LG HDR WQHD"
#     device.attributes["display.liken.sh"].widthPixels >= 1920
#
# The README has the whole claim, with the toleration a consumer needs.
# The device's own name is the connector in lowercase, because a device
# name must be a DNS label.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-output
spec:
  selectors:
    - cel:
        expression: device.driver == "display.liken.sh"
