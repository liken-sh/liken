# The classes that the operator's own pod claims through. The claim
# template in operator.yaml refers to them by name, so the pod cannot
# start without them. Each selector checks an attribute that liken
# publishes, not a vendor and product ID, so it matches any graphics
# card.
---
# The card node of the graphics card. Only one claim can allocate it,
# so the operator is the only program that sets a mode on it.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-gpu
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].displayNode)
---
# The render node of the graphics card. Several claims can share it,
# so the operator's claim does not stop transcoders from using the GPU.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-render
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].renderNode)
---
# The DDC/CI i2c buses of the graphics card's connectors. liken
# publishes them as one exclusive device, because raw i2c has no
# arbitration between writers. The operator claims it, probes each
# panel over DDC/CI, and publishes a control device for each connector.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: display-i2c
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].subsystem) &&
          device.attributes["liken.sh"].subsystem == "i2c-dev" &&
          has(device.attributes["liken.sh"].class) &&
          device.attributes["liken.sh"].class == "display"
