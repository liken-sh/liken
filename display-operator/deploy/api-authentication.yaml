# This RoleBinding is in its own file because it must be in
# `kube-system`, and `kubectl apply -n liken-system` refuses an object
# that sets another namespace. The install guide applies this file
# without `-n`.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: display-api-authentication-reader
  # The API server publishes the client CA in the ConfigMap
  # `extension-apiserver-authentication` in `kube-system`. display-api
  # watches it to verify callers' client certificates and to follow a
  # CA rotation. The built-in Role grants get, list, and watch on only
  # that ConfigMap.
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: display-api
    namespace: liken-system
