# The display-operator DaemonSet and the ResourceClaimTemplate that
# gives each of its pods the graphics card on its node.
---
# A claim for the card node, the render node, and the card's i2c
# buses. It is a template so that each pod of the DaemonSet gets its own
# claim on the card of its own node. A node with no graphics card has no
# matching device, so its pod stays Pending until one appears, and you
# do not have to list which machines have screens.
#
# The card node is allocated to one claim, so only this pod sets modes
# on the card. The render node is shareable, so transcoders can use the
# same GPU while this pod holds it.
#
# The deviceClassName values are the classes in deviceclasses.yaml. If
# you rename the classes, patch this template to match.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: display-gpu
spec:
  spec:
    devices:
      requests:
        - name: display
          exactly:
            deviceClassName: display-gpu
        - name: render
          exactly:
            deviceClassName: display-render
        # The card's i2c buses, for DDC/CI. liken publishes them as
        # devices separate from the card, so they need their own
        # request.
        - name: wires
          exactly:
            deviceClassName: display-i2c
      # The i2c buses must belong to the card of the display request,
      # not to a second GPU on the machine. Both kinds of device publish
      # the card's PCI address in liken.sh/address.
      constraints:
        - requests: ["display", "wires"]
          matchAttribute: liken.sh/address
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: display-operator
  labels:
    # The liken CLI finds the operator's workload by this label. It
    # reads the tag of the first container's image and pulls the -cli
    # image with the same tag, so the label goes on the workload whose
    # first container runs the display-operator image.
    cli.liken.sh/plugin: display
spec:
  selector:
    matchLabels:
      app: display-operator
  # The card node can be allocated to only one claim, so the old pod
  # must release the card before the new pod on that node can get it.
  # maxSurge: 0 starts the new pod only after the old pod on that node
  # has stopped.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: display-operator
    spec:
      serviceAccountName: display-operator
      # Every pod that claims a display device depends on this pod,
      # which also runs the compositor. With this class the scheduler
      # places it before ordinary pods, preempting one on a full node if
      # needed, and the kubelet evicts it last. The toleration below
      # lets it run on a node that liken taints while the node starts,
      # because the devices must be published before anything can
      # claim them.
      priorityClassName: system-node-critical
      # A node labeled display.liken.sh/display=none gets no pod. Every
      # other node gets one, and the claim decides where it can start,
      # so a node with no graphics card keeps a Pending pod until you
      # label it. A patch that sets its own node affinity replaces this
      # whole list of terms.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: display.liken.sh/display
                    operator: NotIn
                    values: ["none"]
      tolerations:
        - operator: Exists
      # The kernel sends uevents only to the initial user namespace. A
      # pod in its own user namespace receives an empty uevent stream
      # with no error, so a monitor plugged in after the pod started
      # never appears. This is the default value. It is written out
      # because the failure is silent.
      hostUsers: true
      # Every monitor the compositor drives is black while it is down,
      # so it must stop quickly on SIGTERM.
      terminationGracePeriodSeconds: 5
      # The operator container must see the compositor's process to
      # signal it. To apply a mode from a claim, the operator rewrites
      # weston.ini and sends SIGTERM to weston, because weston reads
      # weston.ini only at startup. The weston container then starts it
      # again with the new config. The operator sends SIGKILL to a
      # compositor that accepts connections on its socket but does not
      # respond, because a stopped process does not act on SIGTERM.
      shareProcessNamespace: true
      # The declare container writes weston.ini and exits. The weston
      # container runs the compositor. The operator container serves
      # DRA and publishes the ResourceSlice, and taints every output
      # while nothing answers on the compositor's socket. The capture
      # container receives frames from the compositor on the layout
      # module's capture socket and encodes them on the render node.
      initContainers:
        # This init container lists the card's connectors and writes
        # weston.ini before the compositor starts. It reads each
        # monitor's Display, so weston starts in the mode that
        # spec.mode sets and does not need a restart to apply it.
        - name: declare
          image: ghcr.io/liken-sh/display-operator:latest
          args: ["declare"]
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
            # The claim provides the card node that this container
            # lists connectors from.
            claims:
              - name: gpu
          volumeMounts:
            - name: weston-config
              mountPath: /etc/weston
        # The compositor runs as a native sidecar, which is an init
        # container with restartPolicy: Always. The kubelet starts it
        # before the operator container and stops it after. The "weston"
        # argument runs the image's binary in the mode that starts
        # weston as a child process.
        #
        # Before the operator stops weston on purpose, it writes the
        # weston pid to /etc/weston/restarts. When that pid exits, the
        # binary starts weston again, without the kubelet's crash
        # backoff. When weston exits with a pid that is not in that
        # file, the container exits and the kubelet restarts it with
        # crash backoff, so the container's restart count is the number
        # of crashes.
        #
        # At startup the binary waits up to 30 seconds for the
        # weston.ini that the declare container writes, and fails if it
        # does not appear. It does not wait for a monitor: the config
        # sets require-outputs=none, so weston starts on a card with no
        # monitor and this container shows Running with no restarts.
        #
        # There is no startup probe, so the kubelet starts the operator
        # container as soon as this one runs. The operator opens the
        # card only while it has a connection to weston's socket, so it
        # opens the card after weston does and cannot take DRM master
        # from it.
        - name: weston
          image: ghcr.io/liken-sh/display-operator:latest
          args: ["weston"]
          restartPolicy: Always
          env:
            # A comma-separated list of the weston debug scopes to write
            # to the log. The drm-backend scope reports why each view
            # goes to a display plane or to the renderer. It is empty by
            # default because drm-backend writes many lines on each
            # repaint, and video repaints on every frame. The comment on
            # westonLogScopesVariable in weston.go explains why it is
            # not behind --debug. A change to the value restarts the
            # pods.
            - name: WESTON_LOG_SCOPES
              value: ""
          securityContext:
            # No privilege and no capabilities. libseat's noop backend
            # opens the card node with a plain open(), and the kernel
            # gives DRM master to the first process that opens it, with
            # no capability check. So access to the hardware comes only
            # from the claim.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
            claims:
              - name: gpu
          volumeMounts:
            # The socket directory is a hostPath, and each consumer's
            # container mounts the same path.
            - name: weston-config
              mountPath: /etc/weston
            - name: socket
              mountPath: /var/run/display.liken.sh
      containers:
        - name: operator
          # The image contains the operator's binary, weston, and the
          # libraries weston loads. It has no shell, so kubectl exec can
          # run only a binary from the image by name, such as
          # wayland-info.
          image: ghcr.io/liken-sh/display-operator:latest
          env:
            # The name of the node that the ResourceSlice describes.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The operator reads this pod's status for the restart
            # count of the weston container, which counts the crashes
            # of the compositor.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Every liken process serves metrics on this port. It is set
            # here even if you run no Prometheus, so that the monitoring
            # component can scrape the pod without any change to this
            # manifest.
            - name: METRICS_ADDR
              value: ":9200"
          ports:
            - name: metrics
              containerPort: 9200
          securityContext:
            # No privilege and no capabilities. This container reads
            # sysfs, writes CDI files, and serves a socket to the
            # kubelet, and none of that needs them. Its reads of the
            # card also need CAP_SYS_ADMIN to be absent: each read drops
            # DRM master, and with CAP_SYS_ADMIN the kernel returns
            # EINVAL for a drop on a file that was never master.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              memory: 128Mi
            # The card node in the claim tells this container which
            # card's connectors to publish.
            claims:
              - name: gpu
          volumeMounts:
            # Every DRA driver needs these mounts. The kubelet finds
            # plugins in the registry directory, and the plugin's own
            # directory holds the socket for the prepare calls. Both are
            # writable because the driver creates sockets in them.
            - name: kubelet-plugin
              mountPath: /var/lib/kubelet/plugins/display.liken.sh
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            # The CDI specs that the container runtime applies to
            # containers with prepared claims. The OS writes its own
            # specs in this directory too, and each writer uses its own
            # file name prefix.
            - name: cdi
              mountPath: /var/run/cdi
            # The directory of the Wayland socket. It is on the host so
            # that a consumer's container can mount the same path.
            - name: socket
              mountPath: /var/run/display.liken.sh
            # The layout module's control socket, which places
            # surfaces, is in this directory. Only the containers of
            # this pod mount it, so no consumer can reach that socket.
            - name: weston-config
              mountPath: /etc/weston
        - name: capture
          # This image is the ffmpeg image plus the operator binary,
          # because this container starts an ffmpeg process for each
          # capture.
          image: ghcr.io/liken-sh/display-capture:latest
          args: ["capture"]
          env:
            # One listener serves the captures, the metrics, /healthz,
            # and /readyz. It uses 9201 because the operator container
            # in this pod already listens on 9200.
            - name: CAPTURE_ADDR
              value: ":9201"
          ports:
            - name: capture
              containerPort: 9201
          securityContext:
            # No privilege and no capabilities. The encoder reads frames
            # from a socket and uses the render node from the claim.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            # This limit is sized for a 1080p encode, so the operator
            # scales a clip wider than 1920 pixels down to that width
            # unless the caller asks for another size. On cgroup v2, an
            # ffmpeg that exceeds the limit kills the whole container,
            # which ends every capture on the node until the kubelet
            # restarts it.
            limits:
              memory: 384Mi
            # The encoder needs only the render node.
            claims:
              - name: gpu
                request: render
          volumeMounts:
            # The layout module's capture socket is in this directory.
            - name: weston-config
              mountPath: /etc/weston
            - name: capture-tls
              mountPath: /var/run/display-capture-tls
              readOnly: true
          # There is no readiness probe, because a certificate that
          # arrives late would keep the pod NotReady and stall the
          # DaemonSet's rolling update, which goes one node at a time.
          # A restart of this container ends the captures on its node
          # and nothing else.
          livenessProbe:
            httpGet:
              path: /healthz
              port: capture
              scheme: HTTPS
            periodSeconds: 30
            failureThreshold: 3
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: display-gpu
      volumes:
        # These four use DirectoryOrCreate because a node that has
        # never run a DRA driver does not have these paths.
        - name: kubelet-plugin
          hostPath:
            path: /var/lib/kubelet/plugins/display.liken.sh
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: socket
          hostPath:
            path: /var/run/display.liken.sh
            type: DirectoryOrCreate
        # The compositor's configuration directory. The declare
        # container writes weston.ini, and the operator container
        # writes each claim's mode here and rewrites weston.ini from
        # those records. weston reads weston.ini at each start, and the
        # operator sends weston SIGTERM to apply a new mode.
        #
        # It is an emptyDir because weston.ini lists the connectors
        # that this pod found, and a volume that outlived the pod would
        # give the next compositor an outdated list. A claim's mode
        # survives a restart of the weston container and is deleted
        # with the pod, so a machine that restarts with no consumer
        # runs each screen at the mode its monitor prefers.
        - name: weston-config
          emptyDir: {}
        # The serving certificate of the capture container. The volume
        # is optional because the pod can start before display-api
        # creates the Secret, and a required volume would keep the pod
        # from starting, which would stall the rolling update. The
        # kubelet reads the Secret, so the DaemonSet's ServiceAccount
        # needs no RBAC grant on it.
        - name: capture-tls
          secret:
            secretName: display-capture-server
            optional: true
