# A Layout divides a screen into regions. A region is a rectangle,
# given as fractions of the screen, and a label selector that chooses
# which claim's windows the region shows. A Display names the Layout it
# shows in spec.layout. The regions are in stacking order, last on
# top, so a small region written after a large one is a picture in the
# corner of it.
#
# A pod sets no position on the screen. It claims the screen and has
# labels, and only the Layout places the regions. So an edit to a
# region moves it on every screen that uses the Layout, with no change
# to any pod.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: layouts.display.liken.sh
spec:
  group: display.liken.sh
  # A region is a fraction of a screen and a selector over labels, so
  # a Layout names no namespace and no workload. It is cluster-scoped
  # so that one Layout can serve screens on any machine.
  scope: Cluster
  names:
    kind: Layout
    listKind: LayoutList
    plural: layouts
    singular: layout
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # A Layout has no status subresource, because the operator writes
      # nothing to a Layout. The Display's status.layout reports what a
      # screen draws from a Layout.
      additionalPrinterColumns:
        # A printer column reads one value through JSONPath, and
        # JSONPath has no function that counts the items of a list, so
        # the number of regions cannot be a column. To count them, read
        # `kubectl get layout -o yaml`.
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "The regions of a screen. Each region is a rectangle, given as fractions of the screen, and a label selector that chooses the claim whose windows the region shows. A `Display` names a `Layout` in `spec.layout`, and any number of screens can use the same `Layout`."
          required: [spec]
          properties:
            spec:
              type: object
              description: "The regions, in stacking order."
              required: [regions]
              properties:
                regions:
                  type: array
                  description: "The screen's regions in stacking order. A region written after another draws over it where they overlap. A region shows the windows of one claim: the first claim to arrive whose pods' labels match the region's `selector`. The newest window of that claim is on top. `status.layout` of the `Display` reports the window on top."
                  minItems: 1
                  # maxItems limits the cost of the uniqueness rule below.
                  # The API server estimates a rule's worst-case cost from
                  # the limits in the schema. A nested loop over a list
                  # with no maxItems exceeds the cost budget, and the API
                  # server refuses the CRD.
                  maxItems: 32
                  # The order of this list is the stacking order. With the
                  # list type map, server-side apply could reorder the
                  # regions and change which one is on top.
                  x-kubernetes-list-type: atomic
                  x-kubernetes-validations:
                    - rule: "self.all(region, self.exists_one(other, other.name == region.name))"
                      message: "region names must be unique within spec.regions"
                  items:
                    type: object
                    required: [name, rect, selector]
                    properties:
                      name:
                        type: string
                        description: "The region's name, unique in this `Layout`. `status.layout` of the `Display` lists it beside the window that the region shows, and `status.surfaces` gives it on that window."
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      rect:
                        type: object
                        description: "The region's rectangle, as fractions of the screen, so the same `Layout` fits a 1080p panel and a 4K panel. The compositor tells each window the rectangle's size in pixels, and the program redraws at that size."
                        required: [left, top, width, height]
                        properties:
                          left:
                            type: number
                            description: "The left edge, as a fraction of the screen's width. `0` is the left edge of the screen."
                            minimum: 0
                            maximum: 1
                          top:
                            type: number
                            description: "The top edge, as a fraction of the screen's height. `0` is the top of the screen."
                            minimum: 0
                            maximum: 1
                          width:
                            type: number
                            description: "The width, as a fraction of the screen's width. `left` plus `width` is at most 1."
                            minimum: 0
                            maximum: 1
                          height:
                            type: number
                            description: "The height, as a fraction of the screen's height. `top` plus `height` is at most 1."
                            minimum: 0
                            maximum: 1
                        x-kubernetes-validations:
                          - rule: "self.width > 0.0 && self.height > 0.0"
                            message: "width and height of a region must be above zero"
                          - rule: "self.left + self.width <= 1.0"
                            message: "left plus width of a region must be at most 1"
                          - rule: "self.top + self.height <= 1.0"
                            message: "top plus height of a region must be at most 1"
                      selector:
                        type: object
                        description: "A label selector, written like the selector of a `Service`, that chooses the claim whose windows the region shows. It matches against the labels that every pod holding the claim has, with the same value on each pod. Only claims on this screen can match, so a pod with matching labels and no claim on this screen does not appear. A window that a program opened on the compositor's own socket, `wayland-0`, and not on its claim's socket, belongs to no claim and matches no selector."
                        properties:
                          matchLabels:
                            type: object
                            description: "Labels that the pod must have, with exactly these values. Every entry must match."
                            additionalProperties:
                              type: string
                            x-kubernetes-map-type: atomic
                          matchExpressions:
                            type: array
                            description: "Requirements on the pod's labels. Every requirement must hold, together with `matchLabels`."
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key:
                                  type: string
                                  description: "The label key that the requirement tests."
                                operator:
                                  type: string
                                  description: "How the requirement tests `key`. `In` and `NotIn` compare the label's value with `values`, and `Exists` and `DoesNotExist` test only whether the key is present."
                                  enum: [In, NotIn, Exists, DoesNotExist]
                                values:
                                  type: array
                                  description: "The values that `In` and `NotIn` compare with. `Exists` and `DoesNotExist` take none."
                                  items:
                                    type: string
                                  x-kubernetes-list-type: atomic
                            x-kubernetes-list-type: atomic
                        # A selector is one value, like the upstream
                        # LabelSelector. A writer sets all of it, and
                        # two writers do not merge halves of one
                        # selector.
                        x-kubernetes-map-type: atomic
                      transition:
                        type: object
                        description: "How a window enters and leaves the region. The compositor draws both transitions, because the program is not told its region's position. `enter` and `exit` are both optional, and without one the window enters or leaves at once."
                        properties:
                          enter:
                            type: object
                            description: "How a window enters the region. It runs when a window arrives in the region, whether the pod is new or its labels began to match."
                            required: [kind]
                            properties:
                              kind:
                                type: string
                                description: "`none` shows the window at once. `fade` takes it from transparent to opaque over `milliseconds`."
                                enum: [none, fade]
                              milliseconds:
                                type: integer
                                description: "How long the entrance runs, in milliseconds. `0` is the same as `none`."
                                minimum: 0
                          exit:
                            type: object
                            description: "How a window leaves the region. It runs when a window that is still drawing stops matching the region, for example after a controller removes a label. When a program ends or closes its window, the window leaves at once, whatever this field sets."
                            required: [kind]
                            properties:
                              kind:
                                type: string
                                description: "`none` removes the window at once. `fade` takes it from opaque to transparent over `milliseconds`, and the program keeps drawing until the fade ends."
                                enum: [none, fade]
                              milliseconds:
                                type: integer
                                description: "How long the exit runs, in milliseconds. `0` is the same as `none`."
                                minimum: 0
