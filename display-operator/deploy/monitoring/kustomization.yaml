# This component adds the PodMonitors and the Grafana dashboard for a
# cluster that runs prometheus-operator. The base in deploy/ needs no
# monitoring, so you add this component beside it:
#
# resources:
#   - https://github.com/liken-sh/liken//display-operator/deploy?ref=<tag>
# components:
#   - https://github.com/liken-sh/liken//display-operator/deploy/monitoring?ref=<tag>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# Grafana's sidecar loads each ConfigMap in the `monitoring` namespace
# that has the `grafana_dashboard` label.
configMapGenerator:
  - name: display-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/display-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
