# The monitoring component, liken's shared contract for connecting a
# Prometheus to a process, milestone 65. The base in deploy/ applies on
# a cluster with no monitoring at all. A cluster owner who runs the
# prometheus-operator adds this component beside the base:
#
# resources:
#   - https://github.com/liken-sh/display-operator//deploy?ref=<tag>
# components:
#   - https://github.com/liken-sh/display-operator//deploy/monitoring?ref=<tag>
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The dashboard ConfigMap carries no namespace of its own, so it lands
# in monitoring, beside the Prometheus that runs the sidecar. The
# sidecar finds it there by the grafana_dashboard label, the same way
# it finds every other operator's dashboard.
configMapGenerator:
  - name: display-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/display-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
