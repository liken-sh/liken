# Each endpoint copies the pod's node name to a `node` label, because
# the dashboard groups series by machine, and a pod's name changes each
# time Kubernetes recreates it.
#
# The PodMonitors set their namespace here. A `namespace` in
# kustomization.yaml would also move the dashboard ConfigMap out of
# `monitoring`, where Grafana's sidecar loads it.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: display-operator
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: display-operator
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
    - port: capture
      scheme: https
      # The capture container's certificate is for the name
      # display-capture, not the pod's address, and display-api creates
      # its CA at its first start, so this file cannot name the CA.
      # The metrics hold no captured frames, so an unverified scrape is
      # acceptable.
      tlsConfig:
        insecureSkipVerify: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: display-api
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: display-api
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
