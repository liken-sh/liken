# The kustomize base for display-operator. liken does not apply it. You
# apply it with your own patches, or read it and write your own
# manifests.
#
# The claim template in operator.yaml refers to the `DeviceClass`
# objects in deviceclasses.yaml by name, so if you rename a class, patch
# the template too. The class that your workloads claim through is
# yours to create. The install guide at
# https://liken.sh/display/docs/guides/install/ has the YAML for
# `display-output`.
#
# api.yaml runs display-api once for the cluster. To run no capture
# API, remove it from the resources below.
#
# kustomize also sets the namespace on the `DeviceClass` objects,
# because it does not know resource.k8s.io/v1 and treats an unknown kind
# as namespaced. The API server ignores a namespace on a cluster-scoped
# object, so this does no harm.
#
# The namespace comes from a transformer with `unsetOnly`, not from the
# top-level `namespace` field, so that the `RoleBinding` in
# `kube-system` in api-authentication.yaml keeps its namespace. That
# binding lets display-api read the cluster's client certificate
# authority, and its `Role` exists only in `kube-system`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - displays.yaml
  - layouts.yaml
  - deviceclasses.yaml
  - rbac.yaml
  - operator.yaml
  - api.yaml
  - api-authentication.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: display-operator
      app.kubernetes.io/part-of: liken

# The images contain the same binary. Set the same tag on all of them,
# so a capture container never runs beside an operator of another
# release.
images:
  - name: ghcr.io/liken-sh/display-operator
    newTag: latest
  - name: ghcr.io/liken-sh/display-capture
    newTag: latest
  - name: ghcr.io/liken-sh/display-api
    newTag: latest
