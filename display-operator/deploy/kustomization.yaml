# The kustomize base for the display operator.
#
# This is an offer, not a mechanism. liken does not apply it and does
# not name it. Take it through your own GitOps with patches of your
# own, or read it and write your own manifests.
#
# The base ships no DeviceClass. A DeviceClass is cluster-scoped
# policy, the cluster owner's to name and curate, the same convention
# as a StorageClass, so this base does not create one behind the
# owner's back. The install guide at
# https://display.liken.sh/docs/guides/install/ gives copyable YAML
# for the three classes this operator involves: the two bootstrap
# classes the operator's own claim names, and the class consumers
# claim outputs through.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liken-system

resources:
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: display-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/display-operator
    newTag: latest
