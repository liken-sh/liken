                        boot declared. The system records it as
                        actuated, whatever the result of each load
                        was. A boot with the same image asks for the
                        same modules, so this field is the drift
                        reference, and status.modules gives the state
                        of each module.
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                        maxLength: 64
                    rlimits:
                      type: object
