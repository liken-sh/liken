# The Machine API, declared to Kubernetes.
#
# A CustomResourceDefinition tells Kubernetes about a new resource
# type. When you apply this document, the API server starts to serve
# /apis/liken.sh/v1alpha1/machines. This includes storage, validation,
# watches, RBAC, and kubectl support, and it needs no written code.
# The schema below has the same shape as the Go types in the machine
# package. The descriptions appear in the output of
# `kubectl explain machine.spec`, so an operator can read the API
# documentation at the terminal.
#
# This file goes in /var/lib/rancher/k3s/server/manifests/liken. The
# directory above it is the auto-deploy directory for k3s: k3s applies
# every file under it to the cluster at startup, and it applies a file
# again each time the file changes. This is a small GitOps loop inside
# k3s, and it is the reason that liken needs no `kubectl apply` step.
# The liken subdirectory holds the manifests that liken writes, apart
# from the ones k3s stages for its own components, so that init can
# refresh liken's manifests on every boot and write nothing outside
# that subdirectory (init/k3s.go).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # A CRD name always has the form <plural>.<group>. The group is a
  # DNS name that we own. This prevents a conflict between the custom
  # Machine types of different organizations.
  name: machines.liken.sh
spec:
  group: liken.sh
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    singular: machine
    # `kubectl get liken` shows the whole OS layer at once, in the
    # same way that `kubectl get all` shows workloads.
    categories: [liken]
  # This resource is cluster-scoped, like Node. A machine is below the
  # cluster and belongs to no namespace in it.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits the object into two endpoints,
      # each with its own write path. An ordinary update cannot touch
      # status, and a status update cannot touch spec. This boundary
      # enforces the rule that the spec is declared and the status is
      # observed. The API server enforces the rule; it is not only a
      # convention.
      subresources:
        status: {}
      # This section controls what `kubectl get machines` prints,
      # without -o yaml. Each column here shows a word on purpose,
      # not a boolean. A True/False value shows only that something
      # is wrong. An enumerated state gives the type of the fault and
      # the correction for it.
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .status.role
        # This column gives the machine's state in one word (see
        # status.phase below). The Ready condition stays for
        # programs, but a person who reads a fleet listing reads the
        # phase.
        - name: Status
          type: string
          jsonPath: .status.phase
        # kubectl calculates Uptime at read time, in the same way it
        # calculates the Age column: a date-typed column shows the
        # time elapsed since its timestamp. The value comes from the
        # boot record's time, so it is always current. An uptime value
        # written into status would be out of date immediately.
        - name: Uptime
          type: date
          jsonPath: .status.boot.time
        - name: Address
          type: string
          jsonPath: .status.network.addresses[0]
        - name: Liken
          type: string
          jsonPath: .status.version.liken
        - name: Kernel
          type: string
          jsonPath: .status.version.kernel
        # These are the two convergence conditions, one per document.
        # Cluster shows the Cluster document (ClusterConverged); Spec
        # shows the Machine manifest (SpecConverged). Each column
        # shows the condition's reason and not its True/False value,
        # because the reasons are an enumerated vocabulary that gives
        # the cause: Converged when the machine is at rest,
        # RebootPending when a change waits for a Manual reboot,
        # RejectedLastBoot when the system quarantined an edit, and
        # others.
        - name: Cluster
          type: string
          jsonPath: .status.conditions[?(@.type=="ClusterConverged")].reason
        - name: Spec
          type: string
          jsonPath: .status.conditions[?(@.type=="SpecConverged")].reason
        # This shows the clock's state: Synchronized, FreeRunning (the
        # spec declares no upstream sources, on purpose), or
        # Unsynchronized (the spec declares sources, but none of them
        # answers, which is an outage). The next column shows the
        # offset measured at the last exchange.
        - name: Time
          type: string
          jsonPath: .status.time.state
        - name: Offset
          type: string
          jsonPath: .status.time.offset
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Machine is one computer that runs liken. It holds the
            declared state of the operating system below this
            cluster, and the observed facts about the hardware that
            the operating system runs on.
          # This section defines admission-time validation, which the
          # API server runs. A partition can only grow. The rule is
          # about the disk, not about the history of the spec: a role
          # cannot be declared smaller than the size that the machine
          # last booted with, and status.boot.storage records that
          # size. These rules compare the spec against the status,
          # not against the spec's previous value with oldSelf, so an
          # edit stays reversible. A size that the machine could not
          # satisfy can go back down to the size on the disk, because
          # that edit makes nothing real smaller. These rules are at
          # the root of the schema because they must read both the
          # spec and the status.
          #
          # CEL cannot read the machine itself, so this is one of
          # three places where the system enforces the same rule. The
          # operator can still refuse a spec that passes admission,
          # because the operator compares it against the real disk
          # inventory. Init also never makes anything smaller at
          # boot.
          #
          # Note the method form in the comparison: Kubernetes
          # Quantity values do not support the >= operator in CEL,
          # only isLessThan and similar methods.
          x-kubernetes-validations:
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.biosBoot) || !has(self.spec.storage.biosBoot.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.biosBoot) || !has(self.status.boot.storage.biosBoot.size) ||
                !quantity(self.spec.storage.biosBoot.size).isLessThan(quantity(self.status.boot.storage.biosBoot.size))
              message: biosBoot cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.bootHome) || !has(self.spec.storage.bootHome.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.bootHome) || !has(self.status.boot.storage.bootHome.size) ||
                !quantity(self.spec.storage.bootHome.size).isLessThan(quantity(self.status.boot.storage.bootHome.size))
              message: bootHome cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.systemA) || !has(self.spec.storage.systemA.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.systemA) || !has(self.status.boot.storage.systemA.size) ||
                !quantity(self.spec.storage.systemA.size).isLessThan(quantity(self.status.boot.storage.systemA.size))
              message: systemA cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.systemB) || !has(self.spec.storage.systemB.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.systemB) || !has(self.status.boot.storage.systemB.size) ||
                !quantity(self.spec.storage.systemB.size).isLessThan(quantity(self.status.boot.storage.systemB.size))
              message: systemB cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.machineState) || !has(self.spec.storage.machineState.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.machineState) || !has(self.status.boot.storage.machineState.size) ||
                !quantity(self.spec.storage.machineState.size).isLessThan(quantity(self.status.boot.storage.machineState.size))
              message: machineState cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.machineEphemeral) || !has(self.spec.storage.machineEphemeral.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.machineEphemeral) || !has(self.status.boot.storage.machineEphemeral.size) ||
                !quantity(self.spec.storage.machineEphemeral.size).isLessThan(quantity(self.status.boot.storage.machineEphemeral.size))
              message: machineEphemeral cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.clusterState) || !has(self.spec.storage.clusterState.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.clusterState) || !has(self.status.boot.storage.clusterState.size) ||
                !quantity(self.spec.storage.clusterState.size).isLessThan(quantity(self.status.boot.storage.clusterState.size))
              message: clusterState cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.podStorage) || !has(self.spec.storage.podStorage.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.podStorage) || !has(self.status.boot.storage.podStorage.size) ||
                !quantity(self.spec.storage.podStorage.size).isLessThan(quantity(self.status.boot.storage.podStorage.size))
              message: podStorage cannot be smaller than the size this machine booted with. A partition can only grow.
            - rule: >-
                !has(self.spec) || !has(self.spec.storage) ||
                !has(self.spec.storage.podEphemeral) || !has(self.spec.storage.podEphemeral.size) ||
                !has(self.status) || !has(self.status.boot) || !has(self.status.boot.storage) ||
                !has(self.status.boot.storage.podEphemeral) || !has(self.status.boot.storage.podEphemeral.size) ||
                !quantity(self.spec.storage.podEphemeral.size).isLessThan(quantity(self.status.boot.storage.podEphemeral.size))
              message: podEphemeral cannot be smaller than the size this machine booted with. A partition can only grow.
          properties:
            spec:
              type: object
              description: >-
                The declared state of this machine. The fields take
                effect at different times. The liken operator applies
                sysctls and nodeLabels at boot, and it also
                reconciles them while the machine runs. The operator
                stages a change to network, storage, modules, or
                rlimits, and the change takes effect at the next
                boot.
              properties:
                network:
                  type: object
                  description: >-
                    The machine's network configuration. An empty
                    field selects the default: DHCP on the first
                    physical interface. Init applies this
                    configuration at boot. The cluster cannot apply
                    it while the machine runs, because the cluster
                    reaches the machine through the addresses that an
                    edit changes. The operator stages an edit, as it
                    does a storage edit, and the next boot applies
                    it. rebootPolicy sets who starts that boot, and
                    status.boot.network reports the network that the
                    running boot started with.
                  properties:
                    interfaces:
                      type: array
                      description: >-
                        The machine's interfaces, each named as the
                        kernel names it. A machine in a cluster
                        usually declares two interfaces: a DHCP
                        uplink, and the cluster-facing interface with
                        the static address that its peers use to find
                        it.
                      # One entry per interface: a map keyed by name.
                      # The API server enforces that key, so it
                      # refuses a manifest that declares one
                      # interface twice.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            maxLength: 15
                            description: >-
                              The interface to configure, named as
                              the kernel names it (for example,
                              eth1).
                          address:
                            type: string
                            maxLength: 64
                            pattern: ^[0-9a-fA-F:.]+/[0-9]{1,3}$
                            description: >-
                              A static address in CIDR form, for
                              example 10.10.0.1/24. The prefix length
                              gives the kernel the subnet. An empty
                              field selects DHCP on this interface.
                          gateway:
                            type: string
                            maxLength: 64
                            pattern: ^[0-9a-fA-F:.]+$
                            description: >-
                              The gateway address that makes this
                              interface the default route. This field
                              is optional, also for a static address,
                              because a DHCP lease on a different
                              interface can supply the route.
                          nameservers:
                            type: array
                            description: >-
                              The nameservers for this interface, in
                              preference order. The machine uses them in
                              addition to the nameservers from a DHCP
                              lease. The machine writes at most three
                              nameservers to resolv.conf, in interface
                              order.
                            # This list is atomic: nameserver order is
                            # preference order, so the list replaces
                            # as a whole.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                              maxLength: 253
                sysctls:
                  type: object
                  description: >-
                    Kernel tuning values, from a parameter name to its
                    declared value, for example vm.overcommit_memory:
                    "1". Init applies these values at boot, and the
                    liken operator applies them again on every pass,
                    so an edit here takes effect without a reboot.
                    liken sets its own values for about twenty
                    parameters before it applies this field, so a name
                    here also overrides liken's value for that
                    parameter. The manual's Kernel settings page lists
                    every one of them and why liken sets it.
                    status.sysctls reports both sets together, read
                    back from the kernel.
                  additionalProperties:
                    type: string
                rlimits:
                  type: object
                  description: >-
                    Resource limits, from a resource name to its
                    declared limit, for example nofile: "1048576".
                    These are the per-process ceilings that a
                    systemd distribution sets in each service's
                    Limit directives. liken has no systemd, so init
                    applies them to itself before it starts k3s, and
                    every process on the machine inherits them:
                    k3s, containerd, and the containers below them.
                    liken sets its own limits before it applies this
                    field, so a name here overrides liken's limit for
                    that resource. status.rlimits reports what the
                    kernel holds, read back after both passes.
                    Unlike sysctls, an edit here needs a reboot. The
                    kernel fixes a process's limits when it forks, so
                    nothing can raise the ceiling of a k3s that is
                    already running. rebootPolicy says who starts
                    that reboot.
                  additionalProperties:
                    type: string
                    description: >-
                      A limit in the same form a systemd unit file
                      uses. A bare number sets both the soft and the
                      hard limit, the word infinity means no limit,
                      and a soft:hard pair sets the two halves
                      separately. The soft limit is the one in force,
                      and a process may raise its own soft limit up
                      to its hard limit but never above it.
                    pattern: ^(infinity|[0-9]{1,20})(:(infinity|[0-9]{1,20}))?$
                    maxLength: 41
                  # The kernel has one limit for each of these names
                  # and no others, so a misspelling is refused here
                  # rather than skipped at boot with only a console
                  # line to say why.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(r, r in ['nofile', 'nproc', 'core',
                        'memlock', 'stack', 'fsize', 'nice'])
                      message: >-
                        a resource must be one of nofile, nproc, core,
                        memlock, stack, fsize, or nice
                modules:
                  type: array
                  description: >-
                    Extra kernel modules that this machine loads at
                    boot, in addition to the fixed list that the
                    operating system needs. These are the drivers for
                    the hardware that this machine's workloads use.
                    The image carries the kernel build's whole module
                    tree, so any name that kernel has is loadable
                    here, whatever manifests existed when the image
                    was built. status.modules reports the result for
                    each name, including a name this kernel has no
                    module for. Adding a name takes effect without a
                    reboot, because loading a driver is live-capable.
                    Removing one needs a reboot. Admission checks the
                    shape of the name only, because only the boot, or
                    the load that follows a later edit, can determine
                    whether the name exists.
                  # This is a set: the order carries no meaning, and
                  # the API server refuses duplicates instead of
                  # trusting the caller.
                  x-kubernetes-list-type: set
                  maxItems: 64
                  items:
                    type: string
                    maxLength: 64
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                nodeLabels:
                  type: object
                  maxProperties: 64
                  description: >-
                    The labels that this machine's Node object
                    carries. Workloads select on these labels, for
                    example to find the machine that has the GPU, or
                    the machine on battery-backed power. The system
                    writes these labels into the k3s boot
                    configuration, so the node has them when it
                    registers. The liken operator then reconciles
                    them while the machine runs. This includes the
                    removal of a label that this spec no longer
                    declares, which the kubelet does not do. The
                    system never changes a label applied outside this
                    spec.
                  # Three admission rules prevent a label edit that
                  # would stop the machine from booting. Registration
                  # labels pass through the kubelet. Under the
                  # NodeRestriction admission plugin, which k3s
                  # enables, a kubelet that gets a kubernetes.io or
                  # k8s.io label outside its own allowlist does not
                  # start. So admission refuses exactly the labels
                  # that would stop the machine, and it permits
                  # exactly the labels that the kubelet permits
                  # itself: the well-known identity labels (hostname,
                  # arch, os, the topology pair, instance-type) and
                  # anything in the kubelet.kubernetes.io and
                  # node.kubernetes.io namespaces. Admission refuses
                  # the liken.sh namespace because the operating
                  # system owns it: the static configuration sets
                  # liken.sh/machine, and a spec that sets a liken.sh
                  # label, or the node-role label that the demotion
                  # cleanup reads, conflicts with the operating
                  # system.
                  x-kubernetes-validations:
                    - rule: >-
                        self.all(key, key.size() <= 317 && key.matches('^([a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]*[A-Za-z0-9])?$'))
                      message: >-
                        a label key is an optional DNS-style prefix, a
                        slash, and a name that contains letters,
                        digits, dashes, underscores, and dots
                    - rule: >-
                        self.all(key, !key.matches('^([^/]*[.])?(kubernetes[.]io|k8s[.]io)/') ||
                        key in ['kubernetes.io/hostname', 'kubernetes.io/arch', 'kubernetes.io/os', 'topology.kubernetes.io/region', 'topology.kubernetes.io/zone'] ||
                        key.matches('^([^/]*[.])?(kubelet[.]kubernetes[.]io|node[.]kubernetes[.]io)/'))
                      message: >-
                        the kubernetes.io and k8s.io namespaces belong to
                        Kubernetes, and the kubelet does not start with a
                        label from them. Use only the labels that the
                        kubelet sets for itself: hostname, arch, os,
                        topology.kubernetes.io zone and region, and the
                        kubelet.kubernetes.io and node.kubernetes.io
                        namespaces
                    - rule: >-
                        self.all(key, !key.matches('^([^/]*[.])?liken[.]sh/'))
                      message: >-
                        the liken.sh namespace belongs to the operating
                        system, which sets its own labels
                  additionalProperties:
                    type: string
                    maxLength: 63
                    pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                rebootPolicy:
                  type: string
                  enum: [Auto, Manual]
                  default: Manual
                  description: >-
                    What the operator can do when the spec needs a
                    reboot to take effect. A change to storage,
                    network, or modules is a change of this kind,
                    because the operator measures drift in those three
                    sections and the boot is what applies them.
                    Manual, the default, stages the change to the
                    machineState filesystem and reports RebootPending,
                    and the next boot applies the change. Auto permits
                    the operator to reboot the machine.
                storage:
                  type: object
                  description: >-
                    Assigns storage roles to disks. Each role is one
                    field, because a machine has one cluster state
                    and one pod-storage pool. Each role names the
                    device it is on and, when it shares a disk, how
                    much of the disk to take. One role per disk can
                    omit its size and take the remainder. Init
                    applies this configuration at boot, before k3s.
                    The system reads the device path only on the boot
                    that claims a blank disk. After that, the system
                    finds the role's partition by the GPT partition
                    name written on it. The operator stages an edit
                    here, and the edit takes effect at the next boot.
                    If the machine cannot satisfy a staged spec, the
                    system quarantines that spec and the machine
                    boots its last proven spec. Only a machine that
                    has no proven spec stops the boot. The machine's
                    RAM root backs each role that the spec does not
                    declare.
                  properties:
                    biosBoot:
                      type: object
                      description: >-
                        A machine that declares this role, together
                        with bootHome, boots in BIOS mode, through
                        liken's own GRUB, and not through UEFI
                        firmware. This is a small raw partition,
                        about 1Mi in size, with no filesystem. It
                        holds GRUB's core image, the code that the
                        440 boot bytes in the MBR jump into. The size
                        is fixed after the system claims the
                        partition, because the MBR refers to the
                        partition by literal sector numbers.
                      required: [device]
                      properties:
                        device:
                          type: string
                          maxLength: 128
                          pattern: ^/dev/[a-zA-Z0-9/_-]+$
                          description: >-
                            The disk that this role is on, as a device
                            path (/dev/vda). The system reads this field
                            only on the boot that claims a blank disk.
                            After that, the system finds the role's
                            partition by the GPT partition name written
                            on it.
                        size:
                          type: string
                          maxLength: 32
                          pattern: ^[0-9]+(Ki|Mi|Gi|Ti)?$
                          description: >-
                            How much of the disk this role takes, as a
                            binary quantity (2Gi). This is an exact
                            allocation, not a request. An empty value
                            means that the role takes the rest of its
                            disk, and only one role per disk can omit
                            it.
                    bootHome:
                      type: object
                      description: >-
                        The second part of the BIOS boot declaration,
                        with biosBoot. This is a small FAT32
                        partition, about 64Mi in size, that holds
                        GRUB's configuration and its environment
                        block. The environment block is the file that
                        holds the boot variables that UEFI firmware
                        supplies on a UEFI machine. This partition is
                        on neither system slot, so the system can
                        write to both slots while the boot
                        configuration stays in its own space.
                      required: [device]
                      properties:
                        device:
                          type: string
                          maxLength: 128
                          pattern: ^/dev/[a-zA-Z0-9/_-]+$
                          description: >-
                            The disk that this role is on, as a device
                            path (/dev/vda). The system reads this field
                            only on the boot that claims a blank disk.
                            After that, the system finds the role's
                            partition by the GPT partition name written
                            on it.
                        size:
                          type: string
                          maxLength: 32
                          pattern: ^[0-9]+(Ki|Mi|Gi|Ti)?$
                          description: >-
                            How much of the disk this role takes, as a
                            binary quantity (2Gi). This is an exact
                            allocation, not a request. An empty value
                            means that the role takes the rest of its
                            disk, and only one role per disk can omit
                            it.
                    systemA:
                      type: object
                      description: >-
                        The first of the operating system's two boot
                        slots. Each slot holds one complete liken
                        version. The machine runs from one slot while
                        the system writes an upgrade to the other.
                        The slots are EFI system partitions that
                        carry FAT32, because the firmware reads each
                        slot first. Their size is fixed after the
                        system claims them, because FAT32 cannot grow
                        in place.
                      required: [device]
                      properties:
                        device:
                          type: string
                          maxLength: 128
                          pattern: ^/dev/[a-zA-Z0-9/_-]+$
                          description: >-
                            The disk that this role is on, as a device
                            path (/dev/vda). The system reads this field
                            only on the boot that claims a blank disk.
                            After that, the system finds the role's
                            partition by the GPT partition name written
                            on it.
                        size:
                          type: string
                          maxLength: 32
                          pattern: ^[0-9]+(Ki|Mi|Gi|Ti)?$
                          description: >-
                            How much of the disk this role takes, as a
                            binary quantity (2Gi). This is an exact
                            allocation, not a request. An empty value
                            means that the role takes the rest of its
                            disk, and only one role per disk can omit
                            it.
                    systemB:
                      type: object
                      description: >-
                        The second boot slot. The systemA description
                        gives the operation of the two slots.
                      required: [device]
                      properties:
                        device:
                          type: string
                          maxLength: 128
