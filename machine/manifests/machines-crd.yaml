                sysctls:
                  type: object
                  description: >-
                    The observed value of every parameter liken sets,
                    read back from the kernel: the values liken sets
                    on every machine, and the values spec.sysctls
                    declares. This puts what was asked for and what
                    the kernel holds side by side in one place. A
                    parameter liken could not write is absent, because
                    a failed write is never read back, so this field
                    lists the parameters that currently hold rather
                    than the parameters somebody wanted.
                  additionalProperties:
                    type: string
                rlimits:
                  type: object
                  description: >-
                    The resource limits init holds, read back from the
                    kernel: the limits liken sets on every machine,
                    and the limits spec.rlimits declares. Init is the
                    first process, so these are the limits that every
                    process on the machine inherits, including every
                    container. Reading /proc/1/limits on the machine
                    gives the same answer in the kernel's own layout.
                    Each value is in the same form spec.rlimits uses,
                    so the two can be compared without translating
                    either. A limit liken could not set is absent,
                    because a failed write is never read back.
                  additionalProperties:
                    type: string
                modules:
                  type: array
                  description: >-
                    The result for every module named in
                    spec.modules, as the machine resolved it: at boot,
                    or at the load that followed a later edit. Loaded
                    and Builtin are good states. Missing means that
                    this kernel has no module by that name, which is
                    usually a misspelling, because the image carries
                    the kernel's whole module tree. Rebuilding the
                    image changes nothing; correct the name, or take a
                    release whose kernel has the module. Failed means
                    that the kernel refused a module it does have. The
                    message field gives the detail and names the
                    correction.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, state]
                    properties:
                      name:
                        type: string
                        maxLength: 64
                        description: >-
                          The module, by the name that spec.modules
                          declares (for example, e1000e). It is the
                          key of this list.
                      state:
                        type: string
                        enum: [Loaded, Builtin, Missing, Failed]
                        description: >-
                          The result for this module on this boot.
                          Loaded means that the kernel took the
                          module, or already held it. Builtin means
                          that the kernel has the module compiled
                          in, so there was nothing to load. Missing
                          means that the booted image does not carry
                          the module, and a new image corrects it,
                          not a retry. Failed means that the image
                          carries the module and the kernel refused
                          it, which usually points to a fault in the
                          hardware.
                      message:
                        type: string
                        maxLength: 1024
                        description: >-
                          The detail for a Missing or a Failed
                          module, in the same words that the boot
                          prints on the console, and named as a
                          correction. This field is empty when the
                          state is Loaded or Builtin.
                features:
                  type: array
                  description: >-
                    The state on this machine of every feature that
                    the Cluster's spec.features enables. The Cluster
                    declares features for the whole fleet, but the
                    state is per machine, because a feature needs
                    support in the booted image, and machines run
                    different releases during a rollout. Active means
                    that this boot applied everything that the
                    feature asks of this machine. Missing means that
                    the booted image does not carry the feature, and
                    the correction is a release whose image carries
                    it. Failed means that the image carries the
                    feature, but that the machine could not apply it.
                    The message field gives the detail.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, state]
                    properties:
                      name:
                        type: string
                        maxLength: 64
                        description: >-
                          The feature, by the name that the
                          Cluster's spec.features enables (for
                          example, iscsi). It is the key of this
                          list.
                      state:
                        type: string
                        enum: [Active, Missing, Failed]
                        description: >-
                          The state of this feature on this machine,
                          on this boot. Active means that the boot
                          applied everything that the feature asks
                          of this machine. Missing means that the
                          booted image carries no payload for the
                          feature, and the correction is a release
                          whose image carries one. Failed means that
                          the image carries the payload and the
                          machine could not apply it, for example a
                          module that the kernel refused, or a boot
                          hook that returned an error.
                      message:
                        type: string
                        maxLength: 1024
                        description: >-
                          The detail for a Missing or a Failed
                          feature, in the same words that the boot
                          prints on the console, and named as a
                          correction. This field is empty when the
                          state is Active.
                registries:
                  type: object
                  description: >-
                    What this machine wrote into k3s's
                    registries.yaml: the registries that it mirrors,
                    the registries that have credentials, and whether
                    the embedded registry is on. This field carries
                    host names and flags only. The credential
                    material never appears in status.
                  properties:
                    mirrors:
                      type: array
                      description: >-
                        The registry hosts that registries.yaml
                        carries a mirror entry for, sorted by name.
                        The list holds "*" as well when the
                        embedded registry is on, because the
                        wildcard entry is how it shares the images
                        of every registry. This field is empty when
                        the machine mirrors nothing.
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                        maxLength: 256
                    credentialedHosts:
                      type: array
                      description: >-
                        The registry hosts that registries.yaml
                        carries a credential for, sorted by name.
                        This field names the hosts only. The
                        usernames and the passwords stay in the
                        registry-credentials Secret and never reach
                        status. This field is empty when the machine
                        pulls every image anonymously.
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                        maxLength: 256
                    embedded:
                      type: boolean
                      description: >-
                        True when this boot turned k3s's embedded
                        registry mirror (Spegel) on, which the
                        Cluster's spec.registries.embedded asks for.
                runtime:
                  type: object
                  description: >-
                    The runtime discipline that init imposed on this
                    boot: the Go environment and log level it gave the
                    k3s process, the configuration it wrote for the
                    kubelet inside it, and the level it gave
                    containerd beside it. These are the resolved
                    values, not the strings from the Cluster's
                    spec.runtime. An operator who changes a setting
                    reads back here what each machine actually runs.
                  properties:
                    k3s:
                      type: object
                      description: >-
                        The runtime discipline of the k3s process on
                        this machine. containerd and the shims get the
                        same Go environment. This field is absent when
                        init set no variable and rendered no log
                        level, so k3s runs on Go's own defaults and
                        logs at info.
                      properties:
                        goMemoryLimit:
                          type: string
                          maxLength: 32
                          description: >-
                            The resolved memory ceiling, as an absolute
                            quantity in MiB, for example "256Mi". It is
                            empty when the cluster does not set the
                            ceiling or turns it off, so an absent value
                            means no ceiling and Go's own default.
                        goGC:
                          type: integer
                          description: >-
                            The resolved collector rate (Go's GOGC). It
                            is absent when the cluster sets no value, so
                            k3s keeps Go's own rate.
                        debug:
                          type: boolean
                          description: >-
                            True when init told k3s to log at debug,
                            which reaches every Kubernetes component
                            inside the process. It is absent when the
                            cluster sets no value, so k3s logs at
                            info.
                    kubelet:
                      type: object
                      description: >-
                        The kubelet configuration that init wrote on
                        this machine, from the Cluster's
                        spec.runtime.kubelet. This field is absent
                        when the cluster names no setting, so init
                        wrote no configuration file and the kubelet
                        runs on its own defaults.
                      properties:
                        imageGC:
                          type: object
                          description: >-
                            The image collection policy that this
                            machine's kubelet runs. Each field is
                            present only when the cluster names it,
                            so an absent field means the kubelet's
                            own default for that field.
                          properties:
                            highThresholdPercent:
                              type: integer
                              description: >-
                                The disk usage that starts collection,
                                as a percent of the filesystem that
                                holds containerd's image store. It is
                                absent when the cluster names no
                                value, so the kubelet uses 85.
                            lowThresholdPercent:
                              type: integer
                              description: >-
                                The disk usage that stops collection,
                                as a percent of the same filesystem.
                                It is absent when the cluster names no
                                value, so the kubelet uses 80.
                            maximumAge:
                              type: string
                              maxLength: 32
                              description: >-
                                How long an unused image may stay in
                                the store before the kubelet removes
                                it, whatever the disk usage is. It is
                                absent when the cluster names no
                                value, so the kubelet does no age
                                check and only the thresholds prune
                                the store.
                            minimumAge:
                              type: string
                              maxLength: 32
                              description: >-
                                How long an unused image is kept
                                before the kubelet may remove it. It
                                is absent when the cluster names no
                                value, so the kubelet uses two
                                minutes.
                    containerd:
                      type: object
                      description: >-
                        The containerd configuration that init wrote
                        on this machine, from the Cluster's
                        spec.runtime.containerd. This field is absent
                        when the cluster names no setting, so init
                        wrote no drop-in and containerd runs on its
                        own defaults.
                      properties:
                        logLevel:
                          type: string
                          maxLength: 16
                          description: >-
                            The log level that this machine's
                            containerd runs at. It is absent when the
                            cluster names no level, so containerd uses
                            info.
                lastCrash:
                  type: object
                  description: >-
                    The most recent kernel crash that this machine
                    still holds records for. When the kernel panics,
                    it writes the end of its log to the firmware's
                    storage, and the next boot moves that record onto
                    the machine's own disk. Each boot derives this
                    summary from the records again. The crash is not
                    always the previous boot's crash. The summary
                    stays until the records leave the machine's
                    retention window, and the time field gives the
                    age of the crash. An empty field means that the
                    machine holds no crash records.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The machine's own clock at the time of the
                        crash. A crash usually occurs before the
                        boot's first clock synchronization, so this
                        time comes from the hardware clock.
                    reason:
                      type: string
                      maxLength: 32
                      description: >-
                        The kernel's word for the crash. The shipped
                        kernel records two words: Panic and Oops. The
                        vocabulary belongs to the kernel, so this
                        field is a free string, not a fixed list.
                    message:
                      type: string
                      maxLength: 1024
                      description: >-
                        The kernel's first description of the failure,
                        in the kernel's own words: the "Kernel panic -
                        not syncing:" line, or the "BUG:" line of an
                        oops.
                    records:
                      type: string
                      maxLength: 256
                      description: >-
                        The directory on the machine that holds the
                        full end of the kernel log: a directory in
                        the crash store under machineState, or
                        /sys/fs/pstore on a machine whose
                        machineState runs in memory.
                lastFailStop:
                  type: object
                  description: >-
                    The last boot that this machine refused to run.
                    Init stops a boot for two failures: it cannot tell
                    which configuration is its own, or it cannot
                    satisfy a declared storage role. A machine that
                    runs with the wrong configuration can do damage
                    that a reboot does not undo, so init powers the
                    machine off instead. The refusal writes its reason
                    to the machine's own disk, and the next boot
                    reports it here. The refusal is not always the
                    previous boot, and the time field gives the age of
                    the news. Nothing clears this field. The next
                    refusal replaces it. An empty field means that
                    this machine has never refused a boot, or that the
                    role it could not satisfy was the one that holds
                    the record.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The machine's own clock at the refusal. A boot
                        stops before its first clock synchronization,
                        so this time comes from the hardware clock.
                    reason:
                      type: string
                      maxLength: 1024
                      description: >-
                        Init's own words for the refusal, the same
                        text that the console printed before the
                        machine powered off.
                conditions:
                  type: array
                  description: >-
                    The typed observations that the operators keep
                    on this machine, in the standard Kubernetes
                    form. Each pass writes every condition again.
                    Ready is the roll-up, and it is True only when
                    every other condition is True. The other
                    conditions each report one check: FactsPublished
                    for the facts that init writes, SysctlsApplied,
                    StorageReady, ModulesLoaded, FeaturesReady, and
                    NodeLabelsApplied for the parts of the spec that
                    the operator applies, NodeHealthy for the Node's
                    own Ready condition, NodeCurrent for the cleanup
                    after a demotion, and SpecConverged,
                    ClusterConverged, VersionConverged,
                    CredentialsConverged, and ImportsConverged for
                    the documents and the release that this boot ran
                    under. RebootApproved is the one condition that
                    another program writes: the cluster operator
                    adds it to grant this machine a reboot turn, and
                    removes it to take the grant back. Its absence
                    carries the meaning, so it has no False state,
                    and Ready does not count it.
                  # A conditions array is a map with one entry per
                  # type. This declaration (list-type map, keyed by
                  # type) lets the API server refuse duplicate types.
                  # It also lets server-side apply merge a write for
                  # one condition instead of replacing the whole
                  # list. The field constraints below come from
                  # metav1.Condition itself, so these conditions
                  # validate in exactly the same way as the
                  # conditions on Pods and Nodes.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: >-
                          The check that this entry reports, in
                          CamelCase. It is the key of this list, so
                          a machine carries one entry for each type.
                          The description of the conditions field
                          lists the types that liken publishes.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: >-
                          The verdict. Every condition type on a
                          Machine states a healthy fact, so True is
                          the good verdict for all of them. Unknown
                          means that the operator cannot tell yet,
                          for example when the machine's facts carry
                          no boot record.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The metadata.generation that this condition
                          judged. The generation counts spec edits,
                          so this field lets a client tell a verdict
                          on the current spec from a verdict on an
                          earlier spec. That difference is important
                          here, because an edit can wait for a
                          reboot.
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: >-
                          Why the condition holds this status, in
                          one CamelCase word. Programs read this
                          field, so it changes less than the message
                          does. Ready reports Reconciled or
                          Degraded. NothingDeclared is the reason
                          that a check with nothing to do reports.
                          The convergence conditions share one set
                          of reasons: Converged, FactsIncomplete,
                          MachineStateEphemeral, StagingRejected,
                          RejectedLastBoot, AwaitingTurn,
                          RebootPending, RebootRequested,
                          RestartPending, RestartRequested, and
                          StagedForNextBoot. The last one means that
                          the machine holds the change and applies it
                          at its next boot. Only a boot reads the
                          fields that changed, so no reboot and no
                          restart is scheduled.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The detail, for a person to read. A
                          message names the correction where one
                          exists, for example the roles that memory
                          still backs, or the exact difference
                          between the spec and this boot.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          The time when the status of this condition
                          last changed. A pass that writes the same
                          status again does not move this time, so
                          the field gives the length of time that
                          this verdict has held.
                pending:
                  type: array
                  description: >-
                    What this machine waits to apply: one entry for
                    each staged document that needs a disruption.
                    Each entry names the convergence condition that
                    reported it, the kind of disruption that applies
                    it, the staged document's hash, and a one-line
                    summary. To grant one change its disruption on a
                    machine whose rebootPolicy is Manual, annotate
                    the machine with liken.sh/approve-disruption set
                    to the entry's hash (the liken CLI's
                    approve-reboot command does this). The grant is
                    one-shot: once the change applies, its hash is no
                    longer pending, and the next change hashes
                    differently, so a stale annotation approves
                    nothing.
                  items:
                    type: object
                    required: [condition, kind, hash, summary]
                    properties:
                      condition:
                        type: string
                        description: >-
                          The convergence condition that reported
                          this entry, for example CredentialsConverged.
                      kind:
                        type: string
                        enum: [Reboot, Restart]
                        description: >-
                          What applies the staged document. A reboot
                          applies every staged document at once. A
                          restart applies only the documents that k3s
                          reads when its process starts, and the
                          machine does not reboot.
                      hash:
                        type: string
                        description: >-
                          The staged document's identity: the value
                          that an approve-disruption annotation names
                          to grant this change its disruption.
                      summary:
                        type: string
                        description: >-
                          One line saying what the document changes.
