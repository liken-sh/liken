            status:
              type: object
              description: >-
                What the machine observed about itself. Init writes
                these facts through the facts tree, and the liken
                operator publishes them. The system derives every
                field here again on each reconcile pass and keeps no
                earlier value. Status reports the current state only.
              properties:
                phase:
                  type: string
                  enum: [Unknown, Booting, Lost, Blocked, Updating, UpdatePending, Degraded, Ready]
                  description: >-
                    The machine's state in one word. The system
                    derives this value from the conditions on each
                    reconcile pass, so the phase always agrees with
                    them. Ready means that every condition holds.
                    UpdatePending and Updating mean that a staged
                    change waits for a reboot (Manual), waits for
                    this machine's next boot, or is in progress
                    (Auto). Blocked means that drift exists
                    which liken refuses to stage or cannot stage.
                    This state needs a different edit, and time does
                    not clear it. Degraded covers all other faults.
                    Booting means that init has not yet published
                    this boot. Unknown means that the operator cannot
                    read the machine's facts at all. Lost is the one
                    value that the machine does not report about
                    itself: a leader writes it when this machine's
                    heartbeat lease (in liken-system) stops, because
                    a machine that is down cannot report its own
                    failure.
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    The metadata.generation of the spec that this
                    status judged. The operator writes this value on
                    each pass. Each condition carries the same value,
                    but a client that only needs to know whether the
                    operator has seen its edit reads the value here,
                    at the top of status, where Kubernetes
                    controllers usually publish it.
                role:
                  type: string
                  description: >-
                    This machine's part in its cluster: a leader,
                    which runs a control plane, or a follower, which
                    runs workloads. The system derives this value at
                    boot from the leaders list in the Cluster
                    manifest. No one declares this field directly.
                version:
                  type: object
                  description: >-
                    The full inventory of what this machine runs:
                    liken's own version and every third-party
                    component that the operating system carries. The
                    system reads the kernel and xtables versions from
                    the running machine. The other values come from
                    the components record that the image build wrote
                    beside the image, the same pins that the release
                    document publishes. k3s appears here and also on
                    the Node object, because the two values are
                    different: the Node reports the running kubelet,
                    and this field reports what the operating system
                    image carried.
                  properties:
                    liken:
                      type: string
                      description: >-
                        The liken version that this machine runs.
                        The build stamps this value into the binary:
                        a release build stamps the release name, and
                        a development build stamps the git-described
                        commit. The operator compares this value
                        with the Cluster's spec.version to decide
                        whether this machine needs an upgrade.
                    kernel:
                      type: string
                      description: >-
                        The kernel release, as uname reports it on
                        the running machine.
                    xtables:
                      type: string
                      description: >-
                        The netfilter userspace, as iptables -V
                        reports it: the version and the variant
                        (legacy or nft).
                    k3s:
                      type: string
                      description: >-
                        The k3s release that this operating system
                        image carries. liken vendors one pinned k3s
                        binary for each release.
                    trust:
                      type: string
                      description: >-
                        The date of the CA bundle: the day of the
                        Mozilla root certificates that this machine
                        trusts.
                    e2fsprogs:
                      type: string
                      description: >-
                        The e2fsprogs release that supplied mke2fs,
                        the program that makes the ext4 filesystem
                        on each storage role's partition.
                    openIscsi:
                      type: string
                      description: >-
                        The open-iscsi release that supplied
                        iscsiadm and iscsid, the iSCSI initiator
                        that the iscsi feature uses.
                    nfsUtils:
                      type: string
                      description: >-
                        The nfs-utils release that supplied
                        mount.nfs, the mount helper that the nfs
                        feature uses.
                    systemdBoot:
                      type: string
                      description: >-
                        The systemd-boot release that supplied the
                        boot menu on liken's install media.
                    grub:
                      type: string
                      description: >-
                        The GRUB release that supplied the boot
                        program that liken writes into a BIOS
                        machine's biosBoot partition.
                    hwdata:
                      type: string
                      description: >-
                        The PCI database that gives names to vendor
                        and device IDs.
                    tzdata:
                      type: string
                      description: >-
                        The IANA timezone database release, for
                        example 2026c. This is the database that
                        resolves a CronJob's spec.timeZone on this
                        machine. Read it when a job fires at an
                        unexpected hour. A machine keeps the release
                        its image carried until it upgrades.
                    linuxFirmware:
                      type: string
                      description: >-
                        The linux-firmware release that supplied the
                        driver blobs under /lib/firmware.
                    microcode:
                      type: string
                      description: >-
                        The CPU microcode release that supplied the
                        early cpio on this machine's boot slot.
                    microcodeRevision:
                      type: string
                      description: >-
                        The microcode revision that the CPUs report.
                        On physical hardware, this value shows
                        whether the early cpio applied. On a virtual
                        machine, this value comes from the
                        hypervisor.
                network:
                  type: object
                  description: >-
                    The network result of this boot, for DHCP leases
                    and for static addresses. The top-level fields
                    give the values of the primary interface, which
                    is the cluster-facing interface when the
                    Cluster's nodeCIDR identifies it. The interfaces
                    field gives the full detail for each interface.
                  properties:
                    interface:
                      type: string
                      description: >-
                        The primary interface, as the kernel names
                        it (for example, eth0).
                    mac:
                      type: string
                      description: >-
                        The hardware address of the primary
                        interface.
                    addresses:
                      type: array
                      description: >-
                        The addresses of the primary interface, each
                        in CIDR form (10.10.0.5/24).
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                    gateway:
                      type: string
                      description: >-
                        The default gateway of the primary
                        interface. This field is empty when the
                        interface has no default route.
                    nameservers:
                      type: array
                      description: >-
                        The nameservers of the primary interface, in
                        preference order: the nameservers from its
                        DHCP lease, and the nameservers that the
                        manifest declares for it.
                      x-kubernetes-list-type: atomic
                      items:
                        type: string
                    leaseExpires:
                      type: string
                      format: date-time
                      description: >-
                        The time when the DHCP lease of the primary
                        interface expires. This field is empty when
                        the interface has a static address.
                    interfaces:
                      type: array
                      description: >-
                        Every interface that this boot configured,
                        with the detail for each one. The fields
                        above repeat the values of the primary
                        interface, which is the one that the
                        Cluster's nodeCIDR identifies, or the first
                        interface that came up.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: >-
                              This interface, as the kernel names it
                              (for example, eth0). It is the key of
                              this list.
                          mac:
                            type: string
                            description: >-
                              The hardware address of this
                              interface.
                          address:
                            type: string
                            description: >-
                              The address of this interface, in CIDR
                              form (10.10.0.5/24).
                          method:
                            type: string
                            description: >-
                              How the interface got its address: DHCP
                              or Static.
                          gateway:
                            type: string
                            description: >-
                              The default gateway of this interface.
                              This field is empty when the interface
                              has no default route.
                          nameservers:
                            type: array
                            description: >-
                              The nameservers of this interface, in
                              preference order: the nameservers from
                              its DHCP lease, and the nameservers
                              that the manifest declares for it.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                          leaseExpires:
                            type: string
                            format: date-time
                            description: >-
                              The time when the DHCP lease of this
                              interface expires. This field is empty
                              when the interface has a static
                              address.
                time:
                  type: object
                  description: >-
                    The state of this machine's clock. This field
                    changes through the machine's whole life, unlike
                    most of status, because the system corrects the
                    clock continuously and not only at boot.
                  properties:
                    state:
                      type: string
                      enum: [Synchronized, FreeRunning, Unsynchronized]
                      description: >-
                        Whether the system corrects the clock against
                        a source that is itself synchronized. If it
                        does not, this field shows whether the cause
                        is the configuration or an outage.
                        FreeRunning means that the spec declares no
                        sources, and the machine runs on its hardware
                        clock on purpose. Unsynchronized means that
                        the spec declares sources but that none of
                        them answers. A free-running fleet can agree
                        with itself, but the state stays FreeRunning.
                        Agreement in the fleet is not the same as
                        agreement with real-world time, and
                        certificate validation depends on that
                        difference.
                    source:
                      type: string
                      description: >-
                        The source that this machine synchronizes
                        with. On a leader, this is the name of an
                        upstream server. On a follower, this is one
                        of the cluster's leaders.
                    stratum:
                      type: integer
                      description: >-
                        The distance from a reference clock, in NTP's
                        vocabulary: a source at stratum n makes this
                        machine n+1. A server that free-runs on
                        purpose reports 10, the local-clock value. A
                        value of 16 means unsynchronized.
                    offset:
                      type: string
                      description: >-
                        The clock error measured at the last
                        exchange, as a duration ("1.28ms"). The value
                        is positive when this machine is behind its
                        source.
                    lastSync:
                      type: string
                      format: date-time
                      description: >-
                        The last time that the clock agreed with its
                        source.
                hardware:
                  type: object
                  description: >-
                    What this machine is made of, as the machine
                    observed itself. The processor count and the
                    memory come from the boot. The disks and the
                    unclaimed devices stay current while the machine
                    runs, because init watches the kernel's uevents
                    and writes both lists again on every change.
                  properties:
                    cpus:
                      type: integer
                      description: >-
                        The number of logical processors that the
                        kernel makes available. Hardware that has
                        threads counts each thread as one processor.
                    memoryBytes:
                      type: integer
                      description: >-
                        The machine's total usable memory, in bytes,
                        as the kernel reports it. This value is less
                        than the memory that the machine holds,
                        because the firmware and the kernel reserve
                        some of it.
                    blockDevices:
                      type: array
                      description: >-
                        The machine's storage inventory: every
                        physical disk that the kernel found, whether
                        the spec declares it or not. The name is the
                        kernel's name for this boot. The kernel
                        assigns the name in probe order, so the name
                        identifies the device for this boot only and
                        not permanently. The stable names identify
                        the device across boots. The model and the
                        serial come from the device itself.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: >-
                              This disk, as the kernel names it this
                              boot (vda, nvme0n1). It is the key of
                              this list.
                          sizeBytes:
                            type: integer
                            description: >-
                              The capacity of this disk, in bytes.
                          model:
                            type: string
                            description: >-
                              The model name that the device
                              reports. This field is empty when the
                              device reports none.
                          serial:
                            type: string
                            description: >-
                              The serial number that the device
                              reports. This field is empty when the
                              device reports none.
                          stableNames:
                            type: array
                            description: >-
                              Every name that identifies this disk
                              across boots. spec.storage.<role>.device
                              accepts any name in this list. The
                              first by-id entry is the one to prefer.
                              A by-id name follows the disk itself,
                              so it survives a swap into a different
                              bay. A by-path name follows the port
                              instead, and stops naming the disk
                              after that swap.
                            x-kubernetes-list-type: atomic
                            items:
                              type: string
                    unclaimed:
                      type: array
                      description: >-
                        Devices that the kernel found but that no
                        driver controls, because spec.modules does
                        not declare the module that the device needs.
                        This list shows only those devices. It is not
                        a full inventory, and a machine that has a
                        driver for all of its hardware reports
                        nothing here. Each entry gives the name of
                        the device, the candidate modules whose alias
                        patterns match the device's identifier, and
                        the correction: declare a candidate module
                        that the image carries, or upgrade to a
                        release that carries one.
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [modalias]
                      items:
                        type: object
                        required: [modalias, bus]
                        properties:
                          modalias:
                            type: string
                            description: >-
                              The kernel's identifier for this
                              device: the string that it announces
                              in a uevent and matches driver alias
                              patterns against. It is the key of
                              this list, and it names the device
                              exactly when the words below do not.
                          bus:
                            type: string
                            description: >-
                              The bus that the device is on: pci or
                              usb.
                          name:
                            type: string
                            description: >-
                              The device in words: the manufacturer
                              and product strings of a USB device,
                              or the names from the pci.ids database
                              for a PCI device. When no better name
                              exists, this field gives the numeric
                              vendor and device IDs.
                          class:
                            type: string
                            description: >-
                              The coarse kind of the device, decoded
                              from the bus's class code: for
                              example, mass-storage, display, or
                              network.
                          candidates:
                            type: array
                            description: >-
                              The loadable modules whose alias
                              patterns match this device, in the
                              kernel build's order of preference.
                              More than one candidate is usual: USB
                              storage matches both uas and
                              usb_storage. The choice belongs to the
                              person who edits spec.modules.
                            items:
                              type: string
                          message:
                            type: string
                            description: >-
                              The correction, in words: declare one
                              of the candidate modules in
                              spec.modules when the image carries
                              it, or upgrade to a release whose
                              image carries one.
                firmware:
                  type: object
                  description: >-
                    The firmware state that the machine keeps: its
                    boot mode and the boot menu from its non-volatile
                    store. In UEFI mode, this field reports the
                    firmware's variables as text. BIOS covers every
                    environment that has no firmware variables to
                    read, for example a legacy server or a
                    direct-kernel boot under a hypervisor. This field
                    describes the machine, not the boot: every value
                    here stays through a power cycle, and the system
                    writes status.boot again on every boot. Each
                    entry shows the firmware's variable name and the
                    entry's own description, for example "Boot0001
                    (liken slot A)".
                  properties:
                    mode:
                      type: string
                      enum: [UEFI, BIOS]
                      description: >-
                        The kind of firmware that started this
                        machine. UEFI means that the machine keeps
                        boot variables that liken reads and writes.
                        BIOS covers every environment that keeps no
                        such variables, for example a legacy server
                        or a direct-kernel boot under a hypervisor.
                    bootCurrent:
                      type: string
                      description: >-
                        The entry that this boot came from. In UEFI
                        mode, the value is the firmware's BootCurrent
                        variable. In BIOS mode, it is the liken.slot=
                        parameter on the kernel command line. This
                        field is empty when neither source names an
                        entry, as in a direct-kernel boot.
                    bootNext:
                      type: string
                      description: >-
                        The one-shot entry that is armed for the
                        next boot: the firmware's BootNext variable
                        in UEFI mode, or try_slot in GRUB's
                        environment block in BIOS mode. The boot
                        uses this entry one time and then clears it.
                        A value here means that a proving boot waits
                        and has not yet happened. This field is
                        empty at every other time.
                    bootOrder:
                      type: array
                      description: >-
                        The standing list of preferences, with the
                        first choice first: the firmware's BootOrder
                        variable in UEFI mode, where each entry is a
                        menu entry, or default_slot in GRUB's
                        environment block in BIOS mode, which gives
                        one entry.
