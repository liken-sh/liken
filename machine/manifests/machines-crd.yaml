                    network:
                      type: object
                      description: >-
                        The network that the manifest of this boot
                        declared. The system records it as actuated,
                        whatever the result for each interface was. A
                        boot with the same manifest asks for the same
                        network, so this field is the drift
                        reference, and status.network reports what
                        each interface received. An edit to
                        spec.network is converged when the two agree.
                        This field is absent, and not empty, on a
                        boot that reported no network at all. An
                        empty field means that the machine declared
                        no interface and used the zero-configuration
                        default.
                      properties:
                        interfaces:
                          type: array
                          description: >-
                            The interfaces that the manifest of this
                            boot declared. The system records them
                            as actuated, whatever the result for
                            each interface was.
                            status.network.interfaces reports what
                            each interface received.
                          # Atomic, and compared by position. The
                          # order of the list is part of what the
                          # spec asks for, because it sets the order
                          # of the nameservers in resolv.conf, so the
                          # record keeps it.
                          x-kubernetes-list-type: atomic
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                maxLength: 15
                                description: >-
                                  The interface that the manifest
                                  named, as the kernel names it (for
                                  example, eth1).
                              address:
                                type: string
                                maxLength: 64
                                description: >-
                                  The static address in CIDR form
                                  that the manifest declared, for
                                  example 10.10.0.1/24. An empty
                                  field means DHCP on this
