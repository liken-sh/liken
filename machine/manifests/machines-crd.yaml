                boot:
                  type: object
                  description: >-
                    The record of this boot. The system writes this
                    record again on every boot, and the operator
                    compares the spec against it. Compare this field
                    with firmware, the state that stays through
                    reboots. The manifest sources give the documents
                    that the boot used: the staged copy that waits
                    for its proving boot, the proven
                    last-known-good copy, or, on the first boot only,
                    the seed in the image. The system records these
                    sources separately for the Machine manifest and
                    the Cluster document, because the two stage and
                    prove independently. The hashes identify the
                    exact bytes, and the storage, network, and
                    modules blocks show the spec as actuated.
                    Together they are the reference for drift between
                    what the cluster asks for and what the machine
                    did. A rejection reports a staged document that
                    failed and that the system quarantined. The
                    rejection stands until a different edit proves
                    out.
                  properties:
                    time:
                      type: string
                      format: date-time
                      description: >-
                        The time when this machine booted. Init
                        calculates it from the kernel's uptime
                        counter. It belongs to the boot record
                        because it shares the record's lifetime: a
                        reboot changes it, and an in-place k3s
                        restart does not. The Uptime printer column
                        shows this timestamp as an elapsed time.
                    manifestSource:
                      type: string
                      enum: [Staged, Proven, Seed]
                      description: >-
                        The copy of the Machine manifest that this
                        boot used. Staged is a copy that waits for
                        its proving boot. Proven is the
                        last-known-good copy. Seed is the manifest
                        in the image, and only a first boot uses it.
                    manifestHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        Machine manifest that this boot used. The
                        operator compares this hash with the hash of
                        the manifest in the cluster to find drift.
                    clusterManifestSource:
                      type: string
                      enum: [Staged, Proven, Seed]
                      description: >-
                        The copy of the Cluster document that this
                        boot used, with the same values as
                        manifestSource. The system records the two
                        documents separately, because each one
                        stages and proves on its own. A machine can
                        be current on one document and drifted on
                        the other.
                    clusterManifestHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        Cluster document that this boot used.
                    credentialsSource:
                      type: string
                      # This field has no Seed value on purpose: the
                      # operator is the only writer of the
                      # credentials document, so no image carries one
                      # and no first boot reads one.
                      enum: [Staged, Proven]
                      description: >-
                        The copy of the registry-credentials document
                        that this boot, or the most recent k3s
                        restart, wrote into registries.yaml. This
                        field is absent on a machine that never had
                        credentials. That is a usual state, and the
                        machine pulls images anonymously.
                    credentialsHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        registry-credentials document that this
                        boot, or the most recent k3s restart, wrote
                        into registries.yaml. This field is absent
                        on a machine that never had credentials.
                    importsSource:
                      type: string
                      # This field has no Seed value: the record
                      # describes this disk's own container store, so
                      # nothing in an image can replace it.
                      enum: [Staged, Proven]
                      description: >-
                        The imported-images record that this boot
                        used. Staged means that the tarballs are on
                        trial, and the operator has not yet proven
                        that the container store serves them. Proven
                        is the usual boot, where all of the tarballs
                        match the record. This field is absent when
                        the import lifecycle does not run (an
                        ephemeral machineState or an ephemeral
                        container store).
                    importsHash:
                      type: string
                      description: >-
                        The sha256 hash of the exact bytes of the
                        imported-images record that this boot used.
                        This field is absent when the import
                        lifecycle does not run.
                    importsDiscarded:
                      type: boolean
                      description: >-
                        True when this boot found an imports trial
                        from an earlier boot that stopped before it
                        proved the trial. This boot then discarded
                        the container store instead of trusting it.
                        The operating system images unpack again from
                        this boot's tarballs, and workload images
                        pull again.
                    restarts:
                      type: integer
                      description: >-
                        The number of in-place k3s restarts in this
                        boot. A restart applies a restart-class
                        change, for example a feature toggle or the
                        registry configuration. This field shares the
                        boot record's lifetime on purpose. A change
                        that a restart applied increases this field
                        and does not change the boot record's time. A
                        change that a reboot applied changes the time
                        and sets this field to zero.
                    slot:
                      type: string
                      enum: [A, B]
                      description: >-
                        The system slot that this boot came from,
                        read from the liken.slot= parameter in the
                        boot entry that started it. This
                        field is absent when the boot did not come
                        from a slot (a direct-kernel boot or install
                        media). A release downloads to the slot that
                        the machine does not run from, which is the
                        purpose of the two slots.
                    commandLine:
                      type: string
                      maxLength: 4096
                      description: >-
                        The kernel command line that this boot ran
                        with, whole and unparsed. The slot above is
                        one parameter out of it. No field sets this
                        line: liken writes each machine's boot
                        entries itself, naming the console, the
                        machine, and the slot. The line is reported
                        because it is the only input a machine reads
                        before it reads a file, so it is the first
                        thing to check when one machine behaves
                        unlike the others that share its release.
                    storage:
                      type: object
                      description: >-
                        The storage that the manifest of this boot
                        declared. The system records it as actuated,
                        whatever the result for each role was. A
                        boot with the same manifest claims the same
                        disks, so this field is the drift reference,
                        and status.storage reports what backs each
                        role now. An edit to spec.storage is
                        converged when the two agree.
                      properties:
                        biosBoot:
                          type: object
                          description: >-
                            The biosBoot role, as this boot actuated
                            it. spec.storage.biosBoot describes what
                            the role holds.
                          properties:
                            device:
                              type: string
                              description: >-
                                The disk that this role is on, as a
                                device path (/dev/vda), as the
                                manifest of this boot declared it.
                            size:
                              type: string
                              description: >-
                                How much of the disk this role
                                takes, as a binary quantity (2Gi).
                                An empty value means that the role
                                takes the rest of its disk.
