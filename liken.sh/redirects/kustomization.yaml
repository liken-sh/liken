# The redirects in a Kubernetes cluster: Caddy answers each manual's
# name, such as `display.liken.sh`, with a 301 to that manual's section
# of `liken.sh`, with the same path and query. A cluster applies this
# directory as a remote base, for example with a Flux `GitRepository`
# on this repository and a `Kustomization` with this path.
#
# The cluster's ingress controller ends TLS and passes plain HTTP to
# Caddy, so Caddy needs no certificates and no state. The cluster
# supplies the namespace, and it supplies the certificate for the
# `redirects-tls` `Secret`, for example with a cert-manager annotation
# on the `Ingress`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - redirects.yaml
configMapGenerator:
  - name: redirects-caddyfile
    files:
      - Caddyfile
