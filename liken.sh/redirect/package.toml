# The service that answers every subdomain of liken.sh that has no
# record of its own with a 301 to that name's manual on the one site.
[package]
name = "redirect"
license = "MIT"

[[jobs]]
name = "go"
toolchain = "go"
run = "make test"

[[outputs.images]]
name = "redirect"
smoke = "liken.sh/redirect/smoke/redirect.sh"
