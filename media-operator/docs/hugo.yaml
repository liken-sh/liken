# The site configuration of the media-operator manual at
# https://liken.sh/media/. The theme is brand/, which every liken site
# uses.
baseURL: https://liken.sh/media/

# The crdref generator writes a raw-HTML span with an id into each
# field's table row, so that a link can point at one field. Goldmark
# drops raw HTML unless this is set. This is safe because all content
# on the site comes from this repository.
markup:
  goldmark:
    renderer:
      unsafe: true
title: media-operator
# brand/ is at the repository root, so the site always builds with the
# theme of the same commit.
themesDir: ../..
theme: brand

# The theme's nav links to this URL, and the sidebar title is its last
# path segment.
params:
  repository: https://github.com/liken-sh/liken/tree/main/media-operator

  # Adds a footer link to /coverage.html, the test coverage report.
  coverage: true

# A manual needs no taxonomies and no feeds. The sitemap stays.
disableKinds: [taxonomy, term, rss]

# Every page renders as HTML for people and as its source Markdown for
# agents and scripts, so the Markdown of / is /index.md. The theme
# writes the Markdown only when the site declares this format
# (brand/theme.md).
outputFormats:
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests in deploy/ as raw YAML at
# /deploy/<file>.yaml, so `kubectl apply -f` or a Kustomization's
# `resources` can install from the URL without a clone. The mount
# publishes the files of the same commit, not a copy.
#
# Declaring any mount replaces Hugo's default mounts, so the content
# mount is declared again. The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
