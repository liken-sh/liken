[package]
name = "idle-screen"
version = "0.1.0"
edition = "2024"

# The library lets unit tests cover the parsers and the measurements
# without opening a window.
[lib]
name = "idle_screen"
path = "src/lib.rs"

[[bin]]
name = "idle-screen"
path = "src/main.rs"

# The `measure` feature adds the `--capture`, `--capture-at`, and `--stats`
# flags and the PNG encoder that frame capture uses. It is on by default, so
# a workstation build and every check in the Makefile include it. The image
# builds without it, because the operator sets no command on the idle
# container and the image's entrypoint passes no flags.
[features]
default = ["measure"]
measure = ["dep:image"]

# The client depends on the iced crates directly instead of the `iced`
# facade, because it runs its own winit event loop and the harness reads
# frames back from the wgpu surface.
#
# The client runs only under a Wayland compositor, so the iced crates turn
# off the default features that add X11 and the software renderer.
[dependencies]
# harness/respawn.rs calls sigaction and kill to forward the kubelet's stop
# signal to the client, which it runs as a child process.
libc = "=0.2.191"
iced_winit = { version = "=0.14.1", default-features = false, features = [
    "wayland",
] }
# The brand's colors are encoded sRGB, and the translucent surfaces were
# tuned with blending on those values. Without `web-colors`, `iced_wgpu`
# converts colors to linear light before the shader blends them, and the
# surfaces look different. harness/graphics.rs picks a surface format that
# stores the colors unconverted.
iced_wgpu = { version = "=0.14.0", features = [
    "geometry",
    "image",
    "web-colors",
] }
iced_widget = { version = "=0.14.2", default-features = false, features = [
    "canvas",
    "image",
    "wgpu",
] }
# liken-iced parses the mark and the palette out of brand/'s liken.svg and
# liken.css, so this screen and the web pages look the same. The image build
# copies brand/ to /brand, so this path also resolves in the image.
liken-iced = { path = "../../brand/iced" }
# image writes the captured frames as PNG, so only the `measure` feature
# needs it. iced_graphics already depends on this crate with no formats, and
# this line adds `png`.
image = { version = "=0.25.10", default-features = false, features = [
    "png",
], optional = true }
# media-screen subscribes to a Player's topics on the bus, decides what the
# screen shows, and publishes the screen's requests. It is a separate
# component because library-operator's media browser uses it too.
media-screen = { path = "../../media-screen" }
serde = { workspace = true }
# serde_json writes the `--stats` file.
serde_json = { workspace = true }
# jiff reads the time zone that TZ names from /usr/share/zoneinfo in the
# image, so the binary bundles no time zone database.
jiff = { version = "=0.2.38", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
metrics = { workspace = true }
# Only the HTTP listener is enabled, because the client serves `/metrics`
# and pushes to no gateway.
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false, features = [
    "http-listener",
] }
# metrics-process writes the `process_*` metrics. The exporter runs no hook
# on a scrape, so a thread in metrics.rs calls `collect` on an interval.
metrics-process = "=2.4.3"

[dev-dependencies]
metrics-util = { version = "=0.20.4", default-features = false, features = ["debugging"] }
