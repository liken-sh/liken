[package]
name = "media-display"
version = "0.1.0"
edition = "2024"

# The library lets unit tests cover the theme, the canvas, the fade, and the
# IPC framing without opening a window.
[lib]
name = "media_display"
path = "src/lib.rs"

[[bin]]
name = "media-display"
path = "src/main.rs"

# The display uses the `iced` facade, unlike the idle screen, because it
# captures no frames and runs no winit event loop of its own. It runs only
# under a Wayland compositor, so iced builds with no X11 and no software
# renderer.
#
# The theme's colors are encoded sRGB, and the translucent surfaces were
# tuned with blending on those values. Without `web-colors`, `iced_wgpu`
# converts colors to linear light before the shader blends them, and the
# surfaces look lighter or darker.
#
# `crisp` makes iced snap the widgets it lays out to whole output pixels, as
# `Canvas::snap` does for the positions that the display computes.
[dependencies]
# `advanced` exposes iced's text shaper, which the display uses to measure
# the width of text.
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "wgpu",
    "wayland",
    "canvas",
    "image-without-codecs",
    "tokio",
    "web-colors",
    "crisp",
] }
# liken-iced gives the brand's fonts and the palette, which it parses out of
# brand/'s liken.css, so this screen and the web pages use the same colors.
# The image build copies brand/ to /brand, so this path also resolves in the
# image.
liken-iced = { path = "../../brand/iced" }
# jiff reads the time zone that TZ names from /usr/share/zoneinfo in the
# image, so the binary bundles no time zone database.
jiff = { version = "=1.0.2", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
# image decodes the logo, the cover, and the trickplay sheets, which are PNG
# or JPEG. library-operator's media browser decodes them with the same crate.
image = { version = "=0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
# lofty reads the picture in a music file's tags. The display uses it when
# the item's `presentation.art` gives no cover, before it looks for a cover file
# in the track's folder.
lofty = "=0.25.5"
# media-screen names a track's language, the role of a subtitle track, and
# a track's format, so a track reads the same on the media browser's page
# and in the display's track panel. The image build copies media-screen to
# /media-screen, so this path also resolves in the image. The display calls
# none of the crate's bus code, so it starts no MQTT connection.
media-screen = { path = "../../media-screen" }
serde_json = { workspace = true }
# The display binds the compositor's liken_arrangement_v1 protocol on winit's
# Wayland connection, because the compositor identifies a client by its
# connection. wayland-backend wraps winit's wl_display, wayland-client gives
# the binding its own event queue, and wayland-scanner generates the client
# code from the protocol's XML. winit already links these versions.
wayland-backend = { version = "=0.3.17", features = ["client_system"] }
wayland-client = "=0.31.15"
wayland-scanner = "=0.31.11"
# tokio runs the connection to mpv's JSON IPC socket, which the display dials
# again when it closes.
tokio = { version = "=1.54.1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
# ureq fetches a picture, such as a logo or a cover, that a Play gives as an
# https URL.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
# tiny-skia draws each antialiased shape into an image, and the frame draws
# the image. iced's own antialiasing multisamples a render target the size of
# the window for each layer that has a shape, and an image costs one texture
# read per pixel that it covers. winit already builds this version with these
# features.
tiny-skia = { version = "=0.11.4", default-features = false, features = [
    "std",
    "simd",
] }
