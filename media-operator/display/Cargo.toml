[package]
name = "media-display"
version = "0.1.0"
edition = "2024"

# The crate is a library with one binary over it, so the theme, the
# canvas, the fade, and the IPC framing have unit tests that open no
# window.
[lib]
name = "media_display"
path = "src/lib.rs"

[[bin]]
name = "media-display"
path = "src/main.rs"

# The iced facade, not the pieces the idle screen takes, because this
# display needs no frame capture and drives no winit loop of its own.
#
# Every version is exact, so a build from this manifest resolves the
# crates the lock file names.
#
# The target is a Wayland kiosk, so the toolkit builds with Wayland alone
# and neither X11 nor the software renderer enters the build.
#
# Without `web-colors` `iced_wgpu` converts every colour to linear light
# before the shader sees it, and the blend runs in linear light.
# The theme states every color and alpha as encoded sRGB, and every
# scrim, dim, and panel was judged by eye against a blend on those
# values. A blend in linear light reads every translucent surface
# lighter or darker than the value the theme names, so the colors reach
# the shader as they were written.
#
# crisp is on because the display snaps every value that moves with the
# position to a whole output pixel, and this feature makes the toolkit do
# the same for what it lays out.
[dependencies]
# advanced is on because the display measures a run of text through the
# toolkit's own shaper, which the facade keeps behind that feature.
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "wgpu",
    "wayland",
    "canvas",
    "image-without-codecs",
    "tokio",
    "web-colors",
    "crisp",
] }
# liken-iced carries the palette and the brand's two faces. It parses the
# palette out of liken.css, so a colour on this screen and a colour on a
# page are one value and cannot drift. The crate is in the brand
# repository, which this one already takes as a submodule for the
# documentation theme, and the image build context is the repository
# root, so one checkout serves both.
liken-iced = { path = "../docs/themes/brand/iced" }
# jiff reads the wall clock in the zone TZ names. Its tzdb-zoneinfo feature
# reads the image's own /usr/share/zoneinfo, and the bundled databases stay
# out of the binary, so the clock and the rest of the image name the same
# zone rules.
jiff = { version = "=0.2.35", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
] }
# image decodes the logo, the cover, and the trickplay sheets, which are
# PNG and JPEG on the volumes, so no other decoder builds. The library's
# browser decodes the same two formats with the same crate, so a picture
# reads the same on both screens.
image = { version = "=0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
# lofty reads the picture inside a music file's tags, which is the cover
# tier between the block's own reference and a cover file beside the
# track. It reads the ID3, MP4, FLAC, Vorbis, and APE families.
lofty = "=0.25.2"
serde_json = { workspace = true }
# The display needs tokio for one unix socket, newline-delimited JSON, and
# a reconnect loop with a timeout on every wait.
tokio = { version = "=1.48.0", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
# ureq fetches an https logo. The library's browser reads its own streams
# with the same crate; this one turns tls on, because a logo the Play
# names is a URL on the internet, and leaves the rest of the defaults off.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
