# The Go coverage gate, which `make test-go` checks locally and in CI.
#
# Each threshold is set just under the coverage that the tests measure,
# so a change that loses coverage fails the gate. When a change gains
# coverage, raise the threshold to keep the gain. Do not lower one.

profile: coverage.out

threshold:
  total: 88

override:
  # mpv's EDL format: parsing and timeline arithmetic, with no I/O.
  - path: ^edl$
    threshold: 93
  # A developer tool that prints a timeline on a workstation. No image
  # ships it.
  - path: ^local/edl$
    threshold: 8
  - path: ^local/present$
    threshold: 86
