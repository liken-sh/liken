# Every push to main and every pull request runs the tests. Nothing
# here releases: a release is a pushed tag, and release.yaml owns
# that. Because of the split, docs and intermediate work land on
# main freely, and every image in the registry traces to a tag
# somebody chose to push.
#
# There is no path filter. The tests are cheap, and a filter would
# have to decide which files can never break a build. That list is
# wrong the day someone adds a file it does not name, and the push
# that adds it would then land untested.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race ./...

      # The coverage gate measures on its own run, on a pinned
      # toolchain. Go 1.27 splits a basic block into one profile row
      # per run of code inside it, and repeats the whole block's
      # statement count on every row. Every reader sums those rows,
      # `go tool cover` included, so a block counts once more for
      # each comment that interrupts it. Go 1.26 counts each block
      # once, which is what .testcoverage.yml's thresholds were set
      # against. Move this pin to the newest toolchain that counts
      # each block once.
      #
      # go-test-coverage is a pinned tool dependency (the `tool`
      # directive in go.mod), so the gate needs nothing installed
      # beyond the Go toolchain.
      - run: go test -coverprofile=coverage.out ./...
        env:
          GOTOOLCHAIN: go1.26.7
      - run: go tool go-test-coverage --config=.testcoverage.yml
        env:
          GOTOOLCHAIN: go1.26.7
