# Every pull request and every push to main runs the full gate: the
# tests, the coverage floors, the docs checks, and a build of every
# image. A push to main then publishes the website. A pull request
# publishes nothing and pushes nothing. On main, release.yaml runs
# beside this workflow and publishes a development build.
# release.yaml runs a plain go test of its own as a guard before it
# pushes images, but the coverage floors and the other checks live
# only here, so a commit on main gets the same verdict a pull request
# would.
#
# There is no path filter. The tests are cheap, and a filter would
# have to decide which files can never break a build. That list is
# wrong the day someone adds a file it does not name, and the push
# that adds it would then land untested.
#
# The four test jobs are independent, so they run at once, and the
# gate takes as long as its slowest job. The publish job waits for
# all four, so a red gate never reaches the site.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch republishes the current main with no change, for the
  # times the serving side needs a fresh deployment.
  workflow_dispatch:

permissions:
  contents: read
  # The image builds read their layer cache from ghcr. No run of this
  # workflow writes an image or the cache, so read is enough. The
  # publish job takes the two permissions Pages needs itself, so no
  # test job holds them.
  packages: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-go keeps the module downloads and the build cache
      # between runs, keyed on go.sum, so a run compiles only what
      # changed.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The same target a workstation runs: gofmt, vet, the race
      # tests, and the coverage gate on its pinned toolchain. The
      # Makefile says why the gate pins a toolchain, and
      # .testcoverage.yml holds the floors.
      - run: make test-go

      # The profile the gate measured, for the publish job to draw
      # the report from. The report says what the gate measured on
      # this commit, so it takes the gate's own file and never
      # measures again. The publish job runs minutes later, so the
      # artifact needs no long life.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and Hugo is a tool
      # directive in it, so the Go toolchain is the only build
      # dependency and this file pins its version too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      # The same target a workstation runs: the link check, then
      # the site build.
      - run: make test-docs

  rust:
    # The headless tests run under cage, and the cage in Ubuntu 24.04
    # (0.1.5) dies on an assertion when wlr-randr changes the output
    # mode. Ubuntu 26.04 carries 0.2.1, which takes the change, and it
    # is the release the workstations run.
    runs-on: ubuntu-26.04
    env:
      # Incremental artifacts are large, and a fresh runner never
      # reuses them. Without this they would fill the cache and gain
      # nothing.
      CARGO_INCREMENTAL: 0
      # cage renders with pixman, so the compositor needs no GPU on
      # the runner.
      WLR_RENDERER: pixman
    steps:
      # The idle screen builds against liken-iced, the crate in the
      # brand repository that carries the mark and the palette. It
      # arrives with the documentation theme's submodule at
      # docs/themes/brand, and a checkout without it resolves no
      # dependency.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The idle screen's tests open a real window. cage is the
      # compositor, wlr-randr sets the headless mode, and
      # mesa-vulkan-drivers carries lavapipe, the software Vulkan
      # device a runner with no GPU draws through.
      - name: install the headless graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cage wlr-randr mesa-vulkan-drivers libvulkan1 \
            libwayland-client0 libxkbcommon0

      # rust-toolchain.toml at the repository root names the version
      # and the components. rustup installs what the file names, so
      # this workflow pins no version of its own.
      - name: install the toolchain
        run: rustup show

      # The cache holds the cargo registry and target/, keyed on
      # Cargo.lock. The two crates are one workspace at the repository
      # root, so one entry covers both. Almost all of the build is
      # dependencies, and they change only when the lock file changes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-on-failure: true

      # cargo-llvm-cov is a binary. The action fetches its release
      # build instead of compiling one, and it runs after rust-cache,
      # which prunes binaries it did not see before it saved.
      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      # The same target a workstation runs: the format, the lints,
      # and the tests under the coverage gates. idle/Makefile holds
      # the two floors.
      - run: make test-rust

      # One Cobertura file per crate, written beside each gate, for
      # the publish job to draw the report from. Both go under one
      # artifact name, and the publish job takes the pair as it is.
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-rust
          path: |
            coverage-media-screen.xml
            coverage-idle-screen.xml
          if-no-files-found: error
          retention-days: 7

  # Every image builds on every run, and none is pushed, so
  # a Dockerfile that stopped building fails here and not on main.
  #
  # The layer cache lives in ghcr, as a :buildcache tag beside each
  # image, not in the GitHub Actions cache. A registry cache has no
  # 10 GB ceiling, and it outlives a branch. release.yaml writes it
  # on every push to main and every tag, and this workflow only reads
  # it, so a pull request's builds start from the layers the last
  # build on main left.
  images:
    runs-on: ubuntu-latest
    # One job per image, so the four build at once and the run is as
    # long as the slowest of them, not their sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: media-operator
            file: Dockerfile
          - image: media-operator-player
            file: Dockerfile.player
          - image: media-operator-idle
            file: Dockerfile.idle
          - image: media-operator-sidecar
            file: Dockerfile.sidecar
    steps:
      # The idle image compiles liken-iced out of the brand submodule
      # at docs/themes/brand, so the context needs it checked out.
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache

  # The website deploy. A push to main is a publish: the job draws the
  # coverage report from what the test jobs measured, builds the site,
  # and deploys the tree to GitHub Pages, which serves it at
  # media.liken.sh. A pull request does not run this job at all. The
  # docs job proves the site builds on every pull request, and its
  # link check resolves every internal link, so a broken deep link
  # never publishes.
  #
  # Every push to main republishes. There is no path filter, because
  # the site carries the coverage report, and a change to any code the
  # tests reach moves a page. deploy/ is a source of the site as well
  # as of the cluster: a module mount in docs/hugo.yaml serves the
  # manifests as raw YAML under /deploy/.
  #
  # Pages fits this site because the site is a tree of files, built
  # ahead of time, and nothing of the operator's has to run to serve
  # it. The Pages configuration, workflow-sourced deploys under the
  # media.liken.sh custom domain, is in the repository's settings, set
  # once by hand, the same class of one-time act as creating the DNS
  # record that points the name at Pages.
  #
  # Publishing needs two permissions this job takes and no other job
  # holds. pages: write creates the deployment, and id-token: write
  # lets deploy-pages prove to the Pages service that the artifact
  # came from this exact workflow run. Nothing else can push content
  # under this site's name.
  publish:
    if: github.event_name != 'pull_request'
    needs: [go, docs, rust, images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys run one at a time: two pushes in quick succession would
    # otherwise race their deployments, and the served-site check
    # below needs nothing else to change while it runs.
    concurrency:
      group: docs
    steps:
      # The theme is the brand repository, a submodule at
      # docs/themes/brand. A checkout without it builds a site with
      # no shell, no nav, and no stylesheet.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The docs domain is its own Go module, and both Hugo and the
      # coverage tool are tool directives in it, so the Go toolchain
      # is the only build dependency and this file pins its version
      # too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: docs/go.mod

      # The coverage data the test jobs measured on this commit. The
      # files land at the repository root, where the report target
      # looks for them.
      - name: take the coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .

      # The same target a workstation runs after `make test`. It
      # writes one page, coverage.html, at the repository root.
      - name: draw the coverage report
        run: make coverage-report

      # The same command a workstation runs, so local and CI builds
      # produce the same tree. What this step writes to
      # docs/dist/site/ is byte for byte what Pages serves.
      - name: build the site
        run: make build
        working-directory: docs

      # The report joins the built tree, so the site serves it at
      # /coverage.html, which is where the theme's footer links.
      - name: publish the coverage report
        run: cp coverage.html docs/dist/site/coverage.html

      # The commit lands in the built tree as release.txt, so the
      # served-site check below can ask the public name which commit
      # it serves. The file joins the tree after the build, because
      # it describes the deploy, not the site.
      - name: stamp the commit
        run: echo "${{ github.sha }}" > docs/dist/site/release.txt

      - name: package the site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/site

      - name: deploy to Pages
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt holds the commit, and the other checks
      # cover the two forms every page takes and the coverage report.
      - name: verify the served site
        run: |
          # A finished deployment does not mean the public name
          # follows yet. A CDN in front of Pages caches pages for up
          # to ten minutes, so the old tree can answer for a while
          # after the new one is live at the origin. curl's
          # --retry only covers transport errors, never stale
          # content, so the freshness check needs its own deadline
          # loop before the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://media.liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://media.liken.sh/ \
            | grep -q "routing and control of media playback"
          echo "checking the markdown twin"
          fetch --head https://media.liken.sh/index.md \
            | grep -qi "content-type: text/markdown"
          # The coverage report is close to a megabyte, and its title
          # is in the first lines. A `grep -q` on a pipe would exit
          # there, curl would then fail on the closed pipe and retry
          # the write error, and the step would fail on a page that
          # served correctly. So the page goes to a file first.
          echo "checking the coverage report"
          fetch https://media.liken.sh/coverage.html > served-coverage.html
          grep -q "<title>media-operator</title>" served-coverage.html
