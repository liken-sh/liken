# A pushed tag cuts a release. This workflow runs the tests, builds
# the operator image and the player image, proves the player image
# can run mpv, and pushes both to ghcr.io under the tag's name and
# :latest. A push to main releases nothing: ci.yaml tests it and
# stops. The tag is the release act, as in the main liken repository,
# so main takes docs and intermediate work freely and every image in
# the registry traces to a version somebody chose to name.
#
# The version is the tag, in liken's own scheme: 2026.08.20-001. The
# release cadences of the operators do not couple, and reading one
# version beside another still tells you when each one was cut.
#
# The two images release together, always. The operator stamps the
# player image into every playback pod, and a pair that could drift
# apart would put the report contract at two versions at once.
name: release

on:
  push:
    tags: ['*']

permissions:
  contents: read
  packages: write

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag names the version, so its shape is an input this
      # workflow must check before it spends anything on a build. A
      # tag of any other shape is a mistake. The run says so and
      # stops, before an image can ship under a name no machine can
      # order against the others.
      - name: Check the tag shape
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
            echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
            exit 1
          }
          echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The tests gate the build. ci.yaml already ran them on the
      # tagged commit when it landed on main. A tag can name any
      # commit, so the release proves the one it ships. An image that
      # reaches the registry has passed them. A rollback names an
      # older tag, and never has to find out which tag was good.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images build here and push nothing yet. The player gate
      # below has to pass first, and a push that happened first would
      # leave a broken :latest behind when the gate failed.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/liken-sh/media-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator:latest

      - name: Build the player image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.player
          load: true
          tags: |
            ghcr.io/liken-sh/media-operator-player:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator-player:latest

      # The gate on the player image. The runner has no GPU, no
      # Wayland, and no PipeWire, so nothing here plays; what can
      # break invisibly is the closure. mpv proves it can load its
      # libraries by printing its version, and the supervisor binary
      # must be present at the path the entrypoint names.
      - name: Prove the player image
        run: |
          set -eu
          image="ghcr.io/liken-sh/media-operator-player:$VERSION"
          docker run --rm --entrypoint /usr/bin/mpv "$image" --version
          container=$(docker create "$image")
          docker export "$container" | tar -t | grep -qx 'media-operator' \
            || { echo "the player image has no /media-operator"; exit 1; }
          docker rm "$container" > /dev/null

      - name: Push the images
        run: |
          docker push "ghcr.io/liken-sh/media-operator:$VERSION"
          docker push "ghcr.io/liken-sh/media-operator:latest"
          docker push "ghcr.io/liken-sh/media-operator-player:$VERSION"
          docker push "ghcr.io/liken-sh/media-operator-player:latest"
