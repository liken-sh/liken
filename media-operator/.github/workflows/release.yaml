# Every image this repository publishes goes through this workflow.
# A pushed tag cuts a release: the tag names a version in liken's
# calendar scheme, 2026.09.03-007, and the images ship under that
# tag and :latest. A push to main cuts a development build: the
# version is the most recent release tag plus a suffix,
# 2026.09.03-007-dev-003-abcdef01, where 003 counts the commits since
# that release and abcdef01 is this commit. The suffix sorts after
# its release and before the next one, so a registry listing reads
# in order. A development build never moves :latest, so a cluster
# that pulls a release keeps pulling releases.
#
# Both kinds run the tests first and build only when they pass. A
# development build that skipped the tests would put a broken image
# one pin away from a cluster.
#
# The release cadences of the operators do not couple, and reading one
# version beside another still tells you when each one was cut.
#
# The four images release together, always. The operator stamps the
# player image into every playback pod, the idle image into every idle
# pod, and the sidecar image into every sidecar container, and images
# that could drift apart would put the report contract and the screen
# topic at two versions at once.
name: release

on:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read
  packages: write

# One release at a time. Two runs that pushed :latest at once would
# leave whichever finished second, which is not always the newer one.
concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The idle image compiles liken-iced out of the brand submodule
      # at docs/themes/brand, and the documentation builds against the
      # theme in the same checkout.
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # The version comes from the event. A tag names it, and a tag of
      # any other shape stops the run before a build spends anything,
      # so no image ships under a name no machine can order against
      # the others. A push to main derives it: git describe finds the
      # most recent release tag and counts the commits since it, and
      # the first eight characters of the commit sha make the build
      # traceable. The checkout fetches the whole history, because
      # describe needs the tags.
      - name: Name the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$GITHUB_REF_NAME" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{3}$' || {
              echo "the tag '$GITHUB_REF_NAME' is not a release version; a release tag looks like 2026.08.20-001"
              exit 1
            }
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            described=$(git describe --tags --long --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9][0-9][0-9]')
            release=${described%-*-g*}
            count=${described#"$release"-}
            count=${count%-g*}
            echo "VERSION=$(printf '%s-dev-%03d-%s' "$release" "$count" "${GITHUB_SHA:0:8}")" >> "$GITHUB_ENV"
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi

      # A development build has no tag, so a kustomization that pins
      # its manifests needs the full commit sha: a git fetch by sha
      # wants all forty characters, and the eight in the version are
      # not enough. The run's summary prints the two lines to paste,
      # so a roll is a copy.
      - name: Write the roll lines
        run: |
          {
            echo '```yaml'
            echo "resources:"
            echo "  - https://github.com/$GITHUB_REPOSITORY//deploy?ref=$GITHUB_SHA"
            echo "images:"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY-player"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY-idle"
            echo "    newTag: $VERSION"
            echo "  - name: ghcr.io/$GITHUB_REPOSITORY-sidecar"
            echo "    newTag: $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The tests gate the build. A tag can name any commit, so the
      # release proves the one it ships. An image that reaches the
      # registry has passed them. A rollback names an older tag, and
      # never has to find out which tag was good.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every image builds here and pushes nothing yet. The player gate
      # below has to pass first, and a push that happened first would
      # leave a broken :latest behind when the gate failed.
      #
      # The builds read and write the :buildcache tags beside each
      # image. A tag's release of a commit whose development build
      # already ran here rebuilds nothing, and a pull request's builds
      # in ci.yaml read the same tags.
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/media-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/media-operator:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/media-operator:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator:latest

      - name: Build the player image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.player
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/media-operator-player:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/media-operator-player:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/media-operator-player:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator-player:latest

      - name: Build the idle image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.idle
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/media-operator-idle:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/media-operator-idle:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/media-operator-idle:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator-idle:latest

      - name: Build the sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sidecar
          load: true
          cache-from: type=registry,ref=ghcr.io/liken-sh/media-operator-sidecar:buildcache
          cache-to: type=registry,ref=ghcr.io/liken-sh/media-operator-sidecar:buildcache,mode=max
          tags: |
            ghcr.io/liken-sh/media-operator-sidecar:${{ env.VERSION }}
            ghcr.io/liken-sh/media-operator-sidecar:latest

      # The gate on the idle image, the same shape the player's gate
      # takes. The runner has no GPU and no compositor, so the client
      # cannot draw; what can break invisibly is the closure. The
      # binary prints its flags without opening a window, which proves
      # it loaded every library it links.
      - name: Prove the idle image
        run: |
          set -eu
          docker run --rm "ghcr.io/liken-sh/media-operator-idle:$VERSION" --help > /dev/null

      # The gate on the player image. The runner has no GPU, no
      # Wayland, and no PipeWire, so nothing here plays; what can
      # break invisibly is the closure. mpv proves it can load its
      # libraries by printing its version, and the supervisor binary
      # must be present at the path the entrypoint names.
      - name: Prove the player image
        run: |
          set -eu
          image="ghcr.io/liken-sh/media-operator-player:$VERSION"
          docker run --rm --entrypoint /usr/bin/mpv "$image" --version
          container=$(docker create "$image")
          docker export "$container" | tar -t | grep -qx 'media-operator' \
            || { echo "the player image has no /media-operator"; exit 1; }
          docker rm "$container" > /dev/null

      # :latest marks the newest release and nothing else. A
      # development build pushes its own tag only.
      - name: Push the images
        run: |
          docker push "ghcr.io/liken-sh/media-operator:$VERSION"
          docker push "ghcr.io/liken-sh/media-operator-player:$VERSION"
          docker push "ghcr.io/liken-sh/media-operator-idle:$VERSION"
          docker push "ghcr.io/liken-sh/media-operator-sidecar:$VERSION"
          if [ "$RELEASE" = true ]; then
            docker push "ghcr.io/liken-sh/media-operator:latest"
            docker push "ghcr.io/liken-sh/media-operator-player:latest"
            docker push "ghcr.io/liken-sh/media-operator-idle:latest"
            docker push "ghcr.io/liken-sh/media-operator-sidecar:latest"
          fi
