# The operator that plays media on a machine's screens and speakers.
[package]
name = "media-operator"
license = "MIT"

[depends]
components = ["brand", "ffmpeg", "kubernetes", "media-screen", "mpv", "vaapi", "vulkan"]

[docs]
prefix = "media"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]
# The tests that cut media run the real ffmpeg.
apt = ["ffmpeg"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The Rust workspace: the idle screen and the display.
# The screen tests run the programs under cage, a headless Wayland
# compositor, on Mesa's software Vulkan driver.
[[jobs]]
name = "rust"
toolchain = "rust"
run = "make test-rust"
timeout = 45
env = { CARGO_INCREMENTAL = "0", WLR_RENDERER = "pixman" }
apt = ["cage", "wlr-randr", "mesa-vulkan-drivers", "libvulkan1", "libwayland-client0", "libxkbcommon0"]
coverage = ["coverage-idle-screen.xml", "coverage-display.xml"]

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go and rust jobs run the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy", "cargo-fmt"]

[outputs]
deploy = "deploy"

# The sidecar image is the operator image under a second name. The
# operator image holds the program's pod build beside the operator's
# full build, and every sidecar runs the pod build in one of its modes.
# A repository that needs only the sidecar pins a name that promises
# nothing about the controller.
#
# Every image that builds from this module's go.mod takes the shared
# kubernetes module as a build context, because go.mod replaces it with
# ../kubernetes. The screen images build from the Rust workspace alone.
[[outputs.images]]
name = "media-operator"
file = "Dockerfile"
aliases = ["media-operator-sidecar"]
contexts = { kubernetes = "kubernetes" }

[[outputs.images]]
name = "media-operator-player"
file = "Dockerfile.player"
contexts = { brand = "brand", kubernetes = "kubernetes" }
smoke = "media-operator/smoke/media-operator-player.sh"

[[outputs.images]]
name = "media-operator-idle"
file = "Dockerfile.screen"
target = "idle"
contexts = { brand = "brand", media-screen = "media-screen" }
smoke = "media-operator/smoke/media-operator-idle.sh"

[[outputs.images]]
name = "media-operator-display"
file = "Dockerfile.screen"
target = "display"
contexts = { brand = "brand", media-screen = "media-screen" }
smoke = "media-operator/smoke/media-operator-display.sh"

[[outputs.images]]
name = "media-operator-api"
file = "Dockerfile.api"
contexts = { kubernetes = "kubernetes" }
smoke = "media-operator/smoke/media-operator-api.sh"

# The capabilities agent's image builds on the vaapi base, because its
# query loads libva and the media driver, and only from the
# capabilities package of this module.
[[outputs.images]]
name = "media-operator-capabilities"
file = "Dockerfile.capabilities"
contexts = { kubernetes = "kubernetes" }
smoke = "media-operator/smoke/media-operator-capabilities.sh"

# The CLI image carries the same version as the operator, so the base
# binary pulls a CLI that never drifts from the operator it faces. It is
# built for linux/amd64 only.
[[outputs.images]]
name = "media-operator-cli"
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes" }
