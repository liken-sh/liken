# The operator that plays media on a machine's screens and speakers.
[package]
name = "media-operator"
license = "MIT"

[depends]
components = ["brand", "ffmpeg", "kubernetes", "media-screen", "mpv", "notices", "toolchains", "trust", "vaapi", "vulkan"]

[docs]
prefix = "media"

# Runs gofmt, vet, a go.mod tidy check, and the tests with the race
# detector. The coverage gate reads coverage.out, and .testcoverage.yml
# sets the minimum.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]
# Some tests run the real ffmpeg.
apt = ["ffmpeg"]

# Checks links, checks the generated skills, and builds the site.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# Tests the idle screen and the display. The tests run each program
# under cage, a Wayland compositor, on its headless backend with Mesa's
# software Vulkan driver.
[[jobs]]
name = "rust"
toolchain = "rust"
run = "make test-rust"
timeout = 45
env = { CARGO_INCREMENTAL = "0", WLR_RENDERER = "pixman" }
apt = ["cage", "wlr-randr", "mesa-vulkan-drivers", "libvulkan1", "libwayland-client0", "libxkbcommon0"]
coverage = ["coverage-idle-screen.xml", "coverage-display.xml"]

# Runs the formatters, linters, and file checks in
# .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go and rust jobs already run these hooks' checks.
skip = ["gofmt", "go-vet", "go-mod-tidy", "cargo-fmt"]

[outputs]
deploy = "deploy"

# The operator image also ships /media-operator-pod, the program built
# with the `pod` tag, which every sidecar container runs.
# media-operator-sidecar is a second name for the same image, so a
# repository that runs only the sidecars can pin an image whose name
# does not suggest the controller.
#
# Every image built from this module's go.mod takes the kubernetes
# module as a build context, because go.mod replaces it with
# ../kubernetes. The screen images build from the Rust workspace alone.
#
# The player and screen images install a fallback font from the Debian
# snapshot that the base images use. So they take the vulkan directory,
# which has snapshot.sh, as the build context `builder`, and vulkan's
# version as the snapshot date. The screen images also take toolchains
# as a build context, for the cargo-auditable that
# toolchains/cargo-auditable/fetch.sh pins.
[[outputs.images]]
name = "media-operator"
description = "media-operator, and the pod build of the same program that each sidecar runs."
file = "Dockerfile"
aliases = ["media-operator-sidecar"]
contexts = { kubernetes = "kubernetes", notices = "notices" }

[[outputs.images]]
name = "media-operator-player"
description = "mpv, the brand's fonts, and media-operator's player shim, for the pod that plays a film on a Player's screen."
file = "Dockerfile.player"
contexts = { brand = "brand", builder = "vulkan", kubernetes = "kubernetes", notices = "notices" }
versions = { SNAPSHOT = "vulkan" }
smoke = "media-operator/smoke/media-operator-player.sh"

[[outputs.images]]
name = "media-operator-idle"
description = "The idle screen that a Player shows while nothing plays, on the vulkan image."
file = "Dockerfile.screen"
target = "idle"
contexts = { brand = "brand", builder = "vulkan", media-screen = "media-screen", notices = "notices", toolchains = "toolchains" }
versions = { SNAPSHOT = "vulkan" }
smoke = "media-operator/smoke/media-operator-idle.sh"

[[outputs.images]]
name = "media-operator-display"
description = "The display that media-operator draws over a playing film, with the scrubber, the clock, the track panels, and what plays next, on the vulkan image."
file = "Dockerfile.screen"
target = "display"
contexts = { brand = "brand", builder = "vulkan", media-screen = "media-screen", notices = "notices", toolchains = "toolchains" }
versions = { SNAPSHOT = "vulkan" }
smoke = "media-operator/smoke/media-operator-display.sh"

[[outputs.images]]
name = "media-operator-api"
description = "media-operator's HTTP API on the ffmpeg image, which captures a Player's screen and sound."
file = "Dockerfile.api"
contexts = { kubernetes = "kubernetes", notices = "notices" }
smoke = "media-operator/smoke/media-operator-api.sh"

# The capabilities agent builds on the vaapi base because it loads
# libva and the media driver.
[[outputs.images]]
name = "media-operator-capabilities"
description = "The agent that asks each render node's driver through libva what it decodes, encodes, and scales, on the vaapi image."
file = "Dockerfile.capabilities"
contexts = { kubernetes = "kubernetes", notices = "notices" }
smoke = "media-operator/smoke/media-operator-capabilities.sh"

# The CLI image has the same version as the operator, so the liken
# toolkit pulls a CLI that matches the operator. It is built for
# linux/amd64 only.
[[outputs.images]]
name = "media-operator-cli"
description = "kubectl-liken-media, the kubectl plugin that the liken toolkit pulls from this image."
file = "Dockerfile.cli"
contexts = { kubernetes = "kubernetes", notices = "notices" }
