# Kind knowledge that `transect` reads for the `Player` and the `Remote`
# of `media-operator`.  A `Player` references a `Display`, a `Sink`, a
# `Receiver`, a `Remote`, and a `ResourceClaim`, and the address of the
# message bus that its idle screen uses.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: players.media.liken.sh
spec:
  summary: A screen and the speakers beside it that play media.
  healthy: {condition: Screen}
  references:
    - {path: "spec.remotes[].name", kind: Remote, group: media.liken.sh, label: controlled by}
    - {path: status.screen.monitor, kind: Display, group: display.liken.sh, label: shows on}
    - {path: status.receiver.name, kind: Receiver, group: equipment.liken.sh, label: plays through}
    - {path: spec.idle.controller, label: idle screen from}
    - {path: "status.sinks[].name", kind: Sink, group: audio.liken.sh, label: sound through}
    - {path: status.idle.bus.address, address: true, edge: depends on, label: talks over}
    - {path: status.screen.node, kind: Node, edge: runs on}
    - {path: status.idle.claim, kind: ResourceClaim, group: resource.k8s.io, edge: holds}
  # An elevation is a sketch that `transect` draws on the page of a
  # `Player` in place of the ring of boxes.  Each row of the sketch is a
  # row of the drawing, and each name is a role that takes the cells it
  # fills.  This one is a home theater seen from the couch: the screen
  # on top, the speaker, the receiver, and the remote under it, and the
  # machine and the things a viewer does not see in a row at the bottom.
  # The things a viewer does not see have the shape `tag`, a low outline
  # that is quieter than the shapes of the room.  A role draws the
  # objects that its `reference` reads, in its `shape`, with the printer
  # columns in `reads` as readings.  A role's `shows` names printer
  # columns of the `Player` itself, and an entry that is a list draws
  # the first of its columns that has a value.  So the screen shows the
  # `Player`'s activity, and the play when one plays or the idle screen
  # when none does.  An `expected` role is drawn with a dashed outline
  # when the `Player` names nothing for it, and a role that is not
  # expected leaves its cells blank.
  elevations:
    - name: the room
      question: What is this player made of?
      sketch: |
        display  display   display   display
        sound    receiver  receiver  remote
        machine  idle      bus       claim
      roles:
        display:  {reference: status.screen.monitor, shape: screen, expected: true, reads: [Connector, Mode], shows: [Activity, [Play, Idle]]}
        receiver: {reference: status.receiver.name, shape: box, expected: true, reads: [Model, Power, Input, Volume, Sound]}
        sound:    {reference: "status.sinks[].name", shape: speaker, expected: true, reads: [Layout, Volume, Mute]}
        machine:  {reference: status.screen.node, shape: box, expected: true}
        remote:   {reference: "spec.remotes[].name", shape: handheld, expected: true, reads: [Keymap]}
        idle:     {reference: spec.idle.controller, shape: tag}
        bus:      {reference: status.idle.bus.address, shape: tag}
        claim:    {reference: status.idle.claim, shape: tag}
  # media-operator writes the Player's status under the field manager
  # Go-http-client, which matches no workload, so the controller is
  # found by its image.
  controller: {image: liken-sh/media-operator}
  docs: media:declare-a-player
---
# A Remote runs no pods, so the map draws no box for it.  This
# knowledge makes it a known kind, so each namespace shows a count of
# its Remotes.  status.player is not a reference, because the Player
# already references the Remote and a reference back would draw a loop.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: remotes.media.liken.sh
spec:
  summary: A paired controller whose buttons drive one Player.
  references:
    - {path: spec.keymap, kind: Keymap, group: media.liken.sh, label: maps buttons with}
    - {path: status.peripheral, kind: Peripheral, group: bluetooth.liken.sh, label: pairs as}
  controller: {image: liken-sh/media-operator}
  docs: media:mapping-a-controller
