# Kind knowledge that `transect` reads for the `Player` and the `Remote`
# of `media-operator`.  A `Player` references a `Display`, a `Sink`, a
# `Receiver`, a `Remote`, and a `ResourceClaim`, and the address of the
# message bus that its idle screen uses.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: players.media.liken.sh
spec:
  summary: A screen and the speakers beside it that play media.
  healthy: {condition: Screen}
  references:
    - {path: "spec.remotes[].name", kind: Remote, group: media.liken.sh, label: controlled by}
    - {path: status.screen.monitor, kind: Display, group: display.liken.sh, label: shows on}
    - {path: status.receiver.name, kind: Receiver, group: equipment.liken.sh, label: plays through}
    - {path: spec.idle.controller, label: idle screen from}
    - {path: "status.sinks[].name", kind: Sink, group: audio.liken.sh, label: sound through}
    - {path: status.idle.bus.address, address: true, edge: depends on, label: talks over}
    - {path: status.screen.node, kind: Node, edge: runs on}
    - {path: status.idle.claim, kind: ResourceClaim, group: resource.k8s.io, edge: holds}
  # Each role is one place in the drawings of a `Player`, filled by
  # the objects that its `reference` reads, with the printer columns in
  # `reads` as readings.  A reading that is a map reads a column of the
  # object at the end of a reference of the part's kind, so the remote
  # shows the battery of its `Peripheral`.
  # A role's `shows` names printer columns of the `Player` itself, and
  # an entry that is a list draws the first of its columns that has a
  # value.  So the screen shows the `Player`'s activity, and the play
  # when one plays or the idle screen when none does.  An `expected`
  # role is drawn with a dashed outline when the `Player` names nothing
  # for it, and a role that is not expected leaves its cells blank.
  # The receiver is not expected, because a `Player` with no
  # `status.receiver` plays directly to its panel, as the `Player` CRD
  # describes it.
  #
  # The operator that owns a kind states the shape that every sketch
  # draws its objects in, so the display, the receiver, and the remote
  # state no shape.  A `Display` is a `screen`, a `Receiver` is
  # `equipment-operator`'s `amplifier`, and a `Remote` is a `handheld`,
  # and `transect`'s page `/shapes` draws each one.  A role states a
  # shape to draw its parts otherwise.  The knowledge of a `Sink` and of
  # a `Node` states no shape, so each is drawn as a `box`, the shape of
  # a part whose kind states none.  A viewer does not see the idle
  # screen's controller, the message bus, or the `ResourceClaim`, so
  # they have the shape `tag`, a low outline that is quieter than the
  # shapes of the room.
  roles:
    display:  {reference: status.screen.monitor, expected: true, reads: [Connector, Mode], shows: [Activity, [Play, Idle]]}
    receiver: {reference: status.receiver.name, reads: [Model, Power, Input, Volume, Sound]}
    sink:     {reference: "status.sinks[].name", expected: true, reads: [Layout, Volume, Mute]}
    machine:  {reference: status.screen.node, expected: true}
    remote:   {reference: "spec.remotes[].name", expected: true, reads: [Keymap, {column: Battery, through: status.peripheral}]}
    idle:     {reference: spec.idle.controller, shape: tag}
    bus:      {reference: status.idle.bus.address, shape: tag}
    claim:    {reference: status.idle.claim, shape: tag}
  # Each elevation answers one question with a sketch of the roles,
  # and the page of a `Player` has a tab for each.  Each row of a sketch
  # is a row of the drawing, and each name takes the cells it fills.
  # The room is a home theater seen from the couch: the screen on top,
  # the sink, the receiver, and the remote under it, and the machine
  # and the things a viewer does not see in the last row.
  #
  # The signal path is the one HDMI cable from the machine's output to
  # the panel.  The `Sink` is the machine's sound output onto that
  # cable, so its wire ends at the machine, and the `Display` is the
  # picture on it.  The cable carries picture and sound through the
  # receiver when the `Player` names one, so its wire has `via`: with a
  # receiver the page draws the cable into the receiver and out to the
  # screen, and without one it draws the cable straight to the screen.
  elevations:
    - name: the room
      question: What is this player made of?
      sketch: |
        .        .        display  display  display   display   remote  .
        .        .        sink     sink     receiver  receiver  .       .
        machine  machine  idle     idle     bus       bus       claim   claim
    - name: the signal path
      question: Where do picture and sound go?
      sketch: |
        sink  machine  receiver  display  display
      wires:
        - {from: sink, to: machine, carries: sound}
        - {from: machine, to: display, via: receiver, carries: picture and sound}
  # media-operator writes the Player's status under the field manager
  # Go-http-client, which matches no workload, so the controller is
  # found by its image.
  controller: {image: liken-sh/media-operator}
  docs: media:declare-a-player
---
# A Remote runs no pods, so the map draws no box for it.  This
# knowledge makes it a known kind, so each namespace shows a count of
# its Remotes.  status.player is not a reference, because the Player
# already references the Remote and a reference back would draw a loop.
# A Remote has no condition of its own, and the Peripheral that pairs
# as it says whether it is connected or asleep, so a Remote is as
# healthy as its Peripheral, by the Peripheral's own knowledge.  Every
# sketch of transect draws a Remote as the library's handheld.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: remotes.media.liken.sh
spec:
  summary: A paired controller whose buttons drive one Player.
  healthy: {through: status.peripheral}
  shape: handheld
  references:
    - {path: spec.keymap, kind: Keymap, group: media.liken.sh, label: maps buttons with}
    - {path: status.peripheral, kind: Peripheral, group: bluetooth.liken.sh, label: pairs as}
  controller: {image: liken-sh/media-operator}
  docs: media:mapping-a-controller
