# The operator is a Deployment, not a DaemonSet like the hardware
# operators, because it manages no node's hardware. It creates claims and
# pods, and the scheduler places each playback pod on a node that has the
# claimed devices. The pods it creates have no API credentials, so they
# send their reports over the bus, and the operator writes them to the
# API server. The operator keeps no state on disk.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-operator
  labels:
    # The base kubectl-liken command finds this Deployment by the label
    # and pulls media-operator-cli at the same version as its image.
    cli.liken.sh/plugin: media
spec:
  # Two replicas also work: the Lease in leader.go lets one copy act, and
  # the other takes over when the first stops.
  replicas: 1
  selector:
    matchLabels:
      app: media-operator
  # A rollout starts the new pod before it stops the old one, so the new
  # pod pulls its image while the old pod still holds the Lease. When the
  # old pod releases the Lease, the new pod takes it on its next try,
  # which client-go makes every 5 to 11 s.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: media-operator
    spec:
      serviceAccountName: media-operator
      # On SIGTERM the operator finishes its current pass and then takes
      # up to 26 s to release the Lease: 5 s to end the bus session, 5 s
      # to send the last Events, and 16 s in kubernetes/election. The
      # default grace period of 30 s would leave the pass 4 s, and each
      # write of a pass can take up to 15 s. When the kubelet kills the
      # operator before it releases the Lease, a waiting copy takes the
      # Lease only after it expires, 30 s after the last renewal.
      terminationGracePeriodSeconds: 60
      containers:
        - name: operator
          image: ghcr.io/liken-sh/media-operator:latest
          env:
            # The operator reads its own pod to find its image, and
            # derives each companion image from it at the same tag. The
            # Lease is in POD_NAMESPACE, and POD_NAME is in its holder's
            # identity. The operator exits when either is unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The bus Service from bus.yaml. The operator passes the
            # address to each pod it creates.
            - name: MEDIA_BUS_ADDRESS
              value: bus.liken-system.svc:1883
            # Every liken process serves /metrics on port 9200. The
            # PodMonitor in deploy/monitoring scrapes it.
            - name: MEDIA_METRICS_ADDRESS
              value: ":9200"
          ports:
            - name: metrics
              containerPort: 9200
          # The cpu and memory of the containers that the operator
          # creates, which it reads once at start. The kustomization
          # generates the ConfigMap from container-resources.yaml.
          volumeMounts:
            - name: container-resources
              mountPath: /etc/media-operator
              readOnly: true
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          # There is no cpu limit, because a throttled pass delays every
          # status write.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        # Optional, so the operator still starts without the
        # kustomization and uses its default settings.
        - name: container-resources
          configMap:
            name: media-operator-resources
            optional: true
