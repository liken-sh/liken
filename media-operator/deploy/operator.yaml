# The operator itself: one unprivileged Deployment, in the shape of
# liken's cluster operator rather than the hardware operators'
# DaemonSets. Those run a pod per node because they hold that node's
# hardware; this one holds no hardware at all. It watches plays,
# creates claims and pods, and writes statuses, and the scheduler
# places the playback pods wherever the claimed devices are.
#
# The operator serves no HTTP. It subscribes to the bus for each
# playback pod's report instead of hearing it over an endpoint of its
# own. The reports are the one path in this system that does not go
# through the API server, because the pods hold no API credentials.
#
# There is no volume for state. The operator re-derives everything
# from the API server on every pass.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-operator
  # Recreate, so two copies never reconcile at once. Two operators
  # would agree on every derived status, but each pod create they
  # raced would surface as a conflict for one of them to report.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media-operator
    spec:
      serviceAccountName: media-operator
      containers:
        - name: operator
          image: ghcr.io/liken-sh/media-operator:latest
          env:
            # The image the playback pods run: mpv under this same
            # binary as the argument shim. The operator stamps it into
            # every pod it creates. It is an environment variable
            # rather than a constant so a cluster pins the three
            # images together with one patch.
            - name: PLAYER_IMAGE
              value: ghcr.io/liken-sh/media-operator-player:latest
            # The image every idle screen runs: the client that reads a
            # unit's state off the bus and draws the clock while
            # nothing plays. The operator stamps it into every idle pod
            # whose Player names no image of its own, and it is set
            # here for the reason the player image is.
            - name: IDLE_IMAGE
              value: ghcr.io/liken-sh/media-operator-idle:latest
            # The image every sidecar container runs: the same binary
            # alone, with none of the player image's mpv, drivers, or
            # fonts. The operator stamps it into every sidecar it
            # creates, and it is set here for the reason the player
            # image is.
            - name: SIDECAR_IMAGE
              value: ghcr.io/liken-sh/media-operator-sidecar:latest
            # The broker the operator and every pod reach: the bus
            # Service in this namespace. The operator cannot derive the
            # Service name, so the manifest states it, and the operator
            # passes the address into every pod it creates.
            - name: MEDIA_BUS_ADDRESS
              value: bus.liken-system.svc:1883
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
