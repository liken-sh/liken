# The operator itself: one unprivileged Deployment, in the shape of
# liken's cluster operator rather than the hardware operators'
# DaemonSets. Those run a pod per node because they hold that node's
# hardware; this one holds no hardware at all. It watches plays,
# creates claims and pods, and writes statuses, and the scheduler
# places the playback pods wherever the claimed devices are.
#
# The operator serves no HTTP path a person or a pod calls. It
# subscribes to the bus for each playback pod's report instead of
# hearing it over an endpoint of its own; the reports are the one path
# in this system that does not go through the API server, because the
# pods hold no API credentials. The one HTTP surface it does carry is
# /metrics, on the port milestone 65 fixes for every process in the
# organization, and deploy/monitoring/ is the opt-in PodMonitor that
# scrapes it.
#
# There is no volume for state. The operator re-derives everything
# from the API server on every pass.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-operator
  labels:
    # The base binary selects on this label to find the
    # operator's Deployment, read its image version, and pull the
    # matching -cli image.
    cli.liken.sh/plugin: media
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. Two are safe: the Lease in leader.go lets one copy act, and
  # the other waits and takes over when the first stops.
  replicas: 1
  selector:
    matchLabels:
      app: media-operator
  # A rollout starts the new pod beside the old one, and stops the old
  # one only when the new one runs. The new pod waits for the Lease while
  # the old one leads. On SIGTERM the old pod finishes its pass, ends its
  # bus session, and releases the Lease, and the new pod takes it on its
  # next read, within about 11 seconds. So the image pull happens while
  # the old pod still leads.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: media-operator
    spec:
      serviceAccountName: media-operator
      containers:
        - name: operator
          image: ghcr.io/liken-sh/media-operator:latest
          env:
            # The operator reads its own pod to learn its image, and
            # derives every companion image from it at the same tag. The
            # two values also name the Lease the operator holds and the
            # identity it holds it under, so the operator exits when
            # either is unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The broker the operator and every pod reach: the bus
            # Service in this namespace. The operator cannot derive the
            # Service name, so the manifest states it, and the operator
            # passes the address into every pod it creates.
            - name: MEDIA_BUS_ADDRESS
              value: bus.liken-system.svc:1883
            # The metrics listener, on the port milestone 65 assigns this
            # process. It answers with no Prometheus running anywhere in
            # the cluster; nothing scrapes it until an owner applies
            # deploy/monitoring beside this base.
            - name: MEDIA_METRICS_ADDRESS
              value: ":9200"
          ports:
            - name: metrics
              containerPort: 9200
          # The cpu and memory settings of the containers this operator
          # builds, read once at start. The kustomization generates the
          # ConfigMap from container-resources.yaml.
          volumeMounts:
            - name: container-resources
              mountPath: /etc/media-operator
              readOnly: true
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          # Measured on a home cluster over eight days, the operator's
          # working set was 15Mi at the 99th percentile and 17Mi at most,
          # and its cpu 9m at the 99th percentile. That build had no
          # client-go. The build with client-go's leader election starts
          # about 12MB higher on a laptop, so its working set is likely
          # near 30Mi, and the limit leaves about twice that. A drill
          # measures the new build. No cpu limit, because a throttled
          # pass delays every status.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        # Optional, so a pod applied without the kustomization still
        # starts, with every default.
        - name: container-resources
          configMap:
            name: media-operator-resources
            optional: true
