# Lets media-api read the cluster's client certificate authority, which
# it verifies callers' client certificates against. The RoleBinding
# must be in kube-system, and `kubectl apply -n liken-system` refuses an
# object in another namespace, so the install guide applies this file
# alone with no -n flag.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-api-authentication-reader
  # extension-apiserver-authentication-reader is the built-in Role that
  # grants get, list, and watch on the ConfigMap
  # extension-apiserver-authentication, where the API server writes the
  # client certificate authority. Every extension API server binds it.
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
