# Adds PodMonitors for the pods that media-operator creates. Every
# process serves /metrics whether or not the cluster runs Prometheus,
# so a cluster that runs the Prometheus Operator adds this component
# and the base needs no change.
#
# A fleet repository takes the base and this component:
#
#   resources:
#     - https://github.com/liken-sh/liken//media-operator/deploy?ref=<tag>
#   components:
#     - https://github.com/liken-sh/liken//media-operator/deploy/monitoring?ref=<tag>
#
# This component sets no top-level namespace, because that would move
# the dashboard ConfigMap out of monitoring. Each PodMonitor sets
# liken-system itself.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor-operator.yaml
  - podmonitor-api.yaml
  - podmonitor-screens.yaml

# kube-prometheus-stack runs a sidecar next to Grafana that loads every
# ConfigMap with the label grafana_dashboard: "1", so the dashboard
# needs no Grafana API call and no provisioning file.
#
# The name has no content hash. With a hash, each edit would create a
# new ConfigMap, and an apply without pruning would keep the old one,
# so Grafana would show both dashboards. With a fixed name, an edit
# replaces the ConfigMap and the sidecar reloads the dashboard.
configMapGenerator:
  - name: media-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/media-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
