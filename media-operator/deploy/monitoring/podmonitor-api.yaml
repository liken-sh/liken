# Scrapes the API's pod on its port named metrics. It selects
# app: media-api, the selector label of the Deployment in
# deploy/api.yaml. The base's labels transformer sets
# includeSelectors: false, so it does not add labels to that selector.
# The PodMonitor is in liken-system, the namespace of the Deployment,
# so it needs no namespaceSelector.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: media-api
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: media-api
  podMetricsEndpoints:
    - port: metrics
      # A pod's labels do not include its node, so the scrape copies the
      # node name from Prometheus's discovery metadata into a node label.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
