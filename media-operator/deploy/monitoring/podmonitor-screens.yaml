# Scrapes the idle screen pods. buildIdlePod labels each one
# media.liken.sh/component: idle, the same label that display-operator's
# Layout uses to select the surface.
#
# A Player can be in any namespace, and its idle pod runs in the same
# namespace. So this PodMonitor cannot sit beside its targets the way
# podmonitor-operator.yaml sits beside the Deployment, and
# namespaceSelector selects pods in every namespace. The PodMonitor
# itself is in liken-system, the namespace that prometheus-operator
# watches.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: media-idle-screen
  namespace: liken-system
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      media.liken.sh/component: idle
  podMetricsEndpoints:
    - port: metrics
      # The fleet dashboard selects by node. A pod's labels do not
      # include its node, so the scrape copies the node name from
      # Prometheus's discovery metadata.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
# Scrapes the playback pods. buildPod labels each one
# media.liken.sh/component: playback. The pod's command sidecar serves
# the series that come from mpv, because it is the only process that
# has mpv's IPC socket. A Play can also be in any namespace, so this
# PodMonitor also selects every namespace from liken-system.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: media-playback
  namespace: liken-system
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      media.liken.sh/component: playback
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
