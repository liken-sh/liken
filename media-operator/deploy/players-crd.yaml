# The Player API, declared to Kubernetes.
#
# A Player is one named unit of equipment: a lone speaker, a TV with
# its built-in speakers, a TV with a receiver. The spec selects the
# unit's devices out of what the hardware operators publish, with the
# same CEL selectors a hand-written ResourceClaim would use. The
# media operator holds a claim on the unit's display between runs,
# for the idle screen, and it claims the other devices only while a
# Play runs.
#
# The resource is namespaced, unlike liken's own Machine, because
# everything a Player becomes is namespaced: the claims, the playback
# pod, and the Play that names it all live in one namespace, and RBAC
# on that namespace covers the set.
#
# The device entry repeats inline under display, sinks, and render,
# because a CRD's structural schema allows no $ref. Each entry names
# a DeviceClass, an optional CEL selector, and optional opaque
# parameters for the driver that prepares the device.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: players.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: Player
    listKind: PlayerList
    plural: players
    singular: player
    # `kubectl get media` shows the whole layer at once: every
    # player and every play, the way `kubectl get liken` shows the
    # OS layer.
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec; only the operator writes
      # status. The API server enforces the split.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Zone
          type: string
          jsonPath: .spec.zone
        - name: Activity
          type: string
          jsonPath: .status.activity
        - name: Play
          type: string
          jsonPath: .status.play
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Player is one named unit of equipment at one spot, for
            one purpose. A Play names a Player to run media on it,
            and the media operator claims the Player's devices for
            exactly as long as that Play exists.
          properties:
            spec:
              type: object
              description: >-
                The devices that form the unit, each selected from
                what a hardware operator publishes. All of a Player's
                devices must be reachable from one machine, because a
                Play becomes one pod and the scheduler places that
                pod on the machine that owns every claimed device. A
                Player whose devices span machines produces Plays
                that stay Pending.
              # A Player with no display and no sinks plays nothing
              # anywhere, so the spec must select at least one of the
              # two. Render alone is not a Player.
              x-kubernetes-validations:
                - rule: >-
                    has(self.display) ||
                    (has(self.sinks) && size(self.sinks) > 0)
                  message: >-
                    a Player needs a display or at least one sink;
                    render alone plays nothing
              properties:
                zone:
                  type: string
                  description: >-
                    The area this Player is in, such as living-room.
                    A word for grouping and display; nothing acts on
                    it yet.
                displayName:
                  type: string
                  description: >-
                    The human name of this unit, the one the idle
                    screen and later ambient surfaces show in place of
                    the object name, such as Studio Lab. Omit it, and
                    the idle screen falls back to the object name.
                display:
                  type: object
                  required: [class]
                  description: >-
                    The display this Player shows video on. Omit it
                    for an audio-only Player.
                  properties:
                    class:
                      type: string
                      description: >-
                        The DeviceClass the claim allocates through.
                        Consumer classes are the cluster owner's
                        vocabulary; each hardware operator's manual
                        gives the YAML for its class.
                    displayName:
                      type: string
                      description: >-
                        The human name of this selection, the one the
                        idle screen shows in its parts list, such as
                        Portable Screen. Omit it, and the idle screen
                        falls back to the DeviceClass name.
                    selector:
                      type: string
                      description: >-
                        A CEL expression over device.attributes, the
                        same expression a hand-written claim would
                        carry. Omitted, the class alone chooses,
                        which fits a class that already names one
                        kind of device.
                    parameters:
                      type: object
                      required: [driver]
                      description: >-
                        Opaque configuration for the driver that
                        prepares the device, carried onto the claim
                        unread. The display operator's manual
                        documents its parameters, such as mode and
                        brightness.
                      properties:
                        driver:
                          type: string
                          description: >-
                            The driver the parameters are for, such
                            as display.liken.sh.
                        values:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: >-
                            The parameters themselves. The driver
                            defines them; this operator carries them.
                sinks:
                  type: array
                  x-kubernetes-list-type: atomic
                  description: >-
                    The audio outputs this Player plays sound
                    through.
                  items:
                    type: object
                    required: [class]
                    properties:
                      class:
                        type: string
                        description: >-
                          The DeviceClass the claim allocates
                          through. Consumer classes are the cluster
                          owner's vocabulary; each hardware
                          operator's manual gives the YAML for its
                          class.
                      displayName:
                        type: string
                        description: >-
                          The human name of this selection, the one
                          the idle screen shows in its parts list,
                          such as Built-in Speakers. Omit it, and the
                          idle screen falls back to the DeviceClass
                          name.
                      selector:
                        type: string
                        description: >-
                          A CEL expression over device.attributes,
                          the same expression a hand-written claim
                          would carry.
                      parameters:
                        type: object
                        required: [driver]
                        description: >-
                          Opaque configuration for the driver that
                          prepares the device, carried onto the
                          claim unread. The audio operator's manual
                          documents its parameters, such as codec.
                        properties:
                          driver:
                            type: string
                            description: >-
                              The driver the parameters are for,
                              such as audio.liken.sh.
                          values:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                            description: >-
                              The parameters themselves. The driver
                              defines them; this operator carries
                              them.
                render:
                  type: object
                  required: [class]
                  description: >-
                    The GPU render node the player program decodes
                    and draws with. Omit it only for an audio-only
                    Player; mpv needs a GPU to put video on a
                    display.
                  properties:
                    class:
                      type: string
                      description: >-
                        The DeviceClass the claim allocates through.
                        A render class usually needs no selector,
                        because it already names one kind of device.
                    displayName:
                      type: string
                      description: >-
                        The human name of this selection, the one the
                        idle screen shows in its parts list. Omit it,
                        and the idle screen falls back to the
                        DeviceClass name.
                    selector:
                      type: string
                      description: >-
                        A CEL expression over device.attributes, for
                        a machine with more than one GPU.
                control:
                  type: object
                  required: [class]
                  description: >-
                    The panel's DDC/CI control device, an opt-in.
                    The idle pod holds it, and its sidecar darkens
                    the panel after idle.offAfterSeconds and lights
                    it on a press. A panel that refuses DDC/CI
                    publishes no control device, so omit this there.
                  properties:
                    class:
                      type: string
                      description: >-
                        The cluster's control DeviceClass. A
                        constraint ties the device to the display
                        selection's own panel, so no selector is
                        needed to name the screen twice.
                    displayName:
                      type: string
                      description: >-
                        The household's name for this selection,
                        shown where the idle screen lists the
                        unit's parts.
                    selector:
                      type: string
                      description: >-
                        A CEL expression over device.attributes
                        that narrows which control device the claim
                        takes. Usually omitted: the constraint
                        already ties it to the display's panel.
                    parameters:
                      type: object
                      required: [driver]
                      description: >-
                        Opaque driver configuration for the control
                        selection, passed through on the claim.
                      properties:
                        driver:
                          type: string
                          description: >-
                            The driver these parameters are for.
                        values:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: >-
                            The parameters themselves, defined by
                            the driver.
                remotes:
                  type: array
                  x-kubernetes-list-type: atomic
                  # A Player may name several controllers, and a Remote
                  # may be named by several Players, so the relation is
                  # many to many. One controller then drives a Play in
                  # each unit that names it, and focus decides which one a
                  # press reaches.
                  description: >-
                    The controllers this unit owns, each naming a
                    Remote in the same namespace. The Play's pod builds
                    one translator sidecar per entry.
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        description: >-
                          The Remote this unit owns, by name, in this
                          namespace.
                      displayName:
                        type: string
                        description: >-
                          The human name of this controller, the one
                          the idle screen shows in its parts list,
                          such as Studio Dualsense Controller. Omit
                          it, and the idle screen falls back to name.
                      keymap:
                        type: string
                        description: >-
                          A per-unit Keymap override for this controller
                          on this unit, by name. Set it, and this
                          controller maps this way here and its Remote's
                          own way elsewhere. Empty, the unit reads the
                          Remote's own Keymap.
                audioLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    A per-Player override of the audio language
                    order; omit it to inherit the default MediaPreferences.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitleLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    A per-Player override of the subtitle language
                    order; omit it to inherit the default MediaPreferences.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitles:
                  type: string
                  enum: ["on", "off", "auto"]
                  description: >-
                    A per-Player override of when subtitles show;
                    omit it to inherit the default MediaPreferences.
                idle:
                  type: object
                  description: >-
                    This unit's idle screen policy. Each field overrides
                    the default MediaPreferences on its own.
                  properties:
                    fadeAfterSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Seconds of quiet before the idle screen fades to
                        black. Zero disables the automatic fade; omit it
                        to inherit the default MediaPreferences.
                    offAfterSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Seconds of quiet before the panel itself
                        goes dark, at least fadeAfterSeconds. Zero
                        or unset means the panel never goes dark on
                        its own. It acts only on a Player that
                        states a control device.
                    offMode:
                      type: string
                      enum: [backlight, power]
                      description: >-
                        What the off window writes: backlight, the
                        default, writes the backlight to zero and
                        always wakes over DDC; power writes DPM
                        off, which is deeper and which some panels
                        never answer from. State power only for a
                        panel the drill proved wakes.
            status:
              type: object
              description: >-
                What plays on this Player now, written only by the
                media operator. It is derived from the Plays that
                name the Player, so it is empty until one does.
              properties:
                activity:
                  type: string
                  enum: [Playing, Starting, Idle]
                  description: >-
                    Whether the Player performs a run now. Playing
                    is a Play running on it, Starting is a Play whose
                    pod has not begun, and Idle is no Play at all.
                play:
                  type: string
                  description: >-
                    The name of the Play on this Player, in the same
                    namespace. Empty while the Player is Idle.
                panel:
                  type: string
                  description: >-
                    The panel state the idle sidecar last actuated:
                    On, BacklightOff, Off, or Unresponsive. Empty
                    until a sidecar with a control device reports
                    one.
