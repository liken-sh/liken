# A cluster has one MediaPreferences, named default, with the
# cluster's default languages, time zone, and idle screen settings. For
# each language setting, the operator uses the Play's value, then the
# Player's, then this one.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mediapreferences.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: MediaPreferences
    listKind: MediaPreferencesList
    plural: mediapreferences
    singular: mediapreferences
    categories: [media]
  # The defaults apply to the whole cluster, not to one namespace.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Nothing writes status on a MediaPreferences, so it has no
      # status subresource.
      additionalPrinterColumns:
        - name: Subtitles
          type: string
          jsonPath: .spec.subtitles
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            The cluster's defaults: the preferred audio and subtitle
            languages, the time zone of the display clock, and what an
            idle screen does. A Player or a Play can override each language
            field. Nothing overrides the time zone.
          # Two sets of defaults would conflict, so the API server refuses
          # any name but default.
          x-kubernetes-validations:
            - rule: self.metadata.name == 'default'
              message: a MediaPreferences must be named default
          properties:
            spec:
              type: object
              description: >-
                The operator uses a language or subtitle field here only
                when neither the Play nor the Player sets it.
              properties:
                audioLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    Audio languages in order of preference, as IETF language
                    tags such as `en` or `pt-BR`. mpv plays the first audio
                    track that matches, and treats `en` and `eng` as the same
                    language.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitleLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    Subtitle languages in order of preference, so a viewer can
                    hear the original audio with subtitles in their own
                    language. When it is empty, `audioLanguages` is used.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitles:
                  type: string
                  enum: ["on", "off", "auto"]
                  description: >-
                    When subtitles show. With `on`, the playback pod shows the
                    first full or SDH track in the order of
                    `subtitleLanguages`. When there is none, it shows the
                    forced track of the audio's language, if that language is
                    in `audioLanguages`. With `auto`, audio in the first
                    language of `audioLanguages` shows only its forced track,
                    or nothing, and other audio chooses as `on` does. With
                    `off`, no subtitles show.
                sdh:
                  type: string
                  enum: [prefer, avoid]
                  description: >-
                    Whether an SDH track ranks ahead of a full track in the
                    same language (`prefer`) or behind it (`avoid`). An SDH
                    track also describes sounds, for a viewer who is deaf or
                    hard of hearing. When omitted, the two rank the same, and
                    the playback pod takes the track with the default flag, or else
                    the first in the file.
                timeZone:
                  type: string
                  description: >-
                    The time zone, as an IANA name such as `America/New_York`.
                    The playback pod gets it as `TZ`, so the display clock shows
                    local time and not UTC.
                idle:
                  type: object
                  description: >-
                    What a screen does while nothing plays. Each field applies
                    to a Player whose own `idle` block leaves it unset.
                  properties:
                    controller:
                      type: string
                      pattern: '^[a-z0-9.-]+/[a-z0-9-]+$'
                      description: >-
                        The operator that draws the idle screen, as a
                        domain-qualified name. With the default,
                        `media.liken.sh/idle-screen`, media-operator draws its
                        own idle screen. With `media.liken.sh/none`, nothing
                        draws one and the operator creates no idle claim. Any
                        other name leaves the screen to the operator with that
                        name, which reads the Player's `status.idle` for the
                        claim to use, its request names, the fade and off
                        windows, and the MQTT broker and topics.
                    image:
                      type: string
                      description: >-
                        The container image that draws the idle screen. The
                        image runs its own entrypoint and reads the Player's
                        state from the MQTT bus. It implements the fade and off
                        windows, the dimming of the screen, the volume
                        indicator, and the requests to turn the panel on or
                        off. It acts on a remote's press only while that
                        remote's focus is on this Player. When unset, the
                        screen runs the idle client that media-operator ships.
                    fadeAfterSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Seconds with no activity before an idle screen fades
                        to black. The default is 600, and 0 turns the fade
                        off.
                    offAfterSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        Seconds with no activity before an idle panel turns
                        off. Unset or 0 leaves the panel on. The shipped idle
                        client treats a value below `fadeAfterSeconds` as
                        `fadeAfterSeconds`. A panel turns off only when display-operator
                        runs in the cluster and publishes a `Display` for the
                        screen.
                    offMode:
                      type: string
                      enum: [backlight, power]
                      description: >-
                        How the panel turns off after `offAfterSeconds`. With
                        `backlight`, the default, the panel stays on at
                        brightness zero and still responds to DDC. With
                        `power`, the panel powers off, and some panels then
                        stop responding to DDC. Use `power` only for a panel
                        that you have seen wake from it.
