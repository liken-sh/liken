# The capabilities agent runs as one pod on each node that has a GPU.
# It asks each render node's VA-API driver what the GPU can decode,
# encode, and scale, and publishes the result as media.liken.sh
# devices. A workload's claim pairs one of those devices with the
# render node of the same GPU, so the scheduler places the workload
# only on a GPU whose driver supports what the workload needs. The
# cluster owner creates the DeviceClasses that select those devices.
# The capabilities guide has the YAML.
---
# The class that the agent's own claim template uses. It ships here
# because the template names it and the agent cannot start without it.
# It selects the render nodes that liken publishes. liken publishes a
# render node as a shareable device, so the agent's claim does not take
# the render node from workloads that decode on the same GPU. A
# workload does not use this class for its render node. The cluster
# owner writes that class.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: media-render
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].renderNode)
---
# One claim for every render node on the node. With allocationMode All,
# the scheduler allocates each render node that liken publishes on the
# node when it places the pod, so the agent can open every render node
# it queries. On a node with no render node the pod stays Pending, so
# the DaemonSet's node affinity keeps the pod off a labeled node.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: media-capabilities
spec:
  spec:
    devices:
      requests:
        - name: render-nodes
          exactly:
            deviceClassName: media-render
            allocationMode: All
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: media-capabilities
spec:
  selector:
    matchLabels:
      app: media-capabilities
  # The render nodes are shareable, so a new pod could claim them while
  # the old pod still holds them. The old pod stops first anyway,
  # because two pods would register the same kubelet plugin socket.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: media-capabilities
    spec:
      serviceAccountName: media-capabilities
      # The kubelet starts a pod whose claim has a media.liken.sh device
      # only while this driver's plugin is registered on the node. The
      # priority schedules the agent before the workloads that depend
      # on it, and the toleration lets it run on a node with any taint.
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      # Label a node that has no render node media.liken.sh/gpu: none,
      # and it gets no pod. NotIn also matches a node without the label,
      # so an unlabeled node gets a pod that starts only when its claim
      # is allocated. A patch that sets its own
      # node affinity replaces this list of terms, because the list is
      # atomic.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: media.liken.sh/gpu
                    operator: NotIn
                    values: ["none"]
      containers:
        - name: agent
          image: ghcr.io/liken-sh/media-operator-capabilities:latest
          env:
            # The ResourceSlice records the node it describes, and the
            # agent reads its own pod to find the claim that the kubelet
            # created from the template. The downward API supplies
            # these values.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            # The agent runs as root, because root owns the kubelet's
            # directories where it serves its sockets. It needs no
            # capabilities: it opens the render nodes of its claim and
            # reads sysfs.
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            # Each query loads the GPU's media driver in a child
            # process, once for each render node when the pod starts.
            # Memory peaks while the driver loads.
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
            claims:
              - name: render-nodes
          volumeMounts:
            # Every DRA driver mounts the registry directory, where the
            # kubelet discovers the plugin, and the plugin's own
            # directory, which holds the socket that serves the
            # kubelet's prepare calls.
            - name: kubelet-plugin
              mountPath: /var/lib/kubelet/plugins/media.liken.sh
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
      resourceClaims:
        - name: render-nodes
          resourceClaimTemplateName: media-capabilities
      volumes:
        # DirectoryOrCreate, because a node that has never run a DRA
        # driver has neither path.
        - name: kubelet-plugin
          hostPath:
            path: /var/lib/kubelet/plugins/media.liken.sh
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-capabilities
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-capabilities
rules:
  # The agent's own ResourceSlice, <node>-media.liken.sh, which it
  # creates, replaces, and deletes, and the liken.sh slice of its node,
  # which it watches for render nodes. RBAC cannot restrict a rule to
  # the slice of the pod's node, because resourceNames cannot follow
  # the pod's node, so the grant covers every slice. The agent writes
  # only the slice named from NODE_NAME and watches only the liken.sh
  # slice of its node, by name.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch, create, update, delete]
  # The agent reads its Node once at start, for the UID of the slice's
  # owner reference. The Node owns the slice, so deleting the Node
  # deletes the slice.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-capabilities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-capabilities
subjects:
  - kind: ServiceAccount
    name: media-capabilities
    namespace: liken-system
---
# The agent's own pod and claim, in the agent's namespace. The agent
# reads its pod for the name of its claim, and the claim for the render
# nodes it holds. It deletes its own pod when liken publishes a render
# node that the claim does not hold, because a claim keeps its
# allocation for the life of the pod, and the DaemonSet's replacement
# pod claims every render node. RBAC cannot name a pod that a DaemonSet
# creates, so the grant covers every pod in the namespace, and the
# agent deletes only the pod that POD_NAME names.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-capabilities
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, delete]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-capabilities
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-capabilities
subjects:
  - kind: ServiceAccount
    name: media-capabilities
    namespace: liken-system
