# The identity of media-operator, with the narrowest permissions it can
# work with. It reads Plays, Players, and Remotes, writes their statuses,
# and creates the claims and pods that they need.
#
# The operator deletes a pod or a claim when a run has finished, or to
# replace one that no longer matches what the pass builds. Every other
# claim and pod is removed by garbage collection through its
# ownerReference, when its Play, Player, or Remote is deleted. The only
# object that a person created and the operator deletes is a finished
# Play whose ttlSecondsAfterFinished has passed.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-operator
rules:
  # Plays in every namespace, because the operator is one Deployment for
  # the cluster and users run media in any namespace. The operator
  # watches them, and each pass reads the whole collection from the
  # watch's cache.
  #
  # The delete verb removes a finished Play after its
  # ttlSecondsAfterFinished, so the list does not grow with every film.
  #
  # The patch verb adds and removes the finalizer media.liken.sh/bus-topics,
  # which keeps a deleted Play until the operator has cleared the run's
  # retained bus topics. The patch changes only metadata.finalizers.
  - apiGroups: [media.liken.sh]
    resources: [plays]
    verbs: [get, list, watch, patch, delete]
  # Only the status subresource, so the operator cannot rewrite a spec
  # that a person declared.
  - apiGroups: [media.liken.sh]
    resources: [plays/status]
    verbs: [update]
  # The get verb rereads a Player when a status write conflicts. The
  # patch verb server-side applies spec.power, the only spec field the
  # operator writes, when the power key of a remote turns a Player off or
  # on.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get, list, watch, patch]
  # Only the status subresource, as for Plays: the operator writes what
  # plays on a Player and never the equipment that a person declared.
  - apiGroups: [media.liken.sh]
    resources: [players/status]
    verbs: [update]
  # Each Remote has one reader pod. The get verb rereads a Remote when a
  # status write conflicts.
  - apiGroups: [media.liken.sh]
    resources: [remotes]
    verbs: [get, list, watch]
  # Only the status subresource, as for Plays and Players. The operator
  # writes which unit a controller drives and never the device selector
  # that a person declared.
  - apiGroups: [media.liken.sh]
    resources: [remotes/status]
    verbs: [update]
  # Keymaps are cluster-scoped. On each pass the operator compiles every
  # Keymap and publishes its table as a retained message on the bus.
  - apiGroups: [media.liken.sh]
    resources: [keymaps]
    verbs: [get, list, watch]
  # MediaPreferences are cluster-scoped. Each pass reads the default one
  # by name to choose the audio and subtitle languages of a run.
  - apiGroups: [media.liken.sh]
    resources: [mediapreferences]
    verbs: [get, list, watch]
  # The claims of each Play, and of each Player's idle pod and each
  # Remote's reader pod. The list and watch verbs are cluster-scoped
  # because each claim is in the namespace of its Play, Player, or Remote,
  # and the claims have no label to select them by. The get verb rereads a
  # claim before the operator creates or deletes one.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, list, watch, create, delete]
  # The operator reads the attributes of the devices that its claims
  # hold, to find the Display of an allocated screen.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [list, watch]
  # The bonded devices of bluetooth-operator, which are cluster-scoped.
  # The operator reads whether a controller is connected and its battery
  # charge, and publishes both in the unit's status on the bus.
  - apiGroups: [bluetooth.liken.sh]
    resources: [peripherals]
    verbs: [get, list, watch]
  # The Displays of display-operator. The operator copies what a screen's
  # panel last showed into the Player status. When the idle screen
  # requests that the panel turn off, it server-side applies
  # spec.override under its own field manager, which leaves every other
  # field as the cluster owner set it.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch, patch]
  # The Receivers of equipment-operator, which are cluster-scoped. The
  # operator finds the input that a unit's cable is connected to, and
  # copies the match into the Player status. While the unit matches an
  # input, the operator server-side applies status.session under its
  # own field manager. The session is in status because equipment-operator
  # sends a Receiver's settings to the device again on each new
  # metadata.generation, and a status write does not change the
  # generation. The patch on the Receiver itself removes a spec.session
  # that an earlier version of this operator wrote. Each apply changes
  # only the fields of this field manager, so the declared inputs stay.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers]
    verbs: [get, list, watch, patch]
  - apiGroups: [equipment.liken.sh]
    resources: [receivers/status]
    verbs: [get, patch]
  # The Televisions of equipment-operator, which are cluster-scoped. The
  # CEC node pod of equipment-operator writes a request to wake or sleep
  # a Player's screen in status.screenAsk, and has no connection to the
  # bus. The operator publishes each new request on the Player's power
  # topic.
  - apiGroups: [equipment.liken.sh]
    resources: [televisions]
    verbs: [get, list, watch]
  # The Sinks of audio-operator, which are cluster-scoped. The operator
  # reads each Sink's volume scale and level, and requests a level by a
  # server-side apply of status.session under its own field manager. The
  # apply changes no field that audio-operator writes.
  - apiGroups: [audio.liken.sh]
    resources: [sinks]
    verbs: [get, list, watch]
  - apiGroups: [audio.liken.sh]
    resources: [sinks/status]
    verbs: [get, patch]
  # The playback pods, and the idle and reader pods. The list and watch
  # verbs are cluster-scoped because a Play can be in any namespace. The
  # watch selects the operator's own pods by their media.liken.sh/component
  # label.
  #
  # The delete verb also deletes pods that this operator did not create.
  # A claim in use stays Terminating until every pod in its
  # status.reservedFor is gone, so the operator deletes each of those pods
  # before it replaces the claim. When another operator draws the idle
  # screen, one of those pods is that operator's pod.
  #
  # The patch verb changes only metadata.labels. It adds the
  # media.liken.sh/component label to an idle or reader pod that an older
  # release created without it, so that the watch selects the pod. It also
  # adds media.liken.sh/ending to a playback pod when its run reports the
  # ending, so the compositor fades the film out.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  # The Events that the operator posts on Plays, Players, and Remotes,
  # in each object's namespace. When the same Event repeats within ten
  # minutes of its last repeat, the operator patches count and
  # lastTimestamp on the earlier Event, so `kubectl describe` prints one
  # line for the repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-operator
subjects:
  - kind: ServiceAccount
    name: media-operator
    namespace: liken-system
---
# The Lease of the leader election in leader.go. client-go reads the
# Lease with get, and acquires, renews, and releases it with update. The
# Role is namespaced, so the operator cannot read the kubelets' Leases in
# kube-node-lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [media-operator]
    verbs: [get, update]
  # RBAC cannot limit create by resourceNames, because a create request
  # has no name in its URL. The first copy to start creates the Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-operator-lease
subjects:
  - kind: ServiceAccount
    name: media-operator
    namespace: liken-system
