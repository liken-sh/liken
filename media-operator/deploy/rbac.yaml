# The operator's identity in the cluster, and deliberately nothing
# more. It reads plays and players, writes play statuses, and creates
# the claims and pods a play becomes. It deletes a pod or a claim only
# to recreate a running Play's pod after its Player reshaped it.
# Otherwise the teardown is the garbage collector's, through the
# ownerReference every claim and pod carries, and deleting the Play is
# the whole stop.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-operator
rules:
  # The plays, across every namespace, because a household runs its
  # media in whatever namespace it likes and the operator is one
  # Deployment for the cluster. The watch is the wake signal; every
  # pass re-reads with a list.
  - apiGroups: [media.liken.sh]
    resources: [plays]
    verbs: [get, list, watch]
  # Only the status half. The API server's subresource split is what
  # keeps this operator from ever rewriting a spec a person declared.
  - apiGroups: [media.liken.sh]
    resources: [plays/status]
    verbs: [update]
  # Players are read one at a time by the name a play carries, and
  # listed once a pass to write each one's status. No watch: a
  # player that appears is caught by the next pass, and its status
  # follows the Plays this operator already watches.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get, list]
  # Only the status half, the same subresource split the plays use:
  # the operator writes what plays on a player, never the equipment
  # a person declared.
  - apiGroups: [media.liken.sh]
    resources: [players/status]
    verbs: [update]
  # The remotes bound to a player. A Remote is watched like a Play,
  # because each Remote reconciles into one standing pod, and the watch
  # is the wake signal for that pod. Nothing indexes a Remote by the
  # player it binds, so every pass re-reads with a list.
  - apiGroups: [media.liken.sh]
    resources: [remotes]
    verbs: [get, list, watch]
  # The keymaps, cluster-scoped now. The operator lists them to compile
  # every Keymap and publish its table to the bus retained on each pass,
  # and the watch is the wake signal for a keymap edit. Read-only,
  # because a person writes these and the operator only reads them.
  - apiGroups: [media.liken.sh]
    resources: [keymaps]
    verbs: [get, list, watch]
  # The claims a play becomes. Created once per play, read back on
  # every pass, and deleted only to rebuild a claim a Player reshaped.
  # The Play still owns them, so deleting the Play is the ordinary
  # teardown.
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, create, delete]
  # The playback pods, on the same terms as the claims: created per
  # play, and deleted to recreate one at the film's place.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-operator
subjects:
  - kind: ServiceAccount
    name: media-operator
    namespace: liken-system
