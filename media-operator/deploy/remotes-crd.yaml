# A Remote is one physical controller. It holds the selector for the
# controller's device and the name of the Keymap for its model. A
# Remote does not name a Player. A Player lists its Remotes in
# spec.remotes. The selector has the same form as a Player's
# spec.display: a DeviceClass and a CEL expression over the device
# attributes that a hardware operator publishes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remotes.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: Remote
    listKind: RemoteList
    plural: remotes
    singular: remote
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource lets the operator write status without
      # being able to change the spec that a person wrote. Status has no
      # field for a Keymap that does not compile. The operator posts a
      # KeymapRefused Warning Event on the Remote, and the last key table
      # that compiled stays in effect.
      subresources:
        status: {}
      # The Player column shows which Player the controller drives now,
      # so `kubectl get remotes` does not need a read of the message bus.
      # The Peripheral column names the paired device. Its Peripheral
      # object shows the link state and the battery level.
      additionalPrinterColumns:
        - name: Keymap
          type: string
          jsonPath: .spec.keymap
        - name: Player
          type: string
          jsonPath: .status.player
        - name: Peripheral
          type: string
          jsonPath: .status.peripheral
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: size(self.metadata.name) <= 32
              message: >-
                a Remote name is at most 32 characters, because the
                operators that serve it build the names of the objects
                they create from it, and Kubernetes limits some of those
                names to 63 characters
          description: >-
            One physical controller. `spec.device` selects the controller,
            and the default key mapping translates its input. When the
            controller's model needs a different mapping, `spec.keymap`
            names a Keymap. A Player lists the Remotes that drive it in
            `spec.remotes`. A Remote does not name a Player.
          properties:
            spec:
              type: object
              required: [device]
              description: >-
                The controller to use, and the Keymap for its model when
                the model needs one.
              properties:
                device:
                  type: object
                  required: [class]
                  description: >-
                    The controller, selected from the devices that the
                    hardware operators publish, and the parameters that
                    its driver uses to prepare it.
                  properties:
                    class:
                      type: string
                      description: >-
                        The name of the `DeviceClass` that the claim
                        allocates from. The cluster owner creates this
                        class, so its name is whatever your cluster
                        calls its controllers.
                    selector:
                      type: string
                      description: >-
                        A CEL expression over `device.attributes` that
                        matches one controller, for example on its
                        address. When you omit it, the claim can
                        allocate any device of the class.
                    parameters:
                      type: object
                      required: [driver]
                      description: >-
                        Configuration for the driver that prepares the
                        controller. The operator copies it to the claim
                        and does not read it. Use it to set the classes
                        of input that the Remote needs. The manual of
                        the bluetooth operator describes its `inputs`
                        parameter.
                      properties:
                        driver:
                          type: string
                          description: >-
                            The name of the driver that reads the
                            parameters, for example `bluetooth.liken.sh`.
                        values:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          description: >-
                            The parameters. The driver defines them,
                            and this operator copies them to the claim.
                keymap:
                  type: string
                  description: >-
                    The name of the Keymap for this controller's model. A
                    Keymap is cluster-scoped, so the name has no namespace.
                    The default mapping passes every `KEY_*` code and turns
                    the hat axes into the arrow keys, so you need a Keymap
                    only for a controller whose codes the kernel names
                    incorrectly. The mapping belongs to the controller and
                    applies on every Player that lists the Remote, as a udev
                    `hwdb` entry applies to a device.
                discovery:
                  type: boolean
                  description: >-
                    When true, the Remote's pod logs every input event
                    from the controller, with the code as a Keymap writes
                    it. Use it to find the codes of a controller that has
                    no Keymap: press each button and read the codes in the
                    pod log. In discovery mode the pod reads every input
                    node that the claim provides. Otherwise it reads only
                    the keys and hats that it publishes. The pod publishes
                    keys the same way in both modes, so the controller
                    keeps driving its Player while you map it. Changing
                    this field replaces the Remote's pod, and the
                    controller sends no input for a few seconds.
            status:
              type: object
              description: >-
                What the operator reports about this controller: the
                Player that receives its key presses now, the paired
                device that its claim allocated, and the codes that the
                controller declares and its Keymap does not bind.
              properties:
                player:
                  type: string
                  description: >-
                    The Player that receives this Remote's key presses
                    now, whether the Player is idle or playing. Empty
                    while no Player lists this Remote.
                peripheral:
                  type: string
                  description: >-
                    The name of the `Peripheral` for the device that this
                    Remote's claim allocated. The name is the device's
                    address in lowercase, with dashes. Read that object
                    for the link state and the battery level. Empty
                    while the claim has no allocation, and for a
                    controller that another driver publishes.
                # The list is keyed on code and type together, because
                # one number can be both a key and an axis: KEY_Q and
                # ABS_HAT0X are both 16. It has no maxItems, because the
                # evdev ABI already limits a device to 768 key codes.
                unbound:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [code, type]
                  description: >-
                    The codes that this controller declares and its
                    Keymap does not bind. The list is empty when the
                    Keymap binds every declared code, and absent until the
                    Remote's pod has reported. Each row that you add to the
                    Keymap removes a code from the list, so you can use it
                    to check that a Keymap is complete.
                  items:
                    type: object
                    required: [code, type]
                    properties:
                      code:
                        type: integer
                        description: >-
                          The raw evdev code, as a number.
                      name:
                        type: string
                        description: >-
                          The evdev name for the code. A Keymap binds
                          the code by this name. Empty when the kernel
                          has no name for the code, and a Keymap cannot
                          bind such a code.
                      type:
                        type: string
                        enum: [key, abs]
                        description: >-
                          The evdev event type of the code: `key` for a
                          button, `abs` for a hat axis.
