# The Remote API. A Remote is one physical controller: its device
# selector and the Keymap for its model. It names no player; a Player
# names the Remote through spec.remotes. The device is selected the way
# a Player's display is, by class and CEL over the attributes a
# hardware operator publishes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remotes.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: Remote
    listKind: RemoteList
    plural: remotes
    singular: remote
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The operator reports the focused Player on a Remote, so this
      # version carries a status subresource. The split keeps the operator
      # from rewriting the device selector a person declared. A Remote
      # whose Keymap will not compile still shows the failure on the Play
      # that tried to use it.
      subresources:
        status: {}
      # The Player column answers which unit this controller drives now,
      # so kubectl get remotes reads it without a read of the bus. The
      # Peripheral column names the bonded device, which is where a
      # person reads the link and the charge.
      additionalPrinterColumns:
        - name: Keymap
          type: string
          jsonPath: .spec.keymap
        - name: Player
          type: string
          jsonPath: .status.player
        - name: Peripheral
          type: string
          jsonPath: .status.peripheral
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            One physical controller, selected by its device and mapped
            by the base table and, where its model needs one, by its
            Keymap. A Player names the Remotes it owns; the
            Remote names no player.
          properties:
            spec:
              type: object
              required: [device]
              description: >-
                The controller, and the Keymap for its model where its
                model needs one.
              properties:
                device:
                  type: object
                  required: [class]
                  description: >-
                    The controller itself, selected out of the
                    devices the hardware operators publish. There
                    are no parameters: nothing prepares an input
                    device, and its nodes are read as they are.
                  properties:
                    class:
                      type: string
                      description: >-
                        The DeviceClass the claim allocates through.
                        Consumer classes are the cluster owner's
                        vocabulary, so the name is whatever this
                        cluster calls its controllers.
                    selector:
                      type: string
                      description: >-
                        A CEL expression over device.attributes that
                        picks this one controller, such as a match
                        on its address. Omit it, and the class alone
                        chooses.
                keymap:
                  type: string
                  description: >-
                    The Keymap for this controller's model, by name. A
                    Keymap is cluster-scoped, so the name carries no
                    namespace. The field is optional and rarely needed:
                    the base already passes every KEY_* code and turns
                    the hats into the arrows, so a Keymap is for a device
                    the kernel names wrongly. A device maps one way on
                    every unit, as it does under hwdb.
                discovery:
                  type: boolean
                  description: >-
                    The teaching mode for unknown hardware. The
                    standing pod keeps every input node the claim
                    delivered and logs each event the way a Keymap
                    names it, so a person presses every button and
                    reads the codes out of the pod log. The pod folds and
                    publishes keys in discovery exactly as it does
                    outside it, so a controller a person maps still
                    drives its unit. Turning the mode on or off
                    replaces the standing pod, which drops controller
                    input for a few seconds.
            status:
              type: object
              description: >-
                What the operator reports about this controller: the
                unit its presses reach now, the bonded device its claim
                holds, and the declared codes its Keymap leaves unbound.
              properties:
                player:
                  type: string
                  description: >-
                    The Player this Remote's focus mark names now:
                    the unit its presses reach, idle or playing. It
                    is empty while no Player lists this Remote.
                peripheral:
                  type: string
                  description: >-
                    The Peripheral for the device this Remote's claim
                    allocated. The name is the device's address in
                    lowercase with dashes. Read that object for the
                    link and the battery level. The field is empty
                    while the claim carries no allocation, and for a
                    controller another driver publishes.
                # The map is keyed on code and type together, because
                # one number can name both a key and an axis: KEY_Q and
                # ABS_HAT0X are both 16. The list carries no maxItems,
                # because the evdev ABI bounds a node's key codes at 768
                # and the gap shrinks toward empty as the Keymap grows.
                unbound:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [code, type]
                  description: >-
                    The gap, never the census: every code this
                    controller declares that its Keymap does not bind.
                    A controller whose Keymap binds every declared code
                    reports nothing here, and the field is absent while
                    no standing pod has reported. The list shrinks as
                    the Keymap grows, so it measures a mapping's
                    progress during discovery and stands as a
                    completeness check after.
                  items:
                    type: object
                    required: [code, type]
                    properties:
                      code:
                        type: integer
                        description: >-
                          The raw evdev code, the number the
                          controller reports on the wire.
                      name:
                        type: string
                        description: >-
                          The evdev name for the code, which is the
                          name a Keymap binds it by. It is empty when
                          the kernel gives the code no name, and such
                          a code cannot be bound.
                      type:
                        type: string
                        enum: [key, abs]
                        description: >-
                          Which event type carries the code: key for
                          a button, abs for a hat axis.
