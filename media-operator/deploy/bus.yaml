# The message bus is a Mosquitto broker, which the operator and every pod
# that it creates connect to over MQTT. A Remote's pod publishes button
# presses, and the playback pod acts on them itself, so a press still
# reaches mpv while the operator restarts. The playback pods publish
# reports, and the operator writes them to the Play's status.
#
# The bus uses MQTT instead of NATS because home automation systems such
# as Home Assistant use MQTT, so they can read and send the same messages
# with no gateway.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus
  # Recreate stops the old broker before it starts the new one, so two
  # brokers never serve the Service at once.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bus
    spec:
      # uid 1883 is the image's mosquitto user. The image's entrypoint
      # starts as root, changes the owner of its directories, and then
      # drops to that user. Both steps fail when the container drops
      # every capability, so the pod starts as the mosquitto user and
      # runs mosquitto directly.
      securityContext:
        runAsUser: 1883
        runAsGroup: 1883
        runAsNonRoot: true
      containers:
        - name: bus
          # The `eclipse-mosquitto` entry of toolchains/images.toml.
          # Mosquitto 2.1 publishes only the Alpine variant.
          image: eclipse-mosquitto:2.1.2-alpine
          command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports:
            - name: mqtt
              containerPort: 1883
          # The ConfigMap replaces the image's default configuration,
          # which also opens Mosquitto's HTTP API on port 9883.
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          # There is no cpu limit, because a throttled broker delays every
          # button press.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: bus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bus
data:
  # Without a `listener` line, Mosquitto listens on localhost only.
  #
  # `allow_anonymous true` accepts clients that send no credentials,
  # because only pods in the cluster can reach the broker. A broker
  # outside the cluster that you run yourself can require credentials.
  #
  # `persistence false` keeps retained messages only in memory. A button
  # press is useless after a restart, and each playback pod publishes its
  # last report again when it reconnects.
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence false
---
# operator.yaml sets this Service's address in MEDIA_BUS_ADDRESS.
apiVersion: v1
kind: Service
metadata:
  name: bus
spec:
  selector:
    app: bus
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
