# A Keymap changes the key names that one controller model reports,
# the way a udev hwdb entry does. Most controllers need none, because
# the default mapping passes every KEY_* code through unchanged, turns
# the d-pad's hat axes into the arrow keys, and turns BTN_SOUTH and
# BTN_EAST into KEY_ENTER and KEY_BACK. An entry in a Keymap replaces
# the default for the same control. The operator publishes the merged
# table as a retained message on the keys topic of each Remote that
# names the Keymap, so an edit reaches a running pod with no restart.
# When the Keymap does not compile, the operator publishes nothing,
# the last good table stays in effect, and the operator posts a
# Warning Event with the reason KeymapRefused on the Remote.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keymaps.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: Keymap
    listKind: KeymapList
    plural: keymaps
    singular: keymap
    categories: [media]
  # A Keymap is cluster-scoped so that the Remotes of one controller
  # model in every namespace can share it.
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The operator writes nothing to a Keymap, so it has no status.
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            The key names that a controller model reports in place of the
            names the kernel gives its controls. A Remote uses a Keymap
            when its `spec.keymap` names it. Write one only for a model
            whose controls the default mapping gets wrong.
          properties:
            spec:
              type: object
              description: >-
                The entries: `buttons` for buttons and keys, and `axes` for
                the directions of a d-pad. Set at least one of them.
              x-kubernetes-validations:
                - rule: >-
                    (has(self.buttons) && size(self.buttons) > 0) ||
                    (has(self.axes) && size(self.axes) > 0)
                  message: a Keymap must bind at least one button or axis
              properties:
                buttons:
                  type: array
                  x-kubernetes-list-type: atomic
                  description: >-
                    Button entries. Each entry sets the key name that one
                    button reports. A button with no entry keeps its default
                    mapping.
                  items:
                    type: object
                    required: [press, key]
                    properties:
                      press:
                        type: string
                        pattern: '^(BTN|KEY)_[A-Z0-9_]+$'
                        description: >-
                          The button's evdev name as the kernel reports it,
                          such as `BTN_SOUTH` on a gamepad or `KEY_PLAYPAUSE`
                          on a media remote. The operator refuses the Keymap
                          when it does not know the name. To find a button's
                          name, set `spec.discovery: true` on the Remote,
                          press the button, and read the name in the log of
                          the Remote's pod.
                      key:
                        type: string
                        pattern: '^((BTN|KEY)_[A-Z0-9_]+|none)$'
                        description: >-
                          The evdev key name that the button reports instead,
                          such as `KEY_ENTER`, or `none` to drop the button's
                          presses.
                      repeat:
                        type: object
                        description: >-
                          Repeats the key while the button is held. The
                          Remote's pod sends the press, waits for `delay`, and
                          then sends the key every `interval` until the button
                          is released. Set it for a gamepad button, because
                          the kernel does not repeat gamepad buttons. A
                          keyboard key repeats without it. The pod stops a
                          repeat 30 seconds after it starts, because a
                          controller that goes to sleep while a button is
                          held sends no release. The pod limits `delay` and
                          `interval` to 60 seconds each.
                        properties:
                          delay:
                            type: string
                            pattern: '^[0-9]+(\.[0-9]+)?(ms|s)$'
                            description: >-
                              How long the button must be held before the
                              repeat starts, as a duration such as `400ms`.
                              The default is `400ms`.
                          interval:
                            type: string
                            pattern: '^[0-9]+(\.[0-9]+)?(ms|s)$'
                            description: >-
                              The time between repeats, as a duration such as
                              `300ms`. The default is `300ms`.
                axes:
                  type: array
                  x-kubernetes-list-type: atomic
                  description: >-
                    D-pad entries. A gamepad's d-pad reports two hat axes,
                    not buttons. Each entry sets the key name that one
                    direction of a hat axis reports.
                  items:
                    type: object
                    required: [axis, value, key]
                    properties:
                      axis:
                        type: string
                        enum: [ABS_HAT0X, ABS_HAT0Y]
                        description: >-
                          The hat axis: `ABS_HAT0X` for left and right, or
                          `ABS_HAT0Y` for up and down. Analog sticks cannot
                          be mapped to keys.
                      value:
                        type: integer
                        enum: [-1, 1]
                        description: >-
                          The direction: `-1` for left or up, `1` for right
                          or down. Releasing the d-pad back to the center
                          stops a repeat.
                      key:
                        type: string
                        pattern: '^((BTN|KEY)_[A-Z0-9_]+|none)$'
                        description: >-
                          The evdev key name that this direction reports, or
                          `none` to drop it. The default mapping already
                          turns the d-pad into the arrow keys, so add an entry
                          only when a direction should report another key.
                      repeat:
                        type: object
                        description: >-
                          Repeats the key while the d-pad is held in this
                          direction, the same way as a button's `repeat`. An
                          entry replaces the default mapping of its
                          direction, and the default's repeat with it, so
                          set this block when the direction should still
                          repeat.
                        properties:
                          delay:
                            type: string
                            pattern: '^[0-9]+(\.[0-9]+)?(ms|s)$'
                            description: >-
                              How long the direction must be held before the
                              repeat starts, as a duration such as `400ms`.
                              The default is `400ms`.
                          interval:
                            type: string
                            pattern: '^[0-9]+(\.[0-9]+)?(ms|s)$'
                            description: >-
                              The time between repeats, as a duration such as
                              `300ms`. The default is `300ms`.
