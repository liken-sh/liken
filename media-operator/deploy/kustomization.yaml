# The kustomize base for media-operator. liken does not apply it. Apply
# it through your own GitOps with your own patches, or read it and write
# your own manifests.
#
# The cluster owner writes the DeviceClasses that a Player refers to,
# as for any hand-written claim, and each hardware operator's manual
# gives the YAML of its classes. The base ships only media-render, in
# capabilities.yaml, because the capabilities agent's own claim uses
# it. The guide claim-a-gpu-by-capability gives the YAML of the classes
# that select the agent's media.liken.sh devices.
#
# The base sets the namespace with a NamespaceTransformer and
# `unsetOnly`, not with the top-level namespace field, because the
# RoleBinding in api-authentication.yaml must stay in kube-system. It
# lets media-api read the cluster's client certificate authority. The
# top-level field would move it to liken-system, where its Role does
# not exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - players-crd.yaml
  - plays-crd.yaml
  - keymaps-crd.yaml
  - remotes-crd.yaml
  - mediapreferences-crd.yaml
  - rbac.yaml
  - operator.yaml
  - api.yaml
  - api-authentication.yaml
  - bus.yaml
  - capabilities.yaml

# The cpu and memory settings of the containers that the operator
# creates. The operator reads the mounted file once at start, never the
# ConfigMap through the API. The generated name includes a hash of the
# content, and kustomize writes that name into the Deployment's volume,
# so a changed value starts a new operator pod. An overlay changes a
# value with a configMapGenerator of the same name and namespace and
# `behavior: merge`, as the install guide shows.
configMapGenerator:
  - name: media-operator-resources
    files:
      - resources.yaml=container-resources.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: media-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/media-operator
    newTag: latest
  - name: ghcr.io/liken-sh/media-operator-api
    newTag: latest
  - name: ghcr.io/liken-sh/media-operator-capabilities
    newTag: latest
