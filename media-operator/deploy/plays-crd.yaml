# A Play is one run of media on one Player, and it works like a Job.
# media-operator creates a playback pod and the claims it needs, owned
# by the Play. When the run finishes, the operator deletes the pod and
# the claims at once, and keeps the Play, so you can read its status,
# until ttlSecondsAfterFinished passes.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: plays.media.liken.sh
spec:
  group: media.liken.sh
  names:
    kind: Play
    listKind: PlayList
    plural: plays
    singular: play
    categories: [media]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # People write the spec and only media-operator writes the status,
      # so the status subresource keeps each write from changing the
      # other.
      subresources:
        status: {}
      # The columns of `kubectl get plays` show where each run plays,
      # what it is doing, and how far along it is.
      additionalPrinterColumns:
        - name: Player
          type: string
          jsonPath: .spec.players[0]
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Activity
          type: string
          jsonPath: .status.activity
        - name: Display
          type: string
          jsonPath: .status.conditions[?(@.type=="DisplayAlive")].reason
        - name: Item
          type: integer
          jsonPath: .status.item
        - name: Position
          type: string
          jsonPath: .status.position
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            A Play is one run of media on a Player: a film, an album, or a
            season of episodes, played in order. Create a Play to start it.
            Delete the Play to stop it early.
          properties:
            spec:
              type: object
              required: [players, items]
              description: >-
                What to play and where. The spec is immutable. To play
                something else, or on another Player, create another Play.
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: >-
                    a Play's spec is immutable, so delete the Play and
                    create another
              properties:
                players:
                  type: array
                  x-kubernetes-list-type: atomic
                  minItems: 1
                  # A Play runs on one Player. The field is a list so
                  # that it keeps its name if a Play can one day run on
                  # several.
                  maxItems: 1
                  items:
                    type: string
                    minLength: 1
                  description: >-
                    The name of the `Player` in the Play's namespace that
                    this Play runs on. The list has exactly one entry.
                items:
                  type: array
                  x-kubernetes-list-type: atomic
                  minItems: 1
                  description: >-
                    The media to play, in order.
                  items:
                    type: object
                    required: [uri]
                    description: >-
                      One entry of the playlist: the URI to play and,
                      optionally, how the display shows it.
                    properties:
                      uri:
                        type: string
                        minLength: 1
                        description: >-
                          Where the media is. mpv streams an
                          `https://` URI directly. It checks the certificate
                          against the CA bundle in its image, so it refuses a
                          certificate that is expired, self-signed, or for
                          another host. The playback pod mounts
                          `nfs://host/export/path` and
                          `claim://namespace/claim/path`. A `claim://` URI must name the Play's own
                          namespace, because a pod can mount a claim only in
                          its own namespace. `pattern://white`,
                          `pattern://bars`, and `pattern://speakers` play a
                          test pattern from the player image, at the frame
                          size in the URI, such as `pattern://bars/1920x1080`,
                          or else at the frame size of the Player's screen.
                          The Play fails before any pod starts when the scheme
                          is unknown, when a `claim://` URI names no namespace
                          or another namespace, or when the image has no such
                          pattern or frame size.
                      presentation:
                        type: object
                        description: >-
                          What the display shows about the item. A library
                          that supplies the item sets these fields, and the
                          display uses them in place of the file's own tags.
                          Omit the block to show only the file's tags.
                        properties:
                          type:
                            type: string
                            enum: [video, music, image]
                            description: >-
                              The media type, which selects the layout of the
                              display. The display does not guess it from the
                              file.
                          hint:
                            type: string
                            enum: [movie, series, album]
                            description: >-
                              The kind of video or music, which also selects
                              the layout: `movie` or `series` for video, and
                              `album` for music. With `album`, the item's URI
                              is a directory, and the playback pod plays its
                              audio files as one timeline. The run fails when
                              the directory has no audio file.
                          role:
                            type: string
                            enum: [trailer]
                            description: >-
                              Set `trailer` when the item is a trailer and not
                              the work itself. The display then says so on the
                              line under the title.
                          title:
                            type: string
                            description: >-
                              The item's title, in place of the file's title
                              tag.
                          series:
                            type: string
                            description: The series this episode belongs to.
                          season:
                            type: integer
                            minimum: 0
                            description: The season number of the episode.
                          episode:
                            type: integer
                            minimum: 0
                            description: The episode number within its season.
                          episodeTitle:
                            type: string
                            description: The title of the episode.
                          year:
                            type: integer
                            minimum: 0
                            description: >-
                              The release year. The display shows it under a
                              movie's title, beside the length of the film.
                          date:
                            type: string
                            description: >-
                              The air date of an episode, as an ISO date such
                              as `2017-03-05`. The display formats it for the
                              screen.
                          artist:
                            type: string
                            description: >-
                              The artist of a music item, shown under the
                              title. When it is unset, the display shows the
                              artist tag that mpv reads from the file. Set it
                              for an album, which mpv plays as a timeline of
                              its files and not as one tagged file.
                          album:
                            type: string
                            description: >-
                              The album of a music item, shown beside the year.
                              It falls back to the file's tag as `artist`
                              does.
                          art:
                            type: string
                            description: >-
                              The URI of the cover art, as `claim://`,
                              `nfs://`, or `https://`, resolved like `uri`.
                              When it is unset, the pod uses a picture embedded
                              in the file, or else a `cover.jpg` beside it.
                          logo:
                            type: string
                            description: >-
                              The URI of the logo art, as `claim://`,
                              `nfs://`, or `https://`, resolved like `uri`.
                              The display shows it in the header in place of
                              the title.
                          trickplay:
                            type: string
                            description: >-
                              The URI of the `X.trickplay` directory, as
                              `claim://`, `nfs://`, or `https://`, resolved
                              like `uri`. While you scrub, the display shows
                              the tile for the position under the cursor.
                          appearances:
                            type: string
                            description: >-
                              The URI of the file that lists when each credited
                              person is on screen, as `claim://`, `nfs://`, or
                              `https://`, resolved like `uri`. library-operator
                              writes it as `X.spans.json` in
                              `.liken/appearances/` beside the video. When the
                              film pauses, the display shows the people on
                              screen at that moment.
                          contributors:
                            type: string
                            description: >-
                              The URI of the library's `.contributors`
                              directory, as `claim://`, `nfs://`, or
                              `https://`, resolved like `uri`. The
                              `appearances` file names each person's portrait
                              by its path under this directory.
                          marks:
                            type: array
                            x-kubernetes-list-type: atomic
                            description: >-
                              Where the intro, the recap, the credits, a scene
                              after the credits, and a preview are in the
                              file. The list can hold several spans of one
                              kind, and the display merges spans that overlap
                              into one, from their median start and median
                              end. While the playhead is in an intro or a
                              recap, the display shows a skip control. It
                              shows over the bare video for the first 10
                              seconds of the span, and select there skips.
                              After that it shows only with the OSD, which up
                              or down opens with the control focused. Credits count
                              only when they start in the second half of the
                              item. A scene after the credits is a
                              `post-credits` span or the gap between two
                              `credits` spans, and during the credits before
                              it the display offers to skip to the scene.
                              Select takes that offer only while the OSD is
                              visible. The marks also set when the up-next
                              card appears, as the `next` field describes.
                            items:
                              type: object
                              required: [kind]
                              properties:
                                kind:
                                  type: string
                                  description: >-
                                    What the span is: `intro`, `recap`,
                                    `credits`, `post-credits` (the scene after
                                    the credits), or `preview`. The display
                                    ignores any other kind.
                                start:
                                  type: number
                                  minimum: 0
                                  description: >-
                                    Where the span starts, in seconds from the
                                    start of the file. Omit it for a span that
                                    starts with the file.
                                end:
                                  type: number
                                  minimum: 0
                                  description: >-
                                    Where the span ends, in seconds from the
                                    start of the file. Omit it for a span that
                                    ends with the file.
                                source:
                                  type: string
                                  description: >-
                                    The database that the span came from, such
                                    as `theintrodb`. The display does not read
                                    it.
                          subtitles:
                            type: array
                            x-kubernetes-list-type: atomic
                            description: >-
                              The number of subtitle events in each subtitle
                              track of the item, which library-operator writes
                              from its probe because mpv does not report it.
                              The command sidecar uses the counts to choose a
                              subtitle track when the file's flags are wrong.
                              It never chooses a track with no events. It
                              treats a track with fewer than a fifth as many
                              events as the largest track in its language as
                              forced, even when no flag or title says so. A
                              track with no entry here is judged by its flags,
                              title, and file name alone. An entry for an
                              image track can also carry `image`, the
                              measurement that the display uses to place the
                              track.
                            items:
                              type: object
                              description: >-
                                What the library measured of one track. Set
                                exactly one of `stream` and `file` to identify
                                the track.
                              oneOf:
                                - required: [stream]
                                - required: [file]
                              properties:
                                stream:
                                  type: integer
                                  minimum: 0
                                  description: >-
                                    The index of an embedded track in its
                                    container: the stream index from ffprobe,
                                    which is mpv's `ff-index`.
                                file:
                                  type: string
                                  minLength: 1
                                  description: >-
                                    The base name of an external subtitle file
                                    beside the media, such as
                                    `Movie.en.hi.srt`, matched against the
                                    track's file name as written.
                                events:
                                  type: integer
                                  format: int64
                                  minimum: 0
                                  description: >-
                                    The number of subtitle events in the
                                    track. Omit it when the count is unknown,
                                    which is not the same as 0.
                                image:
                                  type: object
                                  description: >-
                                    Where an image track draws its text and
                                    how tall the text is, which
                                    library-operator measures from a sample of
                                    the track's cues. The display uses it to
                                    move the track's last line to the same row
                                    as a text track's and to shrink the line to
                                    the same height. Set it only for an image
                                    track, such as a PGS track of a Blu-ray or
                                    a VobSub track of a DVD. Omit it for a
                                    track that is not measured, and the display
                                    draws the track where the disc placed it.
                                    Every number is in rows of the track's own
                                    canvas.
                                  required: [canvasHeight, lineHeight, inkBottom]
                                  properties:
                                    canvasHeight:
                                      type: integer
                                      minimum: 1
                                      description: >-
                                        The height of the track's canvas, such
                                        as `1080` for a Blu-ray.
                                    lineHeight:
                                      type: integer
                                      minimum: 1
                                      description: >-
                                        The height of one line of the track's
                                        text, from the top of its tallest letter
                                        to the bottom of its lowest.
                                    inkBottom:
                                      type: integer
                                      minimum: 1
                                      description: >-
                                        The row just below the last line of a
                                        usual cue at the bottom of the canvas.
                start:
                  type: string
                  description: >-
                    Where the first item starts, as a time that mpv accepts,
                    such as `0:10:00` or `600`. When omitted, the first item
                    starts at its beginning. Later items always start at
                    their beginning. To resume, create a Play with the
                    `status.position` that the earlier Play reported.
                next:
                  type: object
                  description: >-
                    The work to offer after this run, such as the next
                    episode. The display shows it as a chip on the scrubber
                    and as a card near the end of the run, and a Play with no
                    `next` offers nothing. When a person selects the offer,
                    the display publishes `request` on the Player's commands
                    topic, and the program that wrote the Play reads it there
                    and creates the next Play.

                    The card appears at the start of the credits, or after the
                    scene that follows them, when the item's `marks` put the
                    credits in its second half. Otherwise it appears when 4%
                    of a film or 4 minutes remain, or 2.5% of an episode or 2
                    minutes remain, whichever is less. An episode is an item
                    whose presentation sets `series`. The card never appears
                    before the point where the work counts as watched, 5% or 5
                    minutes before the end, whichever is less. It hides after
                    5 seconds, and a press that shows the OSD shows it again.
                    With the OSD hidden, select takes the card, unless a skip
                    control is also showing.

                    When the compositor supports the `liken_arrangement_v1`
                    protocol, the film moves into the left half of the screen
                    when its card appears, and the display shows the next work
                    in the right half until a press or the end of the file.
                    Back with the OSD hidden returns the film to the whole
                    screen, and a second back ends the run. In either layout,
                    select fades the offer out and pauses the film, so its
                    sound stops at the press.
                  properties:
                    reason:
                      type: string
                      description: >-
                        The first line of the card: why this work follows,
                        such as "Next in The Saga". The display draws it in
                        uppercase.
                    title:
                      type: string
                      description: >-
                        The second line of the card: the name of the work that
                        follows. The chip shows only this line.
                    detail:
                      type: string
                      description: >-
                        The third line of the card, under the title: the
                        series and the season, or the year and the runtime.
                        The display draws it as given.
                    remainingSeconds:
                      type: integer
                      format: int64
                      minimum: 0
                      description: >-
                        How long the work that follows will run, in seconds,
                        from where it would start: the length of its file,
                        minus the position where the viewer stopped in it
                        before. The offer shows a line under the detail, such
                        as "46m · ends at 10:42 pm", with the time of day the
                        work would end if it started now. Under 60 seconds,
                        the line shows only the end time. When omitted, the
                        offer shows no such line.
                    art:
                      type: string
                      description: >-
                        The art of the work that follows, as a `claim://`,
                        `nfs://`, or `https://` URI, resolved like an item's
                        art. The display fits it inside the card's box and
                        keeps its aspect ratio, so a poster is letterboxed.
                    request:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: >-
                        Any object. The operator does not read it. When a
                        person selects the offer, the display publishes it
                        unchanged on the Player's commands topic, so the
                        program that wrote the Play gets back what it offered
                        and needs no record of its own.
                trickplayInterval:
                  type: string
                  description: >-
                    How many seconds one trickplay tile covers, as a Go
                    duration such as `10s`. Jellyfin writes no manifest beside
                    the sheets, so the Play declares it. When omitted, it is
                    `10s`, the Jellyfin default.
                ttlSecondsAfterFinished:
                  type: integer
                  format: int64
                  minimum: 0
                  description: >-
                    How many seconds the Play remains after it finishes, as
                    for a Job, so `kubectl get plays` shows what just played
                    and where it stopped. The default is 300, and 0 deletes
                    the Play as soon as it finishes. The operator deletes the
                    playback pod when the run finishes, whatever this value
                    is.
                audioLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    Overrides the Player's audio language order for this Play.
                    Omit it to use the Player's.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitleLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  maxItems: 10
                  description: >-
                    Overrides the Player's subtitle language order for this
                    Play. Omit it to use the Player's.
                  items:
                    type: string
                    pattern: '^[a-z]{2,3}(-[A-Za-z]{2,4})?$'
                subtitles:
                  type: string
                  enum: ["on", "off", "auto"]
                  description: >-
                    Overrides the Player's setting for when subtitles show.
                    Omit it to use the Player's.
                sdh:
                  type: string
                  enum: [prefer, avoid]
                  description: >-
                    Overrides the Player's setting for whether an SDH track
                    ranks ahead of a full track in the same language. Omit it
                    to use the Player's.
            status:
              type: object
              description: >-
                What the playback pod is doing. media-operator writes this
                from what the pod reports to it.
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Finished, Failed]
                  description: >-
                    Where the run is in its lifecycle. `Pending` means not yet
                    playing, `Running` means playing or paused, and `Finished`
                    and `Failed` are the ends. The phase only moves forward,
                    so a pause shows in `paused` and `activity`, not here.
                activity:
                  type: string
                  enum: [Starting, Playing, Paused, Finished, Failed]
                  description: >-
                    What the Play is doing now, for reading at a glance.
                    `Starting` is the `Pending` phase, `Playing` and `Paused`
                    are the `Running` phase, and `Finished` and `Failed` match
                    the phase.
                paused:
                  type: boolean
                  description: >-
                    True while the current item is paused.
                item:
                  type: integer
                  description: >-
                    The position in `spec.items` of the item that plays now,
                    counting from 1.
                position:
                  type: string
                  description: >-
                    The playhead in the current item, as H:MM:SS.
                duration:
                  type: string
                  description: >-
                    The length of the current item, as H:MM:SS, once mpv
                    has read it.
                pod:
                  type: string
                  description: >-
                    The name of the playback pod, for `kubectl describe` and
                    `kubectl logs`.
                message:
                  type: string
                  description: >-
                    Why the Play is in its phase, such as a URI that the
                    operator refused, a `Player` that does not exist, or a pod
                    that failed.
                finishedAt:
                  type: string
                  format: date-time
                  description: >-
                    When the operator first read the run's phase as
                    `Finished`.
                    `ttlSecondsAfterFinished` counts from this time, and a
                    restarted operator reads it back from here.
                audioLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  items:
                    type: string
                  description: >-
                    The audio language order that this run used, after the
                    operator combined the Play, the Player, and
                    MediaPreferences.
                subtitleLanguages:
                  type: array
                  x-kubernetes-list-type: atomic
                  items:
                    type: string
                  description: >-
                    The subtitle language order that this run used, after the
                    same combination.
                subtitles:
                  type: string
                  description: >-
                    The subtitle setting that this run used: `on`, `off`, or
                    `auto`.
                sdh:
                  type: string
                  description: >-
                    The SDH preference that this run used, `prefer` or
                    `avoid`. Empty when no Play, Player, or MediaPreferences
                    sets one.
                audioLanguage:
                  type: string
                  description: >-
                    The language tag of the audio track that mpv chose, as the
                    file has it, such as the ISO 639-2 code `eng` in a
                    Matroska file. Compare it with `audioLanguages` to see
                    whether a preference matched a track.
                subtitleLanguage:
                  type: string
                  description: >-
                    The language tag of the subtitle track that mpv chose, as
                    the file has it. Empty when no subtitles show.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  description: >-
                    The run's conditions. `DisplayAlive` reports the playback
                    pod's display container, the sidecar that draws the
                    on-screen display. It is `True` with reason `Running`
                    while the container runs, and `False` with reason
                    `Restarting` while the container is down after an exit.
                    After the first restart, the message gives the restart
                    count and the reason and exit code of the last exit.
                    After more than two restarts in one run, the operator sets
                    the phase to `Finished` with the same message. The
                    condition is absent until the display container starts.
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                        description: The condition's type, `DisplayAlive`.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: The condition's status.
                      reason:
                        type: string
                        description: >-
                          `Running` or `Restarting`.
                      message:
                        type: string
                        description: >-
                          The restart count, with the reason and exit code of
                          the last termination that the kubelet recorded.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When the status last changed between `True` and
                          `False`.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: >-
                          The `metadata.generation` of the Play when the
                          operator set the condition.
