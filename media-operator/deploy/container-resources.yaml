# The cpu and memory settings of every container that media-operator
# creates. kustomization.yaml generates the ConfigMap
# media-operator-resources from this file.
#
# Each entry has the shape of a container's resources block. The
# operator sets no cpu limit on any container, so it ignores
# limits.cpu and logs a line. When a value is missing, is not a
# Kubernetes quantity, or is below zero, or when limits.memory is zero,
# the operator logs a line and uses its built-in default, which is the
# value below. When requests.memory is above limits.memory, it uses the
# defaults of both.
#
# The requests are sized for a 1920x1080 screen, so that a playback pod
# and an idle pod can schedule together on a 1GB machine. The memory
# limits are sized for a 3840x2160 screen, so that a film on it is not
# killed. containerresources.go has the measurements.

# The playback pod: mpv, the on-screen display, and the command sidecar.
player:
  requests: {cpu: 80m, memory: 432Mi}
  limits: {memory: 1Gi}
display:
  requests: {cpu: 10m, memory: 144Mi}
  limits: {memory: 640Mi}
command:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {memory: 32Mi}

# The idle pod, which draws the idle screen while nothing plays.
idle:
  requests: {cpu: 5m, memory: 96Mi}
  limits: {memory: 256Mi}

# The pod of each Remote, which reads a controller's input.
reader:
  requests: {cpu: 1m, memory: 4Mi}
  limits: {memory: 16Mi}
