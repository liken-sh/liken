# The media API is one Deployment per cluster, beside the operator,
# that serves HTTPS for Players. Like the operator it controls no
# hardware. Unlike the operator it keeps no informer of Players: it
# reads one Player per request. Its screen routes redirect to
# display-operator's display-api, and its audio routes redirect to
# audio-operator's audio-api, because each of those owns its hardware
# and its capture rules. Its media routes call both and combine the
# screen and the sound into one muxed stream, which neither sibling can
# serve alone.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-api
  # Recreate keeps an update from running two pods at once. Two pods
  # would each create a CA and a serving certificate at first start and
  # race to write them. Each composed stream is an ffmpeg child of the
  # pod that serves it, so a second replica could not take one over.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media-api
    spec:
      serviceAccountName: media-api
      containers:
        - name: api
          # This is a separate image from the operator's, because the
          # composed stream is an ffmpeg mux and the operator's image is
          # a static binary on scratch with no ffmpeg in it.
          image: ghcr.io/liken-sh/media-operator-api:latest
          # api is another role of the operator's program, built with
          # the pod build tag.
          args: [api]
          env:
            # The HTTPS listener. The API serves TLS because every
            # request carries a Bearer token and the cluster network
            # does not encrypt traffic.
            - name: MEDIA_API_ADDRESS
              value: ":8443"
            # The metrics listener, on the metrics port that every
            # liken process uses.
            - name: MEDIA_METRICS_ADDRESS
              value: ":9200"
            # The base URLs of the sibling APIs. Every Location header
            # and every upstream request is built from them, so an owner
            # who exposes the APIs under public names changes only these
            # two variables.
            - name: MEDIA_API_DISPLAY_URL
              value: https://display-api.liken-system.svc
            - name: MEDIA_API_AUDIO_URL
              value: https://audio-api.liken-system.svc
            # The most composed streams that run at once, one ffmpeg
            # process each. Past that, the API responds 503 with the
            # capture-busy problem and a Retry-After header.
            - name: MEDIA_API_MAX_COMPOSITIONS
              value: "4"
            # The API reads its own pod for the image tag of the
            # container named api, which is the release it runs.
            # liken_build_info reports that release. The namespace
            # is also where the TLS Secret and the CA ConfigMaps are.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # One projected token for each sibling. Each sibling API
          # reviews the audience that it is named for and refuses a
          # token minted for another, so one token cannot call both. The
          # kubelet rewrites each file before its 10-minute lifetime
          # ends, and the API reads the file on every call.
          volumeMounts:
            - name: sibling-tokens
              mountPath: /var/run/secrets/liken.sh
              readOnly: true
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9200
          # /readyz returns 503 until startup has loaded the TLS pair and
          # sent one TokenReview that the API server answered, and then
          # 200 for the life of the process. A probe does not call the
          # API server, so a later TokenReview failure shows in a metric
          # and a log line and does not remove the pod from the Service.
          # When the startup TokenReview fails, the pod stays unready
          # until it restarts.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          # The memory limit is sized for the four composed streams that
          # MEDIA_API_MAX_COMPOSITIONS allows. On cgroup v2, which every
          # liken machine runs, an ffmpeg that exceeds the container
          # limit kills the whole container cgroup, so one oversized
          # stream would restart the API and end every composed stream.
          # There is no cpu limit, because throttling a mux delays the
          # stream.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: sibling-tokens
          projected:
            sources:
              - serviceAccountToken:
                  audience: display-api
                  expirationSeconds: 600
                  path: display-api/token
              - serviceAccountToken:
                  audience: audio-api
                  expirationSeconds: 600
                  path: audio-api/token
---
# The Service that clients use to reach the API. Port 443 is the port
# that a caller gives to a port-forward, and the port that a sibling's
# Location header implies.
apiVersion: v1
kind: Service
metadata:
  name: media-api
spec:
  selector:
    app: media-api
  ports:
    - name: https
      port: 443
      targetPort: https
---
# The API's own identity. It calls the siblings under this
# ServiceAccount for a composed stream. A redirect carries no
# credentials, so the client follows it with its own token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-api
---
# system:auth-delegator is the built-in ClusterRole for a server that
# creates a TokenReview and a SubjectAccessReview, which this API does
# for every request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-api-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-api
rules:
  # Only get, with no list or watch. The API reads one Player per
  # request, so a change to status.screen changes the next redirect and
  # no cache needs invalidating.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get]
  # Every request that produces bytes writes a Captured Event on the
  # Player, so kubectl describe player shows who captured and when. When
  # the same caller requests the same capture again within ten minutes,
  # the API patches the count and lastTimestamp of the existing Event.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The subresources that the siblings check when this API calls them
  # for a composed stream. Because the API holds these grants on the
  # Display and the Sink, a caller needs only players/media.
  - apiGroups: [display.liken.sh]
    resources: [displays/screen]
    verbs: [get]
  - apiGroups: [audio.liken.sh]
    resources: [sinks/audio]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-api
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
# The grants in liken-system. Each of the three APIs has its own CA. This
# API's serving key and certificate are in the Secret media-api-tls and
# its CA certificate is in the ConfigMap media-api-ca, and the siblings
# publish theirs the same way. The API never overwrites a pair that
# exists, so an owner with a CA replaces both objects and the API
# serves what it finds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-api
rules:
  # The CA ConfigMaps of this API and of the two siblings, watched so
  # that a CA rotation reaches the next connection without a restart.
  # resourceNames works for list and watch here, because each request
  # selects one ConfigMap with the field selector metadata.name, and
  # RBAC reads the name from that selector. client-go's reflector reads
  # each ConfigMap with a streaming list, which is a watch, and falls
  # back to a list when the API server refuses one.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [display-api-ca, audio-api-ca, media-api-ca]
    verbs: [list, watch]
  # create has no resourceNames, because RBAC cannot read a name from
  # a create request. When another pod created the object first, the
  # API reads that object.
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [create]
  # The update is the first step of a rotation: it appends the new CA
  # to ca.crt, and the API switches the serving certificate only after
  # every client has read it. The get checks whether the ConfigMap
  # exists before the API creates it.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [media-api-ca]
    verbs: [get, update]
  # The serving key and certificate, which the API replaces when less
  # than a third of the certificate's lifetime remains. The watch lets
  # the API serve a pair that an owner or another pod wrote without a
  # restart, and the API lists the Secret again after a 410 Gone.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [media-api-tls]
    verbs: [get, list, update, watch]
  # No resourceNames, because a Deployment generates its pod names, so
  # they are unknown when this file is written. The API reads only its
  # own pod, for the tag of its own image.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-api
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
# The role that a cluster owner binds to grant capture. RBAC does not
# check that a subresource exists, so a rule can name players/screen,
# players/audio, and players/media although the Kubernetes API server
# serves none of them. media-api checks them with a SubjectAccessReview
# for each request. An owner binds this ClusterRole in a namespace to give a
# subject capture, or writes one rule with resourceNames. A grant of
# players/media on a Player covers that Player's Display and Sinks,
# because the API calls the siblings under its own ServiceAccount for a
# composed stream.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-capture-viewer
rules:
  - apiGroups: [media.liken.sh]
    resources: [players/screen, players/audio, players/media]
    verbs: [get]
  # The info route reads the Player itself, so a subject bound to this
  # role alone can ask what a Player resolves before it requests a
  # capture. Without this rule, the manual's recipe needs a second role.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get]
