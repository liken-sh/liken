# The media API: one Deployment per cluster, beside the operator, that
# answers HTTPS for a Player. Like the operator it holds no hardware,
# and unlike the operator it runs no informer: it reads one Player per
# request and nothing else. Its screen routes redirect to the display
# operator's display-api and its audio routes redirect to the audio
# operator's audio-api, because each sibling owns its hardware and its
# capture rule. Its media routes compose the two into one muxed
# stream, the one thing no sibling can answer alone.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-api
  # Recreate, so two pods never run at once. Two pods would each mint
  # a CA and a serving leaf at first start and race to write them,
  # and a composition is bound to the one process that started its
  # ffmpeg, so a second replica could not take it over.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: media-api
    spec:
      serviceAccountName: media-api
      containers:
        - name: api
          # Its own image, not the operator's. The composed stream is
          # one ffmpeg mux, and the operator's image is a static
          # binary on scratch with no ffmpeg in it.
          image: ghcr.io/liken-sh/media-operator-api:latest
          # api is one more role of the same binary the operator runs.
          args: [api]
          env:
            # The HTTPS listener. The API serves TLS because a Bearer
            # token travels in every request and the cluster network
            # carries no encryption of its own.
            - name: MEDIA_API_ADDRESS
              value: ":8443"
            # The metrics listener, on the port milestone 65 assigns
            # every process in the organization. It answers whether or
            # not a Prometheus runs.
            - name: MEDIA_METRICS_ADDRESS
              value: ":9200"
            # The sibling base URLs. Every Location and every upstream
            # request is built from them, so an owner who exposes the
            # APIs under public names sets these two variables and
            # nothing else.
            - name: MEDIA_API_DISPLAY_URL
              value: https://display-api.liken-system.svc
            - name: MEDIA_API_AUDIO_URL
              value: https://audio-api.liken-system.svc
            # The composition limit, one ffmpeg process each. Past it
            # the API answers 503 capture-busy with Retry-After.
            - name: MEDIA_API_MAX_COMPOSITIONS
              value: "4"
            # The API reads its own pod for the tag of the container
            # named api, which is the release it runs. liken_build_info
            # reports that release, and every compiled document
            # carries it as its ETag. The namespace is also where the
            # TLS Secret and the CA ConfigMaps live.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # One projected token per sibling. Each public API reviews
          # the audience it is named for and refuses a token minted
          # for another, so one token cannot open both. Ten minutes is
          # the token's life; the kubelet rewrites the file before it
          # ends, and the API reads the file on every call.
          volumeMounts:
            - name: sibling-tokens
              mountPath: /var/run/secrets/liken.sh
              readOnly: true
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9200
          # /readyz is a latching startup check. It answers 200 once
          # the TLS pair is loaded and one TokenReview has reached the
          # API server and come back, and it never calls the API
          # server per probe. A later failure is a metric and a log
          # line, not a pod taken out of the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          # The limit is sized for four muxes at once. On cgroup v2,
          # which every liken machine runs, one ffmpeg over the
          # container limit kills the whole container cgroup, so one
          # oversized composition would restart the API and end every
          # composition with it.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: sibling-tokens
          projected:
            sources:
              - serviceAccountToken:
                  audience: display-api
                  expirationSeconds: 600
                  path: display-api/token
              - serviceAccountToken:
                  audience: audio-api
                  expirationSeconds: 600
                  path: audio-api/token
---
# Where a client reaches the API. 443 is the port a caller names in a
# port-forward, and the port a sibling's Location implies.
apiVersion: v1
kind: Service
metadata:
  name: media-api
spec:
  selector:
    app: media-api
  ports:
    - name: https
      port: 443
      targetPort: https
---
# The API's own identity. It calls the siblings under this
# ServiceAccount for a composed stream. A redirect carries no
# credentials: the client follows it with its own token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-api
---
# system:auth-delegator is the grant Kubernetes already names for a
# server that sends a TokenReview and a SubjectAccessReview, which
# this API does for every request.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-api-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-api
rules:
  # get alone, with no list or watch. The API reads one Player per
  # request, so a moved status.screen moves the next redirect and
  # there is no cache to invalidate.
  - apiGroups: [media.liken.sh]
    resources: [players]
    verbs: [get]
  # Every request that produces bytes writes a Captured Event on the
  # Player, so kubectl describe player answers who looked and when.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # The subresources the siblings check when this API calls them for
  # a composed stream. This is what lets a caller hold players/media
  # alone: the API holds the grants on the Display and the Sink.
  - apiGroups: [display.liken.sh]
    resources: [displays/screen]
    verbs: [get]
  - apiGroups: [audio.liken.sh]
    resources: [sinks/audio]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: media-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: media-api
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
# The namespaced half of the grant. One CA per domain: this API's
# serving pair lives in the Secret media-api-tls and its CA
# certificate in the ConfigMap media-api-ca, and the siblings publish
# theirs the same way. The API never overwrites a pair that exists,
# so an owner with a CA replaces both objects and the API serves what
# it finds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-api
rules:
  # The three CA ConfigMaps: this API's own and the two siblings'
  # anchors, watched so a rotation reaches the next connection with
  # no restart. Both verbs keep their resourceNames, because the watch
  # opens each ConfigMap's own path rather than the collection, and
  # RBAC reads a name from the request path.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [display-api-ca, audio-api-ca, media-api-ca]
    verbs: [get, watch]
  # create carries no resourceNames, because RBAC cannot read a name
  # off a create. A create that loses the race reads the winner.
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [create]
  # The update is the rotation's first step: the new CA appended to
  # ca.crt, and the leaf switched only after every client has read it.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [media-api-ca]
    verbs: [update]
  # The serving key and certificate, re-minted under a third of the
  # leaf's life. No watch: the keeper reads the pair at start and once
  # an hour after.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [media-api-tls]
    verbs: [get, update]
  # No resourceNames here, because a Deployment's pod name is
  # generated and not known when this file is written. The API reads
  # one pod, its own, for the tag of its own image.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-api
subjects:
  - kind: ServiceAccount
    name: media-api
    namespace: liken-system
---
# The grant a cluster owner binds. RBAC does not check that a
# subresource exists, so these three names authorize the three
# capture aspects although no API server serves them. An owner binds
# this ClusterRole per namespace to give a subject capture, or writes
# one rule with resourceNames. players/media on a Player is a grant on
# that Player's Display and Sinks, because the API calls the siblings
# under its own ServiceAccount for a composed stream.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: media-capture-viewer
rules:
  - apiGroups: [media.liken.sh]
    resources: [players/screen, players/audio, players/media]
    verbs: [get]
