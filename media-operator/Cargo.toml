# The Rust half of this component is one cargo workspace with two
# members: idle, the client this project ships, and display, the display
# a playback pod draws over the film. One workspace means one lock file,
# one toolchain pin, and one target tree, so a build resolves one set of
# versions and the image build caches one dependency layer. idle links
# media-screen, the bus half every screen client shares, by path from
# the top of the repository.
[workspace]
resolver = "3"
members = ["display", "idle"]

# The crates the members take. The versions are exact, and they are the
# same as media-screen's own, so the client and the library that reads
# the bus for it resolve the same rumqttc and the same serde.
#
# rumqttc speaks plain TCP to the broker, so its default features are off and
# no TLS stack enters either build.
[workspace.dependencies]
rumqttc = { version = "=0.25.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# The facade both crates report through, milestone 65's contract. media-screen
# touches only the macros; idle installs the recorder that gives them
# somewhere to go.
metrics = "=0.24.6"

# The measurements need optimized code with symbols the profile does not strip.
[profile.release]
opt-level = 3
lto = "thin"
