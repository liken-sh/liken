# The Rust code of media-operator is one workspace: idle, the idle
# screen, and display, which a playback pod draws over the film. One
# workspace has one lock file, one toolchain pin, and one target
# directory, so the members resolve the same versions and the image
# build caches one dependency layer. idle depends on ../media-screen,
# the message bus code that every screen client shares.
[workspace]
resolver = "3"
members = ["display", "idle"]

# The versions are exact and match media-screen's, so a member and
# media-screen resolve the same rumqttc and serde.
#
# rumqttc connects to the broker over plain TCP, so its default features
# are off and no build includes a TLS stack.
[workspace.dependencies]
rumqttc = { version = "=0.25.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# media-screen calls only the metrics macros, and idle installs the
# recorder that receives them.
metrics = "=0.24.6"

# The profile sets no `strip`, so the release binaries keep their
# symbol table.
[profile.release]
opt-level = 3
lto = "thin"
