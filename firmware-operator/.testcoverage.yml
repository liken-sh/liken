# The coverage gate that `make test-go` runs, locally and in CI.
#
# The threshold is just under the measured coverage, so a change that
# loses coverage fails. When a change gains coverage, raise the
# threshold to keep the gain.

profile: coverage.out

# Tests never call main(). The operator's main.go only creates the
# in-cluster clients, and the scan program's main.go only starts
# fwupdtool and sets the paths of its pod.
exclude:
  paths:
    - ^main\.go$
    - ^scan/main\.go$

threshold:
  # The uncovered statements are error paths of requests that the fake
  # API server never fails, a watch handler's report of an object that
  # does not convert, and the check in pass.go that ends a pass between
  # two Firmware objects on shutdown.
  total: 93
