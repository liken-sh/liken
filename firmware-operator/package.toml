# The Firmware and FirmwareCatalog kinds, and the operator that runs one short
# pod on a machine for each piece of work: an upload that writes
# firmware into a USB device that holds none of its own, each time the
# device appears, and a scan that reads which firmware each device
# keeps and which newer releases a catalog offers for it.
#
# Both images take the trust component's CA bundle. The operator reads
# each FirmwareCatalog's jcat and catalog file over HTTPS, and the scan image
# reads the catalog too. The operator verifies the API server with the
# CA in its ServiceAccount's token volume, not with the bundle.
[package]
name = "firmware-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "trust"]

[docs]
prefix = "firmware"

# gofmt, vet, a tidy check of go.mod, and one run of the tests that
# checks for races and writes the coverage profile, then the coverage
# gate on that profile. .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml: the formatters, the linters,
# and the hygiene checks. The jobs above run the tests and the
# coverage gates.
[[jobs]]
name = "prek"
toolchain = "prek"
# The go job runs the same checks as these hooks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# The image builds from this module's go.mod, which replaces the shared
# kubernetes module with ../kubernetes, so it takes that directory as a
# build context. The notices context holds the script that copies the
# license files of the modules the binary links.
[[outputs.images]]
name = "firmware-operator"
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

# The scan image holds fwupd from a dated Ubuntu snapshot and the scan
# program that the operator runs in a privileged pod on each machine.
# The snapshot is read over HTTPS, so the build takes the trust
# component's CA bundle.
[[outputs.images]]
name = "firmware-operator-scan"
file = "scan/Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }
