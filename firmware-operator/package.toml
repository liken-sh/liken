# The Firmware and FirmwareCatalog kinds, and the operator that runs a
# short pod on a machine for each piece of work. An upload pod writes
# firmware into a USB device that keeps none of its own, each time the
# device appears. A scan pod reads which firmware each device has and
# which newer releases a catalog offers for it.
#
# Both images include the CA bundle of the trust component, because
# the operator and the scan program download catalogs over HTTPS.
[package]
name = "firmware-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "toolchains", "trust", "vulkan"]

[docs]
prefix = "firmware"

# gofmt, go vet, a tidy check of go.mod, and one test run that checks
# for races and writes the coverage profile. Then the coverage gate
# checks that profile against the floor in .testcoverage.yml.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 15
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

# The hooks in .pre-commit-config.yaml, except the ones that the go
# job already runs.
[[jobs]]
name = "prek"
toolchain = "prek"
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the shared kubernetes module with ../kubernetes, so
# the build needs that directory as a context. The notices context
# provides the script that copies the license files of the linked
# modules.
[[outputs.images]]
name = "firmware-operator"
description = "firmware-operator, which uploads firmware to the USB devices that hold none, finds firmware updates, and applies the ones you approve."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }

# The scan image installs fwupd from the Debian snapshot of the base
# images. The build uses the vulkan directory as the context `builder`,
# for snapshot.sh, and vulkan's version as the snapshot date.
[[outputs.images]]
name = "firmware-operator-scan"
description = "fwupd and the scan program that firmware-operator runs on a machine to find, rehearse, and apply firmware updates."
file = "scan/Dockerfile"
contexts = { builder = "vulkan", kubernetes = "kubernetes", notices = "notices" }
versions = { SNAPSHOT = "vulkan" }
