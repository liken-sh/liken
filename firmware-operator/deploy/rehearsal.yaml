# A rehearsal pod downloads the catalog's jcat, its versioned file, and
# the approved cabinet over HTTPS. So this policy allows egress only to
# DNS and to TCP port 443, on any address, and no ingress. A catalog or
# cabinet on a mirror at another port needs another policy beside this
# one.
#
# A rehearsal pod is not privileged, but it mounts /sys/firmware from
# the host, which the baseline Pod Security level forbids. The API
# server admits it because liken-system has no Pod Security label.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firmware-rehearsal
spec:
  podSelector:
    matchLabels:
      firmware.liken.sh/rehearsal: "true"
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
