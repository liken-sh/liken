# firmware-operator runs as one unprivileged Deployment for the whole
# cluster. When a device that a Firmware matches appears, it starts an
# upload pod on that device's machine. It downloads each
# FirmwareCatalog's jcat over HTTPS, starts a scan pod on each Ready
# machine that needs a scan, and creates the Firmware objects that the
# scans discover. It keeps its state in object statuses and pods, so a
# restarted operator reads them and continues. The only state in
# memory is the index of each catalog file, which the operator
# downloads again after a restart.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firmware-operator
spec:
  # One replica is enough, because the kubelet restarts a crashed
  # operator. Two replicas are also safe, because only the copy that
  # holds the Lease firmware-operator acts, and the other takes over
  # when it stops. leader.go explains why two acting copies would break
  # the operator.
  replicas: 1
  selector:
    matchLabels:
      app: firmware-operator
  # A rollout starts the new pod beside the old one and stops the old
  # one only when the new one is running, so the new image is pulled
  # before the old pod stops. The new pod waits for the Lease until the
  # old pod releases it on SIGTERM, and then acquires it on its next
  # retry, within about 11 seconds.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: firmware-operator
    spec:
      serviceAccountName: firmware-operator
      # On SIGTERM, the operator finishes the writes for the Firmware
      # it is working on, and then releases the Lease. Each request has
      # a 15 s timeout, and a status write that fails with a conflict
      # reads the Firmware again and writes a second time. The release takes
      # up to 16 s: up to 11 s for client-go's election to end, then up
      # to 5 s to clear the Lease. So 60 s leaves 44 s for the writes.
      # When the pod is killed before it releases the Lease, a waiting
      # copy acquires it only after it expires, 30 to 41 s after the
      # last renewal.
      terminationGracePeriodSeconds: 60
      # While an apply pod writes firmware, the machine stays drained
      # until the operator removes spec.hold from the Disruption. So the
      # operator must be able to run on a drained machine.
      # machine-operator's drain does not evict a pod that tolerates the
      # cordon's taint, and the scheduler can place such a pod on the
      # cordoned machine. Without this toleration, when no other machine
      # can run the operator, the machine stays drained.
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      containers:
        - name: operator
          image: ghcr.io/liken-sh/firmware-operator:latest
          # Without --scan-image, the operator reads this container's
          # image from its own pod and runs its scan, rehearsal, and
          # apply pods from the image firmware-operator-scan at the same
          # tag, so pinning this image in the kustomization pins both.
          # --catalog-interval sets the time between downloads of a
          # FirmwareCatalog's jcat, an hour by default.
          env:
            # The operator starts its pods and keeps its Lease in
            # POD_NAMESPACE, and holds the Lease as POD_NAME. It exits
            # when either is unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # The operator caches its watches and an index of GUIDs and
          # releases for each catalog file. LVFS's catalog file
          # decompresses to tens of megabytes, but the operator reads it
          # as a stream and keeps only the index. Its memory use on a
          # cluster is not measured, so the limit only bounds a leak.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
