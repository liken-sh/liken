# The DeviceClass that an upload pod's claim requests. It selects the
# USB devices that machine-operator publishes, and the claim narrows
# it to one device by its address and device number.
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: firmware-upload
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].bus) &&
          device.attributes["liken.sh"].bus == "usb"
---
# The firmware is in the upload's image and the device is on USB, so an
# upload pod needs no network. With both policy types and no rules,
# this policy denies all ingress and egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firmware-upload
spec:
  podSelector:
    matchLabels:
      firmware.liken.sh/upload: "true"
  policyTypes: [Ingress, Egress]
