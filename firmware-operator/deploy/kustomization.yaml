# The kustomize base for firmware-operator. `liken` does not apply it.
# Apply it through your own GitOps with your own patches, or read it
# and write your own manifests.
#
# The base defines the FirmwareCatalog CRD and also declares the lvfs
# FirmwareCatalog. On a first `kubectl apply`, kubectl sends lvfs
# before the API server serves the new kind, and fails with "ensure
# CRDs are installed first". Apply the base a second time. Flux applies
# CRDs first and waits for them to be established.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The top-level namespace field would overwrite the namespace of every
# object. This transformer, with unsetOnly, sets liken-system only on
# an object that has no namespace. The API server ignores the namespace
# on the cluster-scoped objects.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - firmware-crd.yaml
  - firmwarecatalog-crd.yaml
  - rbac.yaml
  - operator.yaml
  - upload.yaml
  - scan.yaml
  - rehearsal.yaml
  - apply.yaml
  - lvfs.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: firmware-operator
      app.kubernetes.io/part-of: liken

# The operator derives the scan image from its own image and tag
# (images.go), so newTag here moves both images.
images:
  - name: ghcr.io/liken-sh/firmware-operator
    newTag: latest
