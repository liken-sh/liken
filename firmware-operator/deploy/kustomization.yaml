# The kustomize base for firmware-operator: the Firmware resource
# definition, the operator that runs the uploads, and the class and
# network policy of the upload pods.
#
# This base is for the cluster owner to take. `liken` does not apply
# it and does not name it. Take it through your own GitOps with
# patches of your own, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace is set with a transformer, not with the top-level
# namespace field, because unsetOnly keeps an object that states its
# own namespace where it belongs: the Events Role in default. The CRD
# and the DeviceClass are cluster-scoped, and the API server ignores a
# namespace on them.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

resources:
  - firmware-crd.yaml
  - rbac.yaml
  - operator.yaml
  - upload.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: firmware-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/firmware-operator
    newTag: latest
