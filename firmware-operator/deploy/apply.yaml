# The network policy of every apply pod. Before the drain, an apply pod
# rehearses the install again, so it resolves hosts with DNS and
# downloads the catalog's jcat, the catalog's versioned file, and the
# approved cabinet over HTTPS. The write after the drain needs no
# network. So the policy allows egress to port 53 and to TCP port 443
# on any address, and no ingress. A cabinet or catalog on a mirror that
# uses another port needs its own policy beside this one. A cluster with
# no network policy controller ignores this policy.
#
# An apply pod is not privileged, but it mounts a host path, which the
# baseline Pod Security level forbids. The API server admits it because
# liken-system has no Pod Security label.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firmware-apply
spec:
  podSelector:
    matchLabels:
      firmware.liken.sh/apply: "true"
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
