# A scan pod downloads the catalog's jcat and its versioned file over
# HTTPS. So this policy allows egress only to DNS and to TCP port 443,
# on any address, and no ingress. A FirmwareCatalog that points at a
# mirror on another port needs another policy beside this one.
#
# A scan pod is privileged, because fwupd reads SMBIOS tables,
# efivarfs, sysfs, and device nodes. The API server admits it because
# liken-system has no Pod Security label. A Pod Security level below
# privileged on liken-system rejects the scan pods.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: firmware-scan
spec:
  podSelector:
    matchLabels:
      firmware.liken.sh/scan: "true"
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
