# A Firmware is a rule for one device model. With upload, it writes
# firmware into the USB devices it matches, on any machine of the
# cluster, each time one appears. With update, it covers the devices
# that keep their firmware and that a catalog offers releases of one
# component for, and firmware-operator creates one such object for
# each component a scan finds. It is cluster-scoped because it
# describes a kind of device, the way a DeviceClass does, and a device
# can move from one machine to another. firmware-operator writes the
# status: one entry for each port where an upload rule matched a
# device, and one for each machine's device in an update rule's group.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firmwares.firmware.liken.sh
spec:
  group: firmware.liken.sh
  names:
    kind: Firmware
    listKind: FirmwareList
    plural: firmwares
    singular: firmware
    categories: [firmware]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec, and firmware-operator writes the
      # status.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Valid
          type: string
          jsonPath: .status.conditions[?(@.type=="Valid")].status
        - name: Loaded
          type: integer
          jsonPath: .status.counts.loaded
        - name: Running
          type: integer
          jsonPath: .status.counts.running
        - name: Failed
          type: integer
          jsonPath: .status.counts.failed
        - name: Conflict
          type: integer
          jsonPath: .status.counts.conflict
        - name: Machines
          type: integer
          jsonPath: .status.counts.machines
        - name: Behind
          type: integer
          jsonPath: .status.counts.behind
        - name: Version
          type: string
          jsonPath: .spec.update.version
        - name: Approved
          type: string
          jsonPath: .status.conditions[?(@.type=="Approved")].status
        - name: Pending
          type: integer
          jsonPath: .status.counts.pending
        - name: Rehearsed
          type: string
          jsonPath: .status.conditions[?(@.type=="Rehearsed")].status
        - name: Applied
          type: string
          jsonPath: .status.conditions[?(@.type=="Applied")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              # A rule loads a device that holds no firmware, or covers a
              # device that keeps its own, never both: an upload matches a
              # bare chip, and an update matches a device that already
              # runs firmware. selector and machines choose the devices of
              # an upload. An update chooses its devices by a catalog
              # component or by their GUIDs, and machines limits only an
              # approval, so it needs update.version.
              x-kubernetes-validations:
                - rule: has(self.upload) != has(self.update)
                  message: a Firmware has exactly one of upload and update
                - rule: "!has(self.upload) || has(self.selector)"
                  message: an upload needs a selector
                - rule: "!has(self.update) || !has(self.selector)"
                  message: selector belongs to upload; an update selects its devices by update.component or update.guids
                - rule: "!has(self.update) || !has(self.machines) || has(self.update.version)"
                  message: machines limits an approval, so an update with machines needs update.version
              properties:
                selector:
                  type: string
                  minLength: 1
                  description: >-
                    A CEL expression that selects the devices an upload
                    loads, with the same variables as a `DeviceClass`
                    selector, for example
                    `device.attributes["liken.sh"].vendor == "1618" &&
                    device.attributes["liken.sh"].product == "0920"`.
                    `firmware-operator` compiles it with the CEL
                    environment of Kubernetes' dynamic resource
                    allocation, so it means here what it means in a
                    `DeviceClass`. A selector that does not compile sets
                    `Valid` to `False`, and the rule runs nowhere.
                    Required with `upload`, and refused with `update`.
                machines:
                  type: object
                  description: >-
                    A label selector on `Machine` objects. An upload runs
                    only on the machines whose labels it selects, and an
                    approval in `update.version` covers only those
                    machines. Optional. With no value, the upload runs on
                    every machine, and the approval covers every machine.
                    Refused with an `update` that has no `version`.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: "Labels that a `Machine` must have, each with this value."
                    matchExpressions:
                      type: array
                      description: "Requirements on a `Machine`'s labels. A machine must meet all of them."
                      items:
                        type: object
                        required: [key, operator]
                        properties:
                          key:
                            type: string
                            description: "The label's key."
                          operator:
                            type: string
                            enum: [In, NotIn, Exists, DoesNotExist]
                            description: "How the label's values must compare with `values`."
                          values:
                            type: array
                            items:
                              type: string
                            description: "The values for `In` and `NotIn`. Empty for `Exists` and `DoesNotExist`."
                upload:
                  type: object
                  required: [image, command]
                  description: >-
                    The pod that writes the firmware into a device that
                    holds none of its own. `firmware-operator` runs it
                    once for each appearance of a matched device, on the
                    device's machine, with a claim on that one device.
                  properties:
                    image:
                      type: string
                      minLength: 1
                      description: >-
                        The image that holds the loader and the firmware
                        files, usually the vendor's own image, such as
                        `ghcr.io/liken-sh/indi-qhy`. The pod runs it as
                        user 1000 with no capabilities and a read-only
                        root file system.
                    command:
                      type: array
                      minItems: 1
                      items:
                        type: string
                      description: >-
                        The loader's command, such as `[fxload, -t, fx2,
                        -I, /lib/firmware/qhy/QHY5II.HEX, -D,
                        $(LIKEN_DEVICE)]`. The pod sets `LIKEN_DEVICE` to
                        the device's usbfs node,
                        `/dev/bus/usb/<bus>/<device>`, and Kubernetes
                        expands `$(LIKEN_DEVICE)` in the command. The
                        upload succeeds when the command exits 0 and the
                        bare device leaves the machine's
                        `ResourceSlice` within one minute.
                    args:
                      type: array
                      items:
                        type: string
                      description: "Arguments after the command. Kubernetes expands `$(LIKEN_DEVICE)` in them too. Optional."
                update:
                  type: object
                  x-kubernetes-validations:
                    - rule: has(self.component) != has(self.guids)
                      message: an update has exactly one of component and guids
                    - rule: has(self.version) == has(self.cabinet)
                      message: an approval needs both version and cabinet
                    - rule: "!has(self.version) || has(self.component)"
                      message: only an update of a component takes a version, because no catalog offers a release for a set of GUIDs
                  description: >-
                    Marks the rule for the firmware of a device that
                    keeps its own firmware, such as a board's UEFI
                    firmware or an SSD. `firmware-operator` creates one
                    such `Firmware` for each catalog component that a
                    scan finds a release of, and one for each set of
                    GUIDs of an updatable device with no release. Each
                    carries the label `firmware.liken.sh/discovered`.
                    `status.machines` records the version each machine
                    runs and the releases each `FirmwareCatalog` offers.
                    A person approves one release with `version` and
                    `cabinet`. The approval installs nothing.
                  properties:
                    component:
                      type: string
                      minLength: 1
                      description: >-
                        The ID of the catalog component, such as
                        `org.linuxfoundation.dbx.x64.firmware`. A device
                        belongs to the rule when a catalog offers it a
                        release of this component. A device keeps its
                        entry after it installs the newest release, by
                        its fwupd device ID. A discovered `Firmware` is
                        named by this ID with no top-level domain and no
                        `firmware` part, such as `microsoft-dbx-x64`, or
                        by the whole ID in lowercase when another
                        `Firmware` has that name.
                    guids:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
                      description: >-
                        The GUIDs that fwupd reports for a device that no
                        catalog offers a release for, sorted. A device
                        whose set of GUIDs is exactly this set belongs
                        to the rule, until a catalog offers it a
                        release. A discovered `Firmware` is named by the
                        device's name and eight hex digits of a hash of
                        this set, such as `uefi-ca-7420e8dc`.
                    version:
                      type: string
                      minLength: 1
                      description: >-
                        The version of the component that a person
                        approves, as `status.machines` lists it in a
                        release, such as `20260707`. Optional. It needs
                        `component` and `cabinet`. `firmware-operator`
                        answers it with the `Approved` condition and
                        `status.counts.pending`. With no value, the
                        `Firmware` approves nothing.
                    cabinet:
                      type: object
                      required: [url, sha256]
                      description: >-
                        The cabinet file of the approved release, copied
                        from the release in `status.machines`. Required
                        with `version`.
                      properties:
                        url:
                          type: string
                          pattern: "^https://"
                          description: >-
                            Where the cabinet downloads from. The
                            approval does not compare it with the
                            catalog's URL, so a mirror works.
                        sha256:
                          type: string
                          pattern: "^[0-9a-f]{64}$"
                          description: >-
                            The cabinet's SHA-256, in lowercase hex. It
                            pins the file the way a digest pins an image:
                            a catalog that offers the version in another
                            cabinet does not match the approval.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: "The generation of the spec that the status answers."
                conditions:
                  type: array
                  description: >-
                    An upload has `Valid`. It is `True` with the reason
                    `Compiled` when the selector and `spec.machines`
                    compile. It is `False` with the reason
                    `SelectorInvalid` when either one does not, and the
                    message gives the error. A rule that is not valid
                    runs nowhere. An update with `version` has
                    `Approved`, over the machines that `spec.machines`
                    covers. It is `True` with the reason `Offered` when a
                    catalog offers the version in the pinned cabinet to
                    at least one machine, and with `Installed` when none
                    is offered it and at least one runs it. It is `False`
                    with `CabinetDiffers` when a catalog offers the
                    version only in another cabinet, with `NotOffered`
                    when no catalog offers it, and with `MachinesInvalid`
                    when `spec.machines` does not compile. The message
                    names the machines. An approval that a catalog
                    offers to at least one machine also has `Rehearsed`,
                    over the rehearsals in `rehearsals`. It is `True`
                    with the reason `Passed` when the install passed its
                    rehearsal on every machine the approval waits for.
                    It is `False` with `Refused` when a rehearsal shows
                    that the install writes more than one authenticated
                    append, or that the variable store has no room for
                    it, and with `Failed` when a rehearsal could not
                    run. It is `Unknown` with `Rehearsing` while a
                    machine waits for its rehearsal. The message names
                    the machines. An approval with a machine that asked
                    for its reboot turn also has `Applied`, over the
                    records in `applies`. It is `True` with the reason
                    `Written` when the firmware took the update on every
                    machine the approval waits for. It is `False` with
                    `Refused` when the firmware refused the write on a
                    machine, and with `Failed` when a write could not
                    run, an apply pod ended before the signal to write,
                    a machine left its turn before the hold, or a
                    machine still reads the old version after its
                    reboot. It is `Unknown` with `Uncertain` when the
                    operator cannot tell whether a write landed, until
                    the scan after the machine's reboot answers, and
                    with `Applying` while a machine waits for its
                    rehearsal, its turn, or its write. The message names
                    the machines.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        description: "The condition's name."
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: "Whether the condition holds."
                      reason:
                        type: string
                        description: "One word for the cause."
                      message:
                        type: string
                        description: "The cause, for a person to read."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "The generation of the spec that the condition answers."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "When the status last changed."
                devices:
                  type: array
                  description: >-
                    One entry for each port, a machine and a USB address,
                    where the rule matched a device. The entry describes
                    the latest appearance of a device in the port, so the
                    list grows only with the number of ports. A `Loaded`
                    entry stays after the bare device leaves.
                  items:
                    type: object
                    required: [machine, device, address, deviceNumber, generation, result, time]
                    properties:
                      machine:
                        type: string
                        description: "The `Machine`, which has the name of its node."
                      device:
                        type: string
                        description: "The device's name in the machine's `ResourceSlice`."
                      address:
                        type: string
                        description: "The USB port path, such as `1-4.1.2`."
                      deviceNumber:
                        type: integer
                        format: int64
                        description: >-
                          The device number that the kernel gave this
                          appearance. A new number is a new appearance,
                          after a replug or a power cycle, and gets a new
                          upload.
                      generation:
                        type: integer
                        format: int64
                        description: "The generation of the rule that this entry ran. A new generation gets a new upload."
                      result:
                        type: string
                        enum: [Running, Loaded, Failed, Conflict]
                        description: >-
                          `Running` while the upload pod runs. `Loaded`
                          when the loader exited 0 and the bare device
                          left the slice. `Failed` when the loader failed,
                          the device stayed for a minute after it exited
                          0, the pod did not finish within five minutes,
                          or the pod is gone. `Conflict` when another rule
                          matches the same device, so neither runs. A
                          `Failed` upload does not run again until the
                          device appears again or the rule changes.
                      message:
                        type: string
                        description: "Why the entry has its result, such as the loader's exit code and the last line of its log."
                      time:
                        type: string
                        format: date-time
                        description: "When the entry got its result."
                machines:
                  type: array
                  description: >-
                    One entry for each machine's device in an update
                    rule's group, from that machine's last scan against
                    each `FirmwareCatalog`. A scan replaces its machine's entries.
                    An entry leaves only when the machine's next scan does
                    not report the device, or when its `Machine` is
                    deleted, so a machine that is off keeps its entries.
                  items:
                    type: object
                    required: [machine, device, catalog, file, time]
                    properties:
                      machine:
                        type: string
                        description: "The `Machine`, which has the name of its node."
                      device:
                        type: string
                        description: "The device's name, as fwupd reports it, such as `System Firmware`."
                      deviceId:
                        type: string
                        description: >-
                          fwupd's ID of the device on the machine. It
                          keeps the entry in its component's object
                          after the device installs the newest release.
                      version:
                        type: string
                        description: "The version of the firmware the device runs, as fwupd reports it."
                      catalog:
                        type: string
                        description: "The `FirmwareCatalog` the scan matched the device against."
                      file:
                        type: string
                        description: "The catalog file the scan read, such as `firmware-09138-stable.xml.zst`."
                      releases:
                        type: array
                        description: >-
                          Each release the catalog offers for the device,
                          newest first, as fwupd offered it. Empty when the
                          device runs the newest release the catalog has
                          for it.
                        items:
                          type: object
                          required: [version]
                          properties:
                            version:
                              type: string
                              description: "The release's version."
                            id:
                              type: string
                              description: "The AppStream ID of the catalog's component that offers the release."
                            urgency:
                              type: string
                              description: "How urgent the vendor says the release is, such as `high`."
                            cabinet:
                              type: object
                              required: [url, sha256]
                              description: "The cabinet file that carries the release."
                              properties:
                                url:
                                  type: string
                                  description: "Where the cabinet downloads from."
                                sha256:
                                  type: string
                                  description: "The cabinet's SHA-256, in hex."
                                size:
                                  type: integer
                                  format: int64
                                  description: "The size of the firmware payload the release installs, in bytes, as the catalog states it. The cabinet file is larger."
                      time:
                        type: string
                        format: date-time
                        description: "When the scan that reported the entry ended."
                rehearsals:
                  type: array
                  description: >-
                    One record for each machine that an approval waits
                    for, from the latest rehearsal of the approved
                    install on that machine. A rehearsal runs the
                    install against a copy of the machine's firmware
                    variables in memory, and records what it would
                    write. It runs once for each boot of the machine,
                    device, approved version and cabinet, and catalog
                    file. A record leaves when its machine is no longer
                    pending, or when the approval changes.
                  items:
                    type: object
                    required: [machine, boot, deviceId, version, cabinetSHA256, catalog, file, result, time]
                    properties:
                      machine:
                        type: string
                        description: "The `Machine`, which has the name of its node."
                      boot:
                        type: string
                        description: "The time the machine booted, from its `Machine`'s status, when the rehearsal started."
                      deviceId:
                        type: string
                        description: "fwupd's ID of the device the rehearsal installed on."
                      version:
                        type: string
                        description: "The approved version."
                      cabinetSHA256:
                        type: string
                        description: "The SHA-256 of the approved cabinet."
                      catalog:
                        type: string
                        description: "The `FirmwareCatalog` of the machine's last scan."
                      file:
                        type: string
                        description: "The catalog file the rehearsal loaded, which is the one the machine's last scan read."
                      result:
                        type: string
                        enum: [Running, Passed, Refused, Failed]
                        description: >-
                          `Running` while the rehearsal pod runs.
                          `Passed` when the install wrote one
                          authenticated append to its device's own
                          variable, nothing else, and the variable store
                          has room for it. `Refused` when the install
                          would write anything else, or the store has no
                          room. `Failed` when the rehearsal could not
                          run, such as a cabinet whose SHA-256 is not the
                          pinned one.
                      message:
                        type: string
                        description: "Why the rehearsal has its result."
                      append:
                        type: object
                        required: [variable, bytes, sha256]
                        description: "The one write that a passed rehearsal recorded."
                        properties:
                          variable:
                            type: string
                            description: "The variable, as efivarfs names its file, such as `dbx-d719b2cb-3d3a-4596-a3bc-dad00e67656f`."
                          bytes:
                            type: integer
                            format: int64
                            description: "The length of the write: four bytes of attributes, then the signed payload."
                          sha256:
                            type: string
                            description: "The SHA-256 of the write's bytes, in hex."
                      free:
                        type: integer
                        format: int64
                        description: "The bytes free in the machine's variable store when the rehearsal ran."
                      time:
                        type: string
                        format: date-time
                        description: "When the rehearsal got its result."
                applies:
                  type: array
                  description: >-
                    One record for each machine that an approval waits
                    for and whose rehearsal passed on the boot it runs.
                    The operator starts an apply pod on the machine,
                    which rehearses the install again while the cluster
                    is whole and then waits. When that prepare is done,
                    the pod's readiness probe turns it `Ready`, and the
                    operator files a `Disruption` with `spec.hold`, so
                    the turn stops after the drain. When
                    the turn holds, the operator sets the pod's
                    annotation `firmware.liken.sh/write` to `go`, and
                    the pod writes the recorded append to the real
                    variable with no network. The operator then removes
                    `spec.hold`, so the machine reboots. The machine's
                    next scan proves the write.
                    A record leaves when its machine is no longer
                    pending, or when the approval changes. The operator
                    does not write again after a refused or failed
                    record. A person who withdraws the approval and
                    approves it again removes the record, and the
                    machine rehearses and asks for its turn again.
                  items:
                    type: object
                    required: [machine, boot, version, cabinetSHA256, sha256, result, time]
                    properties:
                      machine:
                        type: string
                        description: "The `Machine`, which has the name of its node."
                      boot:
                        type: string
                        description: "The time the machine booted, from its `Machine`'s status, when its rehearsal passed."
                      version:
                        type: string
                        description: "The approved version."
                      cabinetSHA256:
                        type: string
                        description: "The SHA-256 of the approved cabinet."
                      sha256:
                        type: string
                        description: "The SHA-256 of the append that the rehearsal recorded, which is the only append the apply writes."
                      disruption:
                        type: string
                        description: "The `Disruption` that asks for the machine's reboot turn. It is absent while the apply pod prepares, because the operator files the request only when the pod is `Ready`."
                      result:
                        type: string
                        enum: [Waiting, Writing, Written, Uncertain, Refused, Failed]
                        description: >-
                          `Waiting` while the apply pod prepares, and
                          then while it waits for `machine-operator`
                          to drain the machine and hold its turn.
                          `Writing` after the operator sent the apply
                          pod the signal to write. `Written` when the
                          firmware took the append; the machine then
                          reboots, and the record stays until its next
                          scan. `Uncertain` when the apply pod ended
                          after the signal without saying whether it
                          wrote: it is gone, it ran past its deadline,
                          which counts from the signal, or it crashed.
                          The machine reboots in its turn all the
                          same, and its next scan reads what the
                          firmware holds. `Refused` when the firmware
                          refused the append, which changes nothing.
                          `Failed` when the apply could not run, the
                          apply pod ended or was gone before the
                          signal, the variables changed since the
                          rehearsal, the machine left its turn before
                          the hold, or the machine still reads the old
                          version after its reboot.
                      message:
                        type: string
                        description: "Why the record has its result."
                      time:
                        type: string
                        format: date-time
                        description: "When the record got its result."
                counts:
                  type: object
                  description: >-
                    The counts of the rule's own kind. An upload has the
                    number of entries in `devices` with each result. An
                    update has the machines that `machines` names, the
                    ones a catalog offers a release, and the ones an
                    approval waits for. A rule writes its own counts even
                    when they are 0, and never the other kind's, so the
                    other kind's printer columns stay empty.
                  properties:
                    running:
                      type: integer
                      description: "Entries that are `Running`."
                    loaded:
                      type: integer
                      description: "Entries that are `Loaded`."
                    failed:
                      type: integer
                      description: "Entries that are `Failed`."
                    conflict:
                      type: integer
                      description: "Entries that are `Conflict`."
                    machines:
                      type: integer
                      description: "The machines that `machines` names."
                    behind:
                      type: integer
                      description: "The machines with at least one release offered in `machines`."
                    pending:
                      type: integer
                      description: >-
                        The machines that an approval covers and waits
                        for: a catalog offers one of the machine's devices
                        the approved version in the pinned cabinet.
