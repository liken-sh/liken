---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: firmware-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: firmware-operator
rules:
  # The operator reconciles from its watch cache. It reads from the API
  # server with get only after a status write fails with a conflict,
  # and after the create of a discovered Firmware fails because the
  # Firmware already exists.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares, firmwarecatalogs]
    verbs: [get, list, watch]
  # The operator creates one Firmware for each group of devices that a
  # scan reports. It deletes that Firmware when no machine reports the
  # group any more, unless a person has edited its spec. It never
  # updates a spec, so any spec that differs from the one it created was
  # edited by a person.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares]
    verbs: [create, delete]
  # The operator replaces the whole status with a PUT, which needs
  # update.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares/status, firmwarecatalogs/status]
    verbs: [update]
  # The operator watches only the slices whose driver is liken.sh, but
  # RBAC cannot limit a field selector, so list and watch cover every
  # slice.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch]
  # The operator matches the labels of each Machine against
  # spec.machines.
  - apiGroups: [liken.sh]
    resources: [machines]
    verbs: [get, list, watch]
  # For an approved Secure Boot database update, the operator creates a
  # Disruption with spec.hold to request the machine's reboot turn. It
  # watches its own Disruptions by the label firmware.liken.sh/firmware,
  # and RBAC cannot limit a label selector, so list and watch cover
  # every Disruption. get reads a Disruption that the watch cache does
  # not have yet. patch removes spec.hold after the write, so the
  # machine reboots. delete withdraws the Disruption when the write was
  # refused or failed, or when the approval changed. The operator never
  # changes spec.approvedHash, and liken's admission policy
  # disruption-approvals.liken.sh refuses that change from any service
  # account.
  - apiGroups: [liken.sh]
    resources: [disruptions]
    verbs: [get, list, watch, create, patch, delete]
  # Firmware and FirmwareCatalog are cluster-scoped, and the API server
  # accepts an Event about a cluster-scoped object only in default or
  # kube-system, so the operator posts its Events in default. The grant
  # is in the ClusterRole so that it still covers default when the
  # operator is installed in another namespace. patch increments the
  # count of an Event that repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: firmware-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: firmware-operator
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
---
# The operator creates its upload, scan, rehearsal, and apply pods, and
# the claims of the upload pods, in its own namespace. It watches the
# pods by the labels firmware.liken.sh/upload, firmware.liken.sh/scan,
# firmware.liken.sh/rehearsal, and firmware.liken.sh/apply, and RBAC
# cannot limit a label selector, so list and watch cover every pod in
# the namespace. The operator patches and deletes only pods with one of
# these labels.
#
# get reads a pod after a create fails with a conflict, checks that a
# pod recorded as running still exists, and reads the operator's own
# pod to find its image, from which it derives the scan image. patch
# sets the annotation firmware.liken.sh/write that tells an apply pod
# to write. delete removes a pod after its result is in the status, and
# an apply pod that waits for a reboot turn that is no longer needed. pods/log reads the
# result line of a scan, rehearsal, or apply pod. An upload pod's claim
# has the pod as its owner, so the garbage collector deletes the claim
# with the pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firmware-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firmware-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firmware-operator
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
---
# The Lease firmware-operator elects which copy of the operator acts
# (leader.go). client-go's leader election reads the Lease with get,
# and takes, renews, and releases it with update.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firmware-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [firmware-operator]
    verbs: [get, update]
  # RBAC cannot match a name on a create request, so create has no
  # resourceNames.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firmware-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firmware-operator-lease
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
