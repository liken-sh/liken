# The operator's identity. It reads every Firmware, every FirmwareCatalog,
# every slice that machine-operator publishes, and every Machine, and
# writes the status of each Firmware and each FirmwareCatalog. It creates and
# deletes the discovered Firmware objects. It creates, reads, and
# deletes the upload pods and their claims and the scan pods in its own
# namespace, reads each scan pod's log, and posts the Events about each
# Firmware and each FirmwareCatalog.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: firmware-operator
---
# A ClusterRole for the cluster-scoped kinds: a Firmware, a FirmwareCatalog, a
# ResourceSlice, and a Machine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: firmware-operator
rules:
  # The watches wake the pass, and the pass reads each Firmware and
  # each FirmwareCatalog from the watch's store. get reads one again after a
  # status write that met a conflict, and reads a discovered Firmware
  # whose create met one that exists.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares, firmwarecatalogs]
    verbs: [get, list, watch]
  # The operator creates one Firmware for each device model a scan
  # reports, and deletes it when no machine's entry is left and nobody
  # changed its spec. It never updates a spec: a spec it wrote is the
  # one in its create.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares]
    verbs: [create, delete]
  # The status is the one thing the operator writes to an object it did
  # not create. It replaces the whole status with a PUT, which is the
  # update verb.
  - apiGroups: [firmware.liken.sh]
    resources: [firmwares/status, firmwarecatalogs/status]
    verbs: [update]
  # Each machine's devices. The watch selects the slices whose driver is
  # liken.sh with a field selector, which needs list and watch on every
  # slice.
  - apiGroups: [resource.k8s.io]
    resources: [resourceslices]
    verbs: [get, list, watch]
  # The labels that spec.machines selects.
  - apiGroups: [liken.sh]
    resources: [machines]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: firmware-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: firmware-operator
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
---
# The upload pods and their claims, and the scan pods, which run in
# the operator's own namespace. The watches select the pods by the
# labels firmware.liken.sh/upload and firmware.liken.sh/scan, and a
# watch by label selector needs list and watch on every pod in the
# namespace. get reads a pod after a create that met a conflict, checks
# that a Running upload's or scan's pod still exists, and reads the
# operator's own pod for the image the scan image is named from. delete
# removes a pod after its result is in the status, and the garbage
# collector deletes an upload pod's claim. The operator deletes only a
# pod that carries one of the two labels. pods/log reads the result
# line a scan pod writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firmware-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firmware-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firmware-operator
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
---
# The Events about a Firmware and a FirmwareCatalog: one for each change of a
# condition, each upload or scan and its result, and each discovered
# model and offered release. Both kinds are cluster-scoped, and the API
# server takes an Event about a cluster-scoped object only in default
# or kube-system, so this Role grants the one namespace the operator
# posts to. patch counts a repeat
# on the Event it repeats.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firmware-operator-events
  namespace: default
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firmware-operator-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firmware-operator-events
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
---
# The Lease that elects the one copy of the operator that acts
# (leader.go). client-go's election reads the Lease with a get, takes
# and renews it with an update, and releases it with an update. A
# namespaced Role, because the Lease is in the operator's own namespace,
# and the operator has no reason to read any other Lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: firmware-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [firmware-operator]
    verbs: [get, update]
  # create carries no resourceNames, because RBAC cannot read a name off
  # a create. The first copy to start creates the Lease.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: firmware-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: firmware-operator-lease
subjects:
  - kind: ServiceAccount
    name: firmware-operator
    namespace: liken-system
