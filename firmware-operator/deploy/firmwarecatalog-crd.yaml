# A FirmwareCatalog is a source of firmware releases, such as the Linux
# Vendor Firmware Service (LVFS). firmware-operator reads the catalog's
# jcat to find its current file, and then runs fwupd in a short pod on
# each Ready machine to scan the machine's devices against that file.
# The kind is cluster-scoped because a catalog serves every machine in
# the cluster.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: firmwarecatalogs.firmware.liken.sh
spec:
  group: firmware.liken.sh
  names:
    kind: FirmwareCatalog
    listKind: FirmwareCatalogList
    plural: firmwarecatalogs
    singular: firmwarecatalog
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource keeps firmware-operator's status writes
      # and a person's spec edits from overwriting each other.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: File
          type: string
          jsonPath: .status.file
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Checked
          type: date
          jsonPath: .status.checked
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  pattern: "^https?://"
                  description: >-
                    The catalog's unversioned URL, such as
                    `https://cdn.fwupd.org/downloads/firmware.xml.zst`.
                    The jcat is at the same URL with `.jcat` added, and it
                    lists the versioned file in the same directory, such
                    as `firmware-09138-stable.xml.zst`.
                    `firmware-operator` and each scan pod read the
                    versioned file, because a CDN can serve an older copy
                    at the unversioned URL for hours. A mirror for a
                    cluster with no route to the internet must serve all
                    three files under its own URL.
                trust:
                  type: object
                  required: [configMapRef]
                  description: >-
                    The certificates that verify a catalog that the LVFS
                    did not sign, such as a vendor's own catalog. fwupd
                    refreshes only from a catalog whose jcat it can
                    verify with a trusted key, and the scan image trusts
                    only the LVFS's keys. Each scan, rehearsal, and apply
                    pod mounts the ConfigMap in `configMapRef` and, before
                    it reads the catalog, copies every key of the
                    ConfigMap into fwupd's trusted keys, next to the
                    LVFS's keys. fwupd reads a key's file extension to
                    tell what kind of certificate it is, so name each key
                    for its format, such as `signer.pem`. Omit this field
                    for the LVFS.
                  properties:
                    configMapRef:
                      type: object
                      required: [name]
                      description: >-
                        The ConfigMap, in the namespace of
                        `firmware-operator`, that contains the certificates.
                        When the ConfigMap does not exist, the pod does
                        not start and its scan fails at its deadline.
                      properties:
                        name:
                          type: string
                          minLength: 1
            status:
              type: object
              properties:
                file:
                  type: string
                  description: >-
                    The versioned file that the jcat named at the last
                    successful read. The scans read this file. A failed
                    read leaves it unchanged.
                sha256:
                  type: string
                  description: "The SHA-256 of `file`, from the jcat. `firmware-operator` verifies the file against it."
                etag:
                  type: string
                  description: >-
                    The `ETag` of the jcat at the last successful read.
                    The next read sends it in `If-None-Match`, so when
                    the jcat has not changed the server returns `304 Not
                    Modified` with no body.
                checked:
                  type: string
                  format: date-time
                  description: >-
                    When `firmware-operator` last read the jcat. The LVFS
                    publishes no feed of its changes, so
                    `firmware-operator` reads the jcat again at the
                    interval of its `--catalog-interval` flag, one hour
                    by default. It also reads the jcat at once when the
                    spec of the `FirmwareCatalog` changes or a scan
                    reports `CatalogMoved`.
                conditions:
                  type: array
                  description: >-
                    `Ready` is `True` with the reason `Fetched` when the
                    last read of the jcat and of the file it lists
                    succeeded. It is `False` with the reason
                    `JcatUnreadable` or `FileUnreadable` when a read
                    failed, and `ChecksumMismatch` when the file's SHA-256
                    differs from the jcat's. The message gives the error.
                    No scan starts while `Ready` is `False`.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        description: "The condition's name."
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: "Whether the condition is true, false, or not yet known."
                      reason:
                        type: string
                        description: "A one-word reason for the status."
                      message:
                        type: string
                        description: "A sentence that explains the reason, for a person to read."
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "The `metadata.generation` of the spec that the condition was computed from."
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: "When the status last changed."
                machines:
                  type: array
                  description: >-
                    The last scan of each machine against this catalog.
                    `firmware-operator` scans a Ready machine again when
                    the machine reboots, when the device names in its
                    `ResourceSlice` objects change, when the scan image
                    changes, or when the catalog's file changes and
                    offers different releases for the GUIDs that the
                    machine reported. After a `Failed` scan, it does not
                    scan the machine again until one of these changes. A
                    scan whose pod the kubelet ended for a reason other
                    than a node shutdown, such as an eviction, did not
                    fail. It runs again in a new pod while the machine
                    still needs the same scan, at most five pods for one
                    scan.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [machine]
                  items:
                    type: object
                    required: [machine, devices, file, result, time]
                    properties:
                      machine:
                        type: string
                        description: "The name of the `Machine`, which is also the name of its node."
                      boot:
                        type: string
                        format: date-time
                        description: "The `status.boot.time` of the `Machine` when the scan started."
                      devices:
                        type: string
                        description: >-
                          A hash of the device names in the machine's
                          `ResourceSlice` objects when the scan started.
                          The hash leaves out device numbers, so unplugging
                          a device and plugging it in again does not change
                          it.
                      file:
                        type: string
                        description: "The catalog file that the scan read."
                      image:
                        type: string
                        description: >-
                          The scan image that ran the scan. A newer image
                          can find devices and releases that an older one
                          did not, so `firmware-operator` scans the machine
                          again when its scan image changes.
                      releases:
                        type: string
                        description: >-
                          A hash of the releases that `file` offers for
                          `guids`. When the catalog moves to a new file with
                          the same hash, `firmware-operator` writes the new
                          file to `file` and does not scan again.
                      guids:
                        type: array
                        items:
                          type: string
                        description: "The GUIDs of every updatable device that the machine reported in its last scan that finished."
                      result:
                        type: string
                        enum: [Running, Scanned, Failed, CatalogMoved]
                        description: >-
                          `Running` while the scan pod runs, and while
                          `firmware-operator` waits to run the scan again
                          in a new pod after the kubelet ended its pod for
                          a reason other than a node shutdown.
                          `Scanned`
                          when the scan finished, and the `Firmware`
                          objects that `firmware-operator` created describe
                          its devices. `Failed` when the scan failed, did
                          not finish within ten minutes of the pod's
                          creation, or its pod was deleted, or when the
                          kubelet ended its pod at a node shutdown or ended
                          its fifth pod. `CatalogMoved`
                          when the jcat named a different file from the one
                          the scan was given, and `firmware-operator` then
                          reads the jcat at once.
                      message:
                        type: string
                        description: "A summary of the result, such as `4 devices, no updates`, or the reason the scan failed."
                      time:
                        type: string
                        format: date-time
                        description: "When `result` was last set."
