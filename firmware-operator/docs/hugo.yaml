# The configuration of the firmware-operator manual. The theme is
# brand/, at the top of this repository, which every liken site uses.
baseURL: https://liken.sh/firmware/

# The crdref generator writes a raw HTML span with an id on each
# field's row of a reference page, so a link can go to one field.
# Goldmark removes raw HTML unless this is set. Everything this site
# renders is authored in this repository, so raw HTML is safe.
markup:
  goldmark:
    renderer:
      unsafe: true
title: firmware-operator
# Hugo finds a theme by name under themesDir, so the site builds with
# brand/ from the same commit.
themesDir: ../..
theme: brand

# The theme's navigation shows a repository link from this URL, and
# the sidebar heading uses the last segment of the URL as the
# project's name.
params:
  repository: https://github.com/liken-sh/liken/tree/main/firmware-operator
  # The site serves the test coverage report at /coverage.html. This
  # parameter adds a footer link to it on every page.
  coverage: true

# The site is a manual, so it has no taxonomies and no feeds. The
# sitemap stays because crawlers use it.
disableKinds: [taxonomy, term, rss]

# Every page is published as HTML for people and as its authored
# Markdown for agents and scripts, side by side, so the Markdown of / is
# /index.md. The theme writes the Markdown only when the site declares
# this output format (brand/theme.md).
outputFormats:
  markdown:
    # Hugo already defines the media type text/markdown with the md
    # suffix.
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the manifests of deploy/ as raw YAML at
# /deploy/<file>.yaml, so `kubectl apply -f` and a Kustomization can
# use the URLs and an install needs no clone. Declaring any mount
# replaces the site's default mounts, so the content mount is declared
# again. The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
