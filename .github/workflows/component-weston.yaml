# This file is generated from weston/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches weston. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs. The images job builds each image and runs
# its smoke check.
#
# The plan names the jobs and the images that read the change, and
# only those run, in a run that publishes too. A run that publishes also
# runs each image that reads the VERSION build argument, because the
# publish gives it a new version. ci.yaml calls this workflow a
# second time for the publish job, after every check that ran here and
# in this component's closure passed.
#
# The name carries the component- prefix because the ci component would
# otherwise share the name ci with the root workflow, and a lookup by
# name could not tell the two apart.
name: component-weston

on:
  workflow_call:
    inputs:
      # check runs the jobs and the images that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # true when the check stage also runs the publish job in its dry
      # mode, because the code of the publish changed: it builds what a
      # publish would push, and it pushes nothing.
      dryrun:
        type: boolean
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true
      # The images that run, as a JSON list of the images job's matrix
      # entries.
      images:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  prek:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: weston
    steps:
      - uses: actions/checkout@v7

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make.
      - uses: j178/prek-action@v2
        with:
          prek-version: 0.5.2
          extra-args: --all-files weston/

  # Each image builds through docker-bake.hcl at the top of the
  # repository, as the target of the same name. A Dockerfile that
  # builds on a base of the repository, as in FROM mpv, gets that base's
  # target as a named context, so the base builds at this commit, from
  # its layer cache when nothing in it changed.
  #
  # The layer cache is on ghcr, as a :buildcache tag beside each image.
  # Every build reads it. Every push to main and every run that
  # publishes also writes the cache of the image this job builds, and
  # never the cache of a base under it, so the next build finds each
  # layer that did not change, and the publish job's build of the same
  # image finds every layer there. A push to another branch only reads
  # it, so a topic branch cannot replace main's cache.
  #
  # Off main, a pinned base's job also writes its layers to ghcr, as a
  # :buildcache-<version>-<revision> tag beside the image, and every
  # build reads that tag too. A consumer's job runs after its bases'
  # jobs, so on a branch that raises a base's revision, the consumer
  # builds the base from the layers that the base's own job wrote a
  # moment before, instead of from snapshot.debian.org. The bake file
  # decides which target writes. Each write ignores an error: a cache
  # that cannot be written makes the next build slower, and it never
  # fails this one.
  #
  # The matrix comes from the plan: one entry for each image that runs,
  # with whether it is pinned, whether it loads, and its smoke check.
  images:
    name: ${{ matrix.image }}
    if: ${{ inputs.stage == 'check' && fromJSON(inputs.images)[0] != null }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # A pinned base writes its branch cache on every branch, so its job
      # logs in on every branch too.
      - if: ${{ inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || matrix.pinned }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An image for more than one platform cannot load into the
      # runner's Docker daemon, so only a single-platform image loads,
      # and only a loaded image has a smoke check. The build reads the
      # bake file from the checkout, so a named context reaches the
      # directories of the repository.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.image }}
          load: ${{ matrix.load }}
          push: false
          vars: |
            VERSION=${{ inputs.version || 'check' }}
            CACHE_WRITE=${{ (inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.image || '' }}
            BRANCH_CACHE=${{ matrix.image }}

      - name: smoke check
        if: ${{ matrix.smoke != '' && matrix.load }}
        run: bash "${{ matrix.smoke }}" "ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}"

  publish:
    if: ${{ inputs.stage == 'publish' || inputs.dryrun }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules. The
      # module's `go` job saves the entry, because it runs the module's
      # tests and reads every module that this job reads.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ hashFiles('ci/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-

      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main. The modules are not in this entry, so
      # each of these entries holds only compiled output.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   ci/go.sum
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-build
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-

      - uses: docker/setup-buildx-action@v3

      # A dry run pushes nothing, so it needs no login.
      - if: ${{ !inputs.dryrun }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each image builds again through docker-bake.hcl, and pushes. An
      # image that ran in the images job above builds from the layers that
      # the job wrote to the cache. An image that did not run reads
      # neither the version nor any file that changed, and it builds from
      # the layers that an earlier run on main wrote.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component weston -version "${{ inputs.version }}" -mode "${{ inputs.dryrun && 'dry' || inputs.publish }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}
