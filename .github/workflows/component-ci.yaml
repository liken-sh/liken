# This file is generated from ci/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches ci. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run, in a run that publishes too.
#
# The name carries the component- prefix because the ci component would
# otherwise share the name ci with the root workflow, and a lookup by
# name could not tell the two apart.
name: component-ci

on:
  workflow_call:
    inputs:
      # check runs the jobs that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # true when the check stage also runs the publish job in its dry
      # mode, because the code of the publish changed: it builds what a
      # publish would push, and it pushes nothing.
      dryrun:
        type: boolean
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # ci/go.sum. When no entry has that key, as on a branch that
      # changes the file, the restore takes the newest entry of the same
      # job, which holds most of what the job needs. Each job
      # has entries of its own: a job that builds less would save an
      # entry that the other job then restores whole and never saves.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-

      - run: make test

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  prek:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ci
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # ci/go.sum. When no entry has that key, as on a branch that
      # changes the file, the restore takes the newest entry of the same
      # job, which holds most of what the job needs. Each job
      # has entries of its own: a job that builds less would save an
      # entry that the other job then restores whole and never saves.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make. SKIP leaves out the hooks
      # that another job of this workflow runs.
      - uses: j178/prek-action@v2
        env:
          SKIP: test-go
        with:
          prek-version: 0.5.2
          extra-args: --all-files ci/

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
