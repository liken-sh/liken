# This file is generated from liken/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches liken. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run, in a run that publishes too. ci.yaml calls this workflow a
# second time for the publish job, after every check that ran here and
# in this component's closure passed.
#
# The name carries the component- prefix because the ci component would
# otherwise share the name ci with the root workflow, and a lookup by
# name could not tell the two apart.
name: component-liken

on:
  workflow_call:
    inputs:
      # check runs the jobs that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # true when the check stage also runs the publish job in its dry
      # mode, because the code of the publish changed: it builds what a
      # publish would push, and it pushes nothing.
      dryrun:
        type: boolean
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

# proxy.golang.org sometimes drops a module download partway through
# the stream. With the default comma, `go` tries the origin only when
# the proxy answers 404 or 410, so a dropped stream fails the job.
# With a pipe, `go` fetches the module from its origin after any proxy
# error, with the runner's git. `GOSUMDB` keeps its default, so the
# checksum database still verifies a module that `go` fetched from its
# origin. The value covers the Go of every job here, and of the
# build-setup action, which takes the env of the job that uses it.
# The images set the same value in their own build stages.
env:
  GOPROXY: https://proxy.golang.org|direct

jobs:
  go:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: liken/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules.
      # This job saves the entry: it runs the module's tests, so it
      # reads every module that another job of the module reads. A job
      # that reads fewer modules would save an entry without the rest,
      # and this job would download them again on each run until
      # `go.sum` changes.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

      # The build cache holds Go's test results and the compiled
      # packages of the dependencies and of the job's own module. The
      # key holds the Go version and the hash of these files:
      #
      #   liken/go.sum
      #   liken/Makefile
      #   liken/package.toml
      #   liken/.pre-commit-config.yaml
      #
      # The files after go.sum choose what the job compiles and with
      # which flags.
      #
      # The key holds no commit, so main saves an entry only when one
      # of these inputs changes, and the entry stays until the next
      # change. A key that held the commit saved a new entry of several
      # hundred megabytes for each job on each push to main, and those
      # entries filled the repository's 10 GB. A run restores the entry
      # of its inputs, which holds every dependency compiled. The
      # packages of the module that changed since that entry compile
      # again, and their tests run again.
      #
      # When no entry has the key, as on a branch that changes one of
      # the files, the restore takes the newest entry of the same job.
      # Each job has entries of its own: a job that builds less would
      # save an entry without the packages that the other job
      # compiles, and the other job would restore it and compile them
      # again.
      - id: go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-

      - run: make test-go

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-liken-go
          path: |
            liken/coverage.out
          if-no-files-found: error
          retention-days: 7

  prek:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: liken/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules. The
      # module's `go` job saves the entry, because it runs the module's
      # tests and reads every module that this job reads.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

      # The build cache holds Go's test results and the compiled
      # packages of the dependencies and of the job's own module. The
      # key holds the Go version and the hash of these files:
      #
      #   liken/go.sum
      #   liken/Makefile
      #   liken/package.toml
      #   liken/.pre-commit-config.yaml
      #
      # The files after go.sum choose what the job compiles and with
      # which flags.
      #
      # The key holds no commit, so main saves an entry only when one
      # of these inputs changes, and the entry stays until the next
      # change. A key that held the commit saved a new entry of several
      # hundred megabytes for each job on each push to main, and those
      # entries filled the repository's 10 GB. A run restores the entry
      # of its inputs, which holds every dependency compiled. The
      # packages of the module that changed since that entry compile
      # again, and their tests run again.
      #
      # When no entry has the key, as on a branch that changes one of
      # the files, the restore takes the newest entry of the same job.
      # Each job has entries of its own: a job that builds less would
      # save an entry without the packages that the other job
      # compiles, and the other job would restore it and compile them
      # again.
      - id: go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make. sha256 is the digest
      # that prekSHA256 in ci/workflow.go pins, because the action checks
      # only the versions in its own table. SKIP leaves out the hooks
      # that another job of this workflow runs.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: go-vet,staticcheck,go-mod-tidy
        with:
          prek-version: 0.5.9
          sha256: 2fee13923018dd517c19dba032ddcae8010cadfb81bc47e742ad5e8981a3f126
          extra-args: --all-files liken/

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}

  docs:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'docs') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: liken/docs/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for the family `manuals`,
      # saved when the key misses. The key follows the hash of
      # `liken/docs/go.sum`.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same family, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-${{ hashFiles('liken/docs/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-

      # The entry holds the compiled Hugo and the brand's page
      # generators. go.sum chooses the version of each, so the key
      # holds the hash of go.sum and no commit, and main saves an entry
      # only when go.sum changes. A run restores the entry for its
      # go.sum, or the newest entry for any go.sum when none matches,
      # as on a branch that changes it. Every manual with the same
      # go.sum shares the entry.
      - id: hugo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('liken/docs/go.sum') }}
          restore-keys: hugo-build-${{ runner.os }}-

      - run: make test-docs

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  build:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'build') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: liken
    steps:
      # The build names itself with git describe, which needs the
      # history and the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The toolchain, KVM access, and the caches of the vendored
      # inputs.
      - id: build-setup
        uses: ./.github/actions/build-setup

      - run: |
          make all
          make smoke-uefi
          make smoke-bios

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-build-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-build-key }}

      # The build-setup action restored buildroot's compiler cache because
      # this job built the userland. Only main saves the cache, as with
      # the Go caches, so a branch never writes an entry that pushes one
      # of main's out of the repository's 10 GB.
      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.userland-build == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: liken/userland/cache/ccache
          key: ${{ steps.build-setup.outputs.userland-ccache-key }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: liken-build-logs
          path: |
            liken/dev-cluster/guests/node-1/*.log
          if-no-files-found: ignore

  codeql-go:
    # ci/codeql.go derives this job. A pull request from a fork gets a
    # token that cannot write to code scanning, so the analysis runs
    # only for a branch of this repository.
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'codeql-go') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: liken/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are the entry of the module `liken`,
      # whose `go` job saves it. This job keeps no build cache.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same family, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

      # CodeQL analyzes every file of the checkout unless its
      # configuration names paths, so the configuration limits the
      # analysis to this job's directory. The module's go.mod can replace
      # a module with a directory of another component, and that
      # component's own job analyzes it. CodeQL traces the build in the
      # next step and extracts each package that the build compiles.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual
          config: |
            paths:
              - liken

      - run: go build ./...

      # The category keeps this job's alerts apart from every other
      # analysis: code scanning closes an alert only when a later upload
      # in the same category no longer reports it.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql/liken/go

  publish:
    if: ${{ inputs.stage == 'publish' || inputs.dryrun }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # id-token: write lets cosign take the job's OIDC token and sign
    # each file of the release keyless, with this workflow at its ref
    # as the signer. No other job of the workflow holds it.
    # packages: write lets the build push the userland that it compiles
    # on main to ghcr.io/liken-sh/userland, as the build job does.
    # liken/userland/artifact.sh gives the details.
    # security-events: write uploads the grype scan of the release's
    # SBOM to code scanning, because upload-sarif writes the results
    # with the job's token.
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    # The channel's key comes from the repository secrets that
    # liken.sh/terraform.tf keeps delivered.
    env:
      RELEASES_ACCESS_KEY: ${{ secrets.RELEASES_ACCESS_KEY }}
      RELEASES_SECRET_KEY: ${{ secrets.RELEASES_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: build-setup
        uses: ./.github/actions/build-setup

      # The release build stamps the tag's version into every binary,
      # so it is a new build, and the smoke drill boots it before a byte
      # leaves the runner. Releases are immutable, so this is the last
      # point where a bundle that cannot boot is caught.
      #
      # A dry run builds under today's date and serial 000, the serial
      # of the lab's bundle, which no publish ever carries.
      - name: build and boot the release
        working-directory: liken
        run: |
          version="${{ inputs.version }}"
          if [ "${{ inputs.dryrun }}" = true ]; then version="$(date -u +%Y.%m.%d)-000"; fi
          make release VERSION="$version"
          make smoke-uefi

      # A dry run has no channel key, so it uploads nothing, and it
      # checks only that the script parses.
      - name: check the publish script
        if: ${{ inputs.dryrun }}
        working-directory: liken
        run: bash -n releases/publish.sh

      # cosign, from the image that toolchains/images.toml pins, signs
      # each file of the release keyless and writes the signature, the
      # certificate, and the Rekor entry into one bundle beside the
      # file, which the publish uploads with it. releases/sign.sh gives
      # the details. A dry run signs nothing.
      - name: sign the release's files
        if: ${{ !inputs.dryrun }}
        working-directory: liken
        run: releases/sign.sh "${{ inputs.version }}"

      - name: publish to the channel
        if: ${{ !inputs.dryrun }}
        working-directory: liken
        run: releases/publish.sh "${{ inputs.version }}"

      # grype scans the SBOM of the release that this job just
      # published, so the Security tab shows the new release's findings
      # at once, and not at the next scheduled scan in scan.yaml. The
      # scan runs after the upload, and it continues on an error, so a
      # finding, a failed scan, or a scan that passes its limit never
      # holds back or fails the publish. releases/sbom/vulnerabilities.sh
      # gives the details. A dry run publishes nothing and scans nothing.
      - name: scan the release's SBOM
        if: ${{ !inputs.dryrun }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: liken
        run: releases/sbom/vulnerabilities.sh "releases/dist/${{ inputs.version }}/sbom.cdx.json" "${{ github.workspace }}/grype/liken.sarif"

      # The findings go under the category grype/liken. Code scanning
      # closes an alert only when a later upload in the same category no
      # longer reports it, so the scan of each release replaces the
      # results of the scan before it. The step runs when the scan wrote
      # its file.
      - if: ${{ !cancelled() && !inputs.dryrun && hashFiles('grype/liken.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: grype/liken.sarif
          category: grype/liken

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-build-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-build-key }}

      # The build-setup action restored buildroot's compiler cache because
      # this job built the userland. Only main saves the cache, as with
      # the Go caches, so a branch never writes an entry that pushes one
      # of main's out of the repository's 10 GB.
      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.userland-build == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: liken/userland/cache/ccache
          key: ${{ steps.build-setup.outputs.userland-ccache-key }}
