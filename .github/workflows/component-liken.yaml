# This file is generated from liken/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches liken. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run. A run that publishes runs all of them. ci.yaml calls
# this workflow a second time for the publish job, after every check
# here and in this component's closure passed.
name: liken

on:
  workflow_call:
    inputs:
      # check runs the jobs and the images that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'checks') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # liken/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('liken/go.sum') }}

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make.
      - uses: j178/prek-action@v2
        with:
          prek-version: 0.5.2
          extra-args: --all-files liken/

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-liken-checks
          path: |
            liken/coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'docs') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken/docs
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/docs/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules, and its key follows
      # liken/docs/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('liken/docs/go.sum') }}

      # A saved cache never changes, and Go trims a build cache entry
      # that no build used for five days, so a build cache saved once
      # would lose the compiled Hugo. This entry's key ends in the
      # commit: each push to main saves a new one, and every run
      # restores the newest one for the same go.sum. Every manual with
      # the same go.sum shares the entry.
      - id: hugo-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('liken/docs/go.sum') }}-${{ github.sha }}
          restore-keys: hugo-build-${{ runner.os }}-${{ hashFiles('liken/docs/go.sum') }}-

      - run: |
          make test
          make build

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  build:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'build') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: liken
    steps:
      # The build names itself with git describe, which needs the
      # history and the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The toolchain, KVM access, and the caches of the vendored
      # inputs.
      - id: build-setup
        uses: ./.github/actions/build-setup

      - run: |
          make all
          make smoke-uefi
          make smoke-bios

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-cache-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liken-build-logs
          path: |
            liken/dev-cluster/guests/node-1/*.log
          if-no-files-found: ignore

  publish:
    if: ${{ inputs.stage == 'publish' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    # The channel's key comes from the repository secrets that
    # liken.sh/terraform.tf keeps delivered.
    env:
      RELEASES_ACCESS_KEY: ${{ secrets.RELEASES_ACCESS_KEY }}
      RELEASES_SECRET_KEY: ${{ secrets.RELEASES_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build-setup
        uses: ./.github/actions/build-setup

      # The release build stamps the tag's version into every binary,
      # so it is a new build, and the smoke drill boots it before a byte
      # leaves the runner. Releases are immutable, so this is the last
      # point where a bundle that cannot boot is caught.
      - name: build and boot the release
        working-directory: liken
        run: |
          make release VERSION="${{ inputs.version }}"
          make smoke-uefi

      - uses: actions/download-artifact@v8
        with:
          name: coverage-liken-checks
          path: liken

      - name: publish to the channel
        working-directory: liken
        run: releases/publish.sh "${{ inputs.version }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-cache-key }}
