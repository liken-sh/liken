# This file is generated from liken/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches liken. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run, in a run that publishes too. ci.yaml calls this workflow a
# second time for the publish job, after every check that ran here and
# in this component's closure passed.
#
# The name carries the component- prefix because the ci component would
# otherwise share the name ci with the root workflow, and a lookup by
# name could not tell the two apart.
name: component-liken

on:
  workflow_call:
    inputs:
      # check runs the jobs that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # true when the check stage also runs the publish job in its dry
      # mode, because the code of the publish changed: it builds what a
      # publish would push, and it pushes nothing.
      dryrun:
        type: boolean
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules.
      # This job saves the entry: it runs the module's tests, so it
      # reads every module that another job of the module reads. A job
      # that reads fewer modules would save an entry without the rest,
      # and this job would download them again on each run until
      # `go.sum` changes.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main. The modules are not in this entry, so
      # each of these entries holds only compiled output.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   liken/go.sum
      #   liken/Makefile
      #   liken/package.toml
      #   liken/.pre-commit-config.yaml
      #
      # The files after go.sum choose what the job compiles and with
      # which flags.
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-build
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-

      - run: make test-go

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-liken-go
          path: |
            liken/coverage.out
          if-no-files-found: error
          retention-days: 7

  prek:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules. The
      # module's `go` job saves the entry, because it runs the module's
      # tests and reads every module that this job reads.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main. The modules are not in this entry, so
      # each of these entries holds only compiled output.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   liken/go.sum
      #   liken/Makefile
      #   liken/package.toml
      #   liken/.pre-commit-config.yaml
      #
      # The files after go.sum choose what the job compiles and with
      # which flags.
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-build
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/package.toml', 'liken/.pre-commit-config.yaml') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make. SKIP leaves out the hooks
      # that another job of this workflow runs.
      - uses: j178/prek-action@v2
        env:
          SKIP: go-vet,staticcheck,go-mod-tidy
        with:
          prek-version: 0.5.2
          extra-args: --all-files liken/

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}

  docs:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'docs') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: liken
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/docs/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for the family `manuals`,
      # saved when the key misses. The key follows the hash of
      # `liken/docs/go.sum`.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same family, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-${{ hashFiles('liken/docs/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-

      # A saved cache never changes, and Go trims a build cache entry
      # that no build used for five days, so a build cache saved once
      # would lose the compiled Hugo. This entry's key ends in the
      # commit: each push to main saves a new one, and every run
      # restores the newest one for the same go.sum, or for any go.sum
      # when none matches, as on a branch that changes it. Every manual
      # with the same go.sum shares the entry.
      - id: hugo-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('liken/docs/go.sum') }}-${{ github.sha }}
          restore-keys: |
            hugo-build-${{ runner.os }}-${{ hashFiles('liken/docs/go.sum') }}-
            hugo-build-${{ runner.os }}-

      - run: make test-docs

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  build:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'build') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: liken
    steps:
      # The build names itself with git describe, which needs the
      # history and the tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The toolchain, KVM access, and the caches of the vendored
      # inputs.
      - id: build-setup
        uses: ./.github/actions/build-setup

      - run: |
          make all
          make smoke-uefi
          make smoke-bios

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-build-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-build-key }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: liken-build-logs
          path: |
            liken/dev-cluster/guests/node-1/*.log
          if-no-files-found: ignore

  publish:
    if: ${{ inputs.stage == 'publish' || inputs.dryrun }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    # The channel's key comes from the repository secrets that
    # liken.sh/terraform.tf keeps delivered.
    env:
      RELEASES_ACCESS_KEY: ${{ secrets.RELEASES_ACCESS_KEY }}
      RELEASES_SECRET_KEY: ${{ secrets.RELEASES_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: build-setup
        uses: ./.github/actions/build-setup

      # The release build stamps the tag's version into every binary,
      # so it is a new build, and the smoke drill boots it before a byte
      # leaves the runner. Releases are immutable, so this is the last
      # point where a bundle that cannot boot is caught.
      #
      # A dry run builds under today's date and serial 000, the serial
      # of the lab's bundle, which no publish ever carries.
      - name: build and boot the release
        working-directory: liken
        run: |
          version="${{ inputs.version }}"
          if [ "${{ inputs.dryrun }}" = true ]; then version="$(date -u +%Y.%m.%d)-000"; fi
          make release VERSION="$version"
          make smoke-uefi

      # A dry run has no channel key, so it uploads nothing, and it
      # checks only that the script parses.
      - name: check the publish script
        if: ${{ inputs.dryrun }}
        working-directory: liken
        run: bash -n releases/publish.sh

      - name: publish to the channel
        if: ${{ !inputs.dryrun }}
        working-directory: liken
        run: releases/publish.sh "${{ inputs.version }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.build-setup.outputs.go-build-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-setup.outputs.go-build-key }}
