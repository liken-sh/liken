# This file is generated from people-operator/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches people-operator. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run, in a run that publishes too. ci.yaml calls this workflow a
# second time for the publish job, after every check that ran here and
# in this component's closure passed.
#
# The name carries the component- prefix because the ci component would
# otherwise share the name ci with the root workflow, and a lookup by
# name could not tell the two apart.
name: component-people-operator

on:
  workflow_call:
    inputs:
      # check runs the jobs that the plan names. publish
      # runs the publish job alone: ci.yaml calls this workflow a second
      # time for it, after the checks of every component in this one's
      # closure pass.
      stage:
        type: string
        required: true
      # true when the check stage also runs the publish job in its dry
      # mode, because the code of the publish changed: it builds what a
      # publish would push, and it pushes nothing.
      dryrun:
        type: boolean
        required: true
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: people-operator
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: people-operator/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, so a branch never writes an entry that pushes one of main's
      # out of the repository's 10 GB. The cache holds the Go modules
      # and the build cache.
      #
      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main, and GitHub evicts the oldest entries when
      # the repository's caches pass 10 GB.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   people-operator/go.sum
      #   people-operator/Makefile
      #   people-operator/package.toml
      #   people-operator/.pre-commit-config.yaml
      #
      # The files after go.sum choose what the job compiles and with
      # which flags.
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-people-operator-${{ github.job }}-${{ hashFiles('people-operator/go.sum', 'people-operator/Makefile', 'people-operator/package.toml', 'people-operator/.pre-commit-config.yaml') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-people-operator-${{ github.job }}-${{ hashFiles('people-operator/go.sum', 'people-operator/Makefile', 'people-operator/package.toml', 'people-operator/.pre-commit-config.yaml') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-people-operator-${{ github.job }}-

      - run: make test-go

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-people-operator-go
          path: |
            people-operator/coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'docs') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: people-operator
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: people-operator/docs/go.mod
          cache: false

      # Every run restores the Go modules, and only a push to main saves
      # them, when the key missed, so a branch never writes an entry
      # that pushes one of main's out of the repository's 10 GB. The key
      # follows the hash of `people-operator/docs/go.sum`. When no entry has that
      # key, as on a branch that changes it, the restore takes the newest
      # entry of the same family, which holds most of the modules that
      # the job needs.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-${{ hashFiles('people-operator/docs/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-

      # A saved cache never changes, and Go trims a build cache entry
      # that no build used for five days, so a build cache saved once
      # would lose the compiled Hugo. This entry's key ends in the
      # commit: each push to main saves a new one, and every run
      # restores the newest one for the same go.sum, or for any go.sum
      # when none matches, as on a branch that changes it. Every manual
      # with the same go.sum shares the entry.
      - id: hugo-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('people-operator/docs/go.sum') }}-${{ github.sha }}
          restore-keys: |
            hugo-build-${{ runner.os }}-${{ hashFiles('people-operator/docs/go.sum') }}-
            hugo-build-${{ runner.os }}-

      - run: make test-docs

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  prek:
    if: ${{ inputs.stage == 'check' && contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: people-operator
    steps:
      - uses: actions/checkout@v7

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make. SKIP leaves out the hooks
      # that another job of this workflow runs.
      - uses: j178/prek-action@v2
        env:
          SKIP: gofmt,go-vet,go-mod-tidy
        with:
          prek-version: 0.5.2
          extra-args: --all-files people-operator/

  publish:
    if: ${{ inputs.stage == 'publish' || inputs.dryrun }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, so a branch never writes an entry that pushes one of main's
      # out of the repository's 10 GB. The cache holds the Go modules
      # and the build cache.
      #
      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main, and GitHub evicts the oldest entries when
      # the repository's caches pass 10 GB.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   ci/go.sum
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-

      # A dry run pushes nothing, so it needs no login.
      - if: ${{ !inputs.dryrun }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: fluxcd/flux2/action@v2.9.5
        with:
          version: 2.9.5

      # The component builds no image, so the deploy artifact pushes
      # alone.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component people-operator -version "${{ inputs.version }}" -mode "${{ inputs.dryrun && 'dry' || inputs.publish }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
