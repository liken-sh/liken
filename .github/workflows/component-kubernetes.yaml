# This file is generated from kubernetes/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches kubernetes. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs.
#
# The plan names the jobs that read the change, and
# only those run. A run that publishes runs all of them.
name: kubernetes

on:
  workflow_call:
    inputs:
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    if: ${{ contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kubernetes
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: kubernetes/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # kubernetes/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('kubernetes/go.sum') }}

      - run: make test

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-kubernetes-go
          path: |
            kubernetes/coverage.out
          if-no-files-found: error
          retention-days: 7
