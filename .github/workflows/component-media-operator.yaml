# This file is generated from media-operator/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches media-operator. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs. The images job builds every image and runs
# its smoke check. The publish job pushes nothing until every other
# job in this workflow passes.
name: media-operator

on:
  workflow_call:
    inputs:
      # The version the outputs get: the release tag, a development
      # version, or empty when the run publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: media-operator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: media-operator/go.mod
          cache-dependency-path: media-operator/go.sum

      - name: install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - run: make test-go

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-media-operator-go
          path: |
            media-operator/coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: media-operator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: media-operator/docs/go.mod
          cache-dependency-path: media-operator/docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # follows go.sum, so between two changes to that file the build
      # cache inside it never refreshes, and Go trims the compiled
      # Hugo out of it. This entry saves on every run, under a key that
      # ends in the commit, and restores the newest one for the same
      # go.sum.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: media-operator-docs-build-${{ runner.os }}-${{ hashFiles('media-operator/docs/go.sum') }}-${{ github.sha }}
          restore-keys: media-operator-docs-build-${{ runner.os }}-${{ hashFiles('media-operator/docs/go.sum') }}-

      - run: make test-docs

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: media-operator
    env:
      CARGO_INCREMENTAL: 0
      WLR_RENDERER: pixman
    steps:
      - uses: actions/checkout@v7

      - name: install cage, wlr-randr, mesa-vulkan-drivers, libvulkan1, libwayland-client0, libxkbcommon0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cage wlr-randr mesa-vulkan-drivers libvulkan1 libwayland-client0 libxkbcommon0

      # rustup reads the toolchain pin from rust-toolchain.toml.
      - name: install the toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: media-operator
          cache-on-failure: true

      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      - run: make test-rust

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-media-operator-rust
          path: |
            media-operator/coverage-media-screen.xml
            media-operator/coverage-idle-screen.xml
            media-operator/coverage-display.xml
          if-no-files-found: error
          retention-days: 7

  # The layer cache is on ghcr, as a :buildcache tag beside each image.
  # Every build reads it. Every push to main and every run that
  # publishes also writes it, so the next build finds each layer that did
  # not change, and the publish job's build of the same image finds every
  # layer there. A push to another branch only reads it, so a topic
  # branch cannot replace main's cache. The write ignores an error: a
  # cache that cannot be written makes the next build slower, and it
  # never fails this one.
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: media-operator
            context: media-operator
            file: media-operator/Dockerfile
            target: ''
            platforms: linux/amd64
            load: true
            build-contexts: ''
            smoke: ''
          - image: media-operator-player
            context: media-operator
            file: media-operator/Dockerfile.player
            target: ''
            platforms: linux/amd64
            load: true
            build-contexts: 'brand=brand'
            smoke: 'media-operator/smoke/media-operator-player.sh'
          - image: media-operator-idle
            context: media-operator
            file: media-operator/Dockerfile.screen
            target: 'idle'
            platforms: linux/amd64
            load: true
            build-contexts: 'brand=brand'
            smoke: 'media-operator/smoke/media-operator-idle.sh'
          - image: media-operator-display
            context: media-operator
            file: media-operator/Dockerfile.screen
            target: 'display'
            platforms: linux/amd64
            load: true
            build-contexts: 'brand=brand'
            smoke: 'media-operator/smoke/media-operator-display.sh'
          - image: media-operator-api
            context: media-operator
            file: media-operator/Dockerfile.api
            target: ''
            platforms: linux/amd64
            load: true
            build-contexts: ''
            smoke: 'media-operator/smoke/media-operator-api.sh'
          - image: media-operator-cli
            context: media-operator
            file: media-operator/Dockerfile.cli
            target: ''
            platforms: linux/amd64,linux/arm64
            load: false
            build-contexts: ''
            smoke: ''
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: ${{ inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An image for more than one platform cannot load into the
      # runner's Docker daemon, so only a single-platform image loads,
      # and only a loaded image has a smoke check.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          build-contexts: ${{ matrix.build-contexts }}
          build-args: |
            VERSION=${{ inputs.version || 'check' }}
          load: ${{ matrix.load }}
          push: false
          tags: ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache
          cache-to: ${{ (inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && format('type=registry,ref=ghcr.io/liken-sh/{0}:buildcache,mode=max,ignore-error=true', matrix.image) || '' }}

      - name: smoke check
        if: ${{ matrix.smoke != '' && matrix.load }}
        run: bash "${{ matrix.smoke }}" "ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}"

  publish:
    needs: [go, docs, rust, images]
    if: ${{ inputs.publish != 'none' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache-dependency-path: ci/go.sum

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: fluxcd/flux2/action@v2.9.5
        with:
          version: 2.9.5

      # Each image builds again from the layer cache that the images
      # job wrote, and pushes. The deploy artifact goes last, because a
      # cluster follows the deploy artifact, and it must never name an
      # image that is not pushed yet.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component media-operator -version "${{ inputs.version }}" -mode "${{ inputs.publish }}"
