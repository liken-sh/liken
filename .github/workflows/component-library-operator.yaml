# This file is generated from library-operator/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches library-operator. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs. The images job builds every image and runs
# its smoke check. The publish job pushes nothing until every other
# job in this workflow passes.
name: library-operator

on:
  workflow_call:
    inputs:
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: library-operator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: library-operator/go.mod
          cache-dependency-path: library-operator/go.sum

      - run: make test-go

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-library-operator-go
          path: |
            library-operator/coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: library-operator
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: library-operator/docs/go.mod
          cache-dependency-path: library-operator/docs/go.sum

      # setup-go saves its cache only when its key misses, and the key
      # follows go.sum, so between two changes to that file the build
      # cache inside it never refreshes, and Go trims the compiled
      # Hugo out of it. This entry saves on every run, under a key that
      # ends in the commit, and restores the newest one for the same
      # go.sum.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: library-operator-docs-build-${{ runner.os }}-${{ hashFiles('library-operator/docs/go.sum') }}-${{ github.sha }}
          restore-keys: library-operator-docs-build-${{ runner.os }}-${{ hashFiles('library-operator/docs/go.sum') }}-

      - run: make test-docs

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: library-operator/media-browser
    env:
      CARGO_INCREMENTAL: 0
      WLR_RENDERER: pixman
    steps:
      - uses: actions/checkout@v7

      - name: install cage, wlr-randr, mesa-vulkan-drivers, libvulkan1, libwayland-client0, libxkbcommon0
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cage wlr-randr mesa-vulkan-drivers libvulkan1 libwayland-client0 libxkbcommon0

      # rustup reads the toolchain pin from rust-toolchain.toml.
      - name: install the toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: library-operator/media-browser
          cache-on-failure: true

      - uses: taiki-e/install-action@v2.87.1
        with:
          tool: cargo-llvm-cov

      - run: make test

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-library-operator-rust
          path: |
            library-operator/coverage-media-browser.xml
          if-no-files-found: error
          retention-days: 7

  # Each image builds through docker-bake.hcl at the top of the
  # repository, as the target of the same name. A Dockerfile that
  # builds on a base of the repository, as in FROM mpv, gets that base's
  # target as a named context, so the base builds at this commit, from
  # its layer cache when nothing in it changed.
  #
  # The layer cache is on ghcr, as a :buildcache tag beside each image.
  # Every build reads it. Every push to main and every run that
  # publishes also writes the cache of the image this job builds, and
  # never the cache of a base under it, so the next build finds each
  # layer that did not change, and the publish job's build of the same
  # image finds every layer there. A push to another branch only reads
  # it, so a topic branch cannot replace main's cache.
  #
  # Every run, on any branch, also writes the image's layers to the
  # GitHub Actions cache under the image's name, and every build reads
  # that cache too. A consumer's job runs after its bases' jobs, so on a
  # branch that raises a base's revision, the consumer builds the base
  # from the layers that the base's own job wrote a moment before,
  # instead of from snapshot.debian.org. Each write ignores an error: a
  # cache that cannot be written makes the next build slower, and it
  # never fails this one.
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: library-operator
            load: true
            smoke: ''
          - image: library-operator-ffmpeg
            load: true
            smoke: 'library-operator/smoke/library-operator-ffmpeg.sh'
          - image: library-operator-media-browser
            load: true
            smoke: 'library-operator/smoke/library-operator-media-browser.sh'
          - image: library-operator-corrosion
            load: true
            smoke: 'library-operator/smoke/library-operator-corrosion.sh'
          - image: library-operator-cli
            load: false
            smoke: ''
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: ${{ inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An image for more than one platform cannot load into the
      # runner's Docker daemon, so only a single-platform image loads,
      # and only a loaded image has a smoke check. The build reads the
      # bake file from the checkout, so a named context reaches the
      # directories of the repository.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.image }}
          load: ${{ matrix.load }}
          push: false
          vars: |
            VERSION=${{ inputs.version || 'check' }}
            CACHE_WRITE=${{ (inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.image || '' }}
            GHA_CACHE=${{ matrix.image }}

      - name: smoke check
        if: ${{ matrix.smoke != '' && matrix.load }}
        run: bash "${{ matrix.smoke }}" "ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}"

  publish:
    needs: [go, docs, rust, images]
    if: ${{ inputs.publish != 'none' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache-dependency-path: ci/go.sum

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: fluxcd/flux2/action@v2.9.5
        with:
          version: 2.9.5

      # Each image builds again through docker-bake.hcl, from the layer
      # cache that the images job wrote, and pushes. The deploy artifact
      # goes last, because a cluster follows the deploy artifact, and it
      # must never name an image that is not pushed yet.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component library-operator -version "${{ inputs.version }}" -mode "${{ inputs.publish }}"
