# This file is generated from display-operator/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches display-operator. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs. The images job builds each image and runs
# its smoke check. The publish job pushes nothing until every other
# job in this workflow passes.
#
# The plan names the jobs and the images that read the change, and
# only those run. A run that publishes runs all of them.
name: display-operator

on:
  workflow_call:
    inputs:
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true
      # The names of the jobs that run, as a JSON list.
      jobs:
        type: string
        required: true
      # The images that run, as a JSON list of the images job's matrix
      # entries.
      images:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  go:
    if: ${{ contains(fromJSON(inputs.jobs), 'go') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: display-operator
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: display-operator/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # display-operator/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('display-operator/go.sum') }}

      - run: make test-go

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      # The site renders the coverage report from these files.
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-display-operator-go
          path: |
            display-operator/coverage.out
          if-no-files-found: error
          retention-days: 7

  docs:
    if: ${{ contains(fromJSON(inputs.jobs), 'docs') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: display-operator
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: display-operator/docs/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules, and its key follows
      # display-operator/docs/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('display-operator/docs/go.sum') }}

      # A saved cache never changes, and Go trims a build cache entry
      # that no build used for five days, so a build cache saved once
      # would lose the compiled Hugo. This entry's key ends in the
      # commit: each push to main saves a new one, and every run
      # restores the newest one for the same go.sum. Every manual with
      # the same go.sum shares the entry.
      - id: hugo-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('display-operator/docs/go.sum') }}-${{ github.sha }}
          restore-keys: hugo-build-${{ runner.os }}-${{ hashFiles('display-operator/docs/go.sum') }}-

      - run: make test-docs

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

  prek:
    if: ${{ contains(fromJSON(inputs.jobs), 'prek') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: display-operator
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: display-operator/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # display-operator/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('display-operator/go.sum') }}

      # prek runs the hooks of this component only, with
      # --show-diff-on-failure, so a hook that changes a file fails
      # with the change it would make. SKIP leaves out the hooks
      # that another job of this workflow runs.
      - uses: j178/prek-action@v2
        env:
          SKIP: test-go,test-docs
        with:
          prek-version: 0.5.2
          extra-args: --all-files display-operator/

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Each image builds through docker-bake.hcl at the top of the
  # repository, as the target of the same name. A Dockerfile that
  # builds on a base of the repository, as in FROM mpv, gets that base's
  # target as a named context, so the base builds at this commit, from
  # its layer cache when nothing in it changed.
  #
  # The layer cache is on ghcr, as a :buildcache tag beside each image.
  # Every build reads it. Every push to main and every run that
  # publishes also writes the cache of the image this job builds, and
  # never the cache of a base under it, so the next build finds each
  # layer that did not change, and the publish job's build of the same
  # image finds every layer there. A push to another branch only reads
  # it, so a topic branch cannot replace main's cache.
  #
  # Off main, a pinned base's job also writes its layers to ghcr, as a
  # :buildcache-<version>-<revision> tag beside the image, and every
  # build reads that tag too. A consumer's job runs after its bases'
  # jobs, so on a branch that raises a base's revision, the consumer
  # builds the base from the layers that the base's own job wrote a
  # moment before, instead of from snapshot.debian.org. The bake file
  # decides which target writes. Each write ignores an error: a cache
  # that cannot be written makes the next build slower, and it never
  # fails this one.
  #
  # The matrix comes from the plan: one entry for each image that runs,
  # with whether it is pinned, whether it loads, and its smoke check.
  images:
    name: ${{ matrix.image }}
    if: ${{ inputs.images != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # A pinned base writes its branch cache on every branch, so its job
      # logs in on every branch too.
      - if: ${{ inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || matrix.pinned }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An image for more than one platform cannot load into the
      # runner's Docker daemon, so only a single-platform image loads,
      # and only a loaded image has a smoke check. The build reads the
      # bake file from the checkout, so a named context reaches the
      # directories of the repository.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.image }}
          load: ${{ matrix.load }}
          push: false
          vars: |
            VERSION=${{ inputs.version || 'check' }}
            CACHE_WRITE=${{ (inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.image || '' }}
            BRANCH_CACHE=${{ matrix.image }}

      - name: smoke check
        if: ${{ matrix.smoke != '' && matrix.load }}
        run: bash "${{ matrix.smoke }}" "ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}"

  publish:
    needs: [go, docs, prek, images]
    if: ${{ inputs.publish != 'none' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # Every run restores the Go cache, and only a push to main saves
      # it, when its key missed, so a branch never writes an entry that
      # pushes one of main's out of the repository's 10 GB. The cache
      # holds the Go modules and the build cache, and its key follows
      # ci/go.sum.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('ci/go.sum') }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: fluxcd/flux2/action@v2.9.5
        with:
          version: 2.9.5

      # Each image builds again through docker-bake.hcl, from the layer
      # cache that the images job wrote, and pushes. The deploy artifact
      # goes last, because a cluster follows the deploy artifact, and it
      # must never name an image that is not pushed yet.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component display-operator -version "${{ inputs.version }}" -mode "${{ inputs.publish }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
