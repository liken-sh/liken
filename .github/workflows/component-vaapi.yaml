# This file is generated from vaapi/package.toml. Do not edit it:
# edit that file or the templates in ci/templates/, then run
# `make workflows` at the top of the repository.
#
# ci.yaml calls this workflow when a change reaches vaapi. Each
# check below is a job from package.toml, and it runs the same command
# that a workstation runs. The images job builds every image and runs
# its smoke check. The publish job pushes nothing until every other
# job in this workflow passes.
name: vaapi

on:
  workflow_call:
    inputs:
      # The version the outputs get: the release tag, a development
      # version, a pinned component's own tag, or empty when the run
      # publishes nothing.
      version:
        type: string
        required: true
      # none, dev, or release.
      publish:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Each image builds through docker-bake.hcl at the top of the
  # repository, as the target of the same name. A Dockerfile that
  # builds on a base of the repository, as in FROM mpv, gets that base's
  # target as a named context, so the base builds at this commit, from
  # its layer cache when nothing in it changed.
  #
  # The layer cache is on ghcr, as a :buildcache tag beside each image.
  # Every build reads it. Every push to main and every run that
  # publishes also writes the cache of the image this job builds, and
  # never the cache of a base under it, so the next build finds each
  # layer that did not change, and the publish job's build of the same
  # image finds every layer there. A push to another branch only reads
  # it, so a topic branch cannot replace main's cache.
  #
  # Every run, on any branch, also writes the image's layers to the
  # GitHub Actions cache under the image's name, and every build reads
  # that cache too. A consumer's job runs after its bases' jobs, so on a
  # branch that raises a base's revision, the consumer builds the base
  # from the layers that the base's own job wrote a moment before,
  # instead of from snapshot.debian.org. Each write ignores an error: a
  # cache that cannot be written makes the next build slower, and it
  # never fails this one.
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: vaapi
            load: true
            smoke: ''
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - if: ${{ inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # An image for more than one platform cannot load into the
      # runner's Docker daemon, so only a single-platform image loads,
      # and only a loaded image has a smoke check. The build reads the
      # bake file from the checkout, so a named context reaches the
      # directories of the repository.
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.image }}
          load: ${{ matrix.load }}
          push: false
          vars: |
            VERSION=${{ inputs.version || 'check' }}
            CACHE_WRITE=${{ (inputs.publish != 'none' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.image || '' }}
            GHA_CACHE=${{ matrix.image }}

      - name: smoke check
        if: ${{ matrix.smoke != '' && matrix.load }}
        run: bash "${{ matrix.smoke }}" "ghcr.io/liken-sh/${{ matrix.image }}:${{ inputs.version || 'check' }}"

  publish:
    needs: [images]
    if: ${{ inputs.publish != 'none' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache-dependency-path: ci/go.sum

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Each image builds again through docker-bake.hcl, from the layer
      # cache that the images job wrote, and pushes. The deploy artifact
      # goes last, because a cluster follows the deploy artifact, and it
      # must never name an image that is not pushed yet.
      - name: publish
        working-directory: ci
        run: go run . publish -root .. -component vaapi -version "${{ inputs.version }}" -mode "${{ inputs.publish }}"
