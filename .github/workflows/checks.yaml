# These are the quality checks, and the publish that follows them.
# GitHub Actions runs the checks on every push to main and every pull
# request against main. A push to main that passes them publishes the
# website.
#
# The checks themselves live in .pre-commit-config.yaml, the same
# config that runs at commit time on a developer's machine. So CI and
# local development always use the same definition of "clean".
# Everything the hooks need, beyond the Go toolchain, is pinned in the
# repo: staticcheck and go-test-coverage are tool directives in go.mod,
# and the Go version comes from go.mod too. All the checks job adds is
# a runner, the toolchain, and prek to run the hooks. The docs job is
# the second gate, because the docs domain is a nested Go module and
# the root module's ./... does not descend into it.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A dispatch republishes the current main with no change, for the
  # times the serving side needs a fresh deployment.
  workflow_dispatch:

# This runs one job per ref at a time. On a pull request, a new push
# supersedes the old run, so there is no reason to let the old run
# finish. On main, every push gets its own group (the commit SHA), and
# nothing is cancelled, because each commit on main gets its own
# verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-go reads the version from go.mod, so the pin lives where
      # Go pins live. It also caches the module and build caches,
      # keyed on go.sum, so the hooks' go builds start warm on repeat
      # runs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # prek runs the hooks. Its version is pinned here, because the
      # workflow is the only place CI reads it from. The action caches
      # the environments of the remote hooks (shellcheck and the
      # hygiene hooks) between runs. By default, it runs
      # `prek run --all-files --show-diff-on-failure`, so a
      # file-modifying hook like gofmt fails with the diff it would
      # make, instead of a bare exit code.
      - uses: j178/prek-action@v2
        with:
          prek-version: 0.4.8

      # The test-go hook leaves its coverage profile in the workspace.
      # The publish job renders it into the report the site serves,
      # and the release workflow downloads it from the run that
      # checked the commit a tag names, because a tag push runs no
      # checks of its own. Both readers come for it within minutes or
      # days, never months, so the retention is short.
      - name: keep the coverage profile
        uses: actions/upload-artifact@v6
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  # The docs domain is a nested Go module, so the hooks above never
  # see it. This job runs its checks and builds the site, which proves
  # on a pull request that the site still builds. The publish job
  # below builds it again, from a checkout it deploys.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The submodule is the brand theme, the presentation every
      # liken site shares; the site cannot build without it.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Go is the whole toolchain here: the generators and tests are
      # Go, and Hugo itself is a tool dependency of the docs module,
      # so `go tool hugo` compiles it from the module cache. The
      # cache paths cover both go.sum files, because Hugo's modules
      # are pinned in the docs module's own go.sum.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docs/go.sum

      # The make target generates the reference pages first, because
      # the link check reads them as sources and as targets.
      - name: test the docs
        run: make -C docs test

      # The site builds by the same make target a workstation runs,
      # so local and CI builds produce the same tree.
      - name: build the site
        run: make -C docs build

  # This is the website deploy. The job builds the site and deploys
  # the tree to GitHub Pages, which serves it at liken.sh. Every push
  # to main publishes, and no path filter narrows that, because the
  # site now carries the test coverage report: a change to any Go file
  # moves a number the site serves. A pull request never reaches this
  # job.
  #
  # Pages fits this site the way object storage fits the release
  # channel: the site is a tree of files, built ahead of time, and
  # nothing of the project's has to run to serve it. The apex records
  # in liken.sh/terraform.tf point liken.sh at GitHub's published
  # Pages addresses, and GitHub issues and renews the TLS certificate.
  # The release channel stays on its own storage, because machines
  # upgrade themselves from it and it must answer on its own
  # (liken.sh/README.md). The Pages configuration, workflow-sourced
  # deploys under the liken.sh custom domain, lives in the
  # repository's settings, set once by hand, the same class of
  # one-time act as delegating the DNS zone.
  #
  # Publishing needs two permissions beyond reading the tree. pages:
  # write creates the deployment, and id-token: write lets
  # deploy-pages prove to the Pages service that the artifact came
  # from this exact workflow run, so nothing else can push content
  # under this site's name.
  publish:
    needs: [checks, docs]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A site build and publish takes under 10 minutes, so 15 stops a
    # hung run without killing a real one.
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Deploys run one at a time: two pushes in quick succession would
    # otherwise race their deployments, and the served-site check
    # below needs nothing else to change while it runs.
    concurrency:
      group: docs
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            docs/go.sum

      # The report is rendered here, from the profile the gate wrote,
      # rather than measured again: the numbers the site publishes are
      # then the same numbers the gate passed on this commit.
      - name: collect the coverage profile
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: render the coverage report
        run: make coverage-report

      # What this step writes to dist/site/ is byte for byte what
      # Pages serves, apart from the report, which is copied in below
      # because it is built from the tests and not from content.
      - name: build the site
        run: make -C docs build

      - name: add the coverage report to the site
        run: cp coverage.html docs/dist/site/coverage.html

      - name: package the site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/site

      - name: deploy to Pages
        uses: actions/deploy-pages@v5

      # This step proves the deploy the way a reader meets it: the
      # site served over the public name is the one this commit
      # built. release.txt carries the commit, and the other checks
      # cover each kind of page the site serves.
      - name: verify the served site
        run: |
          # The deployment finishing does not mean the public name
          # follows yet: Pages sits behind a CDN that caches pages
          # for up to ten minutes, so the old tree can answer for a
          # while after the new one is live at the origin. curl's
          # --retry only covers transport errors, never stale
          # content, so the freshness check needs its own deadline
          # loop before the content checks below can mean anything.
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          # The content checks name themselves before they run, so a
          # failure's last log line says which page broke. Each curl
          # retries transport errors; a wrong-content grep still
          # fails at once, because wrong content is not transient.
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 \
              --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://liken.sh/ | grep -q "boots a machine"
          echo "checking a manual page"
          fetch https://liken.sh/docs/guides/install/ \
            | grep -q "<title>Install a cluster"
          echo "checking the markdown mirror"
          fetch --head https://liken.sh/docs/guides/install/index.md \
            | grep -qi "content-type: text/markdown"
          echo "checking the sitemap"
          fetch https://liken.sh/sitemap.xml >/dev/null
          echo "checking llms.txt"
          fetch https://liken.sh/llms.txt | grep -q "^# liken"
          # The report is megabytes, and its title is in the first
          # lines, so `grep -q` on a pipe would close it early and
          # fail the fetch with a write error. The page lands in a
          # file first, and the grep reads the file.
          echo "checking the coverage report"
          fetch https://liken.sh/coverage.html > served-coverage.html
          grep -q "<title>liken</title>" served-coverage.html
