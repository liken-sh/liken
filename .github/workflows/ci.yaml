      images: '[]'
    permissions:
      contents: read
      packages: write

  # The site is every component's manual in one tree: liken's manual
  # at the root, and each other component's manual under its prefix,
  # such as liken.sh/display/. GitHub Pages serves it from this
  # repository at liken.sh, together with the coverage report of each
  # component. A push to main deploys it when the plan says the site
  # changed: a manual's job ran, a job that writes a coverage profile
  # ran, the site's build changed, or every job runs. A push of plans
  # only starts no run, and the site holds no plan.
  #
  # A job that did not run in this push wrote no coverage profile, and
  # it has no artifact to download. The site serves each profile beside
  # the reports, and `ci reports` takes that copy: the job's files did
  # not change since the run that wrote it, so it is the profile of this
  # commit. ci/coverage.go gives the whole argument.
  #
  # The site reads only the tree and the coverage artifacts of the
  # check jobs. So it waits for the plan and each component's checks,
  # and not for the publish jobs, and it deploys while they run.
  site:
    needs: [plan, kubernetes, notices, trust, audio-operator, bluetooth-operator, brand, ci, vulkan, vaapi, ffmpeg, weston, display-operator, equipment-operator, git-csi-driver, indi, media-screen, library-operator, liken, mpv, media-operator, people-operator, per-node-csi-driver]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH == 'true' && needs.plan.outputs.site == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    # Two deploys in quick succession would race, and the check at the
    # end needs nothing else to change while it runs.
    concurrency:
      group: site
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: liken/docs/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for the family `manuals`,
      # saved when the key misses. The key follows the hash of
      # `**/docs/go.sum`.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same family, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-${{ hashFiles('**/docs/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-manuals-

      # The site compiles Hugo and the brand's page generators in every
      # manual's module, as each manual's docs job does. So the site
      # keeps its build cache in the same family as the docs jobs. The
      # site restores the newest entry of any of them. A docs job with
      # no entry for its own go.sum restores the newest entry of the
      # family, and the site's entry holds every manual's build. The
      # hash covers every manual's go.sum, so the site's key never
      # equals the key that a docs job saves for the same commit. The
      # key ends in the commit for the reason the docs jobs give: Go
      # trims a build cache entry that no build used for five days.
      - id: hugo-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: hugo-build-${{ runner.os }}-${{ hashFiles('**/docs/go.sum') }}-${{ github.sha }}
          restore-keys: |
            hugo-build-${{ runner.os }}-${{ hashFiles('**/docs/go.sum') }}-
            hugo-build-${{ runner.os }}-

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['kubernetes'].check && contains(fromJSON(needs.plan.outputs.components)['kubernetes'].jobs, 'go') }}
        with:
          name: coverage-kubernetes-go
          path: kubernetes

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['audio-operator'].check && contains(fromJSON(needs.plan.outputs.components)['audio-operator'].jobs, 'go') }}
        with:
          name: coverage-audio-operator-go
          path: audio-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['bluetooth-operator'].check && contains(fromJSON(needs.plan.outputs.components)['bluetooth-operator'].jobs, 'go') }}
        with:
          name: coverage-bluetooth-operator-go
          path: bluetooth-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['display-operator'].check && contains(fromJSON(needs.plan.outputs.components)['display-operator'].jobs, 'go') }}
        with:
          name: coverage-display-operator-go
          path: display-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['equipment-operator'].check && contains(fromJSON(needs.plan.outputs.components)['equipment-operator'].jobs, 'go') }}
        with:
          name: coverage-equipment-operator-go
          path: equipment-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['git-csi-driver'].check && contains(fromJSON(needs.plan.outputs.components)['git-csi-driver'].jobs, 'go') }}
        with:
          name: coverage-git-csi-driver-go
          path: git-csi-driver

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['media-screen'].check && contains(fromJSON(needs.plan.outputs.components)['media-screen'].jobs, 'rust') }}
        with:
          name: coverage-media-screen-rust
          path: media-screen

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['library-operator'].check && contains(fromJSON(needs.plan.outputs.components)['library-operator'].jobs, 'go') }}
        with:
          name: coverage-library-operator-go
          path: library-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['library-operator'].check && contains(fromJSON(needs.plan.outputs.components)['library-operator'].jobs, 'rust') }}
        with:
          name: coverage-library-operator-rust
          path: library-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['liken'].check && contains(fromJSON(needs.plan.outputs.components)['liken'].jobs, 'go') }}
        with:
          name: coverage-liken-go
          path: liken

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['media-operator'].check && contains(fromJSON(needs.plan.outputs.components)['media-operator'].jobs, 'go') }}
        with:
          name: coverage-media-operator-go
          path: media-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['media-operator'].check && contains(fromJSON(needs.plan.outputs.components)['media-operator'].jobs, 'rust') }}
        with:
          name: coverage-media-operator-rust
          path: media-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['people-operator'].check && contains(fromJSON(needs.plan.outputs.components)['people-operator'].jobs, 'go') }}
        with:
          name: coverage-people-operator-go
          path: people-operator

      - uses: actions/download-artifact@v8
        if: ${{ fromJSON(needs.plan.outputs.components)['per-node-csi-driver'].check && contains(fromJSON(needs.plan.outputs.components)['per-node-csi-driver'].jobs, 'go') }}
        with:
          name: coverage-per-node-csi-driver-go
          path: per-node-csi-driver

      # Each manual is a target of the root Makefile's site, so -j builds
      # the manuals together, one for each processor.
      - name: build the site
        run: make -j"$(nproc)" site SITE_URL=https://liken.sh

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: ${{ steps.go-modules.outputs.cache-primary-key }}

      - if: ${{ github.ref == 'refs/heads/main' && steps.hugo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.hugo-cache.outputs.cache-primary-key }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs

      - uses: actions/deploy-pages@v5

      # The deploy finishing does not mean the public name serves the
      # new tree yet: Pages is behind a CDN that caches pages for up to
      # ten minutes. release.txt holds the commit, so the loop waits
      # until the public name serves this commit's tree.
      - name: check the served site
        run: |
          expected="${{ github.sha }}"
          for _ in $(seq 1 48); do
            served="$(curl --fail --silent https://liken.sh/release.txt || true)"
            if [ "$served" = "$expected" ]; then break; fi
            sleep 15
          done
          [ "$served" = "$expected" ] || {
            echo "the site still serves ${served:-nothing}, expected $expected"
            exit 1
          }
          fetch() {
            curl --fail --silent --retry 5 --retry-delay 3 --retry-all-errors "$@"
          }
          echo "checking the front page"
          fetch https://liken.sh/ | grep -q "boots a machine"
          echo "checking the markdown twin of a page"
          fetch --head https://liken.sh/docs/guides/install/index.md \
            | grep -qi "content-type: text/markdown"
          echo "checking llms.txt"
          fetch https://liken.sh/llms.txt | grep -q "^# liken"
          echo "checking the audio-operator manual"
          fetch https://liken.sh/audio/ > page.html
          grep -q "<title>" page.html
          echo "checking the bluetooth-operator manual"
          fetch https://liken.sh/bluetooth/ > page.html
          grep -q "<title>" page.html
          echo "checking the display-operator manual"
          fetch https://liken.sh/display/ > page.html
          grep -q "<title>" page.html
          echo "checking the equipment-operator manual"
          fetch https://liken.sh/equipment/ > page.html
          grep -q "<title>" page.html
          echo "checking the git-csi-driver manual"
          fetch https://liken.sh/git/ > page.html
          grep -q "<title>" page.html
          echo "checking the library-operator manual"
          fetch https://liken.sh/library/ > page.html
          grep -q "<title>" page.html
          echo "checking the media-operator manual"
          fetch https://liken.sh/media/ > page.html
          grep -q "<title>" page.html
          echo "checking the people-operator manual"
          fetch https://liken.sh/people/ > page.html
          grep -q "<title>" page.html
          echo "checking the per-node-csi-driver manual"
          fetch https://liken.sh/per-node/ > page.html
          grep -q "<title>" page.html

  # The release record is the GitHub release for the tag: every
  # component and its version at this tag, whether this tag published
  # it or an earlier one did.
  record:
    needs: [plan, kubernetes, notices, trust, trust-publish, audio-operator, audio-operator-publish, bluetooth-operator, bluetooth-operator-publish, brand, ci, vulkan, vulkan-publish, vaapi, vaapi-publish, ffmpeg, ffmpeg-publish, weston, weston-publish, display-operator, display-operator-publish, equipment-operator, equipment-operator-publish, git-csi-driver, git-csi-driver-publish, indi, indi-publish, media-screen, library-operator, library-operator-publish, liken, liken-publish, mpv, mpv-publish, media-operator, media-operator-publish, people-operator, people-operator-publish, per-node-csi-driver, per-node-csi-driver-publish]
    if: ${{ !cancelled() && github.ref_type == 'tag' && vars.PUBLISH == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: ci/go.mod
          cache: false

      # The repository's Actions cache holds 10 GB, and GitHub evicts
      # the oldest entries when the caches pass that limit. So every run
      # restores the Go caches, and only a push to main saves them: a
      # branch never writes an entry that pushes one of main's out.
      #
      # The downloaded modules are one entry for each Go module, which
      # every job of the module restores. The key follows the hash of
      # `go.sum` alone, so the entry changes only when `go.sum` changes,
      # and a push to main that does not change `go.sum` saves no
      # modules. The
      # module's `go` job saves the entry, because it runs the module's
      # tests and reads every module that this job reads.
      # When no entry has the key, as on a branch that changes `go.sum`,
      # the restore takes the newest entry of the same module, which
      # holds most of the modules that the job needs.
      #
      # The entry holds the extracted source and, from the download
      # cache, only the `go.mod` files and the zip hashes. `go` reads the
      # `go.mod` files to load the module graph, and it downloads a module
      # again when its zip hash is missing. `go` does not read a zip
      # file after it extracts the source, and the zip files are about
      # half of the compressed entry.
      - id: go-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod/*
            !~/go/pkg/mod/cache
            ~/go/pkg/mod/cache/download/**/*.mod
            ~/go/pkg/mod/cache/download/**/*.ziphash
          key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ hashFiles('ci/go.sum') }}
          restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-

      # The build cache holds Go's test results and the compiled
      # packages of the job's own module, and most commits change both.
      # So the key ends in the commit: each push to main saves a new
      # entry, and every run restores the newest one. A key without the
      # commit would save one entry when its files last changed. That
      # entry would keep the test results and packages of that commit,
      # and each run would compile the module's packages again and run
      # the tests of every package. The cost is one entry for each job
      # on each push to main. The modules are not in this entry, so
      # each of these entries holds only compiled output.
      #
      # Before the commit, the key holds the hash of these files:
      #
      #   ci/go.sum
      #
      # A restore takes the newest entry with the same hash. When no
      # entry has that hash, as on a branch that changes one of the
      # files, the restore takes the newest entry of the same job. Each
      # job has entries of its own: a job that builds less would save
      # an entry without the packages that the other job compiles, and
      # the other job would restore it and compile them again.
      - id: go-build
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-${{ hashFiles('ci/go.sum') }}-
            go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-ci-${{ github.job }}-

      - name: write the release record
        working-directory: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run . record -root .. -tag "${{ github.ref_name }}"

      - if: ${{ github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build.outputs.cache-primary-key }}
