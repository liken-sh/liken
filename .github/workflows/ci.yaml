    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: people-operator
          file: people-operator/${{ matrix.file }}
          push: false
          cache-from: type=registry,ref=ghcr.io/liken-sh/${{ matrix.image }}:buildcache

