      publish: ${{ fromJSON(needs.plan.outputs.components)['trust'].publish }}
      jobs: ${{ toJSON(fromJSON(needs.plan.outputs.components)['trust'].jobs) }}
      images: ${{ toJSON(fromJSON(needs.plan.outputs.components)['trust'].images) }}
    permissions:
      contents: read
      packages: write

  trust-publish:
    needs: [plan, trust]
    if: ${{ !failure() && !cancelled() && fromJSON(needs.plan.outputs.components)['trust'].publish != 'none' }}
    uses: ./.github/workflows/component-trust.yaml
    with:
      stage: publish
      dryrun: false
      version: ${{ fromJSON(needs.plan.outputs.components)['trust'].version }}
      publish: ${{ fromJSON(needs.plan.outputs.components)['trust'].publish }}
      jobs: '[]'
      images: '[]'
    permissions:
      contents: read
      packages: write

  audio-operator:
    needs: [plan, trust]
    if: ${{ !failure() && !cancelled() && fromJSON(needs.plan.outputs.components)['audio-operator'].check }}
    uses: ./.github/workflows/component-audio-operator.yaml
