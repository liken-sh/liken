      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: people-operator-docs-build-${{ runner.os }}-${{ hashFiles('people-operator/docs/go.sum') }}-${{ github.sha }}
          restore-keys: people-operator-docs-build-${{ runner.os }}-${{ hashFiles('people-operator/docs/go.sum') }}-

      - run: make test-docs

  people-operator-images:
    name: people-operator / ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.people-operator == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
