# This is the build environment for every job that assembles the
# operating system. Each such job runs liken's Makefiles and needs the
# same runner preparation: toolchain, virtual hardware, and caches. So
# that preparation lives here once, and the jobs cannot grow apart.
# The paths are from the repository root, because a composite action
# does not take the working directory of the job that uses it.
name: build setup
description: Toolchain, KVM access, and vendored-input caches for building liken

# A composite action has no step that runs after the job's own steps, so
# the job saves its Go build cache itself, with these outputs.
outputs:
  go-build-key:
    description: The key of the Go build cache, for the job's save step
    value: ${{ steps.go-build.outputs.cache-primary-key }}
  go-build-hit:
    description: Whether the Go build cache's key matched exactly
    value: ${{ steps.go-build.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # A composite action takes the env of the job that uses it, so the
    # `GOPROXY` of component-liken.yaml covers every download here:
    # after any error from proxy.golang.org, `go` fetches the module
    # from its origin, and the checksum database still verifies it.
    # ci/templates/component.yaml.tmpl gives the reason.
    - id: setup-go
      uses: actions/setup-go@v6
      with:
        go-version-file: liken/go.mod
        cache: false

    # The repository's Actions cache holds 10 GB, and GitHub evicts the
    # oldest entries when the caches pass that limit. So every run
    # restores the Go caches, and only a push to main saves them: a
    # branch never writes an entry that pushes one of main's out. These
    # are the key formats and the paths of the `go-restore` template in
    # `ci/templates/go.tmpl`. The paths must be the same, because the
    # cache version of an entry is a hash of its paths, and a restore
    # with other paths misses.
    #
    # The downloaded modules are one entry for `liken`, keyed on the
    # hash of `liken/go.sum`, which the `go` job of `liken` saves: it
    # runs the tests of `liken`, so it reads every module that these
    # jobs read. The entry holds the extracted source and, from the
    # download cache, only the `go.mod` files and the zip hashes, which
    # `go` needs to build without the network. The zip files are about
    # half of the compressed entry, and `go` does not read them after
    # it extracts the source.
    - id: go-modules
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/go/pkg/mod/*
          !~/go/pkg/mod/cache
          ~/go/pkg/mod/cache/download/**/*.mod
          ~/go/pkg/mod/cache/download/**/*.ziphash
        key: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ hashFiles('liken/go.sum') }}
        restore-keys: go-modules-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-

    # The build cache holds Go's test results and the compiled packages
    # of liken itself, and most commits change both. So the key ends in
    # the commit: each push to main saves a new entry, and every run
    # restores the newest one. The cost is one entry of compiled output
    # for each job on each push to main. Each job that calls this action
    # has entries of its own.
    #
    # Before the commit, the key holds the hash of go.sum, the
    # Makefiles, and package.toml: they choose what the build compiles
    # and with which flags. A restore takes the newest entry with the
    # same hash, and when none exists, as on a branch that changes one
    # of those files, the newest entry of the same job.
    - id: go-build
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/go-build
        key: go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/*/Makefile', 'liken/package.toml') }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-${{ hashFiles('liken/go.sum', 'liken/Makefile', 'liken/*/Makefile', 'liken/package.toml') }}-
          go-build-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-liken-${{ github.job }}-

    # The fetch scripts document their own host requirements, and the
    # runner image already has most of them (curl, tar, ar, zstd,
    # openssl, docker). cpio archives the image, and depmod (kmod)
    # indexes the kernel's modules. QEMU, qemu-img (qemu-utils), and
    # OVMF are the smoke drill's virtual hardware: the same packages,
    # at the same firmware path, that the dev-cluster Makefile
    # documents.
    #
    # A package mirror sometimes accepts the connection and then sends
    # nothing, and apt's default has no transfer timeout, so the read
    # blocks until the job's timeout-minutes ends the whole run. The
    # Timeout option ends a silent transfer after 30 seconds, and the
    # Retries option tries the fetch three more times, so a dead
    # mirror costs about two minutes instead of the job ceiling. The
    # https transport reads the http options as its defaults, so one
    # pair of options covers both schemes. A composite action's steps
    # accept no timeout-minutes of their own, so the limit must live
    # in the command.
    - name: install host tools
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends cpio kmod qemu-system-x86 qemu-utils ovmf

    # The runners expose /dev/kvm, but only to root. This is the
    # standard rule to open it to every user, which is fine on a
    # single-use throwaway VM. If this rule ever breaks, the smoke
    # drill gets slower rather than failing: the QEMU flags fall back
    # from KVM to pure emulation (-accel kvm -accel tcg, in that
    # order).
    - name: open /dev/kvm to the runner user
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # This is one cache for each vendored domain, keyed on the same
    # prerequisites that liken/Makefile declares for that domain's
    # artifact. A pin bump changes the key, so only that domain
    # rebuilds cold; the kernel's 187M does not download again just
    # because k3s moved. The Go programs are deliberately not cached
    # here (beyond the Go cache above): they are the code under test,
    # and they rebuild on every run.
    #
    # Unlike the Go cache, these entries save on every branch. The key
    # follows the pinned content alone, so a branch writes an entry
    # only when it bumps a pin, and then every later push of that
    # branch restores it instead of fetching the domain again. Such a
    # write is large, the kernel's is 187M, but a bump branch is rare,
    # and its entry leaves the cache a week after its last use.
    - uses: actions/cache@v6
      with:
        path: liken/kernel/dist
        key: kernel-${{ hashFiles('liken/kernel/VERSION', 'liken/kernel/fetch.sh') }}
    - uses: actions/cache@v6
      with:
        path: liken/k3s/dist
        key: k3s-${{ hashFiles('liken/k3s/VERSION', 'liken/k3s/fetch.sh') }}
    - uses: actions/cache@v6
      with:
        path: liken/xtables/dist
        key: xtables-${{ hashFiles('liken/xtables/VERSION', 'liken/xtables/fetch.sh') }}
    - uses: actions/cache@v6
      with:
        path: trust/dist
        key: trust-${{ hashFiles('trust/VERSION', 'trust/fetch.sh') }}
    - uses: actions/cache@v6
      with:
        path: liken/e2fsprogs/dist
        key: e2fsprogs-${{ hashFiles('liken/e2fsprogs/VERSION', 'liken/e2fsprogs/fetch.sh') }}
    # The cache carries only what fetch.sh built. The iscsid image
    # tar in it is always stale, because the tar bakes in the liken
    # version, and that version now changes with every commit. The
    # version stamp file (version.mk) gets a fresh timestamp during
    # the run. So make rebuilds the tar from the cached binaries every
    # time. This step is cheap, compared to the container build that
    # the cache exists to avoid.
    - uses: actions/cache@v6
      with:
        path: liken/open-iscsi/dist
        key: open-iscsi-${{ hashFiles('liken/open-iscsi/VERSION', 'liken/open-iscsi/fetch.sh') }}
    - uses: actions/cache@v6
      with:
        path: liken/nfs-utils/dist
        key: nfs-utils-${{ hashFiles('liken/nfs-utils/VERSION', 'liken/nfs-utils/fetch.sh') }}
    # The key covers build.config too, because the feature list
    # decides what the binary contains.
    - uses: actions/cache@v6
      with:
        path: liken/wpa-supplicant/dist
        key: wpa-supplicant-${{ hashFiles('liken/wpa-supplicant/VERSION', 'liken/wpa-supplicant/fetch.sh', 'liken/wpa-supplicant/build.config') }}
    - uses: actions/cache@v6
      with:
        path: liken/systemd-boot/dist
        key: systemd-boot-${{ hashFiles('liken/systemd-boot/VERSION', 'liken/systemd-boot/fetch.sh') }}
    # grub's dist carries the fetched module tree and tool, plus the
    # core image linked from them. So the key also covers the inputs
    # to the link step: the embedded config and the module list in
    # the Makefile.
    - uses: actions/cache@v6
      with:
        path: liken/grub/dist
        key: grub-${{ hashFiles('liken/grub/VERSION', 'liken/grub/fetch.sh', 'liken/grub/early.cfg', 'liken/grub/Makefile') }}
    # The firmware cache carries the derived set, not the upstream
    # tarball, so a hit skips both the 400 MB download and the
    # derivation. The key includes the kernel pin because the derived
    # set is a function of the kernel's module tree: a kernel bump
    # must re-derive even when the firmware pin is unchanged.
    - uses: actions/cache@v6
      with:
        path: liken/linux-firmware/dist
        key: linux-firmware-${{ hashFiles('liken/linux-firmware/VERSION', 'liken/linux-firmware/fetch.sh', 'liken/linux-firmware/derive.sh', 'liken/kernel/VERSION') }}
    # The microcode key includes the linux-firmware pin because the
    # AMD half comes from that domain's tree.
    - uses: actions/cache@v6
      with:
        path: liken/microcode/dist
        key: microcode-${{ hashFiles('liken/microcode/VERSION', 'liken/microcode/fetch.sh', 'liken/linux-firmware/VERSION') }}

    # Make determines staleness by timestamps, and the two halves of
    # this working tree carry different timestamps: checkout stamps
    # the sources with the time of the run, while the cache restores
    # its artifacts with the older times they were archived with. Left
    # alone, every cached artifact looks out of date, and make
    # fetches it all again. Touching the restored artifacts is
    # correct, because each cache key hashes the artifact's real
    # prerequisites. A cache hit means those inputs are unchanged, so
    # the artifact is current regardless of its timestamp.
    - name: refresh cached artifact timestamps
      shell: bash
      run: |
        cd liken
        for dist in kernel/dist k3s/dist xtables/dist ../trust/dist \
                    e2fsprogs/dist open-iscsi/dist nfs-utils/dist \
                    wpa-supplicant/dist \
                    systemd-boot/dist grub/dist linux-firmware/dist \
                    microcode/dist; do
            [ -d "$dist" ] && find "$dist" -type f -exec touch {} +
        done
        true
