# The DeviceClass of the claim template in cec.yaml.
---
# `liken` publishes two devices for a USB CEC adapter: its `-cec`
# device, with the node /dev/cecN, and an `-input` device for the TV
# remote's buttons, which a media Remote claims. This class matches the
# `cec` subsystem only. Many `liken` devices have no subsystem
# attribute, and reading a missing attribute is a CEL error, so the
# expression checks with has() first.
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: cec-adapter
spec:
  selectors:
    - cel:
        expression: |
          device.driver == "liken.sh" &&
          has(device.attributes["liken.sh"].subsystem) &&
          device.attributes["liken.sh"].subsystem == "cec"
