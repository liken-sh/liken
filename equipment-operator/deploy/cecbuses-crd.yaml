# A CECBus is one HDMI tree, which has one CEC wire, and the USB CEC
# adapters on the cluster's machines that connect to it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cecbuses.equipment.liken.sh
spec:
  group: equipment.liken.sh
  names:
    kind: CECBus
    listKind: CECBusList
    plural: cecbuses
    singular: cecbus
    categories: [equipment]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource gives spec and status separate write
      # paths. A person writes the spec. The node workload on each
      # adapter's machine writes that adapter's entry under
      # status.adapters, and the operator's Deployment writes
      # status.devices and the conditions.
      subresources:
        status: {}
      # The default columns answer whether the bus works. The columns
      # with priority 1 show only in kubectl get -o wide, because the
      # lists of adapter states and device names grow with the bus.
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Name
          type: string
          jsonPath: .spec.osdName
        - name: Machines
          type: string
          jsonPath: .spec.adapters[*].machine
        - name: Joined
          type: string
          jsonPath: .status.conditions[?(@.type=="Joined")].status
        - name: Coherent
          type: string
          jsonPath: .status.conditions[?(@.type=="Coherent")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Scanned
          type: string
          jsonPath: .status.conditions[?(@.type=="Scanned")].status
          priority: 1
        - name: State
          type: string
          jsonPath: .status.adapters[*].state
          priority: 1
        - name: Devices
          type: string
          jsonPath: .status.devices[*].osdName
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: "One HDMI tree, which has one CEC wire, and the USB CEC adapters on the cluster's machines that connect to it. CEC gives a bus no name, so you choose the name of the `CECBus`. The TV never shows that name. It lists each adapter by `spec.osdName`. When the node workload finds an adapter on a machine that no `CECBus` lists, it creates a `CECBus` in `Listen`, named after the machine and labeled `equipment.liken.sh/discovered`. To take over a discovered `CECBus`, create your own under a different name that lists the same machine. The node workload then deletes the discovered one. Do not apply your spec under the discovered name. The node workload created that spec under its own field manager, so a server-side apply conflicts, and the object keeps the label, so the node workload deletes it as soon as another `CECBus` lists the machine."
          required: [spec]
          properties:
            spec:
              type: object
              description: "The mode, the OSD name, and the adapters of the bus."
              required: [mode, adapters]
              # An adapter in Control announces the physical address of
              # its Display, so every adapter needs a display before the
              # bus can be in Control.
              x-kubernetes-validations:
                - rule: "self.mode != 'Control' || self.adapters.all(adapter, has(adapter.display))"
                  message: "a CECBus in Control needs spec.adapters[].display on every adapter"
              properties:
                mode:
                  type: string
                  enum: [Listen, Control]
                  description: "Whether the adapters may send on the bus. A message on a CEC bus can wake the TV and switch its input, so the adapters send nothing until you set `Control`. In `Listen`, each adapter opens the bus as a monitor, which needs CAP_NET_ADMIN, claims no logical address, and lists the devices it hears. Only a poll finds a device that stays silent, and a poll is a transmission, so the list in `Listen` can miss devices. In `Control`, each adapter claims a playback logical address, announces `spec.osdName` and the physical address of its `Display`, replies to the TV, and scans the bus once when it joins. After the scan it sends nothing on a timer. It sends the replies that CEC requires, the commands that a person's request causes, one query to each device that announces itself, and a read of the TV's power status when it needs one: when the TV announces itself with an unknown power status, around a command, and when the remote's power button is pressed."
                osdName:
                  type: string
                  default: liken
                  minLength: 1
                  maxLength: 14
                  pattern: "^[ -~]+$"
                  description: "The name that every adapter of the bus announces in Control. The TV lists it as the name of the source in its input menu. It is 1 to 14 printable ASCII characters, from space to tilde, because that is the limit of the operand of Set OSD Name in HDMI-CEC 1.3a (CEC Table 26). The default is `liken`. The kernel sets the name only when an adapter claims a logical address, so when you change the name, each adapter releases its address and claims it again, and the source leaves the TV's input menu and comes back."
                adapters:
                  type: array
                  minItems: 1
                  maxItems: 8
                  description: "The adapters connected to this wire, one entry for each machine, from 1 to 8 entries."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [machine]
                  items:
                    type: object
                    required: [machine]
                    properties:
                      machine:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The `Machine` that the adapter is plugged into. `liken` publishes the adapter as the machine's `-cec` device, and the node workload on that machine opens it."
                      display:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The `Display` whose physical address the adapter announces in Control. Required in Control. `display-operator` reads the address from the monitor's EDID and publishes it at `status.physicalAddress` of the `Display`. The adapter announces this address even when it is plugged into a spare input and passes no video, because the address is where the picture of this `Display` enters the HDMI tree. So an Active Source message from the adapter switches the TV, and any receiver between them, to the input that shows this `Display`."
            status:
              type: object
              description: "What the adapters report, and the device list and conditions that the operator derives from those reports."
              properties:
                adapters:
                  type: array
                  description: "One entry for each adapter. The node workload on the adapter's machine writes the entry under its own field manager. The operator ignores the entry of a machine that `spec.adapters` does not list."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [machine]
                  items:
                    type: object
                    required: [machine]
                    properties:
                      machine:
                        type: string
                        description: "The `Machine` that the adapter is plugged into."
                      mode:
                        type: string
                        description: "The mode that the adapter runs in."
                      state:
                        type: string
                        description: "How far the adapter is through its start-up. `Listening`: the adapter is a monitor. `Joining`: the adapter is in Control and has no logical address yet. `Joined`: it has a logical address and has not finished its scan. `Scanned`: it finished the scan it runs when it joins. `Refused`: a kernel or API server call that the adapter needs failed, and `message` has the error. `Stopped`: the node workload stopped, cleared the adapter's logical addresses, and left the bus, and `message` says why."
                      driver:
                        type: string
                        description: "The kernel driver of the adapter, such as `pulse8-cec`."
                      physicalAddress:
                        type: string
                        description: "The physical address the adapter announces, in the dotted form 1.3.0.0."
                      logicalAddress:
                        type: integer
                        description: "The logical address that the adapter claimed. It is absent in Listen and until the adapter claims one."
                      osdName:
                        type: string
                        description: "The OSD name that the adapter announces in Control. It is `spec.osdName` of the bus."
                      activeSource:
                        type: string
                        description: "The physical address in the last Active Source message that the adapter heard or sent, in the dotted form 1.3.0.0. Active Source is a broadcast, so an adapter hears it in `Listen` and in `Control`. The kernel does not return an adapter's own messages to it, so the node workload records the Active Source messages that it sends itself."
                      message:
                        type: string
                        description: "Why the adapter is not in the state that its mode needs, as the error text of the call that failed."
                      reportedAt:
                        type: string
                        format: date-time
                        description: "When the node workload last wrote this entry. It writes the entry only when the entry changes, so an old time does not mean that the entry is stale. The operator treats an entry that is not `Stopped` as stale when no pod of the `equipment-operator-cec` DaemonSet runs on the entry's machine, when the pod there stopped being Ready after the entry was written, or when a new pod there is still not Ready 60 seconds after the entry was written."
                      devices:
                        type: array
                        description: "The devices that this adapter found. In `Control` the adapter polls every logical address when it joins, and queries each device that answers. After that it updates the list from the messages that devices send. When a new device broadcasts Report Physical Address, the adapter adds it and queries it once for the facts that message does not include. The adapter removes a device only when the device does not acknowledge a message, so a device that leaves the bus silently stays in the list until the adapter joins again. In `Listen` the adapter lists the devices it hears."
                        items:
                            type: object
                            required: [logicalAddress]
                            properties:
                              physicalAddress:
                                type: string
                                description: "The position of the device in the HDMI tree, in the dotted form 1.0.0.0. It is absent until the device reports it."
                              logicalAddress:
                                type: integer
                                minimum: 0
                                maximum: 15
                                description: "The logical address of the device. 0 is the TV and 5 is the audio system."
                              type:
                                type: string
                                description: "The device type that the device reports, or the type that its logical address implies. One of `TV`, `Recording`, `Tuner`, `Playback`, `AudioSystem`, `Switch`, `Processor`, `Backup`, or `Specific`."
                              osdName:
                                type: string
                                description: "The OSD name that the device reports, at most 14 characters."
                              vendor:
                                type: string
                                description: "The IEEE OUI of the device, as six hex digits. A Device Vendor ID of 000000 means no vendor, so it never replaces a vendor that the device reported before. The field is absent until the device reports a real one."
                              cecVersion:
                                type: string
                                description: "The CEC version that the device reports, from `1.1` to `2.0`."
                              power:
                                type: string
                                description: "The power status that the device last reported: `On`, `Standby`, `ToOn`, or `ToStandby`."
                              systemAudioMode:
                                type: string
                                enum: ["On", "Off"]
                                description: "The System Audio Mode that the audio system, the device at logical address 5, last reported. While it is `On`, the TV mutes its own speakers and sends its remote's volume keys to the audio system (HDMI-CEC 1.3a, CEC 13.15.2). In `Control` the adapter reads the mode in its scan. After that, a broadcast Set System Audio Mode, such as the `Off` that an audio system broadcasts before standby, updates it, and so does a System Audio Mode Status. When a wake sends a System Audio Mode Request and no broadcast `On` follows, the adapter reads the mode once more. A Set System Audio Mode sent to one device, such as the TV, does not update it, because the audio system sends its first `On` to the TV alone and goes no further when the TV refuses it. Absent until the audio system reports it."
                              systemAudioModeAt:
                                type: string
                                format: date-time
                                description: "When the adapter last read or heard `systemAudioMode`."
                devices:
                  type: array
                  description: "Every device on the wire, merged from the reports of the adapters by physical address, in tree order: the TV first, then each device after the device it is connected to. When two adapters report one fact differently, the adapter that comes first in `spec.adapters` wins. The exception is the System Audio Mode, where the report with the later `systemAudioModeAt` wins."
                  items:
                    type: object
                    required: [logicalAddress]
                    properties:
                      physicalAddress:
                        type: string
                        description: "The position of the device in the HDMI tree, in the dotted form 1.0.0.0. It is absent until the device reports it."
                      logicalAddress:
                        type: integer
                        minimum: 0
                        maximum: 15
                        description: "The logical address of the device. 0 is the TV and 5 is the audio system."
                      type:
                        type: string
                        description: "The device type that the device reports, or the type that its logical address implies. One of `TV`, `Recording`, `Tuner`, `Playback`, `AudioSystem`, `Switch`, `Processor`, `Backup`, or `Specific`."
                      osdName:
                        type: string
                        description: "The OSD name that the device reports, at most 14 characters."
                      vendor:
                        type: string
                        description: "The IEEE OUI of the device, as six hex digits. A Device Vendor ID of 000000 means no vendor, so it never replaces a vendor that the device reported before. The field is absent until the device reports a real one."
                      cecVersion:
                        type: string
                        description: "The CEC version that the device reports, from `1.1` to `2.0`."
                      power:
                        type: string
                        description: "The power status that the device last reported: `On`, `Standby`, `ToOn`, or `ToStandby`."
                      systemAudioMode:
                        type: string
                        enum: ["On", "Off"]
                        description: "The System Audio Mode that the audio system, the device at logical address 5, last reported. While it is `On`, the TV mutes its own speakers and sends its remote's volume keys to the audio system (HDMI-CEC 1.3a, CEC 13.15.2). In `Control` the adapter reads the mode in its scan. After that, a broadcast Set System Audio Mode, such as the `Off` that an audio system broadcasts before standby, updates it, and so does a System Audio Mode Status. When a wake sends a System Audio Mode Request and no broadcast `On` follows, the adapter reads the mode once more. A Set System Audio Mode sent to one device, such as the TV, does not update it, because the audio system sends its first `On` to the TV alone and goes no further when the TV refuses it. Absent until the audio system reports it."
                      systemAudioModeAt:
                        type: string
                        format: date-time
                        description: "When an adapter last read or heard `systemAudioMode`."
                conditions:
                  type: array
                  description: "`AddressKnown`: every adapter in `Control` announces the physical address of its Display. `Joined`: every adapter in `Control` holds a logical address. `Coherent`: each adapter sees every other adapter on the bus at the physical address that the other announces. When one does not, the two adapters are probably on different wires. `Coherent` compares only adapters that finished a scan, and matches them by physical address, because every adapter of a bus announces the same OSD name. `Scanned`: every adapter finished the scan it runs when it joins and found at least one device. It is never `True` in `Listen`. An adapter that finds no device may be on an HDMI cable that does not carry the CEC wire. In `Listen`, `AddressKnown` and `Joined` are `False` and `Coherent` is `Unknown`, with the reason `Listening`. In `Control`, when an adapter's entry is stale, each condition is `Unknown` with the reason `Stale`, and when an adapter's node workload stopped, each condition is `False` with the reason `Stopped`."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
