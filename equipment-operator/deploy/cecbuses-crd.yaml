# A CECBus is one HDMI tree, which means one CEC wire, and the USB CEC
# adapters on the cluster's machines that are connected to it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cecbuses.equipment.liken.sh
spec:
  group: equipment.liken.sh
  names:
    kind: CECBus
    listKind: CECBusList
    plural: cecbuses
    singular: cecbus
    categories: [equipment]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. A person declares the spec. The node workload on each
      # adapter's machine writes that adapter's entry under
      # status.adapters, and the operator's Deployment writes
      # status.devices and the conditions.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Joined
          type: string
          jsonPath: .status.conditions[?(@.type=="Joined")].status
        - name: Scanned
          type: string
          jsonPath: .status.conditions[?(@.type=="Scanned")].status
        - name: Coherent
          type: string
          jsonPath: .status.conditions[?(@.type=="Coherent")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One HDMI tree, which means one CEC wire, and the USB CEC adapters on the cluster's machines that are connected to it. CEC gives a bus no name, so a person names it. A node workload that holds an adapter no CECBus names creates a CECBus in Listen, named after its machine, with the equipment.liken.sh/discovered label. A person's CECBus that names the same machine takes over, and the node workload deletes the one it created. To adopt a discovered CECBus, create one under a new name that names the same machine, and delete the discovered one; an apply under the discovered name conflicts with the node workload, which owns that object's spec."
          required: [spec]
          properties:
            spec:
              type: object
              description: "The mode and the adapters. A person writes every field."
              required: [mode, adapters]
              # An adapter in Control announces its Display's physical
              # address, so each adapter names a Display before the bus
              # may enter Control.
              x-kubernetes-validations:
                - rule: "self.mode != 'Control' || self.adapters.all(adapter, has(adapter.display))"
                  message: "a CECBus in Control names a display for every adapter"
              properties:
                mode:
                  type: string
                  enum: [Listen, Control]
                  description: "The consent a person gives the adapters, because a device on a CEC bus can wake the TV and switch its input. Listen claims no logical address and sends nothing: each adapter opens the bus as a monitor, which needs CAP_NET_ADMIN, and reports the devices it hears. A full device list needs polls, and a poll is a transmission, so the device list in Listen is partial. Control claims a playback logical address with the machine's name as the OSD name, announces the Display's physical address, answers the TV, and scans the bus every minute."
                adapters:
                  type: array
                  minItems: 1
                  maxItems: 8
                  description: "The adapters connected to this wire, one for each machine."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [machine]
                  items:
                    type: object
                    required: [machine]
                    properties:
                      machine:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The Machine that carries the adapter. liken publishes the adapter as the machine's -cec device, and the node workload on that machine holds it."
                      display:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The Display whose physical address the adapter announces in Control. display-operator reads the address from the EDID and publishes it at the Display's status.physicalAddress. The adapter is connected to a spare input and carries no video, and the address makes an Active Source from the adapter switch the TV and the receiver to this Display's input."
            status:
              type: object
              description: "What the adapters report and what the operator derives from their reports."
              properties:
                adapters:
                  type: array
                  description: "One entry for each adapter, written by the node workload on that adapter's machine under its own field manager. Only the entries of machines the spec names count."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [machine]
                  items:
                    type: object
                    required: [machine]
                    properties:
                      machine:
                        type: string
                        description: "The Machine that carries the adapter."
                      mode:
                        type: string
                        description: "The mode the adapter runs."
                      state:
                        type: string
                        description: "Where the adapter is in its work. Listening: the adapter is a monitor. Joining: the adapter is in Control and holds no logical address. Joined: it holds a logical address and has not finished a scan. Scanned: it finished at least one scan. Refused: a call the adapter needs failed, and message gives the kernel's or the API server's text. Stopped: the node workload stopped, cleared the adapter's logical addresses, and left the bus, and message says why."
                      driver:
                        type: string
                        description: "The kernel driver of the adapter, such as pulse8-cec."
                      physicalAddress:
                        type: string
                        description: "The physical address the adapter announces, in the dotted form 1.3.0.0."
                      logicalAddress:
                        type: integer
                        description: "The logical address the adapter holds. It is absent in Listen and while the adapter holds none."
                      osdName:
                        type: string
                        description: "The OSD name the adapter announces: its machine's name, cut to 14 characters."
                      message:
                        type: string
                        description: "Why the adapter is not where its mode asks, in the words of the call that failed."
                      reportedAt:
                        type: string
                        format: date-time
                        description: "When the node workload last wrote this entry. It writes the entry every 30 seconds even when nothing changed, and the conditions treat an entry older than 90 seconds as stale, because its pod stopped without a word."
                      devices:
                        type: array
                        description: "The devices this adapter found. In Control a scan polls every logical address and asks each device that answers for its facts. In Listen the adapter reports the devices it hears."
                        items:
                            type: object
                            required: [logicalAddress]
                            properties:
                              physicalAddress:
                                type: string
                                description: "The device's place in the HDMI tree, in the dotted form 1.0.0.0. It is absent until the device states it."
                              logicalAddress:
                                type: integer
                                minimum: 0
                                maximum: 15
                                description: "The logical address the device holds. 0 is the TV and 5 is the audio system."
                              type:
                                type: string
                                description: "The device type the device reports, or the one its logical address implies: TV, Recording, Tuner, Playback, AudioSystem, Switch, Processor, Backup, or Specific."
                              osdName:
                                type: string
                                description: "The name the device reports, at most 14 characters."
                              vendor:
                                type: string
                                description: "The device's IEEE OUI, as six hex digits."
                              cecVersion:
                                type: string
                                description: "The CEC version the device reports: 1.3a, 1.4, or 2.0."
                              power:
                                type: string
                                description: "The power status the device last reported: On, Standby, ToOn, or ToStandby."
                devices:
                  type: array
                  description: "Every device on the wire, merged from the adapters' reports by physical address, in tree order: the TV first, then each device after the device it is connected to. When two adapters report one fact differently, the adapter first in spec.adapters wins."
                  items:
                    type: object
                    required: [logicalAddress]
                    properties:
                      physicalAddress:
                        type: string
                        description: "The device's place in the HDMI tree, in the dotted form 1.0.0.0. It is absent until the device states it."
                      logicalAddress:
                        type: integer
                        minimum: 0
                        maximum: 15
                        description: "The logical address the device holds. 0 is the TV and 5 is the audio system."
                      type:
                        type: string
                        description: "The device type the device reports, or the one its logical address implies: TV, Recording, Tuner, Playback, AudioSystem, Switch, Processor, Backup, or Specific."
                      osdName:
                        type: string
                        description: "The name the device reports, at most 14 characters."
                      vendor:
                        type: string
                        description: "The device's IEEE OUI, as six hex digits."
                      cecVersion:
                        type: string
                        description: "The CEC version the device reports: 1.3a, 1.4, or 2.0."
                      power:
                        type: string
                        description: "The power status the device last reported: On, Standby, ToOn, or ToStandby."
                conditions:
                  type: array
                  description: "AddressKnown: every adapter in Control announces its Display's physical address. Joined: every adapter in Control holds a logical address. Coherent: the adapters see each other on the bus, and an adapter that does not is on a different wire than the spec states. Scanned: the device list is complete, which only Control achieves; a bus where an adapter finds no device says that the cable between the adapter and the receiver may not carry the CEC wire. An adapter whose entry is stale makes each condition Unknown with the reason Stale, and an adapter whose node workload stopped makes each condition False with the reason Stopped. Coherent compares only adapters that finished a scan, by their OSD names."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
                      lastTransitionTime:
                        type: string
                        format: date-time
