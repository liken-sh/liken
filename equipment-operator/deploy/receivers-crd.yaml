# A Receiver is one audio/video receiver the cluster drives over
# the network.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: receivers.equipment.liken.sh
spec:
  group: equipment.liken.sh
  names:
    kind: Receiver
    listKind: ReceiverList
    plural: receivers
    singular: receiver
    categories: [equipment]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # The status subresource splits spec and status into two write
      # paths. People declare the spec; only the operator writes
      # status.
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Driver
          type: string
          jsonPath: .status.driver
        - name: Power
          type: string
          jsonPath: .status.zones.main.power
        - name: Input
          type: string
          jsonPath: .status.zones.main.input
        - name: Volume
          type: string
          jsonPath: .status.zones.main.volume
        - name: Reachable
          type: string
          jsonPath: .status.conditions[?(@.type=="Reachable")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: "One piece of A/V equipment on the far end of a machine's cable. The resource declares the protocol that reaches it, the inputs liken machines feed, and the session that currently uses it."
          required: [spec]
          properties:
            spec:
              type: object
              description: "How to reach the receiver and how its inputs are wired. The cluster owner writes every field except session. The media operator applies session."
              # One protocol block names the receiver, and this rule
              # holds a Receiver to one of them. A second protocol is
              # one more entry in this list.
              x-kubernetes-validations:
                - rule: "[has(self.denon), has(self.wiim)].exists_one(block, block)"
                  message: "a Receiver names exactly one protocol block"
                # A Denon reports a limit beside every volume, and that
                # number moves under the room, so a Denon needs a
                # ceiling the owner states.
                - rule: "!has(self.denon) || (has(self.volume) && has(self.volume.max))"
                  message: "a Denon receiver states spec.volume.max"
                # An input name is how a session asks for an input, so a
                # session that names an input the wiring does not declare
                # would select nothing.
                - rule: "!has(self.session) || (has(self.inputs) && self.inputs.exists(input, input.name == self.session.input))"
                  message: "a session names an input the wiring declares"
              properties:
                denon:
                  type: object
                  required: [address]
                  description: "The receiver accepts the Denon and Marantz control protocol on TCP port 23. Commands such as MV50 and receiver events use the same plain-text form."
                  properties:
                    address:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "The host name or IP address the receiver answers on, with an optional port. The port is 23 when absent."
                    settings:
                      type: object
                      description: "The receiver's settings, one family per block, in display units. A declared value is enforced when the block changes: the operator re-sends every declared field on purpose, and a pass with no change sends nothing, so an omitted key leaves the receiver unchanged. A key written from the settings topic returns here at the leaf, so a declared key and a bus write never own the same field."
                      properties:
                        system:
                          type: object
                          description: "The unit-wide settings. Power is reported by the driver but not declarable here, because the controller owns it through spec.power."
                          properties:
                            eco:
                              type: string
                              description: "The Eco mode the receiver uses: auto, on, or off."
                            dimmer:
                              type: string
                              description: "The display dimmer: off, dim, dark, or bright."
                            autoStandby:
                              type: string
                              description: "The auto standby timer: off, or 15m, 30m, 60m, 2h, 4h, or 8h."
                            speakerPreset:
                              type: integer
                              minimum: 1
                              maximum: 4
                              description: "The speaker preset, 1 through 4."
                            audioInputMode:
                              type: string
                              description: "The audio input mode: auto, hdmi, digital, or analog."
                            videoSelect:
                              type: string
                              description: "The video source the receiver selects, a name it already knows, or off."
                            bluetoothTransmitter:
                              type: string
                              description: "The Bluetooth transmitter: on or off."
                            bluetoothOutput:
                              type: string
                              description: "The Bluetooth output: speakers or bluetooth."
                        tone:
                          type: object
                          description: "The tone control and the two trims, in display units where 0dB is neutral."
                          properties:
                            control:
                              type: boolean
                              description: "Whether the tone trims apply. False bypasses them."
                            bass:
                              type: integer
                              minimum: -12
                              maximum: 12
                              description: "The bass trim, 12dB on each side of neutral."
                            treble:
                              type: integer
                              minimum: -12
                              maximum: 12
                              description: "The treble trim, 12dB on each side of neutral."
                        audyssey:
                          type: object
                          description: "The Audyssey room correction settings."
                          properties:
                            multeq:
                              type: string
                              description: "The MultEQ mode: reference, l/r bypass, flat, manual, or off."
                            dynamicEq:
                              type: boolean
                              description: "Whether Dynamic EQ is on."
                            referenceLevelOffset:
                              type: integer
                              enum: [0, 5, 10, 15]
                              description: "The reference level offset, in dB, one of 0, 5, 10, or 15."
                            dynamicVolume:
                              type: string
                              description: "The Dynamic Volume mode, such as off, light, medium, or heavy."
                            loudnessManagement:
                              type: boolean
                              description: "Whether Loudness Management is on."
                        audio:
                          type: object
                          description: "The audio processing settings."
                          properties:
                            drc:
                              type: string
                              description: "The Dynamic Range mode: off, auto, low, mid, or hi."
                            lfe:
                              type: integer
                              minimum: -10
                              maximum: 0
                              description: "The LFE level, a cut from 0dB down to 10dB."
                            effect:
                              type: integer
                              description: "The effect level."
                            delay:
                              type: integer
                              minimum: 0
                              maximum: 999
                              description: "The delay, 0 to 999 milliseconds."
                            audioDelay:
                              type: integer
                              minimum: 0
                              maximum: 999
                              description: "The audio delay, 0 to 999 milliseconds."
                            subwoofer:
                              type: boolean
                              description: "Whether the subwoofer is on."
                            restorer:
                              type: string
                              description: "The Audio Restorer mode: off, low, medium, or high."
                            graphicEq:
                              type: string
                              description: "The Graphic EQ: off or on."
                            headphoneEq:
                              type: string
                              description: "The Headphone EQ: off or on."
                            speakerVirtualizer:
                              type: boolean
                              description: "Whether the Speaker Virtualizer is on."
                            dialogEnhancer:
                              type: string
                              description: "The Dialog Enhancer level: off, low, mid, or high."
                        channelVolumes:
                          type: object
                          description: "One trim per channel, keyed by the channel's name, in display units where 0dB is neutral."
                          additionalProperties:
                            type: number
                wiim:
                  type: object
                  required: [uuid]
                  description: "The receiver answers the WiiM/LinkPlay control protocol over unauthenticated HTTPS on port 443. Every request is a GET to /httpapi.asp?command=<name>, and the device's own LinkPlay UUID is the identity the operator checks before it drives anything."
                  properties:
                    uuid:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: "The device's LinkPlay UUID: twelve bytes of hex, the value getStatusEx returns as uuid and the first twelve bytes of the UUID mDNS and SSDP advertise. It is the identity, stable across a reboot and a DHCP lease change. The operator reads the device's uuid and compares it before it sends any command, so an address that moved never drives the wrong amp."
                    address:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "The host name or IP address the device answers on, with an optional port. The port is 443 when absent. The address is a hint and never the identity: the operator still matches the uuid. Optional because discovery resolves the UUID to an address on its own; with neither, the receiver is unreachable."
                volume:
                  type: object
                  description: "The loudest level a press may set and the distance one press moves, both in the receiver's own scale. A Denon requires max."
                  # A ceiling of zero would mute the room, and a step of
                  # zero would freeze it, so both must be above zero
                  # when stated.
                  x-kubernetes-validations:
                    - rule: "!has(self.max) || self.max > 0"
                      message: "the volume ceiling is above zero"
                    - rule: "!has(self.step) || self.step > 0"
                      message: "the volume step is above zero"
                  properties:
                    max:
                      type: number
                      maximum: 98
                      description: "The loudest a press may drive this receiver, in its own scale. A Denon counts 0 to 98 and this is capped there. 100 on the bus means this value. A hand on the receiver's own remote can still go past it."
                    step:
                      type: number
                      description: "How far one press moves the receiver, in its own scale. Half steps are allowed. Absent means one whole unit."
                inputs:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: atomic
                  description: "The receiver inputs that liken machines feed. The cluster owner declares this wiring because the operator cannot discover it. A receiver forwards one EDID on every input, so the monitor ID alone cannot distinguish two machines. Each entry therefore names its machine."
                  # A name is how a session asks for an input, so two
                  # entries under one name name two different inputs
                  # and the request is ambiguous. maxItems bounds the
                  # cost of the pairwise check.
                  x-kubernetes-validations:
                    - rule: "self.all(input, self.exists_one(other, other.name == input.name))"
                      message: "input names are unique"
                  items:
                    type: object
                    required: [name, machine, monitor]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        description: "The input's name on the receiver, as its protocol spells it: MPLAY, GAME, TV, CBL/SAT."
                      machine:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The liken machine whose HDMI output lands on this input, by node name."
                      monitor:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The monitor id the display and audio operators publish for this cable, such as don-0070-denon-avr. It is the check that the wire is really there."
                      soundMode:
                        type: string
                        maxLength: 63
                        description: "The sound mode the receiver selects with this input, when present. The session selects it in the same one-shot that selects the input, so a Play brings the picture and the mode together."
                session:
                  type: object
                  required: [player, input, volumeTopic]
                  description: "The Player that currently uses the receiver. The media operator applies this block with its own field manager while the Player has a screen on this receiver, and removes it afterward. The session owns the level from the volume topic and marks itself owner on that topic plus /owner. The operator sends power and input commands once each time active or awake changes to true. It does not re-assert those commands. A person using the receiver's remote can therefore change them."
                  properties:
                    player:
                      type: string
                      minLength: 3
                      maxLength: 507
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: "The Player, as namespace/name."
                    input:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: "The input the Player plays through, by its name in spec.inputs."
                    volumeTopic:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: "The Player's volume topic on the media bus, in full. The operator subscribes to it, publishes a retained owner mark on the topic plus /owner while the session exists, and writes the receiver's true level back to it."
                    powerTopic:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: "The topic on which the remote's power button publishes a toggle, in full. When present, the operator subscribes to it and flips the receiver's power on a {\"action\":\"toggle\"} message, updating spec.power to match. An absent topic subscribes the session to nothing."
                    active:
                      type: boolean
                      description: "Whether a Play is present on the Player. When this changes to true, the receiver is powered on and its input is selected once. Changing this to false does not send a power or input command. The session still owns the level. The awake field can independently trigger those commands. Absent means false."
                    awake:
                      type: boolean
                      description: "Whether the room's screen is awake. A change to true triggers the same one-shot power and input commands as active, whatever active says. A change to false sends no command to the receiver. Absent means asleep."
                power:
                  type: string
                  enum: ["on", "off", "standby"]
                  description: "The power state the operator drives the receiver to. The operator owns this field: it applies it once per change and never re-asserts it, so a GitOps manifest that omits it leaves the receiver wherever the operator last put it. A toggle from the session's power topic rewrites it. The Denon cannot tell standby from off, so both mean standby."
                settingsTopic:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: "The topic the operator subscribes to for the life of the Receiver. A message on it is a settings toggle write, {\"setting\":\"tone.bass\",\"value\":3}, with the value in display units. An absent topic subscribes to nothing."
                commandsTopic:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: "The topic the operator subscribes to for the life of the Receiver. A message on it is a one-shot command, {\"command\":\"quick.3\"}, an action that is not a setting. An absent topic subscribes to nothing."
                zones:
                  type: object
                  description: "The receiver's second and third zones. Only zone2 and zone3 are valid keys, so no other key is a valid input and the driver can serve every zone this schema admits. The main zone has no entry here: spec.power and spec.session drive it."
                  properties:
                    zone2:
                      type: object
                      description: "The receiver's second zone. Every field is optional, so a bare key just claims the zone."
                      properties:
                        power:
                          type: string
                          enum: ["on", "off", "standby"]
                          description: "The power state the operator drives this zone to."
                        input:
                          type: string
                          minLength: 1
                          maxLength: 63
                          description: "The input this zone selects, by its name in spec.inputs."
                        volume:
                          type: number
                          description: "The zone's volume in the receiver's display units."
                        mute:
                          type: boolean
                          description: "Whether this zone is muted."
                        sleep:
                          type: integer
                          minimum: 0
                          maximum: 120
                          description: "Minutes until this zone sleeps, and zero means no sleep timer."
                    zone3:
                      type: object
                      description: "The receiver's third zone. Every field is optional, so a bare key just claims the zone."
                      properties:
                        power:
                          type: string
                          enum: ["on", "off", "standby"]
                          description: "The power state the operator drives this zone to."
                        input:
                          type: string
                          minLength: 1
                          maxLength: 63
                          description: "The input this zone selects, by its name in spec.inputs."
                        volume:
                          type: number
                          description: "The zone's volume in the receiver's display units."
                        mute:
                          type: boolean
                          description: "Whether this zone is muted."
                        sleep:
                          type: integer
                          minimum: 0
                          maximum: 120
                          description: "Minutes until this zone sleeps, and zero means no sleep timer."
            status:
              type: object
              description: "What the receiver last reported, in its own units, plus the protocol's own settings. Only the operator writes it."
              properties:
                driver:
                  type: string
                  description: "The protocol driver the receiver's spec names: denon or wiim. It is the block the operator built the driver from, so a reader sees which protocol the row is driven through. Empty until the operator builds the driver."
                zones:
                  type: object
                  description: "One entry per zone the receiver reported, keyed by the zone's protocol name. A single-zone receiver reports main."
                  additionalProperties:
                    type: object
                    properties:
                      power:
                        type: string
                        description: "The power state the zone last reported: on, standby, or off."
                      input:
                        type: string
                        description: "The input the zone last reported as selected, whether liken selected it or a person did."
                      soundMode:
                        type: string
                        description: "The sound mode the zone last reported, such as STEREO or MULTI CH IN."
                      mute:
                        type: boolean
                        description: "Whether the zone last reported itself muted."
                      volume:
                        type: string
                        description: "The zone's volume in the receiver's own scale. A Denon counts 0 to 98 in half steps."
                      volumeMax:
                        type: string
                        description: "The last volume limit the receiver sent for this zone, in the same scale. It is what the receiver said and nothing the operator acts on: on a Denon the number moves with the volume."
                      sleep:
                        type: integer
                        description: "Minutes until the zone sleeps, and zero when no sleep timer stands."
                denon:
                  type: object
                  description: "The Denon protocol's own settings, in the receiver's units: the system settings, the tone trims, the Audyssey settings, the audio settings, and the channel volumes. The driver owns this shape, and denon/AGENTS.md documents it."
                  x-kubernetes-preserve-unknown-fields: true
                wiim:
                  type: object
                  description: "The WiiM protocol's own observable status, in the device's units: identity, network, playback, now-playing, audio, equalizer, timers, Bluetooth, presets, and controls. The driver owns this shape, and wiim/AGENTS.md documents it."
                  x-kubernetes-preserve-unknown-fields: true
                service:
                  type: string
                  description: "The Service that represents the receiver on the cluster network after the operator creates it. Empty until then."
                conditions:
                  type: array
                  description: "Reachable is True only after a recent answered exchange with the receiver, never on an open socket alone."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: >-
                          The check this entry reports, in CamelCase. It
                          is the key of this list.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: >-
                          The verdict. True is the good verdict, and
                          Unknown means the operator cannot tell yet.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The metadata.generation this condition judged.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: >-
                          One CamelCase word for why the condition holds
                          this verdict, meant for a program to match on.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The same answer in a sentence a person reads.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When the verdict last changed. It moves only
                          when the status flips.
