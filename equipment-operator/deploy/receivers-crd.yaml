# A `Receiver` is an A/V receiver that a `liken` machine plays through.
# `equipment-operator` controls it over the network.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: receivers.equipment.liken.sh
spec:
  group: equipment.liken.sh
  names:
    kind: Receiver
    listKind: ReceiverList
    plural: receivers
    singular: receiver
    categories: [equipment]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # With the status subresource, a write to the spec cannot change
      # status, and a write to status cannot change the spec. People
      # write the spec. The operator writes status, and `media-operator`
      # writes `status.session`.
      subresources:
        status: {}
      # The default columns show the main zone's power, input, and
      # volume, and the Player that uses the receiver, from
      # `status.session`. `kubectl get -o wide` adds the columns with
      # priority 1: the driver, the address, whether a Play is present,
      # and the sound mode.
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .status.model
        - name: Power
          type: string
          jsonPath: .status.zones.main.power
        - name: Input
          type: string
          jsonPath: .status.zones.main.input
        - name: Volume
          type: string
          jsonPath: .status.zones.main.volume
        - name: Player
          type: string
          jsonPath: .status.session.player
        - name: Reachable
          type: string
          jsonPath: .status.conditions[?(@.type=="Reachable")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Driver
          type: string
          jsonPath: .status.driver
          priority: 1
        - name: Address
          type: string
          jsonPath: .status.address
          priority: 1
        - name: Playing
          type: boolean
          jsonPath: .status.session.active
          priority: 1
        - name: Sound
          type: string
          jsonPath: .status.zones.main.soundMode
          priority: 1
      schema:
        openAPIV3Schema:
          type: object
          description: "An A/V receiver that a `liken` machine plays through. The spec says which protocol `equipment-operator` controls it with, which of its inputs `liken` machines are connected to, and which settings to apply. The status has the state that the receiver last reported, and the Player session that uses it."
          required: [spec]
          properties:
            spec:
              type: object
              description: "How to reach the receiver, how its inputs are wired, and which settings to apply. You write these fields, except `session`, which is for a media operator that does not write `status.session`. The operator also writes `spec.power` after it carries out a power request."
              # A `Receiver` has exactly one protocol block. A new
              # protocol adds an entry to this list.
              x-kubernetes-validations:
                - rule: "[has(self.denon), has(self.wiim)].exists_one(block, block)"
                  message: "a Receiver names exactly one protocol block"
                # A Denon sends a volume limit with each volume report,
                # but the limit changes with the volume, so the operator
                # cannot use it as a ceiling. You set the ceiling in
                # `spec.volume.max` instead.
                - rule: "!has(self.denon) || (has(self.volume) && has(self.volume.max))"
                  message: "a Denon receiver states spec.volume.max"
                # A session selects an input by its name. A session whose
                # input is not in `spec.inputs` would select nothing.
                - rule: "!has(self.session) || (has(self.inputs) && self.inputs.exists(input, input.name == self.session.input))"
                  message: "a session names an input the wiring declares"
              properties:
                denon:
                  type: object
                  required: [address]
                  description: "Settings for a receiver that speaks the Denon and Marantz control protocol, which is plain text over TCP port 23. A command such as `MV50` sets the volume, and the receiver sends its events in the same form."
                  properties:
                    address:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "The host name or IP address of the receiver, with an optional port. The default port is 23."
                    settings:
                      type: object
                      description: "The receiver's settings in display units, in one block for each group. A key that you omit leaves the receiver unchanged. For each declared field, the operator compares the declared value with the value that the receiver reports, and sends the field only when they differ. So a restart sends nothing to a receiver that already has the declared values, and the operator sets back a change made at the receiver. When the receiver still reports another value after 3 sends of one declared value, the operator stops sending the field, and the `SettingsConfirmed` condition lists it. A new declared value, or a report of the declared value, resets the count. An edit of another field does not. The operator cannot compare a field that the receiver does not report, so it sends that field once each time the spec changes this block. After an operator restart, it sends such a field again only when the block differs from its digest in `status.settledSettings`."
                      properties:
                        system:
                          type: object
                          description: "Settings of the whole receiver. Power is not a setting here, because `spec.power` sets it."
                          properties:
                            eco:
                              type: string
                              description: "The Eco mode the receiver uses: auto, on, or off."
                            dimmer:
                              type: string
                              description: "The display dimmer: off, dim, dark, or bright."
                            autoStandby:
                              type: string
                              description: "The auto standby timer: off, or 15m, 30m, 60m, 2h, 4h, or 8h."
                            speakerPreset:
                              type: integer
                              minimum: 1
                              maximum: 4
                              description: "The speaker preset, 1 through 4."
                            audioInputMode:
                              type: string
                              description: "The audio input mode: auto, hdmi, digital, or analog."
                            videoSelect:
                              type: string
                              description: "The video source the receiver selects, a name it already knows, or off."
                            bluetoothTransmitter:
                              type: string
                              description: "The Bluetooth transmitter: on or off."
                            bluetoothOutput:
                              type: string
                              description: "The Bluetooth output: speakers or bluetooth."
                        tone:
                          type: object
                          description: "The tone control and the bass and treble trims, in display units where 0dB is neutral."
                          properties:
                            control:
                              type: boolean
                              description: "Whether the tone trims apply. False bypasses them."
                            bass:
                              type: integer
                              minimum: -12
                              maximum: 12
                              description: "The bass trim, from -12dB to 12dB."
                            treble:
                              type: integer
                              minimum: -12
                              maximum: 12
                              description: "The treble trim, from -12dB to 12dB."
                        audyssey:
                          type: object
                          description: "The Audyssey room correction settings."
                          properties:
                            multeq:
                              type: string
                              description: "The MultEQ mode: reference, l/r bypass, flat, manual, or off."
                            dynamicEq:
                              type: boolean
                              description: "Whether Dynamic EQ is on."
                            referenceLevelOffset:
                              type: integer
                              enum: [0, 5, 10, 15]
                              description: "The reference level offset, in dB, one of 0, 5, 10, or 15."
                            dynamicVolume:
                              type: string
                              description: "The Dynamic Volume mode, such as off, light, medium, or heavy."
                            loudnessManagement:
                              type: boolean
                              description: "Whether Loudness Management is on."
                        audio:
                          type: object
                          description: "The audio processing settings."
                          properties:
                            drc:
                              type: string
                              description: "The Dynamic Range mode: off, auto, low, mid, or hi."
                            lfe:
                              type: integer
                              minimum: -10
                              maximum: 0
                              description: "The LFE level, from -10dB to 0dB."
                            effect:
                              type: integer
                              description: "The effect level."
                            delay:
                              type: integer
                              minimum: 0
                              maximum: 999
                              description: "The delay, 0 to 999 milliseconds."
                            audioDelay:
                              type: integer
                              minimum: 0
                              maximum: 999
                              description: "The audio delay, 0 to 999 milliseconds."
                            subwoofer:
                              type: boolean
                              description: "Whether the subwoofer is on."
                            restorer:
                              type: string
                              description: "The Audio Restorer mode: off, low, medium, or high."
                            graphicEq:
                              type: string
                              description: "The Graphic EQ: off or on."
                            headphoneEq:
                              type: string
                              description: "The Headphone EQ: off or on."
                            speakerVirtualizer:
                              type: boolean
                              description: "Whether the Speaker Virtualizer is on."
                            dialogEnhancer:
                              type: string
                              description: "The Dialog Enhancer level: off, low, mid, or high."
                        hdmi:
                          type: object
                          description: "The settings of the receiver's Video > HDMI Setup menu, including its HDMI-CEC switches."
                          properties:
                            audioOut:
                              type: string
                              enum: [avr, tv]
                              description: "Where HDMI audio plays: avr for the receiver's own amplifier, or tv."
                            passThrough:
                              type: boolean
                              description: "Whether HDMI Pass Through sends a source to the TV while the receiver is in standby."
                            passThroughSource:
                              type: string
                              enum: [last, hdmi1, hdmi2, hdmi3, hdmi4, hdmi5, hdmi6, hdmi7]
                              description: "The source that passes through in standby: last for the last source selected, or hdmi1 to hdmi7 for one HDMI input jack. The receiver offers only the jacks that have a source assigned."
                            rcSourceSelect:
                              type: string
                              enum: [powerOnAndSource, sourceSelectOnly]
                              description: "What a source button on the remote does while the receiver is in standby: powerOnAndSource turns the receiver on and selects the source, and sourceSelectOnly selects the source for pass through and leaves the receiver in standby."
                            control:
                              type: boolean
                              description: "Whether HDMI Control, the receiver's HDMI-CEC switch, is on."
                            arc:
                              type: boolean
                              description: "Whether the Audio Return Channel is on. It needs HDMI Control."
                            tvAudioSwitching:
                              type: boolean
                              description: "Whether the receiver selects the TV input when the TV plays its own sound over HDMI Control."
                            powerOffControl:
                              type: string
                              enum: [all, video, off]
                              description: "Which devices the TV's power off turns off over HDMI Control: all, video, or off."
                            powerSaving:
                              type: boolean
                              description: "Whether HDMI Control's power saving is on."
                        channelVolumes:
                          type: object
                          description: "One trim per channel, keyed by the channel's name, in display units where 0dB is neutral."
                          additionalProperties:
                            type: number
                wiim:
                  type: object
                  required: [uuid]
                  description: "Settings for a WiiM device, which the operator controls with the LinkPlay HTTP API: a `GET` to `/httpapi.asp?command=<name>` over HTTPS on port 443, with no authentication. The operator drives only a WiiM. Network discovery creates a `Receiver` only for a device whose UPnP description has a `modelName` that begins with `WiiM`, and the driver sends commands only to a device whose `getStatusEx` `project` begins with `WiiM`, in any letter case. To a device of another brand on the LinkPlay platform, the operator sends `getStatusEx` and nothing else."
                  properties:
                    uuid:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: "The device's LinkPlay UUID, twelve bytes in hex. It is the `uuid` that `getStatusEx` returns, and the first twelve bytes of the UUID that mDNS and SSDP advertise. It does not change when the device reboots or gets a new DHCP lease. Before the operator sends any command, it reads the device's `uuid` and compares it with this field, so a command never goes to a different device that now has the old address."
                    address:
                      type: string
                      minLength: 1
                      maxLength: 253
                      description: "The host name or IP address of the device, with an optional port. The default port is 443. While network discovery is on, the field is optional, because discovery finds the address from the `uuid`. When the operator's `EQUIPMENT_NETWORK_DISCOVERY` variable is `off`, you must set it. Without an address from either source, the `Receiver` is unreachable. The operator checks the `uuid` at whichever address it uses."
                    settings:
                      type: object
                      description: "The device's own settings, in one block for each group. The operator applies them under the same rules as `spec.denon.settings`: it sends a field only when the device reports another value, at most 3 times for one declared value, and sends a field that the device does not report once each time this block changes. A key that you omit leaves the device unchanged, and an empty block sends nothing."
                      properties:
                        audio:
                          type: object
                          description: "The device's audio settings."
                          properties:
                            balance:
                              type: number
                              minimum: -1
                              maximum: 1
                              description: "The left-right balance, -1.0 fully left to 1.0 fully right."
                        device:
                          type: object
                          description: "The device's own name and its front-panel controls."
                          properties:
                            name:
                              type: string
                              minLength: 1
                              maxLength: 63
                              description: "The device's name. The operator sets it over the API. The `uuid`, not the name, identifies the device."
                            led:
                              type: boolean
                              description: "Whether the status light is on."
                            buttons:
                              type: boolean
                              description: "Whether the touch controls are enabled."
                volume:
                  type: object
                  description: "The loudest level that a key press may set, how far one press moves the volume, and which component draws the volume indicator. Levels are in the receiver's own scale. `media-operator` reads `max` and `step` when it turns a press of a volume key into `status.session.volumeAsk`. A Denon requires `max`."
                  # A ceiling of zero would mute the receiver, and a step
                  # of zero would never change the volume, so each must be
                  # above zero when set.
                  x-kubernetes-validations:
                    - rule: "!has(self.max) || self.max > 0"
                      message: "the volume ceiling is above zero"
                    - rule: "!has(self.step) || self.step > 0"
                      message: "the volume step is above zero"
                  properties:
                    max:
                      type: number
                      maximum: 98
                      description: "The loudest level that a volume key can set on this receiver, in its own scale. A Denon counts 0 to 98, so `max` is at most 98. `media-operator` writes no `volumeAsk` above `max`, and draws the level on the Player's screen as the reported volume divided by `max`. The receiver's own remote can still go above it."
                    step:
                      type: number
                      description: "How far one press moves the volume, in the receiver's own scale. Half steps are allowed. When absent, one press moves one whole unit."
                    indicator:
                      type: string
                      enum: [Player, Receiver]
                      default: Player
                      description: "Which device shows the volume level while this receiver controls a Player's volume. `Player`, the default, means the Player's screens draw their volume bar. `Receiver` means the receiver shows its own overlay on the TV, so the Player's screens draw none. `media-operator` reads this field and sends the level to the screens in both cases. `equipment-operator` does not read it. The field applies to every protocol."
                inputs:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: atomic
                  description: "The receiver inputs that `liken` machines are connected to. The operator cannot discover this wiring, so you declare it. A receiver presents the same EDID on every input, so each machine connected to it publishes the same `Display` name, and each entry also names its machine."
                  # A session selects an input by its name, so two entries
                  # with one name would make the selection ambiguous.
                  # `maxItems` limits the cost of the pairwise check.
                  x-kubernetes-validations:
                    - rule: "self.all(input, self.exists_one(other, other.name == input.name))"
                      message: "input names are unique"
                  items:
                    type: object
                    required: [name, machine, monitor]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                        description: "The input's name on the receiver, as its protocol spells it, such as `MPLAY`, `GAME`, `TV`, or `CBL/SAT`."
                      machine:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The `liken` machine whose HDMI output is connected to this input, by node name."
                      monitor:
                        type: string
                        minLength: 1
                        maxLength: 253
                        description: "The name of the `Display` that `display-operator` publishes for this machine's output on this cable, such as `don-0070-denon-avr`. With `machine`, it tells the operator which `Display` this input shows, so the operator can find the TV that a session on this input wakes, and the CEC bus that the receiver is on."
                      soundMode:
                        type: string
                        maxLength: 63
                        description: "An optional sound mode. When a session selects this input, the operator selects this sound mode with it."
                session:
                  type: object
                  required: [player, input]
                  description: "The Player that currently uses the receiver, for a media operator that does not write `status.session`. The operator uses this block only while `status.session` is absent, and applies its fields as `status.session` describes. A media operator applies this block with its own field manager while the Player has a screen on this receiver, and removes it afterward."
                  properties:
                    player:
                      type: string
                      minLength: 3
                      maxLength: 507
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: "The Player, as `namespace/name`."
                    input:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: "The input that the Player plays through, by its name in `spec.inputs`."
                    active:
                      type: boolean
                      description: "Same as `status.session.active`."
                    awake:
                      type: boolean
                      description: "Same as `status.session.awake`."
                    volumeAsk:
                      type: object
                      required: [level, at]
                      description: "Same as `status.session.volumeAsk`."
                      properties:
                        level:
                          type: number
                          minimum: 0
                          description: "The volume in the receiver's own scale, the scale of `spec.volume.max`. A Denon counts 0 to 98 in half steps, and the driver sends a higher level as the top of the scale."
                        mute:
                          type: boolean
                          description: "Whether the receiver is muted. The default is not muted."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                    powerAsk:
                      type: object
                      required: [action, at]
                      description: "Same as `status.session.powerAsk`."
                      properties:
                        action:
                          type: string
                          enum: [toggle, "on", "off"]
                          description: "`toggle`, `on`, or `off`. Quote `on` and `off` in YAML, as in `action: \"on\"`, because kubectl's YAML parser reads an unquoted `on` or `off` as a boolean."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                    inputAsk:
                      type: object
                      required: [action, at]
                      description: "Same as `status.session.inputAsk`."
                      properties:
                        action:
                          type: string
                          enum: [ensure, show]
                          description: "`ensure` for any press, and `show` for a press of the home key."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                power:
                  type: string
                  enum: ["On", Standby, "Off"]
                  description: "The power state that the operator sets on the receiver: `On`, `Standby`, or `Off`. A Denon has no `Off` separate from standby, so both values mean standby. A WiiM has no standby and always reports `On`. Quote the value in YAML, as in `power: \"On\"`, because kubectl's YAML parser reads an unquoted `On` or `Off` as a boolean, and the API server refuses it. The operator sends each new value once and does not enforce it, so a person who turns the receiver on or off by hand is not overruled, and a GitOps manifest that omits the field leaves the receiver as the operator last set it. When the value changes, including on a `Receiver` created while the operator runs, the operator waits until it has read the receiver's state, and sends the value only when the receiver reports another power. An edit of another field sends nothing. When the operator starts, it sends nothing for this field unless the value differs from `status.settledPower`, because a different value is an edit made while the operator was stopped. With no `status.settledPower`, it records the value it finds and sends nothing. The operator also writes this field after it carries out a `status.session.powerAsk`."
                zones:
                  type: object
                  description: "The receiver's second and third zones, under the keys `zone2` and `zone3`. The main zone is not here, because `spec.power` and `spec.session` control it. The operator applies a zone's controls under the same rules as `spec.denon.settings`: it sends a control only when the zone reports another value, at most 3 times for one declared value, and sends a control that the zone does not report once each time `spec.zones` changes."
                  properties:
                    zone2:
                      type: object
                      description: "The receiver's second zone. Every field is optional, and a key with no fields sends nothing."
                      properties:
                        power:
                          type: string
                          enum: ["On", Standby, "Off"]
                          description: "The power state that the operator sets on this zone. Quote `On` and `Off` in YAML."
                        input:
                          type: string
                          minLength: 1
                          maxLength: 63
                          description: "The input that this zone selects, by its name in `spec.inputs`."
                        volume:
                          type: number
                          description: "The zone's volume in the receiver's display units."
                        mute:
                          type: boolean
                          description: "Whether this zone is muted."
                        sleep:
                          type: integer
                          minimum: 0
                          maximum: 120
                          description: "Minutes until this zone sleeps. Zero means no sleep timer."
                    zone3:
                      type: object
                      description: "The receiver's third zone. Every field is optional, and a key with no fields sends nothing."
                      properties:
                        power:
                          type: string
                          enum: ["On", Standby, "Off"]
                          description: "The power state that the operator sets on this zone. Quote `On` and `Off` in YAML."
                        input:
                          type: string
                          minLength: 1
                          maxLength: 63
                          description: "The input that this zone selects, by its name in `spec.inputs`."
                        volume:
                          type: number
                          description: "The zone's volume in the receiver's display units."
                        mute:
                          type: boolean
                          description: "Whether this zone is muted."
                        sleep:
                          type: integer
                          minimum: 0
                          maximum: 120
                          description: "Minutes until this zone sleeps. Zero means no sleep timer."
            status:
              type: object
              description: "The state that the receiver last reported, in its own units, and the protocol's own status. The operator writes it, except `session`, which `media-operator` writes."
              properties:
                address:
                  type: string
                  description: "The address where the operator reaches the receiver. For a WiiM it is the declared address, or the address that discovery found when the spec has none. For a Denon it is the declared address, resolved. It is empty until the operator has created the driver."
                model:
                  type: string
                  description: "The receiver's model as its maker names it, such as `WiiM Amp` or `AVR-X1700H`. It tells you which device a `Receiver` controls when the `Receiver`'s name is a discovered UUID. For a WiiM, the operator reads `modelName` from the device's UPnP description on port 49152, after the device has identified itself as a WiiM. For a Denon, it reads `modelName` from the AIOS description on port 60006, which receivers of the AVR-X 2016 generation and later serve. The field is empty until the operator has read it, and stays empty for a receiver that serves no description."
                manufacturer:
                  type: string
                  description: "The receiver's maker from the same UPnP description, such as `Denon` or `Marantz`. A WiiM reports `Linkplay Technology Inc.`, the maker of its platform, so use `status.model` to tell whether a device is a WiiM. Empty whenever `status.model` is empty."
                driver:
                  type: string
                  description: "The protocol driver that the operator created from the spec's protocol block: `denon` or `wiim`. Empty until the operator has created the driver."
                zones:
                  type: object
                  description: "One entry for each zone that the receiver reported, keyed by the zone's name in the protocol. A receiver with one zone reports `main`."
                  additionalProperties:
                    type: object
                    properties:
                      power:
                        type: string
                        description: "The power state that the zone last reported: `On`, `Standby`, or `Off`. A WiiM has no standby, so it always reports `On`."
                      input:
                        type: string
                        description: "The input that the zone last reported, whether `liken` or a person selected it."
                      soundMode:
                        type: string
                        description: "The sound mode that the zone last reported, such as `STEREO` or `MULTI CH IN`."
                      mute:
                        type: boolean
                        description: "Whether the zone last reported itself muted."
                      volume:
                        type: string
                        description: "The zone's volume in the receiver's own scale. A Denon counts 0 to 98 in half steps."
                      volumeMax:
                        type: string
                        description: "The volume limit that the receiver last reported for this zone, in the same scale. The operator does not act on it, because a Denon's limit changes with the volume."
                      sleep:
                        type: integer
                        description: "Minutes until the zone sleeps, and zero when no sleep timer is set."
                denon:
                  type: object
                  description: "The Denon receiver's own settings as it reports them, in its units: the system settings, the tone trims, the Audyssey settings, the audio settings, the HDMI setup, and the channel volumes. The driver defines this shape, and `denon/AGENTS.md` documents it."
                  x-kubernetes-preserve-unknown-fields: true
                wiim:
                  type: object
                  description: "The WiiM device's own status, in its units: identity, network, playback, now-playing, audio, equalizer, timers, Bluetooth, presets, and controls. The driver defines this shape, and `wiim/AGENTS.md` documents it. The device sends UPnP events for the volume, the mute state, and the transport state. The operator reads `getStatusEx` and `getPlayerStatus` every 10 seconds, so the identity, the network, and the input are at most 10 seconds old. It reads the track again when the player reports a new one, and reads the sleep timer every 10 seconds while the timer runs. The other groups have no events, so the operator reads them when it starts, after it sends a setting in the group, when it opens a UPnP subscription again, when the device responds again after it was unreachable or after it refused to renew a subscription, and every 30 minutes. So a change made in the WiiM Home app to one of those groups appears here within 30 minutes. The block leaves out values that change on their own between reads: the device's clock, the track position, and the seconds left on the sleep timer, which the zone's `sleep` reports in whole minutes. The temperatures, the Wi-Fi signal, noise, signal-to-noise ratio, and rate, and the remote's battery and signal are in the `equipment_wiim_*` metrics."
                  x-kubernetes-preserve-unknown-fields: true
                session:
                  type: object
                  required: [player, input]
                  description: "The Player that currently uses the receiver. `media-operator` applies this block with its own field manager while the Player has a screen on this receiver, and removes it afterward. The block is in status, so a change of `active` or `awake` does not change `metadata.generation`. The operator reads this block first, uses `spec.session` only while this block is absent, and never writes this block itself. The operator changes the volume only for a `volumeAsk`, and applies each `powerAsk` and `inputAsk` request once. Each time `active` or `awake` changes to `true`, the operator waits until it has read the receiver's state, and then sends the power, the input, and the input's sound mode, each only when the receiver reports another value. A Denon reports a sound mode in other words than the command that selects it, so the operator compares the declared and the reported mode by command family, for the families that the driver knows. A session that appears while the operator runs gets these commands for the flags it starts with. A session that the operator finds in its first pass after a start sends nothing for its flags, because the previous operator already acted on them. The operator does not repeat these commands, so a person can still change the power, the input, or the sound mode with the receiver's remote."
                  properties:
                    player:
                      type: string
                      minLength: 3
                      maxLength: 507
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?/[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                      description: "The Player, as `namespace/name`."
                    input:
                      type: string
                      minLength: 1
                      maxLength: 63
                      description: "The input that the Player plays through, by its name in `spec.inputs`."
                    active:
                      type: boolean
                      description: "Whether a Play is present on the Player. The default is `false`. When it changes to `true`, the operator turns the receiver on and selects the input, once, each only when the receiver reports another value. A change to `false` sends no power or input command, and `volumeAsk` still applies. `awake` triggers the same commands on its own."
                    awake:
                      type: boolean
                      description: "Whether the Player's screen is on. `media-operator` sets it to `false` while the Player's `spec.power` is `Off`. The default is `false`. A change to `true` triggers the same one-time power and input commands as `active`, whatever the value of `active`. A change to `false` sends no command to the receiver."
                    volumeAsk:
                      type: object
                      required: [level, at]
                      description: "A request for an absolute volume and mute state, which `media-operator` writes when someone presses a volume key. The operator applies each request once, when `at` changes. It sends `level` as the volume and `mute` as the mute state, each only when the receiver reports another value. When requests arrive faster than the receiver reports the volume it was last sent, the operator sends only the newest, as soon as the receiver reports the last volume or 1 second after it sent that volume, whichever comes first. A request that the operator finds in its first pass after a start sends nothing, because someone may have turned the receiver's knob since the request was made. The operator does not enforce the request, so the receiver's remote can still change the volume. The operator does not check `level` against `spec.volume.max`. `media-operator` keeps its requests at or below that ceiling."
                      properties:
                        level:
                          type: number
                          minimum: 0
                          description: "The volume in the receiver's own scale, the scale of `spec.volume.max`. A Denon counts 0 to 98 in half steps, and the driver sends a higher level as the top of the scale."
                        mute:
                          type: boolean
                          description: "Whether the receiver is muted. The default is not muted."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                    powerAsk:
                      type: object
                      required: [action, at]
                      description: "A request to turn the Player's receiver and TV on or off. `media-operator` writes `off` when its Player's `spec.power` changes to `Off`. The operator applies each request once, when `at` changes, and a request that it finds in its first pass after a start sends nothing. `toggle` turns the equipment off when it is on, and on when it is off. `on` and `off` act only when the equipment is not in that state already, because HDMI-CEC 1.3a, section CEC 13.13.3, defines each to leave the device in its state when it is pressed again. To decide whether the equipment is on, the operator uses the TV's power when the session's input is a `Display` that a `Television` lists: `On` or `ToOn` is on, and any other power is off. Nothing reads the TV's power on a timer. So when an adapter in `Control` mode finds the `Television`'s TV, and its `Reachable` condition is `True`, or `False` with the reason `NoPower`, the operator first requests a read through the `Television`'s `status.session.powerReadAt`. It waits up to 3 seconds for `status.powerRead`, and uses the last `status.power` when no answer arrives. When there is no such `Television`, or the TV does not answer and has reported no power, the operator uses the receiver's power. To turn off, the operator requests standby through the `Television`'s `status.session.standbyAt` and puts the receiver in standby. A receiver with no standby command, such as a WiiM, stays on, and the operator logs that. To turn on, the operator wakes the `Television`, selects the session's input, and turns the receiver on. When the operator cannot reach the receiver, it sends the receiver nothing and logs that. The TV still turns on or off if it has reported its power, and the request is dropped if it has not. After the receiver changes, the operator sets `spec.power` to match."
                      properties:
                        action:
                          type: string
                          enum: [toggle, "on", "off"]
                          description: "`toggle`, `on`, or `off`. Quote `on` and `off` in YAML, as in `action: \"on\"`, because kubectl's YAML parser reads an unquoted `on` or `off` as a boolean."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                    inputAsk:
                      type: object
                      required: [action, at]
                      description: "A request to select the session's input, which `media-operator` writes when someone presses a controller key. The operator applies each request once, when `at` changes, and a request that it finds in its first pass after a start sends nothing. `ensure` sends the session's input and that input's sound mode, only when the receiver is on and reports another input. `show` does the same, and also asks the `Television` that shows the session's input to show the session's `Display`, through the `Television`'s `status.session.showAt`. The TV receives Image View On and Active Source only when it reports `On` and the Player's screen is on. Neither action turns the receiver on. `media-operator` reads the `InputSelected` condition to decide whether a press needs an `ensure`."
                      properties:
                        action:
                          type: string
                          enum: [ensure, show]
                          description: "`ensure` for any press, and `show` for a press of the home key."
                        at:
                          type: string
                          format: date-time
                          description: "When the request was made, as an RFC 3339 time with milliseconds. A new value is a new request."
                cec:
                  type: object
                  required: [bus, logicalAddress]
                  description: "The receiver's identity on HDMI-CEC and its System Audio Mode, from the device at logical address 5, the audio system, in the `CECBus`'s `status.devices`. The operator writes this block only on a `Receiver` that is the `via` of a `Display` in a `Television`'s `status.displays`. A `Receiver` is a `via` when the bus has an audio system above the `Display` in the HDMI tree, and an input of the `Receiver` names the `Display`'s machine and monitor. The block is absent on any other `Receiver`, such as one that a `Display` reaches only by an optical cable, which carries no CEC. Power and volume are not here, because `status.zones` reports them. While `systemAudioMode` is `On`, the TV sends its remote's volume keys to the receiver over CEC, so `status.zones` can show volume changes that `liken` did not make. Each change of `systemAudioMode` posts a Normal `Event`, `SystemAudioModeOn` or `SystemAudioModeOff`, because the mode also changes without `liken`: the receiver turns it off before standby, and a person turns it off by choosing the TV's speakers."
                  properties:
                    bus:
                      type: string
                      description: "The `CECBus` that the receiver is the audio system of."
                    logicalAddress:
                      type: integer
                      minimum: 0
                      maximum: 15
                      description: "The receiver's logical address, which is 5 for an audio system."
                    physicalAddress:
                      type: string
                      description: "The receiver's position in the HDMI tree, in dotted form such as `1.0.0.0`."
                    osdName:
                      type: string
                      description: "The name that the receiver reports on the bus, at most 14 characters."
                    vendor:
                      type: string
                      description: "The receiver's IEEE OUI on the bus, as six hex digits. A Device Vendor ID of `000000` means no vendor, so it never replaces a vendor that the device reported earlier, and the field is absent until the device reports a real one."
                    cecVersion:
                      type: string
                      description: "The CEC version that the receiver reports: `1.3a`, `1.4`, or `2.0`."
                    systemAudioMode:
                      type: string
                      enum: ["On", "Off"]
                      description: "The System Audio Mode that the receiver last reported. While it is `On`, the TV mutes its own speakers and sends its remote's volume keys to the receiver (HDMI-CEC 1.3a, section CEC 13.15.2). When the operator wakes the TV through this receiver, it requests `On`, and the receiver broadcasts `Off` before standby. Absent until an adapter has read or heard the mode."
                    systemAudioModeAt:
                      type: string
                      format: date-time
                      description: "When an adapter of the bus last read or heard `systemAudioMode`."
                settledPower:
                  type: string
                  enum: ["On", Standby, "Off"]
                  description: "The `spec.power` value that the operator last settled: it sent the value, found the receiver already at it, or recorded the value it found when it started. A restart that finds `spec.power` at this value sends nothing."
                settledSettings:
                  type: object
                  description: "A digest of each declared block that the operator has sent, keyed by the block's path in the spec: `spec.denon.settings`, `spec.wiim.settings`, or `spec.zones`. After a restart, the operator sends a block's unreported fields again only when the block's digest differs from the one here. So a restart sends nothing for a block that nobody changed, and sends the unreported fields once for a new `Receiver` or for a block edited while the operator was stopped."
                  additionalProperties:
                    type: string
                powerGeneration:
                  type: integer
                  format: int64
                  description: "A field that an earlier version of the operator wrote: the `metadata.generation` whose `spec.power` it had settled. The operator does not read or write it, and its first status apply removes it."
                settingsGeneration:
                  type: integer
                  format: int64
                  description: "A field that an earlier version of the operator wrote: the `metadata.generation` whose declared settings it had sent. When the operator starts and finds this field with no `settledSettings`, it records each declared block as sent and sends nothing for it. The operator does not write this field, and its first status apply removes it."
                conditions:
                  type: array
                  description: "`Reachable` is `True` only when the receiver has recently answered a request. An open socket alone does not count. `SettingsConfirmed` is `False` with reason `NotConfirmed` while a declared setting or zone control has been sent 3 times at its declared value and the receiver still reports another value. Its message lists each such field by its path in the spec. The condition is absent otherwise. `InputSelected` is present while a session exists. It is `True` with reason `SessionInput` while the receiver reports the session's input, `False` with reason `OtherInput` while it reports another input, and `Unknown` with reason `Unreachable` or `NoInputReported` while the operator cannot reach the receiver or the receiver has reported no input."
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: >-
                          The condition's type, in CamelCase, such as
                          Reachable. It is the key of this list.
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                        description: >-
                          The condition's status. True is the healthy status,
                          and Unknown means the operator cannot tell yet.
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                        description: >-
                          The metadata.generation that this condition
                          reflects.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: >-
                          One CamelCase word for why the condition has this
                          status, for a program to match on.
                      message:
                        type: string
                        maxLength: 32768
                        description: >-
                          The same reason, as a sentence for a person to read.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: >-
                          When the status last changed. A change of the reason
                          or the message alone does not move it.
