# The kustomize base for the equipment operator.
#
# This base is for the cluster owner to take. liken does not apply it
# and does not name it. Take it through your own GitOps with patches
# of your own, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liken-system

# kustomize stamps the namespace below onto the DeviceClass too,
# because resource.k8s.io/v1 is not in its compiled OpenAPI schema and
# an unknown kind is treated as namespaced. The stamp is harmless: the
# API server ignores a namespace on a cluster-scoped object.
resources:
  - receivers-crd.yaml
  - cecbuses-crd.yaml
  - deviceclasses.yaml
  - rbac.yaml
  - operator.yaml
  - cec.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: equipment-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/equipment-operator
    newTag: latest
