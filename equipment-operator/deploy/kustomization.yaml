# The kustomize base for the equipment operator.
#
# This base is for the cluster owner to take. liken does not apply it
# and does not name it. Take it through your own GitOps with patches
# of your own, or read it and write your own manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: liken-system

resources:
  - receivers-crd.yaml
  - rbac.yaml
  - operator.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: equipment-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/equipment-operator
    newTag: latest
