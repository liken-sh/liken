# The kustomize base for equipment-operator. Nothing in liken applies
# it. You apply it with your own patches, or read it and write your own
# manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The NamespaceTransformer with unsetOnly sets liken-system only on
# objects that have no namespace. The top-level namespace field would
# overwrite every namespace, and because Flux merges a Kustomization's
# components into this file, it would move the monitoring component's
# dashboard out of the monitoring namespace.
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: liken-system
      namespace: liken-system
    unsetOnly: true

# kustomize also sets the namespace on the DeviceClass, because
# resource.k8s.io/v1 is not in its built-in OpenAPI schema and it treats
# an unknown kind as namespaced. The API server ignores a namespace on a
# cluster-scoped object.
resources:
  - receivers-crd.yaml
  - cecbuses-crd.yaml
  - televisions-crd.yaml
  - deviceclasses.yaml
  - rbac.yaml
  - operator.yaml
  - cec.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: equipment-operator
      app.kubernetes.io/part-of: liken

images:
  - name: ghcr.io/liken-sh/equipment-operator
    newTag: latest
