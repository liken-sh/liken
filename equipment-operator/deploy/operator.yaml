# The operator itself: one unprivileged Deployment for the cluster,
# in the shape of the media operator and not the hardware operators'
# DaemonSets.
#
# A receiver answers over the network, so the pod holds no hardware and
# runs on any node. It does share the node's network namespace, because
# finding a device is link-local multicast: a pod on the overlay gets
# no answer to an mDNS or SSDP search, and discovery would find nothing.
#
# There is no volume for state. The operator re-derives everything
# from the API server on every pass.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: equipment-operator
  # Recreate, so two copies never reconcile at once. Two operators
  # would agree on every derived status, but each write they raced
  # would surface as a conflict for one of them to report.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: equipment-operator
    spec:
      serviceAccountName: equipment-operator
      # The operator shares the node's network namespace so its mDNS and
      # SSDP searches reach the LAN. A policy that keeps the cluster's
      # own DNS is what still resolves the broker and a declared
      # equipment name from this namespace.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: operator
          image: ghcr.io/liken-sh/equipment-operator:latest
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The broker the operator reads a session's volume from.
            # The operator cannot derive the Service name, so the
            # manifest states it.
            - name: EQUIPMENT_BUS_ADDRESS
              value: bus.liken-system.svc:1883
            # Host network moves the listener into the node's namespace,
            # where port 9200 is already liken-machine-operator's. This
            # operator takes 9260, the next free port in the series that
            # bluetooth-operator also took one from. The deploy/monitoring
            # component is what a cluster owner adds to scrape it; the
            # base runs the same either way.
            - name: EQUIPMENT_METRICS_ADDRESS
              value: :9260
          ports:
            - name: metrics
              containerPort: 9260
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
