# One unprivileged Deployment for the whole cluster. The operator
# reaches receivers over the network, so the pod uses no hardware and
# can run on any node. It keeps no state of its own and has no volume.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: equipment-operator
spec:
  # replicas: 2 is safe. Each replica must take the Lease
  # `equipment-operator` before it does anything (leader.go), and one
  # that waits binds no port, searches for no device, and opens no
  # receiver session. For a host-network pod the API server sets a
  # hostPort on each declared port, so the scheduler puts the second
  # replica on another node, or leaves it Pending on a one-node cluster.
  replicas: 1
  selector:
    matchLabels:
      app: equipment-operator
  # Recreate, because a RollingUpdate starts the new pod before it stops
  # the old one, and on a one-node cluster the new pod would stay
  # Pending on the same hostPort 9260. The Lease still keeps a second
  # pod inactive when a node partition or a higher replica count starts
  # one.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: equipment-operator
    spec:
      serviceAccountName: equipment-operator
      # The host network, because a pod on the overlay network gets no
      # answer to the link-local multicast of an mDNS or SSDP search.
      # ClusterFirstWithHostNet keeps the cluster DNS, so the pod can
      # still resolve the hostname of a declared piece of equipment.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: operator
          image: ghcr.io/liken-sh/equipment-operator:latest
          env:
            # The pod's name is its identity in the Lease, which is in
            # the pod's namespace. The operator exits when either is
            # unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # On the host network, port 9200 belongs to
            # `liken-machine-operator`, so this operator serves metrics
            # on 9260. Add the deploy/monitoring component to scrape it.
            - name: EQUIPMENT_METRICS_ADDRESS
              value: :9260
            # Network discovery creates a Receiver for each WiiM amp on
            # the LAN that no Receiver names, so the operator controls
            # every amp it finds. When the LAN has amps that it must not
            # control, set this to "off" with a patch, as the install
            # guide shows. The quotes stop a YAML 1.1 parser from
            # reading on and off as booleans. The operator exits at start
            # on any value other than on or off.
            - name: EQUIPMENT_NETWORK_DISCOVERY
              value: "on"
          ports:
            - name: metrics
              containerPort: 9260
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
