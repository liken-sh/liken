# The operator's identity in the cluster, and deliberately little
# more. It reads every Receiver, writes each one's status, and owns
# one spec field, power, which it flips when the room's remote toggles
# the equipment.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equipment-operator
---
# A ClusterRole and not a Role, because a Receiver is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: equipment-operator
rules:
  # The receivers. The watch is the wake signal; every pass re-reads
  # with a list. patch lets this operator own spec.power through
  # server-side apply, whose body states that one field and nothing
  # else. No create and no delete: a person declares a Receiver, and
  # this operator only reads one.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers]
    verbs: [get, list, watch, patch]
  # The status half, written with its own patch. The API server's
  # subresource split keeps the status write out of the spec, and the
  # operator's apply body states spec.power alone, so no other declared
  # spec field is ever in an apply.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: equipment-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: equipment-operator
subjects:
  - kind: ServiceAccount
    name: equipment-operator
    namespace: liken-system
