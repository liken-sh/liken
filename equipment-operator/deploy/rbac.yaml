# RBAC for equipment-operator's Deployment, which runs as
# `equipment-operator`, and for the DaemonSet of the CEC node workload
# in cec.yaml, which runs as `equipment-operator-cec` at the end of this
# file. Each workload deletes only the objects that its own discovery
# created, which carry the `discovered` label.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equipment-operator
---
# A ClusterRole, because Receivers, CECBuses, and Televisions are
# cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: equipment-operator
rules:
  # patch sets spec.power with server-side apply. The apply body has
  # only that field, so the operator owns no other spec field. create
  # and delete are for network discovery, which creates a Receiver for
  # an amp that no Receiver names.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers]
    verbs: [get, list, watch, patch, create, delete]
  - apiGroups: [equipment.liken.sh]
    resources: [receivers/status]
    verbs: [get, patch, update]
  # The Deployment writes status.devices and the conditions of each
  # CECBus from the entries that the node workload writes under
  # status.adapters.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses]
    verbs: [get, list, watch]
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses/status]
    verbs: [get, patch]
  # The Deployment writes the status that it derives from each
  # Television's CECBus, and status.session. It creates a Television,
  # named after the bus, when a CECBus in Control mode finds a TV that
  # no Television names. It deletes that Television when another
  # Television names the same bus.
  - apiGroups: [equipment.liken.sh]
    resources: [televisions]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [equipment.liken.sh]
    resources: [televisions/status]
    verbs: [get, patch]
  # A Television's status lists the Displays connected to it, which the
  # operator finds from the CEC physical address that display-operator
  # writes on each Display.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch]
  # The API server accepts an Event about a cluster-scoped object only
  # in the default or kube-system namespace, so the Events go to
  # default. A ClusterRole grants this, so the grant still covers
  # default when the operator is installed in another namespace. patch
  # updates the count of an Event that repeats.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: equipment-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: equipment-operator
subjects:
  - kind: ServiceAccount
    name: equipment-operator
    namespace: liken-system
---
# The Lease for leader election among the Deployment's replicas
# (leader.go). A namespaced Role, because a ClusterRole would also allow
# reading the kubelets' Leases in kube-node-lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: equipment-operator-lease
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [equipment-operator]
    verbs: [get, update]
  # RBAC cannot match a name on a create request.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: equipment-operator-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: equipment-operator-lease
subjects:
  - kind: ServiceAccount
    name: equipment-operator
    namespace: liken-system
---
# The Deployment and each node workload pod watch the pods of the CEC
# node workload, and use an adapter's entry in a CECBus status only
# while the pod on that adapter's machine is Ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: equipment-operator-cec-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: equipment-operator-cec-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: equipment-operator-cec-pods
subjects:
  - kind: ServiceAccount
    name: equipment-operator
    namespace: liken-system
  - kind: ServiceAccount
    name: equipment-operator-cec
    namespace: liken-system
---
# The CEC node workload has its own identity, so a pod on an adapter's
# machine can reach only CECBuses, Televisions, Displays, Events, and
# the pods of the node workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equipment-operator-cec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: equipment-operator-cec
rules:
  # create is for the CECBus in Listen mode that a pod creates for an
  # adapter that no CECBus lists. delete removes that CECBus when a
  # person's CECBus lists the same machine. The current pods never patch
  # a CECBus. patch serves pods of an earlier release, which applied the
  # CECBus, while they run beside the new pods during a rollout.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses]
    verbs: [get, list, watch, patch, create, delete]
  # The pod writes its machine's entry under status.adapters.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses/status]
    verbs: [get, patch]
  # In Control mode the adapter announces the CEC physical address that
  # display-operator writes on the Display. The pod watches the Displays
  # on its machine with a field selector, and RBAC cannot limit a list
  # or a watch by a field, so the grant covers every Display.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch]
  # The pod sends the CEC commands that a Television's spec.power and
  # status.session request, and writes their results to the status:
  # powerGeneration, wokeAt, standbyAt, powerRead, screenAsk, and their
  # conditions.
  - apiGroups: [equipment.liken.sh]
    resources: [televisions]
    verbs: [get, list, watch]
  - apiGroups: [equipment.liken.sh]
    resources: [televisions/status]
    verbs: [get, patch]
  # Events go to the default namespace, as in the Deployment's
  # ClusterRole.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: equipment-operator-cec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: equipment-operator-cec
subjects:
  - kind: ServiceAccount
    name: equipment-operator-cec
    namespace: liken-system
