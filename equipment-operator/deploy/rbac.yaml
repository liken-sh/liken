# The identities of the operator's two workloads. The Deployment reads
# every Receiver, writes each one's status, owns one spec field
# (power), and creates and deletes the Receivers discovery makes for
# amps no person has claimed. It never creates a Receiver for a wired
# protocol or one a person declared: discovery defers to a claimed
# identity and prunes only the objects that carry its own marker label.
# It also derives each CECBus's and each Television's status, and
# creates and deletes the Televisions its own discovery makes. The CEC
# node workload has its own identity, at the end of this file.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equipment-operator
---
# A ClusterRole and not a Role, because a Receiver is cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: equipment-operator
rules:
  # The receivers. The watch is the wake signal; every pass re-reads
  # with a list. patch lets this operator own spec.power through
  # server-side apply, whose body states that one field and nothing
  # else, and it creates and deletes the Receivers discovery owns. It
  # creates only for an amp no Receiver claims and deletes only an
  # object carrying its own marker label, so a person's Receiver is
  # never created over and never deleted. No create on receivers/status:
  # status travels through patch alone.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers]
    verbs: [get, list, watch, patch, create, delete]
  # The status half, written with its own patch. The API server's
  # subresource split keeps the status write out of the spec, and the
  # operator's apply body states spec.power alone, so no other declared
  # spec field is ever in an apply.
  - apiGroups: [equipment.liken.sh]
    resources: [receivers/status]
    verbs: [get, patch, update]
  # The CEC buses. The Deployment reads every CECBus and writes each
  # one's status.devices and conditions, which it derives from the
  # adapters' entries. It never writes a CECBus spec.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses]
    verbs: [get, list, watch]
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses/status]
    verbs: [get, patch]
  # The Televisions. The Deployment writes each one's status: the TV's
  # facts and power from its CECBus, the last active source, the
  # Displays that reach it, the Reachable and InCharge conditions, and
  # the Receiver session that uses the TV. create is for the Television
  # it makes, under the bus's name, for a TV that a CECBus in Control
  # finds and no Television names. delete removes that Television when
  # another Television names the same bus. It deletes only a Television
  # that carries the discovered label and has its bus's name. It never
  # writes a Television spec.
  - apiGroups: [equipment.liken.sh]
    resources: [televisions]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [equipment.liken.sh]
    resources: [televisions/status]
    verbs: [get, patch]
  # A Television lists the Displays whose pictures reach it, from the
  # physical address display-operator publishes on each Display. The
  # watch wakes the CECBus loop when that address moves.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: equipment-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: equipment-operator
subjects:
  - kind: ServiceAccount
    name: equipment-operator
    namespace: liken-system
---
# The CEC node workload's identity, apart from the Deployment's, so the
# pod on an adapter's machine can reach only the CECBus and Television
# objects and the Displays it reads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: equipment-operator-cec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: equipment-operator-cec
rules:
  # The watch wakes the pod when a person edits a CECBus. patch and
  # create are for the CECBus the pod makes in Listen for an adapter no
  # CECBus names, and delete removes that CECBus when a person's
  # CECBus names the same machine. The pod deletes only a CECBus that
  # carries the discovered label and names its own machine.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses]
    verbs: [get, list, watch, patch, create, delete]
  # The pod writes its own machine's entry under status.adapters, under
  # a field manager named after the machine.
  - apiGroups: [equipment.liken.sh]
    resources: [cecbuses/status]
    verbs: [get, patch]
  # In Control the adapter announces the physical address that
  # display-operator publishes on the named Display. The watch wakes the
  # pod when that address changes.
  - apiGroups: [display.liken.sh]
    resources: [displays]
    verbs: [get, list, watch]
  # The watch wakes the pod when a person changes a Television's
  # spec.power or the Deployment changes its status.session. The pod
  # whose adapter sends the bus's commands applies spec.power and writes
  # status.powerGeneration and the PowerApplied condition, under a field
  # manager named after the machine. The pod whose adapter speaks for
  # the session's Display runs the wake and writes status.wokeAt and the
  # WakeApplied condition, under a second field manager named after the
  # machine. The pod whose adapter sends the bus's commands answers a
  # power press's read in status.powerRead, under a third. It never
  # writes a Television spec.
  - apiGroups: [equipment.liken.sh]
    resources: [televisions]
    verbs: [get, list, watch]
  - apiGroups: [equipment.liken.sh]
    resources: [televisions/status]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: equipment-operator-cec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: equipment-operator-cec
subjects:
  - kind: ServiceAccount
    name: equipment-operator-cec
    namespace: liken-system
