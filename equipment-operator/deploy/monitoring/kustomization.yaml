# Optional monitoring for the operator: a PodMonitor and a Grafana
# dashboard ConfigMap. It changes nothing in the base, so a cluster
# without the prometheus-operator can leave it out. A cluster that runs
# the prometheus-operator adds it beside the base:
#
#   resources:
#     - https://github.com/liken-sh/liken//equipment-operator/deploy?ref=<version>
#   components:
#     - https://github.com/liken-sh/liken//equipment-operator/deploy/monitoring?ref=<version>
#
# This Component sets no top-level namespace, because that would also
# move the dashboard ConfigMap into liken-system, where the
# kube-prometheus-stack sidecar that loads dashboards does not look.
# The PodMonitor sets its own namespace.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - podmonitor.yaml

# The kube-prometheus-stack's Grafana sidecar loads every ConfigMap
# labeled grafana_dashboard: "1". disableNameSuffixHash keeps the name
# fixed, so an edit replaces the ConfigMap. With a hash suffix, each
# edit creates a ConfigMap with a new name, and an apply that does not
# prune leaves the old one, so Grafana loads both versions.
configMapGenerator:
  - name: equipment-operator-dashboard
    namespace: monitoring
    files:
      - dashboards/equipment-operator.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
