# Scrapes the Deployment's pod. The cec DaemonSet's pods have no
# metrics port. The relabeling adds the pod's node name as the label
# node, because the pod can run on any node.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: equipment-operator
  namespace: liken-system
spec:
  selector:
    matchLabels:
      app: equipment-operator
  podMetricsEndpoints:
    - port: metrics
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
