# The CEC node workload: one pod on each machine that carries a USB
# CEC adapter, from the operator's own image. The pod runs the image's
# node build, /equipment-operator-node, with the argument cec. That
# build leaves out the leader election that only the Deployment needs
# (leader_node.go), so each node runs a program of about half the size.
# The pod holds the adapter, runs it in the mode its CECBus states,
# and writes its own entry under that CECBus's status. The Deployment
# in operator.yaml derives the rest of the status. plans/completed/09-cec.md
# gives the design.
---
# The adapter claim. A template rather than a plain claim, so each
# node's pod allocates that node's own adapter. On a node with an
# adapter the claim matches one device and the pod runs. On a node
# with none the claim matches zero devices and the pod stays Pending,
# which is how a DaemonSet runs a pod only where an adapter is. Nobody
# writes down which machine has the adapter. A node labeled
# equipment.liken.sh/cec: none gets no pod at all (the affinity below).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cec-adapter
spec:
  spec:
    devices:
      requests:
        - name: adapter
          exactly:
            deviceClassName: cec-adapter
---
# A DaemonSet, one pod per node. The pod needs no host network, no
# message bus, and no receiver credentials: it speaks to the adapter
# through its device node and to the API server through its
# ServiceAccount.
#
# RollingUpdate with maxSurge 0, because the adapter allocates to one
# claim at a time. A new pod that claimed the same adapter would stay
# Pending until the old pod released it, and an update that started
# the new pod first would never finish.
#
# maxUnavailable 100%, because each node holds its own adapter and no
# node's pod stands in for another's. A pod on a node with no adapter
# stays Pending for good, and the DaemonSet counts it as unavailable
# for good. With a smaller budget those Pending pods use all of it, and
# the controller never replaces the running pod on the adapter's node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: equipment-operator-cec
spec:
  selector:
    matchLabels:
      app: equipment-operator-cec
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  template:
    metadata:
      # The Deployment and every pod of this DaemonSet watch the pods
      # with this label, to tell whether an adapter's entry is current
      # (cecpods.go).
      labels:
        app: equipment-operator-cec
    spec:
      serviceAccountName: equipment-operator-cec
      # A node labeled equipment.liken.sh/cec: none gets no pod. The
      # claim alone leaves a pod on a node with no CEC adapter Pending
      # for good, so a person marks such a node with that one label.
      # NotIn also matches a node with no such label, so with no
      # label the DaemonSet makes a pod on every node, and the claim
      # decides where it can start. A patch that sets its own node
      # affinity replaces this list of terms, because the list is
      # atomic.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: equipment.liken.sh/cec
                    operator: NotIn
                    values: ["none"]
      # A machine that drives a screen carries a NoSchedule taint, such
      # as media.liken.sh/player, and a TV is connected to exactly such
      # a machine. The pod tolerates every taint, as liken's other
      # hardware DaemonSets do, and its claim alone decides where it
      # runs.
      tolerations:
        - operator: Exists
      containers:
        - name: cec
          image: ghcr.io/liken-sh/equipment-operator:latest
          command: ["/equipment-operator-node", "cec"]
          env:
            # liken names each node after its Machine, and a CECBus
            # names the Machine that carries an adapter, so the node
            # name is how the pod finds its own entries.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The namespace holds the pods of every node workload, which
            # the pod watches to tell whether another adapter's entry is
            # current.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CEC_PROBE_ADDRESS
              value: ":9200"
          ports:
            - name: probe
              containerPort: 9200
          # Each probe asks the loop of the node workload to answer, and
          # the handler waits two seconds for it (cecnode_probe.go). A
          # pod that lost readiness after its last entry makes the entry
          # stale, so the Deployment stops counting the adapter's report.
          #
          # The readiness probe runs every 20 seconds and fails after 3
          # misses, so a loop that stops answering makes its entry stale
          # after about 60 seconds. A pass can block the loop for longer
          # than a few seconds and still be working: one request to the
          # API server can take 30 seconds, and a change of mode waits
          # for a join scan, which gives a silent address several
          # one-second tries. 60 seconds covers one such request and a
          # scan. The window is also cecStartupGrace in cecpods.go, the
          # time a new pod's entry stays current before the pod is
          # Ready, and a test keeps the two equal.
          readinessProbe:
            httpGet:
              path: /healthz
              port: probe
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # The liveness probe restarts the container after 5 misses 30
          # seconds apart, about 150 seconds. That is clearly longer than
          # the readiness probe, because a restart does not repair an API
          # server that answers slowly, and a loop that waits on one
          # should lose only its readiness. The start of the node
          # workload lists the API server before the loop answers, and
          # the window covers that list too.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            # One capability. The kernel lets a process open a CEC
            # adapter as a monitor only with CAP_NET_ADMIN, and Listen is
            # a monitor. Control needs no capability: a pod with none
            # claimed the adapter, joined the bus, and scanned it in a
            # drill. A cluster owner who never runs a bus in Listen can
            # patch the capability out, and the adapter's entry then
            # reports the kernel's refusal.
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
            # The adapter, claimed from liken. The claim delivers
            # /dev/cecN and no other node.
            claims:
              - name: adapter
      resourceClaims:
        - name: adapter
          resourceClaimTemplateName: cec-adapter
