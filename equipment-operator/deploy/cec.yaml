# The CEC node workload: one pod on each machine that has a USB CEC
# adapter. The pod claims the adapter, runs it in the mode that the
# machine's CECBus sets, and writes the machine's entry under that
# CECBus's status.adapters. The Deployment in operator.yaml writes the
# rest of the status. The pod runs the node build of the operator's
# image, which leaves out leader election (leader_node.go).
---
# A template, so that each pod gets its own claim for the adapter on
# its own node. On a node without an adapter the claim matches no
# device and the pod stays Pending, so nobody has to list the machines
# that have one.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: cec-adapter
spec:
  spec:
    devices:
      requests:
        - name: adapter
          exactly:
            deviceClassName: cec-adapter
---
# maxSurge is 0 because an adapter can be allocated to only one claim
# at a time. A new pod started before the old one stopped would stay
# Pending, and the update would never finish.
#
# maxUnavailable is 100% because the DaemonSet counts the Pending pods
# on nodes with no adapter as unavailable. With a smaller limit, those
# pods would use up the whole budget, and the controller would never
# replace the pod on an adapter's node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: equipment-operator-cec
spec:
  selector:
    matchLabels:
      app: equipment-operator-cec
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  template:
    metadata:
      # The Deployment and every pod of this DaemonSet watch pods with
      # this label to decide whether an adapter's entry is current
      # (cecpods.go).
      labels:
        app: equipment-operator-cec
    spec:
      serviceAccountName: equipment-operator-cec
      # A person labels a node `equipment.liken.sh/cec: none` to remove
      # the Pending pod from a node with no adapter. NotIn also matches
      # a node without the label, so by default every node gets a pod.
      # A patch that sets its own node affinity replaces this whole list
      # of terms, because the list is atomic.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: equipment.liken.sh/cec
                    operator: NotIn
                    values: ["none"]
      # A TV is connected to a machine that drives a screen, and such a
      # machine has a NoSchedule taint such as `media.liken.sh/player`.
      # The pod tolerates every taint, so only its claim decides where
      # it runs.
      tolerations:
        - operator: Exists
      containers:
        - name: cec
          image: ghcr.io/liken-sh/equipment-operator:latest
          command: ["/equipment-operator-node", "cec"]
          env:
            # `liken` names each node after its Machine, and a CECBus
            # lists its adapters by Machine, so the pod finds its own
            # CECBus by the node name.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CEC_PROBE_ADDRESS
              value: ":9200"
          ports:
            - name: probe
              containerPort: 9200
          # The probe handler waits up to cecProbeWait, 2 seconds, for
          # the node workload's loop to respond (cecnode_probe.go). When
          # the pod is not Ready, the Deployment ignores its adapter's
          # entry.
          #
          # 20 seconds times 3 failures makes a 60-second window, which
          # covers a busy loop that is still working: one API server
          # request can take 30 seconds, and a mode change waits for a
          # join scan that retries a silent address at 1-second
          # intervals. cecStartupGrace in cecpods.go must equal this
          # window, and nodeaffinity_test.go checks that it does.
          readinessProbe:
            httpGet:
              path: /healthz
              port: probe
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # The liveness window, 150 seconds, is much longer than the
          # readiness window, because a restart does not fix a slow API
          # server. A loop that waits for one loses only its readiness.
          # The window also covers the list that the node workload reads
          # from the API server at start, before its loop responds.
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            # Listen mode puts the adapter in the kernel's CEC monitor
            # mode, which needs CAP_NET_ADMIN. A cluster owner who never
            # runs a bus in Listen mode can patch the capability out. A
            # bus in Listen mode then reports the kernel's refusal in
            # the adapter's entry.
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
            # The claim gives the container the adapter's /dev/cecN and
            # no other device node.
            claims:
              - name: adapter
      resourceClaims:
        - name: adapter
          resourceClaimTemplateName: cec-adapter
