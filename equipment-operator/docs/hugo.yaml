# The manual of equipment-operator. The theme is brand/ at the top of
# this repository, which every `liken` site uses.
baseURL: https://liken.sh/equipment/

# crdref writes a raw HTML span with an id on each field's row of the
# reference pages, so that a link can point to one field. Goldmark drops
# raw HTML unless this is set. It is safe because all the content of
# this site is in this repository.
markup:
  goldmark:
    renderer:
      unsafe: true
title: equipment-operator
# The repository root holds brand/, so the site builds with the theme
# from the same commit.
themesDir: ../..
theme: brand

# The theme's navigation links to this URL, and the sidebar uses its
# last segment as the project's name.
params:
  repository: https://github.com/liken-sh/liken/tree/main/equipment-operator
  # Adds a footer link on every page to the coverage report, which the
  # site serves at /coverage.html.
  coverage: true

# The site is a manual, so it has no taxonomies or feeds. The sitemap
# stays for crawlers.
disableKinds: [taxonomy, term, rss]

# The theme writes each page as HTML and also as its authored Markdown,
# for agents and scripts, only when the site declares this output
# format (brand/theme.md).
outputFormats:
  markdown:
    # Hugo defines text/markdown with the md suffix, so the Markdown
    # version of / is /index.md, next to index.html.
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [html, markdown]
  section: [html, markdown]
  page: [html, markdown]

# The site serves the files of deploy/ as raw YAML at
# /deploy/<file>.yaml, so `kubectl apply -f` and a Kustomization can use
# the URLs, and an install needs no clone. Declaring a mount replaces
# the site's default mounts, so the content mount is declared again.
# The theme's own mounts are not affected.
module:
  mounts:
    - source: content
      target: content
    - source: ../deploy
      target: static/deploy
