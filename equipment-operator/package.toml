# The operator that controls a room's equipment: receivers, and the TVs
# on a CEC bus.
[package]
name = "equipment-operator"
license = "MIT"

[depends]
components = ["kubernetes"]

[docs]
prefix = "equipment"

# gofmt, vet, the race tests, and the coverage gate on its pinned
# toolchain. The Makefile says why the gate pins a toolchain, and
# .testcoverage.yml holds the floor.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]

# The link check, the generated skills, and the site build.
[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

[outputs]
deploy = "deploy"

# The image builds from this module's go.mod, which replaces the shared
# kubernetes module with ../kubernetes, so it takes that directory as a
# build context.
[[outputs.images]]
name = "equipment-operator"
file = "Dockerfile"
contexts = { kubernetes = "kubernetes" }
