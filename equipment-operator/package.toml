# The operator that controls A/V receivers and the TVs on a CEC bus.
[package]
name = "equipment-operator"
license = "MIT"

[depends]
components = ["kubernetes", "notices", "toolchains"]

[docs]
prefix = "equipment"

# make test-go runs gofmt, go vet, the go.mod tidy check, and the tests
# with the race detector, and then checks coverage against
# .testcoverage.yml.
[[jobs]]
name = "go"
toolchain = "go"
run = "make test-go"
timeout = 20
coverage = ["coverage.out"]

[[jobs]]
name = "docs"
toolchain = "hugo"
module = "docs"
run = "make test-docs"

[[jobs]]
name = "prek"
toolchain = "prek"
# The go job already runs these checks.
skip = ["gofmt", "go-vet", "go-mod-tidy"]

[outputs]
deploy = "deploy"

# go.mod replaces the shared kubernetes module with ../kubernetes, so
# the image build needs that directory as a build context.
[[outputs.images]]
name = "equipment-operator"
description = "equipment-operator, which controls a TV over HDMI-CEC and an A/V receiver over the network."
file = "Dockerfile"
contexts = { kubernetes = "kubernetes", notices = "notices" }
