# Kind knowledge that `transect` reads for the `Receiver` of
# `equipment-operator`.  `Reachable` reports health because it is
# `True` only while the receiver answers the operator, and a `Player`
# that plays through the receiver needs those answers to control its
# power, input, and volume.  Its reason `Connecting` appears before the
# first answer.
apiVersion: transect.liken.sh/v1alpha1
kind: KindKnowledge
metadata:
  name: receivers.equipment.liken.sh
spec:
  summary: An A/V receiver that a `liken` machine plays through, with its power, input, and volume.
  healthy: {condition: Reachable}
  controller: {image: liken-sh/equipment-operator}
