# The file that trust/fetch.sh downloads, for the fetch and for the
# SBOM of a release. trust/latest.sh --bump writes the version, url,
# sha256, and purl, and toolchains/pin.sh describes each field. The
# trust image's Dockerfile fetches the same file by its checksum, and
# `ci pins` fails when its URL or digest differs from this entry.

# Mozilla's CA certificates, as curl publishes them. The data is
# Mozilla's, under the MPL 2.0, which the image's copyright file
# quotes. The type is library, because the bundle is data that the TLS
# libraries load, and syft drops a component of the type data from an
# image's SBOM. NVD lists no CPE for the bundle.
[cacert]
version = "2026-11-05"
url = "https://curl.se/ca/cacert-2026-11-05.pem"
sha256 = "427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285"
purl = "pkg:generic/cacert@2026-11-05?download_url=https://curl.se/ca/cacert-2026-11-05.pem&checksum=sha256:427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285"
license = "MPL-2.0"
type = "library"
