# The trust store: the CA certificates that liken trusts, from the
# Mozilla CA program as curl.se publishes it. The OS build reads the
# pin in VERSION through fetch.sh, and every image that verifies TLS
# copies the bundle from the trust image, so one bump reaches all of
# them.
[package]
name = "trust"
# The date of the curl.se snapshot, as YYYYMMDD. VERSION holds the same
# date as curl names it, and the Dockerfile fetches that snapshot by
# its checksum. latest.sh --bump writes all three, and the smoke check
# fails when they disagree.
version = "20261020"
revision = 3
license = "MIT"

[package.upstream]
mozilla-ca = "2026-10-20"

# The image writes its SBOM record with image-sbom, which builds from
# toolchains/manifest on the Go image of toolchains.
[depends]
components = ["toolchains"]

# shellcheck and the whitespace checks, from .pre-commit-config.yaml.
[[jobs]]
name = "prek"
toolchain = "prek"

[[outputs.images]]
name = "trust"
description = "Mozilla's CA bundle, in the form curl publishes it, at the path where OpenSSL, GnuTLS, libcurl, and Go read it."
contexts = { manifest = "toolchains/manifest" }
smoke = "trust/smoke/trust.sh"
